name: web

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  # By hand, to render the Linux visual baselines (the `e2e` job).
  workflow_dispatch:
    inputs:
      update-visual-baselines:
        description: Render the @visual screenshots and upload them as the visual-baselines-linux artifact
        type: boolean
        default: false

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  # The Playwright suite (`web/docs/12-testing-linting-ci.md` §3.6): one real
  # server with fixture providers, a temp data directory and the test-only
  # sign-in route, serving a client build through its own static middleware.
  # `npm run test:e2e` runs only the Chromium project; WebKit is best-effort
  # and opt-in (`npm run test:e2e:webkit`).
  #
  # The job runs in Playwright's image, whose tag must equal the
  # `@playwright/test` version in web/package-lock.json (checked below): its
  # browser build, fonts and system libraries are fixed, so the `@visual`
  # screenshots render the same on every run, and the baselines in
  # web/e2e/__screenshots__/linux/ are this job's renders. To regenerate them
  # after an intended change (or a Playwright upgrade), run this workflow by
  # hand on the branch (Actions > web > Run workflow) with
  # `update-visual-baselines` checked, download the `visual-baselines-linux`
  # artifact and commit its files to web/e2e/__screenshots__/linux/.
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      # The container's network has no IPv6, so the server binds the IPv4
      # loopback (`web/e2e/constants.ts`, `E2E_HOST`).
      SESSION_E2E_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # better-sqlite3 compiles from source during `npm ci`, and the image has
      # no make or C++ compiler.
      - name: Install the build tools for better-sqlite3
        run: apt-get update && apt-get install -y --no-install-recommends make g++
      - run: npm ci
      - name: Check that the image matches the locked Playwright version
        run: test "$(npx playwright --version)" = "Version 1.63.0"
      # GitHub sets CI=true, which is what turns on retries, traces, the HTML
      # report and a fresh server per run (`web/playwright.config.ts`).
      - if: ${{ !inputs.update-visual-baselines }}
        run: npm run test:e2e
      - if: ${{ inputs.update-visual-baselines }}
        run: npm run test:e2e -- --grep @visual --update-snapshots=all
      - if: ${{ inputs.update-visual-baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: web/e2e/__screenshots__/linux
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  # The image is built on every run so a Dockerfile change cannot break a
  # deploy unnoticed; it is never pushed. `flyctl deploy --remote-only` builds
  # it again on Fly's builder, used for deployment.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual approval: the `production` environment holds FLY_API_TOKEN and its
  # reviewers. One machine with a volume deploys with `strategy = "immediate"`,
  # so the old process drains and exits before the new one boots
  # (`web/docs/13-deployment-fly.md` §2, §5).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, test, e2e, docker]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-session-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The positional directory is the build context; without it flyctl would
      # hand Docker the repository root, where `package.json` is the desktop's.
      - run: flyctl deploy web --remote-only -c web/fly.toml
        working-directory: ${{ github.workspace }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
