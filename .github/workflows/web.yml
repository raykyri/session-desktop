name: web

on:
  push:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  # The Playwright suite (`web/docs/12-testing-linting-ci.md` §3.6): one real
  # server with fixture providers, a temp data directory and the test-only
  # sign-in route, serving a client build through its own static middleware.
  # Only Chromium is installed, and `npm run test:e2e` runs only that project;
  # WebKit is best-effort and opt-in (`npm run test:e2e:webkit`).
  #
  # The visual baselines are committed per platform, so the `@visual` test
  # skips itself on a runner that has none rather than failing. To add the
  # Linux set, run `npm run test:e2e:update-snapshots` on this image and commit
  # `web/e2e/__screenshots__/linux/`.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # GitHub sets CI=true, which is what turns on retries, traces, the HTML
      # report and a fresh server per run (`web/playwright.config.ts`).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore

  # The image is built on every run so a Dockerfile change cannot break a
  # deploy unnoticed; it is never pushed. `flyctl deploy --remote-only` builds
  # it again on Fly's builder, which is the one that matters.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual approval: the `production` environment holds FLY_API_TOKEN and its
  # reviewers. One machine with a volume deploys with `strategy = "immediate"`,
  # so the old process drains and exits before the new one boots
  # (`web/docs/13-deployment-fly.md` §2, §5).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, test, e2e, docker]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-session-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The positional directory is the build context; without it flyctl would
      # hand Docker the repository root, where `package.json` is the desktop's.
      - run: flyctl deploy web --remote-only -c web/fly.toml
        working-directory: ${{ github.workspace }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
