[package]
name = "session-cli"
version = "0.4.0"
description = "The session in-pane CLI: hook notifies, cwd reporting, forks, and agent supervision."
license = "MIT"
edition = "2024"

[[bin]]
name = "session-cli"
path = "src/bin/session-cli.rs"

[dependencies]
dirs = "6"
libc = "0.2"
session-proto = { path = "../session-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
