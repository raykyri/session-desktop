<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session · Shared-inbox style</title>
<!-- Influence: shared/team email inbox apps (Front, Missive, Superhuman, Hey). Round 2, slug "inbox". -->
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg:#f3f3f6; --nav-bg:#eeeef2; --panel:#ffffff; --list-bg:#fafafc; --raise:#ffffff;
  --border:#e2e2e8; --border-strong:#cfcfd8; --text:#1c1c21; --text-2:#55555f; --text-3:#8a8a95;
  --accent:#3e63dd; --accent-hover:#3456c7; --accent-weak:#e9eefc; --accent-text:#2c4cbf; --on-accent:#ffffff;
  --sel:#e4eafb; --hover:#e7e7ed; --row-hover:#f2f3f7; --focus:#3e63dd;
  --note-bg:#fff7d6; --note-border:#efd987; --note-text:#6a5300; --hl:#ffe680; --hl-strong:#ffd84a;
  --ok:#1b8f50; --ok-weak:#e3f4ea; --run:#3e63dd; --run-weak:#e9eefc; --warn:#a86a00; --warn-weak:#fbf0da;
  --muted-pill:#ececf1; --danger:#c8372d;
  --tag-orange:#d4660f; --tag-blue:#2e74d6; --tag-green:#22895a; --tag-purple:#7a4fd0;
  --av-claude:#c4643f; --av-codex:#2f7d6b; --av-grok:#3d3d47; --av-you:#6b6bd6;
  --shadow:0 12px 32px rgba(22,22,40,.16),0 2px 6px rgba(22,22,40,.08);
  --shadow-sm:0 1px 2px rgba(22,22,40,.06);
  --scrim:rgba(20,20,30,.28);
  --graph-edge:#c9c9d4;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151518; --nav-bg:#19191d; --panel:#1e1e22; --list-bg:#1b1b1f; --raise:#26262b;
    --border:#2c2c33; --border-strong:#3b3b44; --text:#ececf1; --text-2:#a8a8b3; --text-3:#767682;
    --accent:#7d95ff; --accent-hover:#93a7ff; --accent-weak:rgba(125,149,255,.15); --accent-text:#aebcff; --on-accent:#0f1530;
    --sel:rgba(125,149,255,.17); --hover:rgba(255,255,255,.06); --row-hover:rgba(255,255,255,.035); --focus:#93a7ff;
    --note-bg:rgba(255,214,10,.09); --note-border:rgba(255,214,10,.26); --note-text:#efd47a; --hl:rgba(255,214,10,.28); --hl-strong:rgba(255,214,10,.45);
    --ok:#46c987; --ok-weak:rgba(70,201,135,.13); --run:#8ea3ff; --run-weak:rgba(125,149,255,.14); --warn:#e6ad45; --warn-weak:rgba(230,173,69,.13);
    --muted-pill:#2a2a31; --danger:#ff7b72;
    --tag-orange:#f0914a; --tag-blue:#6aa5f5; --tag-green:#51c48f; --tag-purple:#a888f0;
    --av-claude:#c97452; --av-codex:#3c9a85; --av-grok:#585866; --av-you:#7f7fe6;
    --shadow:0 14px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4); --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --scrim:rgba(0,0,0,.5); --graph-edge:#44444e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151518; --nav-bg:#19191d; --panel:#1e1e22; --list-bg:#1b1b1f; --raise:#26262b;
  --border:#2c2c33; --border-strong:#3b3b44; --text:#ececf1; --text-2:#a8a8b3; --text-3:#767682;
  --accent:#7d95ff; --accent-hover:#93a7ff; --accent-weak:rgba(125,149,255,.15); --accent-text:#aebcff; --on-accent:#0f1530;
  --sel:rgba(125,149,255,.17); --hover:rgba(255,255,255,.06); --row-hover:rgba(255,255,255,.035); --focus:#93a7ff;
  --note-bg:rgba(255,214,10,.09); --note-border:rgba(255,214,10,.26); --note-text:#efd47a; --hl:rgba(255,214,10,.28); --hl-strong:rgba(255,214,10,.45);
  --ok:#46c987; --ok-weak:rgba(70,201,135,.13); --run:#8ea3ff; --run-weak:rgba(125,149,255,.14); --warn:#e6ad45; --warn-weak:rgba(230,173,69,.13);
  --muted-pill:#2a2a31; --danger:#ff7b72;
  --tag-orange:#f0914a; --tag-blue:#6aa5f5; --tag-green:#51c48f; --tag-purple:#a888f0;
  --av-claude:#c97452; --av-codex:#3c9a85; --av-grok:#585866; --av-you:#7f7fe6;
  --shadow:0 14px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.4); --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.5); --graph-edge:#44444e;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:5px}
kbd{font:500 10.5px/1 var(--font);color:var(--text-3);border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:4px;padding:2px 4px;background:var(--panel);min-width:16px;display:inline-block;text-align:center}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.i.sm{width:13px;height:13px}
.muted{color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* window */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.titlebar{height:42px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;background:var(--nav-bg);border-bottom:1px solid var(--border);position:relative}
.lights{display:flex;gap:8px;width:200px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.search-trigger{position:absolute;left:50%;transform:translateX(-50%);width:min(440px,46vw);height:27px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;border:1px solid var(--border);background:var(--panel);border-radius:7px;color:var(--text-3);box-shadow:var(--shadow-sm)}
.search-trigger span{flex:1}
.search-trigger:hover{border-color:var(--border-strong)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.icon-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text-2)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn[aria-pressed="true"]{background:var(--hover);color:var(--text)}
.agents-chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:13px;color:var(--text-2);font-size:12px}
.agents-chip:hover{background:var(--hover)}
.agents-chip .dots{display:inline-flex;gap:3px}.agents-chip .dots i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.only-m{display:none!important}

.body{flex:1;display:flex;min-height:0;position:relative}

/* nav */
.nav{width:224px;flex:none;background:var(--nav-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:10px 8px 8px;overflow:auto}
.ws-switch{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;width:100%}
.ws-switch:hover{background:var(--hover)}
.ws-av{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#4f6ef0,#7a4fd0);color:#fff;font-weight:650;font-size:11px;display:flex;align-items:center;justify-content:center;flex:none}
.ws-av.personal{background:linear-gradient(135deg,#22895a,#2e74d6)}
.ws-name{font-weight:620;font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compose-btn{margin:8px 0 10px;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:7px;background:var(--accent);color:var(--on-accent);font-weight:600;width:100%}
.compose-btn:hover{background:var(--accent-hover)}
.compose-btn kbd{margin-left:auto;background:transparent;color:inherit;border-color:rgba(255,255,255,.4);opacity:.85}
.nav-sec{margin-bottom:12px}
.nav-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;color:var(--text-3);padding:6px 8px 4px;letter-spacing:.02em}
.nav-h button{color:var(--text-3);border-radius:4px;display:inline-flex}
.nav-h button:hover{color:var(--text);background:var(--hover)}
.nav-item{display:flex;align-items:center;gap:9px;height:28px;padding:0 8px;border-radius:6px;width:100%;color:var(--text-2)}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item[aria-current="true"]{background:var(--sel);color:var(--text);font-weight:600}
.nav-item[aria-current="true"] .i{color:var(--accent)}
.nav-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .cnt{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.nav-item .badge{font-size:11px;font-weight:650;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center}
.nav-item .cnt.live{color:var(--run);display:inline-flex;align-items:center;gap:4px}
.tag-dot{width:8px;height:8px;border-radius:3px;flex:none;margin:0 4px}
.nav-foot{margin-top:auto;border-top:1px solid var(--border);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.nav-notes-d{display:none}
[data-variant="d"] .nav-knowledge{display:none}
[data-variant="d"] .nav-notes-d{display:block}

/* list column */
.list{width:340px;flex:none;background:var(--list-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.list-h{flex:none;padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.list-h h1{font-size:15px;margin:0;font-weight:680;letter-spacing:-.01em}
.list-h .sub{color:var(--text-3);font-size:12px}
.list-h .grow{flex:1}
.list-scroll{flex:1;overflow:auto;padding:4px 0 24px}
.quick-ask{display:none;margin:10px 12px 4px;border:1px solid var(--border-strong);border-radius:9px;background:var(--panel);padding:8px 10px;box-shadow:var(--shadow-sm)}
.quick-ask textarea{width:100%;border:0;background:none;resize:none;font-size:13px;height:38px;color:var(--text)}
.quick-ask .qa-bot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3)}
.quick-ask .qa-bot .grow{flex:1}
[data-variant="c"] .view-inbox .quick-ask{display:block}
.sec-h{display:flex;align-items:center;gap:6px;padding:12px 14px 4px;font-size:11px;font-weight:650;color:var(--text-3);letter-spacing:.03em;text-transform:uppercase;width:100%}
.sec-h:hover{color:var(--text-2)}
.sec-h .i{transition:transform .15s}
.sec-h[aria-expanded="false"] .i{transform:rotate(-90deg)}
.row{position:relative;display:flex;gap:10px;padding:10px 14px 10px 22px;cursor:pointer;border-bottom:1px solid var(--border);outline-offset:-2px}
.row:hover{background:var(--row-hover)}
.row.sel{background:var(--sel)}
.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.row .dot{position:absolute;left:9px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--accent);display:none}
.row.unread .dot{display:block}
.row-main{flex:1;min-width:0}
.row-top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.row-from{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.row-time{color:var(--text-3);font-size:11.5px;flex:none;font-variant-numeric:tabular-nums}
.row-subj{font-size:13px;color:var(--text);margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.unread .row-subj{font-weight:650}
.row-prev{font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.fork-of{display:inline-flex;align-items:center;gap:3px;color:var(--text-3);font-size:11.5px}
.row.compact-hide{}
/* avatars, pills, chips */
.av{width:28px;height:28px;border-radius:7px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:650;font-size:10.5px;letter-spacing:.01em}
.av.sm{width:18px;height:18px;font-size:8.5px;border-radius:5px}
.av-claude{background:var(--av-claude)}.av-codex{background:var(--av-codex)}.av-grok{background:var(--av-grok)}.av-you{background:var(--av-you);border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--muted-pill);color:var(--text-2);font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-weak);color:var(--ok)}
.pill.run{background:var(--run-weak);color:var(--run)}
.pill.q{background:var(--warn-weak);color:var(--warn)}
.pill.snz{background:var(--muted-pill);color:var(--tag-purple)}
.pill .pd{width:6px;height:6px;border-radius:50%;background:currentColor}
.spin{width:10px;height:10px;border-radius:50%;border:1.6px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.chip{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 7px;border-radius:5px;font-size:11px;color:var(--text-2);background:transparent;border:1px solid var(--border);white-space:nowrap}
.chip .tag-dot{margin:0;width:7px;height:7px;border-radius:2px}
button.chip:hover{border-color:var(--border-strong);color:var(--text)}
.mini{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--text-3)}

/* pane */
.pane{flex:1;min-width:0;background:var(--panel);display:flex;flex-direction:column;position:relative}
.pane-h{flex:none;padding:6px 16px 12px 20px;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start}
.pane-h.stack{flex-direction:column;gap:2px}
.pane-top{display:flex;align-items:center;gap:8px;min-height:34px;width:100%}
.pane-top .crumb{flex:1;min-width:56px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane-top .crumb q{color:var(--text-2)}
.pane-h .ttl{flex:1;min-width:0}
.crumb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3);margin-bottom:3px}
.crumb a,.crumb button{color:var(--accent-text);cursor:pointer;text-decoration:none}
.crumb button:hover{text-decoration:underline}
.pane-h h2{font-size:16.5px;line-height:1.3;margin:0;font-weight:680;letter-spacing:-.012em}
.pane-meta{display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:2px;flex:none}
.toolbar .sep{width:1px;height:18px;background:var(--border);margin:0 4px}
.tbtn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border-radius:6px;color:var(--text-2);font-size:12.5px}
.tbtn:hover{background:var(--hover);color:var(--text)}
.tbtn.primary{background:var(--accent);color:var(--on-accent);font-weight:600}
.tbtn.primary:hover{background:var(--accent-hover)}
.tbtn .lbl-wide{display:inline}
.pane-scroll{flex:1;overflow:auto;position:relative}
.thread{max-width:760px;margin:0 auto;padding:18px 24px 28px;display:flex;flex-direction:column;gap:12px}
.msg{border:1px solid var(--border);border-radius:10px;background:var(--raise);padding:14px 18px;box-shadow:var(--shadow-sm)}
.msg-h{display:flex;align-items:center;gap:10px}
.msg-h .who{flex:1;min-width:0;font-size:12.5px}
.msg-h .who b{font-weight:640}
.msg-h .to{font-size:11.5px;color:var(--text-3)}
.msg.ask{background:transparent;box-shadow:none;border-color:transparent;padding:6px 18px 2px}
.msg.ask .q{font-size:14.5px;font-weight:600;line-height:1.45;margin:6px 0 0 38px;color:var(--text)}
.msg.collapsed .ans-body,.msg.collapsed .srcs,.msg.collapsed .msg-f,.msg.collapsed .tools{display:none}
.msg.collapsed .collapsed-prev{display:block}
.collapsed-prev{display:none;color:var(--text-3);margin:6px 0 0 38px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.msg.note{background:var(--note-bg);border-color:var(--note-border);box-shadow:none}
.msg.note .note-h{font-size:11.5px;color:var(--note-text);font-weight:600;display:flex;align-items:center;gap:6px}
.msg.note .note-b{margin:6px 0 0;font-size:13.5px;line-height:1.55}
.run-line{display:flex;align-items:center;gap:8px;flex:none}
.run-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:11.5px;color:var(--text-2);border:1px solid var(--border)}
.run-chip:hover{border-color:var(--border-strong)}
.run-chip.ok .i{color:var(--ok)}
.run-chip.run{color:var(--run);border-color:transparent;background:var(--run-weak)}
.run-chip.q{color:var(--warn);border-color:transparent;background:var(--warn-weak)}
.btn{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:6px;border:1px solid var(--border-strong);font-size:12px;font-weight:550;background:var(--panel);color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.tools{margin:10px 0 0 38px;border-left:2px solid var(--border);padding:2px 0 2px 10px;font:11.5px/1.7 var(--mono);color:var(--text-2);max-height:180px;overflow:auto}
.tools div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools b{font-weight:600;color:var(--text)}
.tools .t-run{color:var(--run)}
.recap{margin:12px 0 0 38px;padding:9px 12px;border-radius:8px;background:var(--accent-weak);font-size:13px;line-height:1.5}
.recap b{font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--accent-text);display:block;margin-bottom:2px}
.ans-body{margin:10px 0 0 38px;font-size:14.5px;line-height:1.62;color:var(--text);position:relative}
.ans-body p{margin:0 0 .75em}
.ans-body p:last-child{margin-bottom:0}
.ans-body table{border-collapse:collapse;margin:4px 0 14px;font-size:13px;min-width:320px}
.ans-body th,.ans-body td{border-bottom:1px solid var(--border);padding:6px 14px 6px 0;text-align:left;font-variant-numeric:tabular-nums}
.ans-body th{font-weight:600;color:var(--text-2);font-size:12px}
.ans-body ul{margin:0 0 .75em;padding-left:20px}
.ans-body ::selection{background:var(--hl-strong)}
mark.hl{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px;box-shadow:0 1px 0 var(--hl-strong)}
.anchor-badge{display:inline-flex;align-items:center;gap:2px;vertical-align:2px;margin-left:3px;height:17px;padding:0 5px;border-radius:9px;background:var(--accent-weak);color:var(--accent-text);font-size:10.5px;font-weight:650}
.anchor-badge:hover{background:var(--accent);color:var(--on-accent)}
.caret{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:2px;border-radius:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.wl{display:inline;color:var(--accent-text);background:var(--accent-weak);border-radius:4px;padding:0 4px;font-weight:550;cursor:pointer;text-decoration:none;white-space:normal}
.wl::before{content:"[[";opacity:.45;font-weight:400}
.wl::after{content:"]]";opacity:.45;font-weight:400}
.wl:hover{background:var(--accent);color:var(--on-accent)}
.wl.missing{background:transparent;border:1px dashed var(--border-strong);color:var(--text-2)}
.srcs{margin:12px 0 0 38px;display:flex;flex-direction:column;gap:4px}
.srcs .src{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-2)}
.srcs .src .n{width:18px;height:18px;border-radius:4px;background:var(--muted-pill);font-size:10.5px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);flex:none}
.srcs .src:hover{color:var(--accent-text)}
.msg-f{margin:12px 0 0 32px;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.msg-f .tbtn{height:26px;font-size:12px}
.forks{margin:0 0 0 38px;display:flex;flex-direction:column;gap:6px}
.forks-h{font-size:11px;font-weight:650;color:var(--text-3);letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-top:2px}
.fork-card{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;background:var(--raise);cursor:pointer;width:100%}
.fork-card:hover{border-color:var(--border-strong);border-left-color:var(--accent)}
.fork-card .fc-main{flex:1;min-width:0;display:block}
.fork-card .fc-t,.fork-card .fc-q{display:block}
.fork-card .fc-t{font-weight:600;font-size:13px}
.fork-card .fc-q{font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fork-card .fc-q q{font-style:italic}
.day-sep{display:flex;align-items:center;gap:10px;color:var(--text-3);font-size:11.5px;margin:4px 0}
.day-sep::before,.day-sep::after{content:"";flex:1;height:1px;background:var(--border)}
.gutter{position:absolute;display:none;flex-direction:column;gap:2px;z-index:5}
.gutter button{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3);background:var(--panel);border:1px solid var(--border)}
.gutter button:hover{color:var(--accent-text);border-color:var(--accent)}
.first-hint{margin:0 0 0 38px;font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.first-hint button{color:var(--text-3)}
.first-hint button:hover{color:var(--text)}

/* composer */
.composer{flex:none;margin:0 auto 14px;width:calc(100% - 48px);max-width:712px;border:1px solid var(--border-strong);border-radius:11px;background:var(--panel);box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s}
.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.composer[data-mode="note"]{background:var(--note-bg);border-color:var(--note-border)}
.composer[data-mode="note"]:focus-within{box-shadow:0 0 0 3px var(--note-border)}
.cmp-top{display:flex;align-items:center;gap:6px;padding:7px 8px 0}
.seg{display:inline-flex;padding:2px;border-radius:7px;background:var(--muted-pill)}
.seg button{height:22px;padding:0 9px;border-radius:5px;font-size:12px;font-weight:560;color:var(--text-2);display:inline-flex;align-items:center;gap:5px}
.seg button[aria-checked="true"],.seg button[aria-selected="true"]{background:var(--panel);color:var(--text);box-shadow:var(--shadow-sm)}
.composer[data-mode="note"] .seg button[aria-checked="true"]{color:var(--note-text)}
.agent-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 6px 0 4px;border-radius:6px;font-size:12px;color:var(--text-2)}
.agent-chip:hover{background:var(--hover);color:var(--text)}
.composer[data-mode="note"] .agent-chip{display:none}
.cmp-hint{margin-left:auto;font-size:11.5px;color:var(--text-3);padding-right:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.agent-chip{white-space:nowrap;flex:none}
.quote-bar{display:flex;align-items:center;gap:8px;margin:8px 10px 0;padding:6px 8px;border-radius:7px;background:var(--accent-weak);font-size:12px;color:var(--accent-text)}
.quote-bar q{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:italic;color:var(--text-2)}
.composer textarea{display:block;width:100%;border:0;background:transparent;resize:none;padding:8px 12px 4px;font-size:13.5px;line-height:1.5;min-height:44px;max-height:160px;color:var(--text)}
.composer textarea:focus-visible,.cmp-big:focus-visible,.quick-ask textarea:focus-visible{outline:none}
.composer textarea::placeholder,.quick-ask textarea::placeholder,.cmp-big::placeholder{color:var(--text-3)}
.cmp-bot{display:flex;align-items:center;gap:8px;padding:2px 8px 8px 12px;font-size:11.5px;color:var(--text-3)}
.cmp-bot .grow{flex:1}

/* compose pane & welcome */
.compose{max-width:720px;margin:0 auto;padding:20px 28px 28px}
.cmp-field{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding:8px 0;min-height:42px;flex-wrap:wrap}
.cmp-field>label{width:64px;color:var(--text-3);font-size:12.5px;flex:none}
.cmp-big{width:100%;border:0;background:none;resize:none;min-height:160px;padding:14px 0;font-size:15px;line-height:1.55;color:var(--text)}
.cmp-actions{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.cmp-actions .grow{flex:1}
.suggest{margin-top:22px}
.suggest h3,.side h3{font-size:11px;font-weight:650;color:var(--text-3);letter-spacing:.03em;text-transform:uppercase;margin:0 0 8px}
.sugg-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;width:100%}
.sugg-row:hover{border-color:var(--border-strong);background:var(--row-hover)}
.sugg-row span{flex:1}
.welcome{max-width:640px;margin:0 auto;padding:48px 28px 40px}
.welcome .eyebrow{font-size:12px;color:var(--text-3);font-weight:600;display:flex;align-items:center;gap:6px}
.welcome h2{font-size:26px;letter-spacing:-.02em;margin:8px 0 6px;font-weight:700}
.welcome .lede{color:var(--text-2);font-size:14px;line-height:1.55;margin:0 0 20px}
.welcome .composer{width:100%;margin:0 0 12px;max-width:none}
.welcome .composer textarea{min-height:72px;font-size:15px}
.agent-check{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--list-bg)}
.agent-check .ac{display:inline-flex;align-items:center;gap:6px}
.agent-check .ok-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.agent-check .grow{flex:1}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 26px}
.examples button{border:1px solid var(--border);border-radius:16px;padding:5px 11px;font-size:12.5px;color:var(--text-2)}
.examples button:hover{border-color:var(--accent);color:var(--accent-text)}
.howto{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;border-top:1px solid var(--border);padding-top:18px}
.howto div{font-size:12px;color:var(--text-3);line-height:1.4}
.howto b{display:flex;align-items:center;gap:5px;color:var(--text);font-size:12.5px;margin-bottom:3px}

/* empty states */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;color:var(--text-2)}
.empty h3{font-size:16px;margin:14px 0 4px;color:var(--text)}
.empty p{margin:0 0 16px;max-width:320px;line-height:1.5}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.list-empty{padding:40px 22px;text-align:center;color:var(--text-3);font-size:12.5px;line-height:1.5}
.list-empty h3{color:var(--text);font-size:14px;margin:12px 0 4px}

/* context sidebar */
.ctx{width:284px;flex:none;background:var(--list-bg);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.ctx-tabs{flex:none;display:flex;gap:2px;padding:8px 10px;border-bottom:1px solid var(--border);align-items:center}
.ctx-tabs .seg{flex:1}
.ctx-tabs .seg button{flex:1;justify-content:center}
.ctx-scroll{flex:1;overflow:auto;padding:4px 0 20px}
.side{padding:12px 16px;border-bottom:1px solid var(--border)}
.side:last-child{border-bottom:0}
.side h3{display:flex;align-items:center;justify-content:space-between}
.side h3 button{color:var(--text-3);text-transform:none;letter-spacing:0;font-weight:550;font-size:11.5px;border-radius:4px;padding:0 4px}
.side h3 button:hover{color:var(--accent-text)}
.kv{display:grid;grid-template-columns:76px 1fr;gap:6px 8px;font-size:12.5px;align-items:center}
.kv dt{color:var(--text-3)}
.kv dd{margin:0;min-width:0;display:flex;align-items:center;gap:6px}
.link-row{display:flex;align-items:flex-start;gap:8px;padding:6px 6px;margin:0 -6px;border-radius:6px;font-size:12.5px;width:calc(100% + 12px);color:var(--text)}
.link-row:hover{background:var(--hover)}
.link-row .i{margin-top:1px;color:var(--text-3)}
.link-row .lr-m{flex:1;min-width:0}
.link-row .lr-s{font-size:11.5px;color:var(--text-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-row .lr-t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-row.note .i{color:var(--note-text)}
.tagrow{display:flex;flex-wrap:wrap;gap:5px}
.fork-tree{font-size:12.5px}
.fork-tree .ft{display:flex;align-items:center;gap:7px;padding:4px 6px;margin:0 -6px;border-radius:6px;width:calc(100% + 12px)}
.fork-tree .ft:hover{background:var(--hover)}
.fork-tree .ft.cur{background:var(--sel);font-weight:600}
.fork-tree .ft .lr-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fork-tree .ft.child{padding-left:22px}
.hl-q{font-size:12.5px;line-height:1.45;border-left:3px solid var(--hl-strong);padding:2px 0 2px 9px;margin:4px 0;cursor:pointer;color:var(--text-2)}
.hl-q:hover{color:var(--text)}
.mini-graph{width:100%;height:150px;border:1px solid var(--border);border-radius:8px;background:var(--panel);display:block}
.ctx-notes-tab{display:none}
[data-variant="d"] .ctx{width:340px}
.ctx .outline ul{padding-left:12px}
.ctx .outline ul::before{left:6px}
.ctx .ol-acts{display:none}
.ctx .ol-grip{width:10px}
.ctx .ol-text{font-size:13px}
.ctx .ol-row.top>.ol-text{font-size:13px}
.first-hint{flex-wrap:nowrap;align-items:flex-start}
[data-variant="d"] .ctx-notes-tab{display:inline-flex}
.ctx-tabs-wrap{display:none}
[data-variant="d"] .ctx-tabs-wrap{display:flex}

/* knowledge */
.note-row{display:flex;gap:10px;padding:10px 14px 10px 16px;border-bottom:1px solid var(--border);cursor:pointer;align-items:flex-start;width:100%;outline-offset:-2px}
.note-row:hover{background:var(--row-hover)}
.note-row.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.note-ic{width:28px;height:28px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--note-bg);color:var(--note-text);border:1px solid var(--note-border)}
.note-ic.link{background:var(--accent-weak);color:var(--accent-text);border-color:transparent}
.note-ic.post{background:var(--muted-pill);color:var(--text-2);border-color:transparent}
.note-ic.hlt{background:var(--hl);color:var(--note-text);border-color:transparent}
.note-row .nr-t{font-weight:600;font-size:13px;display:block}
.note-row .nr-s{font-size:12px;color:var(--text-3);display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-row .nr-m{flex:1;min-width:0}
.doc{max-width:960px;margin:0 auto;padding:20px 32px 60px}
.doc-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--text-3)}
.outline,.outline ul{list-style:none;margin:0;padding:0}
.outline ul{padding-left:22px;position:relative}
.outline ul::before{content:"";position:absolute;left:10px;top:2px;bottom:6px;width:1px;background:var(--border)}
.ol-row{display:flex;align-items:flex-start;gap:2px;padding:2px 0;border-radius:6px;position:relative}
.ol-row:hover{background:var(--row-hover)}
.ol-row.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.ol-row.dragging{opacity:.4}
.ol-grip{width:16px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--text-3);cursor:grab;opacity:0;flex:none}
.ol-row:hover .ol-grip,.ol-row:focus-within .ol-grip{opacity:1}
.ol-tog{width:18px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--text-3);flex:none;border-radius:4px}
.ol-tog:hover{color:var(--text);background:var(--hover)}
.ol-tog .i{transition:transform .15s;width:13px;height:13px}
.ol-tog[aria-expanded="false"] .i{transform:rotate(-90deg)}
.ol-bul{width:18px;height:24px;display:flex;align-items:center;justify-content:center;flex:none}
.ol-bul::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--text-3)}
.ol-bul.has-kids-collapsed::before{box-shadow:0 0 0 3px var(--muted-pill);background:var(--text-2)}
.ol-text{flex:1;min-width:0;padding:2px 4px;line-height:20px;font-size:14px;border-radius:4px}
.ol-text:focus{background:var(--panel);box-shadow:0 0 0 1px var(--border-strong)}
.ol-row.top>.ol-text{font-weight:650;font-size:14.5px}
.ol-acts{display:flex;gap:2px;opacity:0;flex:none;padding-right:4px}
.ol-row:hover .ol-acts,.ol-row:focus-within .ol-acts{opacity:1}
.ol-acts button{height:22px;padding:0 6px;border-radius:5px;font-size:11.5px;color:var(--text-3);display:inline-flex;align-items:center;gap:4px}
.ol-acts button:hover{background:var(--hover);color:var(--accent-text)}
.ol-row.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--hl)}100%{background:transparent}}
.link-card{border:1px solid var(--border);border-radius:10px;padding:16px 18px;background:var(--raise)}
.link-card .dom{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.link-card h3{font-size:16px;margin:6px 0}
.post-card{border:1px solid var(--border);border-radius:10px;padding:16px 18px;background:var(--raise);font-size:16px;line-height:1.5}
.post-card .by{font-size:12.5px;color:var(--text-3);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.graph-wrap{position:relative;border:1px solid var(--border);border-radius:10px;background:var(--list-bg);overflow:hidden}
.graph-wrap svg{display:block;width:100%;height:auto}
.graph-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--text-3);margin-top:10px}
.graph-legend span{display:inline-flex;align-items:center;gap:5px}
.gn{cursor:pointer}
.gn text{font:500 11px var(--font);fill:var(--text-2);paint-order:stroke;stroke:var(--list-bg);stroke-width:3px}
.ge{stroke:var(--graph-edge);stroke-width:1.2}
.ge.fork{stroke:var(--accent);stroke-dasharray:4 3;opacity:.7}
.ge.tag{stroke-dasharray:2 3}
svg.dim .gn{opacity:.25}svg.dim .ge{opacity:.12}
svg.dim .gn.on{opacity:1}svg.dim .ge.on{opacity:1;stroke:var(--accent)}
.gn.cur circle,.gn.cur rect{stroke:var(--text);stroke-width:2}

/* getting started */
.getting{border:1px solid var(--border);background:var(--panel);border-radius:9px;padding:6px 6px 8px;margin:0 0 12px;box-shadow:var(--shadow-sm)}
.gs-h{display:flex;align-items:center}
.gs-t{flex:1;display:flex;align-items:center;gap:6px;font-weight:650;font-size:12.5px;padding:3px 4px;border-radius:5px}
.gs-t:hover{background:var(--hover)}
.gs-n{margin-left:auto;font-weight:550;font-size:11.5px;color:var(--text-3)}
.gs-x{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:var(--text-3)}
.gs-x:hover{background:var(--hover);color:var(--text)}
.gs-bar{height:3px;border-radius:2px;background:var(--muted-pill);margin:5px 4px 4px;overflow:hidden}
.gs-bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.gs-list{list-style:none;margin:2px 0 0;padding:0}
.gs-list button{display:flex;align-items:center;gap:8px;width:100%;padding:4px 4px;border-radius:5px;font-size:12.5px;color:var(--text-2)}
.gs-list button:hover{background:var(--hover);color:var(--text)}
.gs-list .gs-l{flex:1}
.gs-list .gs-go{opacity:0;color:var(--text-3)}
.gs-list button:hover .gs-go,.gs-list button:focus-visible .gs-go{opacity:1}
.gs-c{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border-strong);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:650;color:var(--text-3);flex:none}
.gs-list button.done{color:var(--text-3)}
.gs-list button.done .gs-l{text-decoration:line-through;text-decoration-color:var(--border-strong)}
.gs-list button.done .gs-c{background:var(--ok);border-color:var(--ok);color:#fff}
.gs-list button.done .gs-c .i{width:11px;height:11px;stroke-width:2.6}
.gs-first{display:flex;align-items:center;gap:6px;width:100%;margin-top:4px;padding:5px 4px 2px;border-top:1px solid var(--border);font-size:12px;color:var(--accent-text)}
.gs-first:hover{text-decoration:underline}
.tag-new{display:flex;align-items:center;gap:6px;padding:2px 8px}
.tag-new input{flex:1;min-width:0;height:26px;border:1px solid var(--accent);border-radius:6px;padding:0 8px;background:var(--panel);font-size:12.5px}
.coach{position:fixed;z-index:75;width:280px;background:var(--panel);border:1px solid var(--accent);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;display:none;font-size:13px;line-height:1.5}
.coach.show{display:block}
.coach-b{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:11.5px}
.coach-ring{outline:2px solid var(--accent)!important;outline-offset:3px;border-radius:6px;animation:ring 1.4s ease-in-out infinite}
@keyframes ring{50%{outline-offset:6px;outline-color:var(--accent-weak)}}
/* margin threads (variant e) */
.thread.margin-on{max-width:1060px;padding-right:288px;position:relative}
.mcard{position:absolute;right:24px;width:244px;display:block;text-align:left;border:1px solid var(--border);border-radius:9px;background:var(--raise);padding:9px 11px;box-shadow:var(--shadow-sm);font-size:12.5px;z-index:2}
.mcard::before{content:"";position:absolute;left:-26px;top:16px;width:24px;border-top:1px dashed var(--border-strong)}
.mcard.hl{border-left:3px solid var(--hl-strong)}
.mcard.fork{border-left:3px solid var(--accent);cursor:pointer}
.mcard.fork::before{border-top-color:var(--accent)}
.mcard:hover{border-color:var(--border-strong)}
.mc-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--text-3);margin-bottom:4px}
.mc-q{color:var(--text-2);line-height:1.45}
.mc-t{display:block;font-weight:600;line-height:1.35;margin-bottom:6px}
.mc-a{display:flex;gap:2px;margin-top:6px}
.mc-a button{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-3);padding:2px 6px;border-radius:5px}
.mc-a button:hover{background:var(--hover);color:var(--accent-text)}
mark.hl.hl-active{background:var(--hl-strong)}
/* welcome flow */
.flow-h{font-size:11px;font-weight:650;color:var(--text-3);letter-spacing:.03em;text-transform:uppercase;margin:6px 0 10px}
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;position:relative}
.flow::before{content:"";position:absolute;left:14px;right:14px;top:14px;border-top:1.5px dashed var(--border-strong)}
.flow li{position:relative;font-size:12px;color:var(--text-3);line-height:1.4}
.flow .fn{width:28px;height:28px;border-radius:50%;background:var(--panel);border:1.5px solid var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;margin-bottom:8px;position:relative}
.flow li:first-child .fn{background:var(--accent);color:var(--on-accent)}
.flow b{display:block;color:var(--text);font-size:12.5px;margin-bottom:2px}
.app.welcome-mode .ctx{display:none!important}
/* graph extras */
.graph-ctl{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}
#miniGraph svg{display:block;width:100%;height:auto;overflow:visible}
#miniGraph .gn text,.local-svg .gn text{font-size:11.5px;fill:var(--text);stroke:var(--list-bg)}
#miniGraph .gn:hover text{fill:var(--accent-text)}
/* search snippet */
.pal-it .pi-m{flex:1;min-width:0}
.pal-it .pi-m .pi-t{display:block}
.pi-sn{display:block;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
/* suggestions + browser + agent steps */
.sugg .mi{cursor:pointer}
.browser-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--nav-bg)}
.browser-bar .url{flex:1;display:flex;align-items:center;gap:6px;justify-content:center;height:26px;border-radius:7px;background:var(--panel);border:1px solid var(--border);font-size:12px;color:var(--text-2)}
.browser-page h2{font-size:20px;margin:6px 0 10px;letter-spacing:-.01em}
.browser-page p{color:var(--text-2);line-height:1.55;max-width:620px}
.bp-lines i{display:block;height:9px;border-radius:5px;background:var(--muted-pill);margin:10px 0}
.steps{margin:10px 0 0 18px;padding:0;font-size:12.5px;line-height:1.55;color:var(--text-2)}
.steps code{font:11.5px var(--mono);background:var(--muted-pill);padding:1px 5px;border-radius:4px}
/* overlays */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
.scrim.show{display:block}
.modal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));max-height:76vh;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:50;display:none;flex-direction:column;overflow:hidden}
.modal.show{display:flex}
.modal.wide{width:min(860px,calc(100vw - 32px));top:7vh;max-height:84vh}
.modal-h{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.modal-h h2{font-size:14px;margin:0;flex:1}
.modal-b{overflow:auto;padding:12px 16px 16px}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.pal-in input{flex:1;border:0;background:none;font-size:15px}
.pal-list{overflow:auto;padding:6px}
.pal-g{font-size:11px;font-weight:650;color:var(--text-3);padding:8px 10px 4px;text-transform:uppercase;letter-spacing:.03em}
.pal-it{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;cursor:pointer;width:100%}
.pal-it .pi-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-it .pi-s{font-size:11.5px;color:var(--text-3);flex:none}
.pal-it.act{background:var(--sel)}
.pal-it mark{background:transparent;color:var(--accent-text);font-weight:650}
.pal-foot{display:flex;gap:14px;padding:8px 16px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3)}
.gloss dt{font-weight:650;display:flex;align-items:center;gap:7px;margin-top:12px;font-size:13.5px}
.gloss dt:first-child{margin-top:0}
.gloss dd{margin:3px 0 0 23px;color:var(--text-2);line-height:1.5}
.gloss .was{font-size:11.5px;color:var(--text-3)}
.gloss-status{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--text-3)}
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:12.5px}
.sc-grid div{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}
.agent-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.agent-row .ar-m{flex:1}
.agent-row .ar-s{font-size:12px;color:var(--text-3)}
.menu{position:fixed;z-index:60;min-width:220px;max-width:320px;background:var(--panel);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:5px;display:none}
.menu.show{display:block}
.menu .mh{font-size:11px;font-weight:650;color:var(--text-3);padding:6px 8px 3px;text-transform:uppercase;letter-spacing:.03em}
.menu .mi{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:6px;font-size:12.5px}
.menu .mi .ml{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .mi .ms{font-size:11.5px;color:var(--text-3)}
.menu .mi:hover,.menu .mi.act{background:var(--sel)}
.menu .mi[aria-checked="true"] .chk{opacity:1}
.menu .chk{opacity:0;color:var(--accent)}
.menu .msep{height:1px;background:var(--border);margin:4px 2px}
.sel-pop{position:fixed;z-index:55;display:none;background:var(--text);color:var(--panel);border-radius:8px;box-shadow:var(--shadow);padding:3px;gap:1px}
.sel-pop.show{display:flex}
.sel-pop button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:560}
.sel-pop button:hover,.sel-pop button:focus-visible{background:rgba(127,127,127,.28)}
.sel-pop kbd{background:transparent;color:inherit;opacity:.6;border-color:currentColor;border-width:1px;padding:1px 3px;min-width:0;font-size:10px}
.toasts{position:fixed;left:16px;bottom:16px;z-index:70;display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
@media (max-width:720px){.toasts{left:12px;right:12px;bottom:84px;align-items:center}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--text);color:var(--panel);padding:9px 10px 9px 14px;border-radius:9px;box-shadow:var(--shadow);font-size:12.5px;max-width:min(520px,calc(100vw - 32px));animation:tin .18s ease}
.toast .tt{flex:1;min-width:0}
.toast button{font-weight:650;color:var(--accent-weak);padding:3px 6px;border-radius:5px}
:root[data-theme="dark"] .toast button{color:var(--on-accent)}
.toast button:hover{background:rgba(127,127,127,.25)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.kbd-strip{display:none;flex:none;gap:14px;align-items:center;padding:6px 14px;border-top:1px solid var(--border);background:var(--nav-bg);font-size:11.5px;color:var(--text-3);overflow:hidden;white-space:nowrap}
.kbd-strip span{display:inline-flex;gap:5px;align-items:center}

.vswitch{position:fixed;right:14px;bottom:14px;z-index:80;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:5px}
.vswitch button{height:26px;padding:0 9px;border-radius:6px;font-size:12px;color:var(--text-2)}
.vswitch button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.vswitch .lab{font-size:11px;color:var(--text-3);padding:0 4px}

/* responsive */
@media (max-width:1240px){
  .ctx{position:absolute;right:0;top:0;bottom:0;z-index:30;box-shadow:var(--shadow);display:none}
  .app.ctx-open .ctx{display:flex}
}
@media (min-width:1241px){ .app.ctx-closed .ctx{display:none} }
@media (max-width:1060px){
  .lights{width:auto}
  .tbtn .lbl-wide{display:none}
}
@media (max-width:980px){
  .nav{position:absolute;left:0;top:0;bottom:0;z-index:35;box-shadow:var(--shadow);display:none}
  .app.nav-open .nav{display:flex}
  .only-m.nav-t{display:inline-flex!important}
  .list{width:300px}
}
@media (max-width:720px){
  .lights{display:none}
  .search-trigger{position:static;transform:none;flex:1;width:auto}
  .search-trigger kbd{display:none}
  .agents-chip .lbl{display:none}
  .list{width:100%;border-right:0}
  .app.m-pane .list{display:none}
  .app:not(.m-pane) .pane{display:none}
  .only-m{display:inline-flex!important}
  .pane-h{padding:6px 12px 10px}
  .pane-top{flex-wrap:wrap}
  .toolbar{max-width:100%;overflow-x:auto}
  .search-trigger .long{display:none}
  .thread{padding:12px 12px 20px}
  .msg{padding:12px 12px}
  .ans-body,.recap,.srcs,.tools,.forks,.first-hint{margin-left:0}
  .msg.ask .q{margin-left:0}
  .msg-f{margin-left:-6px}
  .composer{width:calc(100% - 24px);margin-bottom:10px}
  .ctx{width:100%;max-width:100%}
  .doc{padding:16px}
  .welcome{padding:28px 16px}
  .welcome h2{font-size:22px}
  .flow{grid-template-columns:1fr;gap:12px}
  .flow::before{left:14px;right:auto;top:14px;bottom:14px;border-top:0;border-left:1.5px dashed var(--border-strong)}
  .flow li{padding-left:40px;min-height:28px}
  .flow .fn{position:absolute;left:0;top:0;margin:0}
  .coach{width:calc(100vw - 24px)}
  .compose{padding:14px 16px}
  .ans-body table{min-width:0;width:100%}
  .cmp-hint{display:none}
  .vswitch{bottom:140px;right:8px}
  .vswitch .lab{display:none}
  [data-variant="e"] .list{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
  .spin{border-right-color:currentColor;opacity:.6}
  .caret{animation:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="titlebar">
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
    <button class="icon-btn only-m nav-t" id="navToggle" aria-label="Show sidebar"></button>

  <div class="body">

</div>
<div class="scrim" id="scrim"></div>
<div class="modal" id="palette" role="dialog" aria-modal="true" aria-label="Search"></div>
<div class="modal" id="dialog" role="dialog" aria-modal="true"></div>
<div class="menu" id="menu" role="menu"></div>
<div class="sel-pop" id="selPop" role="toolbar" aria-label="Passage actions">

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="menu sugg" id="sugg" role="listbox" aria-label="Link suggestions"></div>
<div class="coach" id="coach" role="dialog" aria-label="Tip"></div>

<script>

function resolve(title) {
  const t = title.trim().toLowerCase();
  const c = D().convs.find((c) => c.short.toLowerCase() === t || c.title.toLowerCase() === t);
  if (c) return { type: "conv", id: c.id, item: c };
  const x = D().notes.find((x) => x.title.toLowerCase() === t && x.kind !== "highlight");
  if (x) return { type: "note", id: x.id, item: x };
  return null;
}
function inline(t) {
  return esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\[\[(.+?)\]\]/g, (m, a) => {
    const r = resolve(a.replace(/&amp;/g, "&").replace(/&#39;/g, "'"));
    return `<a class="wl${r ? "" : " missing"}" data-link="${a}" tabindex="0">${a}</a>`;
  });
}
function md(text) {
  const blocks = text.split(/\n\n+/);

    if (/^- /.test(b)) return "<ul>" + b.split("\n").map((l) => `<li>${inline(l.replace(/^- /, ""))}</li>`).join("") + "</ul>";
    return `<p>${inline(b)}</p>`;
  }).join("");
}
function eachNode(nodes, fn, path = []) {
  for (const nd of nodes) { fn(nd, path); eachNode(nd.children, fn, path.concat(nd)); }
}
