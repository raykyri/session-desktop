<!doctype html>
<!-- Session redesign, round 2 candidate "obsidian". Influence: Obsidian (vault of Markdown notes, ribbon, tabs, backlinks, graph, canvas, command palette). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session · Vault of linked notes</title>
<style>
/* Session · vault idiom (influence: Obsidian). Ribbon + file explorer, tabbed leaves, right sidebar panes, status bar. */
:root {
  --bg-primary: #ffffff;
  --bg-primary-alt: #fafafa;
  --bg-secondary: #f6f6f6;
  --bg-secondary-alt: #efefef;
  --bg-ribbon: #f0f0f0;
  --bg-modal: #ffffff;
  --border: #e3e3e3;
  --border-strong: #cfcfcf;
  --text: #222222;
  --text-muted: #5c5c5c;
  --text-faint: #9a9a9a;
  --placeholder: #6e6e6e;
  --text-on-accent: #ffffff;
  --accent: #7b5ff0;
  --accent-hover: #8c74f3;
  --accent-text: #6646de;
  --accent-soft: rgba(123, 95, 240, 0.12);
  --accent-softer: rgba(123, 95, 240, 0.07);
  --hover: rgba(0, 0, 0, 0.05);
  --active: rgba(0, 0, 0, 0.085);
  --mark: rgba(255, 208, 0, 0.42);
  --mark-text: inherit;
  --code-bg: #f5f5f5;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.14), 0 1px 4px rgba(0, 0, 0, 0.08);
  --shadow-s: 0 2px 8px rgba(0, 0, 0, 0.1);
  --scrim: rgba(0, 0, 0, 0.32);
  --c-blue: 8, 109, 221;
  --c-purple: 120, 82, 238;
  --c-orange: 216, 105, 0;
  --c-green: 8, 160, 70;
  --c-gray: 120, 120, 120;
  --c-red: 214, 46, 66;
  --c-cyan: 0, 150, 160;
  --c-yellow: 190, 140, 0;
  --graph-bg: #ffffff;
  --graph-line: #d9d9d9;
  --graph-node: #8f8f8f;
  --graph-text: #3a3a3a;
  --canvas-dot: #dcdcdc;
  --traffic-r: #ff5f57; --traffic-y: #febc2e; --traffic-g: #28c840;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", "Segoe UI", sans-serif;
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --ribbon-w: 44px;
  --left-w: 252px;
  --right-w: 300px;
  --header-h: 40px;
  --line-w: 700px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-primary: #1e1e1e; --bg-primary-alt: #242424; --bg-secondary: #262626; --bg-secondary-alt: #2c2c2c;
    --bg-ribbon: #232323; --bg-modal: #262626;
    --border: #363636; --border-strong: #474747;
    --text: #dadada; --text-muted: #a8a8a8; --text-faint: #6c6c6c; --placeholder: #9a9a9a;
    --accent: #8a70f6; --accent-hover: #9d87f8; --accent-text: #a891fa;
    --accent-soft: rgba(138, 112, 246, 0.2); --accent-softer: rgba(138, 112, 246, 0.1);
    --hover: rgba(255, 255, 255, 0.06); --active: rgba(255, 255, 255, 0.1);
    --mark: rgba(255, 208, 0, 0.3); --code-bg: #2a2a2a;
    --shadow: 0 12px 34px rgba(0, 0, 0, 0.55), 0 1px 4px rgba(0, 0, 0, 0.4);
    --shadow-s: 0 2px 10px rgba(0, 0, 0, 0.45); --scrim: rgba(0, 0, 0, 0.5);
    --c-blue: 2, 122, 255; --c-purple: 168, 130, 255; --c-orange: 233, 151, 63; --c-green: 68, 207, 110;
    --c-gray: 158, 158, 158; --c-red: 251, 70, 76; --c-cyan: 83, 223, 221; --c-yellow: 224, 222, 113;
    --graph-bg: #1e1e1e; --graph-line: #3d3d3d; --graph-node: #a3a3a3; --graph-text: #d0d0d0; --canvas-dot: #343434;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-primary: #1e1e1e; --bg-primary-alt: #242424; --bg-secondary: #262626; --bg-secondary-alt: #2c2c2c;
  --bg-ribbon: #232323; --bg-modal: #262626;
  --border: #363636; --border-strong: #474747;
  --text: #dadada; --text-muted: #a8a8a8; --text-faint: #6c6c6c; --placeholder: #9a9a9a;
  --accent: #8a70f6; --accent-hover: #9d87f8; --accent-text: #a891fa;
  --accent-soft: rgba(138, 112, 246, 0.2); --accent-softer: rgba(138, 112, 246, 0.1);
  --hover: rgba(255, 255, 255, 0.06); --active: rgba(255, 255, 255, 0.1);
  --mark: rgba(255, 208, 0, 0.3); --code-bg: #2a2a2a;
  --shadow: 0 12px 34px rgba(0, 0, 0, 0.55), 0 1px 4px rgba(0, 0, 0, 0.4);
  --shadow-s: 0 2px 10px rgba(0, 0, 0, 0.45); --scrim: rgba(0, 0, 0, 0.5);
  --c-blue: 2, 122, 255; --c-purple: 168, 130, 255; --c-orange: 233, 151, 63; --c-green: 68, 207, 110;
  --c-gray: 158, 158, 158; --c-red: 251, 70, 76; --c-cyan: 83, 223, 221; --c-yellow: 224, 222, 113;
  --graph-bg: #1e1e1e; --graph-line: #3d3d3d; --graph-node: #a3a3a3; --graph-text: #d0d0d0; --canvas-dot: #343434;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg-primary); color: var(--text); font: 13px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.s { width: 14px; height: 14px; }
svg.i.xs { width: 12px; height: 12px; }
.kbd { font: 11px/1 var(--font-ui); color: var(--text-faint); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--bg-primary); white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- App frame ---------- */
#app { position: fixed; inset: 0; display: grid; grid-template-columns: var(--ribbon-w) auto minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); background: var(--bg-primary); }
#app.no-left .side.left, #app.no-right .side.right { display: none; }
.ribbon { background: var(--bg-ribbon); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 2px; min-height: 0; }
.ribbon .traffic { display: flex; gap: 6px; height: 24px; align-items: center; margin-bottom: 12px; transform: translateX(14px); position: relative; z-index: 2; }
.ribbon .traffic span { width: 12px; height: 12px; border-radius: 50%; background: var(--traffic-r); }
.ribbon .traffic span:nth-child(2) { background: var(--traffic-y); }
.ribbon .traffic span:nth-child(3) { background: var(--traffic-g); }
.rb { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--text-muted); position: relative; }
.rb:hover { background: var(--hover); color: var(--text); }
.rb.on { color: var(--accent-text); }
.ribbon .grow { flex: 1; }
.ribbon .sep { width: 18px; height: 1px; background: var(--border); margin: 6px 0; }
.rb .dot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--bg-ribbon); }
[data-tip] { position: relative; }
.tooltip { position: fixed; z-index: 90; background: var(--bg-modal); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow-s); border-radius: 5px; padding: 4px 8px; font-size: 12px; pointer-events: none; white-space: nowrap; }

/* sidebars */
.side { background: var(--bg-secondary); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.side.left { width: var(--left-w); border-right: 1px solid var(--border); }
.side.right { width: var(--right-w); border-left: 1px solid var(--border); }
.side-head { height: var(--header-h); display: flex; align-items: center; gap: 2px; padding: 0 8px; border-bottom: 1px solid var(--border); flex: none; }
.side-head .sp { flex: 1; }
.ib { width: 28px; height: 26px; border-radius: 5px; display: inline-grid; place-items: center; color: var(--text-muted); flex: none; }
.ib:hover { background: var(--hover); color: var(--text); }
.ib.on { background: var(--active); color: var(--text); }
.ib[disabled] { opacity: .4; cursor: default; background: none; }
.nav-actions { display: flex; justify-content: center; gap: 2px; padding: 6px 8px 4px; flex: none; }
.pane-body { flex: 1; overflow: auto; min-height: 0; padding: 2px 8px 12px; }
.side-foot { flex: none; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 2px; padding: 6px 8px; }
.vault-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 5px; font-weight: 600; color: var(--text); text-align: left; }
.vault-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vault-btn:hover { background: var(--hover); }
.vault-btn svg { color: var(--text-faint); }

/* file tree */
.tree { padding-top: 2px; }
.ti { display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 6px 0 calc(6px + var(--d, 0) * 17px); border-radius: 5px; color: var(--text-muted); cursor: pointer; user-select: none; white-space: nowrap; position: relative; width: 100%; text-align: left; }
.ti:hover { background: var(--hover); color: var(--text); }
.ti.sel { background: var(--active); color: var(--text); }
.ti .tw { width: 14px; display: grid; place-items: center; color: var(--text-faint); flex: none; transition: transform .12s; }
.ti.closed .tw { transform: rotate(-90deg); }
.ti .nm { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.ti.folder .nm { color: var(--text); }
.ti .tag { font-size: 9.5px; font-weight: 600; letter-spacing: .04em; padding: 1px 4px; border-radius: 3px; background: var(--hover); color: var(--text-faint); }
.ti .st { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.st.running { background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.st.queued { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-faint); }
@keyframes pulse { 50% { opacity: .35; } }
.guide { position: absolute; left: calc(13px + var(--d, 0) * 17px); top: 0; bottom: 0; width: 1px; background: var(--border); }
.tree-children { position: relative; }
.tree-children::before { content: ""; position: absolute; left: calc(13px + var(--d, 0) * 17px); top: 0; bottom: 2px; width: 1px; background: var(--border); }

.sect-label { font-size: 11px; font-weight: 600; color: var(--text-faint); text-transform: uppercase; letter-spacing: .06em; padding: 12px 6px 4px; display: flex; align-items: center; gap: 6px; }
.empty-pane { color: var(--text-faint); padding: 18px 10px; text-align: center; font-size: 12.5px; line-height: 1.5; }

/* onboarding card in left sidebar */
.onb-card { margin: 8px; padding: 10px 12px; border: 1px solid var(--border); background: var(--bg-primary); border-radius: 8px; flex: none; display: none; }
.onb-card.show { display: block; }
.onb-card .h { display: flex; justify-content: space-between; font-weight: 600; font-size: 12.5px; margin-bottom: 6px; }
.prog { height: 4px; background: var(--hover); border-radius: 2px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

/* ---------- Main workspace ---------- */
.main { display: flex; min-width: 0; min-height: 0; background: var(--bg-primary); }
.leaf { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; position: relative; }
.leaf + .leaf { border-left: 1px solid var(--border); }
.leaf.focused .tab.act::after { opacity: 1; }
.tabbar { height: var(--header-h); background: var(--bg-secondary); display: flex; align-items: flex-end; padding: 0 6px 0 4px; gap: 1px; border-bottom: 1px solid var(--border); flex: none; min-width: 0; }
.tabs { display: flex; align-items: flex-end; gap: 1px; min-width: 0; flex: 1; overflow: hidden; }
.tab { height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 10px; border-radius: 7px 7px 0 0; color: var(--text-muted); min-width: 60px; max-width: 220px; flex: 0 1 200px; position: relative; cursor: pointer; }
.tab:hover { background: var(--hover); }
.tab.act { background: var(--bg-primary); color: var(--text); box-shadow: 0 0 0 1px var(--border); clip-path: inset(-2px -2px 0 -2px); }
.tab .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.tab .tx { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; color: var(--text-faint); opacity: 0; }
.tab:hover .tx, .tab.act .tx { opacity: 1; }
.tab .tx:hover { background: var(--hover); color: var(--text); }
.tab .st { width: 6px; height: 6px; border-radius: 50%; }
.tabbar .ib { margin-bottom: 4px; }

.view-head { height: 38px; display: flex; align-items: center; gap: 2px; padding: 0 8px; flex: none; }
.crumbs { flex: 1; min-width: 0; text-align: center; color: var(--text-muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
.crumbs b { color: var(--text); font-weight: 500; }
.mob-only { display: none; }
.view { flex: 1; overflow: auto; min-height: 0; position: relative; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { .view { scroll-behavior: auto; } * { animation-duration: 0s !important; transition-duration: 0s !important; } }

/* ---------- Note rendering ---------- */
.note { max-width: calc(var(--line-w) + 64px); margin: 0 auto; padding: 18px 32px 0; font: 16px/1.6 var(--font-text); }
.inline-title { font-size: 28px; line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; margin: 10px 0 14px; outline: none; }
.props { margin: 0 0 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px; font-size: 13px; }
.props-h { display: flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 600; font-size: 13px; padding: 2px 0 6px; cursor: pointer; user-select: none; }
.props-h .tw { transition: transform .12s; display: grid; }
.props.closed .props-h .tw { transform: rotate(-90deg); }
.props.closed .prop { display: none; }
.prop { display: grid; grid-template-columns: 132px minmax(0, 1fr); align-items: center; min-height: 30px; border-radius: 5px; }
.prop:hover { background: var(--hover); }
.prop .k { display: flex; align-items: center; gap: 7px; color: var(--text-muted); padding-left: 4px; }
.prop .k svg { color: var(--text-faint); }
.prop .v { min-width: 0; padding: 3px 6px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; color: var(--text); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 12px; background: var(--hover); font-size: 12.5px; color: var(--text); white-space: nowrap; }
.pill.acc { background: var(--accent-soft); color: var(--accent-text); }
.pill .st { width: 6px; height: 6px; border-radius: 50%; }
.st.complete { background: rgb(var(--c-green)); }
.st.stopped { background: rgb(var(--c-red)); }
.tagp { color: var(--accent-text); background: var(--accent-softer); border-radius: 10px; padding: 0 7px; font-size: .86em; white-space: nowrap; }

.note p { margin: 0 0 14px; }
.note h1, .note h2, .note h3 { line-height: 1.3; margin: 26px 0 10px; position: relative; }
.note h2 { font-size: 1.32em; font-weight: 650; }
.note h3 { font-size: 1.12em; font-weight: 650; }
.note ul, .note ol { margin: 0 0 14px; padding-left: 26px; }
.note li { margin: 3px 0; }
.note li::marker { color: var(--text-faint); }
.note hr { border: 0; border-top: 1px solid var(--border); margin: 26px 0; }
.note code { font: .86em var(--font-mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.note mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.note mark.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 4px var(--accent-soft); } }
.note table { border-collapse: collapse; margin: 4px 0 16px; font-size: .9em; width: auto; }
.note th, .note td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
.note th { font-weight: 600; background: var(--bg-primary-alt); }
.note td.num { font-variant-numeric: tabular-nums; text-align: right; }
.wl { color: var(--accent-text); text-decoration: none; cursor: pointer; border-radius: 3px; }
.wl:hover { text-decoration: underline; text-decoration-color: var(--accent-soft); text-underline-offset: 3px; }
.wl.unres { opacity: .65; }
.wl .br { color: var(--text-faint); display: none; }
.ext { color: var(--accent-text); text-decoration: underline; text-decoration-color: var(--accent-soft); text-underline-offset: 3px; }
.blockref { display: none; color: var(--text-faint); font: 12px var(--font-mono); margin-left: 6px; }
.brc { display: inline-flex; align-items: center; gap: 2px; vertical-align: 2px; margin-left: 3px; font: 600 10.5px/1 var(--font-ui); color: var(--accent-text); background: var(--accent-soft); border-radius: 8px; padding: 2px 5px; cursor: pointer; }
.brc:hover { background: var(--accent); color: var(--text-on-accent); }

/* edit (live preview) mode */
.leaf[data-mode="edit"] .wl .br { display: inline; }
.leaf[data-mode="edit"] .blockref { display: inline; }
.leaf[data-mode="edit"] .note mark::before, .leaf[data-mode="edit"] .note mark::after { content: "=="; color: var(--text-faint); }
.leaf[data-mode="edit"] .editable { outline: none; caret-color: var(--accent); }
.leaf[data-mode="edit"] .editable:focus-within, .leaf[data-mode="edit"] .editable:hover { background: transparent; }
.leaf[data-mode="edit"] .note h2::before { content: "## "; color: var(--text-faint); font-weight: 400; }
.leaf[data-mode="edit"] .note h3::before { content: "### "; color: var(--text-faint); font-weight: 400; }
.mode-hint { position: sticky; top: 0; z-index: 3; display: none; }

/* fold arrows on headings and list items */
.fold { position: absolute; left: -22px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; display: grid; place-items: center; color: var(--text-faint); opacity: 0; border-radius: 4px; }
.fold svg { transition: transform .12s; }
.collapsed > .fold svg, .collapsed > .row .fold svg { transform: rotate(-90deg); }
h2:hover .fold, h3:hover .fold, .fold:focus-visible, .collapsed > .fold { opacity: 1; }
.fold:hover { background: var(--hover); color: var(--text); }

/* outline lists (reorderable) */
.ol { list-style: none; padding-left: 0 !important; margin: 0 0 14px; }
.ol .ol { padding-left: 24px !important; margin: 0; position: relative; }
.ol .ol::before { content: ""; position: absolute; left: 7px; top: 2px; bottom: 4px; width: 1px; background: var(--border); }
.ol li { margin: 0; position: relative; }
.ol .row { display: flex; align-items: flex-start; gap: 6px; padding: 2px 4px 2px 0; border-radius: 5px; position: relative; }
.ol .row:hover { background: var(--accent-softer); }
.ol .row .fold { position: static; transform: none; opacity: 0; flex: none; margin-top: 3px; margin-left: -22px; }
.ol li.has-kids > .row .fold { opacity: .6; }
.ol .row:hover .fold { opacity: 1; }
.ol .bul { width: 16px; height: 25px; display: grid; place-items: center; flex: none; cursor: grab; position: relative; }
.ol .bul::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
.ol li.collapsed > .row .bul::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: var(--hover); z-index: -1; }
.ol li.collapsed > .ol { display: none; }
.ol .txt { flex: 1; min-width: 0; outline: none; }
.ol .grip { opacity: 0; color: var(--text-faint); cursor: grab; display: grid; place-items: center; height: 25px; }
.ol .row:hover .grip, .ol li:focus-within > .row .grip { opacity: 1; }
.ol li.dragging { opacity: .4; }
.ol li.drop-before > .row { box-shadow: 0 -2px 0 var(--accent); }
.ol li.drop-after > .row { box-shadow: 0 2px 0 var(--accent); }
.ol li.moved > .row { animation: flash 1.2s ease-out; }
.task { display: inline-grid; place-items: center; width: 15px; height: 15px; border: 1.5px solid var(--text-faint); border-radius: 4px; margin: 5px 6px 0 0; flex: none; cursor: pointer; }
.task.done { background: var(--accent); border-color: var(--accent); color: #fff; }
.task.done + .txt { color: var(--text-faint); text-decoration: line-through; }
.sec.collapsed-sec { display: none; }

/* callouts */
.callout { --cc: var(--c-blue); background: rgba(var(--cc), 0.075); border-radius: 6px; padding: 10px 14px 10px 14px; margin: 0 0 16px; position: relative; }
.callout-t { display: flex; align-items: center; gap: 8px; color: rgb(var(--cc)); font-weight: 600; font-size: 14.5px; line-height: 1.4; min-height: 24px; }
.callout-t .meta { color: var(--text-muted); font-weight: 400; font-size: 12.5px; display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.callout-t .sp { flex: 1; }
.callout-c { margin-top: 6px; }
.callout-c > :last-child { margin-bottom: 0; }
.callout.summary { --cc: var(--c-cyan); }
.callout.quote { --cc: var(--c-gray); }
.callout.tip { --cc: var(--c-green); }
.callout.info { --cc: var(--c-blue); }
.callout.folded .callout-c { display: none; }
.callout .cf { color: var(--text-faint); display: grid; transition: transform .12s; }
.callout.folded .cf { transform: rotate(-90deg); }
.callout .acts { display: flex; gap: 0; opacity: 0; transition: opacity .1s; }
.callout:hover > .callout-t .acts, .callout:focus-within > .callout-t .acts, .callout.running > .callout-t .acts { opacity: 1; }
.callout .acts .ib { width: 26px; height: 24px; }

/* agent turns */
.turn-q { --cc: var(--c-gray); background: var(--bg-primary-alt); border: 1px solid var(--border); }
.turn-q .callout-t { color: var(--text-muted); font-size: 13px; }
.turn-q .qtext { font-size: 16px; font-weight: 550; color: var(--text); margin-top: 2px; }
.turn-q .quoted { border-left: 3px solid var(--border-strong); padding-left: 10px; color: var(--text-muted); font-size: 14px; margin: 4px 0 6px; }
.turn-a { --cc: var(--c-purple); }
.turn-a.queued { --cc: var(--c-gray); }
.turn-a.stopped { --cc: var(--c-red); }
.run-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12.5px; color: var(--text-muted); margin: 6px 0 8px; }
.run-line .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.run-line .stop { color: var(--text); border: 1px solid var(--border-strong); border-radius: 5px; padding: 1px 8px; display: inline-flex; gap: 5px; align-items: center; background: var(--bg-primary); }
.run-line .stop:hover { border-color: rgb(var(--c-red)); color: rgb(var(--c-red)); }
.tools { font: 12px/1.65 var(--font-mono); color: var(--text-muted); margin: 0 0 10px; padding: 6px 10px; background: var(--bg-primary-alt); border: 1px solid var(--border); border-radius: 5px; }
.tools summary { cursor: pointer; font-family: var(--font-ui); color: var(--text-muted); list-style: none; display: flex; align-items: center; gap: 6px; }
.tools summary::-webkit-details-marker { display: none; }
.tools[open] summary { margin-bottom: 4px; }
.tools .tl { display: flex; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools .tl b { font-weight: 500; color: var(--accent-text); }
.caret { display: inline-block; width: 7px; height: 1.05em; vertical-align: -2px; background: var(--accent); margin-left: 2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.ans-foot { display: flex; gap: 12px; font-size: 12px; color: var(--text-faint); margin-top: 10px; }
.src-list { font-size: 14px; }

/* branches block (generated) */
.gen { border: 1px solid var(--border); border-radius: 6px; margin: 0 0 18px; overflow: hidden; }
.gen-h { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-size: 12.5px; color: var(--text-muted); background: var(--bg-primary-alt); border-bottom: 1px solid var(--border); }
.gen-h b { color: var(--text); font-weight: 600; }
.gen-h .sp { flex: 1; }
.gen-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 14.5px; border-top: 1px solid var(--border); }
.gen-row:first-of-type { border-top: 0; }
.gen-row .wl { flex: 1; min-width: 0; }
.gen-row .anc { font-size: 12px; color: var(--text-muted); max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gen-row .anc mark { background: var(--mark); }

/* composer */
.composer { border: 1px solid var(--border-strong); border-radius: 8px; background: var(--bg-primary); margin: 22px 0 0; box-shadow: var(--shadow-s); position: relative; }
.composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.composer .ch { display: flex; align-items: center; gap: 6px; padding: 7px 10px 0; font-size: 12px; color: var(--text-muted); }
.composer .qchip { margin: 8px 10px 0; padding: 4px 8px 4px 10px; border-left: 3px solid var(--accent); background: var(--accent-softer); font-size: 13px; color: var(--text-muted); display: flex; gap: 6px; align-items: flex-start; border-radius: 0 4px 4px 0; }
.composer .qchip span { flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.composer textarea { display: block; width: 100%; border: 0; outline: none; resize: none; background: transparent; padding: 8px 12px 4px; font: 15px/1.5 var(--font-text); min-height: 44px; max-height: 200px; }
.composer textarea::placeholder, .search-in::placeholder, .prompt input::placeholder, .branch-pop textarea::placeholder { color: var(--placeholder); }
.composer .cf2 { display: flex; align-items: center; gap: 6px; padding: 4px 6px 6px 8px; }
.composer .cf2 .sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px; border-radius: 5px; color: var(--text-muted); font-size: 12.5px; white-space: nowrap; }
.chip:hover { background: var(--hover); color: var(--text); }
.chip .ag { width: 14px; height: 14px; border-radius: 3px; display: grid; place-items: center; font: 700 9px/1 var(--font-ui); color: #fff; }
.ag.cc { background: #c96442; } .ag.cx { background: #3a3a3a; } .ag.gk { background: #111; }
:root[data-theme="dark"] .ag.cx, :root[data-theme="dark"] .ag.gk { background: #555; }
.seg { display: inline-flex; background: var(--hover); border-radius: 6px; padding: 2px; }
.seg button { height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; color: var(--text-muted); }
.seg button.on { background: var(--bg-primary); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.btn { height: 28px; padding: 0 12px; border-radius: 6px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-strong); background: var(--bg-primary); color: var(--text); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.cta { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
.btn.cta:hover { background: var(--accent-hover); }
.btn.cta[disabled] { opacity: .45; cursor: default; }
.btn.lg { height: 34px; padding: 0 16px; font-size: 13.5px; }
[data-variant="b"] .note-composer { display: none; }
.composer-hint { font-size: 11.5px; color: var(--text-faint); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }

/* suggest popup (wikilink autocomplete) */
.suggest { position: fixed; z-index: 80; background: var(--bg-modal); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; width: 300px; max-height: 260px; overflow: auto; }
.suggest .it { padding: 6px 8px; border-radius: 5px; cursor: pointer; display: flex; flex-direction: column; }
.suggest .it small { color: var(--text-faint); font-size: 11.5px; }
.suggest .it.sel { background: var(--active); }

/* ---------- Right sidebar ---------- */
.rs-split { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.rs-top { flex: 1 1 60%; min-height: 0; display: flex; flex-direction: column; }
.rs-bot { flex: 0 0 40%; min-height: 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; }
.rs-bot .side-head { height: 34px; }
.rs-bot.hide { display: none; }
.pane-title { font-size: 12px; font-weight: 600; color: var(--text-muted); flex: 1; padding-left: 4px; }
.bl-group { margin-bottom: 8px; }
.bl-file { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 5px; font-weight: 600; color: var(--text); cursor: pointer; font-size: 12.5px; }
.bl-file:hover { background: var(--hover); }
.bl-file .cnt { margin-left: auto; font-weight: 500; color: var(--text-faint); font-size: 11px; background: var(--hover); border-radius: 8px; padding: 0 6px; }
.bl-ctx { margin: 2px 4px 6px 22px; padding: 6px 8px; border-radius: 5px; background: var(--bg-primary); border: 1px solid var(--border); font-size: 12.5px; line-height: 1.5; color: var(--text-muted); cursor: pointer; }
.bl-ctx:hover { border-color: var(--border-strong); }
.bl-ctx .wl { color: var(--accent-text); }
.bl-ctx mark { background: var(--mark); color: inherit; }
.ln-row { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 5px; color: var(--text-muted); cursor: pointer; font-size: 12.5px; }
.ln-row:hover { background: var(--hover); color: var(--text); }
.ln-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ln-row.unres .nm { opacity: .6; }
.ln-row small { color: var(--text-faint); }
.ot { display: flex; align-items: center; gap: 4px; padding: 3px 6px 3px calc(6px + var(--d, 0) * 14px); border-radius: 5px; color: var(--text-muted); cursor: pointer; font-size: 12.5px; }
.ot:hover { background: var(--hover); color: var(--text); }
.ot .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ot .ico { color: var(--text-faint); display: grid; }
.ot.cur { color: var(--accent-text); }
.local-graph { flex: 1; min-height: 0; position: relative; }
.local-graph canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* chat sidebar (variant b) */
.chatpane { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.chat-log { flex: 1; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.cmsg { font-size: 13px; line-height: 1.55; }
.cmsg.q { align-self: flex-end; background: var(--accent-soft); color: var(--text); padding: 7px 10px; border-radius: 10px 10px 2px 10px; max-width: 90%; }
.cmsg.a { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
.cmsg.a .meta { font-size: 11.5px; color: var(--text-faint); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
.cmsg.a p { margin: 0 0 8px; }
.cmsg .row-acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.cmsg .row-acts .btn { height: 24px; font-size: 11.5px; padding: 0 8px; }
.chat-ctx { font-size: 11.5px; color: var(--text-faint); padding: 8px 12px 0; display: flex; align-items: center; gap: 6px; }
.chatpane .composer { margin: 8px 10px 10px; }
.chatpane .composer textarea { font-size: 13.5px; min-height: 40px; }

/* ---------- Status bar ---------- */
.status { position: fixed; right: 0; bottom: 0; z-index: 30; display: flex; align-items: center; gap: 2px; padding: 3px 6px; background: var(--bg-secondary); border: 1px solid var(--border); border-right: 0; border-bottom: 0; border-top-left-radius: 8px; font-size: 12px; color: var(--text-muted); }
.status .si { padding: 2px 7px; border-radius: 4px; display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.status button.si:hover { background: var(--hover); color: var(--text); }

/* ---------- Popovers, modals, notices ---------- */
.sel-pop { position: fixed; z-index: 70; background: var(--bg-modal); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); padding: 4px; display: flex; gap: 2px; }
.sel-pop button { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 5px; font-size: 12.5px; color: var(--text); white-space: nowrap; }
.sel-pop button:hover, .sel-pop button:focus-visible { background: var(--hover); }
.sel-pop button .kbd { padding: 1px 4px; font-size: 10.5px; }
.sel-pop .sep { width: 1px; background: var(--border); margin: 4px 2px; }
.branch-pop { position: fixed; z-index: 71; width: 380px; background: var(--bg-modal); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 10px; }
.branch-pop .q { font-size: 12.5px; color: var(--text-muted); border-left: 3px solid var(--accent); padding: 2px 0 2px 8px; margin-bottom: 8px; max-height: 40px; overflow: hidden; }
.branch-pop textarea { width: 100%; border: 1px solid var(--border-strong); border-radius: 6px; padding: 7px 9px; background: var(--bg-primary); outline: none; resize: none; font-size: 14px; min-height: 54px; }
.branch-pop textarea:focus { border-color: var(--accent); }
.branch-pop .r { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--text-faint); }
.branch-pop .r .sp { flex: 1; }

.hover-pop { position: fixed; z-index: 75; width: 420px; max-height: 330px; overflow: hidden; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow); }
.hover-pop .hp-in { padding: 4px 22px 16px; font-size: 13.5px; transform-origin: top left; max-height: 330px; overflow: auto; }
.hover-pop .note { padding: 0; font-size: 13.5px; }
.hover-pop .inline-title { font-size: 19px; margin: 12px 0 8px; }
.hover-pop .props { display: none; }
.hover-pop .composer, .hover-pop .gen { display: none; }
.hover-pop .callout { padding: 8px 10px; }
.hover-pop .note-sm { font-size: 11.5px; color: var(--text-faint); padding: 8px 22px; border-top: 1px solid var(--border); background: var(--bg-secondary); }

.modal-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 85; display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
.prompt { width: min(640px, calc(100vw - 32px)); background: var(--bg-modal); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; max-height: 70vh; }
.prompt input { border: 0; border-bottom: 1px solid var(--border); background: transparent; padding: 14px 16px; font-size: 16px; outline: none; }
.prompt .res { overflow: auto; padding: 4px; flex: 1; }
.prompt .it { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-radius: 6px; cursor: pointer; min-height: 36px; }
.prompt .it.sel { background: var(--active); }
.prompt .it .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prompt .it .t b { color: var(--accent-text); font-weight: 600; }
.prompt .it small { color: var(--text-faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
.prompt .it .ic { color: var(--text-faint); display: grid; }
.prompt .it.ask .t { color: var(--accent-text); }
.prompt .foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border); color: var(--text-faint); font-size: 11.5px; flex-wrap: wrap; }
.prompt .foot span { display: inline-flex; gap: 5px; align-items: center; }
.prompt .grp { font-size: 11px; color: var(--text-faint); padding: 8px 12px 2px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }

.dialog { width: min(720px, calc(100vw - 32px)); background: var(--bg-modal); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: 76vh; overflow: hidden; }
.dialog-h { display: flex; align-items: center; padding: 14px 16px 10px; font-size: 16px; font-weight: 650; }
.dialog-h .sp { flex: 1; }
.dialog-b { overflow: auto; padding: 0 16px 16px; font-size: 13.5px; line-height: 1.55; }
.set-row { display: flex; gap: 14px; align-items: center; padding: 12px 0; border-top: 1px solid var(--border); }
.set-row .d { flex: 1; min-width: 0; }
.set-row .d small { color: var(--text-muted); display: block; font-size: 12.5px; }
.set-row code { font: 12px var(--font-mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.ok { color: rgb(var(--c-green)); display: inline-flex; gap: 4px; align-items: center; font-size: 12.5px; }
.warn { color: rgb(var(--c-orange)); display: inline-flex; gap: 4px; align-items: center; font-size: 12.5px; }

.notices { position: fixed; top: 48px; right: 14px; z-index: 95; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
.notice { background: var(--bg-modal); border: 1px solid var(--border); box-shadow: var(--shadow-s); padding: 9px 14px; border-radius: 7px; font-size: 13px; max-width: 320px; pointer-events: auto; animation: nin .18s ease-out; }
.notice b { font-weight: 600; }
@keyframes nin { from { opacity: 0; transform: translateY(-4px); } }

/* ---------- Empty tab / first run ---------- */
.empty-tab { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px 24px 80px; }
.empty-in { width: min(560px, 100%); }
.empty-in h2 { font-size: 22px; font-weight: 650; margin: 0 0 4px; letter-spacing: -.01em; }
.empty-in .sub { color: var(--text-muted); font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
.empty-in .composer { margin-top: 0; }
.empty-links { display: flex; flex-direction: column; gap: 2px; margin-top: 18px; }
.empty-links button { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 6px; color: var(--accent-text); font-size: 14px; text-align: left; }
.empty-links button:hover { background: var(--hover); }
.empty-links .kbd { margin-left: auto; }
.agent-row { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 12px; font-size: 12.5px; color: var(--text-muted); align-items: center; }
.agent-row .a { display: inline-flex; gap: 6px; align-items: center; }
.agent-row .lnk { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--accent-soft); }
.examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.examples button { border: 1px solid var(--border); border-radius: 14px; padding: 4px 10px; font-size: 12.5px; color: var(--text-muted); background: var(--bg-primary); }
.examples button:hover { border-color: var(--accent); color: var(--accent-text); }

.welcome { position: fixed; inset: 0; z-index: 60; background: var(--bg-primary); display: grid; grid-template-columns: 260px minmax(0, 1fr); }
.welcome .vlist { background: var(--bg-secondary); border-right: 1px solid var(--border); padding: 46px 10px 10px; display: flex; flex-direction: column; gap: 2px; }
.welcome .vlist .traffic { position: absolute; top: 14px; left: 14px; display: flex; gap: 6px; }
.welcome .vlist .traffic span { width: 12px; height: 12px; border-radius: 50%; background: var(--traffic-r); }
.welcome .vlist .traffic span:nth-child(2) { background: var(--traffic-y); } .welcome .vlist .traffic span:nth-child(3) { background: var(--traffic-g); }
.vitem { text-align: left; padding: 8px 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 1px; }
.vitem:hover { background: var(--hover); }
.vitem b { font-weight: 600; font-size: 13px; }
.vitem small { color: var(--text-faint); font-size: 11.5px; font-family: var(--font-mono); }
.welcome .wmain { display: flex; align-items: center; justify-content: center; padding: 32px 24px; overflow: auto; }
.wmark { width: 52px; height: 52px; border-radius: 13px; background: linear-gradient(140deg, var(--accent), #4b33b8); display: grid; place-items: center; color: #fff; margin-bottom: 18px; box-shadow: var(--shadow-s); }
.wmark svg { width: 28px; height: 28px; stroke-width: 2; }
.wsteps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
.wsteps div { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--text-muted); line-height: 1.45; }
.wsteps b { display: flex; gap: 6px; align-items: center; color: var(--text); font-size: 13px; margin-bottom: 3px; }
.wsep { display: flex; align-items: center; gap: 10px; color: var(--text-faint); font-size: 12px; margin: 22px 0 10px; }
.wsep::before, .wsep::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.wopts { display: grid; gap: 0; border: 1px solid var(--border); border-radius: 8px; }
.wopt { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--border); }
.wopt:first-child { border-top: 0; }
.wopt .d { flex: 1; min-width: 0; }
.wopt .d b { display: block; font-weight: 600; font-size: 13.5px; }
.wopt .d small { color: var(--text-muted); font-size: 12.5px; }
.wopt.star { background: var(--accent-softer); }
.welcome .wstarter { display: none; }
[data-variant="e"] .welcome .wstarter { display: flex; }
[data-variant="e"] .welcome .wsample-plain { display: none; }

/* ---------- Graph view ---------- */
.graph-wrap { position: absolute; inset: 0; background: var(--graph-bg); }
.graph-wrap canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
.graph-wrap canvas.dragging { cursor: grabbing; }
.graph-ctl { position: absolute; top: 10px; right: 10px; width: 230px; background: var(--bg-modal); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-s); font-size: 12.5px; }
.graph-ctl.closed .gc-b { display: none; }
.gc-h { display: flex; align-items: center; justify-content: flex-end; padding: 4px; gap: 2px; }
.graph-ctl:not(.closed) .gc-h { border-bottom: 1px solid var(--border); }
.gc-b { padding: 6px 12px 10px; }
.gc-b .gsec { font-weight: 600; color: var(--text-muted); margin: 8px 0 4px; display: flex; align-items: center; gap: 6px; }
.tgl { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; color: var(--text); cursor: pointer; }
.tgl input { appearance: none; width: 30px; height: 17px; border-radius: 9px; background: var(--border-strong); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.tgl input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.tgl input:checked { background: var(--accent); }
.tgl input:checked::after { transform: translateX(13px); }
.gsw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.glegend { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); background: var(--bg-modal); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; flex-wrap: wrap; }

/* ---------- Canvas view ---------- */
.cv-wrap { position: absolute; inset: 0; overflow: hidden; background-color: var(--bg-primary); background-image: radial-gradient(var(--canvas-dot) 1.2px, transparent 1.3px); background-size: 22px 22px; cursor: grab; }

.cv-edges path { fill: none; stroke: var(--text-faint); stroke-width: 2; }
.cv-edges path.acc { stroke: var(--accent); }
.cv-edges text { fill: var(--text-muted); font-size: 12px; font-family: var(--font-ui); }
.cv-card { position: absolute; background: var(--bg-primary); border: 2px solid var(--border-strong); border-radius: 10px; box-shadow: var(--shadow-s); overflow: hidden; display: flex; flex-direction: column; }

.cv-card.run { border-color: var(--accent); }
.cv-card.hl { border-color: rgba(var(--c-yellow), .9); background: rgba(var(--c-yellow), .08); }
.cv-card .cvh { font-size: 12px; color: var(--text-muted); padding: 6px 10px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; align-items: center; cursor: move; background: var(--bg-primary-alt); }

.cv-card .cvb { padding: 8px 12px; font-size: 13px; line-height: 1.5; overflow: hidden; flex: 1; }

.cv-ctl { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; background: var(--bg-modal); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-s); padding: 3px; gap: 2px; }

/* ---------- Mobile (≤ 760px) ---------- */
.drawer-scrim { display: none; }
@media (max-width: 760px) {

  .side.right { right: 0; }

  #app.m-right .side.right { display: flex !important; }

  .welcome { grid-template-columns: minmax(0, 1fr); }

  .note th, .note td { padding: 5px 7px; }
  .ans-scroll { overflow-x: auto; }

.vswitch span { color: var(--text-faint); padding: 0 6px; }
.vswitch button { padding: 4px 8px; border-radius: 6px; color: var(--text-muted); }

.main { grid-column: 3; grid-row: 1; }
.side.right { grid-column: 4; grid-row: 1; }
@media (max-width: 760px) { .main { grid-column: 1; } }

.embed-h .wl { font-weight: 500; }
.embed-id { font-family: var(--font-mono); font-size: 11.5px; }

.search-in:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ol .row .fold { position: absolute; left: -20px; top: 4px; transform: none; margin: 0; }

.ol .task { margin: 5px 4px 0 1px; }
.welcome[hidden] { display: none; }
.ag { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; font: 700 9.5px/1 var(--font-ui); color: #fff; flex: none; vertical-align: -3px; }
.chip .ag { width: 15px; height: 15px; }
.pill .ag { width: 14px; height: 14px; font-size: 8.5px; margin-left: -4px; }
.callout-t > span { white-space: nowrap; }
.hover-pop .callout-t .acts { display: none; }
.hover-pop .callout-t .meta { flex: 1; }
.cv-card mark { background: var(--mark); color: inherit; }
.graph-ctl.closed { width: auto; }
.welcome .wmain { align-items: flex-start; }
.welcome .wmain > .empty-in { margin: auto 0; position: relative; }
.side.left .side-head { padding-left: 30px; }

.examples button { text-align: left; }

.prompt .it.indent2 { padding-left: 56px; }

.mbar { display: none; }
@media (max-width: 760px) {
  #app { bottom: 50px; }

  .side.left, .side.right { bottom: 50px; }

.note-composer { pointer-events: none; } .note-composer > * { pointer-events: auto; }
.composer { container-type: inline-size; }

@container (max-width: 470px) { .seg-l, .chip .cm { display: none; } }

.note-composer { container-type: inline-size; }
@container (max-width: 560px) { .composer-hint { display: none; } }

}

}

function onRunsChanged() { renderLeft(); renderStatus(); $$(".leaf").forEach((el) => { const l = S.leaves[+el.dataset.leaf]; if (!l) return; $$(".tab", el).forEach((t, k) => { const x = l.tabs[k]; const xn = x && byId(x.id); const st = xn && runState(xn); const d = $(".st", t); if (d && !st) d.remove(); }); }); refreshGens(); }

    $$(".gen", el).forEach((g) => { const nb = g.closest(".note") && n.blocks.find((b) => b.t === "branches" || b.t === "runs"); if (!nb) return; const html = nb.t === "runs" ? runsHTML() : branchesHTML(n); if (html) g.outerHTML = html; });

/* ---------- Creating notes and asks ---------- */
function titleFrom(q) {

}
function createAskNote(q, o) {

  if (o.branchOf) n.props.push(["branch-of", o.branchOf]); if (o.from) n.props.push(["from", o.from]);
  n.props.push(["agent", agent], ["created", "2026-10-11 " + nowHM()]);
  if (o.embed) n.blocks.push(o.embed);
  const a = newAns(agent, cannedFor(q));
  n.blocks.push({ t: "ask", q, time: nowHM(), quote: o.quote }, a, { t: "composer" });
  notes().push(n);
  if (n.folder && !V().folders.includes(n.folder)) V().folders.push(n.folder);

}
function sendFrom(key, forceAlt) {

    const n = byId(id); const log = S.chat[id] = S.chat[id] || [];
    const a = newAns(S.agent, cannedFor(q)); const m = { q, quote: quote && quote.text, a }; log.push(m);
    renderRight(); const i = log.length - 1;
    startRun(a, () => { const el = $('[data-chat="' + id + "|" + i + '"]'); if (el) { const tmp = document.createElement("div"); tmp.innerHTML = chatMsgHTML(n, m, i); el.replaceWith(tmp.children[1]); const cl = $("#chatLog"); if (cl) cl.scrollTop = cl.scrollHeight; } else renderRight(); });
