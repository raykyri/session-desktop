<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session · Ulysses-style</title>
<meta name="description" content="Influence: Ulysses. Library, sheet list and editor panes; chats are sheets; glued sheets form a manuscript and its outline.">
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ed-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg-lib:#ECECEE; --bg-list:#F7F7F8; --bg-ed:#FFFFFF; --bg-insp:#F5F5F6;
  --line:#DADADF; --line-soft:#E8E8EC;
  --text:#1D1D1F; --text-2:#56565E; --text-3:#8A8A93;
  --markup:#A5ADB8; --markup-strong:#8E98A5;
  --accent:#B87A00; --gold:#E9AE2B; --accent-bg:#FCE9AC; --accent-soft:#FDF5DC;
  --sel-lib:#D8D8DE; --sel-list:#E7E7EB; --sel-list-focus:#FBEFC9;
  --hover:rgba(0,0,0,.04);
  --card:#FFFFFF; --card-line:#E3E3E8;
  --bubble:#F1F1F4;
  --run:#2E8B57; --queued:#8A8A93; --err:#C2410C;
  --focus:#2F6FEB;
  --hud-bg:rgba(32,32,35,.96); --hud-text:#F4F4F5; --hud-dim:#A1A1AA;
  --shadow:0 8px 28px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08);
  --tl-red:#FF5F57; --tl-yel:#FEBC2E; --tl-grn:#28C840;
  --scrim:rgba(0,0,0,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-lib:#1E1E21; --bg-list:#232326; --bg-ed:#1A1A1C; --bg-insp:#222225;
    --line:#35353A; --line-soft:#2B2B30;
    --text:#E7E7EA; --text-2:#B0B0B8; --text-3:#7A7A84;
    --markup:#5F6874; --markup-strong:#76808C;
    --accent:#E8B54E; --gold:#E2AA3C; --accent-bg:rgba(232,181,78,.30); --accent-soft:rgba(232,181,78,.10);
    --sel-lib:#34343A; --sel-list:#2E2E33; --sel-list-focus:rgba(232,181,78,.16);
    --hover:rgba(255,255,255,.05);
    --card:#29292D; --card-line:#38383E;
    --bubble:#2A2A2F;
    --run:#4CB97A; --queued:#8A8A93; --err:#F08A5D;
    --focus:#5B8DEF;
    --hud-bg:rgba(54,54,58,.97); --hud-text:#F4F4F5; --hud-dim:#A1A1AA;
    --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
    --scrim:rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-lib:#1E1E21; --bg-list:#232326; --bg-ed:#1A1A1C; --bg-insp:#222225;
  --line:#35353A; --line-soft:#2B2B30;
  --text:#E7E7EA; --text-2:#B0B0B8; --text-3:#7A7A84;
  --markup:#5F6874; --markup-strong:#76808C;
  --accent:#E8B54E; --gold:#E2AA3C; --accent-bg:rgba(232,181,78,.30); --accent-soft:rgba(232,181,78,.10);
  --sel-lib:#34343A; --sel-list:#2E2E33; --sel-list-focus:rgba(232,181,78,.16);
  --hover:rgba(255,255,255,.05);
  --card:#29292D; --card-line:#38383E;
  --bubble:#2A2A2F;
  --run:#4CB97A; --queued:#8A8A93; --err:#F08A5D;
  --focus:#5B8DEF;
  --hud-bg:rgba(54,54,58,.97); --hud-text:#F4F4F5; --hud-dim:#A1A1AA;
  --shadow:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg-ed);color:var(--text);font:13px/1.4 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:4px}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mk{color:var(--markup);font-weight:400}
kbd{font:11px var(--ui);color:var(--text-3);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--bg-list)}

/* ---------- window ---------- */
.app{display:flex;height:100vh;width:100vw;overflow:hidden;position:relative}
.pane{display:flex;flex-direction:column;min-height:0}
.lib{width:212px;flex:none;background:var(--bg-lib);border-right:1px solid var(--line)}
.list{width:292px;flex:none;background:var(--bg-list);border-right:1px solid var(--line);min-width:0}
.ed{flex:1;min-width:0;background:var(--bg-ed);position:relative}
.insp{width:272px;flex:none;background:var(--bg-insp);border-left:1px solid var(--line);display:none}
.app.insp-open .insp{display:flex}
.app.nolib .lib,[data-variant="d"] .lib{display:none}
.bar{height:50px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px}
.tl{display:flex;gap:8px;padding-left:4px}
.tl i{width:12px;height:12px;border-radius:50%;display:block}
.tl i:nth-child(1){background:var(--tl-red)}.tl i:nth-child(2){background:var(--tl-yel)}.tl i:nth-child(3){background:var(--tl-grn)}
.ibtn{width:28px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text-2)}
.ibtn:hover{background:var(--hover);color:var(--text)}
.ibtn[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.mback{display:none}
.spacer{flex:1}

/* ---------- library ---------- */
.lib .bar{justify-content:space-between}
.ws{display:flex;align-items:center;gap:4px;margin:2px 10px 6px;padding:4px 6px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--text-3);text-transform:uppercase;text-align:left;max-width:calc(100% - 20px)}
.ws span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws:hover{background:var(--hover);color:var(--text-2)}
.ws .i{width:12px;height:12px}
.libnav{flex:1;overflow:auto;padding:0 8px 12px}
.lsec{font-size:11px;font-weight:600;color:var(--text-3);padding:12px 8px 4px;letter-spacing:.02em}
.lnav{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:6px;color:var(--text);text-align:left;font-size:13px}
.lnav .i{color:var(--text-3)}
.lnav .ct{margin-left:auto;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.lnav:hover{background:var(--hover)}
.lnav[aria-current="true"]{background:var(--sel-lib)}
.lnav[aria-current="true"] .i{color:var(--accent)}
.lnav .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnav.sub{padding-left:24px}
.lnav .dot{width:6px;height:6px;border-radius:50%;background:var(--run);margin-left:auto}
.lfoot{border-top:1px solid var(--line);padding:6px 8px;display:flex;align-items:center;gap:2px}
.agents{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;font-size:11.5px;color:var(--text-2);margin-left:auto}
.agents:hover{background:var(--hover)}
.adots{display:flex;gap:3px}
.adots i{width:6px;height:6px;border-radius:50%;background:var(--run);display:block}
.adots i.off{background:transparent;box-shadow:inset 0 0 0 1px var(--text-3)}

/* ---------- sheet list ---------- */
.list .bar{border-bottom:1px solid var(--line-soft);padding-left:14px}
.tl-list{display:none;margin-right:10px}
.app.nolib .tl-list,[data-variant="d"] .tl-list{display:flex}
.lhead{min-width:0;flex:1}
.lhead h2{margin:0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead p{margin:0;font-size:11px;color:var(--text-3)}
.grpsw{display:none;align-items:center;gap:4px;border-radius:6px;padding:2px 4px;margin-left:-4px;max-width:100%}
.grpsw:hover{background:var(--hover)}
[data-variant="d"] .grpsw,.app.nolib .grpsw{display:inline-flex}
[data-variant="d"] .lhead h2.plain,.app.nolib .lhead h2.plain{display:none}
.grpsw .i{width:12px;height:12px;color:var(--text-3)}
.lbody{flex:1;overflow:auto;padding:4px 0 24px}
.chipbar{display:flex;align-items:center;gap:6px;padding:8px 14px 4px;font-size:11.5px;color:var(--text-2)}
.chipbar button{display:inline-flex;align-items:center;gap:4px;border-radius:10px;background:var(--accent-soft);color:var(--accent);padding:2px 6px 2px 8px}
.chipbar .i{width:11px;height:11px}
.si{position:relative;display:block;width:100%;text-align:left;padding:11px 14px 11px 16px;border-bottom:1px solid var(--line-soft);cursor:default}
.si:hover{background:var(--hover)}
.si[aria-selected="true"]{background:var(--sel-list)}
.list:focus-within .si[aria-selected="true"]{background:var(--sel-list-focus)}
.si .t{display:flex;gap:8px;align-items:baseline}
.si .tt{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.si .tt .q{color:var(--markup-strong);font-weight:600;margin-right:3px}
.si .dt{font-size:11px;color:var(--text-3);white-space:nowrap}
.si .ex{margin-top:3px;color:var(--text-2);font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.si .ft{display:flex;align-items:center;gap:6px;margin-top:6px;min-height:16px;flex-wrap:wrap}
.kw{font-size:11px;color:var(--text-3)}
.kw::before{content:"#";color:var(--markup)}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-3);white-space:nowrap}
.stat.run{color:var(--run)}
.stat .pd{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
.stat .qd{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.3px currentColor}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.ring{margin-left:auto;width:16px;height:16px}
.ring circle{fill:none;stroke-width:2.2}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--gold);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.si.gn::after{content:"";position:absolute;left:5px;top:50%;bottom:-1px;width:3px;border-radius:2px 2px 0 0;background:var(--gold);opacity:.85}
.si.gp::before{content:"";position:absolute;left:5px;top:0;height:50%;width:3px;border-radius:0 0 2px 2px;background:var(--gold);opacity:.85}
.si.gp{border-top:1px dashed var(--line)}
.lempty{padding:40px 22px;text-align:center;color:var(--text-3);font-size:12.5px;line-height:1.5}
.lempty b{display:block;color:var(--text-2);font-size:13px;margin-bottom:4px}
.lempty button{margin-top:12px;color:var(--accent);font-weight:500}
.mquote{font-size:12.5px;line-height:1.45;color:var(--text)}
.mquote mark{background:var(--accent-bg);color:inherit;border-radius:2px;padding:0 1px}

/* ---------- editor ---------- */
.ed .bar{gap:4px;border-bottom:1px solid transparent}
.ed.scrolled .bar{border-bottom-color:var(--line-soft)}
.crumb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-3);min-width:0;overflow:hidden;white-space:nowrap;flex:1 1 auto}
.crumb button{color:var(--text-3);overflow:hidden;text-overflow:ellipsis;max-width:220px;padding:2px 4px;border-radius:4px}
.crumb button:hover{color:var(--text);background:var(--hover)}
.crumb .i{width:10px;height:10px;color:var(--markup)}
.seg{display:inline-flex;background:var(--hover);border-radius:7px;padding:2px;flex:none}
.seg button{font-size:12px;padding:3px 10px;border-radius:5px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--bg-ed);color:var(--text);box-shadow:0 0 0 .5px var(--line),0 1px 2px rgba(0,0,0,.08)}
.tools{display:flex;gap:2px;flex:1 1 auto;justify-content:flex-end}
.escroll{flex:1;overflow:auto;position:relative}
.doc{position:relative;width:min(100%,720px);margin:0 auto;padding:36px 44px 12vh;font:17px/1.62 var(--ed-font);letter-spacing:.002em}
.doc.has-margin{width:min(100%,1000px);padding-left:44px;padding-right:288px}
.doc p,.doc li{margin:0 0 .85em}
.doc h1,.doc h2,.doc h3{position:relative;font-weight:650;line-height:1.3;letter-spacing:-.005em}
.doc h1{font-size:25px;margin:0 0 .8em}
.doc h2{font-size:19px;margin:1.5em 0 .5em}
.doc h3{font-size:17px;margin:1.3em 0 .4em}
.hm{position:absolute;right:100%;margin-right:10px;color:var(--markup);font-weight:400;white-space:nowrap}
.doc ul,.doc ol{padding-left:1.1em;margin:0 0 1em}
.doc ul{list-style:none}
.doc ul>li{position:relative}
.doc ul>li::before{content:"-";position:absolute;left:-1.1em;color:var(--markup)}
.doc ol>li::marker{color:var(--markup)}
.doc table{border-collapse:collapse;font-size:15px;margin:.4em 0 1.2em;width:100%;max-width:440px;font-variant-numeric:tabular-nums}
.doc th,.doc td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line-soft)}
.doc th{font-weight:600;font-size:13px;color:var(--text-2)}
.doc strong .mk{font-weight:400}
mark.hl{background:var(--accent-bg);color:inherit;border-radius:2px;padding:0 1px}
mark.hl .mk{font-size:.9em}
mark.flash{box-shadow:0 0 0 3px var(--gold)}
.wl{color:inherit;text-decoration:underline;text-decoration-color:var(--markup);text-underline-offset:3px;cursor:pointer;border-radius:2px}
.wl:hover{background:var(--accent-soft)}
.wl.missing{color:var(--text-3)}
.cite{font-size:.68em;color:var(--accent);margin-left:1px;cursor:default}
.bref{font-size:.62em;font-weight:700;color:var(--accent);margin-left:2px;cursor:pointer;padding:0 2px;border-radius:3px;vertical-align:super;line-height:0}
.bref:hover{background:var(--accent-soft)}
.blockq{border-left:2px solid var(--markup);padding-left:14px;color:var(--text-2);margin:0 0 1em}

/* turns */
.turn{position:relative;margin-bottom:1.6em}
.turn-q{position:relative;font-weight:620;font-size:17px;line-height:1.45;margin:2em 0 .6em}
.turn-q .hm{font-weight:500;color:var(--markup-strong)}
.turn-q.first{font-size:25px;line-height:1.3;margin-top:0}
.qquote{display:block;font-weight:400;font-size:14px;color:var(--text-2);margin:0 0 4px;font-style:italic}
.qquote::before{content:"> ";color:var(--markup);font-style:normal}
.meta{font-size:12px;color:var(--text-3);margin:0 0 1em;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-family:var(--ui)}
.meta .ag{display:inline-flex;align-items:center;gap:5px}
.meta .ag .i{width:13px;height:13px}
.runline{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;font:12px/1.4 var(--ui);color:var(--text-2);background:var(--accent-soft);border-radius:8px;padding:7px 10px;margin:0 0 1em}
.runline .stat{font-size:12px}
.runline .grow{flex:1}
.lnk{color:var(--accent);font-weight:500;font-size:12px;padding:1px 4px;border-radius:4px}
.lnk:hover{background:var(--accent-soft)}
.acts{list-style:none;margin:0 0 1em;padding:8px 12px;font:12px/1.6 var(--mono);color:var(--text-2);background:var(--bubble);border-radius:8px}
.acts li{margin:0}
.acts li::before{display:none}
.acts .tn{color:var(--accent)}
.answer.live>p:last-child::after,.answer.live>h2:last-child::after,.answer.live>ul:last-child>li:last-child::after{content:"";display:inline-block;width:8px;height:1.05em;background:var(--gold);vertical-align:-2px;margin-left:3px;animation:pulse 1s steps(2) infinite}
.answer.live:empty::before{content:"Waiting for first output…";color:var(--text-3);font-size:15px}
.afoot{display:flex;flex-wrap:wrap;gap:4px 12px;font:12px var(--ui);color:var(--text-3);margin:.2em 0 0;align-items:center}
.afoot button{color:var(--text-3);padding:1px 4px;border-radius:4px}
.afoot button:hover{color:var(--text);background:var(--hover)}
.summary{font-size:15px;line-height:1.55;background:var(--bubble);border-radius:8px;padding:10px 14px;margin:0 0 1.2em;color:var(--text)}
.summary .lab{display:block;font:600 11px var(--ui);color:var(--text-3);margin-bottom:2px;letter-spacing:.02em}
.sheet-title{display:none}
.usernote{position:relative}
.usernote::before{content:"¶";position:absolute;right:100%;margin-right:10px;color:var(--markup)}
.linkcard{border:1px solid var(--card-line);border-radius:10px;padding:14px 16px;margin:0 0 1.2em;font-family:var(--ui);background:var(--card)}
.linkcard .u{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.linkcard .h{font-size:15px;font-weight:600;margin:4px 0}
.linkcard .x{font-size:13px;color:var(--text-2)}
.post{font-size:21px;line-height:1.45;margin:0 0 .6em}
.glued-next{margin-top:2.4em;padding-top:12px;border-top:1px dashed var(--line);font:12px var(--ui);color:var(--text-3);display:flex;gap:8px;align-items:center}
.glued-next .i{color:var(--gold)}

/* variant b: bubbles */
[data-variant="b"] .turn-q{margin-left:auto;max-width:82%;width:fit-content;background:var(--bubble);border-radius:16px 16px 4px 16px;padding:9px 14px;font-size:15.5px;font-weight:500}
[data-variant="b"] .turn-q.first{font-size:15.5px;line-height:1.45;margin-top:.4em}
[data-variant="b"] .turn-q .hm{display:none}
[data-variant="b"] .turn .meta{justify-content:flex-start}
[data-variant="b"] .sheet-title{display:block}
[data-variant="b"] .cmp{border:1px solid var(--line);border-radius:14px;padding:10px 12px 8px}
[data-variant="b"] .cmp .hm{display:none}

/* margin notes (branches) */
.mnote{display:block;font:12.5px/1.45 var(--ui);color:var(--text-2);border-left:2px solid var(--gold);padding:2px 0 2px 10px;margin:-.2em 0 1.2em;cursor:pointer;text-align:left;width:100%}
.mnote:hover .mn-t{color:var(--accent)}
.mnote.hot{background:var(--accent-soft)}
.doc.has-margin .mnote{position:absolute;right:24px;width:236px;margin:0;transition:top .15s}
.mn-h{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--text-3);margin-bottom:2px}
.mn-n{font-weight:700;color:var(--accent)}
.mn-t{font-weight:600;color:var(--text)}
.mn-x{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
[data-variant="c"] .mnote{display:none}

/* composer */
.cmp{position:relative;margin-top:2.2em;font-family:var(--ed-font)}
.cmp .hm{top:2px;font-weight:600}
.cmp .hm button{color:var(--markup-strong);font-weight:600;font-size:17px;border-radius:4px;padding:0 3px}
.cmp .hm button:hover{background:var(--hover);color:var(--accent)}
.cmp textarea{width:100%;border:0;background:transparent;resize:none;font:17px/1.6 var(--ed-font);padding:0;min-height:1.6em;overflow:hidden;display:block}
.cmp textarea::placeholder{color:var(--text-3)}
.cmp textarea:focus-visible{outline:none}
.cmp:focus-within .hm button{color:var(--accent)}
.welcome .cmp:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--accent-soft)}
.cmp .hint{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;font:11.5px var(--ui);color:var(--text-3);margin-top:6px;opacity:.85}
.cmp:focus-within .hint{opacity:1}
.cmp .chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 6px;color:var(--text-2);margin-left:auto;font-size:11.5px}
.cmp .chip:hover{background:var(--hover)}
.cmp .chip .i{width:12px;height:12px}
.cmp .qchip{display:flex;align-items:flex-start;gap:6px;font:13px/1.4 var(--ui);color:var(--text-2);margin-bottom:6px;font-style:italic}
.cmp .qchip button{font-style:normal;color:var(--text-3)}
.typewriter .doc{padding-bottom:30vh}

/* welcome */
.welcome{max-width:560px}
.welcome .eb{font:600 11px var(--ui);color:var(--text-3);letter-spacing:.04em;text-transform:uppercase;margin-bottom:14px}
.welcome .lead{color:var(--text-2)}
.welcome .cmp{border:1px solid var(--line);border-radius:12px;padding:14px 16px 10px 36px;margin:1.6em 0;background:var(--card)}
.welcome .cmp .hm{right:auto;left:14px;top:14px;margin:0}
.agentrow{display:flex;flex-wrap:wrap;gap:6px 14px;font:12.5px var(--ui);color:var(--text-2);margin:0 0 2em;align-items:center}
.agentrow span{display:inline-flex;align-items:center;gap:6px}
.agentrow i{width:7px;height:7px;border-radius:50%;background:var(--run);display:inline-block}
.agentrow i.off{background:transparent;box-shadow:inset 0 0 0 1.3px var(--text-3)}
.gloss{font:13px/1.5 var(--ui);display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;padding:14px 0 0;border-top:1px solid var(--line-soft)}
.gloss dt{font-weight:600}
.gloss dd{margin:0;color:var(--text-2)}

/* outline */
.ol-head{margin-bottom:18px;font-family:var(--ui)}
.ol-head h1{font:650 22px/1.3 var(--ed-font);margin:0 0 4px}
.ol-head p{margin:0;font-size:12.5px;color:var(--text-3)}
.otree{font:15px/1.4 var(--ed-font);margin:0;padding:0}
.orow{display:flex;align-items:center;gap:6px;padding:4px 6px 4px calc(6px + var(--d) * 22px);border-radius:6px;position:relative;cursor:default;min-height:30px}
.orow:hover{background:var(--hover)}
.orow:focus-visible{outline-offset:-2px}
.orow.sel{background:var(--sel-list)}
.orow .tw{width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-3);flex:none;border-radius:4px}
.orow .tw .i{width:10px;height:10px;transition:transform .12s}
.orow[aria-expanded="true"] .tw .i{transform:rotate(90deg)}
.orow .gl{color:var(--markup);font-size:13px;min-width:20px;flex:none;font-weight:500}
.orow .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow.k-sheet .lb{font-weight:650;font-size:16px}
.orow.k-h2 .lb{font-weight:600}
.orow .om{font:11.5px var(--ui);color:var(--text-3);white-space:nowrap}
.orow .oa{display:none;gap:2px}
.orow:hover .oa,.orow:focus-within .oa,.orow.sel .oa{display:inline-flex}
.orow .oa button{font:11.5px var(--ui);color:var(--text-2);padding:2px 6px;border-radius:4px}
.orow .oa button:hover{background:var(--bg-ed);color:var(--accent)}
.orow .grip{opacity:0;color:var(--text-3);cursor:grab;width:12px;flex:none}
.orow:hover .grip{opacity:1}
.orow.drop-before{box-shadow:inset 0 2px 0 var(--gold)}
.orow.drop-after{box-shadow:inset 0 -2px 0 var(--gold)}
.orow.dragging{opacity:.4}
.oseam{height:1px;border-top:1px dashed var(--line);margin:8px 0 8px 6px}
.ohint{font:12px var(--ui);color:var(--text-3);margin-top:22px;display:flex;gap:14px;flex-wrap:wrap}

/* links view */
.lv h1{font:650 22px/1.3 var(--ed-font);margin:0 0 4px}
.lv .sub{font:12.5px var(--ui);color:var(--text-3);margin:0 0 14px}
.map{width:100%;height:auto;display:block;margin:0 0 18px;font-family:var(--ui)}
.map .edge{stroke:var(--line);stroke-width:1.2;fill:none}
.map .edge.k{stroke-dasharray:3 3}
.map .edge.b{stroke:var(--gold)}
.map .nd rect{fill:var(--card);stroke:var(--card-line)}
.map .nd text{fill:var(--text);font-size:12px}
.map .nd .kd{fill:var(--text-3);font-size:10px}
.map .nd{cursor:pointer}
.map .nd:hover rect,.map .nd:focus-visible rect{stroke:var(--gold)}
.map .nd:focus{outline:none}
.map .ctr rect{fill:var(--accent-soft);stroke:var(--gold)}
.map .el{fill:var(--text-3);font-size:10px}
.lcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px 28px;font-family:var(--ui)}
.lcol h3{font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.03em;text-transform:uppercase;margin:0 0 6px}
.lcol ul{list-style:none;padding:0;margin:0}
.lcol li{margin:0;padding:0}
.lcol li::before{display:none}
.lcol button{display:block;width:100%;text-align:left;font-size:13.5px;padding:5px 6px;border-radius:6px;line-height:1.35}
.lcol button:hover{background:var(--hover)}
.lcol button small{display:block;color:var(--text-3);font-size:11.5px}
.lcol .none{font-size:12.5px;color:var(--text-3);padding:5px 6px}

/* inspector */
.insp .bar{border-bottom:1px solid var(--line-soft);padding:0 8px 0 14px}
.insp .bar h3{margin:0;font-size:12px;font-weight:600;color:var(--text-2);flex:1}
.ibody{flex:1;overflow:auto;padding:10px 10px 24px}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.card h4{margin:0 0 6px;font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.card h4 .i{width:13px;height:13px}
.kchips{display:flex;flex-wrap:wrap;gap:5px}
.kchip{display:inline-flex;align-items:center;gap:3px;font-size:12px;background:var(--bubble);border-radius:10px;padding:2px 4px 2px 8px}
.kchip>button:first-child::before{content:"#";color:var(--markup)}
.kchip .x{color:var(--text-3);width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.kchip .x:hover{background:var(--hover);color:var(--text)}
.kchip .x .i{width:9px;height:9px}
.kadd{border:0;background:transparent;font-size:12px;padding:2px 4px;width:100%;margin-top:6px;border-bottom:1px dashed var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv dt{color:var(--text-3)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.card .cbtn{margin-top:8px;font-size:12px;color:var(--accent);font-weight:500;display:inline-flex;align-items:center;gap:4px;padding:2px 4px;border-radius:4px}
.card .cbtn:hover{background:var(--accent-soft)}
.card .cbtn .i{width:12px;height:12px}
.goal{display:flex;align-items:center;gap:12px;font-size:12px}
.goal svg{width:44px;height:44px}
.goal b{font-size:14px;display:block}
.blist{list-style:none;margin:0;padding:0}
.blist button{display:flex;gap:8px;width:100%;text-align:left;padding:6px 4px;border-radius:6px;font-size:12.5px;line-height:1.35;align-items:flex-start}
.blist button:hover{background:var(--hover)}
.blist .n{font-weight:700;color:var(--accent);min-width:10px}
.blist small{display:block;color:var(--text-3);font-size:11px;margin-top:2px}
.cnote{width:100%;border:0;background:transparent;resize:vertical;font-size:12.5px;line-height:1.45;min-height:54px;padding:0}
.chelp{font-size:11.5px;color:var(--text-3);margin:6px 0 0}

/* overlays */
.hud{position:fixed;z-index:50;display:none;align-items:center;gap:2px;background:var(--hud-bg);color:var(--hud-text);border-radius:9px;padding:4px;box-shadow:var(--shadow);font-size:12.5px}
.hud.on{display:flex}
.hud button{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:6px;color:var(--hud-text)}
.hud button:hover,.hud button:focus-visible{background:rgba(255,255,255,.12)}
.hud kbd{background:transparent;border-color:rgba(255,255,255,.22);color:var(--hud-dim)}
.hud .sep{width:1px;height:16px;background:rgba(255,255,255,.18);margin:0 2px}
.hud input{background:transparent;border:0;color:var(--hud-text);width:300px;padding:5px 8px;font-size:13px}
.hud input::placeholder{color:var(--hud-dim)}
.scrim{position:fixed;inset:0;z-index:60;display:none;background:var(--scrim)}
.scrim.on{display:block}
.qo{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--card);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--card-line);z-index:61;display:none;overflow:hidden}
.qo.on{display:block}
.qo .qi{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.qo .qi .i{color:var(--text-3)}
.qo input{flex:1;border:0;background:transparent;font-size:16px}
.qo ul{list-style:none;margin:0;padding:6px;max-height:min(420px,60vh);overflow:auto}
.qo .qs{font-size:11px;font-weight:600;color:var(--text-3);padding:8px 8px 4px;text-transform:uppercase;letter-spacing:.03em}
.qo .qr{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer}
.qo .qr .i{color:var(--text-3)}
.qo .qr .m{margin-left:auto;font-size:11.5px;color:var(--text-3);white-space:nowrap;padding-left:8px}
.qo .qr .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qo .qr[aria-selected="true"]{background:var(--sel-list-focus)}
.qo .qf{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--text-3)}
.pop{max-height:min(460px,70vh);overflow:auto;position:fixed;z-index:55;background:var(--card);border:1px solid var(--card-line);border-radius:10px;box-shadow:var(--shadow);display:none;min-width:220px;max-width:min(340px,calc(100vw - 24px));padding:6px;font-size:13px}
.pop.on{display:block}
.pop .ph{font-size:11px;font-weight:600;color:var(--text-3);padding:6px 8px 4px;text-transform:uppercase;letter-spacing:.03em}
.pop .pi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:6px}
.pop .pi:hover,.pop .pi:focus-visible{background:var(--sel-list)}
.pop .pi .m{margin-left:auto;color:var(--text-3);font-size:11.5px}
.pop .pi .ck{width:14px;color:var(--accent)}
.pop hr{border:0;border-top:1px solid var(--line-soft);margin:4px 2px}
.pop p{margin:4px 8px 8px;color:var(--text-2);font-size:12px;line-height:1.45}
.pop code{font:11.5px var(--mono);background:var(--bubble);padding:1px 5px;border-radius:4px}
.pop .ag{display:grid;grid-template-columns:10px 1fr auto;gap:2px 8px;align-items:center;padding:6px 8px}
.pop .ag i{width:7px;height:7px;border-radius:50%;background:var(--run)}
.pop .ag i.off{background:transparent;box-shadow:inset 0 0 0 1.3px var(--text-3)}
.pop .ag small{grid-column:2/4;color:var(--text-3);font-size:11.5px}
.pop .dash{display:flex;gap:2px;padding:2px;background:var(--hover);border-radius:7px;margin:2px 2px 6px}
.pop .dash button{flex:1;font-size:12px;padding:3px;border-radius:5px;color:var(--text-2)}
.pop .dash button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 0 0 .5px var(--line)}
.pop .hl2{padding-left:20px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--hud-bg);color:var(--hud-text);border-radius:9px;padding:8px 12px;font-size:12.5px;display:none;align-items:center;gap:10px;z-index:70;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.toast.on{display:flex}
.toast button{color:var(--gold);font-weight:600}
.pbtn{position:fixed;z-index:30;display:none;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;color:var(--markup-strong);background:var(--bg-ed)}
.pbtn.on{display:inline-flex}
.pbtn:hover,.pbtn:focus-visible{color:var(--accent);background:var(--accent-soft)}
.vswitch{position:fixed;right:12px;bottom:12px;z-index:80;display:flex;gap:4px;background:var(--card);border:1px solid var(--card-line);border-radius:9px;padding:4px;box-shadow:var(--shadow);font-size:11.5px}
.vswitch button{padding:3px 8px;border-radius:6px;color:var(--text-2)}
@media (max-width:760px){.vswitch .vl{display:none}.vswitch button{padding:3px 10px}}
.vswitch button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* round 2 */
.lsearch{display:flex;align-items:center;gap:7px;margin:0 16px 6px;padding:5px 8px;border-radius:7px;background:var(--hover);color:var(--text-3);font-size:12.5px;text-align:left}
.lsearch:hover{color:var(--text-2);background:var(--sel-lib)}
.lsearch kbd{margin-left:auto;background:transparent}
.lsearch .i{width:14px;height:14px}
.tip{margin:10px 12px 6px;padding:10px 12px;border-radius:10px;background:var(--card);border:1px solid var(--card-line);font-size:12px;line-height:1.45;color:var(--text-2);position:relative}
.tip b{color:var(--text);display:block;font-size:12.5px;margin-bottom:2px}
.tip .row{display:flex;gap:10px;margin-top:6px}
.tip .x{position:absolute;right:6px;top:6px}
.tip .x .i{width:10px;height:10px}
.dock{flex:none;border-top:1px solid var(--line-soft);background:var(--bg-ed);padding:10px 0 12px;display:none}
.ed.has-dock .dock{display:block}
.dock-in{width:min(100%,720px);margin:0 auto;padding:0 44px}
.dock-in.has-margin{width:min(100%,1000px);padding-right:288px}
.dock .cmp{margin:0}
.dock .ctx{font:11.5px var(--ui);color:var(--text-3);margin:0 0 4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dock .ctx button{color:var(--accent);font-weight:500}
.dock textarea{max-height:30vh;overflow:auto!important}
body.standalone .dock{padding-bottom:48px}
body.standalone .toast{bottom:64px}
.sugg{position:fixed;z-index:58;list-style:none;margin:0;padding:6px;background:var(--card);border:1px solid var(--card-line);border-radius:10px;box-shadow:var(--shadow);display:none;min-width:260px;max-width:min(360px,calc(100vw - 24px));font-size:13px}
.sugg.on{display:block}
.sugg li{padding:6px 8px;border-radius:6px;display:flex;gap:8px;align-items:center;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg li small{margin-left:auto;color:var(--text-3);font-size:11.5px;padding-left:8px}
.sugg li[aria-selected="true"]{background:var(--sel-list-focus)}
.sugg .sh{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.03em;cursor:default}
.goaltxt{font-size:11px;color:var(--text-3);margin-left:auto;display:inline-flex;gap:5px;align-items:center}
.goaltxt .ring{margin-left:0}
.pbtn{font:600 15px var(--ed-font)}
.pop .pi .sub{color:var(--text-3);font-size:11.5px}
.pop .pi .dpath{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow.flash{background:var(--accent-soft)}
.mnote .mn-open{display:inline-block;margin-top:4px;font-size:11.5px;color:var(--accent);font-weight:500}
[data-variant="b"] .mnote{margin:-.4em 0 1.3em 18px;padding:8px 12px;background:var(--accent-soft);border-left:2px solid var(--gold);border-radius:0 8px 8px 0;width:calc(100% - 18px)}
[data-variant="b"] .mn-x{-webkit-line-clamp:8;color:var(--text)}
[data-variant="b"] .mnote.unanch{margin-left:0;width:100%}
.ibtn[aria-disabled="true"]{opacity:.35;cursor:default}
.typewriter .doc>*{opacity:.3;transition:opacity .2s}
.typewriter .doc>section.turn:last-of-type,.typewriter .doc>*:hover{opacity:1}
/* medium widths: inspector overlays the editor */
@media (max-width:1180px){
  .app.insp-open .insp{position:absolute;right:0;top:0;bottom:0;z-index:20;box-shadow:var(--shadow)}
}
@media (max-width:980px){ .lib{width:190px} .list{width:260px} }
/* phone width: Library → Sheets → Editor stack */
@media (max-width:760px){
  .lib,.list,.ed{position:absolute;inset:0;width:auto;border:0;display:none!important}
  .app[data-mpane="library"] .lib{display:flex!important}
  .app[data-mpane="list"] .list{display:flex!important}
  .app[data-mpane="editor"] .ed{display:flex!important}
  .tl{display:none}
  .mback{display:inline-flex}
  .list .bar{padding-left:6px}
  .tl-list,.app.nolib .tl-list,[data-variant="d"] .tl-list{display:none}
  .deskonly{display:none!important}
  .doc,.doc.has-margin{padding:24px 18px 12vh 34px;width:100%}
  .dock-in,.dock-in.has-margin{padding:0 14px 0 34px;width:100%}
  .dock .hint kbd,.dock .hint>span,.dock .ctx>span{display:none}
  .lsearch{margin:0 12px 6px}
  .app.insp-open .insp{position:fixed;inset:0;width:auto;z-index:40;box-shadow:none;border:0}
  .seg button{padding:3px 7px}
  .hud input{width:200px}
  .crumb{display:none}
  .tools{flex:0 0 auto}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app" id="app" data-mpane="editor">
  <aside class="pane lib" id="lib" aria-label="Library">
    <div class="bar"><div class="tl deskonly" aria-hidden="true"><i></i><i></i><i></i></div>
      <button class="ibtn deskonly" data-act="toggle-lib" title="Hide library (⌘1)" aria-label="Hide library"><svg class="i" viewBox="0 0 16 16"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M6 2.75v10.5"/></svg></button>
    </div>
    <button class="ws" id="wsBtn" aria-haspopup="menu"></button>
    <button class="lsearch" data-act="quickopen" aria-label="Search (Command O)"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25"/><path d="m10.2 10.2 3.3 3.3"/></svg><span>Search</span><kbd>⌘O</kbd></button>
    <nav class="libnav" id="libNav"></nav>
    <div class="lfoot">
      <button class="ibtn" data-act="new-group" title="New group" aria-label="New group"></button>
      <button class="ibtn" data-act="glossary" title="Glossary" aria-label="Glossary"></button>
      <button class="agents" id="agentsBtn" data-act="agents" aria-haspopup="dialog"></button>
    </div>
  </aside>
  <section class="pane list" id="list" aria-label="Sheets">
    <div class="bar">
      <div class="tl tl-list" aria-hidden="true"><i></i><i></i><i></i></div>
      <button class="ibtn mback" data-act="mpane-library" aria-label="Library"></button>
      <div class="lhead" id="lhead"></div>
      <button class="ibtn" data-act="glue" id="glueBtn" title="Glue selected sheet to the next (⌘G)" aria-label="Glue to next sheet"></button>
      <button class="ibtn" data-act="new-sheet" title="New sheet (⌘N)" aria-label="New sheet"></button>
    </div>
    <div class="lbody" id="lbody" role="listbox" aria-label="Sheets in group"></div>
  </section>
  <main class="pane ed" id="ed" aria-label="Editor">
    <div class="bar">
      <button class="ibtn mback" data-act="mpane-list" aria-label="Sheets"></button>
      <button class="ibtn deskonly" id="libToggle" data-act="toggle-lib" title="Show library (⌘1)" aria-label="Toggle library"></button>
      <div class="crumb" id="crumb"></div>
      <div class="seg" role="group" aria-label="View" id="seg">
        <button data-view="sheet" aria-pressed="true" title="Sheet (⌥⌘1)">Sheet</button>
        <button data-view="outline" aria-pressed="false" title="Outline (⌥⌘2)">Outline</button>
        <button data-view="links" aria-pressed="false" title="References (⌥⌘3)">Links</button>
      </div>
      <div class="tools">
        <button class="ibtn deskonly" data-act="typewriter" id="twBtn" aria-pressed="false" title="Typewriter mode (⌘T)" aria-label="Typewriter mode"></button>
        <button class="ibtn" data-act="dashboard" id="dashBtn" title="Dashboard (⌘7)" aria-label="Dashboard"></button>
        <button class="ibtn" data-act="quickopen" title="Quick Open (⌘O)" aria-label="Quick Open"></button>
        <button class="ibtn" data-act="inspector" id="inspBtn" aria-pressed="false" title="Attachments (⌘6)" aria-label="Attachments"></button>
      </div>
    </div>
    <div class="escroll" id="escroll"><div class="doc" id="doc"></div></div>
    <div class="dock" id="dock"><div class="dock-in" id="dockIn"></div></div>
  </main>
  <aside class="pane insp" id="insp" aria-label="Attachments">
    <div class="bar"><h3 id="inspTitle">Attachments</h3><button class="ibtn" data-act="inspector" aria-label="Close attachments"></button></div>
    <div class="ibody" id="ibody"></div>
  </aside>
</div>

<div class="hud" id="hud" role="toolbar" aria-label="Passage actions"></div>
<div class="scrim" id="scrim"></div>
<div class="qo" id="qo" role="dialog" aria-label="Quick Open">
  <div class="qi"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25"/><path d="m10.2 10.2 3.3 3.3"/></svg>
    <input id="qoIn" placeholder="Open a sheet, group, mark or keyword" aria-label="Search" autocomplete="off"></div>
  <ul id="qoList" role="listbox"></ul>
  <div class="qf"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>↩</kbd> open</span><span><kbd>esc</kbd> close</span><span style="margin-left:auto">Searches titles, text, marks and keywords</span></div>
</div>

  if (!b) return '';

  return `<sup class="bref" data-branch="${b}" title="Branch ${n}: ${esc(SHEETS[b].title)}">${n}</sup>`;
}
function firstTurn(sh) { return sh.body.find(i => i.k === 'turn'); }
function lastTurn(sh) { return [...sh.body].reverse().find(i => i.k === 'turn'); }
function sheetStatus(sh) { const t = lastTurn(sh); return t ? t.status : null; }
function isChat(sh) { return sh.body.some(i => i.k === 'turn'); }

}
function goalWords(sh) {

}

  const md = sh.body[0].blocks.filter(b => b.t !== 'h1');

}
function displayTitle(sh) { const t = firstTurn(sh); return (sh.type === 'chat' && t) ? plain(t.q) : sh.title; }
function linkTitles(raw) { return raw.replace(/\[\[([^\]|]+)\]\]/g, (m0, t) => { const id = Object.keys(SHEETS).find(k => SHEETS[k].ws === S.ws && SHEETS[k].title.toLowerCase() === t.trim().toLowerCase()); return id ? `[[${id}|${SHEETS[id].title}]]` : m0; }); }
function fmtEl(sec) { sec = Math.max(0, Math.floor(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function turnElapsed(t) { return t.started ? (Date.now() - t.started) / 1000 : 0; }

  if (groupId === 'running') return all.filter(k => ['running', 'queued'].includes(sheetStatus(SHEETS[k])));
  if (groupId.startsWith('kw:')) { const kw = groupId.slice(3); return all.filter(k => SHEETS[k].kw.includes(kw)); }

}
function rank(id) { const u = SHEETS[id].updated; if (u === 'Now') return 0; if (u.startsWith('Today')) return 1 + (24 - parseInt(u.slice(7))); if (u.startsWith('Yesterday')) return 40; return 60 + (u.includes('9 Oct') ? 1 : u.includes('8 Oct') ? 2 : 3); }

function layoutMargin() {
  const doc = $('#doc'), margin = $('#margin');
  if (!doc || !margin) return;
  const notes = $$('.mnote');
  const v = document.documentElement.dataset.variant;
  const wide = $('#escroll').clientWidth >= 860 && (v === 'a' || v === 'e');
  doc.classList.toggle('has-margin', wide);
  $('#dockIn').classList.toggle('has-margin', wide);
  if (!wide) {
    notes.forEach(n => {
      const a = n.dataset.anchor && doc.querySelector(`mark[data-mark="${n.dataset.anchor}"]`);
      const blk = a ? a.closest('p,li,ul,ol,table') : doc.querySelector('.turn .afoot, .turn .answer');
      if (blk && blk.parentNode) blk.parentNode.insertBefore(n, blk.nextSibling); else margin.appendChild(n);
      n.style.top = '';
    });
    return;
  }
  const dr = doc.getBoundingClientRect();
  const placed = notes.map(n => {
    if (n.parentNode !== margin) margin.appendChild(n);
    const a = n.dataset.anchor && doc.querySelector(`mark[data-mark="${n.dataset.anchor}"]`);
    const ref = a || doc.querySelector('.turn .afoot') || doc.querySelector('.turn .answer');
    return { n, top: ref ? ref.getBoundingClientRect().top - dr.top - 2 : 40 };
  }).sort((x, y) => x.top - y.top);
  let floor = 0;
  placed.forEach(p => { const top = Math.max(p.top, floor); p.n.style.top = top + 'px'; floor = top + p.n.offsetHeight + 12; });
}

/* ===================== outline ===================== */
function manuscript() {

}

          else if (b.t === 'p') { (h2 ? h2.children : root.children).push(mk({ kind: 'p', label: plain(b.x).slice(0, 90), sheet: id, glyph: '¶' })); }

/* ===================== links view ===================== */

  const fam = [...branchesOf(id), ...(sh.parent ? [sh.parent] : [])];
  const kw = Object.keys(SHEETS).filter(k => k !== id && SHEETS[k].ws === S.ws && !fam.includes(k) && !from.includes(k) && !to.includes(k) && SHEETS[k].kw.some(x => sh.kw.includes(x)));

  const gc = t.closest('[data-group-crumb]'); if (gc) return selectGroup(gc.dataset.groupCrumb);
  const mo = t.closest('[data-mark-open]'); if (mo) { openSheet(mo.dataset.sheet, { view: 'sheet', keepGroup: true }); setTimeout(() => flashMark(mo.dataset.markOpen), 60); return; }
  const br = t.closest('.bref'); if (br) { const v = document.documentElement.dataset.variant; if (v === 'c') { S.insp = true; applyChrome(); renderInsp(); toast('Branch is listed under Attachments'); } else { const n = $(`.mnote[data-open="${br.dataset.branch}"]`); if (n) { n.classList.add('hot'); n.scrollIntoView({ block: 'nearest' }); setTimeout(() => n.classList.remove('hot'), 1200); } } return; }
  const lo = t.closest('[data-open-links]'); if (lo) { S.sheet = lo.dataset.openLinks; const sh = SHEETS[S.sheet]; if (!sheetsIn(S.group).includes(S.sheet)) S.group = sh.parent ? SHEETS[sh.parent].group : sh.group; renderLib(); renderList(); renderEditor(); if (S.insp) renderInsp(); return; }
  const op = t.closest('[data-open]'); if (op && !t.closest('#hud')) return openSheet(op.dataset.open, { view: 'sheet' });
  const kw = t.closest('[data-kw]'); if (kw) return selectGroup('kw:' + kw.dataset.kw);
  const si = t.closest('.si[data-sheet]'); if (si) return openSheet(si.dataset.sheet, { keepGroup: true, keepView: true });
  const vb = t.closest('[data-view]'); if (vb) return setView(vb.dataset.view);
  const ab = t.closest('[data-act]'); if (ab) return act(ab.dataset.act, ab);
  if (t.closest('#wsBtn')) {
    return openPop($('#wsBtn'), `<div class="ph">Workspaces</div><button class="pi" data-v="thesis"><span class="ck">${S.ws === 'thesis' ? ic('check') : ''}</span>Thesis — Grid storage</button><button class="pi" data-v="personal"><span class="ck">${S.ws === 'personal' ? ic('check') : ''}</span>Personal<span class="m">first run</span></button><hr><button class="pi" data-v="personal"><span class="ck"></span>New workspace…</button>`, v => switchWs(v));
  }
});
document.addEventListener('mouseover', e => {
  const n = e.target.closest && e.target.closest('.mnote'); $$('mark.hl.flash-h').forEach(m => m.classList.remove('flash', 'flash-h'));
  if (n && n.dataset.anchor) { const m = $(`#doc mark[data-mark="${n.dataset.anchor}"]`); if (m) m.classList.add('flash', 'flash-h'); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.classList && t.classList.contains('orow')) { olKey(e, t); if (e.defaultPrevented) return; }
  if (t.closest && t.closest('.si') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); const it = $$('.si'); const i = it.indexOf(t.closest('.si')); const nx = it[i + (e.key === 'ArrowDown' ? 1 : -1)]; if (nx) { nx.focus(); if (nx.dataset.sheet && !nx.dataset.markOpen) { openSheet(nx.dataset.sheet, { keepGroup: true, keepView: true }); const again = $(`.si[data-sheet="${nx.dataset.sheet}"]`); again && again.focus(); } } return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('.si,[data-open],[data-open-links],.wl,[data-act="ws-thesis"]') && !t.matches('button')) { e.preventDefault(); t.click(); return; }
  if ($('#qo').classList.contains('on')) {
    if (e.key === 'Escape') { e.preventDefault(); closeQO(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); qoMove(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); qoMove(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); const it = qoItems[qoSel]; closeQO(); it && it.run(); }
    return;
  }
  if (e.key === 'Escape') { if ($('#hud').classList.contains('on')) { hideHud(); return; } if ($('#pop').classList.contains('on')) { closePop(); return; } if (S.insp && innerWidth <= 760) { act('inspector'); return; } }
  const mod = e.metaKey || e.ctrlKey;
  const typing = t.matches && t.matches('input,textarea');
  if ($('#hud').classList.contains('on') && !typing && !mod) {
    const k = e.key.toLowerCase(); const map = { m: 'mark', h: 'mark', a: 'ask', b: 'branch', c: 'copy', f: 'file' };
    if (map[k]) { e.preventDefault(); hudAction(map[k]); return; }
  }
  if (mod && e.altKey && ['1', '2', '3'].includes(e.key)) { e.preventDefault(); setView(['sheet', 'outline', 'links'][+e.key - 1]); return; }
  if (mod && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === 'o' || k === 'k' || (k === 'f' && e.shiftKey)) { e.preventDefault(); openQO(); return; }
    if (k === '6') { e.preventDefault(); act('inspector'); return; }
    if (k === '7') { e.preventDefault(); act('dashboard', $('#dashBtn')); return; }
    if (k === '1') { e.preventDefault(); act('toggle-lib', $('#libToggle')); return; }
    if (k === 'g') { e.preventDefault(); glueToggle(); return; }
    if (k === 'n') { e.preventDefault(); newSheet(); return; }
    if (k === 't') { e.preventDefault(); act('typewriter'); return; }
    if (k === '.') { const run = $('[data-act="stop"]'); if (run) { e.preventDefault(); run.click(); } return; }
  }
});
$('#qoIn').addEventListener('input', renderQO);
let pTarget = null;
document.addEventListener('mousemove', e => {
  const pb = $('#pbtn');
  if (e.target.closest('#pbtn')) return;
  const p = S.view === 'sheet' && e.target.closest && e.target.closest('#doc .answer > p, #doc .answer li, #doc [data-md] > p');
  if (!p) { if (pTarget && !e.target.closest('#doc .answer, #doc [data-md]')) { pb.classList.remove('on'); pTarget = null; } return; }
  if (p === pTarget) return;
  pTarget = p; const r = p.getBoundingClientRect();
  pb.style.left = (r.left - 32) + 'px'; pb.style.top = (r.top + 3) + 'px'; pb.classList.add('on');
});
$('#pbtn').addEventListener('click', e => {
  e.stopPropagation(); if (!pTarget) return;
  const r = document.createRange(); r.selectNodeContents(pTarget);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  selRange = r.cloneRange(); showHud(r); $('#pbtn').classList.remove('on');
  const first = $('#hud button'); first && first.focus();
});
document.addEventListener('mouseup', e => {
  if (e.target.closest('#hud')) return;
  setTimeout(() => {
    const s = window.getSelection();
    if (!s || s.isCollapsed || !s.rangeCount) { if (!$('#hudIn')) hideHud(); return; }
    const r = s.getRangeAt(0);
    const host = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentNode;
    if (!host.closest('#doc') || host.closest('.cmp') || !host.closest('.answer, [data-md]') || S.view !== 'sheet') { hideHud(); return; }
    if (s.toString().trim().length < 3) return hideHud();
    selRange = r.cloneRange(); showHud(r);
  }, 10);
});
$('#escroll').addEventListener('scroll', () => { $('#pbtn').classList.remove('on'); pTarget = null; $('#ed').classList.toggle('scrolled', $('#escroll').scrollTop > 4); if ($('#hud').classList.contains('on') && !$('#hudIn')) hideHud(); });
new ResizeObserver(() => { if (S.view === 'sheet') layoutMargin(); }).observe($('#escroll'));
addEventListener('resize', () => { closePop(); });

/* ticking clock for running runs */
setInterval(() => {
  Object.keys(SHEETS).forEach(id => { const t = lastTurn(SHEETS[id]); if (t && t.status === 'running') $$(`[data-el="${id}"]`).forEach(el => el.textContent = fmtEl(turnElapsed(t))); });
}, 1000);

/* ===================== variants ===================== */
function setVariant(id) {
  if (!MOCK.variants.some(v => v.id === id)) id = 'a';
  document.documentElement.dataset.variant = id;
  if (parent !== window) parent.postMessage({ type: "mock:variant", slug: MOCK.slug, variant: id }, "*");
  // per-variant starting state
  S.ws = 'thesis'; S.nolib = false;
  S.insp = (id === 'c' || id === 'd');
  if (id === 'e') { S.group = 'ch3'; S.sheet = 's-outline'; S.view = 'outline'; }
  else { S.group = 'ch3'; S.sheet = 's-lfp'; S.view = 'sheet'; }
  S.composer.mode = null; S.composer.quote = null; S.mpane = 'editor';
  hideHud(); closePop();
  render();
  $$('.vswitch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === id));
}
window.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type === "mock:set") setVariant(d.variant);
  if (d.type === "mock:theme") { if (d.theme === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = d.theme; requestAnimationFrame(layoutMargin); }
});

/* ===================== boot ===================== */
fillIcons();
(function bootSodium() {
  const sh = SHEETS['s-sodium'], t = sh.body[0];
  t.started = Date.now() - t.startedAgo * 1000;
  startRun(sh, t, { continue: true, slow: true, plan: [{ t: 'p', x: 'Hard carbon operates at a higher average potential than graphite, so electrolyte reduction at the anode is slower near full charge and less lithium-equivalent inventory is lost per hour at high SOC.' }, { t: 'h2', x: 'Same SOC window' }, { t: 'p', x: 'Published 2025 calendar-aging data for layered-oxide/hard-carbon cells show roughly 1.5–2% per year at 25 °C when held at 90% SOC, against 2.9% for LFP in the same band. The gap narrows above 40 °C, where cathode-side degradation dominates in sodium layered oxides.' }] });
})();
setVariant(new URLSearchParams(location.search).get('variant') || 'a');
if (parent !== window) parent.postMessage({ type: "mock:ready", mock: MOCK }, "*");
else {
  const sw = document.createElement('div'); sw.className = 'vswitch'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Variant');
  sw.innerHTML = MOCK.variants.map(v => `<button data-v="${v.id}" title="${esc(v.summary)}" aria-pressed="${v.id === document.documentElement.dataset.variant}">${v.id.toUpperCase()}<span class="vl"> · ${esc(v.label)}</span></button>`).join('');
  sw.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { e.stopPropagation(); setVariant(b.dataset.v); } });
  document.body.appendChild(sw); document.body.classList.add('standalone');
}
</script>
</body>
</html>
