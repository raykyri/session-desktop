<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session · Tana-style (round 2)</title>
<meta name="description" content="Session redesign candidate 'tana', round 2. Influence: Tana (with nods to Roam Research, Logseq, Workflowy). Everything is a node; a question is a node tagged #question.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: macOS window. Sidebar (workspace, Today, live searches, pins, supertags) | main panel (breadcrumbs, zoomed node as page, outline / table / map) | optional side panel (references, node, agents, source). */
:root{
  --bg:#ffffff; --bg-side:#f6f6f5; --bg-hover:rgba(15,15,25,.045); --bg-active:rgba(15,15,25,.075);
  --bg-elev:#ffffff; --bg-sunk:#f8f8f7; --bg-edit:rgba(91,79,224,.045);
  --text:#1c1c1f; --text-2:#46464c; --text-3:#83838a; --text-4:#b5b5bb;
  --line:#ececeb; --line-2:#dfdfdd; --guide:#e9e9e8; --bullet:#9b9ba2; --ring:#e4e4e7;
  --accent:#5b4fe0; --accent-fg:#ffffff; --accent-soft:rgba(91,79,224,.11); --ref:#4b43c6; --focus:#6c62ff;
  --tag-question:#7b4bd9; --tag-claim:#178f61; --tag-source:#2a6fdc; --tag-day:#c96d14; --tag-datapoint:#2f7f89;
  --ok:#2b9355; --warn:#b36f0c; --danger:#cf4035;
  --edge:#cdcdd3; --kbd-bg:#f1f1f0; --ph:#6c6c73; --scrim:rgba(20,20,28,.28);
  --shadow:0 12px 32px rgba(20,20,35,.13),0 2px 6px rgba(20,20,35,.06);
  --sw:248px; --pw:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18181a; --bg-side:#131315; --bg-hover:rgba(255,255,255,.05); --bg-active:rgba(255,255,255,.085);
  --bg-elev:#222225; --bg-sunk:#1d1d20; --bg-edit:rgba(139,130,255,.07);
  --text:#ececef; --text-2:#c0c0c7; --text-3:#8a8a93; --text-4:#5d5d65;
  --line:#28282c; --line-2:#34343a; --guide:#2a2a2f; --bullet:#77777f; --ring:#313137;
  --accent:#8c84ff; --accent-fg:#131315; --accent-soft:rgba(140,132,255,.17); --ref:#aaa4ff; --focus:#9b93ff;
  --tag-question:#a888f6; --tag-claim:#3ec48e; --tag-source:#62a2ff; --tag-day:#eea25a; --tag-datapoint:#61b8c3;
  --ok:#4cc27a; --warn:#e2a640; --danger:#f06a60;
  --edge:#45454c; --kbd-bg:#29292d; --ph:#8e8e97; --scrim:rgba(0,0,0,.5);
  --shadow:0 14px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#18181a; --bg-side:#131315; --bg-hover:rgba(255,255,255,.05); --bg-active:rgba(255,255,255,.085);
  --bg-elev:#222225; --bg-sunk:#1d1d20; --bg-edit:rgba(139,130,255,.07);
  --text:#ececef; --text-2:#c0c0c7; --text-3:#8a8a93; --text-4:#5d5d65;
  --line:#28282c; --line-2:#34343a; --guide:#2a2a2f; --bullet:#77777f; --ring:#313137;
  --accent:#8c84ff; --accent-fg:#131315; --accent-soft:rgba(140,132,255,.17); --ref:#aaa4ff; --focus:#9b93ff;
  --tag-question:#a888f6; --tag-claim:#3ec48e; --tag-source:#62a2ff; --tag-day:#eea25a; --tag-datapoint:#61b8c3;
  --ok:#4cc27a; --warn:#e2a640; --danger:#f06a60;
  --edge:#45454c; --kbd-bg:#29292d; --ph:#8e8e97; --scrim:rgba(0,0,0,.5);
  --shadow:0 14px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button[disabled]{cursor:default}
kbd{font:500 11px/1 Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--kbd-bg);border:1px solid var(--line-2);border-radius:4px;padding:2px 4px;color:var(--text-2);white-space:nowrap}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:5px}
.mut{color:var(--text-3)} .sm{font-size:12.5px}
[hidden]{display:none!important}

/* ---------- window grid ---------- */
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr) var(--pw);height:100vh}
.app.side-off{--sw:0px}
.app.side-off .side{display:none}
.app.panel-on{--pw:340px}
.side{grid-column:1;grid-row:1}
.main{grid-column:2;grid-row:1}
.panel{grid-column:3;grid-row:1}
.scrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:39}

/* ---------- sidebar ---------- */
.side{background:var(--bg-side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.traffic{display:flex;gap:8px;padding:15px 14px 6px;flex:none}
.traffic i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.14)}
.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}
.wsw{display:flex;align-items:center;gap:9px;margin:4px 8px 6px;padding:5px 6px;border-radius:7px;font-weight:600;font-size:13.5px;width:calc(100% - 16px)}
.wsw:hover{background:var(--bg-hover)}
.wsav{width:22px;height:22px;border-radius:6px;background:var(--tag-question);color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.wsav.p{background:var(--tag-source)}
.wsw .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsw .ic{width:13px;height:13px;color:var(--text-3)}
.snav{flex:1;overflow:auto;padding:0 8px 10px}
.si{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border-radius:6px;color:var(--text-2);font-size:13.5px;white-space:nowrap}
.si:hover{background:var(--bg-hover);color:var(--text)}
.si[aria-current="page"]{background:var(--bg-active);color:var(--text);font-weight:500}
.si > .ic{color:var(--text-3)}
.si .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.si .cnt{font-size:12px;color:var(--text-4)}
.si .badge{font-size:11px;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:5px}
.si .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sdot{width:16px;height:16px;display:grid;place-items:center;flex:none}
.sdot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc,var(--bullet))}
.shash{width:16px;text-align:center;color:var(--tc);font-weight:600;flex:none}
.shead{font-size:12px;color:var(--text-3);font-weight:500;padding:16px 8px 4px}
.shint{font-size:12px;color:var(--text-3);padding:2px 8px 6px;line-height:1.45}
.sfoot{border-top:1px solid var(--line);padding:6px 8px 10px;flex:none}
.agst{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3)}
.agst::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.tw{width:16px;height:16px;display:grid;place-items:center;color:var(--text-4);flex:none;border-radius:4px}
.tw .ic{width:11px;height:11px;transition:transform .12s}
.tw.open .ic{transform:rotate(90deg)}
.tw:hover{color:var(--text-2);background:var(--bg-hover)}
.trow{display:flex;align-items:center;padding-left:calc(var(--lv) * 14px)}
.trow .si{padding-left:4px}

/* ---------- top bar ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.top{height:46px;flex:none;display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}
.top .traffic{display:none;padding:0 12px 0 4px}
.app.side-off .top .traffic{display:flex}
.ib{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;color:var(--text-3);flex:none}
.ib:hover{background:var(--bg-hover);color:var(--text)}
.ib[disabled]{opacity:.35;pointer-events:none}
.ib.on{color:var(--accent);background:var(--accent-soft)}
.ib.sm{width:24px;height:24px}
.crumbs{display:flex;align-items:center;min-width:0;overflow:hidden;margin-left:6px;font-size:13px;color:var(--text-3);white-space:nowrap}
.crumbs button{padding:3px 5px;border-radius:5px;max-width:180px;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.crumbs button:hover{background:var(--bg-hover);color:var(--text)}
.crumbs .cur{color:var(--text);font-weight:500;padding:3px 5px;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:40px}
.crumbs .sl{color:var(--text-4);flex:none}
.spacer{flex:1}
.seg{display:flex;background:var(--bg-sunk);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;margin:0 6px;flex:none}
.seg button{display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:5px;font-size:12.5px;color:var(--text-3)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.09),0 0 0 .5px var(--line-2)}
.seg .ic{width:14px;height:14px}
.kbtn{display:flex;align-items:center;gap:8px;height:28px;padding:0 6px 0 9px;border:1px solid var(--line);border-radius:7px;color:var(--text-3);font-size:12.5px;margin-right:4px;flex:none}
.kbtn:hover{background:var(--bg-hover);color:var(--text)}
.kbtn .ic{width:14px;height:14px}

/* ---------- page ---------- */
.scroll{flex:1;overflow:auto;overflow-x:hidden;min-height:0}
.page{max-width:820px;margin:0 auto;padding:30px 48px 160px 62px}
.daynav{display:flex;align-items:center;gap:2px;color:var(--text-3);font-size:12.5px;margin:0 0 2px -6px}
.daynav .ic{width:14px;height:14px}
.ptitle{font-size:30px;line-height:1.25;font-weight:650;letter-spacing:-.022em;margin:2px 0 8px;display:flex;gap:10px;align-items:flex-start}
.ptitle .tx{flex:1;min-width:0}
.ptitle .psico{color:var(--text-3);padding-top:6px}
.ptitle .psico .ic{width:22px;height:22px}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--text-3);font-size:12.5px;margin-bottom:14px}
.pmeta .tag{margin-left:0;font-size:12.5px;height:22px;padding:0 8px}
.lnk{display:inline-flex;align-items:center;gap:4px;color:var(--text-3);font-size:12.5px;border-radius:5px;padding:1px 4px;margin:0 -2px}
.lnk:hover{color:var(--text);background:var(--bg-hover)}
.lnk .ic{width:13px;height:13px}
.lnk.on{color:var(--accent)}
.tip{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--bg-sunk);border-radius:9px;padding:9px 8px 9px 12px;font-size:13px;color:var(--text-2);margin:0 0 16px}
.tip > .ic{color:var(--tag-claim);margin-top:2px}
.tip span{flex:1}
.tip kbd{font-size:10.5px}

/* ---------- node rows ---------- */
.nd{position:relative}
.row{position:relative;display:flex;align-items:flex-start;min-height:28px;border-radius:6px}
.row:focus-within{background:var(--bg-edit)}
.chev{position:absolute;left:-22px;top:4px;width:20px;height:20px;display:grid;place-items:center;border-radius:4px;color:var(--text-4);opacity:0;transition:opacity .12s}
.chev .ic{width:12px;height:12px;transition:transform .12s}
.chev.open .ic{transform:rotate(90deg)}
.row:hover > .chev,.chev:focus-visible{opacity:1}
.chev:hover{color:var(--text-2);background:var(--bg-hover)}
.bul{flex:none;width:22px;height:28px;display:grid;place-items:center;border-radius:5px;position:relative}
.bul::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tc,var(--bullet));transition:transform .1s}
.bul:hover::before{transform:scale(1.4)}
.bul.hid::before{box-shadow:0 0 0 4.5px var(--ring)}
.bul.isref::before{box-shadow:0 0 0 2px var(--bg),0 0 0 3.4px var(--tc,var(--text-4))}
.bul.isref.hid::before{box-shadow:0 0 0 2px var(--bg),0 0 0 3.4px var(--tc,var(--text-4)),0 0 0 7px var(--ring)}
.bul.srch::before,.bul.plus::before{display:none}
.bul.srch .ic,.bul.plus .ic{width:13px;height:13px;color:var(--text-3)}
.bul.plus .ic{color:var(--text-4)}
.todo{flex:none;width:15px;height:15px;margin:6.5px 7px 0 1px;border:1.5px solid var(--text-4);border-radius:4px;display:grid;place-items:center;color:var(--accent-fg)}
.todo.done{background:var(--accent);border-color:var(--accent)}
.todo .ic{width:11px;height:11px;stroke-width:2.2}
.nd.done > .row .tx{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-4)}
.body{flex:1;min-width:0;padding:3px 0;cursor:text}
.tx{outline:none;white-space:pre-wrap;overflow-wrap:anywhere}
.tx:empty{display:inline-block;min-width:60px}
.row .tx:not(.ctx):empty:focus::before{content:"Type, or ⌘↵ to ask about it";color:var(--ph)}
.tx b{font-weight:600}
.tag{display:inline-flex;align-items:center;margin-left:6px;padding:0 6px;height:19px;border-radius:5px;font-size:12px;font-weight:500;line-height:19px;color:var(--tc);background:color-mix(in srgb,var(--tc) 12%,transparent);vertical-align:1px;white-space:nowrap;cursor:pointer}
.tag i{font-style:normal;opacity:.6;margin-right:1px}
.tag:hover{background:color-mix(in srgb,var(--tc) 20%,transparent)}
.st{display:inline-flex;align-items:center;gap:5px;margin-left:8px;font-size:12px;color:var(--text-3);white-space:nowrap;vertical-align:0}
.st .ic{width:13px;height:13px}
.st-complete > .ic{color:var(--ok)}
.st-running{color:var(--accent)}
.st-waiting{color:var(--warn)}
.st .lnk{margin-left:4px}
.spin{width:11px;height:11px;border-radius:50%;border:1.75px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.kids{margin-left:10px;padding-left:12px;border-left:1px solid var(--guide)}
.kids.kt{border-left:0;padding-left:0;margin:2px 0 8px 22px}
.emptyrow{font-size:12.5px;color:var(--text-3);padding:4px 0 4px 4px}
.acts{position:absolute;right:0;top:2px;display:none;gap:2px;align-items:center;padding-left:14px;background:linear-gradient(90deg,transparent,var(--bg) 12px)}
.row:hover > .acts,.acts:focus-within{display:flex}
.ab{height:24px;padding:0 7px;border-radius:5px;font-size:12px;color:var(--text-3);display:inline-flex;align-items:center;gap:4px;background:var(--bg);white-space:nowrap}
.ab:hover{background:var(--bg-hover);color:var(--text)}
.ab .ic{width:13px;height:13px}
.rc{display:none;margin-left:6px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;font-size:11px;font-weight:600;color:var(--text-3);background:var(--bg-sunk);border:1px solid var(--line-2);vertical-align:1px;align-items:center;justify-content:center}
.rc:hover{color:var(--accent);border-color:var(--accent)}
[data-variant="e"] .rc{display:inline-flex}
.srcchip{margin-left:6px;font-size:12px}
.srcchip .iref{color:var(--text-3);font-weight:400}
.genl{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:11.5px;color:var(--text-3)}
.genl .ic{width:12px;height:12px}
.streaming .tx::after{content:"";display:inline-block;width:7px;height:14px;background:var(--accent);margin-left:2px;vertical-align:-2px;border-radius:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.flash > .row{animation:flash 1.4s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
.iref{color:var(--ref);font-weight:500;cursor:pointer;border-radius:3px;padding:0 1px}
.iref::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55;margin:0 4px 2px 1px;vertical-align:middle}
.iref:hover{background:var(--accent-soft)}
mark.ext{color:inherit;background:color-mix(in srgb,var(--tag-claim) 15%,transparent);border-bottom:1.5px solid color-mix(in srgb,var(--tag-claim) 60%,transparent);border-radius:2px;padding:0 1px;cursor:pointer}
mark.ext:hover{background:color-mix(in srgb,var(--tag-claim) 24%,transparent)}

/* ---------- fields ---------- */
.fields{padding:0 0 6px 22px}
.fields.pf{padding-left:0;margin:2px 0 16px}
.fld{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;min-height:28px}
.fl{display:flex;align-items:center;gap:6px;color:var(--text-3);font-size:13px;height:28px;white-space:nowrap}
.fl .ic{width:13px;height:13px;color:var(--text-4)}
.fv{padding:3px 0;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.fv .st{margin-left:0}
.fv .mut{font-size:13px}
.mchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 6px 0 4px;border-radius:6px;font-size:12.5px;color:var(--text-2);border:1px solid var(--line-2);background:var(--bg)}
.mchip:hover{background:var(--bg-hover);color:var(--text)}
.mchip > .ic{width:12px;height:12px;color:var(--text-3)}
.agi{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;background:var(--ac);flex:none}
.fbtn{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;border:1px dashed var(--line-2);font-size:12.5px;color:var(--text-2)}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}
.fbtn .ic{width:13px;height:13px}

/* ---------- gutter, anchors, first run ---------- */
.scroll,.pbody{container-type:inline-size}
.anch{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px 0 5px;border-radius:10px;font-size:11.5px;font-weight:500;color:var(--tag-question);background:color-mix(in srgb,var(--tag-question) 11%,transparent);white-space:nowrap;vertical-align:1px}
.anch:hover{background:color-mix(in srgb,var(--tag-question) 20%,transparent)}
.anch .ic{width:12px;height:12px}
.anch.in{margin-left:8px}
.anch.g{display:none}
.acts .hb{display:contents}
.aboutl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3);margin-top:1px}
.aboutl > .ic{width:12px;height:12px;color:var(--tag-question)}
.aboutl mark.ext{font-size:12px}
.prog{display:inline-flex;align-items:center;margin-left:8px;font-size:11.5px;font-weight:600;color:var(--text-3);background:var(--bg-sunk);border:1px solid var(--line-2);border-radius:9px;padding:0 7px;height:18px;vertical-align:1px}
.prog.full{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
@container (min-width:1120px){
  .page .row > .acts{display:flex;flex-wrap:wrap;align-content:flex-start;width:168px;left:calc(100% + 10px);right:auto;top:2px;background:none;padding-left:0;gap:3px}
  .page .acts .ab.ico .lb{display:none}
  .page .row > .acts .hb{display:none}
  .page .row:hover > .acts .hb,.page .row:focus-within > .acts .hb,.page .acts:focus-within .hb{display:contents}
  .page .anch.in{display:none}
  .page .anch.g{display:inline-flex;margin:2px 4px 0 0}
  .page .acts .ab{background:transparent;border:1px solid var(--line);height:22px}
  .page .acts .ab:hover{background:var(--bg-hover)}
}
.welcome{border:1px solid var(--line);border-radius:12px;background:var(--bg-sunk);padding:14px 16px;margin:0 0 18px}
.welcome p{margin:0 0 10px;font-size:14px;color:var(--text-2);max-width:62ch}
.welcome p b{color:var(--text);font-weight:600}
.wl-ag{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.wl-ag .pill{margin-left:2px}
.capbar{flex:none;border-top:1px solid var(--line);background:var(--bg);padding:10px 16px 10px}
.capbar:empty{display:none}
.capbar .comp{max-width:820px;margin:0 auto}

.comp.foot > .row:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--line-2))}
.comp .body{cursor:text}
.ctx{display:block;min-height:22px}
.ctx:empty::before{content:attr(data-ph);color:var(--ph);pointer-events:none}
.askbtn{flex:none;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 6px 0 10px;border-radius:6px;background:var(--accent);color:var(--accent-fg);font-size:12.5px;font-weight:600;margin-left:8px}

.askbtn kbd{background:rgba(255,255,255,.2);border-color:transparent;color:inherit}
.comp.foot .askbtn{visibility:hidden}
.comp.foot > .row:focus-within .askbtn,.comp.foot.has .askbtn{visibility:visible}
.comp.foot.always > .row{border-color:var(--line-2);box-shadow:0 1px 2px rgba(0,0,0,.03)}
.comp.always .askbtn{visibility:visible}
.chint{display:none;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:var(--text-3);padding:7px 4px 0 30px}
.chint > span{display:inline-flex;align-items:center;gap:5px}
.comp.always .chint,.comp:focus-within .chint,.comp.has .chint{display:flex}
.try{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 0 30px}
.try button{font-size:12.5px;color:var(--text-2);border:1px solid var(--line);border-radius:14px;padding:3px 10px;background:var(--bg-sunk)}
.try button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- references section ---------- */
.refs{margin-top:44px;border-top:1px solid var(--line);padding-top:14px}
[data-variant="e"] .refs{display:none}
.refs h2{font-size:12.5px;font-weight:600;color:var(--text-3);margin:0 0 8px;display:flex;gap:8px}
.refs h2 span{font-weight:500;color:var(--text-4)}
.refitem{padding:4px 0 6px}
.refitem .rcr{font-size:11.5px;color:var(--text-3);padding-left:22px;display:flex;gap:6px}
.refitem .rcr em{font-style:normal;color:var(--text-4)}

/* ---------- table ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:4px 0}

.tn{min-width:220px;width:100%}
.tn .tag{margin-left:4px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--tc,var(--bullet));margin:0 8px 2px 0;vertical-align:middle}

/* ---------- map ---------- */
.graph{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:12px;background:var(--bg-sunk)}

.graph line.k-field{stroke-dasharray:1.2 3;stroke-width:1.5}

.graph .gn:focus-visible{outline:none}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-3);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:22px;height:0;border-top:1.5px solid var(--text-4)}
.lg.dash{border-top-style:dashed}.lg.dot{border-top-style:dotted;border-top-width:2px}
.mapnote{font-size:12.5px;color:var(--text-3);margin:0 0 10px}

.panel{display:none;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--line);background:var(--bg)}
.app.panel-on .panel{display:flex}

.phd h2{font-size:13px;font-weight:600;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody{flex:1;overflow:auto;overflow-x:hidden;padding:14px 16px 40px 18px}
.pbody .page{padding:0 0 40px 18px;max-width:none}
.pbody .ptitle{font-size:20px}
.psec h3{font-size:12px;color:var(--text-3);font-weight:500;margin:18px 0 4px}
.plink{display:flex;gap:8px;width:100%;padding:6px 8px;border-radius:6px;align-items:flex-start}

.menu{min-width:230px;max-width:320px;padding:4px}
.mi{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:6px;font-size:13px}
.mi:hover,.mi:focus-visible{background:var(--bg-hover);outline:none}

.mi .ml small.warn{color:var(--warn)}
.mi > .ic{color:var(--text-3)}
.mi kbd{font-size:10.5px}
.msep{height:1px;background:var(--line);margin:4px 2px}
.atpop{width:320px;max-height:280px;overflow:auto;padding:4px}
.atpop .mi .ml{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atpop .mi[aria-selected="true"]{background:var(--accent-soft)}
.pal{position:fixed;inset:0;background:var(--scrim);z-index:70}

.pal-in{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.pal-in .ic{color:var(--text-3)}

.pal-in input{flex:1;min-width:0;height:48px;border:0;background:none;font-size:15px}
.pal-list{max-height:min(420px,60vh);overflow:auto;padding:4px 6px 8px}
.pal-sec{font-size:11.5px;color:var(--text-3);font-weight:500;padding:10px 8px 4px}

.pal-it[aria-selected="true"]{background:var(--accent-soft)}
.pal-it .ic{color:var(--text-3)}
.pal-it .pl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-it small{color:var(--text-3);font-size:12px;margin-left:8px}
.pal-it .tag{margin-left:0}
.pal-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-3)}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);transition:opacity .18s,transform .18s;z-index:80;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.standalone .capbar{padding-bottom:58px}
.vsw{position:fixed;right:12px;bottom:12px;z-index:90;display:flex;flex-wrap:wrap;gap:4px;background:var(--bg-elev);border:1px solid var(--line-2);border-radius:10px;padding:4px;box-shadow:var(--shadow);max-width:calc(100% - 24px)}

@media (max-width:1100px){ .app.panel-on{--pw:300px} .seg .sl{display:none} .kbtn span,.kbtn kbd{display:none} .kbtn{padding:0 7px} }

  .fl{height:22px}
  .ptitle{font-size:23px}

  .try{padding-left:0}

  .seg button{padding:0 6px}
  .kbtn{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
