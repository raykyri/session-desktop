<html lang="en">
<head>
<meta charset="utf-8">

<title>Session · Excerpt Columns</title>
<style>
:root {

  --desk: #e9e9ee; --window: #ffffff; --tint: #e7ecf5;

  --popover: rgba(248,248,250,.94);
  --code: rgba(0,0,0,.05); --mark-text: inherit;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --accent: #0a84ff; --accent-fg: #ffffff; --accent-soft: rgba(10,132,255,.2); --accent-line: rgba(10,132,255,.6);
  --desk: #161618; --window: #1e1e20; --tint: #222631;
  --sidebar: rgba(44,44,49,.74); --glass: rgba(52,52,57,.66); --glass-solid: #2a2a2e;
  --glass-border: rgba(255,255,255,.09); --glass-hi: rgba(255,255,255,.07); --shadow: rgba(0,0,0,.55); --shadow-soft: rgba(0,0,0,.3);
  --text: #f5f5f7; --text-2: rgba(235,235,245,.74); --text-3: rgba(235,235,245,.5); --text-4: rgba(235,235,245,.3);
  --sep: rgba(255,255,255,.09); --sep-strong: rgba(255,255,255,.16);
  --hover: rgba(255,255,255,.06); --sel: rgba(255,255,255,.1); --row-alt: rgba(255,255,255,.025);
  --field: rgba(118,118,128,.24); --field-solid: #2c2c2e; --control: #3a3a3d;
  --bubble: #0a84ff; --bubble-fg: #ffffff; --bubble-in: #303033;

  --popover: rgba(42,42,46,.95);
  --code: rgba(255,255,255,.07);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --accent: #0a84ff; --accent-fg: #ffffff; --accent-soft: rgba(10,132,255,.2); --accent-line: rgba(10,132,255,.6);
  --desk: #161618; --window: #1e1e20; --tint: #222631;
  --sidebar: rgba(44,44,49,.74); --glass: rgba(52,52,57,.66); --glass-solid: #2a2a2e;
  --glass-border: rgba(255,255,255,.09); --glass-hi: rgba(255,255,255,.07); --shadow: rgba(0,0,0,.55); --shadow-soft: rgba(0,0,0,.3);
  --text: #f5f5f7; --text-2: rgba(235,235,245,.74); --text-3: rgba(235,235,245,.5); --text-4: rgba(235,235,245,.3);
  --sep: rgba(255,255,255,.09); --sep-strong: rgba(255,255,255,.16);
  --hover: rgba(255,255,255,.06); --sel: rgba(255,255,255,.1); --row-alt: rgba(255,255,255,.025);
  --field: rgba(118,118,128,.24); --field-solid: #2c2c2e; --control: #3a3a3d;

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--text); overflow: hidden;
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
input, textarea { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--accent-line); outline-offset: 1px; border-radius: 6px; }
.i { flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
kbd { font: 11px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--text-3); }

/* window */
#win { position: absolute; inset: 0; display: flex; background: linear-gradient(90deg, var(--tint) 0, var(--window) 270px); }
#sidebar { width: 220px; flex: none; margin: 8px 0 8px 8px; border-radius: 18px; background: var(--sidebar);
  backdrop-filter: blur(30px) saturate(1.7); -webkit-backdrop-filter: blur(30px) saturate(1.7);
  box-shadow: inset 0 0 0 .5px var(--glass-border), inset 0 1px 0 var(--glass-hi), 0 6px 24px var(--shadow-soft);
  display: flex; flex-direction: column; overflow: hidden; z-index: 20; }
#win.no-sidebar #sidebar { display: none; }
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--window); position: relative; }
#toolbar { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; }
#toolbar .sp { flex: 1; }
#content { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.lights { display: flex; gap: 8px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.lights span:nth-child(1) { background: #ff5f57; } .lights span:nth-child(2) { background: #febc2e; } .lights span:nth-child(3) { background: #28c840; }

/* sidebar */
.sb-top { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 14px; flex: none; }
.ws-btn { display: flex; align-items: center; gap: 8px; width: calc(100% - 16px); margin: 0 8px 8px; padding: 5px 8px; border-radius: 9px; text-align: left; }
.ws-btn:hover { background: var(--hover); }
.ws-ic { width: 22px; height: 22px; border-radius: 6px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 11px; background: linear-gradient(160deg, #5aa7ff, #2357e0); }
.ws-ic.p { background: linear-gradient(160deg, #6fd389, #23935a); }
.ws-btn .lbl { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-btn .i { color: var(--text-3); }
.sb-scroll { flex: 1; overflow: auto; padding: 0 8px 8px; }
.sb-gap { height: 12px; }
.sb-item { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border-radius: 8px; text-align: left; }
.sb-item .i { color: var(--accent); }
.sb-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item .badge { font-size: 11px; font-weight: 600; color: #fff; background: var(--accent); border-radius: 9px; padding: 0 6px; line-height: 16px; }
.sb-item:hover { background: var(--hover); }
.sb-item.on { background: var(--sel); font-weight: 500; }
.sb-item.drop { box-shadow: inset 0 0 0 2px var(--accent); }

/* toolbar */
.tb-btn { width: 32px; height: 28px; border-radius: 14px; display: grid; place-items: center; color: var(--text-2); }
.tb-btn:hover { background: var(--hover); color: var(--text); }
.search { display: flex; align-items: center; gap: 6px; height: 30px; width: 220px; border-radius: 15px; padding: 0 10px; color: var(--text-3); background: var(--field); }
.search:focus-within { background: var(--field-solid); box-shadow: inset 0 0 0 .5px var(--accent-line), 0 0 0 3px var(--accent-soft); }
.search input { border: 0; background: none; width: 100%; font-size: 13px; color: var(--text); }
.search input:focus-visible { outline: none; }
.search input::placeholder { color: var(--text-3); }
.search .clr { color: var(--text-3); display: none; }
.search.has .clr { display: block; }

/* column strip */
.cols-back { display: none; flex: none; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px; color: var(--text-3); min-width: 0; }
.cols-back button { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-size: 13px; max-width: 62%; min-width: 0; }
.cols-back button span, .cols-back > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cols { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; }
.col { flex: none; display: flex; flex-direction: column; min-height: 0; }
.col:focus-visible { outline: none; box-shadow: inset 0 2px 0 var(--accent); }
.col-scroll { flex: 1; overflow: auto; padding: 4px 6px 12px; }
.col-rs { flex: none; width: 9px; margin: 0 -4px; position: relative; z-index: 3; cursor: col-resize; touch-action: none; }
.col-rs::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: var(--sep); }
.col-rs:hover::after, .col-rs.drag::after { background: var(--accent); width: 3px; left: 3px; }
.col-prev { flex: 1; min-width: 380px; overflow: auto; }
.ask-dock { flex: none; padding: 2px 6px 6px; }
.askf { display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 4px 0 11px; border-radius: 10px; background: var(--field); color: var(--text-3); }
.askf:focus-within { background: var(--field-solid); box-shadow: inset 0 0 0 .5px var(--accent-line), 0 0 0 3px var(--accent-soft); color: var(--accent); }
.askf input { flex: 1; min-width: 0; border: 0; background: none; font-size: 13px; color: var(--text); }
.askf input::placeholder { color: var(--text-2); }
.askf input:focus-visible { outline: none; }
.askf-ag { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; }
.askf-ag:hover { background: var(--hover); }
.askf-ag .mono { width: 18px; height: 18px; font-size: 8px; border-radius: 5px; }
.follow-dock { flex: none; padding: 6px 8px 10px; }
.follow-dock .askf { height: 32px; border-radius: 16px; }

/* cells */
.cell { display: flex; flex-direction: column; align-items: stretch; gap: 3px; width: 100%; text-align: left; padding: 8px 10px 9px; border-radius: 10px; margin-bottom: 2px; position: relative; }
.cell + .cell::before { content: ""; position: absolute; left: 10px; right: 10px; top: -1px; border-top: .5px solid var(--sep); }
.cell.on::before, .cell.on + .cell::before { display: none; }
.cell:hover { background: var(--hover); }
.cell.on { background: var(--sel); }
.col.active .cell.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent-line); }
.role { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-3); min-width: 0; white-space: nowrap; }
.role b { font-weight: 600; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; }
.role .mono { width: 16px; height: 16px; font-size: 7.5px; border-radius: 4px; }
.role .i { color: var(--accent); }
.role .end { margin-left: auto; display: inline-flex; gap: 3px; align-items: center; flex: none; }
.c-title { font-weight: 600; font-size: 13px; line-height: 1.3; }
.c-ex { font-size: 12.5px; line-height: 1.45; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.c-ex mark { background: var(--hl); color: inherit; border-radius: 2px; }
.c-anc { font-size: 12px; font-style: italic; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.q .c-ex { color: var(--text); }
.cell.on .c-ex { -webkit-line-clamp: 12; }
.c-run { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); margin-top: 2px; }
.c-run .spin { width: 11px; height: 11px; border-width: 1.5px; }
.c-run .act { margin-left: auto; color: var(--red); font-weight: 500; padding: 1px 7px; border-radius: 6px; box-shadow: inset 0 0 0 .5px var(--sep-strong); background: var(--control); }
.empty { padding: 34px 16px; text-align: center; color: var(--text-3); font-size: 12.5px; }
.empty b { display: block; color: var(--text-2); font-size: 14px; margin-bottom: 4px; }
.mono { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; color: #fff; flex: none; }
.ag-cc { background: linear-gradient(160deg, #f0a35e, #d4672b); }
.ag-cx { background: linear-gradient(160deg, #39c08a, #138a63); }
.ag-gk { background: linear-gradient(160deg, #6e6e78, #3a3a42); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--gray); }
.dot.ok { background: var(--green); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* preview: full message */
.pv { max-width: 700px; padding: 16px 28px 48px 44px; position: relative; }
.bubble { display: inline-block; max-width: 88%; background: var(--bubble); color: var(--bubble-fg); padding: 8px 14px 9px; border-radius: 19px; font-size: 14.5px; line-height: 1.38; }
.pv-q { display: flex; justify-content: flex-end; margin: 6px 0 4px; }
.ans-h { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); margin: 4px 0 8px; }
.ans-h .sp { flex: 1; }
.more { width: 26px; height: 24px; border-radius: 7px; display: grid; place-items: center; color: var(--text-3); }
.more:hover { background: var(--hover); color: var(--text); }
.answer-body { font-size: 14.5px; line-height: 1.62; position: relative; }
.answer-body p { margin: 0 0 12px; }
.answer-body h3 { font-size: 15px; font-weight: 650; margin: 18px 0 6px; }
.answer-body p.anchored { box-shadow: -10px 0 0 -7px var(--yellow); }
.answer-body table { border-collapse: collapse; margin: 4px 0 14px; font-size: 13px; width: 100%; max-width: 420px; }
.answer-body th { text-align: left; font-weight: 600; color: var(--text-2); font-size: 12px; padding: 5px 16px 5px 0; border-bottom: .5px solid var(--sep-strong); }
.answer-body td { padding: 5px 16px 5px 0; border-bottom: .5px solid var(--sep); font-variant-numeric: tabular-nums; }
mark.hl { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 1px; transition: background .4s; }
.bm { display: inline-flex; align-items: center; gap: 2px; height: 18px; padding: 0 6px 0 4px; margin: 0 2px; border-radius: 9px; vertical-align: 1px; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); line-height: 1; }
.bm:hover { background: var(--accent); color: #fff; }
.bm .i { width: 12px; height: 12px; }
.recap { padding: 9px 12px; border-radius: 12px; background: var(--accent-soft); margin: 0 0 14px; font-size: 13.5px; }
.sources { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.src { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-3); max-width: 100%; }
.src:hover { color: var(--accent); }
.src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--field); font-size: 12.5px; color: var(--text-2); margin: 0 0 10px; }
.status b { color: var(--text); font-weight: 600; }
.status .sp { flex: 1; }
.pill-btn { height: 24px; padding: 0 10px; border-radius: 12px; background: var(--control); box-shadow: inset 0 0 0 .5px var(--sep-strong); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.pill-btn.stop { color: var(--red); }
.pill-btn.acc { background: var(--accent); color: #fff; box-shadow: none; }
.caret { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: -2px; margin-left: 2px; border-radius: 1px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.quote { border-left: 3px solid var(--yellow); padding: 4px 12px; margin: 0 0 12px; color: var(--text-2); font-size: 13px; }
#gutter { position: absolute; z-index: 4; width: 24px; height: 24px; border-radius: 7px; display: none; place-items: center; color: var(--text-3); background: var(--window); box-shadow: 0 0 0 .5px var(--sep-strong), 0 1px 3px var(--shadow-soft); }
#gutter.on { display: grid; }
#gutter:hover { color: var(--accent); }
/* note preview */
.note-t { font-size: 20px; font-weight: 700; margin: 4px 0 12px; outline: none; }
.ol { font-size: 14px; line-height: 1.5; }
.bl { display: flex; align-items: flex-start; gap: 2px; padding: 2px 0 2px calc(var(--d) * 22px); border-radius: 6px; }
.bl.flash { background: var(--hl); }
.bdot { width: 14px; height: 22px; display: grid; place-items: center; flex: none; }
.bdot::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--text-2); }
.bt { flex: 1; min-width: 0; padding: 0 4px; border-radius: 4px; }
.bl.has > .bt { font-weight: 650; }
a.wl { color: var(--accent); text-decoration: none; background: var(--accent-soft); border-radius: 5px; padding: 0 4px; white-space: nowrap; cursor: pointer; font-weight: 500; }
.clip { border-radius: 14px; box-shadow: inset 0 0 0 .5px var(--sep-strong); padding: 14px 16px; }
.clip p { margin: 6px 0 0; color: var(--text-2); }
.welcome { padding: 60px 40px; max-width: 520px; }
.welcome h1 { font-size: 22px; margin: 0 0 6px; }
.welcome p { color: var(--text-2); margin: 0 0 10px; font-size: 14px; }

/* popovers, sheets, toast */
.popover { position: fixed; z-index: 80; min-width: 200px; max-width: 340px; padding: 5px; border-radius: 12px; background: var(--popover);
  backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8); box-shadow: 0 0 0 .5px var(--sep-strong), 0 10px 32px var(--shadow); }
.popover[hidden] { display: none; }
.mi { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; height: 24px; padding: 0 10px 0 8px; border-radius: 6px; white-space: nowrap; }
.mi .ck { width: 12px; flex: none; }
.mi .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.mi kbd { margin-left: 18px; }
.mi:hover:not(:disabled), .mi:focus-visible { background: var(--accent); color: #fff; outline: none; }
.mi:hover kbd, .mi:focus-visible kbd { color: rgba(255,255,255,.8); }
.msep { border-top: .5px solid var(--sep-strong); margin: 5px 8px; }
.mhead { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 4px 10px 2px; }
#selpop { position: fixed; z-index: 75; display: flex; gap: 2px; padding: 4px; border-radius: 12px; background: var(--popover); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: 0 0 0 .5px var(--sep-strong), 0 8px 24px var(--shadow); }
#selpop[hidden] { display: none; }
#selpop button { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 8px; font-size: 12.5px; }
#selpop button:hover { background: var(--accent); color: #fff; }
#selpop button:hover kbd { color: rgba(255,255,255,.8); }
.bdraft { width: 320px; padding: 6px; }
.bdraft .anc { font-size: 12px; color: var(--text-2); border-left: 3px solid var(--yellow); padding: 2px 0 2px 8px; margin-bottom: 8px; }
.bdraft textarea { width: 100%; border: 0; resize: none; background: var(--field); border-radius: 8px; padding: 7px 9px; font-size: 13px; min-height: 58px; }
.bdraft .acts { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.bdraft .acts .sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 4px; border-radius: 12px; font-size: 12px; color: var(--text-2); }

const C1_HTML = `<p>LFP (LiFePO₄/graphite) cells age through two coupled paths: <em>calendar aging</em>, which proceeds whenever the cell sits at a given state of charge (SOC) and temperature, and <em>cycle aging</em>, which scales with energy throughput and depth of discharge. At high SOC both paths speed up, for different reasons.</p>
<h3>SEI growth</h3>
<p>The solid–electrolyte interphase (SEI) on the graphite anode thickens continuously and consumes cyclable lithium. Its growth rate depends on anode potential: a fully lithiated anode sits near 0.1 V vs Li/Li⁺, where electrolyte reduction is fastest. <mark class="hl" data-hl="h1">SEI growth accelerates above ~80% SOC</mark><button class="bm" data-act="marker" data-id="b1" title="Branch: Is calendar or cycle aging dominant for a 4-hour peaker?"><svg class="i" width="12" height="12" viewBox="0 0 24 24"><circle cx="7" cy="5.5" r="2"/><circle cx="7" cy="18.5" r="2"/><circle cx="17" cy="7.5" r="2"/><path d="M7 7.5v9M17 9.5c0 4.5-10 2.5-10 7"/></svg>1</button>, which is why storage at 100% SOC loses capacity roughly twice as fast as storage at 50% (Schimpe et al. 2018).</p>
<h3>Lithium plating</h3>
<p>At high SOC the anode has little intercalation headroom left. Charging into that region, especially below 15 °C or above about 0.5C, can deposit metallic lithium on the graphite surface instead of intercalating it. Part of the plated lithium re-intercalates during rest; the rest is lost and seeds further SEI growth.</p>
<h3>Calendar vs cycle aging</h3>
<p>For stationary storage with fewer than one full cycle per day, calendar aging is usually the larger term over a 15–20 year life. The SOC at which a system idles therefore matters more than how many cycles it performs. Typical capacity fade at 25 °C by idle SOC band:</p>
<table><thead><tr><th>SOC band</th><th>Capacity fade per year at 25 °C</th></tr></thead><tbody><tr><td>0–30%</td><td>1.1%</td></tr><tr><td>30–70%</td><td>1.6%</td></tr><tr><td>70–100%</td><td>2.9%</td></tr></tbody></table>
<p>The LFP voltage curve is flat between roughly 20% and 90% SOC, so cell voltage is a poor SOC estimate in that range. Battery management systems that drift toward the top of the window without recalibration spend more time above 80% than their setpoints indicate.</p>
<p>In practice, operators that park fleets at 50–60% SOC between dispatch events and charge shortly before the evening ramp reduce calendar fade by about a third relative to fleets held full (NREL ATB 2026). Most of the remaining spread between sites is explained by cell temperature, which this answer does not cover.</p>`;
const F1_HTML = `<p>Lithium iron phosphate cells used in grid storage lose capacity faster when held at high state of charge, mainly because the graphite anode's low potential accelerates growth of the solid–electrolyte interphase, which consumes cyclable lithium, and because charging into a nearly full anode risks lithium plating. For stationary systems that cycle less than once per day, calendar aging dominates over a 15–20 year life, so <mark class="hl" data-hl="h2">the idle SOC window — not cycle count — is the main operational lever on degradation</mark>, with fade rising from about 1.1% per year at 0–30% SOC to 2.9% at 70–100% SOC at 25 °C.</p>`;
const B1_HTML = `<p>Calendar aging. A 4-hour peaker typically runs 200–300 equivalent full cycles per year, below the ~365 assumed in most warranty models. At that throughput, cycle fade for LFP is about 0.5–0.8% per year, while calendar fade at a 60–90% idle SOC is 1.6–2.9% per year at 25 °C.</p><p>Cycle aging becomes comparable only above roughly 1.5 cycles per day, or when the site sees sustained cell temperatures above 35 °C.</p>`;

const ACT = {
  source: (el) => setSource(el.dataset.s),
  pick: (el) => { const ci = +el.dataset.ci; if (ci === 0 && S.query) { openItem(el.dataset.id); return; } pick(ci, el.dataset.id); },
  open: (el, e) => { e.preventDefault(); openItem(el.dataset.id); },
  toggleSidebar, closeDrawer: () => $("#win").classList.remove("drawer"),
  wsMenu: (el) => openMenuAt(el.getBoundingClientRect(), [{ h: "Workspaces" }, ...Object.keys(WS).map((w) => ({ l: WS[w].name, c: S.ws === w, a: () => setWs(w) }))]),
  moreMenu: (el) => { const r = el.getBoundingClientRect(); openMenuAt({ left: r.right - 230, right: r.right, top: r.top, bottom: r.bottom }, [
    { l: "Ask a New Question", k: "⌘N", a: () => { const a = $("#askq"); if (a) a.focus(); } }, { l: "New Note", k: "⇧⌘N", a: () => newNote() }, { l: "New Folder", a: newFolder }, "-",
    { l: "Archive", a: () => setSource("F:" + (S.ws === "personal" ? "parchive" : "archive")) }, "-",
    { l: "Agent Settings…", k: "⌘,", a: openSettings }, { l: "Keyboard Shortcuts", a: openShortcuts }]); },
  clearSearch: (el, e) => { e.preventDefault(); S.query = ""; renderAll(); },
  agentMenu: (el) => openMenuAt(el.getBoundingClientRect(), [{ h: "Run with" }, ...Object.entries(AG).map(([k, a]) => ({ l: `${a.name} · ${a.model}`, c: S.ag === k, a: () => { S.ag = k; $$('[data-act="agentMenu"]').forEach((b) => { if (b.classList.contains("askf-ag")) b.innerHTML = `<span class="mono ${a.cls}">${a.mono}</span>`; else b.outerHTML = agentChip(k); }); } }))]),
  stop: (el, e) => { e.stopPropagation(); finishRun(el.dataset.id, true); toast("Run stopped"); },
  cancelQueue: (el, e) => { e.stopPropagation(); const it = I[el.dataset.id]; it.status = "stopped"; it.elapsed = 0; renderAll(); toast("Removed from queue"); },
  retry: (el) => { const it = I[el.dataset.id]; startRun(it.id, it.type === "branch" ? GENERIC_B : it.type === "follow" ? GENERIC_F : GENERIC); renderCols(); },
  ansMenu: (el) => { const id = el.dataset.id; openMenuAt(el.getBoundingClientRect(), [
    { l: "Copy as Markdown", a: () => toast("Copied answer") }, { l: "Retry", a: () => ACT.retry({ dataset: { id } }) }, "-",
    { l: "Save to Note…", a: () => addToNoteMenu(el.getBoundingClientRect(), "", id) },
    { l: "Branch from Whole Answer…", a: () => { S.branchDraft = { parent: pageOfId(id), quote: "" }; openBranchDraft(el.getBoundingClientRect()); } }]); },
  srcOpen: (el) => { if (el.dataset.id) openItem(el.dataset.id); else toast("Opens in the built-in browser"); },
  marker: (el, e) => { e.stopPropagation(); openChild(pageFor(el) || I[el.dataset.id].parent, el.dataset.id); },
  gutterBranch: () => { const p = gutterPara; if (!p) return; const t = p.textContent.replace(/\s+/g, " ").trim(); S.branchDraft = { parent: pageFor(p) || pageOfId(p.closest("[data-answer]").dataset.answer), quote: (t.match(/^.*?[.!?](\s|$)/) || [t])[0].trim(), para: p }; openBranchDraft(p.getBoundingClientRect()); },
  cancelBranch: () => { S.branchDraft = null; closePop(); }, sendBranch,
  selHighlight, selBranch, selNote: () => { if (!selSaved) return; const r = selSaved.r.getBoundingClientRect(); hideSel(); addToNoteMenu(r, selSaved.text, selSaved.ans.dataset.answer); }, selCopy: () => { hideSel(); toast("Copied passage"); },
  colBack: (el) => { S.colFocus = Math.max(0, +el.dataset.f - 1); renderCols(); },
  closeSheet, toastAct: () => { toastHold = 0; const f = toastFn; $("#toast").classList.remove("on", "act"); if (f) f(); }
};
function newFolder() { const id = "fo" + ++uid; F[id] = { name: "New Folder", icon: "folder", ws: S.ws, items: [] }; FORDER[S.ws].splice(FORDER[S.ws].length - 1, 0, id); renderSidebar(); toast("Folder created — drag chats onto it"); }

document.addEventListener("click", (e) => {
  const mi = e.target.closest("#pop .mi[data-mi]"); if (mi) { const x = popCtx && popCtx[+mi.dataset.mi]; closePop(); if (x && x.a) x.a(); return; }
  const a = e.target.closest("[data-act]");
  if (a) { if (!a.closest("#pop")) closePop(); const f = ACT[a.dataset.act]; if (f) f(a, e); return; }
  if (!e.target.closest("#pop") && !e.target.closest("#selpop")) closePop();
  if (e.target === $("#sheet")) closeSheet();
});
document.addEventListener("mousemove", (e) => {
  const g = $("#gutter"); if (!g) return;
  const p = e.target.closest && e.target.closest(".answer-body[data-answer] > p");
  if (p) { const c = $("#content").getBoundingClientRect(); const r = p.getBoundingClientRect(); gutterPara = p; g.style.left = (r.left - c.left - 32) + "px"; g.style.top = (r.top - c.top + 1) + "px"; g.classList.add("on"); }
  else if (!e.target.closest("#gutter")) g.classList.remove("on");
});
document.addEventListener("mouseup", (e) => { if (e.target.closest("#selpop") || e.target.closest("#pop")) return; setTimeout(showSel, 0); });
document.addEventListener("selectionchange", () => { if (!$("#selpop").hidden && getSelection().isCollapsed) hideSel(); });
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "q") { S.query = t.value; t.closest(".search").classList.toggle("has", !!t.value); S.path = []; S.colFocus = 0; renderCols(); renderSidebar(); return; }
  if (t.id === "askq") { S.askDraft = t.value; return; }
  if (t.classList.contains("bt") && t.dataset.b) { B[t.dataset.b].html = t.innerHTML; return; }
  if (t.dataset.title) I[t.dataset.title].title = t.textContent.trim() || "Untitled Note";
});
/* drag a chat or note onto a folder */
let dragId = null;
document.addEventListener("dragstart", (e) => { const d = e.target.closest && e.target.closest('[data-drag][draggable="true"]'); if (!d || !I[d.dataset.drag]) return; dragId = d.dataset.drag; try { e.dataTransfer.setData("text/plain", dragId); } catch (x) {} });
document.addEventListener("dragover", (e) => { const sb = e.target.closest && e.target.closest(".sb-item[data-drop]"); $$(".sb-item.drop").forEach((x) => x.classList.remove("drop")); if (dragId && sb) { e.preventDefault(); sb.classList.add("drop"); } });
document.addEventListener("drop", (e) => { const sb = e.target.closest(".sb-item[data-drop]"); if (dragId && sb) { e.preventDefault(); const it = I[dragId]; const f = sb.dataset.drop.slice(2); F[it.folder].items = F[it.folder].items.filter((x) => x !== dragId); it.folder = f; F[f].items.push(dragId); renderAll(); toast(`Moved to ${F[f].name}`); } dragId = null; $$(".sb-item.drop").forEach((x) => x.classList.remove("drop")); });
/* column resizing */
const colDrag = { el: null };
document.addEventListener("pointerdown", (e) => { const r = e.target.closest && e.target.closest(".col-rs"); if (!r || e.button !== 0) return; e.preventDefault(); const col = r.previousElementSibling; Object.assign(colDrag, { el: col, r, key: r.dataset.rs, sx: e.clientX, sw: col.offsetWidth }); r.classList.add("drag"); try { r.setPointerCapture(e.pointerId); } catch (x) {} });
document.addEventListener("pointermove", (e) => { if (!colDrag.el) return; const w = Math.max(200, Math.min(700, colDrag.sw + e.clientX - colDrag.sx)); colDrag.el.style.width = w + "px"; S.colW[colDrag.key] = w; });
document.addEventListener("pointerup", () => { if (colDrag.r) colDrag.r.classList.remove("drag"); colDrag.el = colDrag.r = null; });

/* keyboard */
document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey; const k = e.key; const t = e.target;
  const typing = t.isContentEditable || t.tagName === "TEXTAREA" || t.tagName === "INPUT";
  if (k === "Escape") { if (!$("#pop").hidden) { closePop(); return; } if (!$("#sheet").hidden) { closeSheet(); return; } if (!$("#selpop").hidden) { hideSel(); return; } if ($("#win").classList.contains("drawer")) { $("#win").classList.remove("drawer"); return; } if (t.id === "q" && S.query) { S.query = ""; renderAll(); return; } }
  if (!$("#pop").hidden && (k === "ArrowDown" || k === "ArrowUp") && !t.dataset.bdraft) { const ms = $$("#pop .mi:not(:disabled)"); if (ms.length) { e.preventDefault(); let i = ms.indexOf(document.activeElement); ms[(i + (k === "ArrowDown" ? 1 : -1) + ms.length) % ms.length].focus(); } return; }
  if (!$("#selpop").hidden && !mod && !(t.isContentEditable || t.tagName === "TEXTAREA" || t.id === "askq")) { const m = { h: selHighlight, b: selBranch, n: ACT.selNote, c: ACT.selCopy }[k.toLowerCase()]; if (m) { e.preventDefault(); m(); return; } }
  if (t.id === "askq" && k === "Enter" && !e.isComposing) { e.preventDefault(); const q = t.value.trim(); if (q) { S.askDraft = ""; createChat(q); } return; }
  if (t.dataset && t.dataset.follow && k === "Enter" && !e.isComposing) { e.preventDefault(); const q = t.value.trim(); if (!q) return; t.value = ""; if (e.shiftKey && mod) { const id = createBranch(t.dataset.follow, q, null); openChild(t.dataset.follow, id); } else createFollow(t.dataset.follow, q); return; }
  if (t.dataset && t.dataset.bdraft && k === "Enter" && !e.shiftKey) { e.preventDefault(); sendBranch(); return; }
  if (t.classList && t.classList.contains("bt") && t.dataset.b) { bulletKey(e, t); if (e.defaultPrevented) return; }
  if (t.dataset && t.dataset.title && k === "Enter") { e.preventDefault(); const f = $(".bt[data-b]"); if (f) f.focus(); return; }
  if (mod) {
    const key = k.toLowerCase();
    if (key === "n" && e.shiftKey) { e.preventDefault(); newNote(); return; }
    if (key === "n") { e.preventDefault(); const a = $("#askq"); if (S.query) { S.query = ""; renderAll(); } S.colFocus = 0; renderCols(); const a2 = $("#askq"); if (a2) a2.focus(); return; }
    if (key === "f") { e.preventDefault(); const q = $("#q"); q.focus(); q.select(); return; }
    if (key === ",") { e.preventDefault(); openSettings(); return; }
    if (key === "o") { e.preventDefault(); ACT.wsMenu($(".ws-btn")); return; }
    if (key === "s" && e.ctrlKey && e.metaKey) { e.preventDefault(); toggleSidebar(); return; }
  }
  if (typing) return;
  const cell = t.closest && t.closest("#cols .cell");
  const col = t.closest && t.closest("#cols [data-fci]");
  if (!col) return;
  const ci = +col.dataset.fci;
  if (k === "ArrowDown" || k === "ArrowUp") {
    if (!cell) return; e.preventDefault();
    const cells = $$(".cell", col); const i = cells.indexOf(cell); const n = cells[Math.max(0, Math.min(cells.length - 1, i + (k === "ArrowDown" ? 1 : -1)))];
    if (n && n !== cell) pick(ci, n.dataset.id);
  } else if (k === "ArrowRight") {
    e.preventDefault(); const next = $(`#cols .col[data-fci="${ci + 1}"]`);
    if (next) { const c = $(".cell.on", next) || $(".cell", next); if (c) { if (!c.classList.contains("on")) pick(ci + 1, c.dataset.id); else c.focus(); c.scrollIntoView({ block: "nearest", inline: "nearest" }); } }
    else { const pv = $("#cols .col-prev"); if (pv) { pv.tabIndex = -1; pv.focus(); } }
  } else if (k === "ArrowLeft") {
    e.preventDefault(); const prevCol = $(`#cols [data-fci="${ci - 1}"]`); if (prevCol) { const c = $(".cell.on", prevCol); if (c) { pick(ci - 1, c.dataset.id); } }
  }
});
addEventListener("resize", () => { if (innerWidth > 760) $("#win").classList.remove("drawer"); });

/* ============ standalone variant switcher ============ */
function renderVSwitch() {
  if (parent !== window) return;
  const v = $("#vswitch"); v.hidden = false; const cur = document.documentElement.dataset.variant;
  v.innerHTML = MOCK.variants.map((x) => `<button aria-pressed="${cur === x.id}" title="${esc(x.summary)}" onclick="setVariant('${x.id}')">${x.id.toUpperCase()}<span class="vl"> · ${esc(x.label)}</span></button>`).join("");
}

/* ============ boot ============ */
setVariant("b2");
startRun("b2", B2_FULL, { prefix: B2_DONE, elapsed: 42, tools: 6, warm: 0, tick: 140, maxTools: 8 });
if (parent !== window) parent.postMessage({ type: "mock:ready", mock: MOCK }, "*");
</script>
</body>
</html>
