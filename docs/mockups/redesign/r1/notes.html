<!doctype html>
<!--
  Session redesign, round 1 — candidate "notes".
  Influence: Apple Notes (macOS). Three-pane notes app (folders sidebar, note list, editor)
  where a model can be asked inside any note. Self-contained: no network requests.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session · Notes-style</title>
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bg:#ffffff; --sb:#e9e8e6; --sb-sel:#d6d5d2; --sep:#e4e4e4; --sep-strong:#d2d2d2;
  --text:#1d1d1f; --text2:#6e6e73; --text3:#a3a3a8; --icon:#6b6b70;
  --accent:#e3a600; --accent-strong:#f6c624; --accent-ink:#a87800; --on-accent:#1d1d1f;
  --sel:#fbe29a; --sel-ink:#1d1d1f; --sel2:#e8e8e8; --hover:rgba(0,0,0,.045);
  --chat-bg:#fbf9f3; --chat-border:#ece5cf; --quote-bar:#d6d6d6;
  --card:#ffffff; --card-b:#e1e1e1; --thumb:#ffffff;
  --shadow:0 12px 32px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.14);
  --pop:#ffffff; --pop-dark:#2b2b2d; --pop-dark-ink:#f2f2f2;
  --run:#2c9a45; --warn:#c27400; --danger:#d63a2f;
  --mk-yellow:#fff0a6; --mk-pink:#ffd5e4; --mk-purple:#e7dcff; --mk-mint:#cff2e2; --mk-blue:#d5e7ff;
  --dot-yellow:#f5c400; --dot-pink:#ff5a8f; --dot-purple:#9a6bff; --dot-mint:#2cc28a; --dot-blue:#3d8bff;
  --field:#ffffff; --field-b:#d5d5d5; --seg:#e6e6e6; --seg-on:#ffffff;
  --edge:#c8c8cc; --scrim:rgba(0,0,0,.22); --tl-r:#ff5f57; --tl-y:#febc2e; --tl-g:#28c840;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1e1e1e; --sb:#2a2928; --sb-sel:#474643; --sep:#333333; --sep-strong:#444444;
  --text:#ececec; --text2:#9b9ba0; --text3:#6d6d72; --icon:#a3a3a8;
  --accent:#f0c133; --accent-strong:#ffd60a; --accent-ink:#f2c43d; --on-accent:#1d1d1f;
  --sel:#6b5719; --sel-ink:#f6f1df; --sel2:#3a3a3a; --hover:rgba(255,255,255,.06);
  --chat-bg:#252420; --chat-border:#3b3829; --quote-bar:#585858;
  --card:#262626; --card-b:#3a3a3a; --thumb:#2b2b2b;
  --shadow:0 14px 36px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.12);
  --pop:#2c2c2e; --pop-dark:#3a3a3c; --pop-dark-ink:#f2f2f2;
  --run:#4cc36a; --warn:#f0a83a; --danger:#ff6b5e;
  --mk-yellow:#5b4e12; --mk-pink:#5a2b3d; --mk-purple:#43366c; --mk-mint:#1d4c3a; --mk-blue:#213f69;
  --field:#2a2a2a; --field-b:#454545; --seg:#323232; --seg-on:#5b5b5b;
  --edge:#585858; --scrim:rgba(0,0,0,.45);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1e1e1e; --sb:#2a2928; --sb-sel:#474643; --sep:#333333; --sep-strong:#444444;
  --text:#ececec; --text2:#9b9ba0; --text3:#6d6d72; --icon:#a3a3a8;
  --accent:#f0c133; --accent-strong:#ffd60a; --accent-ink:#f2c43d; --on-accent:#1d1d1f;
  --sel:#6b5719; --sel-ink:#f6f1df; --sel2:#3a3a3a; --hover:rgba(255,255,255,.06);
  --chat-bg:#252420; --chat-border:#3b3829; --quote-bar:#585858;
  --card:#262626; --card-b:#3a3a3a; --thumb:#2b2b2b;
  --shadow:0 14px 36px rgba(0,0,0,.6),0 0 0 .5px rgba(255,255,255,.12);
  --pop:#2c2c2e; --pop-dark:#3a3a3c; --pop-dark-ink:#f2f2f2;
  --run:#4cc36a; --warn:#f0a83a; --danger:#ff6b5e;
  --mk-yellow:#5b4e12; --mk-pink:#5a2b3d; --mk-purple:#43366c; --mk-mint:#1d4c3a; --mk-blue:#213f69;
  --field:#2a2a2a; --field-b:#454545; --seg:#323232; --seg-on:#5b5b5b;
  --edge:#585858; --scrim:rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.4 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- window grid ---------- */
.app{--sbw:216px;--lw:292px;display:grid;height:100vh;grid-template-columns:var(--sbw) var(--lw) minmax(0,1fr);
  grid-template-rows:52px minmax(0,1fr);grid-template-areas:"sb tb tb" "sb mid ed"}
.app.nosb{--sbw:0px}
.app[data-view="gallery"],.app[data-view="outline"],.app[data-view="map"]{grid-template-columns:var(--sbw) minmax(0,1fr) 0;grid-template-areas:"sb tb tb" "sb mid mid"}
.app[data-view="gallery"] .ed,.app[data-view="outline"] .ed,.app[data-view="map"] .ed{display:none}
.app.full{grid-template-columns:var(--sbw) 0 minmax(0,1fr);grid-template-areas:"sb tb tb" "sb ed ed"}
.app.full .mid{display:none}
.app.full .ed{display:flex}

/* sidebar */
.sb{grid-area:sb;background:var(--sb);border-right:1px solid var(--sep);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.app.nosb .sb{visibility:hidden}
.sb-top{height:52px;display:flex;align-items:center;gap:8px;padding:0 10px 0 18px;flex:none}
.tl{display:flex;gap:8px}.tl i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.tl i:nth-child(1){background:var(--tl-r)}.tl i:nth-child(2){background:var(--tl-y)}.tl i:nth-child(3){background:var(--tl-g)}
.sb-scroll{flex:1;overflow:auto;padding:0 10px 10px}
.acct{display:flex;align-items:center;justify-content:space-between;color:var(--text2);font-size:11px;font-weight:600;padding:12px 8px 4px;letter-spacing:.01em}
.acct button{display:flex;align-items:center;gap:4px;border-radius:4px;padding:1px 2px}
.acct .chev{transition:transform .15s}
.acct.closed .chev{transform:rotate(-90deg)}
.acct.closed + .flist{display:none}
.flist{list-style:none;margin:0;padding:0}
.fi{display:flex;align-items:center;gap:7px;height:28px;padding:0 8px;border-radius:6px;color:var(--text);cursor:default;width:100%;text-align:left}
.fi svg.i{color:var(--accent);width:17px;height:17px}
.fi .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .c{color:var(--text2);font-size:12px;font-variant-numeric:tabular-nums}
.fi:hover{background:var(--hover)}
.fi.on{background:var(--sb-sel)}
.fi.child{padding-left:22px}
.fi .run-dot{width:6px;height:6px;border-radius:50%;background:var(--run);margin-right:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px 8px}
.tag-pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:11px;background:var(--hover);border:1px solid var(--sep-strong);font-size:12px;color:var(--text)}
.tag-pill:hover{background:var(--sb-sel)}
.tag-pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag-pill .tc{color:var(--text2);font-size:11px;display:none}
html[data-variant="e"] .tag-pill .tc{display:inline}
.tag-pill.on .tc{color:inherit}
.sb-foot{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--sep)}
.sb-foot button{display:flex;align-items:center;gap:6px;color:var(--text2);padding:4px 6px;border-radius:5px}
.sb-foot button:hover{background:var(--hover);color:var(--text)}
.models-mini{display:flex;align-items:center;gap:6px;padding:6px 8px;margin:8px 0 0;border-radius:6px;color:var(--text2);font-size:11.5px;width:100%;text-align:left}
.models-mini:hover{background:var(--hover)}
.mdot{width:7px;height:7px;border-radius:50%;background:var(--run);display:inline-block;flex:none}
.mdot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text3)}

/* toolbar */
.tb{grid-area:tb;display:flex;align-items:center;border-bottom:1px solid var(--sep);background:var(--bg);min-width:0}
.tb-l{width:var(--lw);flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;height:100%;border-right:1px solid var(--sep)}
.app[data-view="gallery"] .tb-l,.app[data-view="outline"] .tb-l,.app[data-view="map"] .tb-l,.app.full .tb-l{border-right:0;width:auto}
.tb-r{flex:1;display:flex;align-items:center;gap:2px;padding:0 10px;min-width:0}
.tbtn{height:28px;min-width:30px;display:inline-flex;align-items:center;justify-content:center;gap:5px;border-radius:6px;color:var(--icon);padding:0 6px}
.tbtn:hover{background:var(--hover)}
.tbtn.on{background:var(--sel2);color:var(--text)}
.tbtn svg.i{width:18px;height:18px}
.tbtn[disabled]{opacity:.35}
.tbtn.ask{color:var(--text);border:1px solid var(--sep-strong);padding:0 8px;height:26px;margin-left:4px}
.tbtn.ask b{font-weight:500}
.tbtn.ask kbd{font:11px var(--font);color:var(--text3)}
.seg{display:inline-flex;background:var(--seg);border-radius:7px;padding:2px;gap:1px}
.seg button{height:24px;width:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:var(--icon)}
.seg button svg.i{width:16px;height:16px}
.seg button.on{background:var(--seg-on);color:var(--text);box-shadow:0 .5px 1.5px rgba(0,0,0,.18)}
.tsp{flex:1}
.vsep{width:1px;height:18px;background:var(--sep-strong);margin:0 6px}
.search{position:relative;display:flex;align-items:center;width:200px;max-width:34vw;height:28px;border-radius:7px;background:var(--seg);padding:0 8px;gap:5px;color:var(--text2)}
.search input{border:0;background:transparent;outline:0;font:inherit;color:var(--text);flex:1;min-width:0}
.search:focus-within{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}
.search .x{display:none;width:16px;height:16px;border-radius:50%;background:var(--text3);color:var(--bg);align-items:center;justify-content:center}
.search.has .x{display:inline-flex}
.back{display:none}
.app.full .back{display:inline-flex}

/* middle list */
.mid{grid-area:mid;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);border-right:1px solid var(--sep)}
.mid-body{flex:1;overflow:auto;padding:4px 10px 24px}
.lhead{font-size:13px;font-weight:700;color:var(--text);padding:14px 10px 6px;position:sticky;top:-4px;background:var(--bg);z-index:1;display:flex;justify-content:space-between;align-items:baseline}
.lhead small{font-weight:400;color:var(--text2);font-size:11.5px}
.ftitle{padding:10px 10px 2px;font-size:20px;font-weight:700;display:none}
.row{position:relative;display:block;width:100%;text-align:left;padding:9px 10px 9px 22px;border-radius:7px;margin:1px 0}
.row::after{content:"";position:absolute;left:22px;right:10px;bottom:-1px;height:1px;background:var(--sep)}
.row:hover{background:var(--hover)}
.row.on{background:var(--sel);color:var(--sel-ink)}
.row.on::after,.row:has(+ .row.on)::after{display:none}
.row.sub{padding-left:40px}
.row.sub::after{left:40px}
.row .t{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.row .t span{overflow:hidden;text-overflow:ellipsis}
.row .m{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row.on .m,.row.on .f{color:color-mix(in srgb,var(--sel-ink) 70%,transparent)}
.row .m b{font-weight:400;color:var(--text);margin-right:6px}
.row.on .m b{color:var(--sel-ink)}
.row .f{display:flex;align-items:center;gap:4px;color:var(--text2);font-size:11.5px;margin-top:2px}
.row .f svg.i{width:12px;height:12px}
.row .disc{position:absolute;left:4px;top:11px;width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--text2);border-radius:3px}
.row .disc svg{width:11px;height:11px;transition:transform .15s}
.row .disc.closed svg{transform:rotate(-90deg)}
.row .thumbr{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:5px;background:linear-gradient(135deg,#2f6f4f,#7cbf8c);opacity:.9}
.row.hasthumb{padding-right:56px}
.st{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--run);flex:none}
.st.q{color:var(--warn)}
.st.done{color:var(--text3)}
.spin{width:11px;height:11px;border-radius:50%;border:1.6px solid currentColor;border-right-color:transparent;animation:spin .9s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:10px;text-align:center;padding:20px}
.empty h3{margin:0;font-size:17px;font-weight:600;color:var(--text3)}
.hit{background:var(--mk-yellow);border-radius:2px}
.sugg{padding:6px 4px}
.sugg button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:6px}
.sugg button:hover{background:var(--hover)}
.sugg svg.i{color:var(--accent)}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:22px 18px;padding:6px 12px 20px}
.gcard{display:flex;flex-direction:column;gap:7px;text-align:center;align-items:stretch}
.gthumb{position:relative;height:150px;border-radius:9px;background:var(--thumb);border:1px solid var(--card-b);box-shadow:0 1px 2px rgba(0,0,0,.06);padding:10px 11px;text-align:left;overflow:hidden;font-size:8.5px;line-height:1.35;color:var(--text2)}
.gthumb b{display:block;color:var(--text);font-size:9.5px;margin-bottom:4px}
.gthumb .gq{border-left:2px solid var(--accent);padding-left:5px;margin:4px 0}
.gthumb .gbadge{position:absolute;right:7px;bottom:7px;font-size:10px;background:var(--bg);border-radius:9px;padding:1px 7px;box-shadow:0 0 0 1px var(--sep-strong)}
.gcard.on .gthumb{box-shadow:0 0 0 3px var(--accent)}
.gcard:hover .gthumb{border-color:var(--sep-strong)}
.gt{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.gd{color:var(--text2);font-size:11.5px;margin-top:-5px}
.gal-head{grid-column:1/-1;font-weight:700;font-size:13px;margin:6px 0 -10px}

/* outline view */
.ol{max-width:860px;margin:0 auto;padding:12px 18px 40px}
.ol h2{font-size:22px;margin:8px 0 2px}
.ol .sub{color:var(--text2);margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ol .sub button{color:var(--accent-ink);border-radius:4px}
.ol ul{list-style:none;margin:0;padding:0}
.ol ul ul{padding-left:22px}
.orow{display:flex;align-items:center;gap:6px;min-height:30px;padding:2px 6px;border-radius:6px;position:relative}
.orow:hover{background:var(--hover)}
.orow.sel{background:var(--sel2)}
.orow .grip{opacity:0;color:var(--text3);width:12px;cursor:grab;display:flex}
.orow:hover .grip{opacity:1}
.orow .tw{width:16px;height:16px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.orow .tw svg{width:11px;height:11px;transition:transform .15s}
.orow .tw.closed svg{transform:rotate(-90deg)}
.orow .tw.leaf{visibility:hidden}
.orow .ic{color:var(--text2);display:flex}
.orow .ic.isnote{color:var(--accent)}
.orow .ot{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .ot.l0{font-weight:600}
.orow .meta{color:var(--text3);font-size:11.5px;white-space:nowrap}
.orow .open{opacity:0;color:var(--accent-ink);font-size:12px;padding:0 4px;border-radius:4px}
.orow:hover .open,.orow.sel .open{opacity:1}
.orow.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.orow.dragging{opacity:.4}
.ol li.collapsed > ul{display:none}
.nlink{color:var(--accent-ink);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--accent-ink) 45%,transparent);text-underline-offset:2px;cursor:pointer;border-radius:3px}
.nlink:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}

/* map view */
.mapwrap{position:relative;height:100%;display:flex;flex-direction:column}
.map-top{display:flex;align-items:center;gap:14px;padding:10px 16px;color:var(--text2);font-size:12px;flex-wrap:wrap}
.map-top h2{font-size:15px;color:var(--text);margin:0 8px 0 0}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg svg{width:26px;height:8px}
.map-svg{flex:1;width:100%;min-height:0}
.gn rect{fill:var(--card);stroke:var(--card-b);stroke-width:1}
.gn text{fill:var(--text);font:12px var(--font)}
.gn .gsub{fill:var(--text2);font-size:10.5px}
.gn.cur rect{stroke:var(--accent);stroke-width:2}
.gn.tag rect{fill:transparent;stroke:var(--sep-strong);stroke-dasharray:0}
.gn.tag text{fill:var(--accent-ink)}
.gn{cursor:pointer}
.gn:hover rect,.gn:focus rect{stroke:var(--accent)}
.gn:focus{outline:none}
.ge{stroke:var(--edge);stroke-width:1.4;fill:none}
.ge.sub{stroke-dasharray:5 4}
.ge.tag{stroke-dasharray:1.5 4;stroke:var(--accent)}
.ge.hl{stroke:var(--accent-ink);stroke-width:2.2}
.map-svg.dim .gn:not(.nb){opacity:.3}
.map-svg.dim .ge:not(.hl){opacity:.25}

/* editor */
.ed{grid-area:ed;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.ed-wrap{flex:1;display:flex;min-height:0}
.ed-scroll{flex:1;overflow:auto;min-width:0;position:relative}
.note{max-width:720px;margin:0 auto;padding:14px 40px 120px;outline:none;font-size:14px;line-height:1.5}
.ndate{text-align:center;color:var(--text3);font-size:12px;margin:2px 0 12px;user-select:none}
.crumb{display:flex;align-items:center;gap:4px;color:var(--text2);font-size:12px;margin:-4px 0 8px}
.crumb .nlink{text-decoration:none}
.note h1{font-size:25px;line-height:1.22;font-weight:700;margin:0 0 10px;letter-spacing:-.01em;outline:none}
.note h1:empty::before{content:"New Note";color:var(--text3)}
.note p{margin:0 0 10px}
.note .sec > h2,.note .sec > h3{position:relative;margin:16px 0 6px;font-size:18px;font-weight:700;line-height:1.3}
.note .sec > h3{font-size:15px}
.sec-chev{position:absolute;left:-22px;top:3px;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--text3);opacity:0}
.sec > h2:hover .sec-chev,.sec > h3:hover .sec-chev,.sec.closed .sec-chev,.sec-chev:focus-visible{opacity:1}
.sec-chev svg{width:12px;height:12px;transition:transform .15s}
.sec.closed > .sec-chev-wrap svg,.sec.closed > h2 .sec-chev svg,.sec.closed > h3 .sec-chev svg{transform:rotate(-90deg)}
.sec.closed > .sec-body{display:none}
.sec.closed > h2::after,.sec.closed > h3::after{content:" …";color:var(--text3);font-weight:400}
.note ul.b{margin:0 0 10px;padding-left:22px}
.note ul.b li{margin:2px 0}
.note ul.b ul.b{margin:2px 0}
.ck{list-style:none;margin:0 0 10px;padding:0}
.ck li{display:flex;gap:9px;align-items:flex-start;margin:4px 0}
.ckb{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--text3);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;color:transparent}
.ck li.done .ckb{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.ck li.done .ckt{color:var(--text3)}
.ckb svg{width:11px;height:11px;stroke-width:2.4}
.ntable{border-collapse:collapse;margin:6px 0 14px;font-size:13px}
.ntable td,.ntable th{border:1px solid var(--sep-strong);padding:6px 10px;text-align:left;font-weight:400}
.ntable tr:first-child td{font-weight:600}
.ntable td.num{text-align:right;font-variant-numeric:tabular-nums}
blockquote.bq{margin:6px 0 12px;padding:2px 0 2px 12px;border-left:3px solid var(--quote-bar);color:var(--text2)}
blockquote.bq .src{display:block;font-size:12px;margin-top:3px}
.srcs{margin:4px 0 10px;padding-left:20px;color:var(--text2);font-size:13px}
.srcs li{margin:2px 0}
.tagline{margin:14px 0 4px;display:flex;gap:8px;flex-wrap:wrap}
.htag{color:var(--accent-ink);font-weight:500;cursor:pointer;border-radius:3px}
.htag:hover{background:color-mix(in srgb,var(--accent) 16%,transparent)}
mark.hl{color:inherit;border-radius:2px;padding:0 1px}
mark.hl.yellow{background:var(--mk-yellow)}mark.hl.pink{background:var(--mk-pink)}mark.hl.purple{background:var(--mk-purple)}mark.hl.mint{background:var(--mk-mint)}mark.hl.blue{background:var(--mk-blue)}
mark.hl.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
.bchip{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 13%,transparent);border-radius:9px;padding:0 7px 0 5px;margin-left:4px;vertical-align:1px;line-height:18px;cursor:pointer;white-space:nowrap;user-select:none}
.bchip svg.i{width:11px;height:11px}
.bchip:hover{background:color-mix(in srgb,var(--accent) 24%,transparent)}
.bnum{display:none;font-size:10.5px;font-weight:700;color:var(--on-accent);background:var(--accent-strong);border-radius:8px;padding:0 5px;margin-left:2px;vertical-align:2px;cursor:pointer;user-select:none}
html[data-variant="c"] .bchip{display:none}
html[data-variant="c"] .bnum{display:inline-block}

/* chat blocks */
.chat{position:relative;margin:4px 0 14px;padding:0 0 0 14px;border-left:2px solid var(--chat-border)}
.chat.first{border-left-color:transparent;padding-left:0}
.chat-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin:0 0 8px;user-select:none}
.mchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;background:var(--chat-bg);border:1px solid var(--chat-border);color:var(--text);font-weight:500}
.mchip svg.i{width:13px;height:13px;color:var(--accent-ink)}
.chat-head .grow{flex:1}
.chat-head .lnk{color:var(--text2);border-radius:4px;padding:1px 4px;display:inline-flex;align-items:center;gap:3px}
.chat-head .lnk:hover{color:var(--text);background:var(--hover)}
.chat-head .lnk svg{width:11px;height:11px}
.prompt{display:flex;gap:8px;align-items:flex-start;font-weight:600;margin:0 0 8px;font-size:14px}
.prompt .pq{color:var(--text3);font-weight:400;flex:none;user-select:none}
.prompt .quoteref{display:block;font-weight:400;color:var(--text2);font-size:12.5px;border-left:2px solid var(--quote-bar);padding-left:8px;margin:2px 0 4px}
.runbar{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2);background:var(--chat-bg);border:1px solid var(--chat-border);border-radius:8px;padding:6px 8px 6px 10px;margin:4px 0 10px;user-select:none;flex-wrap:wrap}
.runbar .st{font-size:12px}
.runbar .grow{flex:1}
.runbar .tools{font-family:var(--mono);font-size:11px;color:var(--text2)}
.pbtn{height:22px;padding:0 10px;border-radius:6px;border:1px solid var(--sep-strong);background:var(--bg);color:var(--text);font-size:12px;display:inline-flex;align-items:center;gap:5px}
.pbtn:hover{background:var(--hover)}
.pbtn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent);font-weight:500}
.pbtn svg.i{width:11px;height:11px}
.act{margin:0 0 10px;padding:6px 10px;border-radius:7px;background:var(--chat-bg);font-family:var(--mono);font-size:11.5px;color:var(--text2);display:none}
.act.open{display:block}
.act div{display:flex;gap:10px;padding:1px 0}
.act span:first-child{color:var(--text3);width:38px;flex:none}
.caret{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.askbox{display:flex;align-items:flex-start;gap:8px;border:1px solid var(--sep-strong);border-radius:10px;padding:8px 8px 8px 10px;margin:8px 0 14px;background:var(--bg);user-select:none}
.askbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.askbox svg.i.lead{color:var(--accent-ink);margin-top:3px}
.askbox textarea{flex:1;border:0;outline:0;background:transparent;font:14px/1.45 var(--font);color:var(--text);resize:none;min-height:22px;max-height:160px;padding:1px 0}
.askbox .mpick{font-size:11.5px;color:var(--text2);border-radius:5px;padding:2px 6px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap;margin-top:1px}
.askbox .mpick:hover{background:var(--hover);color:var(--text)}
.askbox .send{width:24px;height:24px;border-radius:50%;background:var(--accent-strong);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.askbox .send[disabled]{background:var(--seg);color:var(--text3)}
.askbox .send svg{width:13px;height:13px;stroke-width:2.2}
.askbox .qref{display:block;font-size:12px;color:var(--text2);border-left:2px solid var(--quote-bar);padding-left:7px;margin-bottom:4px}
.askbox .col{flex:1;display:flex;flex-direction:column;min-width:0}
.hint{color:var(--text3);font-size:12px;margin:-6px 0 14px;user-select:none}
.hint kbd{font:11px var(--font);border:1px solid var(--sep-strong);border-radius:4px;padding:0 4px;color:var(--text2)}
.summary{background:var(--chat-bg);border:1px solid var(--chat-border);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:13.5px}
.summary .lab{display:block;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.linkcard{display:flex;border:1px solid var(--card-b);border-radius:10px;overflow:hidden;margin:6px 0 14px;max-width:440px;background:var(--card)}
.linkcard .lthumb{width:96px;flex:none;background:linear-gradient(135deg,#2f6f4f,#7cbf8c)}
.linkcard .lbody{padding:10px 12px;font-size:12.5px}
.linkcard .lbody b{display:block;font-size:13px;margin-bottom:2px}
.linkcard .lbody span{color:var(--text2)}
.postcard{border:1px solid var(--card-b);border-radius:12px;padding:12px 14px;margin:6px 0 14px;max-width:440px;background:var(--card)}
.postcard .ph{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px}
.postcard .av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#6a7fdb,#9fb3ff)}
.postcard .ph span{color:var(--text2)}
.dimnote{color:var(--text2)}

/* Linked notes / Replies */
.linked{margin:26px 0 0;border-top:1px solid var(--sep);padding-top:12px;user-select:none}
.linked h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--text2);display:flex;justify-content:space-between}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;width:100%;text-align:left;font-size:13px}
.lrow:hover{background:var(--hover)}
.lrow svg.i{color:var(--accent);width:15px;height:15px}
.lrow .lt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lm{color:var(--text3);font-size:11.5px;white-space:nowrap}
.replies{display:none}
html[data-variant="c"] .replies{display:block}
.rcard{display:block;width:100%;text-align:left;border:1px solid var(--card-b);border-radius:10px;padding:9px 12px;margin:0 0 8px;background:var(--card)}
.rcard:hover{border-color:var(--sep-strong);background:var(--hover)}
.rcard .rq{font-size:12px;color:var(--text2);border-left:2px solid var(--accent);padding-left:7px;margin-bottom:4px}
.rcard .rt{font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
.rcard .rt .bnum{display:inline-block}
.rcard .rs{font-size:12px;color:var(--text2);margin-top:3px}

/* side panel (variant b chat panel, variant e link inspector) */
.side-panel{display:none;width:320px;flex:none;border-left:1px solid var(--sep);background:var(--bg);overflow:auto;flex-direction:column}
html[data-variant="b"] .side-panel.has,html[data-variant="e"] .side-panel.has{display:flex}
html[data-variant="e"] .side-panel{width:260px}
.sp-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-weight:600;font-size:12px;color:var(--text2);border-bottom:1px solid var(--sep);position:sticky;top:0;background:var(--bg);z-index:1}
.sp-b{padding:12px 14px;flex:1}
.turn{margin:0 0 14px}
.turn .tq{background:var(--chat-bg);border:1px solid var(--chat-border);border-radius:10px;padding:7px 10px;font-weight:500;font-size:13px}
.turn .tq .quoteref{display:block;font-weight:400;color:var(--text2);font-size:12px;border-left:2px solid var(--quote-bar);padding-left:7px;margin-bottom:3px}
.turn .tm{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text2);margin:5px 2px 0;flex-wrap:wrap}
.turn .tm .lnk{color:var(--accent-ink)}
.sp-b .askbox{margin-top:4px;flex-wrap:wrap}
.sp-b .askbox .col{flex:1 1 calc(100% - 30px)}
.sp-b .askbox .mpick{margin-left:22px}
.sp-b .askbox .send{margin-left:auto}
.minimap{width:100%;height:200px;border:1px solid var(--sep);border-radius:10px;background:var(--chat-bg)}
.sp-sec{margin:0 0 16px}
.sp-sec h5{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text2);font-weight:600}
html[data-variant="e"] .linked{display:none}
html[data-variant="b"] .note .chat:not(.keep) .chat-head,html[data-variant="b"] .note .chat:not(.keep) > .prompt,html[data-variant="b"] .note .chat:not(.keep) > .runbar,html[data-variant="b"] .note .chat:not(.keep) > .act{display:none}
html[data-variant="b"] .note .chat{border-left-color:transparent;padding-left:0}
html[data-variant="b"] .note .chat + .chat{border-top:1px dashed var(--sep-strong);padding-top:10px}
html[data-variant="b"] .note .askbox.tail{display:none}

/* popovers */
.selpop{position:fixed;z-index:50;display:none;align-items:center;gap:2px;background:var(--pop-dark);color:var(--pop-dark-ink);border-radius:9px;padding:4px;box-shadow:var(--shadow);font-size:12.5px;transform:translate(-50%,-100%)}
.selpop.show{display:flex}
.selpop button{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:6px;white-space:nowrap}
.selpop button:hover,.selpop button:focus-visible{background:rgba(255,255,255,.14)}
.selpop .dots{display:flex;gap:4px;padding:0 6px 0 4px}
.selpop .dots button{width:16px;height:16px;padding:0;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.selpop .sep{width:1px;height:16px;background:rgba(255,255,255,.2);margin:0 3px}
.selpop kbd{font:10.5px var(--font);opacity:.6}
.menu{position:fixed;z-index:60;min-width:220px;background:var(--pop);border-radius:8px;box-shadow:var(--shadow);padding:5px;display:none;font-size:13px}
.menu.show{display:block}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:4px 10px;border-radius:5px;height:26px}
.menu button:hover,.menu button:focus-visible,.menu button.act-i{background:var(--accent-strong);color:var(--on-accent);outline:0}
.menu button[disabled]{opacity:.45;background:none;color:inherit}
.menu .mh{font-size:11px;color:var(--text2);padding:4px 10px 2px;font-weight:600}
.menu hr{border:0;border-top:1px solid var(--sep);margin:4px 6px}
.menu .k{margin-left:auto;color:var(--text3);font-size:12px}
.menu button:hover .k{color:inherit}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--pop-dark);color:var(--pop-dark-ink);padding:8px 14px;border-radius:9px;box-shadow:var(--shadow);font-size:12.5px;transition:.2s;z-index:80;pointer-events:none;display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70;display:none;align-items:flex-start;justify-content:center;padding-top:60px}
.scrim.show{display:flex}
.sheet{width:min(500px,calc(100vw - 32px));max-height:calc(100vh - 90px);overflow:auto;background:var(--pop);border-radius:12px;box-shadow:var(--shadow);padding:22px 24px 18px}
.sheet h2{margin:0 0 4px;font-size:19px;text-align:center}
.sheet .lede{color:var(--text2);text-align:center;margin:0 0 16px}
.feat{display:flex;gap:14px;align-items:flex-start;margin:0 0 13px}
.feat .fic{width:30px;height:30px;border-radius:8px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.feat .fic svg{width:17px;height:17px}
.feat b{display:block;font-size:13.5px}
.feat span{color:var(--text2)}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--sep);border-radius:8px;margin:0 0 6px}
.mrow .mn{flex:1}
.mrow .mn small{display:block;color:var(--text2)}
.mrow code{font:11.5px var(--mono);background:var(--seg);padding:1px 5px;border-radius:4px}
.sheet .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.sheet .btn{height:28px;padding:0 16px;border-radius:7px;border:1px solid var(--sep-strong);background:var(--bg);font-size:13px}
.sheet .btn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent);font-weight:600}
.sheet .setup{display:none;margin:6px 0 4px 18px;color:var(--text2);font-size:12.5px}
.sheet .setup.show{display:block}
.sheet .setup ol{margin:4px 0 8px;padding-left:18px}

/* first-run empty editor */
.fr{max-width:440px;margin:70px auto 0;text-align:center;padding:0 20px}
.fr h2{margin:0 0 6px;font-size:22px}
.fr p{color:var(--text2);margin:0 0 18px}
.fr .big{display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:300px;margin:0 auto}
.fr .big button{height:36px;border-radius:9px;border:1px solid var(--sep-strong);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px}
.fr .big button.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent);font-weight:600}
.fr .big button kbd{font:11.5px var(--font);opacity:.6}
.fr .ms{margin-top:22px;font-size:12px;color:var(--text2);display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}
.fr .ms span{display:inline-flex;gap:5px;align-items:center}
.fr .ms button{color:var(--accent-ink)}
.fr .gloss{margin-top:26px;text-align:left;border-top:1px solid var(--sep);padding-top:14px;font-size:12.5px;color:var(--text2)}
.fr .gloss b{color:var(--text)}

/* Quick Note */
.qn{position:fixed;right:22px;bottom:22px;width:300px;background:var(--pop);border-radius:12px;box-shadow:var(--shadow);z-index:65;display:none;flex-direction:column;overflow:hidden}
.qn.show{display:flex}
.qn-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--sep);font-size:12px;color:var(--text2)}
.qn-h .tl i{width:10px;height:10px}
.qn textarea{border:0;outline:0;background:transparent;resize:none;font:13.5px/1.45 var(--font);color:var(--text);padding:10px 12px;height:120px}
.qn-f{display:flex;gap:6px;justify-content:flex-end;padding:8px 10px;border-top:1px solid var(--sep)}

/* standalone variant switcher */
.vsw{position:fixed;right:12px;bottom:12px;z-index:90;display:flex;gap:4px;background:var(--pop);padding:4px;border-radius:9px;box-shadow:var(--shadow);font-size:11.5px}
.vsw button{padding:3px 8px;border-radius:6px;color:var(--text2)}
.vsw button.on{background:var(--accent-strong);color:var(--on-accent)}

.scrim-d{display:none}
.minimap .gn text{font-size:10px}
html[data-variant="d"] #qnOpen{background:var(--accent-strong);color:var(--on-accent);font-weight:600}
html[data-variant="d"] #qnOpen span{color:inherit!important}
.mob-only{display:none}

@media (max-width: 760px){
  .app{--lw:100%;grid-template-columns:0 minmax(0,1fr) 0;grid-template-areas:"tb tb tb" "mid mid mid"}
  .app.full,.app[data-view]{grid-template-columns:0 minmax(0,1fr) 0}
  .app.full{grid-template-areas:"tb tb tb" "ed ed ed"}
  .app[data-view="gallery"],.app[data-view="outline"],.app[data-view="map"]{grid-template-areas:"tb tb tb" "mid mid mid"}
  .app.mobed:not(.full){grid-template-areas:"tb tb tb" "ed ed ed"}
  .app.mobed .mid{display:none}
  .app:not(.mobed):not(.full) .ed{display:none}
  .sb{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:75;transform:translateX(-100%);transition:transform .2s;visibility:visible!important;box-shadow:var(--shadow)}
  .app.drawer .sb{transform:none}
  .scrim-d{position:fixed;inset:0;background:var(--scrim);z-index:74}
  .app.drawer .scrim-d{display:block}
  .tb-l{width:auto;border-right:0;padding:0 6px}
  .tb-r{padding:0 6px;gap:0}
  .tb .wide{display:none}
  .app.mobed .back,.app.full .back{display:inline-flex}
  .app:not(.mobed):not(.full) .tb-r .edonly{display:none}
  .app.mobed .seg,.app.full .seg{display:none}
  .search{width:auto;flex:1;max-width:none;min-width:70px}
  .tbtn.ask b,.tbtn.ask kbd{display:none}
  .vsw{max-width:calc(100vw - 16px);overflow-x:auto}
  .vsw button{white-space:nowrap}
  .note{padding:10px 18px 100px}
  .sec-chev{left:-18px}
  .side-panel{display:none!important}
  .mob-only{display:block}
  .gal{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .vsw{bottom:8px;right:8px}
  .ol{padding:8px 10px 40px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>

    blocks:[
     T("LFP (LiFePO₄/graphite) cells age through two coupled processes: <b>calendar aging</b>, which runs whenever the cell sits at a given state of charge and temperature, and <b>cycle aging</b>, which scales with energy throughput. High state of charge accelerates both, mainly at the graphite anode."),
     {t:"sec",lvl:3,title:"SEI growth",id:"l1",blocks:[T("At high SOC the graphite anode sits at a low potential (≈0.1 V vs Li/Li⁺), which drives continued reduction of electrolyte at the solid–electrolyte interphase. <mark class=\"hl yellow\" data-hl=\"h1\" data-branch=\"peaker\">SEI growth accelerates above ~80% SOC</mark>, consuming cyclable lithium. Loss of lithium inventory is the dominant fade mode for LFP in stationary duty.")]},
     {t:"sec",lvl:3,title:"Lithium plating",id:"l2",blocks:[T("When the anode is nearly full, lithium ions can deposit as metal instead of intercalating, especially during fast charge. <mark class=\"hl pink\" data-hl=\"h2\">Plating risk rises sharply below 10 °C at high SOC</mark>. Part of the plated lithium re-intercalates; the rest is lost and can form dendrites.")]},

    pre:"Sodium-ion cells (hard-carbon anode with a layered-oxide or Prussian-white cathode) show a weaker SOC dependence in calendar aging, because hard carbon operates at a higher potential than graphite and drives less electrolyte reduction at the SEI.",

}

  const kids=[];
  const walk=(bs,out)=>bs.forEach(b=>{
    if(b.t==="sec"){const it={id:n.id+":"+b.id,type:"sec",title:b.title,note:n.id,sec:b.id,kids:[]};walk(b.blocks,it.kids);out.push(it)}

    else if(b.t==="check"){b.items.forEach((x,i)=>out.push({id:n.id+":ck"+i,type:"check",done:x.done,title:x.h.replace(/\[\[(\w+)\|([^\]]+)\]\]/g,"$2"),note:n.id,kids:[]}))}
    else if(b.t==="chat"&&!b.first){out.push({id:n.id+":"+b.id,type:"chat",title:b.prompt,note:n.id,status:b.status,kids:[]})}
    else if(b.t==="chat"&&b.first){walk(b.blocks||[],out)}
  });

  childrenOf(n.id).forEach(c=>kids.push(olNode(c)));
  return kids;
}

function mapGraph(){

}

function wireGraph(svg,g){

    const nb=new Set([id]);$$(".ge",svg).forEach(p=>{const on=p.dataset.a===id||p.dataset.b===id;p.classList.toggle("hl",on);if(on){nb.add(p.dataset.a);nb.add(p.dataset.b)}});
    $$(".gn",svg).forEach(x=>x.classList.toggle("nb",nb.has(x.dataset.gid)))});
  svg.addEventListener("mouseleave",()=>{svg.classList.remove("dim");$$(".ge",svg).forEach(p=>p.classList.remove("hl"))});
  const act=e=>{const n=e.target.closest(".gn");if(!n)return;const id=n.dataset.gid;if(id.startsWith("#")){S.tag=id.slice(1);S.view="list";S.full=false;renderAll();return}openNote(id,{full:S.view!=="list"})};

    case "ul": return `<ul class="b">${b.items.map(i=>`<li>${fmt(i)}</li>`).join("")}</ul>`;

function branchChips(h,n){

function statusText(c){

/* ================= Streaming runs ================= */
const ANSWERS={
  sodium:"Sodium-ion cells show a weaker SOC dependence because hard carbon operates at a higher potential than graphite. At 90% SOC, published 25 °C tests report 1.0–1.4% calendar fade per year against 2.9% for LFP in the 70–100% band.\n\nThe trade-offs are energy density and field history: fewer than three years of utility-scale operating data exist.",
  augment:"Developers hold nameplate capacity in three ways: oversizing at commissioning (typically 10–20% extra energy), periodic augmentation (adding new modules in years 3–4 and 8–10), and SOC-window management that slows fade between augmentation events.\n\nAugmentation is usually priced into the long-term service agreement as a fixed $/kWh-year line item; contract terms specify the capacity test, the augmentation trigger (often 95–97% of contracted energy), and who bears the cost of cell price changes.",
  default:"Short answer: for a utility-scale LFP system cycling about once per day, the resting state of charge is the larger lever. Keeping idle SOC in the 30–70% band reduces calendar fade from about 2.9% to 1.6% per year at 25 °C.\n\nThe effect is smaller in cool climates and larger above 35 °C, where calendar fade roughly doubles for every 10 °C rise. Sources in this folder that support this: Schimpe et al. 2018 and NREL ATB 2026.\n\nIf you want, file the numbers above into Chapter 3 outline under 3.2 Operating conditions."
};
function pickAnswer(q){q=q.toLowerCase();if(q.includes("sodium"))return ANSWERS.sodium;if(q.includes("augment"))return ANSWERS.augment;return ANSWERS.default}
function findChat(cid){for(const n of NOTES){const c=n.blocks.find(b=>b.t==="chat"&&b.id===cid);if(c)return [c,n]}return []}
function startStream(c,target,speed){
  c.status="running";c.elapsed=c.elapsed||0;c.tools=c.tools||0;c.streamed=c.streamed||"";if(c.pre===undefined)c.pre="";c.target=target;
  const words=target.slice(c.streamed.length).split(/(\s+)/);let i=0;
  stopRun(c.id);
  S.runs[c.id]={tick:setInterval(()=>{c.elapsed+=1;updateRun(c)},1000),
    words:setInterval(()=>{
      if(i>=words.length){finishRun(c);return}
      c.streamed+=words[i++]+(words[i]&&/\s/.test(words[i])?words[i++]:"");
      if(Math.random()<.04)c.tools++;
      const a=document.getElementById("ans-"+c.id);
      if(a){a.innerHTML=streamHTML(c)}
    },reduced?20:(speed||65))};
  updateRun(c);
}
function stopRun(cid){const r=S.runs[cid];if(r){clearInterval(r.tick);clearInterval(r.words);delete S.runs[cid]}}
function finishRun(c){stopRun(c.id);c.status="complete";c.time=mmss(c.elapsed);
  const full=(c.pre||"")+(c.streamed||"");c.blocks=full.split("\n\n").map(p=>T(esc(p)));delete c.pre;delete c.streamed;
  const [,n]=findChat(c.id);
  rerenderKeepScroll();toast(`Chat completed · ${esc(short(n?n.title:"",40))}`)}
function updateRun(c){
  const rb=document.getElementById("rb-"+c.id);if(rb)rb.innerHTML=runbarInner(c);
  const tm=document.getElementById("tm-"+c.id);if(tm)tm.innerHTML=turnMeta(c);
  // list rows
  const [,n]=findChat(c.id);if(!n)return;
  const row=document.querySelector(`.row[data-note="${n.id}"] .m`);if(row&&c.status==="running")row.innerHTML=`<b>${esc(n.when)}</b>Running · ${mmss(c.elapsed)} · ${tc(c.tools)}`;
}

function sendAsk(box){
  const ta=$("textarea",box);const q=ta.value.trim();if(!q)return;
  const nid=box.dataset.askfor||S.note;const n=N(nid);
  const model=S.askModel||"cc";
  const quote=ta.dataset.quote||"";
  const c={t:"chat",id:"c"+Date.now(),model,prompt:q,quote:quote||undefined,status:"running",elapsed:0,tools:0,pre:"",streamed:""};
  // a fresh note whose first line is empty: the question becomes the title
  const isFirst=!n.blocks.some(b=>b.t==="chat");
  if(n.isNew&&(!n.title||n.title==="New Note")){n.title=q;n.isNew=false;c.first=true;delete c.prompt;n.chat=true;n.snip=q}
  else if(isFirst&&!n.chat){n.chat=true}
  n.blocks=n.blocks.filter(b=>b.t!=="ask");
  const ti=n.blocks.findIndex(b=>b.t==="tags");
  if(ti>=0)n.blocks.splice(ti,0,c);else n.blocks.push(c);

  renderAll();

let selRange=null;
function onSelect(){
  const sel=getSelection();const pop=$("#selpop");
  if(!sel.rangeCount||sel.isCollapsed){pop.classList.remove("show");selRange=null;return}
  const r=sel.getRangeAt(0);const note=$("#note");
  if(!note.contains(r.commonAncestorContainer)||r.toString().trim().length<3){pop.classList.remove("show");return}
  const anc=r.commonAncestorContainer.nodeType===1?r.commonAncestorContainer:r.commonAncestorContainer.parentElement;
  if(anc.closest("h1,.askbox,textarea")){pop.classList.remove("show");return}
  selRange=r.cloneRange();
  const b=r.getBoundingClientRect();
  pop.style.left=Math.min(Math.max(b.left+b.width/2,200),innerWidth-200)+"px";pop.style.top=Math.max(b.top-8,56)+"px";
  pop.classList.add("show");
}
function selAction(act,color){
  if(!selRange)return;const text=selRange.toString().trim();const pop=$("#selpop");pop.classList.remove("show");
  const n=N(S.note);
  if(act==="hl"){
    try{const m=document.createElement("mark");m.className="hl "+color;m.dataset.hl="u"+Date.now();selRange.surroundContents(m);S.highlights++;persistDom(n);toast("Highlighted · added to Highlights")}
    catch(e){toast("Select text within one paragraph to highlight")}
    getSelection().removeAllRanges();renderSidebar();return}
  if(act==="ask"){getSelection().removeAllRanges();insertAsk({quote:text});return}
  if(act==="branch"){
    let markId="b"+Date.now();
    const kid={id:"sub"+(nid++),parent:n.id,title:"",isNew:true,folder:n.folder,ws:n.ws,sec:"today",when:nowTime(),date:"Today at "+nowTime(),snip:"Sub-note",tags:[],chat:true,
      blocks:[{t:"quote",h:text,src:n.id,anchor:markId},{t:"ask",quote:"",placeholder:"Ask about this passage. The question becomes the title."}]};
    try{const m=document.createElement("mark");m.className="hl yellow";m.dataset.hl=markId;m.dataset.branch=kid.id;selRange.surroundContents(m);persistDom(n);S.highlights++}catch(e){}
    getSelection().removeAllRanges();
    NOTES.splice(NOTES.indexOf(n)+1,0,kid);S.listOpen[n.id]=true;
    openNote(kid.id,{focusAsk:true});
    toast("Sub-note created · linked to the passage");return}
  if(act==="link"){getSelection().removeAllRanges();showLinkMenu(selRange.getBoundingClientRect(),id=>{toast(`Linked “${esc(short(text,30))}” to ${esc(short(N(id).title,30))}`)});return}
}
// write DOM edits (highlights) back into the block data so they survive re-render
function persistDom(n){
  const walk=(bs)=>bs.forEach(b=>{if(b.blocks)walk(b.blocks)});
  // map paragraphs: re-read <p> innerHTML of answer blocks in order
  const ps=$$("#note .ans p, #note > p, #note .sec-body > p");
  const data=[];const collect=bs=>bs.forEach(b=>{if(b.t==="p")data.push(b);if(b.blocks&&b.t!=="chat"||b.t==="chat"&&b.blocks)collect(b.blocks||[])});
  collect(n.blocks);
  const clean=h=>h.replace(/<span class="bchip"[\s\S]*?<\/span><\/span>|<span class="bnum"[^>]*>\d+<\/span>/g,"").replace(/<a class="nlink" data-open="(\w+)"[^>]*>([^<]*)<\/a>/g,"[[$1|$2]]");
  const real=ps.filter(p=>!p.closest(".dimnote")&&!p.classList.contains("hint")&&!p.classList.contains("dimnote"));
  if(real.length===data.length) real.forEach((p,i)=>{data[i].h=clean(p.innerHTML).replace(/<span class="bchip[\s\S]*$/,"")});
}

document.addEventListener("keydown",e=>{

  if(t.matches&&t.matches(".askbox textarea")&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendAsk(t.closest(".askbox"));return}
  if(t.matches&&t.matches(".askbox textarea")&&e.key==="Escape"){t.blur();return}
});
$("#search").addEventListener("focus",()=>{S.searchFocus=true;if(S.view!=="list"){S.view="list"}S.full=false;renderAll();$("#search").focus()});
$("#search").addEventListener("blur",()=>{setTimeout(()=>{if(!S.search&&document.activeElement!==$("#search")){S.searchFocus=false;renderMid()}},150)});
$("#searchX").addEventListener("click",e=>{e.preventDefault();S.search="";$("#search").value="";S.searchFocus=false;renderAll()});

// >> link trigger inside the note
let linkCtx=null;
function checkLinkTrigger(){
  const sel=getSelection();if(!sel.rangeCount)return;const r=sel.getRangeAt(0);const node=r.startContainer;
  if(node.nodeType!==3){if(linkCtx){hideMenu();linkCtx=null}return}
  const before=node.textContent.slice(0,r.startOffset);const m=before.match(/>>([^>]{0,30})$/);
  if(!m){if(linkCtx){hideMenu();linkCtx=null}return}
  linkCtx={node,start:r.startOffset-m[0].length,end:r.startOffset};
  const rect=r.getBoundingClientRect();
  showLinkMenu(rect.width||rect.left?rect:node.parentElement.getBoundingClientRect(),id=>{
    const {node:nd,start,end}=linkCtx;const after=nd.splitText(start);after.textContent=after.textContent.slice(end-start);
    const a=document.createElement("a");a.className="nlink";a.dataset.open=id;a.contentEditable="false";a.textContent=N(id).title;
    nd.parentNode.insertBefore(a,after);after.textContent=" "+after.textContent;
    const cur=N(S.note);cur.links=[...new Set([...(cur.links||[]),id])];linkCtx=null;
    $("#note").focus();const s=getSelection();s.removeAllRanges();const rr=document.createRange();rr.setStart(after,1);s.addRange(rr);
    toast(`Linked to ${esc(short(N(id).title,36))} · shows in its Linked Notes`);
  },m[1],true);
}

// global shortcuts
document.addEventListener("keydown",e=>{
  const mod=e.metaKey||e.ctrlKey;const t=e.target;
  const typing=t.closest&&(t.closest("textarea,input,[contenteditable=true]"));
  if($("#selpop").classList.contains("show")&&!mod&&!e.altKey){const k=e.key.toLowerCase();
    if(k==="h"){e.preventDefault();return selAction("hl","yellow")}if(k==="a"){e.preventDefault();return selAction("ask")}if(k==="n"){e.preventDefault();return selAction("branch")}if(k==="l"){e.preventDefault();return selAction("link")}
    if(k==="escape"){$("#selpop").classList.remove("show")}}
  if($("#menu").classList.contains("show")){
    const bs=$$("#menu button:not([disabled])");const i=bs.indexOf(document.activeElement);
    if(e.key==="ArrowDown"){e.preventDefault();(bs[i+1]||bs[0]).focus();return}
    if(e.key==="ArrowUp"){e.preventDefault();(bs[i-1]||bs[bs.length-1]).focus();return}
    if(e.key==="Escape"){hideMenu();linkCtx=null;return}
    if(e.key==="Enter"&&linkCtx){e.preventDefault();(bs[Math.max(i,0)]).click();return}
  }
  if(e.key==="Escape"&&$("#scrim").classList.contains("show")){closeSheet();return}
  if(e.key==="Escape"&&$("#qn").classList.contains("show")){closeQN();return}
  if(mod&&e.key.toLowerCase()==="j"){e.preventDefault();insertAsk();return}
  if(mod&&!e.shiftKey&&e.key.toLowerCase()==="n"){e.preventDefault();newNote();return}
  if(mod&&e.key.toLowerCase()==="f"){e.preventDefault();$("#search").focus();return}
  if(mod&&e.ctrlKey&&e.key.toLowerCase()==="q"||(e.ctrlKey&&e.metaKey&&e.key.toLowerCase()==="q")){e.preventDefault();openQN();return}
  if(mod&&["1","2","3","4"].includes(e.key)){e.preventDefault();setView(["list","gallery","outline","map"][+e.key-1]);return}
  if(e.key==="Escape"&&t.id==="search"){S.search="";t.value="";S.searchFocus=false;t.blur();renderAll();return}
  // outline keyboard
  if(t.classList&&t.classList.contains("orow")){
    const rows=$$("#olTree .orow").filter(r=>r.offsetParent);const i=rows.indexOf(t);const li=t.closest("li");
    const go=r=>{if(!r)return;rows.forEach(x=>{x.tabIndex=-1;x.classList.remove("sel")});r.tabIndex=0;r.classList.add("sel");r.focus();S.olSel=r.dataset.oid};
    if(e.altKey&&(e.key==="ArrowUp"||e.key==="ArrowDown")){e.preventDefault();const sib=e.key==="ArrowUp"?li.previousElementSibling:li.nextElementSibling;if(sib){if(e.key==="ArrowUp")li.parentNode.insertBefore(li,sib);else li.parentNode.insertBefore(sib,li);t.focus();saveOlOrder()}return}
    if(e.key==="ArrowDown"){e.preventDefault();go(rows[i+1])}
    else if(e.key==="ArrowUp"){e.preventDefault();go(rows[i-1])}
    else if(e.key==="ArrowRight"){e.preventDefault();if(li.classList.contains("collapsed")){$(".tw",t).click()}else go(rows[i+1])}
    else if(e.key==="ArrowLeft"){e.preventDefault();if(li.querySelector("ul")&&!li.classList.contains("collapsed"))$(".tw",t).click();else{const p=li.parentElement.closest("li");if(p)go($(".orow",p))}}
    else if(e.key==="Enter"){e.preventDefault();openNote(t.dataset.onote,{full:true,sec:t.dataset.osec.split(":").pop()||undefined})}
    return;
  }
  if(typing)return;
});
function saveOlOrder(){S.olOrder=$$("#olTree > li").map(li=>li.dataset.oid)}
// outline drag and drop (top-level notes)
let dragLi=null;
document.addEventListener("dragstart",e=>{const r=e.target.closest&&e.target.closest("#olTree > li > .orow");if(!r)return;dragLi=r.parentElement;r.classList.add("dragging");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",r.dataset.oid)});
document.addEventListener("dragover",e=>{if(!dragLi)return;const r=e.target.closest&&e.target.closest("#olTree > li > .orow");$$(".drop-before").forEach(x=>x.classList.remove("drop-before"));if(r&&r.parentElement!==dragLi){e.preventDefault();r.classList.add("drop-before")}});
document.addEventListener("drop",e=>{if(!dragLi)return;const r=e.target.closest&&e.target.closest("#olTree > li > .orow");if(r){e.preventDefault();r.parentElement.parentNode.insertBefore(dragLi,r.parentElement);saveOlOrder()}});
document.addEventListener("dragend",()=>{$$(".dragging,.drop-before").forEach(x=>x.classList.remove("dragging","drop-before"));dragLi=null});

// keyboard activation for role=button/link spans
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".bchip,.nlink,.ckb,.disc")){e.preventDefault();e.target.click()}});

// Quick Note
function openQN(){$("#qn").classList.add("show");$("#qnText").focus()}
function closeQN(){$("#qn").classList.remove("show")}
$("#qnDone").onclick=()=>{const v=$("#qnText").value.trim();closeQN();if(!v)return;const [first,...rest]=v.split("\n");
  const n={id:"qn"+(nid++),title:first,folder:S.ws==="personal"?"p-all":"drafts",ws:S.ws,sec:"today",when:nowTime(),date:"Today at "+nowTime(),snip:rest.join(" ")||"No additional text",tags:[],links:[],blocks:rest.filter(Boolean).map(x=>T(esc(x)))};
  NOTES.unshift(n);$("#qnText").value="";toast(`Saved to ${S.ws==="personal"?"Personal":"Drafts"}`);renderAll()};
$("#qnAsk").onclick=()=>{const v=$("#qnText").value.trim();if(!v){$("#qnText").focus();return}closeQN();$("#qnText").value="";
  const n=newNote();n.blocks=[];renderAll();const box=document.createElement("div");box.dataset.askfor=n.id;box.innerHTML=`<textarea>${esc(v)}</textarea>`;sendAsk(box)};

// resize: leave mobile mode cleanly
addEventListener("resize",()=>{if(!isNarrow()&&(S.mobed||S.drawer)){S.mobed=false;S.drawer=false;renderAll()}});

/* ================= Boot ================= */
document.documentElement.dataset.variant="a";
renderAll();
// resume the running sodium-ion chat
(function(){const [c]=findChat("c-na");startStream(c,c.rest,480)})();
if(parent!==window){parent.postMessage({type:"mock:ready",mock:MOCK},"*")}
else{
  const w=document.createElement("div");w.className="vsw";w.setAttribute("role","group");w.setAttribute("aria-label","Variant");
  w.innerHTML=MOCK.variants.map(v=>`<button data-v="${v.id}" title="${esc(v.summary)}" class="${v.id==="a"?"on":""}">${v.id.toUpperCase()} · ${esc(v.label)}</button>`).join("");
  w.addEventListener("click",e=>{const b=e.target.closest("button");if(b)setVariant(b.dataset.v)});document.body.appendChild(w);
}
</script>
