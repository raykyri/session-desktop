<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session · Notion-style</title>
<!-- Influence: Notion (pages, blocks, databases, side peek, backlinks). Product name in UI: Session. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --bg-side:#f8f8f7; --bg-elev:#ffffff; --bg-sunk:#f7f6f3;
  --text:#37352f; --text-2:#787774; --text-3:#a5a29a; --text-inv:#ffffff;
  --hover:rgba(55,53,47,.06); --press:rgba(55,53,47,.1); --divider:rgba(55,53,47,.09); --border:rgba(55,53,47,.16);
  --accent:#2383e2; --accent-hover:#0077d4; --accent-soft:rgba(35,131,226,.1); --accent-line:rgba(35,131,226,.55);
  --callout:#f1f1ef; --q-bg:#f7f6f3;
  --hl:#fbf3db; --hl-hot:#f5df9c; --hl-line:#dfab01;
  --ai:#9065b0; --ai-soft:rgba(144,101,176,.09); --ai-line:rgba(144,101,176,.35);
  --synced:rgba(235,87,87,.5);
  --p-gray-bg:#e3e2e0; --p-gray-tx:#32302c; --p-green-bg:#dbeddb; --p-green-tx:#1c3829; --p-blue-bg:#d3e5ef; --p-blue-tx:#183347;
  --p-yellow-bg:#fdecc8; --p-yellow-tx:#402c1b; --p-red-bg:#ffe2dd; --p-red-tx:#5d1715; --p-purple-bg:#e8deee; --p-purple-tx:#412454;
  --p-orange-bg:#fadec9; --p-orange-tx:#49290e; --p-brown-bg:#eee0da; --p-brown-tx:#442a1e; --p-pink-bg:#f5e0e9; --p-pink-tx:#4c2337;
  --g-orange:#d9730d; --g-blue:#337ea9; --g-green:#448361; --g-red:#d44c47;
  --shadow:0 0 0 1px rgba(15,15,15,.05),0 3px 6px rgba(15,15,15,.1),0 9px 24px rgba(15,15,15,.2);
  --shadow-sm:0 0 0 1px rgba(15,15,15,.06),0 2px 4px rgba(15,15,15,.06);
  --scrim:rgba(15,15,15,.45); --sel:rgba(35,131,226,.28);
  --toast-bg:#2f2f2f; --toast-tx:#ffffff;
  --cover-a:#e9e1f7; --cover-b:#d6e8f5; --cover-c:#f7e7d6;
  --edge:rgba(55,53,47,.22); --edge-link:rgba(35,131,226,.6);
  --tl-r:#ff5f57; --tl-y:#febc2e; --tl-g:#28c840;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
  --gutter:96px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191919; --bg-side:#202020; --bg-elev:#252525; --bg-sunk:#202020;
    --text:rgba(255,255,255,.81); --text-2:rgba(255,255,255,.46); --text-3:rgba(255,255,255,.28); --text-inv:#ffffff;
    --hover:rgba(255,255,255,.055); --press:rgba(255,255,255,.09); --divider:rgba(255,255,255,.094); --border:rgba(255,255,255,.14);
    --accent:#2383e2; --accent-hover:#3d95e8; --accent-soft:rgba(35,131,226,.18); --accent-line:rgba(82,156,226,.7);
    --callout:#252525; --q-bg:#232323;
    --hl:#4a3c1f; --hl-hot:#6b5428; --hl-line:#c29a3a;
    --ai:#a77dd0; --ai-soft:rgba(157,104,211,.12); --ai-line:rgba(157,104,211,.45);
    --synced:rgba(235,87,87,.55);
    --p-gray-bg:#373737; --p-gray-tx:rgba(255,255,255,.81); --p-green-bg:#2b593f; --p-green-tx:rgba(255,255,255,.85); --p-blue-bg:#28456c; --p-blue-tx:rgba(255,255,255,.85);
    --p-yellow-bg:#89632a; --p-yellow-tx:rgba(255,255,255,.85); --p-red-bg:#6e3630; --p-red-tx:rgba(255,255,255,.85); --p-purple-bg:#492f64; --p-purple-tx:rgba(255,255,255,.85);
    --p-orange-bg:#854c1d; --p-orange-tx:rgba(255,255,255,.85); --p-brown-bg:#603b2c; --p-brown-tx:rgba(255,255,255,.85); --p-pink-bg:#69314c; --p-pink-tx:rgba(255,255,255,.85);
    --g-orange:#e38a3f; --g-blue:#5aa0d6; --g-green:#5fae86; --g-red:#e06b66;
    --shadow:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.35),0 9px 24px rgba(0,0,0,.45);
    --shadow-sm:0 0 0 1px rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.3);
    --scrim:rgba(0,0,0,.6); --sel:rgba(35,131,226,.4);
    --toast-bg:#3a3a3a; --toast-tx:#ffffff;
    --cover-a:#3a3150; --cover-b:#26394a; --cover-c:#4a3a2a;
    --edge:rgba(255,255,255,.2); --edge-link:rgba(82,156,226,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#191919; --bg-side:#202020; --bg-elev:#252525; --bg-sunk:#202020;
  --text:rgba(255,255,255,.81); --text-2:rgba(255,255,255,.46); --text-3:rgba(255,255,255,.28); --text-inv:#ffffff;
  --hover:rgba(255,255,255,.055); --press:rgba(255,255,255,.09); --divider:rgba(255,255,255,.094); --border:rgba(255,255,255,.14);
  --accent:#2383e2; --accent-hover:#3d95e8; --accent-soft:rgba(35,131,226,.18); --accent-line:rgba(82,156,226,.7);
  --callout:#252525; --q-bg:#232323;
  --hl:#4a3c1f; --hl-hot:#6b5428; --hl-line:#c29a3a;
  --ai:#a77dd0; --ai-soft:rgba(157,104,211,.12); --ai-line:rgba(157,104,211,.45);
  --synced:rgba(235,87,87,.55);
  --p-gray-bg:#373737; --p-gray-tx:rgba(255,255,255,.81); --p-green-bg:#2b593f; --p-green-tx:rgba(255,255,255,.85); --p-blue-bg:#28456c; --p-blue-tx:rgba(255,255,255,.85);
  --p-yellow-bg:#89632a; --p-yellow-tx:rgba(255,255,255,.85); --p-red-bg:#6e3630; --p-red-tx:rgba(255,255,255,.85); --p-purple-bg:#492f64; --p-purple-tx:rgba(255,255,255,.85);
  --p-orange-bg:#854c1d; --p-orange-tx:rgba(255,255,255,.85); --p-brown-bg:#603b2c; --p-brown-tx:rgba(255,255,255,.85); --p-pink-bg:#69314c; --p-pink-tx:rgba(255,255,255,.85);
  --g-orange:#e38a3f; --g-blue:#5aa0d6; --g-green:#5fae86; --g-red:#e06b66;
  --shadow:0 0 0 1px rgba(255,255,255,.08),0 3px 6px rgba(0,0,0,.35),0 9px 24px rgba(0,0,0,.45);
  --shadow-sm:0 0 0 1px rgba(255,255,255,.08),0 2px 4px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.6); --sel:rgba(35,131,226,.4);
  --toast-bg:#3a3a3a; --toast-tx:#ffffff;
  --cover-a:#3a3150; --cover-b:#26394a; --cover-c:#4a3a2a;
  --edge:rgba(255,255,255,.2); --edge-link:rgba(82,156,226,.75);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--sel)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
svg{flex:none;display:block}
kbd{font:500 11px/1 var(--font);color:var(--text-3);letter-spacing:.02em}
.hidden{display:none!important}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:var(--sbw,248px) 1fr;height:100vh;width:100vw;overflow:hidden}
.app.no-sb{--sbw:0px}
.sidebar{background:var(--bg-side);border-right:1px solid var(--divider);display:flex;flex-direction:column;min-width:0;overflow:hidden;font-size:14px;color:var(--text-2);user-select:none}
.app.no-sb .sidebar{border:0}
.main{position:relative;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.scrim{display:none}

.sb-top{display:flex;align-items:center;gap:6px;padding:10px 8px 6px 14px;height:44px}
.traffic{display:flex;gap:8px;margin-right:6px}
.traffic span{width:12px;height:12px;border-radius:50%;background:var(--tl-r)}
.traffic span:nth-child(2){background:var(--tl-y)} .traffic span:nth-child(3){background:var(--tl-g)}
.sb-top .grow{flex:1}
.icon-btn{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2)}
.icon-btn:hover{background:var(--hover)} .icon-btn:active{background:var(--press)}
.icon-btn.on{color:var(--accent)}
.ws{display:flex;align-items:center;gap:8px;margin:2px 8px 4px;padding:4px 6px;border-radius:6px;min-width:0;text-align:left}
.ws:hover{background:var(--hover)}
.ws-av{width:22px;height:22px;border-radius:5px;background:var(--p-orange-bg);color:var(--p-orange-tx);font:600 12px/22px var(--font);text-align:center;flex:none}
.ws-name{font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.ws .chev{color:var(--text-3)}
.sb-scroll{flex:1;overflow:auto;padding:0 0 12px}
.sb-nav{padding:2px 8px 6px}
.sb-item{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;width:100%;text-align:left;font-weight:500;color:var(--text-2)}
.sb-item:hover{background:var(--hover)} .sb-item.active{background:var(--press);color:var(--text)}
.sb-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item kbd{opacity:0} .sb-item:hover kbd{opacity:1}
.sb-new{color:var(--text)}
.sb-new .ai-ic{color:var(--ai)}
.sb-sec{padding:10px 8px 0}
.sb-sec-h{display:flex;align-items:center;height:26px;padding:0 8px;font-size:12px;font-weight:500;color:var(--text-3);border-radius:6px}
.sb-sec-h .grow{flex:1}
.sb-sec-h button{opacity:0;width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.sb-sec-h:hover button{opacity:1} .sb-sec-h button:hover{background:var(--hover)}
.sb-row{position:relative;display:flex;align-items:center;height:30px;border-radius:6px;padding-left:calc(4px + var(--d,0)*14px);padding-right:4px}
.sb-row:hover{background:var(--hover)} .sb-row.active{background:var(--press)}
.sb-row.active .sb-link{color:var(--text)}
.tw{width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-3);flex:none}
.tw:hover{background:var(--press)}
.tw.leaf{visibility:hidden}
.sb-link{display:flex;align-items:center;gap:7px;flex:1;min-width:0;height:100%;padding-left:2px;font-weight:500;color:var(--text-2)}
.sb-link .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.row-acts{display:none;gap:2px}
.sb-row:hover .row-acts{display:flex}
.row-acts button{width:22px;height:22px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-3)}
.row-acts button:hover{background:var(--press);color:var(--text-2)}
.sb-empty{padding-left:calc(30px + var(--d,0)*14px);height:28px;line-height:28px;font-size:13px;color:var(--text-3)}
.dot-run{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.4s ease-in-out infinite}
.q-num{font-size:11px;color:var(--text-3);font-weight:500}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sb-foot{border-top:1px solid var(--divider);padding:8px}
.agent-strip{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:6px;font-size:12.5px;color:var(--text-2);text-align:left}
.agent-strip:hover{background:var(--hover)}
.ok-dot{width:7px;height:7px;border-radius:50%;background:var(--g-green);flex:none}

/* glyph tints */
.g{color:var(--text-2)} .g-chat{color:var(--ai)} .g-folder{color:var(--g-orange)} .g-db{color:var(--g-blue)} .g-link{color:var(--g-green)} .g-gs{color:var(--g-red)}

/* ---------- topbar ---------- */
.topbar{height:45px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px 0 12px;font-size:14px;position:relative;z-index:5;background:var(--bg)}
.crumbs{display:flex;align-items:center;min-width:0;flex:1;gap:2px;overflow:hidden}
.crumb{display:inline-flex;align-items:center;gap:6px;padding:2px 6px;border-radius:4px;white-space:nowrap;min-width:0;color:var(--text)}
.crumb span{overflow:hidden;text-overflow:ellipsis;max-width:240px}
.crumb:hover{background:var(--hover)}
.crumb-sep{color:var(--text-3);padding:0 1px}
.tb-right{display:flex;align-items:center;gap:2px;flex:none}
.edited{color:var(--text-3);font-size:13px;margin-right:6px;white-space:nowrap}
.badge{font-size:11px;font-weight:600;color:var(--text-2);margin-left:2px}
.nav-btns{display:flex;gap:0;margin-right:4px}
.mob-only{display:none}

/* ---------- content area ---------- */
.content-wrap{position:relative;flex:1;display:flex;min-height:0}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;container-type:inline-size}
#view{min-height:100%;display:flex;flex-direction:column}
.cover{height:200px;flex:none;background:linear-gradient(120deg,var(--cover-a),var(--cover-b) 55%,var(--cover-c))}
.cover.c2{background:linear-gradient(160deg,var(--cover-c),var(--cover-a) 60%,var(--cover-b))}
.page{position:relative;width:min(708px,calc(100% - 2*var(--gutter)));margin:0 auto;padding:0 0 40px;flex:1 0 auto}
.page.wide{width:calc(100% - 2*var(--gutter));max-width:1180px}
.page-head{padding-top:72px}
.has-cover .page-head{padding-top:0}
.page-icon{width:78px;height:78px;margin:0 0 6px -4px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.has-cover .page-icon{margin-top:-42px;background:var(--bg);box-shadow:0 0 0 4px var(--bg)}
.page-icon svg{width:56px;height:56px}
.page-title{font-size:40px;line-height:1.2;font-weight:700;margin:4px 0 6px;letter-spacing:-.01em;outline:none;word-break:break-word}
.page-title.untitled{color:var(--text-3)}
.meta-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:14px;color:var(--text-2);margin:2px 0 6px}
.meta-line .sep{color:var(--text-3)}
.backlinks{margin:4px 0 8px;font-size:14px}
.bl-btn{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);padding:2px 6px;margin-left:-6px;border-radius:4px}
.bl-btn:hover{background:var(--hover)}
.bl-list{margin:4px 0 0;padding:0;list-style:none}
.bl-list li{display:flex;align-items:center;gap:6px;padding:2px 0}
.bl-list .ctx{color:var(--text-3);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.props{margin:6px 0 10px;border-bottom:1px solid var(--divider);padding-bottom:10px}
.prop{display:flex;align-items:center;min-height:34px;font-size:14px}
.prop-k{width:160px;flex:none;display:flex;align-items:center;gap:8px;color:var(--text-2);padding:0 6px;margin-left:-6px;border-radius:4px;height:30px}
.prop-k:hover{background:var(--hover)}
.prop-v{flex:1;min-width:0;padding:4px 6px;border-radius:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prop-v:hover{background:var(--hover)}
.props-only{display:none}
[data-variant="b"] .props-only{display:block}
[data-variant="b"] .meta-only{display:none}

/* ---------- blocks ---------- */
.blocks{position:relative;margin-top:10px}
.blk{position:relative;margin:2px 0;padding:3px 2px;border-radius:4px}
.blk > .handle,.ol-row > .handle{position:absolute;left:-46px;top:3px;display:flex;gap:0;opacity:0;transition:opacity .12s}
.blk:hover > .handle,.ol-row:hover > .handle,.blk:focus-within > .handle{opacity:1}
.handle button{width:22px;height:24px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-3)}
.handle button:hover{background:var(--hover);color:var(--text-2)}
.handle .drag{cursor:grab}
.p{min-height:1.5em}
.h2{font-size:1.5em;font-weight:600;line-height:1.3;margin-top:1.1em}
.h3{font-size:1.25em;font-weight:600;line-height:1.3;margin-top:.9em}
.blk.h3 > .handle{top:4px}
.mention{display:inline-flex;align-items:baseline;gap:3px;color:var(--text);border-radius:3px;padding:0 2px;cursor:pointer;line-height:1.3}
.mention svg{align-self:center;width:15px;height:15px}
.mention span{border-bottom:1px solid var(--border);font-weight:500}
.mention:hover{background:var(--hover)}
.mention.dead span{color:var(--text-3)}
mark.hl{background:var(--hl);color:inherit;border-bottom:2px solid var(--hl-line);padding:0 1px;border-radius:2px;cursor:pointer}
mark.hl.hot,mark.hl:hover{background:var(--hl-hot)}
mark.hl.flash{animation:flash 1.2s ease}
@keyframes flash{0%,60%{background:var(--hl-hot);box-shadow:0 0 0 3px var(--hl-hot)}100%{}}
.callout{display:flex;gap:10px;background:var(--callout);border-radius:6px;padding:16px 16px 16px 14px}
.callout .c-ic{padding-top:2px}
.callout .c-body{flex:1;min-width:0}
.callout.ai{background:var(--ai-soft)}
.callout.recap .c-ic{color:var(--ai)}
.c-title{font-weight:600;margin-bottom:2px}
.quote-blk{border-left:3px solid currentColor;padding:2px 14px;margin:6px 0}
.divider{height:1px;background:var(--divider);margin:14px 0}
.tbl-wrap{overflow-x:auto;margin:8px 0}
table.ntbl{border-collapse:collapse;font-size:14px;min-width:100%}
table.ntbl th,table.ntbl td{border:1px solid var(--divider);padding:7px 10px;text-align:left;vertical-align:top}
table.ntbl th{color:var(--text-2);font-weight:500;background:var(--bg-sunk)}
.tbl-cap{font-size:13px;color:var(--text-2);margin-top:4px}
.sources{margin:6px 0 2px}
.src-h{font-size:12px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
.src{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;font-size:14px;width:100%;text-align:left}
.src:hover{background:var(--hover)}
.src .dom{color:var(--text-3);margin-left:auto;font-size:12.5px;white-space:nowrap}
.src .n{width:18px;height:18px;border-radius:4px;background:var(--callout);font-size:11px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;flex:none}

/* question + answer */
.qblk{display:flex;gap:10px;align-items:flex-start;margin-top:22px}
.q-av{width:24px;height:24px;border-radius:50%;background:var(--p-blue-bg);color:var(--p-blue-tx);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;margin-top:3px}
.q-body{flex:1;min-width:0;background:var(--q-bg);border-radius:8px;padding:8px 12px}
.q-text{font-weight:500}
.q-meta{font-size:12.5px;color:var(--text-3);margin-top:2px}
.q-quote{border-left:3px solid var(--hl-line);padding:0 0 0 10px;margin:2px 0 6px;color:var(--text-2);font-size:14px}
.ans{margin:8px 0 6px}
.ans-h{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);margin:4px 0 2px}
.ans-h .ai-ic{color:var(--ai)}
.ans-body{position:relative}
.ans-foot{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;font-size:13px;color:var(--text-3);margin-top:6px}
.ans-foot .sep{margin:0 2px}
.link-btn{color:var(--text-2);padding:2px 6px;border-radius:4px;display:inline-flex;align-items:center;gap:5px;font-size:13px}
.link-btn:hover{background:var(--hover);color:var(--text)}
.status-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--text-2);margin:8px 0 4px;padding:8px 10px;border:1px solid var(--divider);border-radius:8px;background:var(--bg-sunk)}
.status-line .lbl{font-weight:500;color:var(--text)}
.status-line .grow{flex:1}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.stop-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);color:var(--text)}
.stop-btn:hover{background:var(--hover)}
.tool-list{list-style:none;margin:4px 0 0;padding:0 0 0 2px;font-size:12.5px;width:100%}
.tool-list li{display:flex;gap:8px;align-items:center;padding:2px 0;color:var(--text-2)}
.tool-list code{font-family:var(--mono);font-size:12px;background:var(--callout);padding:1px 5px;border-radius:3px;color:var(--text)}
.tool-list .ok{color:var(--g-green)}
.caret{display:inline-block;width:7px;height:1.05em;background:var(--ai);vertical-align:-2px;margin-left:2px;animation:pulse 1s infinite}
.tip{font-size:13px;color:var(--text-3);display:flex;align-items:center;gap:6px;margin:8px 0 0}

/* sub-chat page block */
.subpage{display:flex;align-items:center;gap:8px;padding:3px 6px;margin-left:-6px;border-radius:4px;width:calc(100% + 12px);text-align:left}
.subpage:hover{background:var(--hover)}
.subpage .t{font-weight:500;border-bottom:1px solid var(--border);line-height:1.3}
.sp-anchor{font-size:12.5px;color:var(--text-3);margin:0 0 0 28px;display:flex;align-items:center;gap:4px}
.sp-anchor q{color:var(--text-2);font-style:normal}
.sub-ref.anchored{border-left:2px solid var(--hl-line);padding-left:8px;margin-left:-10px}

/* toggles */
.tgl-row{display:flex;align-items:flex-start;gap:4px}
.tri{width:24px;height:24px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);flex:none;transition:transform .12s}
.tri:hover{background:var(--hover)}
.tri svg{transition:transform .12s}
.tri[aria-expanded="true"] svg{transform:rotate(90deg)}
.tgl-title{flex:1;min-width:0;padding-top:1px}
.tgl-body{padding-left:28px}
.sub-tgl{border:1px solid var(--divider);border-radius:8px;padding:6px 10px 6px 6px;margin:8px 0}
.sub-tgl.anchored{border-left:3px solid var(--hl-line)}
.sub-tgl .tgl-title{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:500}
.sub-tgl .sp-anchor{margin:2px 0 0;width:100%}
.sub-tgl .qblk{margin-top:8px}

/* to-do */
.todo{display:flex;align-items:flex-start;gap:8px}
.cb{width:16px;height:16px;border:1.5px solid var(--text-2);border-radius:3px;margin-top:4px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff}
.cb.on{background:var(--accent);border-color:var(--accent)}
.todo.done .todo-t{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-3)}

/* synced */
.synced{border:2px solid transparent;border-radius:4px;padding:2px 6px;margin:4px -8px}
.synced:hover{border-color:var(--synced)}
.synced-tag{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:4px;margin-bottom:2px}

/* bookmark */
.bookmark{display:flex;border:1px solid var(--divider);border-radius:6px;overflow:hidden;width:100%;text-align:left}
.bookmark:hover{background:var(--hover)}
.bm-main{flex:1;padding:12px 14px;min-width:0}
.bm-t{font-size:14px;font-weight:500}
.bm-d{font-size:12.5px;color:var(--text-2);margin-top:2px}
.bm-u{font-size:12px;color:var(--text-2);margin-top:6px;display:flex;align-items:center;gap:6px}
.bm-img{width:160px;flex:none;background:linear-gradient(135deg,var(--p-green-bg),var(--p-blue-bg))}
.post-card{border:1px solid var(--divider);border-radius:8px;padding:14px 16px}
.post-h{display:flex;align-items:center;gap:8px;font-size:14px}
.post-av{width:28px;height:28px;border-radius:50%;background:var(--p-gray-bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.post-b{margin-top:8px;font-size:17px}

/* outline */
.ol{list-style:none;margin:0;padding:0}
.ol .ol{padding-left:26px}
.ol-item{position:relative}
.ol-row{position:relative;display:flex;align-items:flex-start;gap:2px;padding:2px 2px;border-radius:4px;outline:none}
.ol-row:focus-visible{box-shadow:0 0 0 2px var(--accent-line)}
.ol-row.sel{background:var(--accent-soft)}
.ol-bullet{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ol-bullet::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ol-txt{flex:1;min-width:0;padding-top:1px}
.ol-item.l0 > .ol-row .ol-txt{font-size:1.25em;font-weight:600;line-height:1.3}
.ol-item.l0{margin-top:10px}
.ol-count{font-size:12.5px;color:var(--text-3);margin-left:8px;font-weight:400}
.drop-before > .ol-row{box-shadow:0 -2px 0 var(--accent)}
.drop-after > .ol-row{box-shadow:0 2px 0 var(--accent)}
.ol-row.dragging{opacity:.4}

/* new-line editor */
.newline{position:relative;margin-top:4px;padding:3px 2px;min-height:1.5em;outline:none;border-radius:4px}
.newline:empty::before{content:attr(data-ph);color:var(--text-3)}
.newline:not(:focus):empty::before{content:"Click to add a block";}

/* inline AI block */
.aiblock{border:1px solid var(--ai-line);border-radius:8px;padding:10px 12px;margin:12px 0;background:var(--ai-soft)}
.aiblock-h{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ai);font-weight:500}
.aiblock-in{display:flex;align-items:center;gap:8px;margin-top:6px}
.aiblock-in input{flex:1;border:0;background:transparent;outline:none;font-size:15px;min-width:0}
.aiblock .qblk{margin-top:6px}
.aiblock .q-body{background:transparent;padding:0}
.aiblock .q-av{display:none}

/* composer */
.composer-dock{position:sticky;bottom:0;z-index:4;padding:14px 0 16px;background:linear-gradient(to bottom,transparent,var(--bg) 26%);margin-top:auto}
.composer{width:min(708px,calc(100% - 2*var(--gutter)));margin:0 auto;background:var(--bg-elev);border-radius:12px;box-shadow:var(--shadow-sm),0 6px 20px rgba(15,15,15,.06);border:1px solid var(--divider)}
.composer:focus-within{box-shadow:0 0 0 1px var(--accent-line),0 6px 20px rgba(15,15,15,.08)}
.cmp-quote{margin:10px 12px 0;padding:4px 8px;border-left:3px solid var(--hl-line);font-size:13px;color:var(--text-2);display:flex;gap:8px;align-items:flex-start}
.cmp-quote .x{margin-left:auto}
.cmp-row{display:flex;gap:8px;align-items:flex-start;padding:10px 12px 4px}
.cmp-row .ai-ic{color:var(--ai);margin-top:3px}
.cmp-row textarea{flex:1;border:0;outline:none;resize:none;background:transparent;font-size:15px;line-height:1.5;max-height:160px;min-height:24px}
.cmp-row textarea::placeholder,.aiblock-in input::placeholder,.askbox textarea::placeholder{color:var(--text-3)}
.cmp-bar{display:flex;align-items:center;gap:6px;padding:4px 8px 8px 8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:6px;font-size:13px;color:var(--text-2);white-space:nowrap}
.chip:hover{background:var(--hover);color:var(--text)}
.seg{display:inline-flex;border:1px solid var(--divider);border-radius:6px;padding:1px;gap:1px}
.seg button{height:22px;padding:0 8px;border-radius:4px;font-size:12.5px;color:var(--text-2);white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--press);color:var(--text);font-weight:500}
.cmp-bar .grow{flex:1}
.send{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.send:hover{background:var(--accent-hover)}
.send:disabled{background:var(--press);color:var(--text-3);cursor:default}
[data-variant="e"] .composer-dock{position:static;background:none;padding:6px 0 40px}
[data-variant="e"] .composer{box-shadow:none;border:1px solid var(--ai-line);background:var(--ai-soft);border-radius:8px}
[data-variant="e"] .composer-dock .cmp-hint-e{display:flex}
.cmp-hint-e{display:none;width:min(708px,calc(100% - 2*var(--gutter)));margin:0 auto 6px;font-size:12.5px;color:var(--text-3);gap:6px;align-items:center}

/* ask box (home / getting started) */
.askbox{border:1px solid var(--border);border-radius:12px;background:var(--bg-elev);box-shadow:var(--shadow-sm);margin:10px 0}
.askbox:focus-within{box-shadow:0 0 0 1px var(--accent-line),0 6px 20px rgba(15,15,15,.08)}
.askbox textarea{width:100%;border:0;outline:none;resize:none;background:transparent;font-size:16px;padding:14px 16px 4px;min-height:58px}
.askbox .cmp-bar{padding:4px 10px 10px}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.ex{font-size:13px;color:var(--text-2);border:1px solid var(--divider);border-radius:14px;padding:3px 10px;text-align:left}
.ex:hover{background:var(--hover);color:var(--text)}

/* empty chat */
.empty-chat{margin-top:14px;color:var(--text-2);font-size:14px}
.tpl-list{list-style:none;padding:0;margin:8px 0}
.tpl-list button{display:flex;align-items:center;gap:10px;width:100%;padding:5px 6px;border-radius:4px;text-align:left;color:var(--text-2)}
.tpl-list button:hover{background:var(--hover);color:var(--text)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:3px;font-size:12.5px;font-weight:450;white-space:nowrap;line-height:1}
.pill.gray{background:var(--p-gray-bg);color:var(--p-gray-tx)} .pill.green{background:var(--p-green-bg);color:var(--p-green-tx)}
.pill.blue{background:var(--p-blue-bg);color:var(--p-blue-tx)} .pill.yellow{background:var(--p-yellow-bg);color:var(--p-yellow-tx)}
.pill.red{background:var(--p-red-bg);color:var(--p-red-tx)} .pill.purple{background:var(--p-purple-bg);color:var(--p-purple-tx)}
.pill.orange{background:var(--p-orange-bg);color:var(--p-orange-tx)} .pill.brown{background:var(--p-brown-bg);color:var(--p-brown-tx)}
.pill.pink{background:var(--p-pink-bg);color:var(--p-pink-tx)}
.pill .pd{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.pill.blue .pd{animation:pulse 1.4s infinite}

/* margin comments */
.margin{position:absolute;top:0;left:calc(100% + 28px);width:184px;display:none}
@container (min-width:1130px){ .margin{display:block} }
.mcard{position:absolute;left:0;width:184px;font-size:13px;line-height:1.45;padding:8px 10px;border-radius:8px;background:var(--bg-elev);box-shadow:var(--shadow-sm);cursor:pointer;transition:box-shadow .12s}
.mcard:hover,.mcard.hot{box-shadow:var(--shadow)}
.mcard-h{display:flex;align-items:center;gap:6px;color:var(--text-3);font-size:12px}
.mcard-h .q-av{width:18px;height:18px;font-size:10px;margin:0}
.mcard-c{margin-top:3px;color:var(--text)}
.mcard input{width:100%;border:1px solid var(--border);border-radius:5px;padding:4px 6px;font-size:13px;background:var(--bg);outline:none;margin-top:4px}
.mcard .mc-sub{display:flex;align-items:flex-start;gap:5px;margin-top:5px;color:var(--text-2)}
.mcard .mc-sub:hover{color:var(--text)}

/* right panel & peek */
.rpanel{width:340px;flex:none;border-left:1px solid var(--divider);background:var(--bg);overflow:auto;font-size:14px}
.rp-h{display:flex;align-items:center;gap:2px;padding:8px 8px 0 12px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--divider)}
.tab{height:32px;padding:0 8px;font-size:14px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--text);border-color:var(--text);font-weight:500}
.rp-h .grow{flex:1}
.rp-sec{padding:12px 14px 4px}
.rp-sec h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--text-2)}
.rp-row{display:flex;align-items:flex-start;gap:8px;padding:5px 6px;margin:0 -6px;border-radius:4px;width:calc(100% + 12px);text-align:left}
.rp-row:hover{background:var(--hover)}
.rp-row .sub{display:block;font-size:12.5px;color:var(--text-3);margin-top:1px}
.rp-empty{color:var(--text-3);font-size:13px;padding:2px 0 6px}
.hl-card{border-left:3px solid var(--hl-line);padding:2px 0 2px 10px;margin:6px 0 12px}
.hl-card .ht{background:var(--hl);padding:0 2px;border-radius:2px}
.hl-card .hm{font-size:12.5px;color:var(--text-3);margin-top:4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.hl-card .hc{font-size:13.5px;margin-top:4px}
.peek{position:absolute;top:0;right:0;bottom:0;width:min(600px,52%);background:var(--bg);box-shadow:var(--shadow);z-index:8;display:flex;flex-direction:column;border-top-left-radius:10px;border-bottom-left-radius:10px;overflow:hidden}
.peek-h{height:42px;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--divider)}
.peek-h .grow{flex:1}
.peek-h .ttl{font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:6px;margin-left:4px;white-space:nowrap;overflow:hidden}
.peek .scroller{--gutter:48px}
.peek .page-head{padding-top:28px}

/* database */
.db-head{padding-top:64px}
.db-desc{color:var(--text-2);font-size:14px;margin:0 0 10px}
.db-bar{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--divider);margin-bottom:2px;flex-wrap:wrap}
.vtab{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 8px;font-size:14px;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.vtab:hover{color:var(--text)}
.vtab[aria-selected="true"]{color:var(--text);border-color:var(--text);font-weight:500}
.db-bar .grow{flex:1}
.new-btn{display:inline-flex;align-items:center;height:28px;border-radius:6px;background:var(--accent);color:#fff;font-size:14px;font-weight:500;overflow:hidden;margin-left:6px}
.new-btn span{padding:0 10px}
.new-btn:hover{background:var(--accent-hover)}
.dbt-wrap{overflow-x:auto;margin:0 0 10px}
table.dbt{border-collapse:collapse;font-size:14px;width:100%;min-width:760px}
table.dbt th{font-weight:400;color:var(--text-2);text-align:left;height:34px;padding:0 8px;border-bottom:1px solid var(--divider);border-right:1px solid var(--divider);white-space:nowrap}
table.dbt th:last-child,table.dbt td:last-child{border-right:0}
table.dbt th .thc{display:flex;align-items:center;gap:6px}
table.dbt td{height:36px;padding:0 8px;border-bottom:1px solid var(--divider);border-right:1px solid var(--divider);white-space:nowrap;color:var(--text-2)}
table.dbt td.name{color:var(--text);font-weight:500;max-width:340px}
table.dbt tr:hover td{background:var(--hover)}
.namec{display:flex;align-items:center;gap:8px;min-width:0}
.namec .t{overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.namec.child{padding-left:22px}
.open-pill{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--text-2);border:1px solid var(--border);background:var(--bg);border-radius:4px;padding:1px 6px;opacity:0;display:inline-flex;align-items:center;gap:4px}
tr:hover .open-pill,.open-pill:focus-visible{opacity:1}
.db-add{display:flex;align-items:center;gap:6px;color:var(--text-3);font-size:14px;height:34px;padding:0 8px;width:100%;text-align:left}
.db-add:hover{background:var(--hover)}
.board{display:flex;gap:12px;overflow-x:auto;padding:8px 0 12px}
.bcol{width:260px;flex:none}
.bcol-h{display:flex;align-items:center;gap:8px;height:32px;font-size:14px;color:var(--text-2)}
.bcard{display:block;width:100%;text-align:left;background:var(--bg-elev);border-radius:6px;box-shadow:var(--shadow-sm);padding:10px 10px 8px;margin:0 0 8px;font-size:14px}
.bcard:hover{background:var(--hover)}
.bcard .t{font-weight:500;margin-bottom:6px;line-height:1.35}
.bcard .r span{display:inline-flex;align-items:center;gap:3px}
.bcard .r{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--text-2)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:12px 0}
.gcard{display:flex;flex-direction:column;text-align:left;border-radius:6px;box-shadow:var(--shadow-sm);overflow:hidden;background:var(--bg-elev);font-size:14px}
.gcard:hover{background:var(--hover)}
.gprev{height:120px;padding:10px 12px;font-size:11.5px;line-height:1.45;color:var(--text-2);background:var(--bg-sunk);overflow:hidden;border-bottom:1px solid var(--divider);-webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent)}
.gmain{padding:8px 12px 10px}
.gmain .t{font-weight:500;display:flex;gap:6px;align-items:center}
.gmain .r{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.dblist .lrow{display:flex;align-items:center;gap:10px;height:36px;padding:0 6px;border-bottom:1px solid var(--divider);font-size:14px;width:100%;text-align:left}
.dblist .lrow:hover{background:var(--hover)}
.dblist .t{font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dblist .m{color:var(--text-3);font-size:12.5px;white-space:nowrap}

/* home */
.home{width:min(820px,calc(100% - 2*var(--gutter)));margin:0 auto;padding:56px 0 48px}
.greet{font-size:30px;font-weight:700;text-align:center;margin:0 0 18px}
.home h4{font-size:12.5px;color:var(--text-2);font-weight:500;margin:28px 0 8px;display:flex;align-items:center;gap:6px}
.rcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rcard{border-radius:12px;background:var(--bg-elev);box-shadow:var(--shadow-sm);overflow:hidden;text-align:left;display:flex;flex-direction:column;height:134px}
.rcard:hover{box-shadow:var(--shadow)}
.rcard .top{height:42px;background:var(--bg-sunk);position:relative}
.rcard .top.cv{background:linear-gradient(120deg,var(--cover-a),var(--cover-b) 55%,var(--cover-c))}
.rcard .ri{position:absolute;left:12px;bottom:-12px;background:var(--bg-elev);border-radius:4px;padding:1px}
.rcard .rt{padding:18px 12px 0;font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rcard .rm{padding:4px 12px 0;font-size:12px;color:var(--text-3);margin-top:auto;padding-bottom:10px}
.runrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;width:100%;text-align:left;font-size:14px}
.runrow:hover{background:var(--hover)}
.runrow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.runrow .m{font-size:12.5px;color:var(--text-3);white-space:nowrap}
.gs-card{display:flex;gap:14px;align-items:center;padding:14px;border-radius:12px;background:var(--callout);width:100%;text-align:left}
.gs-card:hover{background:var(--press)}
.prog{height:4px;background:var(--press);border-radius:2px;overflow:hidden;width:120px}
.prog i{display:block;height:100%;background:var(--accent)}

/* map */
.map-wrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:520px}
.map-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:10px;height:10px;border-radius:50%}
.lg-line{width:18px;height:0;border-top:2px solid}
.map-svg{width:100%;flex:1;min-height:460px;border:1px solid var(--divider);border-radius:10px;background:var(--bg-sunk)}
.map-svg text{font:500 12px var(--font);fill:var(--text-2);pointer-events:none}
.map-svg .node{cursor:pointer}
.map-svg .node circle{stroke:var(--bg);stroke-width:2}
.map-svg .node:focus{outline:none}
.map-svg .node:focus circle.ring,.map-svg .node.focus circle.ring{stroke:var(--accent);stroke-width:2.5;opacity:1}
.map-svg circle.ring{fill:none;opacity:0}
.map-svg.dim .node:not(.nb){opacity:.25} .map-svg.dim line:not(.nb){opacity:.12}
.map-svg .node.nb text{fill:var(--text)}

/* popovers */
.menu{position:fixed;z-index:50;min-width:220px;max-width:320px;background:var(--bg-elev);border-radius:8px;box-shadow:var(--shadow);padding:6px 4px;font-size:14px}
.menu-h{font-size:12px;color:var(--text-3);padding:6px 10px 4px;font-weight:500}

function renderAns(a, pageId, path) {

}
function toolSummary(tools) { const c = {}; tools.forEach(t => c[t.n] = (c[t.n] || 0) + 1); return Object.entries(c).map(([k, v]) => `${k} ×${v}`).join(", "); }
function fmtEl(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function renderSub(b, pageId, path) {

function renderOl(items, pageId, level) {

        <div class="prop"><div class="prop-k">${ic("user", 15)} Agent</div><div class="prop-v"><span class="pill purple">${esc(a.agent)}</span></div></div>
        <div class="prop"><div class="prop-k">${ic("bolt", 15)} Model</div><div class="prop-v"><span class="pill gray">${esc(a.model)}</span></div></div>
        <div class="prop"><div class="prop-k">${ic("folder", 15)} In</div><div class="prop-v">${parent ? mention(parent.id) : "—"}</div></div>
        <div class="prop"><div class="prop-k">${ic("branch", 15)} Sub-chats</div><div class="prop-v">${subs.length ? subs.map(s => mention(s.id)).join(" ") : '<span style="color:var(--text-3)">Empty</span>'}</div></div>
        <div class="prop"><div class="prop-k">${ic("clock", 15)} Created</div><div class="prop-v">${esc(p.created || "now")}</div></div>

    else { svg.classList.remove("dim"); } }
});
document.addEventListener("click", e => { const mk = e.target.closest("mark.hl"); if (mk && getSelection().isCollapsed) { const h = HL.find(x => x.id === mk.dataset.hl); if (h && (!$(`.mcard[data-hl="${h.id}"]`) || !$(`.mcard[data-hl="${h.id}"]`).offsetParent)) { S.panel = true; S.panelTab = "hl"; renderPanel(); renderTopbar(); } } });

/* outline drag and drop */
let DRAG = null;
document.addEventListener("dragstart", e => { const h = e.target.closest && e.target.closest(".drag[data-oid]"); if (!h) return; DRAG = { oid: h.dataset.oid, page: h.dataset.page }; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", h.dataset.oid); const row = h.closest(".ol-row"); row.classList.add("dragging"); try { e.dataTransfer.setDragImage(row, 20, 14); } catch (_) {} });
document.addEventListener("dragover", e => { if (!DRAG) return; const li = e.target.closest(".ol-item"); $$(".drop-before,.drop-after").forEach(x => x.classList.remove("drop-before", "drop-after")); if (!li || li.dataset.oid === DRAG.oid) return;
  const ob = outlineBlock(DRAG.page); const a = findOl(ob.items, DRAG.oid), b = findOl(ob.items, li.dataset.oid); if (!a || !b || a.arr !== b.arr) return;
  e.preventDefault(); const r = $(".ol-row", li).getBoundingClientRect(); li.classList.add(e.clientY < r.top + r.height / 2 ? "drop-before" : "drop-after"); });
document.addEventListener("drop", e => { if (!DRAG) return; const li = $(".drop-before,.drop-after"); if (li) { e.preventDefault(); const ob = outlineBlock(DRAG.page); const a = findOl(ob.items, DRAG.oid); const [it] = a.arr.splice(a.idx, 1); const b = findOl(ob.items, li.dataset.oid); b.arr.splice(b.idx + (li.classList.contains("drop-after") ? 1 : 0), 0, it); rerenderPages(); toast("Moved"); } DRAG = null; });
document.addEventListener("dragend", () => { DRAG = null; $$(".drop-before,.drop-after,.dragging").forEach(x => x.classList.remove("drop-before", "drop-after", "dragging")); });

/* textarea autosize */
document.addEventListener("input", e => { if (e.target.matches("textarea")) { e.target.style.height = "auto"; e.target.style.height = Math.min(160, e.target.scrollHeight) + "px"; } });
window.addEventListener("resize", () => layoutMargins(document));

/* ======================================================================
   Variants and boot
   ====================================================================== */
function landing() {
  const v = variant(); S.ws = "thesis"; S.peek = null; S.panel = null; S.hist = []; S.fwd = [];
  S.current = { a: "gs", b: "qdb", c: "lfp", d: "ch3", e: "ch3" }[v] || "gs";
  if (v === "b") { S.open.add("qdb"); S.dbView = "table"; }
  if (v === "d") S.peek = "lfp";
  if (v === "c") S.subOpen.add("br1");
}
function onVariant() { const sw = document.querySelector(".vswitch"); if (sw) sw.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === variant())); landing(); hideSel(); closePop(); closeModal(); renderAll(); $("#scroller").scrollTop = 0; }
function standaloneSwitcher() {
  const el = document.createElement("div"); el.className = "vswitch"; el.setAttribute("aria-label", "Variants");
  const draw = () => { el.innerHTML = `<b>Variant</b>${MOCK.variants.map(v => `<button aria-pressed="${variant() === v.id}" title="${esc(v.label)}: ${esc(v.summary)}" data-v="${v.id}">${v.id.toUpperCase()}</button>`).join("")}`; };
  el.addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { setVariant(b.dataset.v); draw(); } });
  draw(); document.body.appendChild(el);
}
setVariant("a");
if (parent !== window) parent.postMessage({ type: "mock:ready", mock: MOCK }, "*");
else standaloneSwitcher();
</script>
</body>
