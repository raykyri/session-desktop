<!doctype html>
<!--
  Session redesign, round 1 — candidate "macos".
  Influence: Apple macOS system app idioms (Human Interface Guidelines; Finder, Mail, Messages,
  Freeform, System Settings; Tahoe-era glass sidebar and toolbar).
  Self-contained: system fonts, inline SVG icons, no network requests.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session · macOS-style</title>
<style>
:root {
  --accent: #007aff; --accent-fg: #ffffff; --accent-soft: rgba(0,122,255,.12); --accent-line: rgba(0,122,255,.45);
  --desk: #e9e9ee; --window: #ffffff; --tint: #e7ecf5;
  --sidebar: rgba(236,237,242,.78); --glass: rgba(255,255,255,.66); --glass-solid: #f6f6f8;
  --glass-border: rgba(0,0,0,.09); --glass-hi: rgba(255,255,255,.9); --shadow: rgba(0,0,0,.18); --shadow-soft: rgba(0,0,0,.07);
  --text: #1d1d1f; --text-2: rgba(60,60,67,.80); --text-3: rgba(60,60,67,.56); --text-4: rgba(60,60,67,.36);
  --sep: rgba(60,60,67,.13); --sep-strong: rgba(60,60,67,.22);
  --hover: rgba(0,0,0,.045); --sel: rgba(0,0,0,.075); --row-alt: rgba(0,0,0,.024);
  --field: rgba(118,118,128,.12); --field-solid: #ffffff; --control: #ffffff;
  --bubble: #007aff; --bubble-fg: #ffffff;
  --hl: rgba(255,204,0,.42); --hl-flash: rgba(255,170,0,.75);
  --green: #28a745; --orange: #f08a00; --red: #e5372b; --purple: #a34fd6; --yellow: #f5b800; --teal: #1597a8; --gray: #8e8e93; --indigo: #5856d6;
  --sticky: #fff4b8; --sticky-border: #eedc84; --sticky-text: #3d3519;
  --canvas: #f7f7f9; --canvas-dot: rgba(0,0,0,.13); --frame: rgba(0,0,0,.035);
  --popover: rgba(248,248,250,.94); --menubar: rgba(246,246,248,.86);
  --code: rgba(0,0,0,.05); --mark-text: inherit;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --accent: #0a84ff; --accent-fg: #ffffff; --accent-soft: rgba(10,132,255,.2); --accent-line: rgba(10,132,255,.6);
  --desk: #161618; --window: #1e1e20; --tint: #222631;
  --sidebar: rgba(44,44,49,.74); --glass: rgba(52,52,57,.66); --glass-solid: #2a2a2e;
  --glass-border: rgba(255,255,255,.09); --glass-hi: rgba(255,255,255,.07); --shadow: rgba(0,0,0,.55); --shadow-soft: rgba(0,0,0,.3);
  --text: #f5f5f7; --text-2: rgba(235,235,245,.74); --text-3: rgba(235,235,245,.5); --text-4: rgba(235,235,245,.3);
  --sep: rgba(255,255,255,.09); --sep-strong: rgba(255,255,255,.16);
  --hover: rgba(255,255,255,.06); --sel: rgba(255,255,255,.1); --row-alt: rgba(255,255,255,.025);
  --field: rgba(118,118,128,.24); --field-solid: #2c2c2e; --control: #3a3a3d;
  --bubble: #0a84ff; --bubble-fg: #ffffff;
  --hl: rgba(255,214,10,.3); --hl-flash: rgba(255,190,10,.6);
  --green: #32d74b; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2; --yellow: #ffd60a; --teal: #40c8e0; --gray: #98989d; --indigo: #7d7aff;
  --sticky: #4a4220; --sticky-border: #6b5f2a; --sticky-text: #f6ebbd;
  --canvas: #1a1a1c; --canvas-dot: rgba(255,255,255,.12); --frame: rgba(255,255,255,.035);
  --popover: rgba(42,42,46,.95); --menubar: rgba(30,30,32,.86);
  --code: rgba(255,255,255,.07);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --accent: #0a84ff; --accent-fg: #ffffff; --accent-soft: rgba(10,132,255,.2); --accent-line: rgba(10,132,255,.6);
  --desk: #161618; --window: #1e1e20; --tint: #222631;
  --sidebar: rgba(44,44,49,.74); --glass: rgba(52,52,57,.66); --glass-solid: #2a2a2e;
  --glass-border: rgba(255,255,255,.09); --glass-hi: rgba(255,255,255,.07); --shadow: rgba(0,0,0,.55); --shadow-soft: rgba(0,0,0,.3);
  --text: #f5f5f7; --text-2: rgba(235,235,245,.74); --text-3: rgba(235,235,245,.5); --text-4: rgba(235,235,245,.3);
  --sep: rgba(255,255,255,.09); --sep-strong: rgba(255,255,255,.16);
  --hover: rgba(255,255,255,.06); --sel: rgba(255,255,255,.1); --row-alt: rgba(255,255,255,.025);
  --field: rgba(118,118,128,.24); --field-solid: #2c2c2e; --control: #3a3a3d;
  --bubble: #0a84ff; --bubble-fg: #ffffff;
  --hl: rgba(255,214,10,.3); --hl-flash: rgba(255,190,10,.6);
  --green: #32d74b; --orange: #ff9f0a; --red: #ff453a; --purple: #bf5af2; --yellow: #ffd60a; --teal: #40c8e0; --gray: #98989d; --indigo: #7d7aff;
  --sticky: #4a4220; --sticky-border: #6b5f2a; --sticky-text: #f6ebbd;
  --canvas: #1a1a1c; --canvas-dot: rgba(255,255,255,.12); --frame: rgba(255,255,255,.035);
  --popover: rgba(42,42,46,.95); --menubar: rgba(30,30,32,.86);
  --code: rgba(255,255,255,.07);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--desk); color: var(--text); overflow: hidden;
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
input, textarea { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: 3px solid var(--accent-line); outline-offset: 1px; border-radius: 6px; }
.i { flex: none; display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
kbd { font: 11px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--text-3); letter-spacing: .02em; }

/* ---------- menu bar ---------- */
#menubar { position: absolute; inset: 0 0 auto 0; height: 24px; display: flex; align-items: center; padding: 0 8px; gap: 1px;
  background: var(--menubar); backdrop-filter: blur(24px) saturate(1.8); -webkit-backdrop-filter: blur(24px) saturate(1.8);
  font-size: 13px; z-index: 60; white-space: nowrap; overflow: hidden; border-bottom: .5px solid var(--sep); }
.mb { padding: 2px 9px; border-radius: 5px; line-height: 18px; }
.mb.app { font-weight: 700; }
.mb.open, .mb:hover { background: var(--sel); }
.mb-right { margin-left: auto; display: flex; gap: 14px; align-items: center; color: var(--text); padding-right: 6px; font-variant-numeric: tabular-nums; }

/* ---------- window ---------- */
#win { position: absolute; top: 24px; left: 0; right: 0; bottom: 0; display: flex;
  background: linear-gradient(90deg, var(--tint) 0, var(--window) 270px); }
#sidebar { width: 236px; flex: none; margin: 8px 0 8px 8px; border-radius: 18px; background: var(--sidebar);
  backdrop-filter: blur(30px) saturate(1.7); -webkit-backdrop-filter: blur(30px) saturate(1.7);
  box-shadow: inset 0 0 0 .5px var(--glass-border), inset 0 1px 0 var(--glass-hi), 0 6px 24px var(--shadow-soft);
  display: flex; flex-direction: column; overflow: hidden; z-index: 20; transition: margin .2s ease, opacity .2s ease; }
#win.no-sidebar #sidebar { display: none; }
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--window); position: relative; }
#toolbar { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; position: relative; z-index: 10; }
#body { flex: 1; min-height: 0; display: flex; position: relative; }

.lights { display: flex; gap: 8px; padding: 0 2px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.lights span:nth-child(1) { background: #ff5f57; } .lights span:nth-child(2) { background: #febc2e; } .lights span:nth-child(3) { background: #28c840; }

/* sidebar */
.sb-top { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 14px; flex: none; }
.ws-btn { display: flex; align-items: center; gap: 8px; width: calc(100% - 16px); margin: 0 8px 6px; padding: 6px 8px; border-radius: 9px; text-align: left; }
.ws-btn:hover { background: var(--hover); }
.ws-ic { width: 26px; height: 26px; border-radius: 7px; flex: none; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 12px;
  background: linear-gradient(160deg, #5aa7ff, #2357e0); box-shadow: inset 0 0 0 .5px rgba(0,0,0,.15); }
.ws-ic.p { background: linear-gradient(160deg, #6fd389, #23935a); }
.ws-name { font-weight: 600; font-size: 13px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-sub { font-size: 11px; color: var(--text-3); }
.sb-scroll { flex: 1; overflow: auto; padding: 0 8px 8px; }
.sb-h { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 12px 8px 4px; display: flex; align-items: center; justify-content: space-between; }
.sb-h button { color: var(--text-3); border-radius: 5px; padding: 1px; opacity: 0; }
.sb-h:hover button, .sb-h button:focus-visible { opacity: 1; }
.sb-item { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border-radius: 8px; text-align: left; color: var(--text); }
.sb-item .i { color: var(--accent); }
.sb-item .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-item .cnt { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.sb-item .badge { font-size: 11px; font-weight: 600; color: #fff; background: var(--accent); border-radius: 9px; padding: 0 6px; line-height: 16px; }
.sb-item:hover { background: var(--hover); }
.sb-item.on { background: var(--sel); font-weight: 500; }
.sb-item.drop { box-shadow: inset 0 0 0 2px var(--accent); }
.sb-foot { flex: none; border-top: .5px solid var(--sep); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.agent-line { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; font-size: 12px; color: var(--text-2); width: 100%; text-align: left; }
.agent-line:hover { background: var(--hover); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--gray); }
.dot.ok { background: var(--green); } .dot.run { background: var(--accent); } .dot.q { background: var(--orange); } .dot.stop { background: var(--gray); }
html[data-variant="c"] .sb-item, html[data-variant="d"] .sb-item { height: 24px; font-size: 12.5px; }
html[data-variant="d"] #sidebar { background: var(--glass-solid); backdrop-filter: none; -webkit-backdrop-filter: none; }

/* toolbar */
.tb-group { display: flex; align-items: center; height: 34px; border-radius: 17px; padding: 0 3px; gap: 1px;
  background: var(--glass); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
  box-shadow: inset 0 0 0 .5px var(--glass-border), 0 1px 3px var(--shadow-soft); flex: none; }
.tb-btn { width: 34px; height: 28px; border-radius: 14px; display: grid; place-items: center; color: var(--text-2); }
.tb-btn:hover { background: var(--hover); color: var(--text); }
.tb-btn[aria-pressed="true"] { background: var(--sel); color: var(--text); }
.tb-btn:disabled { color: var(--text-4); }
.tb-title { min-width: 0; flex: 1 1 auto; padding: 0 6px; }
.tb-title b { display: block; font-size: 13.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-title span { display: block; font-size: 11px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: flex; padding: 2px; gap: 2px; }
.seg button { height: 28px; padding: 0 9px; border-radius: 14px; display: flex; align-items: center; gap: 5px; color: var(--text-2); font-size: 12px; }
.seg button:hover { color: var(--text); }
.seg button[aria-checked="true"] { background: var(--control); color: var(--text); box-shadow: 0 1px 2px var(--shadow-soft), inset 0 0 0 .5px var(--glass-border); }
.seg .t { display: none; }
@media (min-width: 1360px) { #toolbar .seg .t { display: inline; } }
.search { display: flex; align-items: center; gap: 6px; height: 34px; width: 200px; border-radius: 17px; padding: 0 10px; color: var(--text-3); }
.search input:focus-visible, .qo-in input:focus-visible { outline: none; }
.search input { border: 0; background: none; width: 100%; font-size: 13px; color: var(--text); }
.search input::placeholder { color: var(--text-3); }
.search:focus-within { box-shadow: inset 0 0 0 .5px var(--glass-border), 0 0 0 3px var(--accent-line); }
.search .clr { color: var(--text-3); display: none; }
.search.has .clr { display: block; }
.tb-mini-search { display: none; }

/* panes */
#list { width: 280px; flex: none; border-right: .5px solid var(--sep); display: flex; flex-direction: column; min-height: 0; }
#content { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
#insp { width: 284px; flex: none; margin: 0 8px 8px 0; border-radius: 16px; display: none; flex-direction: column; min-height: 0;
  background: var(--glass); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
  box-shadow: inset 0 0 0 .5px var(--glass-border), 0 4px 18px var(--shadow-soft); }
#body.with-insp #insp { display: flex; }
html[data-variant="a"] #insp, html[data-variant="e"] #insp { background: var(--glass-solid); }

/* list pane (Mail/Notes style) */
.list-h { flex: none; padding: 4px 14px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.list-h h2 { margin: 0; font-size: 15px; font-weight: 700; }
.list-h span { font-size: 11.5px; color: var(--text-3); }
.scope { display: flex; gap: 4px; padding: 0 12px 8px; flex-wrap: wrap; }
.scope button { font-size: 11.5px; padding: 2px 9px; border-radius: 10px; color: var(--text-2); background: var(--field); }
.scope button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.list-scroll { flex: 1; overflow: auto; padding: 0 8px 12px; }
.grp { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 10px 8px 4px; }
.row { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 8px; width: 100%; text-align: left; padding: 8px 8px 9px; border-radius: 10px; position: relative; }
.row + .row::before { content: ""; position: absolute; left: 38px; right: 8px; top: 0; border-top: .5px solid var(--sep); }
.row:hover { background: var(--hover); }
.row.on { background: var(--accent); color: #fff; }
.row.on::before, .row.on + .row::before { display: none; }
.row.on .r-sub, .row.on .r-time, .row.on .r-meta { color: rgba(255,255,255,.82); }
.row.on .kind-ic { color: #fff; }
.row .kind-ic { grid-row: 1 / span 3; color: var(--accent); padding-top: 1px; }
.r-title { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-time { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.r-sub { grid-column: 2 / 4; font-size: 12px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.r-meta { grid-column: 2 / 4; font-size: 11.5px; color: var(--text-3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.r-meta .st { display: inline-flex; align-items: center; gap: 4px; }
.row mark { background: var(--hl); color: inherit; border-radius: 2px; }
.empty-list { padding: 40px 18px; text-align: center; color: var(--text-3); font-size: 12.5px; }
.empty-list b { display: block; color: var(--text-2); font-size: 14px; margin-bottom: 4px; }

/* page content */
.scroll { flex: 1; overflow: auto; position: relative; }
.page { max-width: 720px; margin: 0 auto; padding: 14px 32px 40px; }
.crumb { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-3); margin: 0 0 10px; }
.crumb button { color: var(--accent); display: inline-flex; align-items: center; gap: 2px; border-radius: 5px; padding: 1px 3px; }
.quote { border-left: 3px solid var(--yellow); padding: 6px 12px; margin: 0 0 14px; color: var(--text-2); font-size: 13.5px; background: var(--hl); border-radius: 0 8px 8px 0; }
.quote small { display: block; color: var(--text-3); font-size: 11px; margin-bottom: 2px; }
.msg-q { display: flex; flex-direction: column; align-items: flex-end; margin: 18px 0 14px; }
.bubble { max-width: 78%; background: var(--bubble); color: var(--bubble-fg); padding: 8px 14px 9px; border-radius: 19px; font-size: 14.5px; line-height: 1.38; position: relative; }
.bubble::after { content: ""; position: absolute; right: -4px; bottom: 0; width: 12px; height: 14px; background: var(--bubble); border-bottom-left-radius: 10px 14px; clip-path: polygon(0 0, 100% 100%, 0 100%); }
.msg-q .when { font-size: 11px; color: var(--text-3); margin-top: 4px; padding-right: 6px; }
.ans { margin: 0 0 8px; }
.ans-h { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.mono { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 9.5px; font-weight: 700; color: #fff; flex: none; letter-spacing: .02em; }
.ag-cc { background: linear-gradient(160deg, #f0a35e, #d4672b); }
.ag-cx { background: linear-gradient(160deg, #39c08a, #138a63); }
.ag-gk { background: linear-gradient(160deg, #6e6e78, #3a3a42); }
.answer-body { font-size: 14.5px; line-height: 1.62; position: relative; }
.answer-body p { margin: 0 0 12px; }
.answer-body h3 { font-size: 15px; font-weight: 650; margin: 18px 0 6px; }
.answer-body p.anchored { box-shadow: -10px 0 0 -7px var(--yellow); }
.answer-body table { border-collapse: collapse; margin: 4px 0 14px; font-size: 13px; min-width: 320px; }
.answer-body th { text-align: left; font-weight: 600; color: var(--text-2); font-size: 12px; padding: 5px 16px 5px 0; border-bottom: .5px solid var(--sep-strong); }
.answer-body td { padding: 5px 16px 5px 0; border-bottom: .5px solid var(--sep); font-variant-numeric: tabular-nums; }
mark.hl { background: var(--hl); color: inherit; border-radius: 3px; padding: 0 1px; transition: background .4s; }
mark.hl.flash { background: var(--hl-flash); }
.bm { display: inline-flex; align-items: center; gap: 2px; height: 18px; padding: 0 6px 0 4px; margin: 0 2px; border-radius: 9px; vertical-align: 1px;
  font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); line-height: 1; }
.bm:hover { background: var(--accent); color: #fff; }
.bm .i { width: 12px; height: 12px; }
.recap { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); margin: 0 0 14px; font-size: 13.5px; }
.recap .i { color: var(--accent); margin-top: 2px; }
.recap b { display: block; font-size: 11px; color: var(--text-3); font-weight: 600; }
.sources { margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.src { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px 4px 7px; border-radius: 8px; background: var(--field); color: var(--text-2); max-width: 100%; }
.src:hover { color: var(--text); background: var(--sel); }
.src span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ans-foot { display: flex; align-items: center; gap: 2px; margin-top: 10px; color: var(--text-3); font-size: 11.5px; flex-wrap: wrap; }
.ans-foot .sp { flex: 1; min-width: 8px; }
.fbtn { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px; border-radius: 7px; color: var(--text-2); font-size: 12px; }
.fbtn:hover { background: var(--hover); color: var(--text); }
.fbtn.primary { color: var(--accent); }
.status { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--field); font-size: 12.5px; color: var(--text-2); margin: 8px 0; flex-wrap: wrap; }
.status b { color: var(--text); font-weight: 600; }
.status .sp { flex: 1; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.pill-btn { height: 24px; padding: 0 10px; border-radius: 12px; background: var(--control); box-shadow: inset 0 0 0 .5px var(--sep-strong), 0 .5px 1px var(--shadow-soft); font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.pill-btn:hover { filter: brightness(.97); }
.pill-btn.stop { color: var(--red); }
.pill-btn.acc { background: var(--accent); color: #fff; box-shadow: none; }
.activity { margin: 0 0 10px; font-size: 12px; color: var(--text-2); }
.activity summary { cursor: default; color: var(--text-3); list-style: none; display: inline-flex; gap: 4px; align-items: center; }
.activity summary::-webkit-details-marker { display: none; }
.activity ol { margin: 6px 0 0; padding: 0 0 0 4px; list-style: none; display: grid; gap: 3px; }
.activity li { display: flex; gap: 8px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; }
.activity li span { color: var(--text-3); }
.caret { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: -2px; margin-left: 2px; border-radius: 1px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.followup-sep { margin: 22px 0 0; border: 0; border-top: .5px solid var(--sep); }

/* composer */
.dock { flex: none; padding: 8px 24px 14px; }
.dock-in { max-width: 720px; margin: 0 auto; }
.composer { display: flex; flex-direction: column; border-radius: 20px; background: var(--field-solid);
  box-shadow: inset 0 0 0 .5px var(--sep-strong), 0 2px 10px var(--shadow-soft); padding: 6px 6px 6px 14px; }
.composer:focus-within { box-shadow: inset 0 0 0 .5px var(--accent-line), 0 0 0 3px var(--accent-soft), 0 2px 10px var(--shadow-soft); }
.composer textarea { border: 0; background: none; resize: none; font-size: 14px; line-height: 1.45; padding: 5px 0; min-height: 30px; max-height: 160px; width: 100%; }
.composer textarea::placeholder { color: var(--text-3); }
.comp-row { display: flex; align-items: center; gap: 6px; }
.comp-row .sp { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px 0 4px; border-radius: 13px; font-size: 12px; color: var(--text-2); }
.chip:hover { background: var(--hover); color: var(--text); }
.chip .mono { width: 18px; height: 18px; font-size: 8.5px; border-radius: 5px; }
.send { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
.send:disabled { background: var(--text-4); }
.comp-hint { font-size: 11px; color: var(--text-3); margin: 6px 4px 0; display: flex; gap: 12px; flex-wrap: wrap; }
.ctx-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); background: var(--accent-soft); padding: 3px 6px 3px 9px; border-radius: 8px; margin: 2px 0 4px; align-self: flex-start; }
.ctx-chip button { color: var(--text-3); }

/* new chat / welcome */
.welcome { max-width: 640px; margin: 0 auto; padding: 48px 32px 40px; }
.app-icon { width: 72px; height: 72px; margin: 0 auto 14px; display: block; }
.welcome h1 { text-align: center; font-size: 24px; font-weight: 700; margin: 0 0 6px; letter-spacing: -.01em; }
.welcome .lede { text-align: center; color: var(--text-2); font-size: 14px; margin: 0 auto 22px; max-width: 460px; }
.welcome .composer textarea { font-size: 15px; min-height: 56px; }
.alt-actions { display: flex; justify-content: center; gap: 8px; margin: 14px 0 0; flex-wrap: wrap; }
.sugg { margin: 22px 0 0; }
.sugg h4, .gloss h4 { font-size: 11px; font-weight: 600; color: var(--text-3); margin: 0 0 6px 4px; }
.sugg button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 9px; font-size: 13px; color: var(--text-2); }
.sugg button:hover { background: var(--hover); color: var(--text); }
.sugg .i { color: var(--accent); }
.gloss { margin: 26px 0 0; }
.gloss-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 2px 18px; }
.gloss-item { display: flex; gap: 10px; padding: 8px 4px; }
.gloss-item .gi { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.gloss-item b { display: block; font-size: 13px; }
.gloss-item span { font-size: 12px; color: var(--text-2); }
.agents-card { margin: 22px 0 0; border-radius: 12px; background: var(--field); padding: 10px 12px; font-size: 12.5px; color: var(--text-2); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.agents-card .ag { display: inline-flex; gap: 6px; align-items: center; }

/* notes */
.note-page { max-width: 720px; margin: 0 auto; padding: 18px 40px 80px; }
.note-meta { text-align: center; font-size: 11.5px; color: var(--text-3); margin-bottom: 14px; }
.note-title { font-size: 24px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.01em; }
.note-hint { font-size: 12px; color: var(--text-3); margin: 0 0 16px; }
.ol { font-size: 14.5px; line-height: 1.5; }
.bl { display: flex; align-items: flex-start; gap: 2px; padding: 2px 0 2px calc(var(--d) * 22px); border-radius: 6px; position: relative; }
.bl:hover { background: var(--hover); }
.tri { width: 18px; height: 22px; display: grid; place-items: center; color: var(--text-3); flex: none; }
.tri .i { transition: transform .15s; }
.tri[aria-expanded="true"] .i { transform: rotate(90deg); }
.tri.none { visibility: hidden; }
.bdot { width: 14px; height: 22px; display: grid; place-items: center; flex: none; }
.bdot::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--text-2); }
.bt { flex: 1; min-width: 0; padding: 0 4px; border-radius: 4px; }
.bl.lvl0 > .bt { font-weight: 650; }
.bacts { opacity: 0; display: flex; gap: 2px; padding-right: 4px; }
.bl:hover .bacts, .bl:focus-within .bacts { opacity: 1; }
.bacts button { color: var(--text-3); padding: 3px; border-radius: 5px; }
.bacts button:hover { color: var(--accent); background: var(--hover); }
a.wl { color: var(--accent); text-decoration: none; background: var(--accent-soft); border-radius: 5px; padding: 0 4px; white-space: nowrap; cursor: pointer; font-weight: 500; }
a.wl::before { content: "[["; opacity: .45; font-weight: 400; }
a.wl::after { content: "]]"; opacity: .45; font-weight: 400; }
a.wl:hover { background: var(--accent); color: #fff; }
.clip { border-radius: 14px; box-shadow: inset 0 0 0 .5px var(--sep-strong); overflow: hidden; margin: 8px 0 18px; }
.clip-hero { height: 120px; background: linear-gradient(135deg, #2b6cb0, #2c7a7b 55%, #68a063); display: flex; align-items: flex-end; padding: 12px 16px; color: #fff; font-weight: 600; font-size: 12px; }
.clip-body { padding: 12px 16px 14px; }
.clip-body b { display: block; font-size: 15px; margin-bottom: 4px; }
.clip-body p { margin: 0; color: var(--text-2); font-size: 13px; }
.clip-body .dom { font-size: 12px; color: var(--text-3); margin-top: 8px; display: flex; gap: 6px; align-items: center; }
.post { padding: 16px 18px; }
.post .who { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.post .av { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(160deg, #8e8e93, #48484a); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; }
.post p { margin: 0; font-size: 16px; line-height: 1.45; }

/* inspector */
.ins-h { flex: none; padding: 10px 10px 6px; }
.ins-seg { display: flex; background: var(--field); border-radius: 9px; padding: 2px; }
.ins-seg button { flex: 1; height: 24px; border-radius: 7px; font-size: 12px; color: var(--text-2); display: flex; align-items: center; justify-content: center; gap: 4px; }
.ins-seg button[aria-checked="true"] { background: var(--control); color: var(--text); box-shadow: 0 1px 2px var(--shadow-soft); }
.ins-seg .n { font-size: 11px; color: var(--text-3); }
.ins-scroll { flex: 1; overflow: auto; padding: 4px 10px 14px; }
.ins-title { font-size: 14px; font-weight: 650; margin: 6px 4px 10px; line-height: 1.3; }
.grpbox { background: var(--window); border-radius: 10px; box-shadow: inset 0 0 0 .5px var(--sep); margin: 0 0 12px; overflow: hidden; }
.grpbox-h { font-size: 11px; font-weight: 600; color: var(--text-3); margin: 10px 4px 5px; display: flex; justify-content: space-between; align-items: center; }
.grpbox-h button { color: var(--accent); font-weight: 500; font-size: 11.5px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; font-size: 12.5px; align-items: center; }
.kv + .kv { border-top: .5px solid var(--sep); }
.kv .k { color: var(--text-2); }
.kv .v { text-align: right; display: flex; align-items: center; gap: 6px; min-width: 0; }
.kv .v span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.switch { width: 32px; height: 19px; border-radius: 10px; background: var(--field); position: relative; flex: none; box-shadow: inset 0 0 0 .5px var(--sep-strong); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"]::after { left: 15px; }
.popup { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; padding: 1px 4px 1px 8px; border-radius: 6px; background: var(--control); box-shadow: inset 0 0 0 .5px var(--sep-strong), 0 .5px 1px var(--shadow-soft); max-width: 160px; }
.popup span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow { display: flex; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; font-size: 12.5px; align-items: flex-start; }
.lrow + .lrow { border-top: .5px solid var(--sep); }
.lrow:hover { background: var(--hover); }
.lrow .i { color: var(--accent); margin-top: 1px; }
.lrow small { display: block; color: var(--text-3); font-size: 11.5px; margin-top: 1px; }
.lrow .ctx { display: block; color: var(--text-2); font-size: 12px; margin-top: 2px; }
.bcard { display: block; width: 100%; text-align: left; background: var(--window); border-radius: 12px; padding: 10px 11px; margin: 0 0 8px;
  box-shadow: inset 0 0 0 .5px var(--sep), 0 1px 2px var(--shadow-soft); position: relative; }
.bcard:hover, .bcard.hot { box-shadow: inset 0 0 0 1.5px var(--accent-line), 0 2px 8px var(--shadow-soft); }
.bcard .bq { font-weight: 600; font-size: 12.5px; line-height: 1.35; margin-bottom: 4px; }
.bcard .anc { font-size: 11.5px; color: var(--text-2); border-left: 2px solid var(--yellow); padding-left: 7px; margin: 0 0 6px; }
.bcard .prev { font-size: 12px; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.bcard .bmeta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-3); margin-top: 6px; }
.bcard .bmeta .mono { width: 16px; height: 16px; font-size: 7.5px; border-radius: 4px; }
.bcard .bmeta .stop-l { margin-left: auto; color: var(--red); font-size: 11.5px; }
.tip { font-size: 12px; color: var(--text-3); padding: 4px 4px 10px; line-height: 1.45; }
.bdraft { background: var(--window); border-radius: 12px; padding: 10px; margin: 0 0 12px; box-shadow: inset 0 0 0 1.5px var(--accent-line); }
.bdraft .anc { font-size: 12px; color: var(--text-2); border-left: 3px solid var(--yellow); padding: 2px 0 2px 8px; margin-bottom: 8px; }
.bdraft textarea { width: 100%; border: 0; resize: none; background: var(--field); border-radius: 8px; padding: 7px 9px; font-size: 13px; min-height: 58px; }
.bdraft .acts { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
.bdraft .acts .sp { flex: 1; }

/* outline (list view) */
.ov { flex: 1; overflow: auto; }
.ov-table { min-width: 620px; }
.ov-head { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: minmax(260px, 1fr) 110px 150px 150px; background: var(--window);
  border-bottom: .5px solid var(--sep); font-size: 11.5px; color: var(--text-2); }
.ov-head div { padding: 5px 10px; border-left: .5px solid var(--sep); }
.ov-head div:first-child { border-left: 0; padding-left: 16px; }
.ov-head .sorted { font-weight: 600; color: var(--text); }
.ov-rows { outline: none; padding: 0 0 20px; }
.ov-row { display: grid; grid-template-columns: minmax(260px, 1fr) 110px 150px 150px; height: 26px; align-items: center; font-size: 13px; position: relative; margin: 0 6px; border-radius: 6px; }
.ov-row:nth-child(even) { background: var(--row-alt); }
.ov-row.on { background: var(--accent) !important; color: #fff; }
.ov-row.on .c2, .ov-row.on .c3, .ov-row.on .c4, .ov-row.on .i { color: #fff !important; }
.ov-rows:not(:focus-within) .ov-row.on { background: var(--sel) !important; color: var(--text); }
.ov-rows:not(:focus-within) .ov-row.on .c2, .ov-rows:not(:focus-within) .ov-row.on .c3, .ov-rows:not(:focus-within) .ov-row.on .c4 { color: var(--text-2) !important; }
.ov-rows:not(:focus-within) .ov-row.on .i { color: var(--accent) !important; }
.ov-row .c1 { display: flex; align-items: center; gap: 5px; padding-left: calc(10px + var(--d) * 18px); min-width: 0; }
.ov-row .c1 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ov-row .c1 .i { color: var(--accent); }
.ov-row .c2, .ov-row .c3, .ov-row .c4 { padding: 0 10px; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 5px; align-items: center; }
.ov-row .tri { height: 20px; width: 16px; }
.ov-row .grip { position: absolute; left: -2px; color: var(--text-4); opacity: 0; }
.ov-row:hover .grip { opacity: 1; }
.ov-row.drop-before::after { content: ""; position: absolute; left: calc(26px + var(--d) * 18px); right: 0; top: -1px; height: 2px; background: var(--accent); border-radius: 1px; }
.ov-row.drop-into { box-shadow: inset 0 0 0 2px var(--accent); }
.ov-row .wlx { color: var(--accent); }
.ov-foot { position: sticky; bottom: 0; font-size: 11.5px; color: var(--text-3); padding: 5px 16px; border-top: .5px solid var(--sep); background: var(--window); display: flex; gap: 14px; }

/* columns */
.cols { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; }
.col { width: 230px; flex: none; border-right: .5px solid var(--sep); overflow: auto; padding: 6px; }
.col-item { display: flex; align-items: center; gap: 7px; width: 100%; height: 26px; padding: 0 6px 0 8px; border-radius: 6px; text-align: left; font-size: 13px; }
.col-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-item .i { color: var(--accent); }
.col-item .chev { color: var(--text-3); }
.col-item:hover { background: var(--hover); }
.col-item.on { background: var(--sel); }
.col.active .col-item.on { background: var(--accent); color: #fff; }
.col.active .col-item.on .i { color: #fff; }
.col-prev { flex: 1; min-width: 300px; overflow: auto; padding: 22px 26px; }
.qlook h2 { font-size: 17px; margin: 10px 0 4px; line-height: 1.3; }
.qlook .meta { font-size: 12px; color: var(--text-3); margin-bottom: 14px; }
.qlook .big-ic { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.qlook .excerpt { font-size: 13px; line-height: 1.55; color: var(--text-2); }
.qlook .excerpt p { margin: 0 0 8px; }
.qlook .kvs { margin: 14px 0; }

/* map */
.mapwrap { flex: 1; position: relative; overflow: hidden; background: var(--canvas); }
.map-scroll { position: absolute; inset: 0; overflow: auto; background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1.2px); background-size: 20px 20px; }
.map-inner { position: relative; transform-origin: 0 0; }
.map-svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.frame { position: absolute; border-radius: 18px; background: var(--frame); box-shadow: inset 0 0 0 1px var(--sep); }
.frame span { position: absolute; top: -22px; left: 6px; font-size: 12px; font-weight: 600; color: var(--text-2); display: flex; gap: 5px; align-items: center; }
.frame span .i { color: var(--accent); }
.mn { position: absolute; width: 220px; border-radius: 14px; background: var(--window); padding: 10px 12px; text-align: left;
  box-shadow: 0 0 0 .5px var(--sep-strong), 0 3px 10px var(--shadow-soft); font-size: 12px; touch-action: none; user-select: none; }
.mn:hover { box-shadow: 0 0 0 1px var(--accent-line), 0 4px 14px var(--shadow-soft); }
.mn.on { box-shadow: 0 0 0 2.5px var(--accent), 0 6px 18px var(--shadow-soft); }
.mn .mt { font-weight: 650; font-size: 12.5px; line-height: 1.3; display: flex; gap: 7px; align-items: flex-start; }
.mn .mt .mono { width: 18px; height: 18px; font-size: 8px; border-radius: 5px; margin-top: 1px; }
.mn .ms { color: var(--text-3); font-size: 11px; margin-top: 6px; display: flex; gap: 5px; align-items: center; }
.mn.sticky { background: var(--sticky); color: var(--sticky-text); border-radius: 4px; box-shadow: 0 0 0 .5px var(--sticky-border), 0 6px 14px var(--shadow-soft); transform: rotate(-.6deg); width: 200px; }
.mn.sticky.on { box-shadow: 0 0 0 2.5px var(--accent), 0 6px 14px var(--shadow-soft); }
.mn.sticky ul { margin: 6px 0 0; padding-left: 14px; font-size: 11.5px; line-height: 1.4; }
.mn.hlnode { width: auto; max-width: 220px; background: var(--hl); border-radius: 8px; font-style: italic; font-size: 12px; padding: 6px 10px; box-shadow: none; }
.mn.hlnode.on { box-shadow: 0 0 0 2.5px var(--accent); }
.mn.clipnode .mt .i { color: var(--accent); }
.map-tools { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 3; }
.map-zoom { position: absolute; right: 14px; bottom: 14px; z-index: 3; }
.map-zoom .zl { font-size: 12px; min-width: 44px; text-align: center; color: var(--text-2); font-variant-numeric: tabular-nums; }
.map-legend { position: absolute; left: 14px; bottom: 14px; z-index: 3; padding: 8px 12px; border-radius: 12px; font-size: 11.5px; color: var(--text-2); display: grid; gap: 4px; }
.map-legend div { display: flex; gap: 8px; align-items: center; }
.edge { fill: none; stroke-width: 1.6; }
.edge.branch { stroke: var(--accent); }
.edge.link { stroke: var(--purple); stroke-dasharray: 5 4; }
.edge.hlx { stroke: var(--yellow); stroke-width: 2.2; stroke-dasharray: 1 4; stroke-linecap: round; }
.edge.cite { stroke: var(--gray); stroke-dasharray: 2 3; }
.edge.dim { opacity: .25; }
.mn.dim { opacity: .5; }
.map-tools .t { display: inline !important; }
@media (max-width: 760px) { .map-tools .t { display: none !important; } }

/* popovers, menus, sheets */
.popover { position: fixed; z-index: 80; min-width: 200px; max-width: 340px; padding: 5px; border-radius: 12px; background: var(--popover);
  backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);
  box-shadow: 0 0 0 .5px var(--sep-strong), 0 10px 32px var(--shadow); font-size: 13px; }
.mi { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; height: 24px; padding: 0 10px 0 8px; border-radius: 6px; white-space: nowrap; }
.mi .ck { width: 12px; flex: none; color: inherit; }
.mi .lbl { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.mi kbd { margin-left: 18px; }
.mi:hover:not(:disabled), .mi.kb { background: var(--accent); color: #fff; }
.mi:hover:not(:disabled) kbd, .mi.kb kbd, .mi:hover:not(:disabled) .msub, .mi.kb .msub { color: rgba(255,255,255,.8); }
.mi:disabled { color: var(--text-4); }
.mi .msub { font-size: 11px; color: var(--text-3); }
.msep { height: 0; border-top: .5px solid var(--sep-strong); margin: 5px 8px; }
.mhead { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 4px 10px 2px; }
#selpop { position: fixed; z-index: 75; display: flex; gap: 2px; padding: 4px; border-radius: 12px; background: var(--popover);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); box-shadow: 0 0 0 .5px var(--sep-strong), 0 8px 24px var(--shadow); }
#selpop[hidden] { display: none; }
#selpop button { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 8px; font-size: 12.5px; }
#selpop button:hover { background: var(--accent); color: #fff; }
#selpop button:hover kbd { color: rgba(255,255,255,.8); }
#gutter { position: absolute; z-index: 4; width: 24px; height: 24px; border-radius: 7px; display: none; place-items: center; color: var(--text-3); background: var(--window); box-shadow: 0 0 0 .5px var(--sep-strong), 0 1px 3px var(--shadow-soft); }
#gutter.on { display: grid; }
#gutter:hover { color: var(--accent); }
.sheet-wrap { position: fixed; inset: 24px 0 0 0; z-index: 90; display: flex; justify-content: center; align-items: flex-start; background: rgba(0,0,0,.12); }
.sheet-wrap[hidden] { display: none; }
.sheet { margin-top: 40px; width: min(580px, calc(100vw - 24px)); max-height: calc(100vh - 110px); overflow: auto; border-radius: 18px; background: var(--window);
  box-shadow: 0 0 0 .5px var(--sep-strong), 0 24px 60px var(--shadow); padding: 20px 22px 18px; animation: sheetin .22s ease-out; }
@keyframes sheetin { from { transform: translateY(-14px); opacity: 0; } }
.sheet h2 { margin: 0 0 4px; font-size: 17px; }
.sheet .sub { color: var(--text-2); font-size: 12.5px; margin: 0 0 14px; }
.sheet-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.btn { height: 28px; padding: 0 14px; border-radius: 14px; font-size: 13px; background: var(--control); box-shadow: inset 0 0 0 .5px var(--sep-strong), 0 .5px 1px var(--shadow-soft); display: inline-flex; align-items: center; gap: 6px; }
.btn.def { background: var(--accent); color: #fff; box-shadow: none; }
.btn.big { height: 32px; padding: 0 16px; border-radius: 16px; }
.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; background: var(--code); padding: 2px 6px; border-radius: 5px; }

<h3>SEI growth</h3>
<p>The solid–electrolyte interphase (SEI) on the graphite anode thickens continuously and consumes cyclable lithium. Its growth rate depends on anode potential: a fully lithiated anode sits near 0.1 V vs Li/Li⁺, where electrolyte reduction is fastest. <mark class="hl" data-hl="h1">SEI growth accelerates above ~80% SOC</mark><button class="bm" data-act="marker" data-id="b1" title="Branch: Is calendar or cycle aging dominant for a 4-hour peaker?"><svg class="i" width="12" height="12" viewBox="0 0 24 24"><circle cx="7" cy="5.5" r="2"/><circle cx="7" cy="18.5" r="2"/><circle cx="17" cy="7.5" r="2"/><path d="M7 7.5v9M17 9.5c0 4.5-10 2.5-10 7"/></svg>1</button>, which is why storage at 100% SOC loses capacity roughly twice as fast as storage at 50% (Schimpe et al. 2018).</p>
<h3>Lithium plating</h3>
<p>At high SOC the anode has little intercalation headroom left. Charging into that region, especially below 15 °C or above about 0.5C, can deposit metallic lithium on the graphite surface instead of intercalating it. Part of the plated lithium re-intercalates during rest; the rest is lost and seeds further SEI growth.</p>
<h3>Calendar vs cycle aging</h3>
<p>For stationary storage with fewer than one full cycle per day, calendar aging is usually the larger term over a 15–20 year life. The SOC at which a system idles therefore matters more than how many cycles it performs. Typical capacity fade at 25 °C by idle SOC band:</p>
<table><thead><tr><th>SOC band</th><th>Capacity fade per year at 25 °C</th></tr></thead><tbody><tr><td>0–30%</td><td>1.1%</td></tr><tr><td>30–70%</td><td>1.6%</td></tr><tr><td>70–100%</td><td>2.9%</td></tr></tbody></table>
<p>The LFP voltage curve is flat between roughly 20% and 90% SOC, so cell voltage is a poor SOC estimate in that range. Battery management systems that drift toward the top of the window without recalibration spend more time above 80% than their setpoints indicate.</p>
<p>In practice, operators that park fleets at 50–60% SOC between dispatch events and charge shortly before the evening ramp reduce calendar fade by about a third relative to fleets held full (NREL ATB 2026). Most of the remaining spread between sites is explained by cell temperature, which this answer does not cover.</p>`;
const F1_HTML = `<p>Lithium iron phosphate cells used in grid storage lose capacity faster when held at high state of charge, mainly because the graphite anode's low potential accelerates growth of the solid–electrolyte interphase, which consumes cyclable lithium, and because charging into a nearly full anode risks lithium plating. For stationary systems that cycle less than once per day, calendar aging dominates over a 15–20 year life, so <mark class="hl" data-hl="h2">the idle SOC window — not cycle count — is the main operational lever on degradation</mark>, with fade rising from about 1.1% per year at 0–30% SOC to 2.9% at 70–100% SOC at 25 °C.</p>`;
const B1_HTML = `<p>Calendar aging. A 4-hour peaker typically runs 200–300 equivalent full cycles per year, below the ~365 assumed in most warranty models. At that throughput, cycle fade for LFP is about 0.5–0.8% per year, while calendar fade at a 60–90% idle SOC is 1.6–2.9% per year at 25 °C.</p><p>Cycle aging becomes comparable only above roughly 1.5 cycles per day, or when the site sees sustained cell temperatures above 35 °C.</p>`;

const mapDrag = { id: null, moved: false };
document.addEventListener("pointerdown", (e) => {
  const mn = e.target.closest("[data-mn]"); mapDrag.moved = false;
  if (!mn || e.button !== 0) return;
  mapDrag.id = mn.dataset.mn; mapDrag.sx = e.clientX; mapDrag.sy = e.clientY; mapDrag.ox = MAPN[mapDrag.id][0]; mapDrag.oy = MAPN[mapDrag.id][1]; mapDrag.el = mn;
});
document.addEventListener("pointermove", (e) => {
  if (!mapDrag.id) return; const dx = (e.clientX - mapDrag.sx) / S.zoom, dy = (e.clientY - mapDrag.sy) / S.zoom;
  if (Math.abs(dx) + Math.abs(dy) > 3) mapDrag.moved = true;
  if (!mapDrag.moved) return;
  MAPN[mapDrag.id] = [Math.max(0, mapDrag.ox + dx), Math.max(0, mapDrag.oy + dy)];
  mapDrag.el.style.left = MAPN[mapDrag.id][0] + "px"; mapDrag.el.style.top = MAPN[mapDrag.id][1] + "px"; drawEdges();
});
document.addEventListener("pointerup", () => { mapDrag.id = null; setTimeout(() => (mapDrag.moved = false), 0); });

/* keyboard */
document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey; const k = e.key; const t = e.target;
  const typing = t.isContentEditable || t.tagName === "TEXTAREA" || t.tagName === "INPUT";
  // open quickly sheet
  if ($("#qoi") && !$("#sheet").hidden) {
    if (k === "ArrowDown" || k === "ArrowUp") { e.preventDefault(); qoSel = (qoSel + (k === "ArrowDown" ? 1 : -1) + qoRows.length) % Math.max(1, qoRows.length); qoDraw(); return; }
    if (k === "Enter") { e.preventDefault(); const r = qoRows[qoSel]; closeSheet(); if (r) r.a(); return; }
  }
  if (k === "Escape") { if (wlPop.open) { wlClose(); return; } if (!$("#pop").hidden) { closePop(); return; } if (!$("#sheet").hidden) { closeSheet(); return; } if (!$("#selpop").hidden) { hideSel(); return; } if (S.branchDraft) { S.branchDraft = null; renderInsp(); return; } if ($("#win").classList.contains("drawer")) { $("#win").classList.remove("drawer"); return; } }
  // menus keyboard nav
  if (!$("#pop").hidden && !wlPop.open && (k === "ArrowDown" || k === "ArrowUp")) { const ms = $$("#pop .mi:not(:disabled)"); if (ms.length) { e.preventDefault(); let i = ms.indexOf(document.activeElement); i = (i + (k === "ArrowDown" ? 1 : -1) + ms.length) % ms.length; ms[i].focus(); } return; }
  // selection popover keys
  if (!$("#selpop").hidden && !mod && !typing) { const m = { h: selHighlight, b: selBranch, n: () => { const r = selSaved.r.getBoundingClientRect(); hideSel(); addToNoteMenu(r, selSaved.text, selSaved.ans.dataset.answer); }, c: () => { hideSel(); toast("Copied passage"); } }[k.toLowerCase()]; if (m) { e.preventDefault(); m(); return; } }
  if (t.dataset && t.dataset.composer && mod && k === "Enter") { e.preventDefault(); sendFrom(t.dataset.composer, e.shiftKey); return; }
  if (t.dataset && t.dataset.bdraft && (k === "Enter" && (mod || !e.shiftKey))) { e.preventDefault(); sendBranch(); return; }
  if (t.classList && t.classList.contains("bt") && t.dataset.b) { bulletKey(e, t); if (e.defaultPrevented) return; }
  if (t.dataset && t.dataset.title && k === "Enter") { e.preventDefault(); const it = I[t.dataset.title]; if (it.bullets[0]) focusBullet(it.bullets[0]); return; }
  if (mod) {
    const key = k.toLowerCase();
    if (key === "k" || (key === "o" && e.shiftKey)) { e.preventDefault(); openQuick(); return; }
    if (key === "o") { e.preventDefault(); ACT.wsMenu($(".ws-btn") || $("#toolbar")); return; }
    if (key === "n" && e.shiftKey) { e.preventDefault(); newNote(); return; }
    if (key === "n" && e.altKey) { e.preventDefault(); newFolder(); return; }
    if (key === "n") { e.preventDefault(); newChat(); return; }
    if (key === "f") { e.preventDefault(); focusSearch(); return; }
    if (key === "," ) { e.preventDefault(); openSettings(); return; }
    if (["1", "2", "3", "4"].includes(k)) { e.preventDefault(); setView(["page", "outline", "columns", "map"][+k - 1]); return; }
    if ((key === "i" || e.code === "KeyI") && e.altKey) { e.preventDefault(); toggleInsp(); return; }
    if (key === "s" && e.ctrlKey && e.metaKey) { e.preventDefault(); toggleSidebar(); return; }
    if (k === "[") { e.preventDefault(); goBack(); return; }
    if (k === "]") { e.preventDefault(); goFwd(); return; }
  }
  if (typing) return;
  // outline keyboard
  if (S.view === "outline" && t.closest && t.closest("#ovrows")) {
    const rows = $$(".ov-row").map((r) => r.dataset.row); let i = rows.indexOf(S.sel);
    if (k === "ArrowDown") { e.preventDefault(); ovSelect(rows[Math.min(rows.length - 1, i + 1)] || rows[0]); }
    else if (k === "ArrowUp") { e.preventDefault(); ovSelect(rows[Math.max(0, i - 1)] || rows[0]); }
    else if (k === "ArrowRight" && S.sel) { e.preventDefault(); if (kids(S.sel).length && !S.exp.has(S.sel)) ovToggle(S.sel, true); }
    else if (k === "ArrowLeft" && S.sel) { e.preventDefault(); if (S.exp.has(S.sel)) ovToggle(S.sel, false); else { const row = $(`.ov-row[data-row="${CSS.escape(S.sel)}"]`); const d = +row.style.getPropertyValue("--d"); for (let j = i - 1; j >= 0; j--) { const r2 = $(`.ov-row[data-row="${CSS.escape(rows[j])}"]`); if (+r2.style.getPropertyValue("--d") < d) { ovSelect(rows[j]); break; } } } }
    else if (k === " ") { e.preventDefault(); if (S.sel) quickLook(S.sel); }
    else if (k === "Enter") { e.preventDefault(); if (S.sel) openNode(S.sel); }
    return;
  }
  if (S.view === "columns" && t.closest && t.closest(".cols")) {
    const ci = t.dataset.ci != null ? +t.dataset.ci : S.colPath.length - 1;
    const cur = S.colPath[ci]; const parentId = ci === 0 ? "ROOT" : S.colPath[ci - 1]; const sibs = kids(parentId); const i = sibs.indexOf(cur);
    const pick = (id, c) => { S.colPath = S.colPath.slice(0, c).concat(id); S.sel = id; if (I[id]) S.item = id; renderColumns(); renderInsp(); const b = $(`.col-item[data-id="${CSS.escape(id)}"]`); if (b) b.focus(); };
    if (k === "ArrowDown" && i < sibs.length - 1) { e.preventDefault(); pick(sibs[i + 1], ci); }
    else if (k === "ArrowUp" && i > 0) { e.preventDefault(); pick(sibs[i - 1], ci); }
    else if (k === "ArrowRight") { e.preventDefault(); const kk = kids(cur); if (kk.length) pick(kk[0], ci + 1); }
    else if (k === "ArrowLeft" && ci > 0) { e.preventDefault(); pick(S.colPath[ci - 1], ci - 1); }
    else if (k === " ") { e.preventDefault(); quickLook(cur); }
    else if (k === "Enter") { e.preventDefault(); openNode(cur); }
  }
});
document.addEventListener("focusout", (e) => { const t = e.target; if (t.classList && t.classList.contains("bt")) setTimeout(() => { if (wlPop.open && !document.activeElement.closest("#pop")) wlClose(); }, 120); });

/* ============ standalone variant switcher ============ */
function renderVSwitch() {
  if (parent !== window) return;
  const v = $("#vswitch"); v.hidden = false;
  const cur = document.documentElement.dataset.variant;
  v.innerHTML = `<span style="padding:0 6px;color:var(--text-3)">Variant</span>` + MOCK.variants.map((x) => `<button aria-pressed="${cur === x.id}" title="${esc(x.summary)}" onclick="setVariant('${x.id}')">${x.id.toUpperCase()}<span class="vl"> · ${esc(x.label)}</span></button>`).join("");
}

  log: [["web_fetch", "doi.org/10.1016/j.jpowsour.2024.234101"], ["web_fetch", "nrel.gov/docs/fy26osti/sodium-ion-review.pdf"], ["read_file", "notes/chapter-3-outline.md"], ["web_fetch", "faradion.co.uk/technical-notes"], ["read_file", "sources/schimpe-2018.pdf"], ["web_fetch", "catl.com/en/research/sodium-ion"]] });
if (parent !== window) parent.postMessage({ type: "mock:ready", mock: MOCK }, "*");
addEventListener("resize", () => { if (innerWidth <= 1080 && S.insp && S._autoInsp !== false) { } });
