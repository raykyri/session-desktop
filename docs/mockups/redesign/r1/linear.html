<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session · Linear-style</title>
<meta name="description" content="Influence: Linear. Investigations as status-tracked questions, notes as documents, typed links between them, keyboard-first.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --bg-app:#f4f4f6; --bg-panel:#ffffff; --bg-elev:#ffffff; --bg-sunken:#f7f7f9; --bg-group:#f6f6f8;
  --bg-hover:rgba(15,17,25,.045); --bg-active:rgba(15,17,25,.075); --bg-sel:rgba(94,106,210,.08);
  --border:#e6e6ea; --border-strong:#d7d7de; --border-soft:#eeeef1;
  --text:#1d1e22; --text-2:#55585f; --text-3:#8a8d95; --text-4:#aeb0b6;
  --accent:#5e6ad2; --accent-hover:#4f5bc4; --accent-text:#4652bf; --accent-soft:rgba(94,106,210,.11); --on-accent:#ffffff;
  --st-queued:#9a9ca4; --st-running:#d9a400; --st-ready:#3ea36f; --st-reviewed:#5e6ad2; --st-stopped:#a4a6ad;
  --red:#d24d4d; --orange:#e5822f;
  --hl:rgba(242,190,40,.28); --hl-border:rgba(214,160,0,.55);
  --shadow-pop:0 0 0 1px rgba(15,17,25,.07), 0 4px 10px rgba(15,17,25,.06), 0 18px 48px rgba(15,17,25,.14);
  --shadow-card:0 1px 2px rgba(15,17,25,.05), 0 0 0 1px var(--border);
  --scrim:rgba(15,17,25,.28);
  --grad-panel:linear-gradient(180deg, rgba(94,106,210,.035), rgba(94,106,210,0) 220px);
  --edge:#c3c5cc; --node-note:#8a8d95;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg-app:#08090a; --bg-panel:#0f1012; --bg-elev:#17181b; --bg-sunken:#0b0c0e; --bg-group:#141518;
    --bg-hover:rgba(255,255,255,.045); --bg-active:rgba(255,255,255,.075); --bg-sel:rgba(113,122,240,.12);
    --border:#202126; --border-strong:#2c2d33; --border-soft:#1a1b1f;
    --text:#f2f3f5; --text-2:#b3b5bc; --text-3:#7e818a; --text-4:#5b5e66;
    --accent:#5e6ad2; --accent-hover:#6c78e0; --accent-text:#9aa2f5; --accent-soft:rgba(113,122,240,.16); --on-accent:#ffffff;
    --st-queued:#7d8089; --st-running:#f2c94c; --st-ready:#4cb782; --st-reviewed:#717af0; --st-stopped:#6c6f77;
    --red:#eb5757; --orange:#f2994a;
    --hl:rgba(242,201,76,.20); --hl-border:rgba(242,201,76,.55);
    --shadow-pop:0 0 0 1px rgba(255,255,255,.07), 0 6px 14px rgba(0,0,0,.35), 0 24px 60px rgba(0,0,0,.5);
    --shadow-card:0 0 0 1px var(--border);
    --scrim:rgba(0,0,0,.5);
    --grad-panel:linear-gradient(180deg, rgba(113,122,240,.055), rgba(113,122,240,0) 260px);
    --edge:#3a3c43; --node-note:#7e818a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-app:#08090a; --bg-panel:#0f1012; --bg-elev:#17181b; --bg-sunken:#0b0c0e; --bg-group:#141518;
  --bg-hover:rgba(255,255,255,.045); --bg-active:rgba(255,255,255,.075); --bg-sel:rgba(113,122,240,.12);
  --border:#202126; --border-strong:#2c2d33; --border-soft:#1a1b1f;
  --text:#f2f3f5; --text-2:#b3b5bc; --text-3:#7e818a; --text-4:#5b5e66;
  --accent:#5e6ad2; --accent-hover:#6c78e0; --accent-text:#9aa2f5; --accent-soft:rgba(113,122,240,.16); --on-accent:#ffffff;
  --st-queued:#7d8089; --st-running:#f2c94c; --st-ready:#4cb782; --st-reviewed:#717af0; --st-stopped:#6c6f77;
  --red:#eb5757; --orange:#f2994a;
  --hl:rgba(242,201,76,.20); --hl-border:rgba(242,201,76,.55);
  --shadow-pop:0 0 0 1px rgba(255,255,255,.07), 0 6px 14px rgba(0,0,0,.35), 0 24px 60px rgba(0,0,0,.5);
  --shadow-card:0 0 0 1px var(--border);
  --scrim:rgba(0,0,0,.5);
  --grad-panel:linear-gradient(180deg, rgba(113,122,240,.055), rgba(113,122,240,0) 260px);
  --edge:#3a3c43; --node-note:#7e818a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg-app);color:var(--text);font:13px/1.45 var(--font);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:5px}
kbd{font:500 10.5px/1 var(--font);color:var(--text-3);background:var(--bg-sunken);border:1px solid var(--border);border-bottom-width:1.5px;border-radius:4px;padding:2px 4px;min-width:17px;display:inline-flex;align-items:center;justify-content:center;gap:2px}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
svg.i.s14{width:14px;height:14px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--text-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;min-height:0}
.sb{width:248px;flex:none;display:flex;flex-direction:column;padding:0 8px 10px 10px;overflow-y:auto;overflow-x:hidden}
.traffic{height:38px;display:flex;align-items:center;gap:8px;padding-left:4px;flex:none}
.traffic i{width:12px;height:12px;border-radius:50%;display:block;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}
.ws-row{display:flex;align-items:center;gap:2px;margin-bottom:8px}
.ws-btn{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:30px;padding:0 6px;border-radius:6px;font-weight:600}
.ws-btn:hover,.icon-btn:hover{background:var(--bg-hover)}
.ws-logo{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#6d78e3,#4451b8);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;flex:none}
.ws-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--text-2);flex:none}
.icon-btn.boxed{border:1px solid var(--border);background:var(--bg-elev);box-shadow:0 1px 1px rgba(0,0,0,.03)}
.nav-row{display:flex;align-items:center;gap:9px;height:28px;padding:0 8px;border-radius:6px;color:var(--text-2);font-weight:500;width:100%;text-align:left;position:relative}
.nav-row:hover{background:var(--bg-hover);color:var(--text)}
.nav-row.on{background:var(--bg-active);color:var(--text)}
.nav-row .i{color:var(--text-3)}
.nav-row.on .i{color:var(--text-2)}
.nav-row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-row .count{font-size:11.5px;color:var(--text-3);font-weight:500}
.nav-row .badge{background:var(--accent);color:var(--on-accent);font-size:10.5px;font-weight:600;border-radius:9px;padding:0 6px;line-height:16px}
.nav-row .gk{display:none}
.sb.cmd-held .nav-row .gk{display:inline-flex}
.sec{margin-top:16px}
.sec-h{display:flex;align-items:center;gap:4px;height:24px;padding:0 8px;font-size:11.5px;font-weight:500;color:var(--text-3)}
.sec-h .sp{flex:1}
.sec-h button{color:var(--text-3);width:20px;height:20px;border-radius:4px;display:grid;place-items:center;opacity:0}
.sec:hover .sec-h button,.sec-h button:focus-visible{opacity:1}
.sec-h button:hover{background:var(--bg-hover);color:var(--text)}
.proj-ico{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;flex:none}
.proj-sub{padding-left:20px;display:none}
.proj.open .proj-sub{display:block}
.proj .chev{transition:transform .12s;color:var(--text-3)}
.proj.open .chev{transform:rotate(90deg)}
.agent-dot{width:7px;height:7px;border-radius:50%;flex:none}
.sb-foot{margin-top:auto;padding-top:14px}
.start-card{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--bg-panel);border-radius:8px;padding:10px 10px 11px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.start-card:hover{border-color:var(--border-strong)}
.start-card .t{font-weight:600;display:flex;align-items:center;gap:6px}
.start-card .s{font-size:12px;color:var(--text-3);margin-top:2px}
.prog{height:4px;border-radius:2px;background:var(--bg-active);margin-top:8px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.foot-row{display:flex;align-items:center;gap:6px;margin-top:8px;color:var(--text-3);font-size:12px;padding:0 2px}
.foot-row .sp{flex:1}

.panel{flex:1;min-width:0;margin:8px 8px 8px 0;background:var(--bg-panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.top{height:46px;flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 16px;border-bottom:1px solid var(--border)}
.top .crumb{display:flex;align-items:center;gap:6px;min-width:0;font-weight:500;color:var(--text-2)}
.top .crumb b{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb button:hover{color:var(--text)}
.top .crumb .sep{color:var(--text-4)}
.top .sp{flex:1}
.menu-btn{display:none}
.tabs{display:flex;gap:2px;margin-left:8px}
.tab{height:26px;padding:0 10px;border-radius:6px;font-weight:500;color:var(--text-2);border:1px solid transparent;white-space:nowrap}
.tab:hover{background:var(--bg-hover);color:var(--text)}
.tab.on{background:var(--bg-elev);border-color:var(--border-strong);color:var(--text);box-shadow:0 1px 1px rgba(0,0,0,.04)}
.btn{height:28px;padding:0 10px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font-weight:500;color:var(--text-2);border:1px solid var(--border);background:var(--bg-elev);white-space:nowrap}
.btn:hover{color:var(--text);border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:0 1px 2px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--bg-hover)}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn kbd{background:transparent}
.btn.primary kbd{color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.25)}
#content:focus{outline:none}
.content{flex:1;overflow:auto;position:relative;min-height:0;background:var(--grad-panel)}

/* ---------- status icons & chips ---------- */
.st{display:inline-grid;place-items:center;width:14px;height:14px;flex:none}
.st svg{width:14px;height:14px;display:block}
.st.running svg .pie{animation:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;border-radius:11px;border:1px solid var(--border);font-size:12px;color:var(--text-2);white-space:nowrap;background:var(--bg-panel)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.av{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:8.5px;font-weight:700;color:#fff;flex:none;letter-spacing:0}
.av.lg{width:22px;height:22px;font-size:9.5px}
.av.you{background:linear-gradient(135deg,#8b93a5,#5b6272)}
.mention{display:inline-flex;align-items:center;gap:5px;padding:0 6px 0 4px;height:21px;border-radius:5px;background:var(--bg-hover);border:1px solid var(--border);font-size:12.5px;font-weight:500;color:var(--text);vertical-align:1px;cursor:pointer;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mention:hover{border-color:var(--border-strong);background:var(--bg-active)}
.mention .mid{color:var(--text-3);font-weight:500}

/* ---------- list ---------- */
.list-wrap{position:relative}
.ghead{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px 0 22px;background:var(--bg-group);border-bottom:1px solid var(--border-soft);position:sticky;top:0;z-index:2;font-weight:500}
.ghead .n{color:var(--text-3);font-weight:500}
.ghead .sp{flex:1}
.ghead .add{opacity:.0;color:var(--text-3);width:24px;height:24px;border-radius:5px;display:grid;place-items:center}
.ghead:hover .add,.ghead .add:focus-visible{opacity:1}
.ghead .add:hover{background:var(--bg-hover);color:var(--text)}
.ghead .gchev{color:var(--text-3);margin-left:-14px;transition:transform .12s}
.grp.collapsed .ghead .gchev{transform:rotate(-90deg)}
.grp.collapsed .rows{display:none}
.row{display:flex;align-items:center;gap:10px;height:39px;padding:0 16px 0 22px;border-bottom:1px solid var(--border-soft);cursor:default;position:relative;outline:none}
.row:hover{background:var(--bg-hover)}
.row.sel{background:var(--bg-sel)}
.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.row .rid{width:54px;flex:none;color:var(--text-3);font-size:12px;font-variant-numeric:tabular-nums}
.row .rt{flex:1;min-width:110px;display:flex;align-items:center;gap:8px}
.row .rt .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.row .meta{display:flex;align-items:center;gap:8px;flex:none}
.row .upd{width:62px;text-align:right;color:var(--text-3);font-size:12px}
.row .subs{display:inline-flex;align-items:center;gap:3px;color:var(--text-3);font-size:12px;flex:none}
.runline{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--st-running);font-variant-numeric:tabular-nums;flex:none}
.queueline{font-size:12px;color:var(--text-3);flex:none}
.row .sub-indent{width:14px;flex:none;color:var(--text-4)}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 24px;color:var(--text-2)}
svg.art{width:120px;height:84px;margin-bottom:18px;display:block;margin-left:auto;margin-right:auto}
.empty h3{margin:0 0 6px;font-size:15px;font-weight:600;color:var(--text)}
.empty p{margin:0 0 18px;max-width:380px;color:var(--text-3)}
.empty .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* board */
.board{display:flex;gap:10px;padding:14px 16px;min-height:100%;align-items:flex-start;overflow-x:auto}
.col{width:268px;flex:none;display:flex;flex-direction:column;gap:6px}
.col-h{display:flex;align-items:center;gap:8px;height:30px;padding:0 4px;font-weight:500}
.col-h .n{color:var(--text-3)}
.card{background:var(--bg-elev);border-radius:8px;padding:10px 11px;box-shadow:var(--shadow-card);cursor:default;text-align:left;width:100%}
.card:hover{box-shadow:0 0 0 1px var(--border-strong),0 2px 6px rgba(0,0,0,.05)}
.card.sel{box-shadow:0 0 0 1.5px var(--accent)}
.card .c1{display:flex;align-items:center;justify-content:space-between;color:var(--text-3);font-size:12px;margin-bottom:4px}
.card .c2{display:flex;gap:8px;align-items:flex-start;font-weight:500;line-height:1.4}
.card .c3{display:flex;gap:6px;align-items:center;margin-top:9px;flex-wrap:wrap}

/* ---------- issue (question) page ---------- */
.issue{display:flex;min-height:100%}
.issue-main{flex:1;min-width:0;padding:28px 40px 0 48px;display:flex;flex-direction:column}
.issue-col{max-width:740px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column}
.issue-side{width:268px;flex:none;border-left:1px solid var(--border);padding:14px 16px 24px;background:var(--bg-panel);overflow:auto}
.issue h1{font-size:21px;line-height:1.3;font-weight:600;letter-spacing:-.018em;margin:0 0 8px}
.qmeta{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:12.5px;flex-wrap:wrap}
.parent-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-3);font-size:12.5px;margin-bottom:10px}
.parent-link button:hover{color:var(--text)}
.quote{border-left:2px solid var(--hl-border);padding:2px 0 2px 12px;margin:12px 0 0;color:var(--text-2);font-size:13.5px}
.runbar{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-sunken);margin:18px 0 0;font-size:12.5px;flex-wrap:wrap}
.runbar .sp{flex:1}
.runbar .lbl{font-weight:600}
.runbar .lbl.run{color:var(--st-running)}
.runbar details{width:100%}
.tools{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-family:var(--mono);font-size:11.5px;color:var(--text-2)}
.tools li{display:flex;gap:8px;align-items:center}
.tools li .ok{color:var(--st-ready)}
.tools li .t{color:var(--text-4);margin-left:auto}
summary{cursor:pointer;color:var(--text-3);list-style:none;display:inline-flex;align-items:center;gap:4px}
summary::-webkit-details-marker{display:none}
summary:hover{color:var(--text)}
.answer{font-size:14.5px;line-height:1.68;color:var(--text);margin-top:18px;position:relative}
.answer p{margin:0 0 14px;position:relative}
.answer h4{font-size:13px;margin:22px 0 8px;font-weight:600;color:var(--text-2)}
.answer table{border-collapse:collapse;font-size:13px;margin:4px 0 16px;width:100%;max-width:440px}
.answer th,.answer td{border-bottom:1px solid var(--border);text-align:left;padding:6px 10px 6px 0;font-variant-numeric:tabular-nums}
.answer th{font-weight:500;color:var(--text-3);font-size:12px}
.answer sup{font-size:10px;color:var(--accent-text);font-weight:600;margin-left:1px}
.answer .caret{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;margin-left:2px;border-radius:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
mark.hl{background:var(--hl);color:inherit;border-bottom:1.5px solid var(--hl-border);border-radius:2px;padding:0 1px}
.anchor-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--text-2);background:var(--bg-elev);border:1px solid var(--border);border-radius:10px;height:19px;padding:0 7px 0 5px;margin-left:5px;vertical-align:2px;line-height:1}
.anchor-chip:hover{border-color:var(--accent);color:var(--accent-text)}
.pgut{position:absolute;left:-34px;top:2px;width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--text-3);opacity:0;transition:opacity .1s}
.answer p:hover .pgut,.pgut:focus-visible{opacity:1}
.pgut:hover{background:var(--bg-hover);color:var(--text)}
.sources{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.sources li{display:flex;gap:8px;align-items:center;color:var(--text-2)}
.sources li .n{width:16px;height:16px;border-radius:4px;background:var(--bg-hover);display:grid;place-items:center;font-size:10px;font-weight:600;color:var(--text-3);flex:none}
.sources li a{color:inherit;text-decoration:none}
.sources li a:hover{color:var(--accent-text);text-decoration:underline}
.recap{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--bg-sunken);font-size:13.5px;margin-top:16px}
.recap .k{font-size:11.5px;font-weight:600;color:var(--text-3);text-transform:none;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.ans-foot{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:12px;padding:6px 0 0;flex-wrap:wrap}
.ans-foot button{display:inline-flex;align-items:center;gap:5px;color:var(--text-3);height:24px;padding:0 6px;border-radius:5px}
.ans-foot button:hover{background:var(--bg-hover);color:var(--text)}
.fu{margin-top:26px;border-top:1px solid var(--border);padding-top:20px}
.fu-q{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:14px;margin-bottom:6px}
.fu-q .lbl{font-size:11px;font-weight:600;color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin-top:2px;flex:none}
.blk{margin-top:30px}
.blk-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:6px}
.blk-h .n{color:var(--text-3);font-weight:500}
.blk-h .sp{flex:1}
.ring{width:14px;height:14px}
.subrows{border:1px solid var(--border);border-radius:8px;overflow:hidden}
.subrows .row{height:36px;padding:0 12px}
.subrows .row:last-child{border-bottom:0}
.subrows .addrow{height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text-3);width:100%;text-align:left}
.subrows .addrow:hover{background:var(--bg-hover);color:var(--text)}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:var(--border)}
.ev{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:12.5px;color:var(--text-3);position:relative}
.ev .ico{width:17px;height:17px;border-radius:50%;background:var(--bg-panel);display:grid;place-items:center;flex:none;position:relative;z-index:1;color:var(--text-3)}
.ev b{color:var(--text-2);font-weight:500}
.ev .t{margin-left:auto;white-space:nowrap;padding-left:8px}
.ev.msg{display:block;padding:10px 0}
.msgcard{border:1px solid var(--border);border-radius:8px;background:var(--bg-elev);padding:10px 14px 12px;margin-left:27px;color:var(--text)}
.msgcard .mh{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-3);margin-bottom:6px}
.msgcard .mh b{color:var(--text);font-weight:600}
.msgcard.you{background:var(--bg-sunken)}
.msgcard .answer{margin-top:0;font-size:14px}
.ev.msg .ico{position:absolute;left:0;top:18px}
.composer-dock{position:sticky;bottom:0;padding:14px 0 16px;background:linear-gradient(180deg, rgba(0,0,0,0), var(--bg-panel) 30%);margin-top:auto;z-index:3}
.cbox{border:1px solid var(--border-strong);border-radius:10px;background:var(--bg-elev);box-shadow:0 2px 10px rgba(0,0,0,.05);padding:10px 10px 8px 12px}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cbox textarea{width:100%;border:0;outline:0;background:transparent;resize:none;min-height:22px;max-height:160px;font-size:13.5px;line-height:1.5;padding:0}
.cbox textarea::placeholder{color:var(--text-3)}
.cbar{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.cbar .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;padding:1px;background:var(--bg-sunken)}
.seg button{height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:500;color:var(--text-3);display:inline-flex;align-items:center;gap:5px}
.seg button[aria-checked="true"]{background:var(--bg-elev);color:var(--text);box-shadow:0 0 0 1px var(--border-strong)}
.pchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--border);font-size:12px;color:var(--text-2);background:var(--bg-panel)}
.pchip:hover{border-color:var(--border-strong);color:var(--text)}
.send{width:28px;height:28px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center}
.send:disabled{background:var(--bg-active);color:var(--text-4);cursor:default}
.warnline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--orange);margin-top:6px}

.props{display:flex;flex-direction:column;gap:2px}
.prop{display:flex;align-items:center;min-height:32px;font-size:12.5px}
.prop .k{width:84px;color:var(--text-3);flex:none}
.prop .v{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:5px;margin-left:-6px;text-align:left;font-weight:500;flex-wrap:wrap}
button.v:hover{background:var(--bg-hover)}
.side-h{font-size:11.5px;font-weight:500;color:var(--text-3);margin:18px 0 6px;display:flex;align-items:center;gap:6px}
.side-h .sp{flex:1}
.side-h button{color:var(--text-3);border-radius:4px;width:20px;height:20px;display:grid;place-items:center}
.side-h button:hover{background:var(--bg-hover);color:var(--text)}
.rel{display:flex;align-items:center;gap:8px;padding:5px 6px;margin:0 -6px;border-radius:5px;font-size:12.5px;width:calc(100% + 12px);text-align:left}
.rel:hover{background:var(--bg-hover)}
.rel .rt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel .ty{font-size:11px;color:var(--text-3);flex:none}
.rel-grp{font-size:11px;color:var(--text-4);margin:8px 0 2px;font-weight:500}
.minigraph{display:none;border:1px solid var(--border);border-radius:8px;background:var(--bg-sunken);margin-top:4px}
.minigraph svg{display:block;width:100%;height:auto}
[data-variant="e"] .minigraph{display:block}
[data-variant="e"] .rel-list{display:none}

/* conversation variant */
.conv-only{display:none}
[data-variant="c"] .conv-only{display:block}
[data-variant="c"] .doc-only{display:none}

/* ---------- peek ---------- */
.peek{position:absolute;top:0;right:0;bottom:0;width:min(520px,92%);background:var(--bg-elev);border-left:1px solid var(--border);box-shadow:var(--shadow-pop);z-index:20;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .16s ease-out;visibility:hidden}
.peek.open{transform:none;visibility:visible}
.peek-h{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 16px;border-bottom:1px solid var(--border);flex:none;color:var(--text-3);font-size:12.5px}
.peek-h .sp{flex:1}
.peek-b{flex:1;overflow:auto;padding:18px 20px 24px}
.peek-b h2{font-size:17px;font-weight:600;margin:0 0 8px;letter-spacing:-.012em;line-height:1.35}
.peek-b .answer{font-size:13.5px;margin-top:12px}
.peek-props{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
[data-variant="d"] .split{display:flex;height:100%}
[data-variant="d"] .split > .list-wrap{flex:1;min-width:0;overflow:auto}
[data-variant="d"] .peek.docked{position:relative;transform:none;visibility:visible;box-shadow:none;width:46%;min-width:380px;flex:none}
[data-variant="d"] .peek.docked:not(.open){display:none}
[data-variant="d"] .split:has(.peek.open) .row :is(.lab,.pj,.queueline){display:none}

/* ---------- notes / outline ---------- */
.doc{max-width:760px;margin:0 auto;padding:36px 48px 80px}
.doc h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.doc .dmeta{display:flex;gap:8px;align-items:center;color:var(--text-3);font-size:12.5px;margin-bottom:22px;flex-wrap:wrap}
.ol{list-style:none;margin:0;padding:0}
.ol .ol{padding-left:22px;position:relative}
.ol .ol::before{content:"";position:absolute;left:9px;top:0;bottom:4px;width:1px;background:var(--border)}
.oli > .ol-row{display:flex;align-items:flex-start;gap:4px;min-height:30px;padding:3px 4px 3px 0;border-radius:6px;position:relative}
.oli > .ol-row:hover{background:var(--bg-hover)}
.oli.collapsed > .ol{display:none}
.ol-tog{width:18px;height:22px;display:grid;place-items:center;color:var(--text-3);flex:none;border-radius:4px}
.ol-tog svg{transition:transform .12s}
.oli.collapsed > .ol-row .ol-tog svg{transform:rotate(-90deg)}
.ol-tog.leaf{visibility:hidden}
.ol-bul{width:14px;height:22px;display:grid;place-items:center;flex:none}
.ol-bul i{width:5px;height:5px;border-radius:50%;background:var(--text-3);display:block}
.oli.collapsed > .ol-row .ol-bul i{box-shadow:0 0 0 3px var(--bg-active)}
.ol-txt{flex:1;min-width:0;line-height:22px;font-size:14px;outline:none;padding:0 2px;border-radius:3px}
.ol-txt.h{font-weight:600;font-size:14.5px}
.ol-grip{position:absolute;left:-22px;top:6px;color:var(--text-4);opacity:0;cursor:grab}
.oli > .ol-row:hover .ol-grip{opacity:1}
.ol-act{opacity:0;display:flex;gap:2px;flex:none}
.oli > .ol-row:hover .ol-act,.ol-act:focus-within{opacity:1}
.ol-act button{height:22px;padding:0 6px;border-radius:5px;font-size:11.5px;color:var(--text-3);display:inline-flex;gap:4px;align-items:center}
.ol-act button:hover{background:var(--bg-active);color:var(--text)}
.ol-ref{display:flex;align-items:center;gap:8px;line-height:22px;flex:1;min-width:0;font-size:13.5px;text-align:left}
.ol-ref .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ol-ref .rid{color:var(--text-3);font-size:12px;flex:none}
.ol-ref:hover .tt{text-decoration:underline;text-decoration-color:var(--text-4)}
.ol-tools{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.backlinks{margin-top:40px;border-top:1px solid var(--border);padding-top:16px}
.notelist .row .rid{width:20px}
.webclip{border:1px solid var(--border);border-radius:10px;padding:16px;background:var(--bg-sunken);display:flex;gap:12px;align-items:flex-start}
.webclip .fav{width:32px;height:32px;border-radius:7px;background:var(--bg-elev);border:1px solid var(--border);display:grid;place-items:center;color:var(--text-2);flex:none}
.post-quote{font-size:17px;line-height:1.5;margin:0;font-weight:500;letter-spacing:-.01em}
.wl-pop{position:fixed;z-index:60;width:320px;background:var(--bg-elev);border-radius:8px;box-shadow:var(--shadow-pop);padding:4px;display:none}
.wl-pop.open{display:block}

/* ---------- graph ---------- */
.gwrap{position:relative;height:100%;min-height:420px}
.gwrap svg{width:100%;height:100%;display:block}
.g-edge{stroke:var(--edge);stroke-width:1.2;fill:none}
.g-edge.sub{stroke-width:1.6}
.g-edge.mention{stroke-dasharray:4 4}
.g-edge.cites{stroke-dasharray:1.5 3.5}
.g-edge.hot{stroke:var(--accent);stroke-width:1.8}
.g-node{cursor:pointer}
.g-node text{fill:var(--text-2);font-size:11.5px;font-family:var(--font);font-weight:500;paint-order:stroke;stroke:var(--bg-panel);stroke-width:4px;stroke-linejoin:round}
.g-node .mid{fill:var(--text-3);font-weight:500}
.g-node:hover text,.g-node.hot text{fill:var(--text)}
.g-node.dim{opacity:.28}
.g-edge.dim{opacity:.25}
.g-node:focus-visible{outline:none}
.g-node:focus-visible .shape{stroke:var(--accent);stroke-width:2.5}
.g-legend{position:absolute;left:16px;bottom:14px;background:var(--bg-elev);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--text-3);display:flex;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.g-legend span{display:inline-flex;align-items:center;gap:6px}
.g-legend svg{width:22px;height:8px}
.g-tools{position:absolute;right:14px;top:12px;display:flex;gap:6px}
.reltable{width:100%;border-collapse:collapse;font-size:13px}
.reltable td{border-bottom:1px solid var(--border-soft);padding:0 10px;height:38px;white-space:nowrap}
.reltable td:first-child{padding-left:22px}
.reltable .ty{color:var(--text-3);font-size:12px}
.reltable .cell{display:flex;align-items:center;gap:8px;max-width:330px;overflow:hidden;text-overflow:ellipsis}

/* ---------- inbox ---------- */
.inbox{display:flex;height:100%}
.ib-list{width:360px;flex:none;border-right:1px solid var(--border);overflow:auto}
.ib-item{display:flex;gap:10px;padding:11px 14px 11px 16px;border-bottom:1px solid var(--border-soft);width:100%;text-align:left;position:relative}
.ib-item:hover{background:var(--bg-hover)}
.ib-item.sel{background:var(--bg-sel)}
.ib-item .unread{position:absolute;left:6px;top:18px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.ib-item .b{flex:1;min-width:0}
.ib-item .l1{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-3)}
.ib-item .l1 .t{margin-left:auto}
.ib-item .l2{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.ib-item .l3{font-size:12px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib-detail{flex:1;min-width:0;overflow:auto;padding:22px 28px}
.callout{border:1px solid var(--border);border-radius:8px;padding:12px 14px;background:var(--bg-sunken);display:flex;gap:10px;align-items:flex-start;font-size:13px}
.callout.warn{border-color:color-mix(in srgb, var(--orange) 40%, var(--border))}
.callout .ttl{font-weight:600;margin-bottom:2px}
code{font-family:var(--mono);font-size:12px;background:var(--bg-hover);border:1px solid var(--border);border-radius:4px;padding:0 4px}

/* ---------- start / project ---------- */
.start{max-width:720px;margin:0 auto;padding:44px 40px 60px}
.start h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.start .lead{color:var(--text-3);margin:0 0 26px;font-size:13.5px}
.hero{border:1px solid var(--border);border-radius:12px;padding:30px 24px;text-align:center;background:radial-gradient(120% 90% at 50% 0%, var(--accent-soft), transparent 70%), var(--bg-elev)}
.steps{margin-top:22px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border-soft)}
.step:last-child{border-bottom:0}
.step .ck{width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--text-4);flex:none;display:grid;place-items:center}
.step.done .ck{background:var(--st-reviewed);border:0;color:#fff}
.step .b{flex:1;min-width:0}
.step .b .t{font-weight:500}
.step.done .b .t{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-4)}
.step .b .s{font-size:12px;color:var(--text-3)}
.gloss{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.gloss div{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--bg-elev);font-size:12.5px;color:var(--text-3)}
.gloss b{display:flex;align-items:center;gap:6px;color:var(--text);font-size:13px;margin-bottom:2px}
.proj-head{padding:26px 40px 0;max-width:980px;margin:0 auto}
.proj-head h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:10px 0 4px;display:flex;align-items:center;gap:10px}
.ms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:18px 0}
.ms > div{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--bg-elev)}
.ms .t{font-weight:500;display:flex;align-items:center;gap:7px}
.ms .s{font-size:12px;color:var(--text-3);margin-top:2px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
.scrim.open{display:block}
.cmdk{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));background:var(--bg-elev);border-radius:12px;box-shadow:var(--shadow-pop);z-index:50;display:none;overflow:hidden}
.cmdk.open{display:block}
.cmdk-ctx{padding:10px 14px 0;display:flex;gap:6px}
.cmdk-ctx span{font-size:11.5px;color:var(--text-3);background:var(--bg-hover);border-radius:5px;padding:2px 7px}
.cmdk input{width:100%;border:0;outline:0;background:transparent;font-size:16px;padding:12px 16px 14px;border-bottom:1px solid var(--border)}
.cmdk input::placeholder{color:var(--text-3)}
.cmdk-list{max-height:min(420px,56vh);overflow:auto;padding:6px}
.cmdk-g{font-size:11.5px;color:var(--text-3);padding:8px 10px 4px;font-weight:500}
.cmdk-it{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:7px;width:100%;text-align:left;color:var(--text-2)}
.cmdk-it .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.cmdk-it .sub{color:var(--text-3);font-size:12px}
.cmdk-it.act{background:var(--bg-active)}
.cmdk-it .kb{display:flex;gap:3px}
.cmdk-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-3)}
.cmdk-foot span{display:inline-flex;gap:5px;align-items:center}
.modal{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(720px,calc(100vw - 32px));background:var(--bg-elev);border-radius:12px;box-shadow:var(--shadow-pop);z-index:50;display:none}
.modal.open{display:block}
.modal-h{display:flex;align-items:center;gap:8px;padding:12px 14px 0 16px;font-size:12.5px;color:var(--text-3)}
.modal-h .crumbchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--border);border-radius:6px;color:var(--text-2);font-weight:500}
.modal-h .sp{flex:1}
.modal-b{padding:14px 18px 6px}
.modal-b .ttl{width:100%;border:0;outline:0;background:transparent;font-size:18px;font-weight:600;letter-spacing:-.012em;padding:0}
.modal-b .desc{width:100%;border:0;outline:0;background:transparent;font-size:13.5px;resize:none;min-height:64px;padding:8px 0 0;color:var(--text-2);line-height:1.5}
.modal-b ::placeholder{color:var(--text-4)}
.modal-b .quote{margin:4px 0 4px}
.modal-props{display:flex;gap:6px;flex-wrap:wrap;padding:6px 16px 12px}
.modal-f{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--border)}
.modal-f .sp{flex:1}
.tgl{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--text-3)}
.tgl i{width:24px;height:14px;border-radius:7px;background:var(--bg-active);position:relative;display:block}
.tgl i::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--bg-elev);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .12s}
.tgl[aria-checked="true"] i{background:var(--accent)}
.tgl[aria-checked="true"] i::after{left:12px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.suggest button{font-size:12px;color:var(--text-2);border:1px dashed var(--border-strong);border-radius:6px;padding:3px 8px}
.suggest button:hover{color:var(--text);border-style:solid}
.menu{position:fixed;z-index:70;min-width:220px;background:var(--bg-elev);border-radius:9px;box-shadow:var(--shadow-pop);padding:4px;display:none}
.menu.open{display:block}
.menu .mi{display:flex;align-items:center;gap:9px;height:30px;padding:0 9px;border-radius:6px;width:100%;text-align:left;color:var(--text)}
.menu .mi:hover,.menu .mi.act{background:var(--bg-active)}
.menu .mi .sub{margin-left:auto;color:var(--text-3);font-size:12px;display:flex;gap:3px}
.menu .mh{font-size:11.5px;color:var(--text-3);padding:6px 9px 3px}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.seltb{position:fixed;z-index:65;display:none;background:var(--bg-elev);border-radius:8px;box-shadow:var(--shadow-pop);padding:3px;gap:2px}
.seltb.open{display:flex}
.seltb button{height:28px;padding:0 9px;border-radius:6px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--text)}
.seltb button:hover{background:var(--bg-active)}
.seltb kbd{margin-left:2px}
.seltb .div{width:1px;background:var(--border);margin:4px 2px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--bg-elev);box-shadow:var(--shadow-pop);border-radius:9px;padding:9px 12px;display:flex;align-items:center;gap:10px;z-index:80;opacity:0;pointer-events:none;transition:opacity .15s, transform .15s;font-size:12.5px;max-width:calc(100vw - 32px)}
.toast.open{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:var(--accent-text);font-weight:500}
.ghint{position:fixed;left:264px;bottom:18px;z-index:80;background:var(--bg-elev);box-shadow:var(--shadow-pop);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text-3);display:none;gap:10px;align-items:center;flex-wrap:wrap;max-width:520px}
.ghint.open{display:flex}
.ghint span{display:inline-flex;gap:4px;align-items:center}
.vswitch{position:fixed;right:14px;bottom:14px;z-index:90;background:var(--bg-elev);box-shadow:var(--shadow-pop);border-radius:9px;padding:4px;display:flex;gap:2px;font-size:12px}
.vswitch button{padding:4px 8px;border-radius:6px;color:var(--text-2)}

<p>LFP (LiFePO₄ / graphite) cells lose capacity through two coupled routes: loss of cyclable lithium, mostly to the solid–electrolyte interphase (SEI) on the graphite anode, and, under some conditions, loss of active material. Both depend on state of charge (SOC), because SOC sets the anode potential.</p>
<p><strong>SEI growth.</strong> At high SOC the graphite anode sits near 0.1 V vs Li/Li⁺, where electrolyte reduction is fastest. <mark class="hl" data-anchor="q15">SEI growth accelerates above ~80% SOC</mark><button class="anchor-chip" data-open="q15" title="Sub-question anchored to this passage"><svg class="i s14" viewBox="0 0 16 16"><path d="M5 2.5v6a2.5 2.5 0 0 0 2.5 2.5H12"/><path d="M10 8.5L12.5 11 10 13.5"/></svg>THS-15</button>, and because the reaction consumes lithium, the loss is permanent. Fade during storage follows roughly √t, so the effect is largest in the first years of calendar life.<sup>1</sup></p>
<p><strong>Lithium plating.</strong> Charging into a nearly full anode raises the chance that lithium deposits as metal instead of intercalating, particularly at low temperature or high C-rate. Part of the plated lithium re-intercalates during rest; the rest becomes electrically isolated and adds to fade.</p>
<p><strong>Calendar vs cycle aging.</strong> Calendar aging (time spent at a given SOC and temperature) dominates for cells that rest for long periods at high SOC, which is typical for storage held ready for an evening peak. Cycle aging dominates for cells cycled daily at moderate depth. Measured storage data at 25 °C show the SOC dependence directly:<sup>1</sup></p>
<table><thead><tr><th>SOC band</th><th>Capacity fade / year at 25 °C</th></tr></thead><tbody><tr><td>0–30%</td><td>1.1%</td></tr><tr><td>30–70%</td><td>1.6%</td></tr><tr><td>70–100%</td><td>2.9%</td></tr></tbody></table>
<p><strong>Implication for operation.</strong> Holding a fleet at 90–100% SOC overnight roughly doubles calendar fade relative to a 30–70% window. Most utility-scale energy management systems cap the resting SOC at 80–90% for this reason and accept a small loss of available energy.<sup>2</sup> Warranty models in project finance usually assume this cap.<sup>3</sup></p>`;

/* ================= Views ================= */
function render() {

  if (v === "questions") viewQuestions(c);

function go(view, key = null, extra = {}) {
  S.history.push({ view: S.view, key: S.key });

  if (view !== "questions") S.peek = null;
  hideSel(); closeMenu();
  $("#sb").classList.remove("open"); $("#scrim").classList.toggle("open", false);
  render();

}

/* ================= Streaming / runs ================= */
const NEW_ANSWER = "Depth of discharge and SOC window act on different mechanisms. The SOC ceiling sets how long the anode rests at low potential, which drives SEI growth and calendar fade; depth of discharge sets the strain per cycle and drives cycle fade. For LFP at 25 °C, moving from a 0–100% window to 10–90% cuts calendar fade by roughly a third while reducing usable energy by 20%. Narrowing further to 20–80% gives a smaller additional gain, because LFP cycle fade is already low at moderate depth. For a 4-hour system cycling once a day, the ceiling matters more than the floor.";
const FU_ANSWER = "Short version: capacity fade in LFP is driven mainly by SEI growth, which accelerates with time spent above about 80% SOC. Capping the resting SOC is the cheapest mitigation; augmentation covers the remainder over a 20-year contract.";
const TOOLSEQ = [["web_fetch", "doi.org/10.1149/2.1181714jes"], ["read_file", "notes/chapter-3-outline.md"], ["web_fetch", "atb.nrel.gov/electricity/2026"], ["web_search", "LFP depth of discharge calendar fade 25C"]];
const runs = {};
function startRun(k) {
  const q = Q[k];
  q.status = "running"; q.elapsed = 0; q.toolLog = []; q.partial = "<p>"; q.answer = null; q.updated = "now";
  const words = NEW_ANSWER.split(" ");
  let wi = 0, ticks = 0;
  render();
  runs[k] = setInterval(() => {
    ticks++;
    if (ticks % 6 === 0 && q.toolLog.length < TOOLSEQ.length && wi === 0) { q.toolLog.push(TOOLSEQ[q.toolLog.length]); refreshRun(k); return; }
    if (q.toolLog.length < TOOLSEQ.length && wi === 0) return;
    const n = reduced ? 8 : 2;
    q.partial += (wi ? " " : "") + words.slice(wi, wi + n).join(" ");
    wi += n;
    $$(`[data-answer="${k}"]`).forEach(el => { if (el.id.startsWith("ans-")) el.innerHTML = q.partial + '<span class="caret"></span>'; });
    if (wi >= words.length) finishRun(k);
  }, reduced ? 120 : 70);
}
function refreshRun(k) {
  const q = Q[k];
  $$(`[data-tools="${k}"]`).forEach(e => e.textContent = q.toolLog.length);
  const ul = $(`#tools-${k}`); if (ul) ul.innerHTML = q.toolLog.map(t => `<li><span class="ok">✓</span>${t[0]}<span class="muted">${esc(t[1])}</span></li>`).join("");
}
function finishRun(k, stopped) {
  clearInterval(runs[k]); delete runs[k];
  const q = Q[k];
  if (stopped) { q.status = "stopped"; q.answer = q.partial + "</p>"; }
  else { q.status = "ready"; q.answer = q.partial + "</p>"; q.tools = q.toolLog.length; q.dur = `${q.elapsed || 4}s`; q.words = (q.answer.match(/\S+/g) || []).length; q.sources = [LFP_SOURCES[0], LFP_SOURCES[1]];
    INBOX.unshift({ id: "i" + Date.now(), key: k, unread: true, kind: "ready", l2: `${q.id} is ready for review`, l3: `${AG[q.agent].name} · ${q.words} words`, t: "now" });
    toast(`${stIcon("ready")} <b>${q.id}</b> is ready for review`, `<button data-open="${k}">Open</button>`);
  }
  if (S.view === "question" && S.key === k) { const st = $("#content").scrollTop; render(); $("#content").scrollTop = st; } else render();
}
function stopRun(k) {
  if (runs[k]) finishRun(k, true);
  else { const q = Q[k]; q.status = "stopped"; q.answer = (q.partial || "") + "</p>"; render(); }
  toast(`${stIcon("stopped")} Run stopped. The partial answer is kept.`);
}
function streamFollowup(k, text) {
  const q = Q[k];
  q.followups = q.followups || [];
  const f = { q: text, a: "<p>", time: "now", streaming: true, dur: "" };
  q.followups.push(f);
  const i = q.followups.length - 1;
  const st = $("#content").scrollTop; render(); $("#content").scrollTop = st;
  const fuEl = $(`#fu-${k}-${i}`) || $(`#fu-${k}-${i}-c`);
  if (fuEl) fuEl.scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
  const words = FU_ANSWER.split(" "); let wi = 0, t0 = Date.now();
  const iv = setInterval(() => {
    const n = reduced ? 8 : 2;
    f.a += (wi ? " " : "") + words.slice(wi, wi + n).join(" "); wi += n;
    $$(`#fu-${k}-${i}, #fu-${k}-${i}-c`).forEach(el => el.innerHTML = f.a + '<span class="caret"></span>');
    if (wi >= words.length) { clearInterval(iv); f.a += "</p>"; f.streaming = false; f.dur = Math.max(1, Math.round((Date.now() - t0) / 1000)) + "s"; const s2 = $("#content").scrollTop; render(); $("#content").scrollTop = s2; }
  }, reduced ? 120 : 65);
}
setInterval(() => {
  Object.keys(Q).forEach(k => { const q = Q[k]; if (q.status === "running") { q.elapsed = (q.elapsed || 0) + 1; $$(`[data-elapsed="${k}"]`).forEach(e => e.textContent = fmtTime(q.elapsed)); } });
}, 1000);

/* ================= Selection toolbar ================= */
let selCtx = null;
function showSelFor(range, k) {
  const r = range.getBoundingClientRect();

  const tb = $("#seltb"); tb.classList.add("open");
  const w = tb.offsetWidth;
  tb.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
  tb.style.top = Math.max(8, r.top - 42) + "px";
  selCtx = { range: range.cloneRange(), key: k, text: range.toString().trim() };
}
function hideSel() { $("#seltb").classList.remove("open"); selCtx = null; }
function doSel(action) {
  if (!selCtx) return;
  const { range, key, text } = selCtx;
  hideSel();

    try { const m = document.createElement("mark"); m.className = "hl"; range.surroundContents(m); } catch (e) { /* crosses elements: keep as clip only */ }
    window.getSelection().removeAllRanges();
    N.clip.clips.unshift([key, text]); if (!LINKS.some(l => l.a === "clip" && l.b === key)) LINKS.push({ a: "clip", b: key, ty: "clip" });

  } else if (action === "ask") {
    window.getSelection().removeAllRanges();
    openCompose({ parent: key, anchor: text, project: Q[key].project });

    const anchorEl = document.createElement("span");
    openMenu({ getBoundingClientRect: () => range.getBoundingClientRect() }, `<div class="mh">Add passage to note</div>${["ch3", "open", "clip"].map(n => `<button class="mi" data-tonote="${n}" data-key="${key}" data-text="${esc(text)}">${noteIcon(n)}${esc(N[n].title)}</button>`).join("")}<hr><button class="mi" data-act="compose-note">${ic("plus", "s14")}New note…</button>`);
  }
}

    case "copy": toast(`${ic("copy", "s14")} Answer copied as Markdown`); break;
    case "copycmd": toast(`${ic("copy", "s14")} Copied <code>grok login</code>`); break;
    case "recheck": AG[key].state = "ok"; AG[key].note = "Signed in · CLI detected"; S.started.agent = true; Object.keys(Q).forEach(k => { if (Q[k].agent === key && Q[k].status === "queued") Q[k].queue = 1; }); render(); toast(`${av(key)} ${AG[key].name} is signed in. Queued questions will start.`); setTimeout(() => { if (Q.q17.status === "queued") startRun("q17"); }, 800); break;
    case "tonote": openMenu(a, `<div class="mh">Add answer to note</div>${["ch3", "open"].map(n => `<button class="mi" data-tonote="${n}" data-key="${key}" data-text="${esc(Q[key].short)}">${noteIcon(n)}${esc(N[n].title)}</button>`).join("")}`); break;
    case "readall": INBOX.forEach(i => i.unread = false); render(); break;
    case "emptyws": viewEmptyWorkspace($("#content")); break;
    case "ol-all": { const col = a.dataset.v === "1"; $$(".oli").forEach(li => { if (li.querySelector(":scope > .ol")) li.classList.toggle("collapsed", col); }); $$("[data-oltog]").forEach(b => { S.collapsedOl[b.dataset.oltog] = col; }); break; }
    case "prevq": case "nextq": { const ks = Object.keys(Q); const i = ks.indexOf(S.key); const n = ks[(i + (act === "nextq" ? 1 : -1) + ks.length) % ks.length]; go("question", n); break; }
    case "display": openMenu(a, `<div class="mh">Grouping</div>${[["status", "Status"], ["project", "Project"], ["agent", "Agent"]].map(([v, l]) => `<button class="mi" data-mi="group" data-v="${v}">${S.group === v ? ic("check", "s14") : '<span style="width:14px"></span>'}${l}</button>`).join("")}<hr><div class="mh">Layout</div><button class="mi" data-mi="layout" data-v="a">${document.documentElement.dataset.variant !== "b" ? ic("check", "s14") : '<span style="width:14px"></span>'}${ic("list", "s14")}List</button><button class="mi" data-mi="layout" data-v="b">${document.documentElement.dataset.variant === "b" ? ic("check", "s14") : '<span style="width:14px"></span>'}${ic("board", "s14")}Board</button>`); break;
    case "filter": openMenu(a, `<div class="mh">Filter</div>${["Status", "Agent", "Project", "Label", "Has sub-questions", "Linked to a note"].map(l => `<button class="mi" data-mi="noop">${l}<span class="sub">›</span></button>`).join("")}`); break;
    case "status": openMenu(a, `<div class="mh">Change status</div>${["queued", "running", "ready", "reviewed"].map((s, i) => `<button class="mi" data-mi="status" data-v="${s}" data-key="${key}">${stIcon(s)}${STATUS[s]}<span class="sub"><kbd>${i + 1}</kbd></span></button>`).join("")}`); break;
    case "agentmenu": openMenu(a, `<div class="mh">Run with</div>${Object.keys(AG).map(g => `<button class="mi" data-mi="agent" data-v="${g}" data-key="${key}">${av(g)}${AG[g].name}<span class="sub">${AG[g].state === "ok" ? AG[g].models[0] : '<span style="color:var(--orange)">Sign in</span>'}</span></button>`).join("")}`); break;
    case "c-agent": S.compose.title = $("#cTitle").value; openMenu(a, `<div class="mh">Agent</div>${Object.keys(AG).map(g => `<button class="mi" data-mi="c-agent" data-v="${g}">${av(g)}${AG[g].name}<span class="sub">${AG[g].state === "ok" ? "Ready" : '<span style="color:var(--orange)">Not signed in</span>'}</span></button>`).join("")}`); break;
    case "c-model": S.compose.title = $("#cTitle").value; openMenu(a, `<div class="mh">Model</div>${AG[S.compose.agent].models.map(m => `<button class="mi" data-mi="c-model" data-v="${m}">${S.compose.model === m ? ic("check", "s14") : '<span style="width:14px"></span>'}${m}</button>`).join("")}`); break;
    case "c-project": S.compose.title = $("#cTitle").value; openMenu(a, `<div class="mh">Project</div>${Object.keys(PJ).map(p => `<button class="mi" data-mi="c-project" data-v="${p}">${projIco(p)}${esc(PJ[p].name)}</button>`).join("")}`); break;
    case "c-more": S.compose.more = !S.compose.more; a.setAttribute("aria-checked", S.compose.more); break;
    case "addlink": openMenu(a, `<div class="mh">Add link from ${esc(label(key))}</div>${["related", "cites", "mention"].map(ty => `<button class="mi" data-mi="noop">${ic("link", "s14")}${LT[ty]}…</button>`).join("")}<hr><div class="mh">Tip: in a note, type [[ to link inline</div>`); break;
    case "more": openMenu(a, `<button class="mi" data-mi="noop">${ic("copy", "s14")}Copy as Markdown</button><button class="mi" data-mi="noop">${ic("cube", "s14")}Move to project…</button><button class="mi" data-mi="noop">${ic("archive", "s14")}Archive</button>`); break;
    case "noop": e.preventDefault(); break;
  }
});
$("#wsBtn").addEventListener("click", (e) => openMenu(e.currentTarget, `<div class="mh">Workspaces <span style="float:right"><kbd>⌘</kbd><kbd>O</kbd></span></div><button class="mi" data-mi="ws" data-v="Thesis — Grid storage"><span class="ws-logo">TG</span>Thesis — Grid storage<span class="sub">${ic("check", "s14")}</span></button><button class="mi" data-mi="ws" data-v="Personal"><span class="ws-logo" style="background:linear-gradient(135deg,#e8a15b,#c8662a)">P</span>Personal</button><hr><button class="mi" data-mi="noop">${ic("archive", "s14")}Archive</button><button class="mi" data-nav="agents">${ic("agent", "s14")}Agents</button>`));
function menuAction(kind, v, key) {
  if (kind === "group") { S.group = v; if (document.documentElement.dataset.variant === "b") setVariant("a"); else render(); }
  else if (kind === "layout") setVariant(v);
  else if (kind === "status") { if (v === "running" && Q[key].status !== "running") startRun(key); else { Q[key].status = v; render(); } }
  else if (kind === "agent") { Q[key].agent = v; Q[key].model = AG[v].models[0]; render(); }
  else if (kind === "c-agent") { S.compose.agent = v; S.compose.model = AG[v].models[0]; renderCompose(); }
  else if (kind === "c-model") { S.compose.model = v; renderCompose(); }
  else if (kind === "c-project") { S.compose.project = v; renderCompose(); }
  else if (kind === "ws") { if (v !== "Thesis — Grid storage") toast(`Personal has no questions yet. This mock stays in Thesis — Grid storage.`); }
}

/* graph hover */
document.addEventListener("mouseover", (e) => {
  const n = e.target.closest && e.target.closest(".g-node"); const svg = e.target.closest && e.target.closest("svg");
  if (!svg) return;
  $$(".g-node, .g-edge", svg).forEach(x => x.classList.remove("dim", "hot"));
  if (!n) return;
  const k = n.dataset.gk; const nb = new Set([k]);
  $$(".g-edge", svg).forEach(ed => { const hit = ed.dataset.a === k || ed.dataset.b === k; ed.classList.toggle("hot", hit); ed.classList.toggle("dim", !hit); if (hit) { nb.add(ed.dataset.a); nb.add(ed.dataset.b); } });
  $$(".g-node", svg).forEach(g => { g.classList.toggle("dim", !nb.has(g.dataset.gk)); g.classList.toggle("hot", g.dataset.gk === k); });
});
document.addEventListener("mouseout", (e) => { if (e.target.closest && e.target.closest(".g-node") && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest(".g-node"))) { const svg = e.target.closest("svg"); $$(".g-node, .g-edge", svg).forEach(x => x.classList.remove("dim", "hot")); } });
document.addEventListener("dblclick", (e) => { const row = e.target.closest("[data-row]"); if (row) openItem(row.dataset.row); });

/* ================= Keyboard ================= */
let gPending = null;
document.addEventListener("keydown", (e) => {
  const tag = (e.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || e.target.isContentEditable;
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === "Meta") $("#sb").classList.add("cmd-held");
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); $("#cmdk").classList.contains("open") ? closeCmdk() : openCmdk(); return; }
  if ($("#cmdk").classList.contains("open")) {
    if (e.key === "Escape") { closeCmdk(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); cmdIdx = Math.min(cmdItems.length - 1, cmdIdx + 1); renderCmdk(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); cmdIdx = Math.max(0, cmdIdx - 1); renderCmdk(); return; }
    if (e.key === "Enter") { e.preventDefault(); runCmd(cmdIdx); return; }
    return;
  }
  if ($("#modal").classList.contains("open")) {
    if (e.key === "Escape") { closeModal(); return; }
    if (e.key === "Enter" && (mod || e.target.id === "cTitle")) { e.preventDefault(); submitCompose(); return; }
    return;
  }
  if ($("#wlPop").classList.contains("open")) {
    const btns = $$("#wlPop [data-wl]");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); wlIdx = (wlIdx + (e.key === "ArrowDown" ? 1 : -1) + btns.length) % btns.length; btns.forEach((b, i) => b.classList.toggle("act", i === wlIdx)); return; }
    if (e.key === "Enter") { e.preventDefault(); pickWl(btns[wlIdx].dataset.wl); return; }
    if (e.key === "Escape") { closeWl(); return; }
  }
  if (e.key === "Escape") {
    if ($("#menu").classList.contains("open")) { closeMenu(); return; }
    if (selCtx) { hideSel(); window.getSelection().removeAllRanges(); return; }
    if (S.peek) { S.peek = null; updatePeek(); return; }
    if ($("#sb").classList.contains("open")) { $("#sb").classList.remove("open"); $("#scrim").classList.remove("open"); return; }
    if (typing) { e.target.blur(); return; }
    if (S.view === "question" || S.view === "note") { const h = S.history.pop(); if (h) { S.view = h.view; S.key = h.key; render(); } else go("questions"); }
    return;
  }
  if (typing) {
    if (e.key === "Tab" && e.target.classList.contains("ol-txt")) { e.preventDefault(); const li = e.target.closest(".oli"); li.style.marginLeft = e.shiftKey ? "" : "22px"; }
    return;
  }
  if (mod || e.altKey) return;
  const k = e.key.toLowerCase();
  if (selCtx) { if (k === "h") { e.preventDefault(); doSel("hl"); return; } if (k === "a") { e.preventDefault(); doSel("ask"); return; } if (k === "n") { e.preventDefault(); doSel("note"); return; } }
  if (gPending) {
    clearTimeout(gPending); gPending = null; $("#ghint").classList.remove("open");
    const map = { i: () => go("inbox"), q: () => go("questions"), n: () => go("notes"), l: () => go("links"), o: () => go("project", "deg", { projTab: "outline" }), s: () => go("start") };
    if (map[k]) { e.preventDefault(); map[k](); }
    return;
  }
  if (k === "g") { $("#ghint").classList.add("open"); gPending = setTimeout(() => { gPending = null; $("#ghint").classList.remove("open"); }, 1600); return; }
  if (k === "c") { e.preventDefault(); openCompose(); return; }
  if (k === "n") { e.preventDefault(); openCompose({ type: "note" }); return; }
  if (k === "/" ) { e.preventDefault(); openCmdk(); return; }
  if (k === "?") { e.preventDefault(); openCmdk(">"); return; }
  if (S.view === "questions" && S.order && S.order.length) {
    if (k === "j" || e.key === "ArrowDown") { e.preventDefault(); S.sel = Math.min(S.order.length - 1, S.sel + 1); selRow(); return; }
    if (k === "k" || e.key === "ArrowUp") { e.preventDefault(); S.sel = Math.max(0, S.sel - 1); selRow(); return; }
    if (e.key === " ") { e.preventDefault(); const key = S.order[S.sel]; S.peek = S.peek === key ? null : key; updatePeek(); return; }
    if (e.key === "Enter") { e.preventDefault(); openItem(S.order[S.sel]); return; }
  }
  if (S.view === "question") {
    if (k === "r" && Q[S.key].status === "ready") { Q[S.key].status = "reviewed"; render(); toast(`${stIcon("reviewed")} ${Q[S.key].id} marked Reviewed`); return; }
    if (k === "f") { const it = Q[S.key]; it.fav = !it.fav; render(); return; }
    if (k === "j") { $("[data-act='nextq']").click(); return; }
    if (k === "k") { $("[data-act='prevq']").click(); return; }
    if (k === "l") { const b = $("[data-act='addlink']"); b && b.click(); return; }
    if (k === "a") { openCompose({ parent: S.key, project: Q[S.key].project }); return; }
  }
});
document.addEventListener("keyup", (e) => { if (e.key === "Meta") $("#sb").classList.remove("cmd-held"); });
function selRow() {
  $$("[data-row]", $("#listWrap")).forEach(r => { const on = +r.dataset.i === S.sel; r.classList.toggle("sel", on); r.setAttribute("tabindex", on ? 0 : -1); if (on) { r.scrollIntoView({ block: "nearest" }); r.focus({ preventScroll: true }); } });
  if (S.peek || document.documentElement.dataset.variant === "d") { S.peek = S.order[S.sel]; updatePeek(); }
}
$("#cmdkIn").addEventListener("input", () => { cmdIdx = 0; renderCmdk(); });
$("#scrim").addEventListener("click", () => { closeCmdk(); closeModal(); $("#sb").classList.remove("open"); $("#scrim").classList.remove("open"); });
$$("#cmdkList").forEach(l => l.addEventListener("mousemove", (e) => { const b = e.target.closest("[data-ci]"); if (b && +b.dataset.ci !== cmdIdx) { cmdIdx = +b.dataset.ci; $$(".cmdk-it").forEach(x => x.classList.toggle("act", x === b)); } }));

/* gutters after each render */
const _render = render;
render = function () { _render(); addGutters(); };

/* ================= Boot ================= */
document.documentElement.dataset.variant = "a";
render();
if (parent !== window) parent.postMessage({ type: "mock:ready", mock: MOCK }, "*");
else {
  const vs = document.createElement("div"); vs.className = "vswitch"; vs.setAttribute("aria-label", "Variants");
  vs.innerHTML = MOCK.variants.map(v => `<button data-v="${v.id}" title="${esc(v.summary)}" class="${v.id === "a" ? "on" : ""}">${v.id.toUpperCase()}<span> · ${esc(v.label)}</span></button>`).join("");
  vs.addEventListener("click", (e) => { const b = e.target.closest("[data-v]"); if (b) setVariant(b.dataset.v); });
  document.body.appendChild(vs); document.body.classList.add("standalone");
}
</script>
</body>
</html>
