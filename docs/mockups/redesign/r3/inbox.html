<title>Session · Shared-inbox restyle</title>
<!--
  Session · shared-inbox restyle (round 3, slug "inbox").
  Influence: Front, Missive, Superhuman, Hey. Same layout, controls, keys and vocabulary as the current
  app; only the visual language follows shared-inbox apps.

  INVENTORY OF THE CURRENT APP (read from src/App.tsx, src/components/research/*, src/lib/*, src/styles/*)
  1. Shell: sidebar (208 px, resizable) or the 52 px rail, then main.workspace with the error banner and the
     column strip. Overlays: command palette (⌘K), Agent Setup dialog, Settings dialog (Basic | Remotes),
     rename/confirm dialogs, browser overlay for sources (⇧⌘E), toasts with Undo, notification stack.
  2. Sidebar header: window buttons, Collapse sidebar to icons (⇧⌘G) beside them; right: Settings (⌘,),
     Agents, Light/Dark mode.
  3. Sidebar rows, in order: Home (drop target "Unfiled"; "⌘N" hint while ⌘ is held), Bookmarks,
     Highlights; section "Folders" with + (New folder); Drafts, user folders (… menu: Rename…, Delete…),
     Archive. In the code the rows carry no counts.
  4. Sidebar footer: workspace switcher (name + path, chevron, ⌘O). Menu: workspaces (check + question
     count), Add workspace…, Rename "…"…, Open in Finder, Move workspace folder…, Remove workspace….
     Then the GitHub account control.
  5. Rail (52 px): Expand sidebar (disabled when the window is too narrow), Home, Bookmarks, Highlights,
     divider, Drafts, folder monograms, Archive, New folder, spacer, workspace, Agents, theme, Settings.
     Tooltips sit to the right of each icon.
  6. Column strip (scrolls sideways): feed column (21 %, 240–300 px), then per level a pair: messages
     column (18 %, 220–280 px) + answer column (44 %, 340–660 px). Handles resize a column kind (drag,
     ←/→, Shift for 64 px, double-click resets). ⌃Tab cycles columns; ⌘[ / ⌘] go back/forward.
  7. Feed column header (44 px): title (visually hidden on Home), Back to Home on place pages, Refresh,
     Import report (Home), Rename/Delete folder and "+ Ask" (folders, Bookmarks).
  8. Home: ask box on top, "N new activities" pill, the Unfiled list (role=feed), then one tray per place
     (Drafts, each folder, Archive): icon, name (opens the place), count, chevron. Place pages list cards
     and end with the ask box. Highlights page: passages grouped by thread under the question, Remove.
  9. Feed card: no metadata row; thread title (when it differs) + question or post body; unread dot;
     Running/Failed status dot top-right, replaced on hover by a pill with the drag grip and … ("Bookmark,
     follow or move": Bookmark, Follow, Move to [places], New folder…). Context menu: Generate recap,
     Rename, Archive (A), Delete (D). Starred follow-ups and branches follow as indented child rows
     (★ for branches, running dot).
 10. Ask box: one line "Ask a question" that grows on focus; row: Ask/Post switch (agent icon + chevron,
     a second press opens the model menu with Effort; Users icon = "Post to network"), send arrow
     ("Start research (↵)"). ⌃Tab cycles model, ⌃⇧Tab agent. Post placeholder "Ask your network, or paste
     a link to save". "Save draft" under the box when it has text. Footer: setup message + Review agents.
 11. Pair header: ‹ › history (root), thread title or "⑂ Branch · N messages" / "New branch", "+ Ask".
     Post roots: "Post" column (… Post actions: Edit post) + "Thread · N" column (follow-up box on top
     with a Post/Ask switch and no model menu).
 12. Messages column: branch source block ("From “passage” in …"), ask box at the top ("Ask a follow-up",
     ⌘J; ⇧⌘↵ sends as a branch), client queue, rows newest first. Row: question; meta line with time,
     pill (Queued/Running/Failed), star, branch count, … Answer actions. ↑/↓ move, ⌥↑/⌥↓ reorder.
 13. Answer column: run line (pulse, "Working · activity", elapsed, Show trace, Stop), "Recap: …", the
     answer with highlights and branch anchors, margin markers per paragraph plus an end marker for
     whole-answer branches (tip lists questions, Open/Running). Failed: "Error." + Retry / Edit question;
     stopped: "Stopped after …" + Run again. Answer actions: Show full transcript, Branch from the whole
     answer, Copy thread as Markdown, Retry run, Generate recap, Rename…, then Bookmark/Follow/Move to.
 14. Selection popover: Branch (A), Highlight / Remove highlight (H), Copy. There is no E key in the code;
     Highlight extends an overlapping highlight. While streaming, a note says it is available later.
 15. Command palette: "Type a command or search…"; Research (titles, "N running") and Actions (Home ⌘N,
     Toggle sidebar ⇧⌘G, Open Settings ⌘,, Open Agents).
 16. Agent Setup: "N of M agents ready", per-agent tabs with ready dot, Refresh all; steps Install the CLI,
     Sign in, Refresh status with copyable commands; Setup guide, Next agent, Refresh status.
-->

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--app-bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:5px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none;display:block}
.ic.fill{fill:currentColor}
.tnum{font-variant-numeric:tabular-nums}
kbd,.kbd{font:500 10.5px/1 var(--font);display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:4px;background:var(--kbd-bg);border:1px solid var(--kbd-border);border-bottom-width:1.5px;color:var(--kbd-text);white-space:nowrap}
.hint{display:none}
body.show-hints .hint{display:inline-flex}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sbw,212px) minmax(0,1fr);height:100vh;height:100dvh}
.app.is-rail{grid-template-columns:52px minmax(0,1fr)}
.sidebar{background:var(--nav-bg);border-right:1px solid var(--nav-border);display:flex;flex-direction:column;min-width:0;min-height:0;color:var(--nav-text)}
.app.is-rail .sidebar{display:none}
.rail{display:none}
.app.is-rail .rail{display:flex}
.titlebar{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 8px 0 14px}
.traffic{display:flex;gap:8px;margin-right:8px}
.traffic i{width:12px;height:12px;border-radius:50%;background:var(--traffic-r);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.traffic i:nth-child(2){background:var(--traffic-y)}.traffic i:nth-child(3){background:var(--traffic-g)}
.tb-spacer{flex:1}
.nbtn{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--nav-muted);position:relative}
.nbtn:hover{background:var(--nav-hover);color:var(--nav-strong)}
.nbtn.is-active{background:var(--nav-hover);color:var(--nav-strong)}
.side-body{flex:1;overflow-y:auto;padding:6px 8px 10px;min-height:0;scrollbar-width:thin}
.nav{display:flex;flex-direction:column;gap:1px}
.nrow{position:relative;display:flex;align-items:center;border-radius:6px}
.nrow:hover{background:var(--nav-hover)}
.nrow.is-sel{background:var(--nav-sel);box-shadow:var(--nav-sel-shadow)}
.nrow.is-drop{box-shadow:inset 0 0 0 1.5px var(--accent)}
.nsel{flex:1;min-width:0;display:flex;align-items:center;gap:9px;height:29px;padding:0 8px;border-radius:6px;text-align:left;color:var(--nav-text)}
.nrow.is-sel .nsel{color:var(--nav-sel-text);font-weight:600}
.nrow.is-sel .nsel .ic{color:var(--nav-accent)}
.nsel .ic{color:var(--nav-muted)}
.nlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncount{font-size:11.5px;color:var(--nav-count);font-variant-numeric:tabular-nums;min-width:14px;text-align:right}
.nrow.is-sel .ncount{color:var(--nav-sel-text);opacity:.75}
.nmenu{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:5px;display:none;place-items:center;color:var(--nav-muted);background:inherit}
.nrow:hover .nmenu,.nrow:focus-within .nmenu,.nrow.has-menu .nmenu{display:grid}
.nrow:hover .ncount,.nrow:focus-within .ncount,.nrow.has-menu .ncount{visibility:hidden}
.nrow.is-folder .nmenu+.ncount{visibility:visible}
.nmenu:hover{background:var(--nav-hover);color:var(--nav-strong)}
.nsec{display:flex;align-items:center;justify-content:space-between;margin:16px 0 4px;padding:0 6px 0 8px;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--nav-muted)}
.nsec .nbtn{width:22px;height:22px}
.side-foot{padding:8px;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--nav-border)}
.ws{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:8px;text-align:left;color:var(--nav-text)}
.ws:hover,.ws[aria-expanded="true"]{background:var(--nav-hover)}
.ws-ic{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.ws-copy{flex:1;min-width:0;display:flex;flex-direction:column}
.ws-name{font-weight:600;color:var(--nav-strong);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-path{font-size:11px;color:var(--nav-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px;width:100%;text-align:left;color:var(--nav-text)}
.acct:hover{background:var(--nav-hover)}
.acct .av{width:24px;height:24px;font-size:10px}
.acct b{display:block;font-weight:600;font-size:12.5px;color:var(--nav-strong)}
.acct small{display:block;font-size:11px;color:var(--nav-muted)}
/* rail */
.rail{flex-direction:column;align-items:center;gap:2px;background:var(--nav-bg);border-right:1px solid var(--nav-border);padding:0 0 10px;min-height:0;overflow:hidden}
.rail-top{height:44px;display:grid;place-items:center;flex:none}
.ricon{width:34px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--nav-muted);position:relative;flex:none}
.ricon:hover{background:var(--nav-hover);color:var(--nav-strong)}
.ricon.is-sel{background:var(--nav-sel);color:var(--nav-accent);box-shadow:var(--nav-sel-shadow)}
.ricon[aria-disabled="true"]{opacity:.45;cursor:default}
.rmono{font-weight:700;font-size:12px;width:20px;height:20px;border-radius:5px;display:grid;place-items:center;border:1.5px solid currentColor}
.rdiv{width:22px;height:1px;background:var(--nav-border);margin:6px 0}
.rfolders{display:flex;flex-direction:column;align-items:center;gap:2px;overflow-y:auto;min-height:0}
.rspacer{flex:1}
.rtip{position:fixed;z-index:60;transform:translateY(-50%);background:var(--toast-bg);color:var(--toast-text);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow-sm)}

/* ---------- strip ---------- */
.main{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.strip{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;min-height:0;scrollbar-width:thin;background:var(--app-bg)}
.pairs{display:flex;flex:1 0 auto;min-width:0}
.col{flex:none;display:flex;flex-direction:column;min-height:0;position:relative;height:100%}
.col.feed{width:var(--w-feed,280px);background:var(--list-bg);border-right:1px solid var(--border)}
.chead{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;border-bottom:1px solid var(--border)}
.chead h1,.chead h2{margin:0;font-size:14px;font-weight:650;letter-spacing:-.005em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .spacer{flex:1}
.ibtn{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--text-3);flex:none;position:relative}
.ibtn:hover{background:var(--hover);color:var(--text)}
.ibtn[disabled]{opacity:.4;cursor:default;background:none}
.hbtn{height:26px;padding:0 9px 0 7px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--text-2);border:1px solid var(--border);background:var(--raise);flex:none}
.hbtn:hover{border-color:var(--border-2);color:var(--text)}
.cscroll{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin}
.filler{flex:1 0 220px;display:grid;place-items:center;color:var(--text-3);font-size:13px;padding:24px;text-align:center;min-width:220px}
.filler-in{display:flex;flex-direction:column;align-items:center;gap:10px}
.filler-in .ic{color:var(--text-4)}
.resizer{position:absolute;top:0;bottom:0;right:-4px;width:8px;cursor:col-resize;z-index:5}
.resizer::after{content:"";position:absolute;left:3.5px;top:0;bottom:0;width:1px;background:transparent;transition:background .12s}
.resizer:hover::after,.resizer:focus-visible::after,.resizer.is-drag::after{background:var(--accent)}
.resizer:focus-visible{outline:none}

/* ---------- feed column ---------- */
.feed-composer{padding:12px 12px 10px;border-bottom:1px solid var(--divider)}
.place-composer{padding:12px}
.list{display:flex;flex-direction:column}
.frow{position:relative;display:flex;gap:10px;padding:11px 12px 11px 14px;border-bottom:1px solid var(--divider);cursor:pointer}
.frow:hover{background:var(--row-hover)}
.frow.is-sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.frow.has-children{border-bottom:0}
.frow-hit{position:absolute;inset:0;z-index:0;border-radius:0}
.frow-hit:focus-visible{outline-offset:-2px;border-radius:2px}
.frow > :not(.frow-hit){position:relative;z-index:1;pointer-events:none}
.frow .frow-actions,.frow .frow-actions *{pointer-events:auto}
.frow .frow-main a{pointer-events:auto}
.unread-dot{position:absolute!important;left:4px;top:19px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.av{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;letter-spacing:.01em;background:var(--av-you)}
.av.sm{width:22px;height:22px;border-radius:6px;font-size:9.5px}
.av.xs{width:16px;height:16px;border-radius:4px;font-size:8px}
.av.claude{background:var(--av-claude)}.av.codex{background:var(--av-codex)}.av.grok{background:var(--av-grok)}
.av.you{background:var(--av-you);border-radius:50%}.av.tw{background:var(--av-tw);border-radius:50%}.av.link{background:var(--av-link)}.av.draft{background:transparent;color:var(--text-3);border:1.5px dashed var(--border-2)}
.frow-main{flex:1;min-width:0}
.frow-top{display:flex;align-items:baseline;gap:6px;min-width:0;height:17px}
.frow-from{font-weight:600;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.frow-model{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.frow-time{margin-left:auto;font-size:11.5px;color:var(--text-3);white-space:nowrap;flex:none}
.frow-subj{font-size:13px;color:var(--text);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow.is-unread .frow-subj,.frow.is-unread .frow-from{font-weight:700}
.frow-snip{font-size:12.5px;color:var(--text-2);margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.frow-chips{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.frow-chips:empty{display:none}
.frow-actions{position:absolute!important;right:8px;top:7px;display:none;align-items:center;gap:1px;padding:2px;border-radius:7px;background:var(--raise);border:1px solid var(--border);box-shadow:var(--shadow-sm);z-index:3!important}
.frow:hover .frow-actions,.frow:focus-within .frow-actions,.frow.has-menu .frow-actions{display:flex}
.frow:hover .frow-time,.frow:focus-within .frow-time,.frow.has-menu .frow-time{visibility:hidden}
.qa{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--text-3)}
.qa:hover{background:var(--hover);color:var(--text)}
.qa.is-on{color:var(--accent)}
.qa.grip{cursor:grab;width:16px}
.fchild{position:relative;display:flex;align-items:center;gap:7px;padding:4px 12px 4px calc(54px + var(--indent,0) * 14px);font-size:12.5px;color:var(--text-2);cursor:pointer}
.fchild:hover{background:var(--row-hover)}
.fchild.is-sel{background:var(--sel)}
.fchild.is-last{padding-bottom:10px;border-bottom:1px solid var(--divider)}
.fchild::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:1px;background:var(--border)}
.fchild.is-last::before{bottom:50%}
.fchild .ic{color:var(--text-3)}
.fchild .ic.star{color:#e0a400}
.fchild-text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchild .fchild-hit{position:absolute;inset:0}
.fchild > :not(.fchild-hit){position:relative;pointer-events:none}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--run-dot);flex:none;animation:pulse 1.6s ease-in-out infinite}
.sdot.is-failed{background:var(--err);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.tray{border-bottom:1px solid var(--divider)}
.tray-head{display:flex;align-items:center;gap:7px;height:34px;padding:0 8px 0 14px;background:var(--app-bg);border-bottom:1px solid var(--divider);cursor:pointer;position:sticky;top:0;z-index:4;color:var(--text-2)}
.tray-head .ic{color:var(--text-3)}
.tray-name{font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.tray-name:hover{color:var(--accent-text);text-decoration:underline;text-underline-offset:2px}
.tray-count{font-size:11px;color:var(--text-3);background:var(--q-weak);border-radius:9px;padding:0 6px;line-height:16px;font-variant-numeric:tabular-nums}
.tray-chev{margin-left:auto;width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--text-3);transition:transform .15s}
.tray-chev:hover{background:var(--hover)}
.tray.is-collapsed .tray-chev{transform:rotate(-90deg)}
.tray.is-collapsed .tray-body{display:none}
.tray.is-collapsed{border-bottom:0}
.empty{padding:18px 16px;color:var(--text-3);font-size:12.5px;line-height:1.5}
.empty.big{padding:36px 22px;text-align:center}
.empty.big b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.confirm-bar{margin:10px 12px;padding:10px 12px;border:1px solid var(--err);background:var(--err-weak);border-radius:8px;font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.confirm-bar .row{display:flex;gap:6px;justify-content:flex-end}
/* highlights view */
.hl-group{padding:12px 14px;border-bottom:1px solid var(--divider)}
.hl-q{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);margin-bottom:8px;font-weight:600}
.hl-item{position:relative;display:block;width:100%;text-align:left;padding:8px 32px 8px 10px;border-radius:7px;border:1px solid var(--border);background:var(--raise);font-size:12.5px;line-height:1.5;color:var(--text-2);margin-top:6px}
.hl-item:hover{border-color:var(--border-2);background:var(--row-hover)}
.hl-item mark{background:var(--hl);color:var(--text);border-radius:2px;padding:0 1px}
.hl-x{position:absolute;right:5px;top:6px;width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:var(--text-3)}
.hl-x:hover{background:var(--hover);color:var(--text)}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:19px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--q-weak);color:var(--q-text);flex:none}
.chip.run{background:var(--run-weak);color:var(--run)}
.chip.run::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--run-dot);animation:pulse 1.6s ease-in-out infinite}
.chip.ok{background:var(--ok-weak);color:var(--ok)}
.chip.err{background:var(--err-weak);color:var(--err)}
.chip.note{background:var(--note-head);color:var(--note-text)}
.chip.plain{background:transparent;border:1px solid var(--border);color:var(--text-3);font-weight:500}
.model-chip{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;background:var(--q-weak);color:var(--text-2);font-size:11px;font-weight:500;white-space:nowrap}

/* ---------- composer (reply box) ---------- */
.rbox{border:1px solid var(--border-2);border-radius:10px;background:var(--raise);box-shadow:var(--shadow-sm);transition:border-color .12s,box-shadow .12s,background .12s;position:relative}
.rbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.rbox.is-post{background:var(--note-bg);border-color:var(--note-border)}
.rbox.is-post:focus-within{border-color:var(--note-rule);box-shadow:0 0 0 3px var(--note-head)}
.rbox textarea{display:block;width:100%;border:0;background:transparent;resize:none;padding:9px 11px;font-size:13.5px;line-height:1.45;min-height:38px;max-height:180px;overflow-y:auto}
.rbox textarea::placeholder{color:var(--text-3)}
.rbox textarea:focus-visible{outline:none}
.rbox-mode{display:flex;align-items:center;gap:6px;padding:7px 8px 0 11px;font-size:12px;color:var(--text-2)}
.rbox-mode b{color:var(--text)}
.rbox-mode .ibtn{width:22px;height:22px;margin-left:auto}
.rbox-bar{display:flex;align-items:center;gap:6px;padding:0 6px 6px 6px}
.rbox.home:not(.is-open) .rbox-bar{display:none}
.rbox-bar .spacer{flex:1}
.rbox-keys{font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.rbox.thread .rbox-keys{opacity:0;transition:opacity .12s}
.rbox.thread:focus-within .rbox-keys{opacity:1}
.send{height:28px;min-width:28px;padding:0 8px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:600;flex:none}
.send:hover{background:var(--accent-hover)}
.send[disabled]{opacity:.38;cursor:default}
.rbox.is-post .send{background:var(--note-rule);color:#1d1600}
.rbox-after{display:flex;justify-content:flex-end;padding-top:6px}
.linkbtn{font-size:12px;color:var(--text-2);padding:3px 6px;border-radius:5px;font-weight:500}
.linkbtn:hover{background:var(--hover);color:var(--text)}
.aps{display:inline-flex;border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px;background:var(--app-bg)}
.rbox.is-post .aps{background:transparent;border-color:var(--note-border)}
.aps-opt{height:24px;display:inline-flex;align-items:center;gap:5px;padding:0 8px 0 5px;border-radius:5px;font-size:12px;font-weight:600;color:var(--text-3)}
.aps-opt[aria-checked="true"]{background:var(--raise);color:var(--text);box-shadow:var(--shadow-sm),0 0 0 1px var(--border)}
.rbox.is-post .aps-opt[aria-checked="true"]{background:var(--note-head);color:var(--note-text);box-shadow:0 0 0 1px var(--note-border)}
.aps-opt:hover{color:var(--text)}
.aps-model{font-weight:500;color:var(--text-3);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbox-foot{padding:8px 11px;border-top:1px solid var(--divider);font-size:12px;color:var(--text-2);display:flex;gap:8px;align-items:center}
.rbox-note{padding:0 11px 8px;font-size:11.5px;color:var(--text-3)}

/* ---------- pairs ---------- */
.pair{flex:none;display:flex;flex-direction:column;min-height:0;height:100%;border-right:1px solid var(--border);background:var(--panel)}
.pair-head{flex:none;min-height:44px;display:flex;align-items:center;gap:6px;padding:7px 10px 7px 12px;border-bottom:1px solid var(--border);background:var(--panel)}
.pair-title{margin:0;font-size:14px;font-weight:650;letter-spacing:-.005em;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.pair-title .count{color:var(--text-3);font-weight:500}
.pair-title .ic{display:inline-block;vertical-align:-2px;margin-right:4px;color:var(--text-3)}
.pair-body{flex:1;display:flex;min-height:0}
.pcol{position:relative;display:flex;flex-direction:column;min-height:0}
.pcol.msgs{width:var(--w-msgs,240px);background:var(--msgs-bg);border-right:1px solid var(--border)}
.pcol.ans{width:var(--w-ans,520px);background:var(--panel)}
.pcol.post{width:var(--w-ans,520px);background:var(--panel);border-right:1px solid var(--border)}
.pcol.thread{width:var(--w-msgs,240px);background:var(--msgs-bg)}
.pcol .chead{background:var(--panel)}
.hist{display:flex;gap:1px;margin-right:2px}
.hist .ibtn{width:24px;height:24px}
.msgs-in{padding:10px 10px 18px;display:flex;flex-direction:column;gap:8px}
.source{display:flex;gap:7px;padding:8px 10px;border-radius:8px;background:var(--q-weak);font-size:12px;color:var(--text-2);line-height:1.45}
.source .ic{color:var(--text-3);margin-top:2px}
.source q{color:var(--text);font-weight:500}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.card{background:var(--raise);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow-sm)}
.mrow{position:relative;padding:9px 10px 7px;cursor:pointer}
.mrow:hover{border-color:var(--border-2)}
.mrow.is-sel{border-color:var(--sel-border);background:var(--sel);box-shadow:inset 3px 0 0 var(--accent)}
.mrow.is-drag-over{box-shadow:0 -2px 0 var(--accent)}
.mrow-hit{position:absolute;inset:0;border-radius:9px}
.mrow > :not(.mrow-hit){position:relative;pointer-events:none}
.mrow .mrow-meta button{pointer-events:auto}
.mrow-head{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.mrow-from{font-weight:600;font-size:12px}
.mrow-time{margin-left:auto;font-size:11px;color:var(--text-3)}
.mrow-q{font-size:13px;line-height:1.45;color:var(--text);overflow-wrap:anywhere}
.mrow-meta{display:flex;align-items:center;gap:4px;margin-top:6px;min-height:22px}
.mbtn{height:22px;min-width:22px;padding:0 4px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;gap:3px;color:var(--text-3);font-size:11.5px}
.mbtn:hover{background:var(--hover);color:var(--text)}
.mbtn.is-on{color:#d49b00}
.mbtn.is-open{color:var(--accent-text);background:var(--accent-weak)}
.mbtn.more{margin-left:auto}
.mrow.is-queue{border-style:dashed;background:transparent;box-shadow:none}
/* answer card */
.ans-in{padding:14px 16px 40px}
.acard{border:1px solid var(--border);border-radius:10px;background:var(--raise);box-shadow:var(--shadow-sm)}
.acard-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--divider)}
.acard-who{flex:1;min-width:0}
.acard-who .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.acard-who b{font-weight:650;font-size:13px}
.acard-who .l2{font-size:11.5px;color:var(--text-3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard-body{padding:12px 14px 14px}
.runline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--divider);background:var(--run-weak);font-size:12px;color:var(--run)}
.runline .act{flex:1;min-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.runline .pdot{width:7px;height:7px;border-radius:50%;background:var(--run-dot);animation:pulse 1.6s ease-in-out infinite;flex:none}
.tbtn{height:24px;padding:0 9px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border:1px solid var(--border-2);background:var(--raise);color:var(--text)}
.tbtn:hover{border-color:var(--text-3)}
.tbtn.ghost{background:transparent}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tbtn.primary:hover{background:var(--accent-hover)}
.tbtn.danger{background:var(--err);border-color:var(--err);color:#fff}
.lbtn{font-size:12px;font-weight:600;color:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent)}
.trace{margin:0;padding:8px 14px 10px;border-bottom:1px solid var(--divider);font:11.5px/1.6 var(--mono);color:var(--text-2);list-style:none;background:var(--msgs-bg)}
.trace li{display:flex;gap:8px}
.trace li span:first-child{color:var(--text-3);width:62px;flex:none}
.recap{margin:0 0 12px;padding:8px 10px;border-radius:7px;background:var(--accent-weak);color:var(--text);font-size:12.5px;line-height:1.5}
.recap .recap-k{font-weight:700;color:var(--accent-text)}
.recap.pending{display:flex;align-items:center;gap:7px;color:var(--text-2)}
.state-note{padding:12px 14px;font-size:12.5px;color:var(--text-2);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.state-note b{color:var(--text)}
.state-note.err b{color:var(--err)}
.answer-body{position:relative;padding-right:30px;font-size:14px;line-height:1.62;color:var(--text)}
.answer-body p,.answer-body ul,.answer-body ol,.answer-body table,.answer-body h4{position:relative;margin:0 0 11px}
.answer-body h4{font-size:13px;margin-top:16px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2)}
.answer-body ul,.answer-body ol{padding-left:20px}
.answer-body li{margin:2px 0}
.answer-body strong{font-weight:650}
.answer-body table{border-collapse:collapse;font-size:12.5px;width:100%;max-width:420px}
.answer-body th,.answer-body td{border-bottom:1px solid var(--divider);padding:6px 10px 6px 0;text-align:left}
.answer-body th{font-weight:600;color:var(--text-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.answer-body td.num{font-variant-numeric:tabular-nums}
.answer-body .cap{font-size:12px;color:var(--text-3)}
.answer-body a{color:var(--accent-text);text-decoration:none}
.answer-body a:hover{text-decoration:underline}
.answer-body mark.hl{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px;cursor:pointer}
.answer-body mark.hl:hover{background:var(--hl-hover)}
.answer-body .anchor{text-decoration:underline;text-decoration-color:var(--anchor);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer}
.answer-body .anchor.is-pending{background:var(--accent-weak)}
.answer-body.is-stream > :last-child::after,.answer-body.is-stream:empty::after{content:"";display:inline-block;width:7px;height:14px;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:pulse 1s steps(2) infinite}
.answer-body ::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.marker{position:absolute;right:-30px;top:1px;height:22px;min-width:22px;padding:0 4px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:2px;color:var(--text-3);border:1px solid var(--border);background:var(--raise);font-size:11px;font-weight:600;z-index:2;line-height:1}
.marker:hover{color:var(--accent-text);border-color:var(--sel-border)}
.marker.is-open{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.marker.is-running{border-color:var(--run-dot);color:var(--run)}
.end-markers{display:flex;justify-content:flex-end;position:relative;height:24px;margin-right:-30px}
.end-markers .marker{position:static}
.mtip{position:fixed;z-index:70;width:260px;background:var(--raise);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:6px;font-size:12px;pointer-events:none}
.mtip-h{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);padding:4px 6px 6px}
.mtip-i{padding:6px;border-radius:6px;display:flex;flex-direction:column;gap:2px}
.mtip-i+.mtip-i{border-top:1px solid var(--divider)}
.mtip-i b{font-weight:600;color:var(--text)}
.mtip-i small{color:var(--text-3)}
.sources{border-top:1px solid var(--divider);padding:10px 14px 12px;display:flex;flex-direction:column;gap:6px}
.sources h5{margin:0;font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.src{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);text-align:left;padding:5px 8px;border:1px solid var(--border);border-radius:7px;background:var(--panel)}
.src:hover{border-color:var(--border-2)}
.src .ic{color:var(--text-3)}
.src small{color:var(--text-3);margin-left:auto;white-space:nowrap}
.acard-foot{display:flex;align-items:center;gap:6px;padding:8px 10px 8px 14px;border-top:1px solid var(--divider);font-size:11.5px;color:var(--text-3)}
.acard-foot .spacer{flex:1}
/* post as internal note */
.note{background:var(--note-bg);border-color:var(--note-border)}
.note .acard-head{border-bottom-color:var(--note-border);background:var(--note-head);border-radius:9px 9px 0 0}
.post-body{font-size:14px;line-height:1.6}
.post-body ul{padding-left:20px;margin:0 0 8px}
.post-body li{margin:2px 0}
.post-body p{margin:0 0 8px}
.linkcard{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--panel);text-align:left;width:100%}
.linkcard .ic{color:var(--text-3);margin-top:2px}
.linkcard b{display:block;font-weight:600;font-size:13px}
.linkcard small{color:var(--text-3)}
.tweet{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--panel)}
.tweet-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tweet-h b{font-weight:650}
.tweet-h small{color:var(--text-3)}
.trow{position:relative;padding:9px 10px;cursor:pointer}
.trow .trow-hit{position:absolute;inset:0;border-radius:9px}
.trow > :not(.trow-hit){position:relative;pointer-events:none}
.trow.is-sel{border-color:var(--sel-border);background:var(--sel)}
.trow-meta{font-size:11.5px;color:var(--text-3);margin-top:4px;display:flex;gap:6px;align-items:center}

/* ---------- popovers, menus, dialogs ---------- */
.menu{position:fixed;z-index:80;min-width:200px;max-width:300px;background:var(--raise);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:5px;font-size:13px;overflow-y:auto}
.menu-title{font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:7px 8px 4px}
.mi{width:100%;display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:6px;text-align:left;color:var(--text)}
.mi .ic{color:var(--text-3)}
.mi:hover,.mi:focus-visible{background:var(--accent);color:var(--on-accent);outline:none}
.mi:hover .ic,.mi:focus-visible .ic,.mi:hover .mi-hint,.mi:focus-visible .mi-hint{color:var(--on-accent)}
.mi:hover kbd,.mi:focus-visible kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#fff}
.mi[aria-disabled="true"]{opacity:.45;cursor:default}
.mi[aria-disabled="true"]:hover{background:none;color:var(--text)}
.mi-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi-hint{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.mi-check{width:16px;display:grid;place-items:center;color:var(--accent)}
.msep{height:1px;background:var(--divider);margin:5px 4px}
.mnote{font-size:11.5px;color:var(--text-3);padding:6px 8px 4px;line-height:1.4}
.selpop{position:fixed;z-index:85;display:flex;flex-direction:column;background:var(--raise);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:4px;transform:translate(-50%,-100%)}
.selpop-row{display:flex;gap:2px}
.selpop button{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--text)}
.selpop button:hover:not([disabled]){background:var(--hover)}
.selpop button[disabled]{opacity:.45;cursor:default}
.selpop button .ic{color:var(--text-3)}
.selpop .mnote{max-width:250px;padding:4px 8px 3px}
.scrim{position:fixed;inset:0;z-index:90;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}
.dialog{width:min(620px,100%);max-height:80vh;display:flex;flex-direction:column;background:var(--raise);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.dlg-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 18px;border-bottom:1px solid var(--divider)}
.dlg-head h2{margin:0;font-size:15px;font-weight:650;flex:1}
.dlg-body{overflow-y:auto;padding:16px 18px 18px;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 14px 0 14px;border-bottom:1px solid var(--divider)}
.tab{height:32px;padding:0 10px;font-size:12.5px;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.tab:hover{color:var(--text)}
.srow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--divider)}
.srow:last-child{border-bottom:0}
.srow label,.srow .sl{flex:1;font-size:13px}
.srow .sh{display:block;font-size:11.5px;color:var(--text-3);margin-top:2px}
.srow select,.srow input[type=text],.field{height:28px;border:1px solid var(--border-2);border-radius:6px;background:var(--panel);padding:0 8px;font-size:12.5px}
.field.ta{height:auto;width:100%;padding:7px 8px;resize:vertical;min-height:64px}
.switch{appearance:none;width:30px;height:18px;border-radius:9px;background:var(--border-2);position:relative;cursor:pointer;flex:none;transition:background .12s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .12s}
.switch:checked{background:var(--accent)}
.switch:checked::after{left:14px}
.agent-tabs{display:flex;gap:4px;margin:12px 0}
.agent-tab{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-2)}
.agent-tab[aria-selected="true"]{border-color:var(--accent);color:var(--text);background:var(--accent-weak)}
.adot{width:7px;height:7px;border-radius:50%;background:var(--text-4)}
.adot.ok{background:var(--ok)}
.apanel{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.apanel-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--divider)}
.apanel-h b{flex:1}
.steps{list-style:none;margin:0;padding:6px 14px}
.step{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--divider)}
.step:last-child{border-bottom:0}
.stepn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;border:1.5px solid var(--border-2);color:var(--text-3);flex:none}
.step.done .stepn{background:var(--ok);border-color:var(--ok);color:#fff}
.step.active .stepn{border-color:var(--accent);color:var(--accent-text)}
.step-t{font-weight:600}
.step-h{font-size:12px;color:var(--text-3);margin-top:2px}
.cmd{display:flex;align-items:center;gap:6px;margin-top:6px;font:12px var(--mono);background:var(--msgs-bg);border:1px solid var(--border);border-radius:6px;padding:4px 4px 4px 9px}
.cmd code{flex:1}
.afoot{display:flex;gap:6px;align-items:center;padding:10px 14px;border-top:1px solid var(--divider)}
.afoot .spacer{flex:1}
.palette{width:min(600px,100%);background:var(--raise);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--divider)}
.pal-in .ic{color:var(--text-3)}
.pal-in input{flex:1;height:48px;border:0;background:transparent;font-size:15px}
.pal-list{overflow-y:auto;padding:6px;min-height:0}
.pal-sec{font-size:10.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:8px 8px 4px}
.pal-item{width:100%;display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:7px;text-align:left}
.pal-item .ic{color:var(--text-3)}
.pal-item.is-sel{background:var(--sel)}
.pal-item .mi-l{font-size:13px}
.pal-foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--divider);font-size:11.5px;color:var(--text-3)}
.pal-foot span{display:inline-flex;gap:5px;align-items:center}
.toasts{position:fixed;left:calc(var(--toast-left,212px) + 14px);bottom:16px;z-index:95;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.app.is-rail ~ .toasts{--toast-left:52px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-width:240px;max-width:360px;padding:8px 8px 8px 14px;border-radius:9px;background:var(--toast-bg);color:var(--toast-text);box-shadow:var(--shadow);font-size:12.5px;animation:tin .18s ease-out}
.toast .t-msg{flex:1}
.toast .t-undo{color:var(--toast-link);font-weight:650;padding:3px 6px;border-radius:5px}
.toast .t-undo:hover{background:rgba(255,255,255,.1)}
.toast .t-x{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;color:rgba(255,255,255,.6)}
.toast .t-x:hover{background:rgba(255,255,255,.1);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,30%{box-shadow:0 0 0 4px var(--hl-hover)}100%{box-shadow:0 0 0 4px transparent}}
.vswitch{position:fixed;right:14px;bottom:14px;z-index:99;display:flex;align-items:center;gap:3px;padding:4px;border-radius:10px;background:var(--raise);border:1px solid var(--border);box-shadow:var(--shadow)}
.vswitch .lab{font-size:11px;color:var(--text-3);padding:0 6px}
.vswitch button{width:26px;height:24px;border-radius:6px;font-size:11.5px;font-weight:650;color:var(--text-2)}
.vswitch button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* ---------- avatars hidden; author and model stay in the header line ---------- */
.av:not(.ws-ic):not(.keep){display:none}
.frow{padding-left:16px}
.fchild{padding-left:calc(30px + var(--indent,0) * 14px)}
.fchild::before{left:20px}
.unread-dot{left:6px}
.frow.is-post{background:color-mix(in srgb,var(--note-bg) 55%,transparent)}
[data-variant] .frow.is-post.is-sel{background:var(--sel)}

/* ---------- narrow window ---------- */
@media (max-width:700px){
  .app,.app.is-rail{grid-template-columns:52px minmax(0,1fr)}
  .app .sidebar{display:none}
  .app .rail{display:flex}
  .app.drawer-open .sidebar{display:flex;position:fixed;left:0;top:0;bottom:0;width:min(280px,86vw);z-index:92;box-shadow:var(--shadow)}
  .drawer-scrim{position:fixed;inset:0;background:var(--scrim);z-index:91}
  .strip{scroll-snap-type:x mandatory}
  .col.feed,.pcol{scroll-snap-align:start}
  .pair-head{position:sticky;left:0;max-width:calc(100vw - 52px)}
  .toasts{left:62px;right:10px}
  .toast{min-width:0}
  .dialog,.palette{max-height:86vh}
  .scrim{padding-top:6vh}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}

  <aside class="rail" id="rail" aria-label="Sidebar"></aside>

    <div class="strip" id="strip">
      <section class="col feed" id="feedCol" aria-label="Feed"></section>
      <div class="pairs" id="pairs"></div>

</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

/* ================= navigation ================= */
function snapshot() { return { openTree: S.openTree, levels: JSON.parse(JSON.stringify(S.levels)), openDraft: S.openDraft }; }

}

  const path = [];

  while (cur) { const n = NODES[cur]; const head = n.head; path.unshift({ head, sel: path.length ? null : cid }); cur = NODES[head].parent; }
  for (let i = 0; i < path.length - 1; i++) path[i].sel = NODES[path[i + 1].head].parent;

}

/* ================= runs (fake streaming) ================= */
function startRun(id, text, opts = {}) {
  const n = NODES[id];
  Object.assign(n, { status: "running", text: "", target: text, pos: 0, elapsed: 0, html: "", recap: null });
  n.tools = opts.tools || [["web_fetch", "nrel.gov/docs/atb-2026"], ["web_fetch", "sandia.gov/ess/handbook"], ["read_file", "notes/ch3-outline.md"]];
  clearInterval(runs[id]);
  const words = text.split(/(\s+)/);
  let delay = 14;
  runs[id] = setInterval(() => {
    if (delay > 0) { delay--; updateRun(id); return; }
    const step = n.slow ? 1 : 3;
    n.pos = Math.min(words.length, n.pos + step);
    n.text = words.slice(0, n.pos).join("");

  }, n.slow ? 420 : 60);
}

}

}

}

    const lab = $(`[data-act-label="${id}"]`); if (lab) lab.textContent = n.elapsed < 2 && !n.text ? "Starting…" : `Working · ${activityFor(n)}`;

function sendHome() {

  const id = "t" + ++seq, nid = "n" + seq;
  const place = S.view.kind === "folder" ? S.view.folderId : "unfiled";
  if (S.askMode === "network") {
    const url = /^https?:\/\/\S+$/.test(text);
    TREES.unshift(url ? { id, kind: "link", root: nid, title: text, place, time: "now" } : { id, kind: "post", root: nid, title: text.split("\n")[0].slice(0, 60), place, time: "now" });
    NODES[nid] = url ? { tree: id, parent: null, head: nid, seq: ++seq, post: true, time: "now", link: { title: text.replace(/^https?:\/\//, ""), url: text.replace(/^https?:\/\//, ""), domain: text.replace(/^https?:\/\//, "").split("/")[0] } }

function sendThread(key, opts = {}) {

    const did = key.slice(6);
    DRAFTS = DRAFTS.filter((d) => d.id !== did);
    S.openDraft = null; S.homeText = text; S.askMode = "ai"; sendHome(); return;
  }
  if (key.startsWith("post:")) {

  }

function cycleColumns(dir) {
  const cols = $$("#feedCol, .pcol");
  const cur = cols.findIndex((c) => c.contains(document.activeElement));
  const next = cols[(cur + dir + cols.length) % cols.length];
  if (!next) return;
  const target = next.querySelector(".mrow.is-sel .mrow-hit, .frow.is-sel .frow-hit, .cscroll") || next;
  if (!target.hasAttribute("tabindex") && !/BUTTON|TEXTAREA|INPUT/.test(target.tagName)) target.setAttribute("tabindex", "-1");

}
document.addEventListener("keydown", (e) => {

    if (menuEl) return;
    if ($("#dlg")) { e.preventDefault(); closeDialog(); return; }
    if (selState) { hideSel(); getSelection().removeAllRanges(); return; }
    if (S.drawer) { closeDrawer(); return; }
    if (e.target.closest && e.target.closest('form[data-composer="new"]')) { cancelPending(); return; }
    if (e.target.id === "homeInput") { e.target.blur(); if (!S.homeText.trim()) { S.homeOpen = false; $("#homeBox")?.classList.remove("is-open"); } return; }
  }

  if (mod && e.shiftKey && k === "g") { e.preventDefault(); toggleRail(); return; }

  if (mod && !e.shiftKey && e.code === "BracketRight") { e.preventDefault(); goForward(); return; }

  }

    rows[i]?.click();
    return;
