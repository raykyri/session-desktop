<!doctype html>
<!--
  Session · Ulysses restyle (round 3). Same layout and UX as the current app; only the visual
  language follows Ulysses (typography, materials, list rows, markup, quiet statistics, dark mode).

  INVENTORY OF THE CURRENT APP (from src/App.tsx, src/components/research/*, src/styles/*)
  1. Window shell: sidebar (full, ~216px) or collapsed 52px rail, then the column area. ⇧⌘G toggles the
     sidebar; below a minimum width the rail is forced and its expand button is disabled.
  2. Sidebar header: window buttons, Collapse sidebar (⇧⌘G), then Settings (⌘,), Agents, Light/Dark mode.
  3. Sidebar rows, in order: Home (⌘N hint while ⌘ is held), Bookmarks, Highlights; section "Folders" with
     a + (New folder); Drafts, user folders (… menu: Rename…, Delete…), Archive. Rows carry no counts.
     Home and folders are drop targets.
  4. Sidebar footer: workspace switcher (name + path, ⌘O): workspaces, Add workspace…, Rename “…”…,
     Open in Finder, Move workspace folder…, Remove workspace…; then the GitHub account control.
  5. Rail: expand button, Home, Bookmarks, Highlights, divider, folder icons (user folders as monograms),
     New folder, footer controls; tooltips beside icons.
  6. Column strip (horizontal scroll): the feed column, then one [messages | answer] pair per level (the
     root conversation, then each open branch). Columns resize by dragging their edges; ⌃Tab / ⌃⇧Tab move
     between columns.
  7. Feed column (Home): header "Home" + "+ Ask"; the ask box ("Ask a question, or paste a link to save")
     with the Ask/Post switch (agent icon segment, second press opens the model menu with Effort and Custom
     model; Users segment = Post to network), Save draft, send. Then Unfiled cards, then trays for Drafts,
     each folder and Archive (collapsible header with Open link). Bookmarks / Highlights / folder / Drafts /
     Archive pages replace the feed column's content.
  8. Feed card: title, question excerpt, unread dot ("Updated"), running dot, child rows (follow-ups and
     starred branches, running dot), … menu (Generate recap, Rename, Archive, Delete) and Bookmark / Follow /
     Move to menu. Links and posts are cards too.
  9. Pair header: back/forward (root), title or "Branch · N messages" / "New branch", "+ Ask" (Go to the ask
     box), … menu (Bookmark, Follow, Move to …, New folder…).
 10. Messages column: one row per question (text, time, star, branch count, …), selected row, Running /
     Queued chips; the follow-up composer ("Ask a follow-up", ⌘J; Send ↵ or ⌘↵ per setting). A branch's
     messages column starts with the quoted passage.
 11. Answer column: run status line ("Working · reading …", elapsed, Stop; "Queued"; "Stopped after …"),
     recap, answer markdown, highlights, branch markers in the right gutter (per paragraph, or "whole answer"
     at the end; click opens the branch as the next pair, again closes it), footer (word count, duration,
     Copy, … Answer actions: Show full transcript, Branch from the whole answer, Copy thread as Markdown,
     Retry run, Generate recap, Rename…).
 12. Selection popover on answer text: Branch (A), Highlight (H) / Remove highlight, Copy.
 13. Surfaces: command palette (⌘K, "Type a command or search…": Home, Toggle sidebar, Open Settings, Open
     Agents, research titles), Settings (Basic / Remotes tabs), Agents dialog (per-agent tabs: Install,
     Sign in, Refresh status, Copy command), notifications stack, browser overlay for sources (⇧⌘E).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session · Ulysses restyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --write:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --side:#E9E9EC; --side-line:#D9D9DE; --feed:#F5F5F7; --msgs:#FAFAFB; --doc:#FFFFFF; --pop:#FFFFFF;
  --line:#E2E2E6; --line-2:#ECECEF;
  --text:#1C1C1E; --text-2:#55555D; --text-3:#8C8C94; --markup:#A9B0BA;
  --accent:#B67A06; --gold:#E7AA2A; --accent-soft:#FCF3DA; --mark:#FBE6A8; --anchor:rgba(231,170,42,.16);
  --sel:#E3E3E8; --sel-focus:#FBEFCB; --hover:rgba(0,0,0,.04); --row-sel:#ECECF0;
  --card:#FFFFFF; --card-line:#E6E6EA; --field:#FFFFFF;
  --run:#B67A06; --ok:#2E8B57; --fail:#C2410C;
  --focus:#2F6FEB; --hud:rgba(34,34,37,.97); --hud-text:#F4F4F5; --hud-dim:#A1A1AA;
  --shadow:0 10px 30px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08);
  --scrim:rgba(20,20,22,.22);
  --tl-r:#FF5F57; --tl-y:#FEBC2E; --tl-g:#28C840;
  --row-pad:9px; --fs-ans:16.5px; --lh-ans:1.65;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --side:#1D1D20; --side-line:#2E2E33; --feed:#202023; --msgs:#1E1E21; --doc:#19191B; --pop:#28282C;
    --line:#2F2F34; --line-2:#28282C;
    --text:#E8E8EA; --text-2:#B2B2BA; --text-3:#7D7D86; --markup:#5E6773;
    --accent:#E7B550; --gold:#E2AA3C; --accent-soft:rgba(231,181,80,.11); --mark:rgba(231,181,80,.30); --anchor:rgba(231,181,80,.14);
    --sel:#2D2D32; --sel-focus:rgba(231,181,80,.16); --hover:rgba(255,255,255,.05); --row-sel:#2A2A2F;
    --card:#26262A; --card-line:#33333A; --field:#232327;
    --run:#E7B550; --ok:#4CB97A; --fail:#F08A5D;
    --focus:#5B8DEF; --hud:rgba(56,56,60,.98);
    --shadow:0 12px 34px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
    --scrim:rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --side:#1D1D20; --side-line:#2E2E33; --feed:#202023; --msgs:#1E1E21; --doc:#19191B; --pop:#28282C;
  --line:#2F2F34; --line-2:#28282C;
  --text:#E8E8EA; --text-2:#B2B2BA; --text-3:#7D7D86; --markup:#5E6773;
  --accent:#E7B550; --gold:#E2AA3C; --accent-soft:rgba(231,181,80,.11); --mark:rgba(231,181,80,.30); --anchor:rgba(231,181,80,.14);
  --sel:#2D2D32; --sel-focus:rgba(231,181,80,.16); --hover:rgba(255,255,255,.05); --row-sel:#2A2A2F;
  --card:#26262A; --card-line:#33333A; --field:#232327;
  --run:#E7B550; --ok:#4CB97A; --fail:#F08A5D;
  --focus:#5B8DEF; --hud:rgba(56,56,60,.98);
  --shadow:0 12px 34px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.45);
  color-scheme:dark;
}
/* variants: styling only */
[data-variant="b"]{--write:"Source Serif 4",Charter,"Iowan Old Style",Georgia,serif;--fs-ans:17.5px;--lh-ans:1.6}
[data-variant="d"]{--row-pad:6px;--fs-ans:15.5px;--lh-ans:1.55}
[data-variant="d"] .side{--side:var(--feed)}
[data-variant="d"] .side,[data-variant="d"] .rail{background:var(--doc)}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--doc);color:var(--text);font:13px/1.4 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:5px}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mk{color:var(--markup);font-weight:400}
kbd{font:11px var(--ui);color:var(--text-3);border:1px solid var(--line);border-radius:4px;padding:0 4px}

.app{display:flex;height:100vh;width:100vw;overflow:hidden}
/* ---------- sidebar ---------- */
.side{width:216px;flex:none;background:var(--side);border-right:1px solid var(--side-line);display:flex;flex-direction:column;min-height:0}
.app.rail-mode .side{display:none}
.side-head{height:46px;display:flex;align-items:center;gap:2px;padding:0 8px 0 14px;flex:none}
.tl{display:flex;gap:8px;margin-right:10px}
.tl i{width:12px;height:12px;border-radius:50%;display:block}
.tl i:nth-child(1){background:var(--tl-r)}.tl i:nth-child(2){background:var(--tl-y)}.tl i:nth-child(3){background:var(--tl-g)}
.ib{width:28px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text-2);position:relative}
.ib:hover{background:var(--hover);color:var(--text)}
.ib[aria-pressed="true"],.ib.on{color:var(--accent)}
.ib[aria-disabled="true"]{opacity:.4;cursor:default}
.sp{flex:1}
.nav{padding:4px 8px}
.row{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:7px;text-align:left;font-size:13px;color:var(--text);position:relative}
.row .i{color:var(--text-3)}
.row:hover{background:var(--hover)}
.row[aria-current="page"]{background:var(--sel)}
.row[aria-current="page"] .i{color:var(--accent)}
.row .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .hint{font-size:11px;color:var(--text-3);display:none}
body.hints .row .hint{display:inline}
.nav-row{position:relative}
.nav-row .more{position:absolute;right:4px;top:3px;opacity:0}
.nav-row:hover .more,.nav-row .more:focus-visible{opacity:1}
.sec{display:flex;align-items:center;justify-content:space-between;padding:14px 8px 4px 16px;font-size:11px;font-weight:600;color:var(--text-3);letter-spacing:.02em}
.sec .ib{width:24px;height:22px}
.side-foot{margin-top:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.wsbtn,.acct{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:9px;text-align:left;background:var(--hover)}
.wsbtn:hover,.acct:hover{background:var(--sel)}
.wsbtn b,.acct b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsbtn small,.acct small{display:block;font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsbtn>span,.acct>span:not(.av){flex:1;min-width:0}
.ask textarea:focus-visible,.fu textarea:focus-visible{outline:none}
.av{width:22px;height:22px;border-radius:50%;background:var(--text-3);color:var(--doc);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
/* rail */
.rail{width:52px;flex:none;background:var(--side);border-right:1px solid var(--side-line);display:none;flex-direction:column;align-items:center;padding:8px 0;gap:2px}
.app.rail-mode .rail{display:flex}
.rail .top{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.rail .tl{flex-direction:row;gap:4px;margin:0}
.rail .tl i{width:9px;height:9px}
.ri{width:36px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);position:relative}
.ri:hover{background:var(--hover);color:var(--text)}
.ri[aria-current="page"]{background:var(--sel);color:var(--accent)}
.ri .mono{font-size:12px;font-weight:650}
.ri[aria-disabled="true"]{opacity:.45;cursor:default}
.ri .tip{position:fixed;left:58px;transform:translateY(-50%);background:var(--hud);color:var(--hud-text);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;z-index:90}
.ri:hover .tip,.ri:focus-visible .tip{opacity:1}
.rail .div{width:24px;height:1px;background:var(--side-line);margin:6px 0}
.rail .fill{flex:1}

/* ---------- column strip ---------- */
.strip{flex:1;min-width:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-behavior:auto}
.col{flex:none;display:flex;flex-direction:column;min-height:0;height:100%;position:relative;border-right:1px solid var(--line)}
.col.focus-ring::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px var(--focus);pointer-events:none;border-radius:2px}
.col-feed{width:var(--w-feed,304px);background:var(--feed)}
.col-msgs{width:var(--w,236px);background:var(--msgs)}
.col-ans{width:var(--w,600px);background:var(--doc)}
.col-ans.fill{flex:1 0 var(--w,600px)}
.col-empty{flex:1 0 320px;background:var(--doc);display:flex;align-items:center;justify-content:center;color:var(--text-3);text-align:center;padding:24px;font-size:13px;line-height:1.5}
.colbar{height:46px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 16px;border-bottom:1px solid var(--line-2)}
.pairbar{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;border-bottom:1px solid var(--line-2);background:var(--doc);z-index:3}
.pair.last{flex:1 0 auto}
.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation:none!important;transition:none!important}
.pair{display:flex;flex:none;position:relative}
.pair .col{padding-top:46px}
.pair .col-ans .pairbar-fill{display:none}
.coltitle{font-size:13px;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.coltitle .cnt{font-weight:400;color:var(--text-3)}
.coltitle .i{width:13px;height:13px;color:var(--accent)}
.askbtn{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-2);padding:3px 7px;border-radius:6px;white-space:nowrap}
.askbtn:hover{background:var(--hover);color:var(--text)}
.askbtn .i{width:12px;height:12px}
.hist{display:flex;gap:0}
.hist .ib{width:24px}
.colbody{flex:1;overflow:auto;min-height:0}
.resizer{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:5}
.resizer:hover::after,.resizer.drag::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:var(--gold)}

/* ---------- Home composer ---------- */
.ask{margin:12px 12px 6px;border:1px solid var(--card-line);border-radius:12px;background:var(--field);padding:10px 12px 8px;transition:border-color .15s,box-shadow .15s}
.ask:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--accent-soft)}
.ask textarea{width:100%;border:0;background:transparent;resize:none;font:14.5px/1.5 var(--write);min-height:44px;padding:0;display:block}
.ask textarea::placeholder,.fu textarea::placeholder{color:var(--text-3)}
.ask-row{display:flex;align-items:center;gap:6px;margin-top:6px}
.switch{display:inline-flex;background:var(--hover);border-radius:8px;padding:2px}
.switch button{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 7px;border-radius:6px;color:var(--text-3);font-size:12px}
.switch button[aria-checked="true"]{background:var(--doc);color:var(--text);box-shadow:0 0 0 .5px var(--line),0 1px 2px rgba(0,0,0,.08)}
.switch .i{width:14px;height:14px}
.switch .mdl{font-size:11.5px;color:var(--text-2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:7px;font-size:12.5px;color:var(--text-2);border:1px solid var(--line)}
.btn:hover{color:var(--text);background:var(--hover)}
.send{width:28px;height:26px;border-radius:7px;background:var(--gold);color:#241a02;display:inline-flex;align-items:center;justify-content:center}
.send:hover{filter:brightness(1.06)}
.send[disabled]{background:var(--sel);color:var(--text-3);cursor:default}
.send .i{width:14px;height:14px;stroke-width:1.8}

/* ---------- feed cards (Ulysses list rows) ---------- */
.feedlist{padding:2px 0 24px}
.card{position:relative;display:block;width:100%;text-align:left;padding:calc(var(--row-pad) + 2px) 14px var(--row-pad) 16px;border-bottom:1px solid var(--line-2);cursor:default}
.card:hover{background:var(--hover)}
.card.is-selected{background:var(--row-sel)}
.col.has-focus .card.is-selected{background:var(--sel-focus)}
.card .t{font-weight:650;font-size:13px;line-height:1.3;padding-right:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .q{font:13px/1.42 var(--write);color:var(--text-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .q.only{color:var(--text);font-weight:500}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11px;color:var(--text-3);flex-wrap:wrap}
.card .dot{position:absolute;right:14px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.card .more{position:absolute;right:8px;top:8px;opacity:0}
.card:hover .more,.card .more:focus-visible,.card.menu-open .more{opacity:1}
.card:hover .dot{opacity:0}
.child{display:flex;gap:7px;align-items:flex-start;margin:6px 0 0 10px;padding:4px 8px;border-radius:6px;font:12.5px/1.4 var(--write);color:var(--text-2);width:calc(100% - 10px);text-align:left}
.child:hover{background:var(--hover);color:var(--text)}
.child .i{width:12px;height:12px;margin-top:3px;color:var(--text-3)}
.child .star{color:var(--gold)}
.child .txt{flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rdot{width:6px;height:6px;border-radius:50%;background:var(--run);flex:none;margin-top:6px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--accent-soft);color:var(--run);white-space:nowrap}
.chip.q{background:var(--hover);color:var(--text-3)}
.linkrow{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--text-3);margin-top:3px}
.linkrow .i{width:12px;height:12px}
.tweet{font:13.5px/1.45 var(--write);color:var(--text);margin-top:2px}
.tray{border-top:1px solid var(--line);margin-top:10px}
.tray-h{display:flex;align-items:center;gap:8px;padding:10px 12px 6px 16px;font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.02em;cursor:pointer;user-select:none}
.tray-h .i{width:14px;height:14px}
.tray-h .c{font-weight:400}
.tray-h .open{margin-left:auto;font-weight:500;color:var(--accent);padding:1px 5px;border-radius:5px}
.tray-h .open:hover{background:var(--accent-soft)}
.tray-h .chev{transition:transform .15s}
.tray.is-collapsed .chev{transform:rotate(-90deg)}
.tray.is-collapsed .tray-b{display:none}
.tray-empty{padding:4px 16px 10px;font-size:12px;color:var(--text-3)}
.pagehead-actions{display:flex;gap:2px}
.hlrow{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.hlrow:hover{background:var(--hover)}
.hlrow .p{font:13.5px/1.5 var(--write)}
.hlrow .p span{background:var(--mark);border-radius:2px;padding:0 1px}
.hlrow small{display:block;margin-top:5px;font-size:11px;color:var(--text-3)}
.empty{padding:36px 22px;text-align:center;color:var(--text-3);font-size:12.5px;line-height:1.5}

/* ---------- messages column ---------- */
.msg{display:block;width:100%;text-align:left;margin:6px 8px 0;width:calc(100% - 16px);padding:9px 10px 7px;border-radius:9px;cursor:default}
.msg:hover{background:var(--hover)}
.msg.is-selected{background:var(--row-sel)}
.col.has-focus .msg.is-selected{background:var(--sel-focus)}
.msg .mq{font:14px/1.45 var(--write);color:var(--text)}
.msg .mm{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11px;color:var(--text-3)}
.msg .mm button{color:var(--text-3);display:inline-flex;align-items:center;gap:3px;border-radius:4px;padding:1px 2px}
.msg .mm button:hover{color:var(--text)}
.msg .mm .on{color:var(--gold)}
.msg .mm .i{width:12px;height:12px}
.quote{margin:12px 12px 4px 12px;display:flex;gap:7px;font:13px/1.45 var(--write);color:var(--text-2);font-style:italic}
.quote .i{width:12px;height:12px;margin-top:3px;color:var(--text-3)}
.fu{margin:10px 8px 16px;border:1px solid var(--card-line);border-radius:10px;background:var(--field);padding:8px 8px 8px 10px;display:flex;gap:6px;align-items:flex-end}
.fu:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--accent-soft)}
.fu textarea{flex:1;border:0;background:transparent;resize:none;font:13.5px/1.45 var(--write);padding:2px 0;min-height:22px;max-height:160px}
.msgs-body{display:flex;flex-direction:column;min-height:100%}
.msgs-body .grow{flex:1}

/* ---------- answer column ---------- */
.ans-wrap{position:relative;padding:22px 48px 60px 40px}
.ans{font:var(--fs-ans)/var(--lh-ans) var(--write);max-width:640px;position:relative}
.ans p,.ans li{margin:0 0 .8em}
.ans h2,.ans h3{position:relative;font-family:var(--ui);font-weight:650;letter-spacing:-.005em;line-height:1.3}
.ans h2{font-size:16px;margin:1.5em 0 .45em}
.ans h3{font-size:14.5px;margin:1.2em 0 .35em}
.hm{position:absolute;right:100%;margin-right:8px;color:var(--markup);font-weight:400}
.ans ul,.ans ol{padding-left:1.1em;margin:0 0 1em}
.ans ul{list-style:none}
.ans ul>li{position:relative}
.ans ul>li::before{content:"-";position:absolute;left:-1em;color:var(--markup)}
.ans ol>li::marker{color:var(--markup);font-family:var(--ui);font-size:.85em}
.ans table{border-collapse:collapse;font:13.5px/1.4 var(--ui);margin:.3em 0 1.1em;font-variant-numeric:tabular-nums;min-width:280px}
.ans th,.ans td{text-align:left;padding:5px 18px 5px 0;border-bottom:1px solid var(--line-2)}
.ans th{font-weight:600;font-size:12px;color:var(--text-2)}
.ans em{font-style:italic}
.ans .cite{font:600 .62em var(--ui);color:var(--accent);vertical-align:super;line-height:0;margin-left:1px}
mark.hl{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
mark.anc{background:var(--anchor);color:inherit;border-bottom:1.5px dotted var(--gold);padding:0 1px}
mark.flash{box-shadow:0 0 0 3px var(--gold)}
.ans.live>p:last-child::after,.ans.live>ul:last-child>li:last-child::after{content:"";display:inline-block;width:7px;height:1.05em;background:var(--gold);vertical-align:-2px;margin-left:3px;animation:pulse 1s steps(2) infinite}
.ans.live:empty::before{content:"Waiting for output…";color:var(--text-3);font-family:var(--ui);font-size:13px}
.status{display:flex;align-items:center;gap:8px;font:11.5px/1.4 var(--ui);color:var(--text-3);margin:0 0 16px;letter-spacing:.01em;flex-wrap:wrap}
.status .st{display:inline-flex;align-items:center;gap:6px;color:var(--run);font-weight:600;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}
.status .st .d{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.4s ease-in-out infinite}
.status .st.q{color:var(--text-3)} .status .st.q .d{animation:none;background:transparent;box-shadow:inset 0 0 0 1.3px currentColor}
.status .st.x{color:var(--text-3)} .status .st.x .d{animation:none}
.status .num{font-variant-numeric:tabular-nums}
.status .sp{flex:1}
.lnk{font-size:12px;color:var(--accent);font-weight:500;padding:1px 5px;border-radius:5px;display:inline-flex;align-items:center;gap:4px}
.lnk:hover{background:var(--accent-soft)}
.lnk .i{width:11px;height:11px}
.stats{display:flex;align-items:center;gap:12px;font:11.5px var(--ui);color:var(--text-3);margin-top:18px;padding-top:10px;border-top:1px solid var(--line-2);font-variant-numeric:tabular-nums;max-width:640px}
.stats b{font-weight:600;color:var(--text-2)}
.stats .sp{flex:1}
.recap{font:14px/1.55 var(--write);background:var(--feed);border-radius:10px;padding:10px 14px;margin:0 0 18px;max-width:640px}
.recap .lab{display:block;font:600 10.5px var(--ui);color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.q-head{font:600 19px/1.35 var(--ui);margin:0 0 6px;max-width:640px;letter-spacing:-.005em}
.q-meta{font-size:11.5px;color:var(--text-3);margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap}
.markers{position:absolute;top:22px;right:10px;width:26px;bottom:60px}
.marker{position:absolute;right:0;width:26px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:1px;color:var(--text-3);font:600 10px var(--ui)}
.marker .i{width:13px;height:13px}
.marker:hover{background:var(--accent-soft);color:var(--accent)}
.marker.is-open{background:var(--gold);color:#241a02}
.marker.is-running .i{color:var(--run);animation:pulse 1.4s ease-in-out infinite}
.marker.is-end{position:relative;display:flex;margin-top:4px}
.mtip{position:fixed;z-index:70;background:var(--pop);border:1px solid var(--card-line);border-radius:10px;box-shadow:var(--shadow);padding:8px 10px;font-size:12px;max-width:280px;display:none;pointer-events:none}
.mtip.on{display:block}
.mtip small{display:block;color:var(--text-3);font-size:11px;margin-bottom:3px}
.post-body{font:var(--fs-ans)/var(--lh-ans) var(--write)}
.post-meta{font-size:11.5px;color:var(--text-3);margin-bottom:14px}
.newbranch-hint{color:var(--text-3);font-size:13px;line-height:1.5;padding:40px 40px;max-width:420px}
[data-variant="e"] .ans>*{opacity:.35;transition:opacity .2s}
[data-variant="e"] .ans>*:hover,[data-variant="e"] .ans>.cur{opacity:1}
[data-variant="e"] .ans.live>*:last-child{opacity:1}
/* sheets variant: cards as paper sheets on the list material */
[data-variant="c"] .feedlist .card,[data-variant="c"] .tray-b .card{background:var(--card);border:1px solid var(--card-line);border-radius:10px;margin:8px 10px 0;width:calc(100% - 20px);box-shadow:0 1px 2px rgba(0,0,0,.05)}
[data-variant="c"] .feedlist .card.is-selected{border-color:var(--gold);background:var(--card);box-shadow:0 0 0 2px var(--accent-soft)}
[data-variant="c"] .msg{background:var(--card);border:1px solid var(--card-line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
[data-variant="c"] .msg.is-selected{border-color:var(--gold)}

.selpop{position:fixed;z-index:60;display:none;background:var(--hud);color:var(--hud-text);border-radius:9px;padding:4px;box-shadow:var(--shadow);font-size:12.5px}
.selpop.on{display:block}
.selpop .r{display:flex;gap:2px}
.selpop button{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:6px;color:var(--hud-text)}
.selpop button:hover,.selpop button:focus-visible{background:rgba(255,255,255,.12)}
.selpop button[disabled]{opacity:.45;cursor:default}
.selpop kbd{border-color:rgba(255,255,255,.22);color:var(--hud-dim)}
.selpop .i{width:14px;height:14px}
.selpop .note{font-size:11.5px;color:var(--hud-dim);padding:4px 9px 3px}
.menu{position:fixed;z-index:65;background:var(--pop);border:1px solid var(--card-line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:200px;max-width:min(320px,calc(100vw - 16px));display:none;font-size:13px;max-height:min(480px,80vh);overflow:auto}
.menu.on{display:block}
.menu .mi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:6px 9px;border-radius:6px}

.menu .mi .i{width:15px;height:15px;color:var(--text-3)}
.menu .mi .k{margin-left:auto;color:var(--text-3);font-size:11.5px}
.menu .mi[aria-disabled="true"]{opacity:.45}
.menu .mt{font-size:11px;font-weight:600;color:var(--text-3);padding:6px 9px 3px;letter-spacing:.02em}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:4px 2px}
.menu .ck{width:15px;color:var(--accent)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:none;align-items:flex-start;justify-content:center;padding-top:10vh}
.scrim.on{display:flex}
.dlg{background:var(--pop);border:1px solid var(--card-line);border-radius:14px;box-shadow:var(--shadow);width:min(560px,calc(100vw - 24px));max-height:78vh;display:flex;flex-direction:column;overflow:hidden}
.dlg-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.dlg-h h2{margin:0;font-size:15px;font-weight:650;flex:1}
.dlg-b{overflow:auto;padding:4px 16px 18px}
.tabs{display:flex;gap:2px;background:var(--hover);border-radius:8px;padding:2px;margin:0 16px 8px;width:fit-content}
.tabs button{padding:4px 12px;border-radius:6px;font-size:12.5px;color:var(--text-2)}
.tabs button[aria-selected="true"]{background:var(--doc);color:var(--text);box-shadow:0 0 0 .5px var(--line),0 1px 2px rgba(0,0,0,.08)}
.set-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.set-row .l{flex:1}
.set-row small{display:block;color:var(--text-3);font-size:11.5px;margin-top:2px}
.set-row select{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.set-row textarea{width:100%;min-height:56px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:6px 8px;font-size:12.5px;resize:vertical;margin-top:6px}
.tog{width:32px;height:19px;border-radius:10px;background:var(--sel);position:relative;flex:none}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:var(--doc);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.tog[aria-checked="true"]{background:var(--gold)}
.tog[aria-checked="true"]::after{left:15px}
.steps{list-style:none;margin:10px 0 0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.steps .n{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--hover);color:var(--text-2)}
.steps .n.ok{background:var(--accent-soft);color:var(--accent)}
.steps b{font-size:13px}
.steps small{grid-column:2;color:var(--text-3);font-size:12px}
.cmd{grid-column:2;display:flex;align-items:center;gap:8px;background:var(--feed);border-radius:7px;padding:5px 8px;font:12px var(--mono)}
.cmd span{flex:1}
.pal{width:min(560px,calc(100vw - 24px))}
.pal input{width:100%;border:0;background:transparent;font-size:16px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px}
.pal li .k{margin-left:auto;color:var(--text-3);font-size:11.5px}
.pal li .i{color:var(--text-3)}
.pal li[aria-selected="true"]{background:var(--sel-focus)}
.pal .ph{font-size:11px;font-weight:600;color:var(--text-3);padding:8px 9px 3px;cursor:default}
.toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:85;max-width:min(340px,calc(100vw - 28px))}
.toast{background:var(--pop);border:1px solid var(--card-line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:12.5px;display:flex;gap:10px;align-items:center}
.toast .i{color:var(--accent)}
body.standalone .app{height:calc(100vh - 40px);border-bottom:1px solid var(--line)}
body.standalone{background:var(--side)}
.vswitch{position:fixed;left:50%;transform:translateX(-50%);bottom:5px;z-index:84;display:flex;gap:3px;background:var(--pop);border:1px solid var(--card-line);border-radius:9px;padding:3px;box-shadow:var(--shadow);font-size:11.5px}
.vswitch button{padding:3px 8px;border-radius:6px;color:var(--text-2);white-space:nowrap}
.vswitch button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
@media (max-width:760px){
  .side{display:none!important}
  .rail{display:flex!important}
  .vswitch .vl{display:none}
  .col-feed{width:min(304px,calc(100vw - 52px))}
  .toasts{right:8px;left:60px}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function inl(s) {
  return s.replace(/==(hl|anc):(\w+):(.+?)==/g, (_, k, id, t) => `<mark class="${k === 'hl' ? 'hl' : 'anc'}" data-mark="${id}">${t}</mark>`)
    .replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\[(\d)\]/g, '<sup class="cite">[$1]</sup>');
}
function plain(s) { return String(s).replace(/==(?:hl|anc):\w+:(.+?)==/g, '$1').replace(/\*/g, '').replace(/\[\d\]/g, ''); }
function blk(b, path) {
  if (b.html) return `<${b.tag} data-b="${path}">${b.html}</${b.tag}>`;
  switch (b.t) {
    case 'h2': b.tag = 'h2'; return `<h2 data-b="${path}"><span class="hm">##</span>${inl(b.x)}</h2>`;
    case 'p': b.tag = 'p'; return `<p data-b="${path}">${inl(b.x)}</p>`;
    case 'ul': b.tag = 'ul'; return `<ul data-b="${path}">${b.items.map(x => `<li>${inl(x)}</li>`).join('')}</ul>`;
    case 'ol': b.tag = 'ol'; return `<ol data-b="${path}">${b.items.map(x => `<li>${inl(x)}</li>`).join('')}</ol>`;
    case 'table': b.tag = 'table'; return `<table data-b="${path}"><thead><tr>${b.rows[0].map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${b.rows.slice(1).map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  return '';
}

const CANNED = [

  { re: /augment/i, a: [{ t: 'p', x: 'Developers hold nameplate energy with three approaches: overbuilding at commissioning, adding racks in scheduled tranches, and replacing whole containers late in life.' }, { t: 'ul', items: ['Overbuild 5–10% at commercial operation.', 'Augment in years 4–5 and 9–11, sized to the warranty curve.', 'Price augmentation as an O&M reserve in the PPA.'] }] },

  if (!mod) { if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('.card,.msg') ) { e.preventDefault(); t.click(); } return; }
  const k = e.key.toLowerCase();
  if (e.shiftKey && k === 'g') { e.preventDefault(); return toggleRail(); }
  if (e.shiftKey && k === 'e') { e.preventDefault(); return toast('Source browser (⇧⌘E)', 'link'); }
  if (e.shiftKey) return;
  if (k === 'n' || k === 't') { e.preventDefault(); go('home'); return $('#askIn').focus(); }
  if (k === ',') { e.preventDefault(); return dialogSettings(); }
  if (k === 'k') { e.preventDefault(); return openPalette(); }
  if (k === 'j') { e.preventDefault(); const L = S.levels.length - 1; const f = document.getElementById('fu' + L); return f && f.focus(); }
  if (k === 'o') { e.preventDefault(); const b = S.rail || innerWidth <= 760 ? $('#rail [data-act="ws-menu"]') : $('#side [data-act="ws-menu"]'); return wsMenu(b); }
});
document.addEventListener('keyup', e => { if (e.key === 'Meta' && !S.hints) document.body.classList.remove('hints'); });
// column resizers
let drag = null;
document.addEventListener('pointerdown', e => { const r = e.target.closest('.resizer'); if (!r) return; const col = r.parentElement; drag = { r, col, key: r.dataset.resize, x: e.clientX, w: col.getBoundingClientRect().width }; r.classList.add('drag'); e.preventDefault(); });
document.addEventListener('pointermove', e => { if (!drag) return; const w = Math.max(200, Math.min(900, drag.w + e.clientX - drag.x)); if (drag.key === 'feed') { document.documentElement.style.setProperty('--w-feed', w + 'px'); } else { drag.col.style.setProperty('--w', w + 'px'); drag.col.classList.remove('fill'); S.widths[drag.key] = w; const pair = drag.col.closest('.pair'); const bar = pair && pair.querySelector('.pairbar');  } placeMarkers(); });
document.addEventListener('pointerup', () => { if (drag) { drag.r.classList.remove('drag'); drag = null; } });
addEventListener('resize', () => { renderSide(); placeMarkers(); closeMenu(); });
setInterval(() => { Object.values(N).forEach(n => { if (n.status === 'running') $$(`[data-el="${n.id}"]`).forEach(el => el.textContent = fmt(elapsed(n))); }); }, 1000);
$('#strip').addEventListener('scroll', () => { hideSel(); $('#mtip').classList.remove('on'); }, true);

/* ===================== shell protocol ===================== */
function setVariant(id) {
  if (!MOCK.variants.some(v => v.id === id)) id = 'a';
  document.documentElement.dataset.variant = id;
  if (parent !== window) parent.postMessage({ type: "mock:variant", slug: MOCK.slug, variant: id }, "*");
  $$('.vswitch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === id));
  requestAnimationFrame(placeMarkers);
}
window.addEventListener("message", (e) => {
  const d = e.data || {};
  if (d.type === "mock:set") setVariant(d.variant);
  if (d.type === "mock:theme") { if (d.theme === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = d.theme; renderSide(); }
});

/* ===================== boot ===================== */
setVariant(new URLSearchParams(location.search).get('variant') || 'a');
renderSide(); renderFeed();
openItem('lfp'); ITEMS.caiso.unread = true; renderFeed();
(function () { const n = N.b2; n.started = Date.now() - n.startedAgo * 1000; run(n, { cont: true, slow: true, plan: [{ t: 'p', x: 'Hard carbon operates at a higher average potential than graphite, so electrolyte reduction at the anode is slower near full charge and less lithium is lost per hour at high SOC.' }, { t: 'h2', x: 'Same SOC window' }, { t: 'p', x: 'Published 2025 calendar-aging data for layered-oxide/hard-carbon cells show roughly 1.5–2% per year at 25 °C when held at 90% SOC, against 2.9% for LFP in the same band.' }] }); })();
if (parent !== window) parent.postMessage({ type: "mock:ready", mock: MOCK }, "*");
else {
  const sw = document.createElement('div'); sw.className = 'vswitch'; sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Variant');
  sw.innerHTML = MOCK.variants.map(v => `<button data-v="${v.id}" title="${esc(v.summary)}" aria-pressed="${v.id === document.documentElement.dataset.variant}">${v.id.toUpperCase()}<span class="vl"> · ${esc(v.label)}</span></button>`).join('');
  sw.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { e.stopPropagation(); setVariant(b.dataset.v); } });
  document.body.appendChild(sw); document.body.classList.add('standalone'); requestAnimationFrame(placeMarkers);
}
</script>
