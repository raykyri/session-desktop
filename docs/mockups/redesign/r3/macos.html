<!--
INVENTORY OF THE CURRENT APP (read from src/ on 11 Oct 2026; this mock restyles it and keeps every region below)

Shell (App.tsx): app-shell = [sidebar | sidebar-resizer] or [52px rail], then <main.workspace> with the
  column strip (ResearchColumns): feed column, then the open thread's column pairs (or a draft, or a filler).
  Browser overlay sits over the column area; UserNotificationStack top-right; feed toast bottom-centre.

Sidebar (ResearchSidebarNav, full):
  - Titlebar row: traffic lights, collapse button (PanelLeft, "Collapse sidebar to icons (⇧⌘G)") beside them;
    right side: Settings (⌘,), Agents, Light/Dark mode toggle.
  - Rows, no counts: Home (⌘N hint while ⌘ held), Bookmarks, Highlights.
  - "Folders" section header with + (New folder). Rows: Drafts, user folders, Archive. User folders have a … menu
    (Rename…, Delete…). Home and folder rows are drop targets.
  - Bottom: workspace switcher (folder icon, workspace name, path, chevron; ⌘O), GitHub account control (avatar, name, login).
Rail (ResearchSidebarRail, 52px, ⇧⌘G or forced when the window is narrow): expand button beside the traffic lights,
  Home, Bookmarks, Highlights, divider, Drafts, user folders as monograms, Archive, New folder; bottom: workspace
  (menu with account footer), Agents, Light/Dark, Settings. Tooltips to the right of each icon.
Workspace switcher menu (ResearchWorkspaceSwitcher): workspaces with check, Add workspace…, Rename "…"…,
  Open in Finder, Move workspace folder…, Remove workspace… (destructive).

Feed column (ResearchActivityFeed, 320px): 44px header bar (ResearchFeedHeader): optional back chevron (Back to Home),
  view title, actions. Home: Refresh, Import .md report. Bookmarks: Refresh, + Ask. Folder: Rename folder, Delete folder, + Ask.
  - Home: ask box first (ResearchQueryComposer: textarea "Ask a question" / "Ask your network, or paste a link to save";
    row with AskPostSwitch [Ask = agent icon + chevron opening the model menu with Effort submenu | Post = people icon]
    and the send arrow; "Save draft" under the box once there is text). Then the Unfiled list of cards, then one tray
    per place (Drafts, folders, Archive): header with place icon, name (opens the place), count, collapse chevron.
  - Card (ResearchFeedCard): thread title (bold, when it differs) + question text, no metadata row; unread dot;
    status dot top-right (Running / Failed); on hover a pill with drag grip + … ("Bookmark, follow or move").
    Starred follow-ups and branches follow as indented child rows (star icon for branches, running dot).
    … menu: Bookmark/Remove bookmark, Follow/Unfollow, Move to (places), New folder…. Context menu adds the
    tree menu: Generate recap, Rename, Archive, Delete. Keys: ↑/↓ rows, → or Enter opens, ⌥↑/⌥↓ reorders, ⌃Tab cycles.
  - Bookmarks / folder / Drafts / Archive: same list, ask box at the end. Empty texts per place.
  - Highlights (ResearchHighlightsFeed): groups per thread title; item = question first line + excerpt with context
    and the marked passage; Remove (×) on hover.
Thread page (ResearchThreadPage): per level, a pair = messages column + answer column under one header bar
  (ResearchPairHeader: back/forward on the root level, title clamped, "Archived", "+ Ask", … menu).
  Branch levels: "⑂ Branch · N messages"; a pending branch: "New branch".
  - Messages column: ask box at the top ("Ask a follow-up", ⌘J; for a new branch "Ask about this passage" with a
    "New branch" mode label and Cancel), then messages newest first. Row: message text, meta line = time, state pill
    (Running / Queued / Failed), star, branch count, … (Answer actions: Show full transcript, Branch from the whole
    answer, Copy answer as Markdown, Copy thread as Markdown, Retry run, Generate recap, Rename…).
    Branch levels start with the source block: ↳ "passage" or "The whole answer".
  - Answer column: run line while active (pulse, "Working · <tool activity>", elapsed, Show trace, Stop);
    "Recap: …"; the answer; branch markers in the right margin (tooltip lists branches; click opens the next pair).
    Failed: error + Retry / Edit question; stopped: "Stopped after …" + Run again; queued: "Queued".
  - Selection popover (role=toolbar): Branch (A), Highlight / Remove highlight (H; E also), Copy; note while running.
  - Column resizers on each column's right edge; the strip scrolls sideways; filler text when nothing is open.
  - Post threads: "Post" and "Thread · N" columns. Drafts open as a draft view (title + ask box labelled "Draft").
Other surfaces: CommandPalette (⌘K, "Type a command or search…", sections Research / Actions with hints);
  Settings dialog (header + close, tabs Basic / Remotes, rows with toggles and selects);
  Agent Setup dialog (AgentSetupGuide: heading "N of M agents ready", agent tabs with status dots, refresh,
  panel with icon/name/status, steps Install the CLI / Sign in / Refresh status, Setup guide, Next agent);
  BrowserOverlay (back/forward/reload, address field, close); notification banners; folder dialogs; find bar (⌘F).
Shortcuts: ⌘N/⌘T Home composer, ⌘J follow-up box, ⌘O workspace menu, ⌘[ ⌘] / ⌥← ⌥→ history, ⇧⌘G sidebar,
  ⌘, Settings, ⌘K palette, ⇧⌘E source browser, ⌘F find.
-->

*{ box-sizing: border-box; }
html,body{ height:100%; margin:0; }
body{ background: var(--desk); color: var(--label); font: 13px/1.38 var(--font); -webkit-font-smoothing: antialiased; overflow:hidden; }
button{ font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
input, textarea, select{ font: inherit; color: inherit; }
:focus{ outline: none; }
:focus-visible{ outline: 3px solid var(--accent-ring); outline-offset: 1px; border-radius: 5px; }
svg.i{ width:16px; height:16px; flex: 0 0 auto; fill:none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum{ font-variant-numeric: tabular-nums; }
kbd{ font: 12px/1 var(--font); color: var(--label-2); letter-spacing: .02em; }

/* ── Window ─────────────────────────────────────────────── */
.win{ position: fixed; inset: 0; display: flex; background: var(--window); box-shadow: var(--win-shadow); overflow: hidden; }
.traffic{ position:absolute; left: 20px; top: calc(var(--tb-h) / 2 - 6px); display:flex; gap: 8px; z-index: 9; }
.traffic span{ width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.18); }
.traffic span:nth-child(2){ background:#febc2e; } .traffic span:nth-child(3){ background:#28c840; }

/* ── Sidebar: source list with vibrancy ─────────────────── */
.sidebar{ position: relative; width: var(--sb-w); flex: 0 0 auto; display: flex; flex-direction: column; background: var(--sidebar); border-right: .5px solid var(--sep-strong); overflow: hidden; isolation: isolate; }
.sidebar::before, .rail::before{ content:""; position:absolute; inset:-40px; z-index:-1; opacity: var(--wall-op);
  background: radial-gradient(60% 40% at 20% 15%, var(--wall-a), transparent 70%), radial-gradient(50% 45% at 90% 70%, var(--wall-b), transparent 70%), radial-gradient(60% 40% at 10% 95%, var(--wall-c), transparent 70%);
  filter: blur(28px); clip-path: inset(40px); }
.sidebar::after, .rail::after{ content:""; position:absolute; inset:0; z-index:-1; background: var(--sidebar); }
:root[data-variant="b"] .sidebar::before, :root[data-variant="b"] .rail::before{ display:none; }
:root[data-variant="b"] .sidebar::after, :root[data-variant="b"] .rail::after{ background: var(--sidebar-opaque); }
.sb-top{ height: var(--tb-h); flex: 0 0 auto; position: relative; display:flex; align-items:center; justify-content:flex-end; padding: 0 10px 0 0; gap: 2px; }
.sb-collapse{ position:absolute; left: 82px; top: 50%; transform: translateY(-50%); }
.tbtn{ height: 28px; min-width: 28px; padding: 0 6px; border-radius: 6px; display:inline-flex; align-items:center; justify-content:center; gap: 4px; color: var(--label-2); }
.tbtn:hover{ background: var(--hover); color: var(--label); }
.tbtn:active, .tbtn[aria-expanded="true"], .tbtn.is-active{ background: var(--fill-2); color: var(--label); }
.tbtn:disabled{ opacity:.35; pointer-events:none; }
.tbtn.has-label{ padding: 0 8px 0 6px; font-weight: 500; font-size: 12px; color: var(--label-2); }
.tbtn.has-label svg.i{ width: 14px; height: 14px; }
:root[data-variant="c"] .tbtn{ height: 24px; min-width: 24px; }
.sb-body{ flex: 1 1 auto; overflow-y: auto; padding: 2px 10px 10px; scrollbar-width: thin; }
.nav-row{ position: relative; display: flex; align-items: center; height: var(--row-h); border-radius: 6px; margin: 1px 0; }
.nav-row .nav-select{ flex: 1 1 auto; display:flex; align-items:center; gap: 7px; height: 100%; padding: 0 8px; border-radius: 6px; min-width: 0; text-align: left; }
.nav-row .nav-select svg.i{ color: var(--accent); width: 16px; height: 16px; }
.nav-label{ flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-row:hover{ background: var(--hover); }
.nav-row.is-selected{ background: var(--sel-gray); }
.sidebar:focus-within .nav-row.is-selected{ background: var(--accent); color: var(--on-accent); }
.sidebar:focus-within .nav-row.is-selected .nav-select svg.i{ color: var(--on-accent); }
.nav-row .nav-menu{ position:absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 22px; height: 20px; border-radius: 5px; display:none; align-items:center; justify-content:center; color: inherit; opacity:.75; }
.nav-row:hover .nav-menu, .nav-row.has-open-menu .nav-menu, .nav-menu:focus-visible{ display:flex; }
.nav-menu:hover{ background: var(--fill-2); opacity: 1; }
.nav-row.is-drop{ box-shadow: inset 0 0 0 2px var(--accent); }
.hint{ font-size: 11px; color: var(--label-3); margin-left: auto; display:none; }
.show-hints .hint{ display:inline; }
.sb-section{ display:flex; align-items:center; justify-content: space-between; padding: 14px 8px 4px 9px; font-size: 11px; font-weight: 600; color: var(--label-3); letter-spacing: .01em; }
.sb-section .tbtn{ height: 20px; min-width: 20px; padding: 0; opacity: 0; }
.sidebar:hover .sb-section .tbtn, .sb-section .tbtn:focus-visible{ opacity: 1; }
.sb-foot{ flex: 0 0 auto; padding: 8px 10px 10px; display:flex; flex-direction: column; gap: 6px; border-top: .5px solid var(--sep); }
.ws-trigger, .acct{ width: 100%; display:flex; align-items:center; gap: 8px; padding: 5px 8px; border-radius: 7px; text-align: left; position: relative; }
.ws-trigger:hover, .acct:hover, .ws-trigger[aria-expanded="true"]{ background: var(--hover); }
.ws-trigger svg.i:first-child{ color: var(--accent); }
.ws-copy, .acct-copy{ display:flex; flex-direction:column; min-width: 0; flex: 1 1 auto; line-height: 1.25; }
.ws-name, .acct-name{ font-weight: 600; font-size: 12px; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
.ws-path, .acct-login{ font-size: 11px; color: var(--label-2); white-space: nowrap; overflow:hidden; text-overflow: ellipsis; }
.ws-trigger > svg.i:last-child, .acct > svg.i:last-child{ width: 12px; height: 12px; color: var(--label-3); }
.avatar{ width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(#8e9aaf,#6b778c); color:#fff; font-size: 11px; font-weight: 600; display:flex; align-items:center; justify-content:center; flex: 0 0 auto; }
.ws-trigger .hint{ position:absolute; right: 26px; }

.sb-resizer{ width: 6px; margin: 0 -3px; flex: 0 0 auto; cursor: col-resize; position: relative; z-index: 4; }

/* ── Rail ─────────────────────────────────────────────── */
.rail{ display:none; position: relative; z-index: 8; width: 52px; flex: 0 0 auto; flex-direction: column; align-items: center; gap: 2px; padding-bottom: 10px; border-right: .5px solid var(--sep-strong); isolation:isolate; overflow: visible; }
.is-rail .rail{ display:flex; }
.is-rail .sidebar, .is-rail .sb-resizer{ display:none; }
.rail-top{ height: var(--tb-h); width: 100%; flex: 0 0 auto; }
.rail-expand{ position: absolute; left: 82px; top: calc(var(--tb-h) / 2 - 14px); z-index: 7; }
.rail-btn{ position: relative; width: 32px; height: 30px; border-radius: 7px; display:flex; align-items:center; justify-content:center; color: var(--label-2); }
.rail-btn svg.i{ color: var(--accent); }
.rail-btn.plain svg.i{ color: var(--label-2); }
.rail-btn:hover{ background: var(--hover); }
.rail-btn.is-selected{ background: var(--sel-gray); }
.rail:focus-within .rail-btn.is-selected{ background: var(--accent); }
.rail:focus-within .rail-btn.is-selected svg.i, .rail:focus-within .rail-btn.is-selected .mono{ color: var(--on-accent); }
.rail-btn[aria-disabled="true"]{ opacity: .4; }
.mono{ width: 18px; height: 18px; border-radius: 5px; border: 1.4px solid var(--accent); color: var(--accent); font-size: 10.5px; font-weight: 700; display:flex; align-items:center; justify-content:center; }
.rail-div{ width: 20px; height: 1px; background: var(--sep-strong); margin: 6px 0; }
.rail-spacer{ flex: 1 1 auto; }
.rail-tip{ position: fixed; z-index: 90; transform: translateY(-50%); padding: 3px 7px; font-size: 11.5px; border-radius: 5px; background: var(--tooltip); color: var(--label); box-shadow: 0 2px 8px rgba(0,0,0,.18), 0 0 0 .5px var(--menu-border); white-space: nowrap; pointer-events: none; }

/* ── Workspace & column strip ────────────────────────── */
.workspace{ position: relative; flex: 1 1 auto; min-width: 0; display:flex; flex-direction: column; background: var(--content); }
.strip{ flex: 1 1 auto; min-height: 0; display:flex; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; scrollbar-width: thin; }
.col{ position: relative; flex: 0 0 auto; display:flex; flex-direction: column; min-width: 0; height: 100%; background: var(--content); }
.col + .col, .pair, .filler{ border-left: .5px solid var(--sep-strong); }
.col-head{ height: var(--tb-h); flex: 0 0 auto; display:flex; align-items:center; gap: 4px; padding: 0 10px 0 14px; background: var(--toolbar); border-bottom: .5px solid var(--sep); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); position: relative; z-index: 2; }
.col-title:focus-visible{ outline: none; }
.col-title{ font: 700 var(--title-fs)/1.2 var(--font-display); margin: 0; letter-spacing: -.005em; min-width: 0; flex: 0 1 auto; overflow:hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-title .count{ font-weight: 400; color: var(--label-2); }
.col-title svg.i{ width: 14px; height: 14px; vertical-align: -2px; margin-right: 5px; color: var(--label-2); }
.col-head .spacer{ flex: 1 1 auto; }
.is-rail .feed-col .col-head{ padding-left: 66px; }
.is-rail .feed-col.is-home .col-title{ position:absolute; width:1px; height:1px; overflow:hidden; clip: rect(0 0 0 0); }
.navpair{ display:flex; margin-right: 6px; }
.navpair .tbtn{ min-width: 26px; padding: 0 3px; }
.col-scroll{ flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
.resizer{ position:absolute; top: 0; bottom: 0; right: -4px; width: 8px; cursor: col-resize; z-index: 3; }
.resizer::after{ content:""; position:absolute; left: 3.5px; top:0; bottom:0; width: 1px; background: transparent; transition: background .15s; }
.resizer:hover::after, .resizer.is-drag::after{ background: var(--accent); }
.filler{ flex: 1 1 0; min-width: 0; overflow: hidden; display:flex; align-items:center; justify-content:center; padding: 24px; color: var(--label-3); text-align:center; font-size: 13px; background: var(--content); }
.filler{ container-type: inline-size; }
.filler p{ max-width: 230px; margin: 0; }
@container (max-width: 200px){ .filler p{ display: none; } }

/* ── Feed column ─────────────────────────────────────── */
.feed-col{ width: 320px; }
.feed-body{ padding: 10px 0 40px; }
.composer{ padding: 4px 12px 10px; }
.launcher{ background: var(--field); border: .5px solid var(--field-border); border-radius: 10px; box-shadow: 0 .5px 1.5px rgba(0,0,0,.06); padding: 7px 8px 7px 11px; transition: box-shadow .15s; }
.launcher:focus-within{ box-shadow: 0 0 0 3.5px var(--accent-ring); border-color: transparent; }
.launcher textarea{ width: 100%; border: 0; background: transparent; resize: none; min-height: 20px; max-height: 180px; line-height: 20px; padding: 1px 0; font-size: 13px; display:block; }
.launcher textarea:focus-visible, .fu-box textarea:focus-visible{ outline: none; }
.launcher textarea::placeholder, .fu textarea::placeholder{ color: var(--label-3); }
.launcher-row{ display:none; align-items:center; gap: 6px; margin-top: 8px; }
.composer.is-expanded .launcher-row{ display:flex; }
.composer.is-expanded textarea{ min-height: 44px; }
.launcher-row .spacer{ flex: 1 1 auto; }
.seg{ display:inline-flex; padding: 2px; border-radius: 7px; background: var(--fill-2); gap: 0; }
.seg button{ height: 22px; min-width: 30px; padding: 0 7px; border-radius: 5px; display:inline-flex; align-items:center; justify-content:center; gap: 3px; color: var(--label-2); font-size: 12px; position: relative; }
.seg button + button::before{ content:""; position:absolute; left:0; top: 5px; bottom: 5px; width: 1px; background: var(--sep-strong); }
.seg button[aria-checked="true"]{ background: var(--control); color: var(--label); box-shadow: var(--control-shadow); }
.seg button[aria-checked="true"]::before, .seg button[aria-checked="true"] + button::before{ display:none; }
.seg svg.i{ width: 14px; height: 14px; }
.seg .chev{ width: 9px; height: 9px; stroke-width: 2.2; margin-left: 1px; }
.agent-glyph{ width: 15px; height: 15px; border-radius: 4px; display:inline-flex; align-items:center; justify-content:center; font-size: 9px; font-weight: 700; color: #fff; flex: 0 0 auto; letter-spacing: -.02em; }
.ag-claude{ background: #c46a45; } .ag-codex{ background: #3f8f6e; } .ag-grok{ background: #55565c; }
.send{ width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display:inline-flex; align-items:center; justify-content:center; }
.send svg.i{ width: 14px; height: 14px; stroke-width: 2.1; }
.send:disabled{ background: var(--fill-2); color: var(--label-3); }
.composer-after{ display:flex; justify-content:flex-end; padding: 6px 2px 0; }
.link-btn{ color: var(--accent); font-size: 12px; padding: 2px 4px; border-radius: 4px; }
.link-btn:hover{ text-decoration: underline; }
.list{ position: relative; }
/* Mail-style list rows */
.card, .child{ position: relative; margin: 0 8px; border-radius: 7px; }
.card{ padding: 9px 30px 10px 24px; }
.card::after, .child.is-group-end::after{ content:""; position:absolute; left: 24px; right: 8px; bottom: -0.5px; height: .5px; background: var(--sep); }
.card.has-children::after{ display:none; }
.card-hit, .child-open{ position:absolute; inset: 0; border-radius: 7px; z-index: 0; }
.child-open{ position: relative; inset:auto; display:flex; gap: 6px; align-items: flex-start; width: 100%; text-align: left; padding: 6px 30px 7px calc(36px + var(--indent, 0) * 14px); }
.card-content{ position: relative; z-index: 1; pointer-events: none; }
.card-content a, .card-content .embed{ pointer-events: auto; }
.card-title{ display:block; font-weight: 600; font-size: 13px; margin-bottom: 1px; }
.card-q{ color: var(--label-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow:hidden; }
.card.is-title-only .card-q{ color: var(--label); }
.card:hover, .child:hover{ background: var(--hover); }
.card.is-selected, .child.is-selected{ background: var(--sel-gray); }
.card.is-selected::after{ display:none; }
.feed-col:focus-within .card.is-selected, .feed-col:focus-within .child.is-selected{ background: var(--accent); color: var(--on-accent); }
.feed-col:focus-within .card.is-selected .card-q, .feed-col:focus-within .child.is-selected .child-text{ color: rgba(255,255,255,.85); }
.unread{ position:absolute; left: 9px; top: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); z-index: 1; }
.status-dot{ position:absolute; right: 12px; top: 14px; width: 8px; height: 8px; border-radius: 50%; z-index: 1; }
.status-dot.is-running{ background: var(--orange); box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 22%, transparent); }
.status-dot.is-failed{ background: var(--red); }
.status-dot.is-queued{ background: transparent; border: 1.5px solid var(--label-3); }
.row-rail{ position:absolute; right: 6px; top: 7px; display:none; align-items:center; gap: 0; height: 22px; padding: 0 2px; border-radius: 6px; background: var(--menu); box-shadow: 0 0 0 .5px var(--menu-border), 0 1px 3px rgba(0,0,0,.1); z-index: 2; color: var(--label-2); }
.card:hover > .row-rail, .card.has-open-menu > .row-rail, .card:focus-within > .row-rail, .child:hover > .row-rail, .child.has-open-menu > .row-rail{ display:flex; }
.card:hover > .status-dot, .card:focus-within > .status-dot, .child:hover > .status-dot{ visibility: hidden; }
.row-rail .grip{ width: 16px; display:flex; justify-content:center; cursor: grab; }
.row-rail .grip svg.i{ width: 13px; height: 13px; stroke-width: 2.6; }
.row-rail button{ width: 22px; height: 20px; border-radius: 4px; display:flex; align-items:center; justify-content:center; }
.row-rail button:hover{ background: var(--fill-2); color: var(--label); }
.child{ font-size: 12.5px; }
svg.i.child-icon{ width: 12px; height: 12px; color: var(--yellow); fill: var(--yellow); stroke: var(--yellow); margin-top: 2px; }
.child-text{ color: var(--label-2); display:-webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.child .status-dot{ top: 11px; }
.child.is-group-end{ margin-bottom: 0; }
.card.drag-ghost{ opacity: .5; }
.card.is-moved{ animation: flash .9s ease; }
@keyframes flash{ from{ box-shadow: inset 0 0 0 2px var(--accent); } to{ box-shadow: inset 0 0 0 2px transparent; } }
.embed{ display:block; margin-top: 6px; border: .5px solid var(--sep-strong); border-radius: 9px; padding: 8px 10px; background: var(--content); color: var(--label); text-decoration: none; }
.embed:hover{ background: var(--hover); }
.embed .site{ display:flex; align-items:center; gap: 5px; font-size: 11px; color: var(--label-2); margin-bottom: 2px; }
.embed .site svg.i{ width: 12px; height: 12px; }
.embed .et{ font-weight: 600; font-size: 12.5px; line-height: 1.3; }
.tweet-head{ display:flex; align-items:center; gap: 7px; margin-bottom: 4px; }
.tweet-av{ width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg,#5b7a96,#8a6f5b); color:#fff; font-size: 10.5px; font-weight: 700; display:flex; align-items:center; justify-content:center; }
.tweet-name{ font-weight: 600; font-size: 12px; } .tweet-handle{ color: var(--label-2); font-size: 11.5px; }
.post-chip{ display:inline-flex; align-items:center; gap: 3px; font-size: 11px; color: var(--label-2); margin-bottom: 2px; }
.post-chip svg.i{ width: 12px; height: 12px; }
.feed-col:focus-within .card.is-selected .embed{ color: var(--label); }
.new-activity{ display:flex; justify-content:center; padding: 4px 0 8px; }
.pill-btn{ height: 24px; padding: 0 12px; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 500; }
.empty{ padding: 18px 24px; color: var(--label-2); font-size: 12.5px; }
/* Trays: disclosure sections */
.tray{ margin: 14px 8px 0; }
.tray-head{ display:flex; align-items:center; gap: 6px; height: 28px; padding: 0 6px 0 10px; border-radius: 6px; color: var(--label-2); }
.tray-head:hover{ background: var(--hover); }
.tray-head svg.i{ width: 14px; height: 14px; color: var(--accent); }
.tray-name{ font-weight: 600; font-size: 12px; color: var(--label); border-radius: 4px; padding: 1px 2px; }
.tray-name:hover{ text-decoration: underline; }
.tray-count{ font-size: 11px; color: var(--label-2); background: var(--fill-2); border-radius: 8px; padding: 0 6px; line-height: 16px; }
.tray-head .spacer{ flex: 1 1 auto; }
.tray-chev{ width: 22px; height: 22px; display:flex; align-items:center; justify-content:center; border-radius: 5px; }
.tray-chev svg.i{ width: 12px; height: 12px; color: var(--label-2); transition: transform .18s; stroke-width: 2.2; }
.tray.is-collapsed .tray-chev svg.i{ transform: rotate(-90deg); }
.tray-body{ margin: 2px -8px 0; }
.tray-body .empty{ padding: 6px 24px 8px; }
.tray.is-drop .tray-head{ box-shadow: inset 0 0 0 2px var(--accent); }
/* Variant d: grouped inset lists */
:root[data-variant="d"] .feed-col{ background: var(--grouped); }
:root[data-variant="d"] .feed-col .list, :root[data-variant="d"] .feed-col .tray-body{ margin: 0 12px; background: var(--cell); border-radius: 10px; box-shadow: 0 0 0 .5px var(--sep); overflow: hidden; padding: 4px 0; }
:root[data-variant="d"] .feed-col .tray-body{ margin: 4px 4px 0; }
:root[data-variant="d"] .card, :root[data-variant="d"] .child{ margin: 0 4px; }
:root[data-variant="d"] .card:last-child::after{ display:none; }
:root[data-variant="d"] .tray{ margin: 18px 8px 0; }
:root[data-variant="d"] .tray-head{ padding-left: 14px; }
:root[data-variant="d"] .hl-group{ background: var(--cell); margin: 0 12px 12px; border-radius: 10px; box-shadow: 0 0 0 .5px var(--sep); padding: 4px 0; }
:root[data-variant="d"] .feed-col .col-head{ background: var(--grouped); }
/* Inline folder delete confirm */
.confirm-bar{ margin: 8px 12px 0; padding: 10px 12px; border-radius: 9px; background: var(--grouped); box-shadow: 0 0 0 .5px var(--sep-strong); font-size: 12.5px; }
.confirm-bar p{ margin: 0 0 8px; }
.btn-row{ display:flex; justify-content:flex-end; gap: 8px; }
.btn{ height: 22px; padding: 0 12px; border-radius: 6px; background: var(--control); box-shadow: var(--control-shadow); font-size: 13px; color: var(--label); white-space: nowrap; display:inline-flex; align-items:center; gap: 5px; }
.btn:active{ filter: brightness(.95); }
.btn.primary{ background: var(--accent); color: var(--on-accent); box-shadow: 0 .5px 1px rgba(0,0,0,.2); }
.btn.danger{ color: var(--red); }
.btn.danger.primary{ background: var(--red); color: #fff; }
.btn svg.i{ width: 13px; height: 13px; }
.btn:disabled{ opacity: .45; }
/* Highlights feed */
.hl-group{ margin: 0 0 14px; }
.hl-src{ padding: 6px 24px 4px; font-size: 11px; font-weight: 600; color: var(--label-2); }
.hl-item{ position: relative; margin: 0 8px; border-radius: 7px; }
.hl-item:hover{ background: var(--hover); }
.hl-open{ display:block; width: 100%; text-align:left; padding: 7px 34px 9px 16px; border-radius: 7px; }
.hl-turn{ display:block; font-size: 11.5px; color: var(--label-2); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hl-ex{ font-size: 13px; line-height: 1.45; }
.hl-ctx{ color: var(--label-2); }
mark.hl, .hl-ex mark{ background: var(--hl); color: inherit; border-radius: 2px; padding: 0 1px; }
.hl-remove{ position:absolute; right: 8px; top: 8px; width: 20px; height: 20px; border-radius: 50%; display:none; align-items:center; justify-content:center; color: var(--label-2); background: var(--fill-2); }
.hl-remove svg.i{ width: 11px; height: 11px; stroke-width: 2.2; }
.hl-item:hover .hl-remove, .hl-remove:focus-visible{ display:flex; }

/* ── Thread pair ──────────────────────────────────────── */
.pair{ display:flex; flex-direction: column; flex: 0 0 auto; height: 100%; position: relative; }
.pair-cols{ flex: 1 1 auto; display:flex; min-height: 0; }
.pair-cols > .col + .col{ border-left: .5px solid var(--sep); }
.pair .col-head{ padding-left: 10px; }
.pair.is-current .col-title{ color: var(--label); }
.pair:not(.is-current) .col-title{ color: var(--label-2); }
.archived-tag{ font-size: 11px; color: var(--label-2); border: .5px solid var(--sep-strong); padding: 0 6px; border-radius: 5px; line-height: 18px; }
.msgs-col{ width: 250px; }
.answer-col{ width: 600px; }
.fu{ padding: 12px 12px 8px; }
.fu-mode{ display:flex; align-items:center; gap: 6px; font-size: 12px; color: var(--label-2); margin: 0 2px 6px; }
.fu-mode b{ color: var(--label); font-weight: 600; }
.fu-mode .tbtn{ height: 20px; min-width: 20px; margin-left: auto; padding: 0; }
.fu-mode .tbtn svg.i{ width: 12px; height: 12px; }
.fu-box{ display:flex; align-items:flex-end; gap: 6px; background: var(--field); border: .5px solid var(--field-border); border-radius: 18px; padding: 4px 4px 4px 12px; transition: box-shadow .15s; }
.fu-box:focus-within{ box-shadow: 0 0 0 3.5px var(--accent-ring); border-color: transparent; }
.fu-box textarea{ flex: 1 1 auto; border: 0; background: transparent; resize: none; line-height: 20px; min-height: 22px; max-height: 140px; padding: 2px 0; font-size: 13px; }
.fu-box .hint{ align-self: center; }
.fu-note{ font-size: 11.5px; color: var(--label-2); margin: 6px 4px 0; }
.src-block{ display:flex; gap: 6px; margin: 12px 12px 0; padding: 8px 10px; border-radius: 8px; background: var(--fill); color: var(--label-2); font-size: 12.5px; line-height: 1.4; }
.src-block svg.i{ width: 13px; height: 13px; margin-top: 2px; }
.msg-list{ list-style: none; margin: 0; padding: 0 0 30px; }
.msg{ position: relative; margin: 0 8px; border-radius: 7px; padding: 9px 12px 7px 14px; }
.msg::after{ content:""; position:absolute; left: 14px; right: 6px; bottom: -.5px; height: .5px; background: var(--sep); }
.msg:last-child::after, .msg.is-selected::after{ display: none; }
.msg-hit{ position:absolute; inset:0; border-radius: 7px; }
.msg-text{ position: relative; pointer-events: none; white-space: pre-wrap; font-size: 13px; line-height: 1.42; }
.msg-meta{ position: relative; display:flex; align-items:center; gap: 2px; margin-top: 5px; font-size: 11.5px; color: var(--label-2); height: 20px; }
.msg-meta time{ margin-right: 4px; }
.mbtn{ height: 20px; min-width: 22px; padding: 0 4px; border-radius: 5px; display:inline-flex; align-items:center; gap: 3px; color: var(--label-3); }
.mbtn svg.i{ width: 13px; height: 13px; }
.mbtn:hover{ background: var(--fill-2); color: var(--label); }
.mbtn.is-on svg.i{ fill: var(--yellow); stroke: var(--yellow); }
.mbtn.is-open{ color: var(--accent); }
.mpill{ display:inline-flex; align-items:center; gap: 4px; height: 17px; padding: 0 6px; border-radius: 9px; font-size: 10.5px; font-weight: 600; margin-right: 4px; }
.mpill.run{ color: var(--orange); background: color-mix(in srgb, var(--orange) 14%, transparent); }
.mpill.error{ color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
.mpill.plain{ color: var(--label-2); background: var(--fill-2); }
.msg:hover{ background: var(--hover); }
.msg.is-selected{ background: var(--sel-gray); }
.msgs-col:focus-within .msg.is-selected{ background: var(--accent); color: var(--on-accent); }
.msgs-col:focus-within .msg.is-selected .msg-meta, .msgs-col:focus-within .msg.is-selected .mbtn{ color: rgba(255,255,255,.8); }
.msgs-col:focus-within .msg.is-selected .mpill{ background: rgba(255,255,255,.2); color: #fff; }
.pulse{ width: 7px; height: 7px; border-radius: 50%; background: var(--orange); flex: 0 0 auto; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ opacity: 1; } 50%{ opacity: .35; } }
/* Answer */
.answer{ padding: 22px 52px 60px 30px; max-width: 760px; position: relative; }
.run-line{ display:flex; align-items:center; gap: 8px; font-size: 12px; color: var(--label-2); margin-bottom: 14px; padding: 6px 6px 6px 10px; border-radius: 8px; background: var(--fill); }
.run-line .act{ flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow:hidden; text-overflow: ellipsis; color: var(--label); }
.run-line .btn{ height: 20px; font-size: 12px; padding: 0 9px; }
.run-line .stop svg.i{ width: 9px; height: 9px; fill: currentColor; stroke: none; }
.trace{ margin: -6px 0 14px; padding: 8px 10px; border-radius: 8px; background: var(--code); font: 11.5px/1.6 var(--mono); color: var(--label-2); }
.trace div::before{ content:"› "; color: var(--label-3); }
.recap{ font-size: 13px; color: var(--label-2); margin: 0 0 14px; padding-left: 10px; border-left: 2px solid var(--accent); }
.recap b{ color: var(--label); font-weight: 600; }
.answer-body{ font-size: 14px; line-height: 1.6; color: var(--label); }
.blk{ position: relative; }
.answer-body p{ margin: 0 0 12px; }
.answer-body h3{ font: 600 14.5px/1.3 var(--font-display); margin: 20px 0 6px; }
.answer-body h3:first-child{ margin-top: 0; }
.answer-body ul{ margin: 0 0 12px; padding-left: 20px; }
.answer-body li{ margin: 2px 0; }
.answer-body table{ border-collapse: collapse; width: 100%; max-width: 420px; margin: 4px 0 14px; font-size: 12.5px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 .5px var(--sep-strong); }
.answer-body th{ text-align: left; font-weight: 600; font-size: 11.5px; color: var(--label-2); padding: 5px 10px; border-bottom: .5px solid var(--sep-strong); background: var(--fill); }
.answer-body td{ padding: 5px 10px; }
.answer-body tr:nth-child(even) td{ background: var(--table-stripe); }
.answer-body th.n{ text-align: right; }
.answer-body td.n{ text-align: right; font-variant-numeric: tabular-nums; }
.answer-body a, .src a{ color: var(--accent); text-decoration: none; }
.answer-body a:hover, .src a:hover{ text-decoration: underline; }
.src{ margin: 18px 0 0; padding: 12px 0 0; border-top: .5px solid var(--sep); font-size: 12.5px; }
.src h4{ margin: 0 0 6px; font-size: 11px; font-weight: 600; color: var(--label-2); }
.src ol{ margin: 0; padding-left: 18px; color: var(--label-2); }
.src li{ margin: 2px 0; }
mark.anchor{ background: var(--anchor); color: inherit; border-radius: 2px; box-shadow: 0 1.5px 0 var(--accent); }
.answer-body ::selection{ background: color-mix(in srgb, var(--accent) 32%, transparent); }
.marker{ position:absolute; right: -40px; top: 1px; width: 26px; height: 22px; border-radius: 6px; display:flex; align-items:center; justify-content:center; gap: 1px; color: var(--label-2); background: var(--fill); font-size: 10.5px; }
.marker svg.i{ width: 13px; height: 13px; }
.marker:hover{ background: var(--fill-2); color: var(--label); }
.marker.is-open{ background: var(--accent-soft); color: var(--accent); }
.marker.is-running::after{ content:""; position:absolute; right: 1px; top: 1px; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); }
.marker.is-whole{ top: -2px; }
.answer-foot{ margin-top: 16px; padding-top: 10px; border-top: .5px solid var(--sep); display:flex; gap: 8px; font-size: 11.5px; color: var(--label-2); }
.answer-foot .dotsep::before{ content:"·"; margin-right: 8px; }
.turn-note{ font-size: 13px; color: var(--label-2); margin: 8px 0; }
.turn-note.err{ color: var(--red); }
.turn-actions{ display:flex; gap: 8px; margin: 6px 0 14px; }
.caret{ display:inline-block; width: 7px; height: 15px; vertical-align: -2px; background: var(--accent); margin-left: 2px; animation: blink 1s steps(2) infinite; border-radius: 1px; }
@keyframes blink{ 50%{ opacity: 0; } }
/* Post / draft columns */
.post-col{ width: 420px; } .thread-col{ width: 300px; }
.post-body{ padding: 18px 22px 40px; font-size: 14px; line-height: 1.6; }
.post-body h2{ font: 700 18px/1.25 var(--font-display); margin: 0 0 10px; }
.post-body ul{ padding-left: 20px; margin: 0 0 10px; }
.post-body li{ margin: 3px 0; }
.post-body ul ul{ margin: 2px 0 4px; color: var(--label-2); }
.post-meta{ font-size: 11.5px; color: var(--label-2); margin-bottom: 12px; display:flex; gap: 6px; align-items:center; }
.draft-col{ width: 460px; }

/* ── Menus, popovers, dialogs ──────────────────────────── */
.layer{ position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.layer > *{ pointer-events: auto; }
.menu{ position: fixed; min-width: 200px; max-width: 300px; padding: 5px; border-radius: 10px; background: var(--menu); border: .5px solid var(--menu-border); box-shadow: var(--menu-shadow); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); font-size: 13px; z-index: 60; }
.mi{ display:flex; align-items:center; gap: 8px; width: 100%; height: 24px; padding: 0 10px 0 8px; border-radius: 5px; text-align: left; white-space: nowrap; position: relative; }
.mi .ck{ width: 12px; flex: 0 0 auto; display:flex; }
.mi .ck svg.i{ width: 12px; height: 12px; stroke-width: 2.2; }
.mi svg.i{ width: 14px; height: 14px; color: var(--label-2); }
.mi .lbl{ flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; }

function blockHTML(b, idx, node){
  let h;
  if (b.t === "p") h = `<p>${hlText(b.h, node)}</p>`;
  else if (b.t === "h") h = `<h3>${esc(b.h)}</h3>`;
  else if (b.t === "table") h = `<table><thead><tr>${b.head.map((x, i) => `<th${i ? ' class="n"' : ""}>${esc(x)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr><td>${esc(r[0])}</td><td class="n">${esc(r[1])}</td></tr>`).join("")}</tbody></table>`;
  else if (b.t === "src") h = `<div class="src"><h4>Sources</h4><ol>${b.items.map(s => `<li><a href="#" data-act="browse" data-url="${esc(s[1])}">${esc(s[0])}</a></li>`).join("")}</ol></div>`;
  return h;
}
function hlText(text, node){
  let html = esc(text);
  const openBranches = S.levels.map(l => NODES[l.head]).filter(n => n && n.branch && n.parent === node.id && n.anchor);
  const pendAnchor = S.pending && S.pending.parent === node.id && S.pending.anchor ? S.pending.anchor : null;
  const anchors = [...openBranches.map(n => n.anchor), ...(pendAnchor ? [pendAnchor] : [])];
  for (const a of anchors){ const e = esc(a); if (html.includes(e)) html = html.replace(e, `<mark class="anchor">${e}</mark>`); }
  for (const hl of node.highlights || []){ const e = esc(hl); if (html.includes(e) && !anchors.includes(hl)) html = html.replace(e, `<mark class="hl">${e}</mark>`); }
  if (S.find && S.find.q && S.find.q.length > 1){ const q = esc(S.find.q); html = html.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![^<]*>)", "gi"), (m) => `<mark class="find">${m}</mark>`); }
  return html;
}
function markersFor(node, levelIdx){
  const bs = branchesOf(node.id);
  const byBlock = {};
  bs.forEach(b => { const k = b.anchorBlock == null ? "whole" : b.anchorBlock; (byBlock[k] = byBlock[k] || []).push(b); });
  return byBlock;
}
function markerHTML(list, levelIdx, whole){
  const openHead = S.levels[levelIdx + 1] && S.levels[levelIdx + 1].head;
  const open = list.some(b => b.id === openHead);
  const running = list.some(b => isActive(b));
  const what = list.length === 1 ? (whole ? "1 branch from the whole answer" : "1 branch from this paragraph") : `${list.length} branches from ${whole ? "the whole answer" : "this paragraph"}`;
  return `<button class="marker${open ? " is-open" : ""}${running ? " is-running" : ""}${whole ? " is-whole" : ""}" data-act="marker" data-level="${levelIdx}" data-ids="${list.map(b => b.id).join(",")}" aria-label="${what}${running ? ", running" : ""}${open ? ", one is open. Closes it." : ""}">${ic("branch")}${list.length > 1 ? `<span class="tnum">${list.length}</span>` : ""}</button>`;
}
function answerHTML(node, levelIdx){
  let top = "";
  if (node.status === "running" || node.status === "starting"){
    const r = RUNS[node.id];
    const act = r && r.tool ? `Working · ${r.tool}` : "Working";
    top = `<div class="run-line" role="status"><span class="pulse" aria-hidden="true"></span><span class="act" data-run-act="${node.id}">${esc(act)}</span><span class="tnum" data-run-el="${node.id}">${fmt(node.elapsed || 0)}</span><button class="link-btn" data-act="trace" data-id="${node.id}" aria-pressed="${!!S.trace[node.id]}">${S.trace[node.id] ? "Hide trace" : "Show trace"}</button><button class="btn stop" data-act="stop" data-id="${node.id}">${ic("stop")}Stop</button></div>`
      + (S.trace[node.id] ? `<div class="trace" data-trace="${node.id}">${(r ? r.done : []).map(t => `<div>${esc(t)}</div>`).join("")}</div>` : "");
  } else if (node.status === "queued"){
    top = `<div class="run-line" role="status"><span class="pulse" aria-hidden="true" style="background:var(--label-3)"></span><span class="act">Queued</span><span class="tnum" title="Position in the queue">#${node.queuePos || 1}</span><button class="btn stop" data-act="stop" data-id="${node.id}">${ic("stop")}Stop</button></div>`;
  }
  const recap = node.recap ? `<p class="recap"><b>Recap:</b> ${esc(node.recap)}</p>` : "";
  let body = "";
  if (node.status === "running" && node.streamOut != null){
    body = `<div class="answer-body" data-body="${node.id}">${streamHTML(node)}</div>`;
  } else if (node.blocks && node.blocks.length){
    const marks = markersFor(node, levelIdx);
    body = `<div class="answer-body" data-body="${node.id}" data-node="${node.id}">${marks.whole ? `<div class="blk" style="height:0">${markerHTML(marks.whole, levelIdx, true)}</div>` : ""}${node.blocks.map((b, i) => `<div class="blk" data-blk="${i}">${blockHTML(b, i, node)}${marks[i] ? markerHTML(marks[i], levelIdx, false) : ""}</div>`).join("")}</div>`;
  } else if (node.status === "queued"){

  if (node.status === "failed") tail = `<p class="turn-note err">Error. The agent exited before writing an answer.</p><div class="turn-actions"><button class="btn" data-act="rerun" data-id="${node.id}">Retry</button><button class="btn">Edit question</button></div>`;
  const foot = node.status === "complete" ? `<div class="answer-foot"><span>${esc(node.time)}</span><span class="dotsep">${esc(node.agent)} · ${esc(node.model)}</span>${node.elapsedDone ? `<span class="dotsep tnum">${node.elapsedDone}</span>` : ""}</div>` : "";
  return `<div class="answer" data-answer="${node.id}">${top}${recap}${body}${tail}${foot}</div>`;
}
function streamHTML(node){

function renderThread(){

function snapshot(){ return JSON.stringify({ view: S.view, open: S.open, levels: S.levels }); }
function pushHistory(){ S.history.push(snapshot()); if (S.history.length > 50) S.history.shift(); S.future = []; }
function restore(snap){ const o = JSON.parse(snap); S.view = o.view; S.open = o.open; S.levels = o.levels; S.pending = null; render({ reveal: true }); }
function goBack(){ if (!S.history.length) return; S.future.push(snapshot()); restore(S.history.pop()); }

function openItem(id, nodeId){
  const it = item(id); if (!it) return;

  pushHistory();
  S.open = { kind: it.kind === "post" ? "post" : "tree", id };

    it.unread = false;
    if (nodeId && NODES[nodeId]){
      const n = NODES[nodeId];
      // Build levels from the root to the node's level.
      const path = []; let cur = n;
      while (cur){ const head = headOf(cur.id); path.unshift({ head, sel: path.length ? null : cur.id }); cur = NODES[head].parent ? NODES[NODES[head].parent] : null; }
      for (let i = 0; i < path.length; i++){ if (!path[i].sel) path[i].sel = i + 1 < path.length ? NODES[path[i + 1].head].parent : path[i].head; }

/* ───────── Runs (fake streaming) ───────── */
const CANNED = "Sources checked: NREL ATB 2026, the Sandia DOE Energy Storage Handbook (ch. 4) and the CAISO 2025 battery report.\n\nThe short answer depends on the duty cycle. For utility-scale LFP systems that cycle about once a day, most capacity loss comes from calendar aging at the resting state of charge, so operating limits on the SOC window matter more than cycle count over the first ten years.\n\nDevelopers usually plan for 2–3% capacity loss per year and size augmentation tranches in years 4, 8 and 12 to hold the contracted energy rating.";
const TOOLS = ["web_fetch atb.nrel.gov", "read_file notes/chapter-3.md", "web_fetch sandia.gov/ess/handbook", "web_fetch caiso.com/library", "read_file data/soc-bands.csv"];
function startRun(id, opts = {}){
  const n = NODES[id];
  n.status = "running"; n.elapsed = n.elapsed || 0; n.streamOut = opts.keep ? (n.streamOut || "") : ""; n.blocks = [];
  const text = n.streamText || CANNED;
  const words = text.split(/(\s+)/);
  let wi = opts.keep ? (n.streamOut ? n.streamOut.split(/(\s+)/).length : 0) : 0;
  const r = RUNS[id] = { tool: null, done: (n.tools || TOOLS).slice(0, opts.toolsDone || 0), tools: n.tools || TOOLS, ti: opts.toolsDone || 0, timer: null, clock: null };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wordDelay = opts.slow ? 520 : 55;
  r.tool = r.done[r.done.length - 1] || null;
  r.clock = setInterval(() => {
    n.elapsed++;
    const el = $(`[data-run-el="${id}"]`); if (el) el.textContent = fmt(n.elapsed);
    if (n.elapsed % 3 === 0 && r.ti < r.tools.length && (!opts.slow || n.elapsed % 9 === 0)){
      r.tool = r.tools[r.ti++]; r.done.push(r.tool);
      const a = $(`[data-run-act="${id}"]`); if (a) a.textContent = "Working · " + r.tool;
      const tr = $(`[data-trace="${id}"]`); if (tr) tr.insertAdjacentHTML("beforeend", `<div>${esc(r.tool)}</div>`);
    }
  }, 1000);
  const startDelay = opts.slow ? 0 : 1600;
  setTimeout(() => {
    if (n.status !== "running") return;
    r.timer = setInterval(() => {
      if (n.status !== "running"){ clearInterval(r.timer); return; }
      const step = reduce ? 12 : 1;
      for (let s = 0; s < step && wi < words.length; s++) n.streamOut += words[wi++];
      const b = $(`[data-body="${id}"]`); if (b) b.innerHTML = streamHTML(n);
      if (wi >= words.length) finishRun(id);
    }, wordDelay);
  }, startDelay);
}
function finishRun(id){
  const n = NODES[id], r = RUNS[id];
  if (r){ clearInterval(r.timer); clearInterval(r.clock); }
  n.status = "complete"; n.elapsedDone = fmt(n.elapsed || 0); n.time = "now";
  n.blocks = (n.streamOut || "").split("\n\n").map(p => ({ t: "p", h: p }));
  n.streamOut = null;
  const it = item(n.tree);
  if (it && !(S.open && S.open.id === it.id)) it.unread = true;
  render();
  notify("Research complete", n.prompt, it ? it.id : null, id);
}
function stopRun(id){
  const n = NODES[id], r = RUNS[id];
  if (r){ clearInterval(r.timer); clearInterval(r.clock); }
  if (n.status === "queued"){ n.status = "stopped"; n.elapsed = 0; }
  else { n.status = "stopped"; n.blocks = n.streamOut ? n.streamOut.split("\n\n").map(p => ({ t: "p", h: p })) : []; n.streamOut = null; }
  render();
}

function submitFollowup(key){

  const cmds = () => [

  let hot = 0, list = [];
  const draw = () => {
    const q = $("#palInput").value.toLowerCase();

  };
