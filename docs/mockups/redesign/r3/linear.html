<!doctype html>
<!--
  Session · Linear restyle (round 3). Same layout, controls, keys and copy as the current app;
  only the visual language follows Linear (type scale, quiet sidebar, list rows, circular run-status
  icons, layered greys with one accent, menus/popovers/keycaps, command menu, toasts).

  INVENTORY OF THE CURRENT APP (checked against src/App.tsx, src/lib/appShortcuts.ts,
  src/components/research/*, src/components/{CommandPalette,AgentSetupGuide}.tsx, and
  docs/mockups/column-workspace.html; also cross-checked with r3/ulysses.html's inventory)
  1. Window: sidebar (full) or the 52px icon rail, then one horizontally scrolling strip of columns.
     ⇧⌘G toggles; a narrow window forces the rail and disables its expand button.
  2. Sidebar header: window buttons, Collapse sidebar (⇧⌘G) beside them; at the right Settings (⌘,),
     Agents, Dark/Light mode.
  3. Sidebar rows, in order: Home (⌘N chip while ⌘ is held), Bookmarks, Highlights; section "Folders"
     with + (New folder); Drafts, user folders (… menu: Rename…, Delete…), Archive. No counts.
  4. Sidebar foot: workspace switcher (folder icon, name, path, chevron; ⌘O): workspaces with check and
     count, Add workspace…, Rename “…”…, Open in Finder, Move workspace folder…, Remove workspace…;
     then the GitHub account control (avatar, name, login; a neutral placeholder account here).
  5. Rail: Expand sidebar, Home, Bookmarks, Highlights, divider, Drafts, user folders as monograms,
     Archive, New folder; foot: workspace, Agents, Dark/Light mode, Settings (⌘,). Tooltips at the right.
  6. Feed column (first column of the strip), 44px header: title (hidden on Home in rail mode); Home:
     Refresh Home, Import .md report; Bookmarks/folders/Drafts/Archive: Back to Home, + Ask; user
     folder: Rename folder, Delete folder (inline confirm).
  7. Home: the ask box at the top ("Ask a question"; Post mode "Ask your network, or paste a link to
     save"). Expanded row: Ask/Post radio pair (Ask = selected agent's icon, a second press opens the
     model menu with an Effort submenu; Post = "Post to network"), Send (↵, or ⌘↵ by setting); Save draft
     under the box when it has text; ⌃Tab cycles model, ⌃⇧Tab agent. Then Unfiled cards (newest first),
     then trays: Drafts, each folder, Archive (name opens the page, count, collapse chevron).
  8. Feed card: optional title, question (or post body, link card, post embed), unread dot "Updated",
     status dot for Running/Failed, hover grip and … ("Bookmark, follow or move": Bookmark, Follow,
     Move to …, New folder…); right-click: Generate recap, Rename, Archive (A), Delete (D). Starred
     follow-ups/branches follow as indented child rows (star, running dot, … "Remove star…").
  9. Thread = pairs in the strip: [messages | answer] for the root, then one pair per open branch.
     Pair header spans both: Back/Forward (root), title or "⑂ Branch · N messages", "+ Ask" (⌘J).
     Post trees: [Post | Thread · N] with "Post actions" … menu (Edit post, Bookmark/Follow/Move).
 10. Messages column: follow-up composer on top ("Ask a follow-up", "(queued)" while busy), then rows
     newest first: question, time, status chip (Queued/Running/Failed/Stopped), star, branch count,
     … (Answer actions: meta line with words · duration · agent · model, Branch from the whole answer,
     Copy answer as Markdown, Copy thread as Markdown, Show full transcript, Retry run, Generate recap,
     Rename…, Delete). A branch column starts with "↳ “quoted passage”".
 11. Answer column: run status line ("Working · <latest tool>", elapsed, Stop / "Queued" / "Stopped
     after …" + Run again), activity disclosure (tool calls), "Recap: …", answer Markdown with saved
     highlights and branched passages, branch markers in the right margin (per paragraph; whole-answer
     ones at the foot), foot with time. Empty strip end: "Select a passage or a branch marker beside
     the answer to open it as the next pair."
 12. Selection bar on answer text: Branch (A), Highlight (H; E also), Copy; note while running.
     New branch = pending pair "New branch" with the quote and "Ask about this passage" (Esc cancels).
 13. Surfaces: ⌘K palette ("Type a command or search…": Research titles with "N running", Actions:
     Home ⌘N, Toggle sidebar ⇧⌘G, Open Settings ⌘,, Open Agents); Settings (Basic / Remotes);
     Agent Setup (intro, agent tabs, steps Install the CLI / Sign in / Refresh status, Copy command,
     Setup guide, Next agent, Refresh status); feed toasts with Undo; source browser overlay (⇧⌘E).
  Influence: Linear. No Linear names, logos or marks appear in the UI.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session · Linear restyle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --font:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
  --win:#f1f1f2; --panel:#fdfdfd; --panel-2:#f8f8f9; --card:#ffffff; --elev:#ffffff; --input:#ffffff;
  --hover:rgba(15,15,20,.04); --sel:rgba(15,15,20,.06); --sel-strong:rgba(15,15,20,.09);
  --border:#e7e7ea; --border-2:#dcdce0; --border-3:#c9c9cf;
  --text:#1c1d21; --text-2:#3b3d44; --muted:#6b6e77; --faint:#9a9da5;
  --accent:#5e6ad2; --accent-hover:#4f5bc4; --accent-text:#4a54bd; --accent-soft:rgba(94,106,210,.11); --on-accent:#ffffff;
  --run:#d49500; --done:#5e6ad2; --fail:#e5484d; --queued:#9a9da5; --stopped:#9a9da5;
  --fail-soft:rgba(229,72,77,.09);
  --hl:rgba(245,183,49,.30); --hl-strong:rgba(245,183,49,.5); --br:rgba(94,106,210,.12); --br-line:rgba(94,106,210,.6);
  --kbd-bg:#f0f0f2; --kbd-border:#e0e0e4; --kbd-text:#5f626a;
  --shadow-pop:0 0 0 1px rgba(15,15,20,.07),0 4px 10px rgba(15,15,20,.05),0 14px 32px rgba(15,15,20,.10);
  --shadow-modal:0 0 0 1px rgba(15,15,20,.07),0 24px 64px rgba(15,15,20,.18);
  --scrim:rgba(24,24,30,.26);
  --tip-bg:#1c1d21; --tip-text:#f1f1f3; --tip-kbd:rgba(255,255,255,.14);
  --ring:rgba(94,106,210,.55);
  --light-r:#ff5f57; --light-y:#febc2e; --light-g:#28c840;
  --g-claude:#c46a47; --g-codex:#2e8b7c; --g-grok:#5f636b; --g-user:#7a62c9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --win:#08090a; --panel:#0f1012; --panel-2:#121316; --card:#141518; --elev:#1a1b1e; --input:#131417;
    --hover:rgba(255,255,255,.035); --sel:rgba(255,255,255,.06); --sel-strong:rgba(255,255,255,.09);
    --border:rgba(255,255,255,.065); --border-2:rgba(255,255,255,.095); --border-3:rgba(255,255,255,.15);
    --text:#e4e5e9; --text-2:#c4c6cc; --muted:#8a8e97; --faint:#5e626b;
    --accent:#5e6ad2; --accent-hover:#6d79e2; --accent-text:#9aa2f6; --accent-soft:rgba(110,121,230,.16); --on-accent:#ffffff;
    --run:#f0bf00; --done:#7380ea; --fail:#eb5757; --queued:#6d717a; --stopped:#6d717a;
    --fail-soft:rgba(235,87,87,.12);
    --hl:rgba(240,191,0,.19); --hl-strong:rgba(240,191,0,.34); --br:rgba(115,128,234,.17); --br-line:rgba(150,160,245,.65);
    --kbd-bg:rgba(255,255,255,.06); --kbd-border:rgba(255,255,255,.08); --kbd-text:#a3a7af;
    --shadow-pop:0 0 0 1px rgba(255,255,255,.07),0 10px 28px rgba(0,0,0,.55);
    --shadow-modal:0 0 0 1px rgba(255,255,255,.08),0 24px 72px rgba(0,0,0,.65);
    --scrim:rgba(0,0,0,.52);
    --tip-bg:#26272b; --tip-text:#e4e5e9; --tip-kbd:rgba(255,255,255,.1);
    --ring:rgba(130,140,245,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --win:#08090a; --panel:#0f1012; --panel-2:#121316; --card:#141518; --elev:#1a1b1e; --input:#131417;
  --hover:rgba(255,255,255,.035); --sel:rgba(255,255,255,.06); --sel-strong:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.065); --border-2:rgba(255,255,255,.095); --border-3:rgba(255,255,255,.15);
  --text:#e4e5e9; --text-2:#c4c6cc; --muted:#8a8e97; --faint:#5e626b;
  --accent:#5e6ad2; --accent-hover:#6d79e2; --accent-text:#9aa2f6; --accent-soft:rgba(110,121,230,.16); --on-accent:#ffffff;
  --run:#f0bf00; --done:#7380ea; --fail:#eb5757; --queued:#6d717a; --stopped:#6d717a;
  --fail-soft:rgba(235,87,87,.12);
  --hl:rgba(240,191,0,.19); --hl-strong:rgba(240,191,0,.34); --br:rgba(115,128,234,.17); --br-line:rgba(150,160,245,.65);
  --kbd-bg:rgba(255,255,255,.06); --kbd-border:rgba(255,255,255,.08); --kbd-text:#a3a7af;
  --shadow-pop:0 0 0 1px rgba(255,255,255,.07),0 10px 28px rgba(0,0,0,.55);
  --shadow-modal:0 0 0 1px rgba(255,255,255,.08),0 24px 72px rgba(0,0,0,.65);
  --scrim:rgba(0,0,0,.52);
  --tip-bg:#26272b; --tip-text:#e4e5e9; --tip-kbd:rgba(255,255,255,.1);
  --ring:rgba(130,140,245,.65);
}
/* Variant d: one neutral accent instead of indigo (both themes, derived from text tokens). */
:root[data-variant="d"]{
  --accent:var(--text); --accent-hover:var(--text-2); --accent-text:var(--text); --accent-soft:var(--sel);
  --on-accent:var(--panel); --done:var(--muted); --br:var(--sel-strong); --br-line:var(--muted); --ring:var(--border-3);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--win);color:var(--text);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"cv11","ss01"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
textarea,input,select{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--ring)}
[tabindex="-1"]:focus-visible{box-shadow:none}
svg{flex:none;display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
kbd,.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:4px;background:var(--kbd-bg);border:1px solid var(--kbd-border);color:var(--kbd-text);font:500 10.5px/1 var(--font);letter-spacing:.02em}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- app frame ---------- */
.app{display:flex;height:100vh;width:100vw;position:relative}
.lights{position:absolute;left:14px;top:15px;display:flex;gap:8px;z-index:5}
.lights i{width:12px;height:12px;border-radius:50%;background:var(--light-r);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.lights i:nth-child(2){background:var(--light-y)} .lights i:nth-child(3){background:var(--light-g)}
.app.is-rail .lights{left:6px;gap:5px}
.app.is-rail .lights i{width:11px;height:11px}

.ibtn{width:26px;height:26px;display:inline-grid;place-items:center;border-radius:6px;color:var(--muted);position:relative;flex:none}
.ibtn:hover{background:var(--hover);color:var(--text)}
.ibtn.is-active{background:var(--sel);color:var(--text)}
.ibtn[aria-disabled="true"]{opacity:.4}

/* ---------- sidebar ---------- */
.sidebar{width:228px;flex:none;display:flex;flex-direction:column;padding:0 6px 8px 8px;min-height:0}
.sb-top{height:44px;display:flex;align-items:center;flex:none;padding-left:66px}
.sb-top .sp{flex:1}
.sb-top .ibtn{width:24px;height:24px}
.sb-body{flex:1;overflow-y:auto;min-height:0;padding-top:6px}
.nav{display:flex;flex-direction:column;gap:1px}
.nrow{display:flex;align-items:center;height:28px;border-radius:6px;position:relative;color:var(--text-2)}
.nrow:hover{background:var(--hover)}
.nrow.is-selected{background:var(--sel);color:var(--text)}
.nrow .nsel{flex:1;display:flex;align-items:center;gap:9px;height:100%;padding:0 8px;min-width:0;border-radius:6px;font-weight:500;font-size:13px}
.nrow .nsel svg{color:var(--muted)}
.nrow.is-selected .nsel svg{color:var(--text)}
.nrow .nlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.nrow .nmenu{opacity:0;margin-right:3px;width:22px;height:22px}
.nrow:hover .nmenu,.nrow .nmenu:focus-visible,.nrow.has-open-menu .nmenu{opacity:1}
.nrow.is-drop{box-shadow:inset 0 0 0 1px var(--accent)}
.nsec{display:flex;align-items:center;height:28px;margin-top:14px;padding:0 3px 0 8px;color:var(--muted);font-size:12px;font-weight:500}
.nsec span{flex:1}
.nsec .ibtn{width:22px;height:22px;opacity:.8}
.hint{display:none}
body.show-hints .hint{display:inline-flex}
.nrow .hint{margin-left:auto}
.sb-foot{flex:none;display:flex;flex-direction:column;gap:4px;padding-top:8px}
.wsbtn,.acct{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:8px;text-align:left;position:relative}
.wsbtn{border:1px solid var(--border);background:var(--card)}
.wsbtn:hover,.acct:hover{background:var(--hover)}
.wsbtn .wsico{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--sel);color:var(--text-2)}
.ws-copy{flex:1;min-width:0;display:flex;flex-direction:column}
.ws-name{font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-path{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsbtn .chev,.acct .chev{color:var(--faint)}
.wsbtn .hint{position:absolute;right:28px;top:50%;transform:translateY(-50%)}
.avatar{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#fff;background:var(--g-user);flex:none}

/* ---------- rail ---------- */
.rail{display:none;width:52px;flex:none;flex-direction:column;align-items:center;padding:40px 0 8px;gap:2px;min-height:0}
.app.is-rail .sidebar{display:none}
.app.is-rail .rail{display:flex}
.rail .ibtn{width:32px;height:32px;border-radius:7px}
.rail .ibtn.is-selected{background:var(--sel);color:var(--text)}
.rail .mono{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;border:1.4px solid currentColor;font-size:10px;font-weight:600;line-height:1}
.rail-div{width:20px;height:1px;background:var(--border-2);margin:6px 0}
.rail-folders{display:flex;flex-direction:column;align-items:center;gap:2px;overflow-y:auto;min-height:0}
.rail-sp{flex:1}

/* ---------- main inset panel + strip ---------- */
.main{flex:1;min-width:0;margin:8px 8px 8px 0;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.strip{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-behavior:smooth}
.col{display:flex;flex-direction:column;min-height:0;flex:none;position:relative}
.colhead{height:44px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px 0 16px;border-bottom:1px solid var(--border)}
.colhead h2{margin:0;font-size:13px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.colhead .sp{flex:1}
.colhead .back{margin-left:-6px}
.scroll{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.ghostbtn{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:6px;color:var(--text-2);font-size:12.5px;font-weight:500}
.ghostbtn:hover{background:var(--hover);color:var(--text)}
.ghostbtn svg{color:var(--muted)}
.pbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:6px;background:var(--accent);color:var(--on-accent);font-weight:500;font-size:12.5px}
.pbtn:hover{background:var(--accent-hover)}
.pbtn[disabled]{opacity:.45}
.sbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:6px;border:1px solid var(--border-2);background:var(--card);font-weight:500;font-size:12.5px;color:var(--text)}
.sbtn:hover{background:var(--hover)}
.sbtn.danger{color:var(--fail)}

/* ---------- feed ---------- */
.feed{width:336px;border-right:1px solid var(--border)}
.app.is-rail .cola{width:clamp(440px,calc(100vw - 52px - 336px - 264px - 34px),640px)}
.app.is-rail .feed .colhead.is-home h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.feed-body{padding:0 0 64px}
.nc-wrap{padding:12px 12px 6px}
.nc{border:1px solid var(--border-2);background:var(--input);border-radius:9px;padding:9px 10px 9px 12px;transition:border-color .12s,box-shadow .12s}
.nc:focus-within,.nc.menu-open{border-color:var(--border-3);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.nc textarea{display:block;width:100%;border:0;background:none;resize:none;font-size:13.5px;line-height:1.5;min-height:20px;max-height:180px;padding:0;color:var(--text)}
.nc textarea::placeholder{color:var(--faint)}
.nc-row{display:none;align-items:center;gap:6px;margin-top:9px}
.nc:focus-within .nc-row,.nc.has-text .nc-row,.nc.menu-open .nc-row{display:flex}
.nc-row .sp{flex:1}
.switch{display:inline-flex;align-items:center;height:26px;border-radius:7px;border:1px solid var(--border-2);padding:2px;gap:2px;background:var(--panel-2)}
.switch button{height:20px;display:inline-flex;align-items:center;gap:5px;padding:0 6px;border-radius:5px;color:var(--muted);font-size:12px;font-weight:500}
.switch button[aria-checked="true"]{background:var(--card);color:var(--text);box-shadow:0 0 0 1px var(--border-2),0 1px 2px rgba(0,0,0,.06)}
.switch .chev{color:var(--faint)}
.send{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.send:hover{background:var(--accent-hover)}
.send[disabled]{background:var(--sel-strong);color:var(--faint)}
.nc-after{display:none;justify-content:flex-end;padding:4px 2px 0}
.nc-wrap.has-text .nc-after{display:flex}
.nc-note{margin:8px 0 0;font-size:12px;color:var(--muted)}
.glyph{width:16px;height:16px;border-radius:5px;display:inline-grid;place-items:center;font:600 9.5px/1 var(--font);color:#fff;flex:none;letter-spacing:0}
.glyph.claude{background:var(--g-claude)} .glyph.codex{background:var(--g-codex)} .glyph.grok{background:var(--g-grok)} .glyph.you{background:var(--g-user);border-radius:50%}

.list{padding:4px 0}
.card{position:relative;display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:2px 10px;align-items:start;padding:9px 14px 9px 16px;cursor:default;border-radius:0}
.card:hover{background:var(--hover)}
.card.is-selected{background:var(--sel)}
.card.is-selected::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent)}
.card .lead{padding-top:1px;color:var(--muted);display:flex;align-items:center;height:18px}
.card .main-c{min-width:0}
.card .ttl{font-weight:500;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px}
.card .q{color:var(--muted);font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.card .q.is-body{color:var(--text-2);font-size:13px;-webkit-line-clamp:3}
.card .meta{display:flex;align-items:center;gap:8px;height:18px;color:var(--faint);font-size:12px}
.card .acts{position:absolute;right:10px;top:7px;display:none;gap:1px;background:var(--panel);border-radius:7px;box-shadow:0 0 0 1px var(--border-2),0 2px 6px rgba(0,0,0,.06);padding:1px}
.card .acts .ibtn{width:24px;height:24px}
.card .acts .ibtn.is-on{color:var(--accent-text)}
.card:hover .acts,.card:focus-within .acts,.card.has-open-menu .acts{display:flex}
.card .grip{position:absolute;left:2px;top:50%;transform:translateY(-50%);color:var(--faint);opacity:0}
.card:hover .grip{opacity:.8}
.unread{position:absolute;right:16px;bottom:12px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.card:hover .unread{display:none}
.linkcard{margin-top:6px;border:1px solid var(--border);border-radius:7px;padding:7px 9px;display:flex;gap:9px;align-items:center;background:var(--panel-2)}
.linkcard .fav{width:22px;height:22px;border-radius:5px;background:var(--sel);display:grid;place-items:center;color:var(--muted);flex:none}
.linkcard b{display:block;font-weight:500;font-size:12.5px;color:var(--text);line-height:1.35}
.linkcard span{font-size:11.5px;color:var(--muted)}
.tweet{margin-top:6px;border:1px solid var(--border);border-radius:7px;padding:8px 10px;background:var(--panel-2)}
.tweet .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:3px}
.tweet .who b{color:var(--text);font-weight:500}
.tweet p{margin:0;color:var(--text-2);font-size:12.5px}
.child{position:relative;display:flex;align-items:center;gap:8px;padding:5px 14px 5px 42px;color:var(--text-2);font-size:12.5px}
.child::before{content:"";position:absolute;left:23px;top:0;bottom:0;width:1px;background:var(--border-2)}
.child.is-last::before{bottom:50%}
.child::after{content:"";position:absolute;left:23px;top:50%;width:10px;height:1px;background:var(--border-2)}
.child:hover{background:var(--hover)}
.child.is-selected{background:var(--sel);color:var(--text)}
.child .ctext{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.child .star{color:var(--run)}
.child .acts{display:none}

.tray{border-top:1px solid var(--border);margin-top:4px}
.tray-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 16px;background:var(--panel-2);border-bottom:1px solid var(--border)}
.tray-h .tname{font-weight:500;font-size:12.5px;color:var(--text)}

.tray-h .sp{flex:1}
.tray-h .ibtn{width:22px;height:22px}
.tray-h svg.tico{color:var(--muted)}
.tray.is-collapsed .tray-h{border-bottom-color:transparent}
.tray.is-collapsed .tray-b{display:none}
.tray.is-collapsed .tray-h .chev{transform:rotate(-90deg)}
.empty{padding:14px 16px;color:var(--muted);font-size:12.5px}
.empty.big{padding:40px 24px;text-align:center}
.empty.big b{display:block;color:var(--text);font-weight:500;font-size:13px;margin-bottom:4px}
.confirm{margin:10px 12px;padding:10px 12px;border:1px solid var(--border-2);border-radius:8px;background:var(--card);font-size:12.5px}
.confirm .row{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}

/* highlights feed */
.hgroup{padding:10px 0 4px}
.hsrc{padding:0 16px 4px;font-size:12px;font-weight:500;color:var(--muted)}
.hitem{display:flex;gap:6px;padding:7px 10px 7px 16px;align-items:flex-start}
.hitem:hover{background:var(--hover)}
.hitem .hopen{flex:1;text-align:left;min-width:0}
.hitem .hturn{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.hitem .hex{font-size:13px;color:var(--text-2);line-height:1.5}
.hitem mark{background:var(--hl);color:var(--text);border-radius:2px;padding:0 1px}
.hitem .ibtn{opacity:0}
.hitem:hover .ibtn{opacity:1}

/* status icons and pills */
.st{display:inline-grid;place-items:center;width:14px;height:14px}
.st-queued{color:var(--queued)} .st-running{color:var(--run)} .st-complete{color:var(--done)} .st-failed{color:var(--fail)} .st-cancelled{color:var(--stopped)} .st-post,.st-draft,.st-link{color:var(--muted)}
.pill{display:none;align-items:center;height:18px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;border:1px solid var(--border-2);white-space:nowrap}
.pill.p-running{color:var(--run);border-color:color-mix(in srgb,var(--run) 40%,transparent)}
.pill.p-failed{color:var(--fail);border-color:color-mix(in srgb,var(--fail) 40%,transparent)}
.pill.p-queued,.pill.p-cancelled{color:var(--muted)}
.mstat{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.mstat.s-running{color:var(--text-2)}
.mstat.s-failed{color:var(--fail)}
@media (prefers-reduced-motion: no-preference){
  .st-running svg .pie{transform-origin:7px 7px;animation:pulse 1.6s ease-in-out infinite}
}
@keyframes pulse{50%{opacity:.45}}

/* ---------- thread pairs ---------- */
.pair{border-right:1px solid var(--border)}
.pair-head{height:44px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px 0 14px;border-bottom:1px solid var(--border)}
.pair-head h2{margin:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;color:var(--text)}
.pair-head .cnt{color:var(--muted);font-size:12.5px;white-space:nowrap}
.pair-head .sp{flex:1}
.pair-head .bico{color:var(--muted)}
.pair:not(.is-current) .pair-head h2{color:var(--text-2)}
.hist{display:flex;gap:1px;margin-right:2px}
.hist .ibtn{width:24px;height:24px}
.pair-body{flex:1;display:flex;min-height:0}
.colm{width:264px;flex:none;border-right:1px solid var(--border);background:var(--panel-2);display:flex;flex-direction:column;min-height:0}
.cola{width:clamp(440px,calc(100vw - 228px - 336px - 264px - 34px),640px);flex:none;position:relative;display:flex;flex-direction:column;min-height:0}
.colp{width:420px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.colt{width:340px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--panel-2)}
.src{display:flex;gap:7px;padding:12px 14px 4px;color:var(--muted);font-size:12.5px;line-height:1.45}
.src i{color:var(--text-2)}
.cc-wrap{padding:10px 10px 6px}
.cc-mode{display:flex;align-items:center;gap:6px;margin:0 2px 7px 4px;font-size:12px;color:var(--muted)}
.cc-mode b{color:var(--text);font-weight:500}
.cc-mode .sp{flex:1}
.cc-mode .ibtn{width:20px;height:20px}
.cc{display:flex;align-items:flex-end;gap:6px;border:1px solid var(--border-2);background:var(--input);border-radius:9px;padding:7px 6px 6px 11px}
.cc:focus-within{border-color:var(--border-3);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.cc textarea{flex:1;border:0;background:none;resize:none;font-size:13px;line-height:1.5;padding:2px 0;min-height:21px;max-height:160px;color:var(--text)}
.cc textarea::placeholder{color:var(--faint)}
.cc .send{width:24px;height:24px;border-radius:6px}
.cc .hint{align-self:center}
.cc-note{font-size:12px;color:var(--muted);margin:6px 4px 0}
.msgs{list-style:none;margin:0;padding:4px 0 24px}
.msg{position:relative;margin:2px 8px;padding:9px 10px 7px;border-radius:8px;cursor:default}
.msg:hover{background:var(--hover)}
.msg.is-selected{background:var(--card);box-shadow:0 0 0 1px var(--border-2),0 1px 3px rgba(0,0,0,.04)}
.msg .mtext{font-size:13px;line-height:1.5;color:var(--text)}
.msg:not(.is-selected) .mtext{color:var(--text-2)}
.msg .mmeta{display:flex;align-items:center;gap:6px;margin-top:5px;color:var(--faint);font-size:12px;min-height:22px}
.msg .mmeta .ibtn{width:22px;height:22px}
.msg .mmeta .ibtn.is-on{color:var(--run)}
.msg .brc{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 6px;border-radius:6px;color:var(--muted);font-size:12px}
.msg .brc:hover{background:var(--hover);color:var(--text)}
.msg .brc.is-open{color:var(--accent-text);background:var(--accent-soft)}
.msg .more{opacity:0}
.msg:hover .more,.msg.is-selected .more,.msg .more:focus-visible{opacity:1}

.answer{padding:22px 48px 32px 30px;font-size:14.5px;line-height:1.68;color:var(--text-2);position:relative;max-width:600px}
.answer p{margin:0 0 12px}
.answer h3{font-size:14px;font-weight:600;color:var(--text);margin:20px 0 6px;letter-spacing:-.005em}
.answer strong{color:var(--text);font-weight:600}
.answer table{border-collapse:collapse;width:100%;margin:6px 0 16px;font-size:13px}
.answer caption{caption-side:top;text-align:left;font-size:12px;color:var(--muted);padding-bottom:6px}
.answer th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;border-bottom:1px solid var(--border-2);padding:6px 10px 6px 0}
.answer td{border-bottom:1px solid var(--border);padding:7px 10px 7px 0;color:var(--text)}
.answer td.num{font-variant-numeric:tabular-nums}
.answer ol,.answer ul{margin:0 0 12px;padding-left:20px}
.answer li{margin:2px 0}
.answer .srch{font-size:12px;font-weight:500;color:var(--muted);margin:18px 0 6px;text-transform:none}
.sources{list-style:none;padding:0!important;margin:0 0 6px!important;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.sources li{margin:0!important;border-top:1px solid var(--border)}
.sources li:first-child{border-top:0}
.sources a{display:flex;align-items:center;gap:9px;padding:7px 10px;color:var(--text-2);text-decoration:none;font-size:12.5px}
.sources a:hover{background:var(--hover);color:var(--text)}
.sources a .n{width:18px;height:18px;border-radius:5px;background:var(--sel);display:grid;place-items:center;font-size:10.5px;color:var(--muted);font-weight:600;flex:none}
.sources a .d{margin-left:auto;color:var(--faint);font-size:11.5px}
mark.hl{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
.brx{background:var(--br);border-bottom:1.5px solid var(--br-line);border-radius:2px;cursor:pointer}
.brx mark.hl{background:linear-gradient(var(--hl),var(--hl))}
.recap{display:flex;gap:8px;padding:9px 12px;margin:0 0 16px;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);font-size:13px;color:var(--text-2);line-height:1.5}
.recap svg{color:var(--accent-text);margin-top:2px}
.recap b{font-weight:500;color:var(--text)}
.foot{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);margin-top:18px;padding-top:10px;color:var(--faint);font-size:12px;position:relative;min-height:34px}
.marker{position:absolute;right:12px;display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 6px;border-radius:999px;border:1px solid var(--border-2);background:var(--panel);color:var(--muted);font-size:11.5px;z-index:2}
.marker:hover{color:var(--text);border-color:var(--border-3)}
.marker.is-open{color:var(--accent-text);border-color:var(--br-line);background:var(--accent-soft)}
.marker.is-running::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--run);margin-left:2px}
.foot .marker{position:static;margin-left:auto}

.runline{display:flex;align-items:center;gap:8px;min-height:34px;padding:4px 6px 4px 10px;line-height:1.4;border:1px solid var(--border-2);border-radius:8px;background:var(--panel-2);margin-bottom:14px;font-size:12.5px;color:var(--text-2)}
.runline .what{flex:1;min-width:0}
.runline .el{color:var(--muted);font-variant-numeric:tabular-nums}
.runline .stop{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--border-2);background:var(--card);font-size:12px;font-weight:500}
.runline .stop:hover{background:var(--hover)}
.activity{margin:-6px 0 16px}
.act-toggle{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 6px;margin-left:-6px;border-radius:6px;color:var(--muted);font-size:12px;font-weight:500}
.act-toggle:hover{background:var(--hover);color:var(--text)}
.act-toggle .chev{transition:transform .12s}
.activity.is-open .act-toggle .chev{transform:rotate(90deg)}
.timeline{display:none;list-style:none;margin:6px 0 0;padding:0 0 0 2px;position:relative}
.activity.is-open .timeline{display:block}
.timeline::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:1px;background:var(--border-2)}
.timeline li{position:relative;display:flex;align-items:center;gap:10px;padding:4px 0;font-size:12.5px;color:var(--muted)}
.timeline .tico{width:18px;height:18px;border-radius:50%;background:var(--panel);border:1px solid var(--border-2);display:grid;place-items:center;color:var(--muted);z-index:1;flex:none}
.timeline b{color:var(--text-2);font-weight:500;font-family:var(--mono);font-size:11.5px}
.timeline .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeline time{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.stream .caret{display:inline-block;width:7px;height:14px;background:var(--accent);vertical-align:-2px;margin-left:2px;border-radius:1px}
@media (prefers-reduced-motion: no-preference){.stream .caret{animation:blink 1s steps(2) infinite}}
@keyframes blink{50%{opacity:0}}
.note{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border-2);border-radius:8px;background:var(--panel-2);font-size:13px;color:var(--text-2);margin-bottom:14px}
.note .sp{flex:1}
.note.is-error{border-color:color-mix(in srgb,var(--fail) 35%,transparent);background:var(--fail-soft)}
.filler{flex:1 0 280px;display:grid;place-items:center;padding:24px;color:var(--faint);font-size:12.5px;text-align:center;line-height:1.55}

/* post pair */
.post{padding:20px 26px 32px;font-size:14px;line-height:1.65;color:var(--text-2)}
.post .pmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:12px}

.post ul{margin:0;padding-left:20px}

.prow{list-style:none;margin:0;padding:6px 0}
.prow li{margin:2px 8px;padding:8px 10px;border-radius:8px}
.prow li:hover{background:var(--hover)}
.prow .who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:3px}
.prow .who b{color:var(--text);font-weight:500}

/* ---------- popovers, menus, tooltips ---------- */
#layer{position:fixed;inset:0;pointer-events:none;z-index:50}

.menu{position:fixed;min-width:200px;max-width:320px;background:var(--elev);border-radius:9px;box-shadow:var(--shadow-pop);padding:4px;font-size:13px;z-index:60}

@keyframes pop{from{opacity:0;transform:translateY(-2px) scale(.99)}}
.mi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border-radius:6px;color:var(--text);text-align:left}
.mi svg{color:var(--muted)}

.mi .mc{color:var(--faint);font-size:12px}

.mi.is-active,.mi:hover{background:var(--sel)}

.mi.danger{color:var(--fail)} .mi.danger svg{color:var(--fail)}
.msep{height:1px;background:var(--border-2);margin:4px 2px}
.mhead{padding:6px 8px 4px;font-size:11.5px;color:var(--muted);font-weight:500}
.mmeta{padding:6px 8px;font-size:12px;color:var(--muted);line-height:1.4}
.mfoot{display:flex;gap:10px;padding:6px 8px 4px;border-top:1px solid var(--border-2);margin-top:4px;font-size:11.5px;color:var(--muted);align-items:center;flex-wrap:wrap}

.selbar .row{display:flex;gap:2px}
.selbar button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:6px;font-weight:500;color:var(--text)}

.selbar button svg{color:var(--muted)}
.selbar button[disabled]{color:var(--faint)}
.selbar .snote{padding:5px 8px 4px;font-size:12px;color:var(--muted);max-width:280px}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--tip-bg);color:var(--tip-text);font-size:12px;padding:5px 8px;border-radius:6px;display:none;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}

#tip kbd{background:var(--tip-kbd);border-color:transparent;color:var(--tip-text)}
.mtip{position:fixed;z-index:80;max-width:280px;background:var(--elev);border-radius:9px;box-shadow:var(--shadow-pop);padding:8px 10px;font-size:12.5px;pointer-events:none}
.mtip b{display:block;color:var(--text);font-weight:500;margin-bottom:2px}
.mtip span{color:var(--muted);font-size:12px}

/* ---------- toasts ---------- */
.toasts{position:absolute;left:0;right:0;bottom:14px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:20;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-width:220px;max-width:310px;padding:8px 8px 8px 12px;border-radius:9px;background:var(--elev);box-shadow:var(--shadow-pop);font-size:12.5px;color:var(--text)}

/* ---------- modals ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}

.plist{max-height:min(380px,55vh);overflow-y:auto;padding:6px}
.psec{padding:8px 10px 4px;font-size:11.5px;color:var(--muted);font-weight:500}
.pitem{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:7px;color:var(--text);width:100%;text-align:left}
.pitem svg{color:var(--muted)}
.pitem .pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .ph{color:var(--muted);font-size:12px;display:flex;gap:3px;align-items:center}
.pitem.is-active{background:var(--sel)}
.pempty{padding:22px;text-align:center;color:var(--muted)}
.scrim.is-dialog{align-items:center;padding:16px}
.dialog{width:min(720px,100%);max-height:min(640px,100%);display:flex;flex-direction:column;background:var(--elev);border-radius:12px;box-shadow:var(--shadow-modal);overflow:hidden}
.dialog.sm{width:min(420px,100%)}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 20px;border-bottom:1px solid var(--border-2)}
.dhead h2{margin:0;font-size:14px;font-weight:600;flex:1}
.dbody{padding:16px 20px 20px;overflow-y:auto}
.dfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border-2)}
.tabs{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--sel);margin-bottom:16px}

.tabs button[aria-selected="true"]{background:var(--elev);color:var(--text);box-shadow:0 0 0 1px var(--border-2)}
.srow{display:flex;align-items:center;gap:16px;padding:11px 0;border-top:1px solid var(--border)}

.sel{height:28px;border-radius:6px;border:1px solid var(--border-2);background:var(--card);padding:0 8px;font-size:12.5px;color:var(--text)}
.tog{width:30px;height:18px;border-radius:999px;background:var(--border-3);position:relative;flex:none}
.tog::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .12s}
.tog[aria-checked="true"]{background:var(--accent)}
.tog[aria-checked="true"]::after{left:14px}
.field{width:100%;border:1px solid var(--border-2);background:var(--input);border-radius:7px;padding:8px 10px;font-size:13px;color:var(--text);resize:vertical}
.agent-intro h3{margin:0 0 4px;font-size:15px;font-weight:600}

.agent-tabs-row{display:flex;align-items:center;gap:8px}
.agent-tabs-row .tabs{margin-bottom:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.ready{background:#3fb37f} .dot.warn{background:var(--run)}
.apanel{margin-top:14px;border:1px solid var(--border-2);border-radius:10px;overflow:hidden}
.apanel-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.apanel-h h4{margin:0;font-size:13.5px;font-weight:600;flex:1}
.apanel-h .glyph{width:22px;height:22px;font-size:11px;border-radius:6px}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--border-2);color:var(--muted)}
.badge.ready{color:#3fb37f;border-color:color-mix(in srgb,#3fb37f 40%,transparent)}
.badge.warn{color:var(--run);border-color:color-mix(in srgb,var(--run) 40%,transparent)}
.steps{list-style:none;margin:0;padding:6px 14px 10px}
.steps li{display:flex;gap:12px;padding:9px 0}
.steps .num{width:20px;height:20px;border-radius:50%;border:1px solid var(--border-3);display:grid;place-items:center;font-size:11px;color:var(--muted);flex:none;font-weight:500}
.steps .num.done{background:var(--done);border-color:transparent;color:#fff}
.steps .num.cur{border-color:var(--accent);color:var(--accent-text)}
.steps .sb{flex:1;min-width:0}
.steps .stt{font-weight:500;font-size:13px}
.steps .sh{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.cmd{display:flex;align-items:center;gap:8px;margin-top:6px;padding:6px 6px 6px 10px;border-radius:7px;background:var(--panel-2);border:1px solid var(--border);font:12px/1.4 var(--mono);color:var(--text-2)}
.cmd code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.afoot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--panel-2)}
.afoot .sp{flex:1}

/* browser overlay */
.browser{position:absolute;inset:0;z-index:15;background:var(--panel);display:flex;flex-direction:column}
.bbar{height:44px;display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid var(--border)}
.burl{flex:1;height:28px;border-radius:7px;background:var(--sel);display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--text-2);font-size:12.5px;min-width:0}
.burl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bpage{flex:1;overflow:auto;padding:36px 48px;max-width:760px}
.bpage h1{font-size:20px;font-weight:600;margin:0 0 6px}
.bpage p{color:var(--muted);line-height:1.6}

/* standalone variant switcher */
.vsw{position:fixed;right:14px;bottom:14px;z-index:95;display:flex;gap:2px;padding:3px;border-radius:9px;background:var(--elev);box-shadow:var(--shadow-pop);font-size:12px}
.vsw button{height:26px;padding:0 9px;border-radius:6px;color:var(--muted);font-weight:500}
.vsw button[aria-pressed="true"]{background:var(--sel);color:var(--text)}

/* ---------- variants ---------- */
/* b: Home cards as bordered cards */
[data-variant="b"] .list{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
[data-variant="b"] .card{border:1px solid var(--border-2);border-radius:9px;background:var(--card);padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
[data-variant="b"] .card:hover{border-color:var(--border-3);background:var(--card)}
[data-variant="b"] .card.is-selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--card)}
[data-variant="b"] .card.is-selected::before{display:none}
[data-variant="b"] .child{margin:-2px 0 0;padding-left:38px;border-radius:7px}
[data-variant="b"] .child::before,[data-variant="b"] .child::after{left:19px}
[data-variant="b"] .tray{border-top:0}
[data-variant="b"] .tray-h{background:var(--panel);border-bottom:0}
/* c: compact density */
[data-variant="c"] body,[data-variant="c"]{font-size:12.5px}
[data-variant="c"] .nrow{height:26px}
[data-variant="c"] .card{padding:6px 12px 6px 16px}
[data-variant="c"] .card .q{-webkit-line-clamp:1}
[data-variant="c"] .card .q.is-body{-webkit-line-clamp:2}
[data-variant="c"] .child{padding-top:3px;padding-bottom:3px}
[data-variant="c"] .colhead,[data-variant="c"] .pair-head{height:40px}
[data-variant="c"] .msg{padding:6px 9px 5px}
[data-variant="c"] .msg .mmeta{margin-top:3px}
[data-variant="c"] .answer{font-size:13.5px;line-height:1.6;padding:16px 44px 28px 24px}
[data-variant="c"] .colm{width:240px}
[data-variant="c"] .cola{width:clamp(420px,calc(100vw - 228px - 316px - 240px - 34px),600px)}
[data-variant="c"] .feed{width:316px}
[data-variant="c"] .tray-h{height:30px}
/* e: status as text pills */
[data-variant="e"] .card .lead .st:not(.st-post):not(.st-link):not(.st-draft){display:none}
[data-variant="e"] .card .lead{width:0}
[data-variant="e"] .card{grid-template-columns:0 minmax(0,1fr) auto;column-gap:0}
[data-variant="e"] .card .main-c{padding-left:0}
[data-variant="e"] .card .lead .st-post,[data-variant="e"] .card .lead .st-link,[data-variant="e"] .card .lead .st-draft{display:none}
[data-variant="e"] .pill{display:inline-flex}
[data-variant="e"] .child .cstat .st{display:none}
[data-variant="e"] .mstat .st{display:none}
[data-variant="e"] .mstat{height:18px;padding:0 7px;border-radius:999px;border:1px solid var(--border-2);font-size:11px}
[data-variant="e"] .mstat.s-running{color:var(--run);border-color:color-mix(in srgb,var(--run) 40%,transparent)}
[data-variant="e"] .mstat.s-failed{border-color:color-mix(in srgb,var(--fail) 40%,transparent)}
[data-variant="e"] .runline > .st{display:none}

/* ---------- narrow window: rail forced, columns fit the width ---------- */
@media (max-width: 760px){
  .app .sidebar{display:none}
  .app .rail{display:flex}
  .app .lights{left:6px;gap:5px} .app .lights i{width:11px;height:11px}
  .rail .expand{opacity:.4}
  .feed .colhead.is-home h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .main{margin:6px 6px 6px 0}
  .feed,[data-variant="c"] .feed{width:calc(100vw - 60px)}
  .colm,[data-variant="c"] .colm{width:calc(100vw - 60px)}
  .cola,[data-variant="c"] .cola{width:calc(100vw - 60px)}
  .colp,.colt{width:calc(100vw - 60px)}
  .pair-body{overflow-x:auto}
  .answer{padding:18px 40px 28px 18px}
  .strip{scroll-snap-type:x proximity}
  .feed,.pair,.colm,.cola{scroll-snap-align:start}
  .filler{display:none}
  .vsw{left:58px;right:auto;bottom:8px}
  .vsw .vl{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<h3>SEI growth</h3>
<p>The solid–electrolyte interphase (SEI) on graphite thickens over time and traps lithium as it grows. Its growth rate depends on anode potential and temperature: <span class="brx" data-branch="b1"><mark class="hl">SEI growth accelerates above ~80% SOC</mark></span>, where the anode potential falls below about 0.1 V vs Li/Li⁺. This is the main mechanism of calendar aging, and the lost capacity scales roughly with the square root of time.</p>
<h3>Lithium plating</h3>
<p>Near full charge the anode has less room to accept lithium, so charging at a high C-rate or a low temperature can deposit metallic lithium on its surface instead of intercalating it. Part of the plated lithium reacts with the electrolyte and is lost. In stationary storage at 25 °C and 0.5C or less, plating is a secondary contributor, but it rises quickly below 10 °C.</p>
<h3>Calendar vs cycle aging</h3>
<p>Calendar aging accumulates while the cell rests and is set by SOC and temperature. Cycle aging adds mechanical stress — particle cracking and loss of electrical contact — in proportion to throughput and depth of discharge. Grid batteries that idle at a high SOC between dispatch events accumulate calendar fade even with few cycles.</p>

const askBtn = `<button class="ghostbtn" data-act="go-ask" aria-label="Go to the ask box">${ic("plus", 13)}Ask</button>`;
function renderFeed() {
  const v = S.view; const trees = visibleTrees();

/* ======================= thread ======================= */
function answerHtml(n, level) {
  if (!n) return "";
  if (n.status === "queued") {
    return `<div class="runline" role="status">${stIco("queued")}<span class="what">Queued · #${n.queuePos || 1}. Starts when the running answer finishes.</span><button class="stop" data-act="stop" data-id="${n.id}">${ic("stop", 11)}Stop</button></div>`;
  }
  if (n.status === "running" || n.status === "starting") {
    const last = n.tools && n.tools.length ? n.tools[n.tools.length - 1] : null;
    const what = last ? `Working · ${toolTarget(last)}` : "Working";
    const open = S.openAct.has(n.id);
    return `<div class="runline" role="status">${stIco("running")}<span class="what" id="what-${n.id}">${esc(what)}</span><span class="el" id="el-${n.id}">${fmtEl(n.elapsed || 0)}</span><button class="stop" data-act="stop" data-id="${n.id}" data-tip="Stop this run">${ic("stop", 11)}Stop</button></div>
      ${n.tools && n.tools.length ? `<div class="activity${open ? " is-open" : ""}" id="act-${n.id}"><button class="act-toggle" data-act="toggle-act" data-id="${n.id}" aria-expanded="${open}">${ic("right", 12, 'class="chev"')}<span id="tc-${n.id}">${toolSummary(n)}</span></button><ol class="timeline" id="tl-${n.id}">${n.tools.map(toolLi).join("")}</ol></div>` : ""}
      <div class="stream" id="stream-${n.id}"><p>${esc(n.stream || "")}<span class="caret"></span></p></div>`;
  }
  if (n.status === "cancelled") {
    return `<div class="note">${stIco("cancelled")}<span>Stopped after ${fmtEl(n.elapsed || 0)}. The answer is incomplete.</span><span class="sp"></span><button class="sbtn" data-act="run-again" data-id="${n.id}">${ic("rotate", 13)}Run again</button></div>${n.stream ? `<p>${esc(n.stream)}</p>` : ""}`;
  }
  const recap = n.recap ? `<div class="recap">${ic("sparkles", 14)}<div><b>Recap:</b> ${esc(n.recap)}</div></div>` : (n.recapPending ? `<div class="recap" aria-label="Generating recap">${ic("sparkles", 14)}<div>Generating recap…</div></div>` : "");
  const wholes = branchesOf(n.id).filter(b => !b.anchor);
  return `${recap}<div class="answer-body" data-node="${n.id}">${n.html}</div>
    <div class="foot"><time>${n.when}</time>${n.edited ? " · Edited" : ""}${wholes.length ? markerBtn(level, wholes.map(b => b.id), true) : ""}</div>`;
}
function toolSummary(n) {
  const counts = {}; n.tools.forEach(t => counts[t[0]] = (counts[t[0]] || 0) + 1);
  return `${n.tools.length} tool call${n.tools.length === 1 ? "" : "s"} · ` + Object.entries(counts).map(([k, v]) => `${k} ×${v}`).join(", ");
}
function toolLi(t, i) { return `<li><span class="tico">${ic(t[0] === "read_file" ? "file" : "globe", 11)}</span><span class="tt"><b>${t[0]}</b> ${esc(t[1])}</span><time>0:${String(4 + i * 6).padStart(2, "0")}</time></li>`; }
function toolTarget(t) { return t[0] === "read_file" ? "reading " + t[1].split("/").pop() : "fetching " + t[1].split("/")[0]; }
function fmtEl(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function markerBtn(level, ids, whole) {
  const open = S.thread.levels[level + 1] && ids.includes(S.thread.levels[level + 1].head);
  const running = ids.some(id => NODES[id].status === "running");
  const what = ids.length === 1 ? (whole ? "1 branch from the whole answer" : "1 branch from this paragraph") : `${ids.length} branches from ${whole ? "the whole answer" : "this paragraph"}`;
  return `<button class="marker${open ? " is-open" : ""}${running ? " is-running" : ""}" data-act="marker" data-level="${level}" data-ids="${ids.join(",")}" aria-label="${what}${running ? ", running" : ""}" ${open ? 'aria-current="true"' : ""}>${ic("branch", 13)}${ids.length > 1 ? `<span class="tnum">${ids.length}</span>` : ""}</button>`;
}
function msgRow(n, level, head) {
  const sel = S.thread.levels[level].sel === n.id;
  const brs = branchesOf(n.id);
  const starrable = level === 0 ? (n.id !== head && n.inline) : n.id === head;

  const showStat = st === "running" || st === "queued" || st === "failed" || st === "cancelled";
  const brOpen = sel && (S.thread.levels.length > level + 1 || (S.thread.pending && S.thread.pending.parent === n.id));
  return `<li class="msg${sel ? " is-selected" : ""}" data-act="select-msg" data-level="${level}" data-id="${n.id}" tabindex="${sel ? 0 : -1}" role="button" aria-current="${sel}">

}

function pairHtml(level) {
  const th = S.thread; const t = treeById(th.tree); const L = th.levels[level];
  const head = NODES[L.head]; const chain = chainFrom(L.head); const display = chain.slice().reverse();
  const busy = chain.some(id => NODES[id].status === "running" || NODES[id].status === "queued");
  const title = level === 0 ? t.title : head.q;
  const isCur = S.cur === level;
  const src = level > 0 ? `<div class="src">${ic("corner", 13)}<span>${head.anchor ? `<i>“${esc(head.anchor)}”</i>` : "The whole answer"}</span></div>` : "";
  return `<section class="col pair${isCur ? " is-current" : ""}" data-level="${level}" aria-label="${level === 0 ? "Messages" : "Branch messages"}: ${esc(title)}">
    <header class="pair-head" data-drag>
      ${level === 0 ? `<div class="hist" role="group" aria-label="Research history"><button class="ibtn" data-act="hist-back" aria-label="Back" data-tip="Back">${ic("arrowl", 14)}</button><button class="ibtn" aria-label="Forward" aria-disabled="true" data-tip="Forward">${ic("arrowr", 14)}</button></div>` : `<span class="bico">${ic("branch", 13)}</span>`}
      <h2 tabindex="-1" title="${esc(title)}">${level === 0 ? esc(title) : "Branch"}</h2>${level > 0 ? `<span class="cnt">· ${chain.length} ${chain.length === 1 ? "message" : "messages"}</span>` : ""}
      ${t.place === "archive" ? `<span class="badge">Archived</span>` : ""}
      <span class="sp"></span>
      <button class="ghostbtn" data-act="go-cc" data-level="${level}" aria-label="Go to the ask box" data-tip="Go to the ask box" data-kbd="⌘J">${ic("plus", 13)}Ask</button>
    </header>
    <div class="pair-body">
      <div class="colm"><div class="scroll">${src}
        ${t.place === "archive" ? `<p class="cc-note" style="margin:12px 14px">Archived questions are read-only. Move the question out of Archive to continue.</p>` : ccHtml(L.head, busy ? "Ask a follow-up (queued)" : "Ask a follow-up", { aria: level === 0 ? "Follow-up in this conversation" : "Follow-up in this branch" })}
        <ul class="msgs">${display.map(id => msgRow(NODES[id], level, L.head)).join("")}</ul>
      </div></div>
      <div class="cola"><div class="scroll" data-ans-scroll="${level}"><article class="answer" id="ans-${level}" aria-label="Answer">${answerHtml(NODES[L.sel], level)}</article></div></div>
    </div>
  </section>`;
}
function pendingHtml() {

    <header class="pair-head" data-drag><span class="bico">${ic("branch", 13)}</span><h2>New branch</h2><span class="sp"></span></header>

function postPairHtml(t) {
  const pt = S.postThreads[t.id] || [];

  let content;
  if (t.type === "post") content = `<div class="pmeta"><span class="avatar">S</span><b>You</b><span>· ${t.when}</span>${t.body === "outline" ? "<span>· Edited</span>" : ""}</div>${POST_BODY[t.body]}`;
  else if (t.type === "link") content = `<div class="pmeta"><span class="avatar">S</span><b>You</b><span>· saved ${t.when}</span></div><div class="linkcard" style="margin:0"><span class="fav">${ic("globe", 13)}</span><span><b>${esc(t.linkTitle)}</b><span>${esc(t.url)}</span></span></div>`;
  else content = `<div class="pmeta"><span class="avatar">S</span><b>You</b><span>· saved ${t.when}</span></div><div class="tweet" style="margin:0"><div class="who"><b>${esc(t.name)}</b>${esc(t.handle)}</div><p style="font-size:14px">${esc(t.text)}</p></div>`;
  return `<section class="col pair is-current" data-level="0" aria-label="Post">
    <div class="pair-body">

        <div class="scroll">

const RUNS = {};

  tipEl.innerHTML = `<span>${esc(text)}</span>${k ? k.split(" ").map(x => `<kbd>${esc(x)}</kbd>`).join("") : ""}`;
  tipEl.classList.add("on");
  const r = el.getBoundingClientRect(); const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left, top;
  if (el.dataset.side === "right") { left = r.right + 8; top = r.top + r.height / 2 - h / 2; }
  else { left = r.left + r.width / 2 - w / 2; top = r.bottom + 6; if (top + h > innerHeight - 6) top = r.top - h - 6; }
  tipEl.style.left = Math.max(6, Math.min(left, innerWidth - w - 6)) + "px"; tipEl.style.top = top + "px";
}
function hideTip() { clearTimeout(tipT); tipEl.classList.remove("on"); }
document.addEventListener("mouseover", e => { const el = e.target.closest("[data-tip]"); hideTip(); if (el && !el.closest(".menu")) tipT = setTimeout(() => showTip(el), 450); });
document.addEventListener("focusin", e => { const el = e.target.closest && e.target.closest("[data-tip]"); hideTip(); if (el && el.matches(":focus-visible")) showTip(el); });
document.addEventListener("mousedown", hideTip);

/* marker tooltip */
document.addEventListener("mouseover", e => {
  const m = e.target.closest(".marker"); document.querySelectorAll(".mtip").forEach(x => x.remove());
  if (!m || m.classList.contains("is-open")) return;
  const ids = m.dataset.ids.split(",");
  const tip = document.createElement("div"); tip.className = "mtip";
  tip.innerHTML = ids.map(id => `<b>${esc(NODES[id].q)}</b><span>${NODES[id].anchor ? "“" + esc(NODES[id].anchor) + "”" : "The whole answer"}${NODES[id].status === "running" ? " · Running" : ""}</span>`).join('<div style="height:6px"></div>') + `<div style="height:6px"></div><span>Click opens the first branch.</span>`;
  document.getElementById("layer").appendChild(tip);
  const r = m.getBoundingClientRect(); let left = r.left - tip.offsetWidth - 8; if (left < 8) left = r.right + 8;
  tip.style.left = left + "px"; tip.style.top = Math.min(r.top - 6, innerHeight - tip.offsetHeight - 8) + "px";
});

/* ======================= event wiring ======================= */
function toggleRail() { if (window.innerWidth <= 760) return; S.rail = !S.rail; closeLayer(); render(); }
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]"); if (!a) return;
  if (a.closest("#layer .menu")) return;
  const act = a.dataset.act, id = a.dataset.id;
  if (a.tagName === "A" || a.closest("a")) e.preventDefault();
  switch (act) {
    case "nav": nav(JSON.parse(a.dataset.view)); break;
    case "toggle-rail": if (a.getAttribute("aria-disabled") !== "true") toggleRail(); break;
    case "settings": settingsDialog(); break;
    case "agents": agentsDialog(); break;
    case "theme": document.documentElement.dataset.theme = isDark() ? "light" : "dark"; render(); break;
    case "new-folder": folderDialog(null); break;
    case "folder-menu": openMenu(a, [{ icon: "pencil", label: "Rename…", run: () => folderDialog(id) }, { icon: "trash", label: "Delete…", danger: true, run: () => { nav({ kind: "folder", id }); S.pendingDelete = id; render(); } }], { label: "Actions for " + placeName(id), width: 180 }); break;
    case "ws-menu": wsMenu(a); break;
    case "acct-menu": openMenu(a, [{ meta: "Signed in to GitHub as session-user" }, { sep: true }, { icon: "ext", label: "Open GitHub profile", run: () => {} }, { icon: "x", label: "Sign out of GitHub", run: () => toast("Signed out of GitHub") }], { above: true, width: 228, label: "GitHub account" }); break;
    case "open-tree": if (!e.target.closest("a")) openTree(id); break;
    case "open-child": { e.stopPropagation(); const n = NODES[id]; if (n.inline) openTree(a.dataset.tree, { sel: id }); else openTree(a.dataset.tree, { branch: id }); break; }
    case "open-draft": S.thread = { draft: id }; render(); scrollToLevel(0); setTimeout(() => document.querySelector(`[data-composer='draft:${id}']`)?.focus(), 30); break;
    case "card-menu": { e.stopPropagation(); const t = treeById(id); openMenu(a, moveItems(t), { label: "Bookmark, follow or move", width: 232, align: "end" }); break; }
    case "child-menu": { e.stopPropagation(); const t = treeById(a.dataset.tree); openMenu(a, [{ icon: "star", label: "Remove star", run: () => { NODES[id].starred = false; render(); toast("Star removed"); } }, { sep: true }, ...moveItems(t)], { label: "Starred item actions", width: 232, align: "end" }); break; }
    case "draft-menu": e.stopPropagation(); openMenu(a, [{ icon: "pencil", label: "Open", run: () => { S.thread = { draft: id }; render(); } }, { icon: "trash", label: "Delete", kbd: "D", danger: true, run: () => { DRAFTS = DRAFTS.filter(d => d.id !== id); if (S.thread && S.thread.draft === id) S.thread = null; render(); toast("Draft deleted"); } }], { label: "Draft actions", width: 180, align: "end" }); break;
    case "toggle-bm": { e.stopPropagation(); const t = treeById(id); t.bookmarked = !t.bookmarked; render(); toast(t.bookmarked ? "Bookmarked" : "Bookmark removed"); break; }
    case "toggle-follow": { e.stopPropagation(); const t = treeById(id); t.followed = !t.followed; render(); toast(t.followed ? "Following" : "Unfollowed"); break; }
    case "tray": if (e.target.closest(".tname")) break; S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id); render(); break;
    case "refresh": { const svg = a.querySelector("svg"); svg && svg.animate && svg.animate([{ transform: "rotate(0)" }, { transform: "rotate(360deg)" }], { duration: 500 }); break; }
    case "import": importDialog(); break;
    case "go-ask": { const box = document.getElementById("nc-wrap"); box && box.scrollIntoView({ block: "nearest" }); focusHome(); break; }
    case "rename-folder": folderDialog(id); break;
    case "delete-folder": S.pendingDelete = id; render(); break;
    case "cancel-delete": S.pendingDelete = null; render(); break;
    case "confirm-delete": { const f = FOLDERS.find(x => x.id === id); TREES.forEach(t => { if (t.place === id) t.place = "unfiled"; }); FOLDERS.splice(FOLDERS.indexOf(f), 1); S.pendingDelete = null; nav({ kind: "home" }); toast(`Deleted “${f.name}”`); break; }
    case "ask-seg": if (S.comp.mode === "ai") modelMenu(a); else { S.comp.mode = "ai"; render(); document.getElementById("ask-seg")?.focus(); } break;
    case "post-seg": S.comp.mode = "network"; render(); document.querySelector("[data-act='post-seg']")?.focus(); break;
    case "pt-ask": S.postMode = "ai"; render(); break;
    case "pt-post": S.postMode = "network"; render(); break;
    case "save-draft": { const txt = (S.drafts.home || "").trim(); if (!txt) break; DRAFTS.unshift({ id: "d" + (seq++), prompt: txt, when: "now" }); S.drafts.home = ""; render(); toast("Saved to Drafts"); break; }
    case "open-hl": { const h = HIGHLIGHTS.find(x => x.id === id); const n = NODES[h.node]; if (n.parent && !n.inline) openTree(h.tree, { branch: h.node }); else openTree(h.tree, { sel: h.node }); break; }
    case "rm-hl": HIGHLIGHTS = HIGHLIGHTS.filter(x => x.id !== id); render(); toast("Highlight removed"); break;
    case "select-msg": { if (e.target.closest("button")) break; const level = +a.dataset.level; S.thread.levels = S.thread.levels.slice(0, level + 1); S.thread.levels[level].sel = id; S.thread.pending = null; S.cur = level; render({ resetAnswers: true }); document.querySelector(`.msg[data-id="${id}"]`)?.focus({ preventScroll: true }); break; }
    case "star": { const n = NODES[id]; n.starred = !n.starred; render(); break; }
    case "show-branches": { const level = +a.dataset.level; const brs = branchesOf(id); S.thread.levels[level].sel = id; if (S.thread.levels[level + 1] && brs.some(b => b.id === S.thread.levels[level + 1].head)) closeAfter(level); else openBranch(level, brs[0].id); break; }
    case "answer-menu": answerMenu(a, +a.dataset.level, id); break;
    case "post-menu": { const t = treeById(id); openMenu(a, [{ icon: "pencil", label: "Edit post", run: () => toast("Editing post") }, { sep: true }, ...moveItems(t)], { label: "Post actions", width: 232, align: "end" }); break; }
    case "go-cc": { const level = +a.dataset.level; const ta = document.querySelectorAll(".pair")[level]?.querySelector("textarea"); ta && ta.focus(); break; }
    case "hist-back": S.thread = null; render(); break;
    case "marker": { const level = +a.dataset.level; const ids = a.dataset.ids.split(","); document.querySelectorAll(".mtip").forEach(x => x.remove()); if (S.thread.levels[level + 1] && ids.includes(S.thread.levels[level + 1].head)) closeAfter(level); else openBranch(level, ids[0]); break; }
    case "stop": stopRun(id); break;
    case "run-again": { const n = NODES[id]; n.stream = ""; n.elapsed = 0; n.tools = []; startRun(id, n.id === "b2" ? B2_START + B2_REST : (n.parent ? CANNED_FOLLOW : CANNED_NEW), { tools: [["web_fetch", "atb.nrel.gov/electricity/2026"]] }); render(); break; }
    case "toggle-act": S.openAct.has(id) ? S.openAct.delete(id) : S.openAct.add(id); document.getElementById("act-" + id)?.classList.toggle("is-open"); a.setAttribute("aria-expanded", S.openAct.has(id)); break;
    case "cancel-pending": S.thread.pending = null; S.cur = S.thread.levels.length - 1; render(); break;
    case "undo": { const t = TOASTQ.find(x => String(x.id) === a.dataset.tid); if (t && t.undo) t.undo(); TOASTQ = TOASTQ.filter(x => x !== t); flushToasts(); break; }
    case "dismiss-toast": TOASTQ = TOASTQ.filter(x => String(x.id) !== a.dataset.tid); flushToasts(); break;
    case "close-browser": closeBrowser(); break;
  }
});
document.addEventListener("click", e => { const s = e.target.closest("a[data-src]"); if (s) { e.preventDefault(); const [t, d] = s.dataset.src.split("|"); openBrowser(t, d); } });
document.addEventListener("click", e => { const b = e.target.closest(".brx"); if (b && !getSelection().toString()) { const art = b.closest(".answer"); const level = +art.id.split("-")[1]; const id = b.dataset.branch; if (NODES[id]) { if (S.thread.levels[level + 1] && S.thread.levels[level + 1].head === id) closeAfter(level); else openBranch(level, id); } } });
document.addEventListener("contextmenu", e => {
  const c = e.target.closest(".card[data-card]"); if (!c) return;
  e.preventDefault(); const t = treeById(c.dataset.card); openMenu(c, treeContextItems(t), { point: { x: e.clientX, y: e.clientY }, label: "Research actions", width: 220 });
});
document.addEventListener("mousedown", e => {
  if (MENU && !e.target.closest("#layer .menu") && e.target !== MENU.anchor && !(MENU.anchor && MENU.anchor.contains && MENU.anchor.contains(e.target))) { closeLayer(); document.getElementById("nc")?.classList.remove("menu-open"); }
  if (!e.target.closest(".selbar")) hideSelBar();
});
document.addEventListener("mouseup", e => { if (e.target.closest(".answer")) setTimeout(showSelBar, 0); });
document.addEventListener("keyup", e => { if (e.shiftKey && e.target.closest && e.target.closest(".answer")) showSelBar(); if (e.key === "Meta" || e.key === "Control") document.body.classList.remove("show-hints"); });
window.addEventListener("blur", () => document.body.classList.remove("show-hints"));
document.addEventListener("input", e => {
  const t = e.target; if (!t.dataset || !t.dataset.composer) return;
  S.drafts[t.dataset.composer] = t.value; autoGrow(t);
  if (t.dataset.composer === "home") {
    const has = !!t.value.trim();
    document.getElementById("nc").classList.toggle("has-text", has); document.getElementById("nc-wrap").classList.toggle("has-text", has);
    const s = document.querySelector("#nc .send"); if (s) s.disabled = !has;
  }
});
document.addEventListener("submit", e => { const f = e.target.closest("[data-act-submit]"); if (!f) return; e.preventDefault(); submitComposer(f.dataset.actSubmit); });
document.addEventListener("scroll", () => { hideSelBar(); document.querySelectorAll(".mtip").forEach(x => x.remove()); }, true);
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey; const k = e.key.toLowerCase();
  if ((e.key === "Meta" || (e.key === "Control" && !navigator.platform.includes("Mac"))) && S.hintsSetting) document.body.classList.add("show-hints");
  // selection bar keys
  if (SEL && document.querySelector(".selbar") && !mod && !e.altKey && !(e.target.matches && e.target.matches("textarea,input"))) {
    if (k === "a") { e.preventDefault(); selAction("branch"); return; }
    if (k === "h" || k === "e") { e.preventDefault(); selAction("hl"); return; }
  }
  if (e.key === "Escape") {
    if (document.querySelector(".selbar")) { hideSelBar(); getSelection().removeAllRanges(); return; }
    if (document.getElementById("modal").innerHTML) { closeModal(); return; }
    if (MENU) { const a = MENU.anchor; closeLayer(); a && a.focus && a.focus(); return; }
    if (S.browser) { closeBrowser(); return; }
    if (S.thread && S.thread.pending) { S.thread.pending = null; S.cur = S.thread.levels.length - 1; render(); return; }
    if (e.target.dataset && e.target.dataset.composer) { e.target.blur(); return; }
  }
  // composer keys
  const ta = e.target.dataset && e.target.dataset.composer ? e.target : null;
  if (ta && e.key === "Enter" && !e.isComposing) {
    if (e.shiftKey && !mod) return;
    if (S.cmdEnter && !mod) return;
    e.preventDefault();
    if (e.shiftKey && mod && ta.dataset.composer !== "home" && !ta.dataset.composer.includes(":") && ta.dataset.composer !== "pending") { const lvl = S.thread.levels.findIndex(l => l.head === ta.dataset.composer); const tail = chainFrom(ta.dataset.composer).slice(-1)[0]; S.selRange = null; openPending(lvl, tail, null); S.drafts.pending = ta.value; render(); return; }
    submitComposer(ta.dataset.composer); return;
  }
  if (ta && ta.dataset.composer === "home" && e.key === "Tab" && e.ctrlKey && S.comp.mode === "ai") {
    e.preventDefault();
    if (e.shiftKey) { const ks = Object.keys(AG); const nk = ks[(ks.indexOf(S.comp.agent) + 1) % ks.length]; S.comp.agent = nk; S.comp.model = AG[nk].models[0]; }
    else { const ms = AG[S.comp.agent].models; S.comp.model = ms[(ms.indexOf(S.comp.model) + 1) % ms.length]; }
    render(); return;
  }
  if (mod && !e.altKey) {
    if (k === "k" && !e.shiftKey) { e.preventDefault(); palette(); return; }
    if (k === "g" && e.shiftKey) { e.preventDefault(); toggleRail(); return; }
    if (k === "," && !e.shiftKey) { e.preventDefault(); settingsDialog(); return; }
    if (k === "o" && !e.shiftKey) { e.preventDefault(); const b = document.querySelector(S.rail || innerWidth <= 760 ? ".rail [data-act='ws-menu']" : ".sidebar [data-act='ws-menu']"); b && wsMenu(b); return; }
    if ((k === "n" || k === "t") && !e.shiftKey) { e.preventDefault(); nav({ kind: "home" }); focusHome(); return; }
    if (k === "j" && !e.shiftKey) { e.preventDefault(); const pr = document.querySelector(".pair.is-current") || document.querySelector(".pair"); pr?.querySelector("textarea")?.focus(); return; }
    if (k === "e" && e.shiftKey) { e.preventDefault(); S.browser ? closeBrowser() : openBrowser("NREL ATB 2026 — Utility-scale storage", "atb.nrel.gov"); return; }
  }
  if (e.ctrlKey && e.key === "Tab" && S.thread && S.thread.levels && !ta) {
    e.preventDefault(); const n = S.thread.levels.length + (S.thread.pending ? 1 : 0);
    S.cur = (S.cur + (e.shiftKey ? n - 1 : 1)) % n; render(); scrollToLevel(S.cur);
    document.querySelector(".pair.is-current .msg.is-selected, .pair.is-current textarea")?.focus(); return;
  }
  // feed keyboard: arrows between cards, Enter opens, Option-arrow reorders
  const card = e.target.closest && e.target.closest(".card, .child, .msg");
  if (card && !ta) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.click(); return; }
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !e.altKey) {
      e.preventDefault(); const sel = card.classList.contains("msg") ? ".msg" : ".card, .child";
      const all = [...card.closest(".scroll").querySelectorAll(sel)]; const i = all.indexOf(card);
      const nx = all[i + (e.key === "ArrowDown" ? 1 : -1)]; if (nx) { nx.setAttribute("tabindex", "0"); nx.focus(); }
      return;
    }
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && e.altKey && card.dataset.card) {
      e.preventDefault(); const arr = visibleTrees(); const t = treeById(card.dataset.card);
      const same = arr.filter(x => x.place === t.place); const i = same.indexOf(t); const j = i + (e.key === "ArrowDown" ? 1 : -1);
      if (j < 0 || j >= same.length) return; const a = arr.indexOf(t), b = arr.indexOf(same[j]); arr[a] = same[j]; arr[b] = t;
      render(); document.querySelector(`.card[data-card="${t.id}"]`)?.focus(); return;
    }
    if (card.dataset.card && !mod && (k === "a" || k === "d") && e.shiftKey === false && e.target === card) {
      const t = treeById(card.dataset.card); if (k === "a" && t.place !== "archive") { const prev = t.place; t.place = "archive"; render(); toast("Archived", () => { t.place = prev; render(); }); } else if (k === "d") deleteDialog(t); return;
    }
  }
  if ((e.key === "ContextMenu" || (e.shiftKey && e.key === "F10")) && card && card.dataset.card) {
    e.preventDefault(); const r = card.getBoundingClientRect(); openMenu(card, treeContextItems(treeById(card.dataset.card)), { point: { x: r.left + 24, y: r.bottom - 6 }, label: "Research actions", width: 220 });
  }
});
window.addEventListener("resize", () => { renderRail(); placeMarkers(); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());

/* ======================= boot ======================= */
document.documentElement.dataset.variant = "a";
render();
startRun("b2", B2_REST, { slow: true });
if (parent !== window) {
  parent.postMessage({ type: "mock:ready", mock: MOCK }, "*");
} else {
  const sw = document.createElement("div"); sw.className = "vsw"; sw.setAttribute("role", "group"); sw.setAttribute("aria-label", "Variant");
  sw.innerHTML = MOCK.variants.map(v => `<button data-v="${v.id}" aria-pressed="${v.id === "a"}" title="${esc(v.summary)}">${v.id.toUpperCase()}<span class="vl"> · ${esc(v.label)}</span></button>`).join("");
  sw.addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) setVariant(b.dataset.v); });
  document.body.appendChild(sw);
}
</script>
