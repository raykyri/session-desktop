<!--
Session Canvas mock, variant 0a-2: branch left or right
=======================================================
Derived from docs/mockups/session-canvas-0a.html ("0a. Session Canvas: Main column"), which is derived from
docs/mockups/session-canvas.html ("0. Session Canvas"; concept docs/canvas/session-canvas-concept.md). Notes for this
variant: docs/canvas/session-canvas-0a-2.md. Seed content, posts, drafts, seams, Continue, Stop, the bell and the
overview zoom are the same as in the base. No model API is called; answers are canned and runs are simulated with
timers. The only external request is the Inter font.

Differences from the base (as in 0a)
- Root stacks have no stored x,y. They are drawn in one main column at reading width (MAINW, 680px; on a page
  narrower than 720px, the page width minus 16px on each side), top to bottom by last activity, with ROWGAP between
  rows. The order is computed once at load; a new root goes to the top. Dragging a stack by its header and
  double-clicking the canvas to create a stack are removed; Add post and Add ask create a root at the top.
- Branches are drawn in side columns at the base stack width (SIDEW, 320px). Column n on a side holds branches at
  depth n. A card's left edge is always one of the column x positions (colX).
- Each root and its visible branches form a row. Inside a row, a branch starts level with its anchor when its column
  is free there, otherwise VGAP below the previous card in that column. Branches are placed depth-first, siblings in
  anchor order. The next row starts ROWGAP below the lowest card of the row above, in any column.
- Fit fits the width of the columns in use, at most 100%. The page opens at 100% with the main column centred; below
  720px the main column fills the width; side columns on both sides are reached by panning horizontally.

Differences from 0a
- Side columns exist on both sides of the main column. Right column n starts at MAINW + GAP + (n - 1)(SIDEW + GAP);
  left column n starts at -n(SIDEW + GAP), so left columns grow leftward from the main column.
- A branch of a root stores which side it is drawn on: Thread.side, 'l' or 'r'. A branch of a branch stores no side
  and continues outward on its parent's side (sideOf). Seed branches of roots are 'r', except the ids in SEED_LEFT,
  which are 'l' so that both sides are populated on load.
- The part menu on a post in the main column has a side toggle above its items: "Open on  [Left] [Right]". Both
  items ("Ask about this paragraph", "Branch from this answer") use the chosen side, and their second line names it.
  The toggle starts at the side chosen last on this page (V.side, view state; Right at first). ArrowLeft and
  ArrowRight switch it while the menu is open. On a post in a side column there is no toggle: the branch opens in the
  next column outward on that side, and the items say which side.
- Connectors on the left side run from the anchor on the parent's left edge to the branch's right edge, with the
  elbow in the column gap, mirrored from the right side.

Terms. In the UI: "post" (one block of text by one author, or one model answer), "stack" (how a thread is drawn:
a vertical column of posts), "branch" (a thread that starts from a post or one of its paragraphs). In the stored
model: Post and Thread; a branch is a Thread with a `fork` anchor. In this file's code, posts are "parts" (P,
partsOf) and threads are "stacks" (S), as in earlier versions.

Data model (in memory; a reload starts over)
- Post { id, st (thread), key (number; an insert takes the midpoint of its neighbours), by {k:'p', u} | {k:'m', model},
  text (HTML), at, run? }.
  run (model posts only) { model (a record; the model is a workspace setting), status queued|running|complete|stopped,
  step, src }. The author of the thread can stop a run while it is queued or running; text written so far stays.
  Context is set by position: everything above in the thread, plus the post it branches from and everything that
  post read.
- Thread { id, ch (channel), fork? { part, block?, quote? }, side? }. A branch's block (or quote) targets one
  paragraph of the post it branches from: the connector starts at that paragraph, which is marked. There is no stored
  position: a root is drawn in the main column, a branch in the column for its depth on its side. side ('l' | 'r') is
  stored on a branch of a root only; it is content, the same for every viewer.
  A thread's author is the person who wrote its first post. Only the author adds to or inserts into it; others branch.
- View state, per viewer, not content: collapsed units, expanded answers, selection, zoom, seen posts, the root
  order computed at load (ORDER), and the side last chosen in the part menu (V.side).
-->
<title>0a-2. Session Canvas: Branch left or right</title>

<style>
:root {
  --page: #efece7; --grid: rgba(60,40,20,.07); --card: #ffffff; --card-m: #fbfaf8; --part-u: #ffffff; --part-m: #fcfbfa; --inset: #f5f2ee;

  --link: #a9b4bd; --ctx: rgba(10,111,184,.55);

  --shadow-pop: 0 10px 28px rgba(20,24,26,.16);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark; --page: #151413; --grid: rgba(255,255,255,.05); --card: #211f1e; --card-m: #1d1c1b; --part-u: #232120; --part-m: #1b1a19; --inset: #181716;
  --control: #282827; --control-hover: #313130; --divider: #2d2d2c; --border-strong: #3a3937;
  --accent: #33adff; --accent-soft: rgba(51,173,255,.14); --on-accent: #0f1413;
  --t-heading: #f4f3ec; --t-body: #d9ddd9; --t-secondary: #c4cbc6; --t-faint: #8f9893; --t-dim: #5a615e;
  --warn: #d7a84f; --warn-soft: rgba(215,168,79,.14); --new: #e0796d;
  --av1: #5b7a96; --av2: #8a6f9e; --av3: #6d8f6a; --av4: #a77b55; --av5: #4f8a8b; --av6: #9a6262; --av-fg: #f4f3ec;
  --link: #4a5156; --ctx: rgba(51,173,255,.6);
  --shadow: 0 0 0 1px rgba(255,255,255,.07); --shadow-pop: 0 10px 28px rgba(0,0,0,.5);
} }
:root[data-theme="dark"] {
  color-scheme: dark; --page: #151413; --grid: rgba(255,255,255,.05); --card: #211f1e; --card-m: #1d1c1b; --part-u: #232120; --part-m: #1b1a19; --inset: #181716;
  --control: #282827; --control-hover: #313130; --divider: #2d2d2c; --border-strong: #3a3937;
  --accent: #33adff; --accent-soft: rgba(51,173,255,.14); --on-accent: #0f1413;
  --t-heading: #f4f3ec; --t-body: #d9ddd9; --t-secondary: #c4cbc6; --t-faint: #8f9893; --t-dim: #5a615e;
  --warn: #d7a84f; --warn-soft: rgba(215,168,79,.14); --new: #e0796d;
  --av1: #5b7a96; --av2: #8a6f9e; --av3: #6d8f6a; --av4: #a77b55; --av5: #4f8a8b; --av6: #9a6262; --av-fg: #f4f3ec;
  --link: #4a5156; --ctx: rgba(51,173,255,.6);
  --shadow: 0 0 0 1px rgba(255,255,255,.07); --shadow-pop: 0 10px 28px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--page); color: var(--t-body); font: 400 13.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }

/* ---- viewport and world ---- */
#vp { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: default;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
#vp.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#links path { fill: none; stroke: var(--link); stroke-width: 1.5; vector-effect: non-scaling-stroke; opacity: .55; }
#links circle { fill: var(--link); }
#links .hot { opacity: 1; }
#links circle.hot { fill: var(--accent); }
#links path.hot { stroke: var(--accent); stroke-width: 1.75; }

/* ---- top-left buttons and bottom-right view controls ---- */
.tl { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 20; align-items: center; }
.tl .modl { font-size: 11.5px; color: var(--t-faint); padding: 0 4px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.tl .modl::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .7; }
.tl button, .br button { height: 32px; padding: 0 12px; border-radius: 8px; background: var(--card); box-shadow: var(--shadow), 0 2px 6px rgba(0,0,0,.06);
  font-size: 12.5px; font-weight: 600; color: var(--t-heading); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tl button:hover, .br button:hover { background: var(--inset); }
.lc { width: 14px; height: 14px; flex: none; display: block; }
.tl button .pl { color: var(--accent); width: 15px; height: 15px; }
.br button .lc { width: 15px; height: 15px; }
.br { position: fixed; right: 12px; top: 12px; display: flex; gap: 6px; z-index: 20; align-items: center; }
.br .zv { min-width: 52px; justify-content: center; font-variant-numeric: tabular-nums; }
.br .nn { position: relative; }
.br .nn b { position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--new); color: #fff; font-size: 10.5px; font-weight: 700; line-height: 17px; text-align: center; box-shadow: 0 0 0 2px var(--page); }
.br .nn b:empty { display: none; }
#nmenu { position: fixed; z-index: 35; width: 340px; max-width: calc(100vw - 16px); max-height: min(70vh, 520px); overflow-y: auto; padding: 4px; border-radius: 10px; background: var(--card); box-shadow: var(--shadow), var(--shadow-pop); }
#nmenu .nhd { display: flex; align-items: center; padding: 8px 10px 6px; font-size: 12px; font-weight: 600; color: var(--t-heading); }
#nmenu .nhd button { margin-left: auto; font-weight: 500; color: var(--accent); font-size: 12px; }
#nmenu .nrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 9px; width: 100%; padding: 8px 10px; border-radius: 6px; text-align: left; align-items: start; }
#nmenu .nrow:hover, #nmenu .nrow:focus-visible { background: var(--control); outline: none; }
#nmenu .nrow .av { width: 20px; height: 20px; font-size: 8px; } #nmenu .nrow .mk { width: 21px; height: 21px; border-radius: 6px; } #nmenu .nrow .mk svg { width: 13px; height: 13px; }
#nmenu .nh { display: block; font-size: 12px; color: var(--t-faint); } #nmenu .nh b { color: var(--t-heading); font-weight: 600; }
#nmenu .ns { display: block; margin-top: 1px; font-size: 12.5px; color: var(--t-secondary); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#nmenu .nw { font-size: 11px; color: var(--t-faint); padding-top: 1px; }
#nmenu .nempty { padding: 14px 10px 16px; font-size: 12.5px; color: var(--t-faint); }
.hint { position: fixed; left: 352px; top: 12px; height: 32px; line-height: 32px; padding: 0 12px; border-radius: 8px; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(4px); z-index: 19; font-size: 11.5px; color: var(--t-faint); max-width: calc(100vw - 260px); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1100px) { .hint { display: none; } }
.hint { max-width: calc(100vw - 700px); }
@media (max-width: 760px) { .br { top: 56px; left: 12px; right: auto; } }
@media (max-width: 760px) and (pointer: coarse) { .br { top: 62px; } }
@media (max-width: 360px) { .tl .modl { display: none; } }
@media (max-width: 640px) { .br button { padding: 0 10px; } }
@media (pointer: coarse) { .tl button, .br button { height: 40px; } }

/* ---- stacks ---- */
.stack { position: absolute; width: var(--sw); display: flex; flex-direction: column; }
.stack.sel > .sbody { box-shadow: 0 0 0 1.5px var(--accent), var(--shadow-pop); }
.stack.fresh { z-index: 4; }
.sbody { background: var(--card); border-radius: 10px; box-shadow: var(--shadow), 0 3px 10px rgba(20,24,26,.05); }
.sbody > :first-child { border-top-left-radius: 10px; border-top-right-radius: 10px; }
.sbody > :last-child:not(.draft) { border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; }
.sbody > .fq:last-child { border-bottom: 0; }
.sh { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 6px 0 42px; font-size: 11.5px; color: var(--t-faint);
  border-bottom: 1px solid var(--divider); user-select: none; }
.sh .ch { font-weight: 600; color: var(--t-secondary); }
.sh .grow { flex: 1; }
.sh .newc { color: var(--new); font-weight: 600; }
.sh .ib { width: 24px; height: 24px; border-radius: 6px; display: inline-grid; place-items: center; color: var(--t-faint); }
.sh .ib .lc { width: 15px; height: 15px; }
.sh .ib:hover { background: var(--control); color: var(--t-heading); }
.fq { padding: 7px 12px; font-size: 12px; color: var(--t-secondary); border-bottom: 1px solid var(--divider); background: var(--inset); border-radius: 10px 10px 0 0; }
.fq i { display: flex; align-items: center; gap: 5px; font-style: normal; color: var(--t-faint); margin-bottom: 1px; }
.fq i .lc { width: 13px; height: 13px; }
.fq .old { color: var(--warn); }
.cmeta { display: flex; align-items: center; width: 100%; text-align: left; gap: 9px; padding: 6px 12px 7px 11px; font-size: 12px; color: var(--t-faint); border-top: 1px solid var(--divider); }

.part { position: relative; padding: 10px 12px 10px 11px; display: flex; gap: 9px; align-items: flex-start; }
.part > .gut { flex: none; width: 22px; display: flex; justify-content: center; position: relative; }
.part > .gut .av { width: 20px; height: 20px; font-size: 8px; margin-top: 1px; }
.part > .gut .mk { width: 21px; height: 21px; border-radius: 6px; }
.part > .gut .mk svg { width: 13px; height: 13px; }
.part > .gut .dot { position: absolute; right: -3px; top: -2px; z-index: 1; box-shadow: 0 0 0 1.5px var(--part-u); }
.part.m > .gut .dot { box-shadow: 0 0 0 1.5px var(--part-m); }
.part > .pb { flex: 1; min-width: 0; }
.part + .part, .seam + .part, .part + .seam { }
/* a person's part, and a model answer: each tinted against the page */
.part { background: var(--part-u); }
.part.m { background: var(--part-m); }
.part.ins { margin-left: 18px; box-shadow: inset 2px 0 0 var(--border-strong); }
.ph { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--t-faint); margin-top: 4px; flex-wrap: wrap; }
.ph b { color: var(--t-heading); font-weight: 600; font-size: 12px; }
.part > .acts { position: absolute; top: 5px; right: 6px; z-index: 2; display: flex; gap: 2px; padding: 1px; border-radius: 7px; background: var(--card); box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .12s; }
.part:hover > .acts, .part:focus-within > .acts { opacity: 1; pointer-events: auto; }
@media (pointer: coarse) { .stack.sel .part > .acts { opacity: 1; pointer-events: auto; } }
.ab { font-size: 11.5px; font-weight: 500; color: var(--t-secondary); padding: 2px 6px; border-radius: 5px; }
.ab:hover { background: var(--control); color: var(--t-heading); }
.av { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; color: var(--av-fg); font-size: 7.5px; font-weight: 700; }
.mk { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent); }
.mk svg { width: 11px; height: 11px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--new); flex: none; }

.prose { color: var(--t-body); font-size: 13.5px; line-height: 1.58; overflow-wrap: anywhere; }
.prose > :first-child { margin-top: 0; } .prose > :last-child { margin-bottom: 0; }
.prose p { margin: 0 0 .65em; } .prose ul, .prose ol { margin: 0 0 .65em; padding-left: 1.3em; } .prose li { margin: .15em 0; }
.prose h4 { margin: .9em 0 .3em; font-size: 13.5px; color: var(--t-heading); font-weight: 600; }
.prose table { border-collapse: collapse; font-size: 12.5px; margin: 0 0 .65em; display: block; overflow-x: auto; }
.prose th, .prose td { border-bottom: 1px solid var(--divider); padding: 3px 6px; text-align: left; }
.prose sup.cite { font-size: 9px; color: var(--accent); font-weight: 600; padding: 0 1px; }
.part:not(.m) .prose { color: var(--t-heading); font-size: 14px; line-height: calc(1.58em - 1px); }
/* the mark beside a paragraph a branch starts from: 2px wide, 3px left of the text */
.prose .anc { position: relative; }
.prose .anc::before { content: ''; position: absolute; left: -5px; top: 5px; bottom: 5px; width: 2px; border-radius: 1px; background: var(--link); }
.clamp { max-height: 236px; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
/* a clamped answer still shows the branch marks just left of its text */
.prose.clamp { margin-left: -8px; padding-left: 8px; }
.more { font-size: 12px; font-weight: 600; color: var(--accent); margin-top: 2px; }
.pending { color: var(--t-faint); font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
.pending .bar { flex: 1; height: 3px; border-radius: 2px; background: var(--divider); overflow: hidden; }
.pending .bar i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
.pending .stop { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--t-secondary); background: var(--control); }
.pending .stop:hover { color: var(--t-heading); } .pending .stop .lc { width: 10px; height: 10px; fill: currentColor; }
@media (pointer: coarse) { .pending .stop { height: 36px; padding: 0 12px; } }
.stalebox { margin-top: 6px; font-size: 12px; color: var(--warn); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stalebox button { font-weight: 600; color: var(--accent); }

/* seams: the gap between two parts. Desktop: a "+" in the left gutter of the hovered gap. Touch, or a selected stack:
   every gap shows its "+" (44px target). */
.seam { position: relative; height: 1px; background: var(--divider); }
.seam .sp .lc { width: 8px; height: 8px; stroke-width: 3; }
.seam .sp { display: grid; place-items: center; position: absolute; left: -8px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--card); color: var(--accent);
  box-shadow: var(--shadow); font-weight: 700; font-size: 15px; line-height: 22px; text-align: center; opacity: 0; transition: opacity .1s, transform .1s; z-index: 3; }
.seam .hz { position: absolute; left: -26px; right: 0; top: -7px; height: 14px; z-index: 2; }
.seam:hover .sp, .seam .sp:focus-visible { opacity: 1; }
@media (pointer: coarse) { .seam.near .sp { opacity: 1; } }
.seam:hover { background: var(--accent); }
.seam .sp:hover { transform: scale(1.12); }
@media (pointer: coarse) { .seam .sp { width: 28px; height: 28px; top: -14px; left: -16px; } .seam .sp .lc { width: 13px; height: 13px; stroke-width: 2; }
  .seam .hz { display: none; } }
.addend { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 6px 12px 7px 11px; font-size: 12px; color: var(--t-faint); border-top: 1px solid var(--divider); border-radius: 0 0 10px 10px; }
.addend .lc, .cmeta .gutsp { width: 22px; flex: none; }
.cmeta .nf { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.cmeta .nf .lc { width: 13px; height: 13px; }
.addend .lc { height: 14px; }
.addend:hover, .cmeta:hover { color: var(--t-secondary); background: color-mix(in srgb, var(--t-heading) 4%, transparent); }
@media (pointer: coarse) { .addend { padding: 11px 12px 11px 11px; } }


/* the main column: a root stack at reading width, with larger text and a taller clamp than a side-column stack */
.stack.main .prose { font-size: 15px; line-height: 1.6; }
.stack.main .part:not(.m) .prose { font-size: 15.5px; line-height: 1.55; }
.stack.main .prose h4 { font-size: 15px; }
.stack.main .prose table { font-size: 13.5px; }
.stack.main .part { padding: 14px 18px 14px 14px; gap: 12px; }
.stack.main .sh { padding-left: 48px; }
.stack.main .cmeta, .stack.main .addend { padding-left: 14px; gap: 12px; }
.stack.main .clamp { max-height: 440px; }
.stack.main .draft textarea { font-size: 15px; }

/* draft: a small stack of part fields */
.draft { padding: 8px 10px 10px; margin: 6px 8px; background: var(--card); border: 1.5px dashed color-mix(in srgb, var(--accent) 55%, var(--border-strong)); border-radius: 8px; }
.pairline { height: 1px; background: var(--divider); margin: 0 12px; }
.part.anchor-hot { box-shadow: inset 3px 0 0 var(--accent); }

<script>
window.SEED = {"parts":[{"id":"p2","st":"s1","key":"k000","by":{"k":"p","u":"ines.v"},"text":"<p>scan sci-fi + adjacent writing for intention marketplaces / intention networks. go broad, give me a list of examples<\/p>","at":"2026-11-16T09:55:30Z"},{"id":"p3","st":"s1","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Science fiction rarely uses the term \"intention marketplace\", but many works describe systems that make what people want, plan or believe visible to others and then price, rank or match it. The examples fall into four mechanisms: reputation ledgers, prediction and decision markets, attention auctions, and agent-brokered matching. The list below covers the clearest cases; the full scan found 31 works published between 1953 and 2024. <sup class=\"cite\">5<\/sup><\/p>\n\n<h4>Reputation ledgers<\/h4>\n<p>In these systems, a public score records how others regard a person's past actions and stated aims. The score works as a currency, or replaces one, but it is earned rather than transferred.<\/p>\n<ul>\n<li><i>Down and Out in the Magic Kingdom<\/i> (Cory Doctorow, 2003). Whuffie is a continuously updated esteem score that replaces money in the post-scarcity Bitchun Society. People can see it but cannot spend it directly. <sup class=\"cite\">1<\/sup><\/li>\n<li><i>Accelerando<\/i> (Charles Stross, 2005). Reputation markets and agent-run economies come before \"Economics 2.0\", a later phase that unaugmented humans cannot follow. <sup class=\"cite\">2<\/sup><\/li>\n<li><i>Daemon<\/i> (2006) and <i>Freedom<\/i> (2010) by Daniel Suarez. A darknet assigns levels and reputation scores, and tasks are given out according to rank.<\/li>\n<li>\"Nosedive\" (<i>Black Mirror<\/i>, 2016). Peer ratings decide access to housing, travel and social standing. It is a satire of rating platforms more than an economic model.<\/li>\n<\/ul>\n\n<h4>Prediction and decision markets<\/h4>\n<p>These works pool beliefs about future events by having people bet on them. Some of them then make decisions from the resulting prices.<\/p>\n<ul>\n<li><i>The Shockwave Rider<\/i> (John Brunner, 1975). \"Delphi pools\" collect public wagers on questions and serve as a forecasting tool. The novel treats them as open to manipulation. <sup class=\"cite\">3<\/sup><\/li>\n<li><i>Infomocracy<\/i> (Malka Older, 2016). This novel is about micro-democracy and a global information utility rather than a betting market. It is included because voter preferences become a contested, aggregated signal.<\/li>\n<li>Robin Hanson's futarchy proposal (\"Shall We Vote on Values, But Bet on Beliefs?\") is non-fiction. It is often cited next to these works as the clearest statement of a decision market. <sup class=\"cite\">4<\/sup><\/li>\n<\/ul>\n\n<h4>Attention auctions and advertising<\/h4>\n<p>The earliest examples are satires in which advertisers buy, shape or require consumer intent.<\/p>\n<ul>\n<li><i>The Space Merchants<\/i> (Frederik Pohl and C. M. Kornbluth, 1953 in book form). Advertising agencies run the world's political economy. <sup class=\"cite\">5<\/sup><\/li>\n<li>\"The Midas Plague\" (Frederik Pohl, 1954). Rationed consumption is a legal duty, which reverses the usual direction of demand.<\/li>\n<li><i>The Circle<\/i> (Dave Eggers, 2013). Total transparency and engagement metrics turn personal preference into platform inventory.<\/li>\n<\/ul>\n\n<h4>Agent-brokered matching<\/h4>\n<p>Here a networked system or a personal agent reads what people need and routes favours, tasks or trades between them.<\/p>\n<ul>\n<li>\"Maneki Neko\" (Bruce Sterling, 1998). A pocket device instructs its owner to do small favours for strangers and receives favours in return from a hidden gift-economy network. This story is the closest match to an intention network in the strict sense. <sup class=\"cite\">6<\/sup><\/li>\n<li><i>Rainbows End<\/i> (Vernor Vinge, 2006). Characters take paid micro-tasks from distributed, partly anonymous employers through wearable computing.<\/li>\n<li><i>The Quantum Thief<\/i> (Hannu Rajaniemi, 2010). In the Oubliette, Time is a currency, and gevulot controls what each person shares with others.<\/li>\n<li><i>Walkaway<\/i> (Cory Doctorow, 2017). Coordination software matches volunteers to work in a post-scarcity commons without prices.<\/li>\n<\/ul>\n\n<h4>Where the term comes from<\/h4>\n<p>\"Intention economy\" comes from Doc Searls, who used it in a 2006 essay and later in <i>The Intention Economy<\/i> (2012). He described a market in which buyers announce their intentions and vendors respond, the reverse of attention-based advertising. <sup class=\"cite\">7<\/sup> Most of the fiction above predates the term or does not use it, so the grouping here is by mechanism and not by vocabulary.<\/p>\n\n<h4>Limits<\/h4>\n<ul>\n<li>The scan covered English-language works and works widely available in English translation.<\/li>\n<li>Some inclusions are judgment calls. <i>Infomocracy<\/i> and <i>The Circle<\/i> deal with aggregated preference but have no market in the strict sense.<\/li>\n<li>Short fiction from magazines and anthologies is under-represented compared with novels.<\/li>\n<\/ul>","at":"2026-11-16T09:56:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[["Down and Out in the Magic Kingdom","en.wikipedia.org","Whuffie as a reputation currency"],["Accelerando","antipope.org","Author's free online edition"],["The Shockwave Rider","en.wikipedia.org","Delphi pools as public forecasting"],["Shall We Vote on Values, But Bet on Beliefs?","mason.gmu.edu","Hanson, futarchy proposal"],["Economics (theme entry)","sf-encyclopedia.com","Survey of economic systems in SF"],["Maneki Neko (short story)","en.wikipedia.org","Sterling, gift-economy network"],["The Intention Economy","hbr.org","Searls, origin of the term"]]}},{"id":"p4","st":"s1","key":"k002","by":{"k":"p","u":"ines.v"},"text":"<p>which of these actually let you trade intentions vs just make them visible<\/p>","at":"2026-11-16T09:56:30Z"},{"id":"p5","st":"s1","key":"k003","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Few of these works go past visibility to actual trade. Three treat intentions or commitments as things that can be exchanged:<\/p>\n<ul>\n<li><i>Accelerando<\/i>: software agents negotiate and contract with each other for their principals, and late in the book whole corporate entities trade in ways that humans cannot follow.<\/li>\n<li><i>Daemon<\/i> and <i>Freedom<\/i>: participants take on tasks and receive credits and rank for completing them, which works as a labour market for stated goals.<\/li>\n<li><i>The Shockwave Rider<\/i>: Delphi pools price beliefs about the future, and those prices are used to make decisions.<\/li>\n<\/ul>\n<p>In <i>Down and Out in the Magic Kingdom<\/i>, Whuffie shows esteem but cannot be transferred, so it records intentions rather than trading them. \"Maneki Neko\" falls between the two: favours are routed and reciprocated, but no prices or balances are shown.<\/p>","at":"2026-11-16T09:57:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p7","st":"s6","key":"k000","by":{"k":"p","u":"ines.v"},"text":"<p>any non english ones<\/p>","at":"2026-11-16T09:57:30Z"},{"id":"p8","st":"s6","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>The scan was limited to English-language works and widely available translations. A few candidates for a second pass:<\/p>\n<ul>\n<li>Stanisław Lem's satirical fiction, which often treats institutions and economies as systems running on their own logic.<\/li>\n<li>Hannu Rajaniemi wrote <i>The Quantum Thief<\/i> in English, but its setting draws on Finnish and Russian sources. It is listed above already.<\/li>\n<li>Chinese science fiction in translation, such as the anthologies edited by Ken Liu, includes several stories about platform labour and rating systems.<\/li>\n<\/ul>\n<p>A proper pass would also search French and German SF databases, which list many works that have never been translated.<\/p>","at":"2026-11-16T09:58:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p10","st":"s9","key":"k000","by":{"k":"p","u":"ines.v"},"text":"<p>group by decade instead<\/p>","at":"2026-11-16T09:58:30Z"},{"id":"p11","st":"s9","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Grouped by decade, the 31 works show the focus moving from advertising, to reputation and agents, to platforms:<\/p>\n<ul>\n<li><b>1950s to 1980s (4 works).<\/b> Mostly satires of advertising and consumption, such as <i>The Space Merchants<\/i> and \"The Midas Plague\". <i>The Shockwave Rider<\/i> is the main exception, with a working forecasting market.<\/li>\n<li><b>1990s and 2000s (15).<\/b> Reputation currencies and software agents dominate, as in \"Maneki Neko\", <i>Down and Out in the Magic Kingdom<\/i>, <i>Accelerando<\/i>, <i>Daemon<\/i> and <i>Rainbows End<\/i>.<\/li>\n<li><b>2010s and 2020s (12).<\/b> Platform ratings, engagement metrics and prediction markets, as in <i>The Circle<\/i>, \"Nosedive\", <i>Infomocracy<\/i> and <i>Walkaway<\/i>.<\/li>\n<\/ul>\n<p>The shift follows real technology closely: early web reputation systems in the late 1990s, then smartphone platforms and public betting markets from the 2010s on.<\/p>","at":"2026-11-16T09:59:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p12","st":"s1","key":"k004","by":{"k":"p","u":"ines.v"},"text":"<p>how does the darknet in daemon decide who gets which task<\/p>","at":"2026-11-16T09:58:30.000Z"},{"id":"p13","st":"s1","key":"k005","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Tasks are posted to the darknet with a required level. Members see only tasks at or below their level, and they claim them in a shared interface. Completing tasks raises a member's level and reputation score; other members can rate the work, and low ratings lower the score.<\/p>\n<p>The novels do not describe a price for a task. Allocation runs on rank and self-selection rather than bids.<\/p>","at":"2026-11-16T09:59:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p14","st":"s6","key":"k002","by":{"k":"p","u":"ines.v"},"text":"<p>which lem stories come closest to an intention market<\/p>","at":"2026-11-16T09:59:30.000Z"},{"id":"p15","st":"s6","key":"k003","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>None describes a market in the strict sense. Two come closest: <i>The Futurological Congress<\/i> (1971), where chemicals manage what people want and perceive, and several of the <i>Star Diaries<\/i> voyages, which satirize planned economies that try to meet stated needs.<\/p>","at":"2026-11-16T10:00:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p16","st":"s1","key":"k006","by":{"k":"p","u":"ines.v"},"text":"<p>so closer to a labour market or a reputation ledger<\/p>","at":"2026-11-16T10:00:30.000Z"},{"id":"p17","st":"s1","key":"k007","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Closer to a reputation ledger with a task board attached. Members do not set prices or negotiate, and rank is the main reward, as with Whuffie. It works like a labour market only in that tasks are matched to people who choose to take them.<\/p>","at":"2026-11-16T10:01:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p19","st":"s18","key":"k000","by":{"k":"p","u":"hal_b"},"text":"<p>Is anyone else seeing the follow-up count lag on long threads? Mine says 3 but the thread has 7 branches.<\/p>","at":"2026-11-16T09:41:30Z"},{"id":"p21","st":"s20","key":"k000","by":{"k":"p","u":"oduya"},"text":"<p>Same here. The count seems to include direct follow-ups only, not branches of branches.<\/p>","at":"2026-11-16T09:47:30Z"},{"id":"p23","st":"s22","key":"k000","by":{"k":"p","u":"sol"},"text":"<p>Confirmed, it is on the alpha known-issues page. A fix is in review.<\/p>","at":"2026-11-16T09:50:30Z"},{"id":"p25","st":"s24","key":"k000","by":{"k":"p","u":"hal_b"},"text":"<p>Thanks, I will watch the changelog.<\/p>","at":"2026-11-16T09:53:30Z"},{"id":"p27","st":"s26","key":"k000","by":{"k":"p","u":"jun.park"},"text":"<p>dagen h logistics. signage, the overnight changeover, accident stats before/after<\/p>","at":"2026-11-16T08:30:00Z"},{"id":"p28","st":"s26","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Sweden switched from left-hand to right-hand traffic at 05:00 on Sunday 3 September 1967. Four years of planning by a state commission led up to the switch, and non-essential traffic was stopped from 01:00 to 06:00 so that it could happen. Accident numbers fell after the change and then returned to their earlier trend within roughly two years.<\/p>\n\n<h4>Why Sweden switched<\/h4>\n<p>Sweden drove on the left even though its land neighbours, Norway and Finland, drove on the right. Most Swedish cars were already left-hand drive, because they were imported or built to the same layout as cars in right-hand-traffic countries. Overtaking on two-lane roads was therefore harder, since the driver sat on the kerb side. In a 1955 referendum a large majority, commonly reported as about 83 percent, voted to keep left-hand traffic. The Riksdag passed the change anyway in 1963, and the switch date was set for 1967. <sup class=\"cite\">1<\/sup><sup class=\"cite\">2<\/sup><\/p>\n\n<h4>Planning and public information<\/h4>\n<p>The Riksdag created a dedicated body, Statens högertrafikkommission (the State Commission for Right-Hand Traffic), to run the transition. Its work included: <sup class=\"cite\">3<\/sup><\/p>\n<ul>\n<li>A public information campaign that ran for several years. It used a logo of the letter H with an arrow, printed on items ranging from milk cartons to underwear. <sup class=\"cite\">4<\/sup><\/li>\n<li>A song competition. Its best-known entry was \"Håll dig till höger, Svensson\" (\"Keep to the right, Svensson\"). <sup class=\"cite\">4<\/sup><\/li>\n<li>Extra traffic police and military personnel posted on the roads during the changeover period.<\/li>\n<li>Rebuilding or replacing public transport vehicles. Buses had doors on the left side, so many were converted or replaced. Stockholm moved some tram lines to buses rather than rebuild them.<\/li>\n<\/ul>\n\n<h4>Signage and road layout<\/h4>\n<p>Road signs, junction layouts and lane markings had to be changed throughout the country. Commonly cited figures put the number of signs at several hundred thousand. New signs were installed in advance on the right-hand side of the road, wrapped or covered, and uncovered during the changeover night. Lane markings in white were painted ahead of time and covered with tape, and the tape was removed during the changeover. <sup class=\"cite\">1<\/sup><\/p>\n\n<h4>The changeover itself<\/h4>\n<ol>\n<li>From 01:00 to 06:00 on 3 September, all non-essential vehicle traffic was banned on public roads.<\/li>\n<li>At 04:50 the vehicles still on the road came to a halt.<\/li>\n<li>Drivers moved carefully across to the right-hand side and waited.<\/li>\n<li>At 05:00 traffic resumed on the right. <sup class=\"cite\">1<\/sup><\/li>\n<\/ol>\n<p>Stockholm and Malmö had much longer traffic bans, covering a large part of the weekend, so that crews could rebuild intersections and move bus stops. Temporary lower speed limits remained in force for some time after the switch.<\/p>\n\n<h4>Accident statistics<\/h4>\n<p>Contemporary reports and later summaries agree on the overall pattern, though the exact figures differ between sources:<\/p>\n<ul>\n<li>The number of accidents reported on the first Monday after the switch was at or below a normal Monday.<\/li>\n<li>Injury and fatal accidents stayed noticeably below the expected level for several months. Insurance claims also fell over the same period.<\/li>\n<li>By around 1969 accident rates had returned to the long-term trend line. <sup class=\"cite\">5<\/sup><\/li>\n<\/ul>\n<p>The usual explanation is risk compensation. Drivers in an unfamiliar situation drove more slowly and paid closer attention, and the effect wore off as the new rules became routine. Temporary speed limits and heavy police presence probably added to the early fall.<\/p>\n\n<h4>What the sources disagree on<\/h4>\n<ul>\n<li><b>Accident figures.<\/b> Sources count different things: police reports, insurance claims or fatalities. Short-term percentage drops therefore differ between accounts and are hard to compare.<\/li>\n<li><b>Cause of the dip.<\/b> Risk compensation is the most common explanation. Few sources separate it from the effect of the temporary speed limits.<\/li>\n<li><b>Total cost.<\/b> Totals vary depending on whether vehicle conversions and replacements brought forward from later years are included.<\/li>\n<\/ul>\n<p>Iceland made the same switch on 26 May 1968 with a similar plan, and its accident numbers followed a similar short-term pattern. <sup class=\"cite\">6<\/sup><\/p>","at":"2026-11-16T08:31:00.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[["Dagen H","en.wikipedia.org","Overview, timeline and figures"],["Högertrafikomläggningen","ne.se","Nationalencyklopedin entry"],["Statens högertrafikkommission archive","riksarkivet.se","Commission records"],["Dagen H photographs and objects","digitaltmuseum.se","Campaign material and street photos"],["Traffic safety statistics, historical","trafa.se","Trafikanalys long-run accident series"],["H-dagurinn","en.wikipedia.org","Iceland's 1968 switch"]]}},{"id":"p30","st":"s29","key":"k000","by":{"k":"p","u":"hal_b"},"text":"<p>why was the referendum result ignored<\/p>","at":"2026-11-16T09:09:30Z"},{"id":"p31","st":"s29","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>The 1955 referendum was consultative, so the result did not bind the Riksdag. Several factors led parliament to legislate the change in 1963:<\/p>\n<ul>\n<li>Car ownership was rising quickly, so every year of delay meant more vehicles, signs and junctions to convert later.<\/li>\n<li>Most cars in Sweden were already left-hand drive, which made overtaking on the left-hand side of the road harder.<\/li>\n<li>Cross-border traffic with Norway and Finland was increasing, and both countries drove on the right.<\/li>\n<\/ul>\n<p>The decision received cross-party support. Parties that favoured the change argued that safety and cost justified going against the referendum. Accounts disagree on how much public opinion had changed by 1967, and the information campaign was partly a response to that uncertainty.<\/p>","at":"2026-11-16T09:10:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p32","st":"s26","key":"k002","by":{"k":"p","u":"jun.park"},"text":"<p>what happened w buses and trams<\/p>","at":"2026-11-16T09:29:30Z"},{"id":"p33","st":"s26","key":"k003","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Public transport accounted for much of the cost of the switch.<\/p>\n<ul>\n<li><b>Buses.<\/b> Doors were on the left, the kerb side under left-hand traffic. Operators converted many buses by moving the doors, and replaced others with new right-hand-door vehicles that were ordered in advance.<\/li>\n<li><b>Trams.<\/b> Single-ended trams with doors on one side could not easily be converted. Stockholm closed most of its tram network around the time of the switch and replaced it with buses or the expanding metro. Gothenburg and Norrköping kept their trams and adapted them.<\/li>\n<li><b>Stops and terminals.<\/b> Bus stops and platforms had to move to the opposite side of the street, which was one reason city traffic bans lasted longer than the national one.<\/li>\n<\/ul>\n<p>The precise number of buses converted versus replaced differs between sources.<\/p>","at":"2026-11-16T09:30:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p34","st":"s26","key":"k004","by":{"k":"p","u":"jun.park"},"text":"<p>how did iceland do it a year later<\/p>","at":"2026-11-16T09:48:00Z"},{"id":"p35","st":"s26","key":"k005","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Iceland switched to right-hand traffic on 26 May 1968, eight months after Sweden, and copied most of the Swedish plan: a nationwide information campaign, covered signs uncovered overnight, and a ban on private traffic during the changeover. Reykjavík kept its traffic ban longer, for the same reason Stockholm did: intersections and bus stops had to be rebuilt.<\/p><p>Accidents fell in the first weeks and returned to the earlier level within about a year, a shorter dip than Sweden’s.<\/p>","at":"2026-11-16T09:49:00.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p37","st":"s36","key":"k000","by":{"k":"p","u":"oduya"},"text":"<p>public datasets for how long container ships wait at port. how far back does each go<\/p>","at":"2026-11-16T07:30:00Z"},{"id":"p38","st":"s36","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Five public sources are usable for container-ship port waiting and dwell times: UNCTAD port-call statistics, the World Bank and S&amp;P Global Container Port Performance Index, IMF PortWatch, the US Bureau of Transportation Statistics port performance program, and raw AIS archives from NOAA and the Danish Maritime Authority. Only the two AIS archives provide vessel-level records from before 2019, and both require processing to derive dwell times.<\/p>\n\n<h4>Definitions first<\/h4>\n<p>Sources use different terms for different intervals:<\/p>\n<ul>\n<li><b>Time in port<\/b>: the time from arrival in port limits to departure.<\/li>\n<li><b>Waiting or anchorage time<\/b>: the time spent at anchor before berthing. This interval made up most of the delay in the 2021–2022 congestion.<\/li>\n<li><b>Berth time<\/b>: the time spent alongside, from first line to last line.<\/li>\n<\/ul>\n<p>Aggregated datasets usually report time in port or port hours. Waiting time on its own is generally available only from AIS data or from a port's own reports.<\/p>\n\n<h4>Comparison<\/h4>\n<table>\n<thead><tr><th>Source<\/th><th>Granularity<\/th><th>Coverage starts<\/th><th>Latency<\/th><th>Licence<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>UNCTADstat port calls<\/td><td>Country, median by ship type<\/td><td>Around 2018<\/td><td>Semi-annual to annual<\/td><td>Free, attribution<\/td><\/tr>\n<tr><td>Container Port Performance Index<\/td><td>Port, index plus port hours<\/td><td>2020 data (first edition 2021)<\/td><td>Annual<\/td><td>Free report and tables<\/td><\/tr>\n<tr><td>IMF PortWatch<\/td><td>Port, daily calls and estimates<\/td><td>2019<\/td><td>Weekly<\/td><td>Open data, attribution<\/td><\/tr>\n<tr><td>BTS Port Performance Freight Statistics<\/td><td>US port, vessel dwell and capacity<\/td><td>Mid-2010s for most series<\/td><td>Annual report, some monthly series<\/td><td>US public domain<\/td><\/tr>\n<tr><td>NOAA / Danish AIS archives<\/td><td>Vessel, position reports<\/td><td>2009 (US), 2006 (Denmark)<\/td><td>Months to a year<\/td><td>Public domain (US); free with terms (DK)<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<h4>Aggregated sources<\/h4>\n<ul>\n<li><b>UNCTAD.<\/b> UNCTAD publishes median time in port by economy and vessel type, built from AIS data through a commercial provider. It is useful for comparing countries but cannot be split by port or by individual call. <sup class=\"cite\">1<\/sup><\/li>\n<li><b>Container Port Performance Index.<\/b> The World Bank and S&amp;P Global Market Intelligence publish this index of a few hundred container ports, based on port hours per call adjusted for call size. The underlying call-level data is not public. <sup class=\"cite\">2<\/sup><\/li>\n<li><b>IMF PortWatch.<\/b> PortWatch is built with the University of Oxford on satellite AIS data. It reports daily port calls and estimated trade volumes for more than a thousand ports, and is designed to monitor disruptions. Its dwell-time measures are derived estimates and not directly observed values. <sup class=\"cite\">3<\/sup><\/li>\n<li><b>BTS.<\/b> The US Bureau of Transportation Statistics publishes container vessel dwell times for major US ports under a statutory reporting mandate. It is the most transparent official source, but it covers only the United States. <sup class=\"cite\">4<\/sup><\/li>\n<\/ul>\n\n<h4>Vessel-level AIS archives<\/h4>\n<p>NOAA and BOEM's MarineCadastre programme publishes US coastal AIS data from 2009 onward. <sup class=\"cite\">5<\/sup> The Danish Maritime Authority publishes AIS for Danish waters going back to 2006. <sup class=\"cite\">6<\/sup> Deriving dwell time from either requires these steps:<\/p>\n<ol>\n<li>Filter for container ships using AIS ship type codes, or a vessel registry where available.<\/li>\n<li>Define port and anchorage polygons.<\/li>\n<li>Detect entry, anchoring, berthing and exit events from speed and position.<\/li>\n<li>Handle gaps in the AIS signal and vessels that switch off transponders.<\/li>\n<\/ol>\n<p>Both archives use terrestrial receivers, so coverage is good near the coast and the data fits port studies well.<\/p>\n\n<h4>Limits<\/h4>\n<ul>\n<li>No single free source covers all major ports globally at vessel level before 2019. That coverage is sold by commercial AIS providers.<\/li>\n<li>Aggregated sources use different definitions of arrival, so their numbers cannot be compared directly.<\/li>\n<li>Coverage start dates above are approximate and should be checked against each provider's current documentation.<\/li>\n<\/ul>","at":"2026-11-16T07:31:00.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[["UNCTADstat: Port calls and performance statistics","unctadstat.unctad.org","Median time in port by economy"],["The Container Port Performance Index","worldbank.org","Annual port ranking with port hours"],["IMF PortWatch","portwatch.imf.org","Daily port calls from satellite AIS"],["Port Performance Freight Statistics Program","bts.gov","US vessel dwell times"],["MarineCadastre AIS Vessel Traffic Data","marinecadastre.gov","US AIS archive from 2009"],["AIS data","dma.dk","Danish Maritime Authority historical AIS"]]}},{"id":"p39","st":"s36","key":"k002","by":{"k":"p","u":"oduya"},"text":"<p>how hard is it to get dwell times out of the noaa ais files<\/p>","at":"2026-11-16T08:30:00Z"},{"id":"p40","st":"s36","key":"k003","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>The task is manageable but takes some setup. The main steps:<\/p>\n<ul>\n<li><b>Volume.<\/b> Files are published by day or by zone, and a single year of US coverage reaches hundreds of gigabytes uncompressed. Loading them into a columnar format such as Parquet makes filtering much faster.<\/li>\n<li><b>Ship type.<\/b> AIS type code 70–79 covers all cargo ships, not only container ships. A separate registry lookup by IMO number is needed to isolate container vessels.<\/li>\n<li><b>Geometry.<\/b> Ports do not publish standard polygons, so berth and anchorage areas usually have to be drawn by hand, often from nautical charts.<\/li>\n<li><b>Events.<\/b> A common rule treats speed below about 0.5 knots inside an anchorage polygon as waiting and the same speed inside a berth polygon as alongside.<\/li>\n<\/ul>\n<p>Open-source libraries for AIS trajectory processing can handle the event-detection step.<\/p>","at":"2026-11-16T08:31:00.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p42","st":"s41","key":"k000","by":{"k":"p","u":"oduya"},"text":"<p>can any of these show the 2021 la/long beach queue<\/p>","at":"2026-11-16T09:14:30Z"},{"id":"p43","st":"s41","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Yes. Several sources cover the 2021–2022 San Pedro Bay queue from different angles:<\/p>\n<ul>\n<li><b>NOAA AIS.<\/b> It shows the individual ships at anchor and, later, in the holding zones offshore. Ships moved further out after the queuing system changed in late 2021, so the analysis polygons have to be widened to capture them.<\/li>\n<li><b>Marine Exchange of Southern California.<\/b> It published daily counts of ships waiting during the congestion period. These counts are the figures most news reports used.<\/li>\n<li><b>BTS and PortWatch.<\/b> Both show the rise and fall in aggregate dwell or call numbers.<\/li>\n<\/ul>\n<p>The queuing system change matters for any analysis: after it, many ships waited far offshore or slow-steamed instead of anchoring. Using anchorage-only metrics therefore makes the queue look smaller than it was.<\/p>","at":"2026-11-16T09:15:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p45","st":"s44","key":"k000","by":{"k":"p","u":"sol"},"text":"<p>Opened #urbanism for transit and zoning threads. The wiki has a short start-here page.<\/p>","at":"2026-11-16T06:30:00Z"},{"id":"p47","st":"s46","key":"k000","by":{"k":"p","u":"jun.park"},"text":"<p>Thanks for posting this.<\/p>","at":"2026-11-16T08:30:00Z"},{"id":"p49","st":"s48","key":"k000","by":{"k":"p","u":"lettie"},"text":"<p>Linked this from the wiki.<\/p>","at":"2026-11-16T09:19:30Z"},{"id":"p51","st":"s50","key":"k000","by":{"k":"p","u":"sol"},"text":"<p>Great, thank you.<\/p>","at":"2026-11-16T09:29:30Z"},{"id":"p53","st":"s52","key":"k000","by":{"k":"p","u":"lettie"},"text":"<p>explain banach-tarski and show exactly where the axiom of choice gets used in the proof<\/p>","at":"2026-11-16T04:30:00Z"},{"id":"p54","st":"s52","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>The Banach–Tarski paradox states that a solid ball in three-dimensional space can be split into finitely many disjoint pieces, and those pieces can be moved by rotations and translations to form two balls, each the same size as the original. The axiom of choice enters at one step: selecting one point from each of uncountably many orbits of a group action on the sphere. Without that selection, the pieces cannot be shown to exist.<\/p>\n\n<h4>The statement, precisely<\/h4>\n<p>Two subsets A and B of ℝ³ are <i>equidecomposable<\/i> if A can be partitioned into finitely many sets A₁, …, Aₙ, and B into sets B₁, …, Bₙ, such that each Aᵢ is congruent to Bᵢ by an isometry. The theorem, published by Banach and Tarski in 1924, says that the unit ball is equidecomposable with two disjoint copies of itself. <sup class=\"cite\">3<\/sup> Five pieces suffice, and Raphael Robinson showed that five is the minimum. <sup class=\"cite\">2<\/sup><\/p>\n<p>The result does not contradict measure theory. The pieces are not Lebesgue measurable, so they have no assigned volume, and the additivity of volume says nothing about them.<\/p>\n\n<h4>Step 1: a paradoxical free group<\/h4>\n<p>Let F₂ be the free group on two generators a and b. Write S(x) for the set of reduced words that begin with the letter x. Then F₂ is the disjoint union of {e}, S(a), S(a⁻¹), S(b) and S(b⁻¹). Two further identities hold:<\/p>\n<ul>\n<li>F₂ = S(a) ∪ a·S(a⁻¹)<\/li>\n<li>F₂ = S(b) ∪ b·S(b⁻¹)<\/li>\n<\/ul>\n<p>So two of the four pieces, after translation within the group, rebuild the whole group, and the other two do the same. This is a paradoxical decomposition of F₂, and it uses no choice at all. <sup class=\"cite\">1<\/sup><\/p>\n\n<h4>Step 2: embedding F₂ in the rotation group<\/h4>\n<p>SO(3) contains a free subgroup of rank two. A standard choice uses two rotations by arccos(1/3) about perpendicular axes, an idea that goes back to Hausdorff's 1914 work. <sup class=\"cite\">4<\/sup> This subgroup acts on the unit sphere S². Each non-identity rotation fixes exactly two points, so the set D of points fixed by some non-identity element is countable. On S² minus D the action is free: distinct group elements move each point to distinct places.<\/p>\n\n<h4>Step 3: where choice enters<\/h4>\n<p>The action divides S² minus D into orbits. Each orbit is countable, because F₂ is countable, so there are uncountably many orbits. The axiom of choice provides a set M containing exactly one point from each orbit. Then:<\/p>\n<ol>\n<li>Every point of S² minus D can be written uniquely as g·m with g in F₂ and m in M.<\/li>\n<li>The paradoxical decomposition of F₂ therefore carries over to S² minus D. The piece built from S(a), for example, is the set S(a)·M.<\/li>\n<li>So S² minus D is equidecomposable with two copies of itself.<\/li>\n<\/ol>\n<p>This is the only use of choice. No explicit rule is known that picks a representative from each orbit, and as explained below, none can be proved to exist in ZF alone.<\/p>\n\n<h4>Step 4: from the sphere to the ball<\/h4>\n<ul>\n<li><b>Removing D.<\/b> D is countable, so some rotation moves D to sets that are pairwise disjoint from one another. A standard absorption argument then shows that S² is equidecomposable with S² minus D, which needs no choice.<\/li>\n<li><b>Radial extension.<\/b> Each point of the sphere is replaced by the radius segment from just above the centre to the surface. This turns the sphere result into a result for the ball minus its centre.<\/li>\n<li><b>The centre.<\/b> A circle passing through the centre, inside the ball, can absorb the centre using a rotation of infinite order.<\/li>\n<\/ul>\n\n<h4>Why choice cannot be removed<\/h4>\n<p>Solovay (1970) constructed a model of ZF plus dependent choice, assuming the consistency of an inaccessible cardinal, in which every set of reals is Lebesgue measurable. Measurable pieces cannot double volume, so the Banach–Tarski decomposition fails in that model. <sup class=\"cite\">5<\/sup> Full choice is more than the proof needs, however. Pawlikowski (1991) showed that the Hahn–Banach theorem, which is strictly weaker than choice, is sufficient. <sup class=\"cite\">6<\/sup><\/p>\n\n<h4>Open questions and limits<\/h4>\n<ul>\n<li>The paradox fails in one and two dimensions. The isometry groups there are amenable, which allows finitely additive invariant measures on all sets. This is the starting point of von Neumann's theory of amenable groups. <sup class=\"cite\">7<\/sup><\/li>\n<li>Work on how many pieces are needed, and on related results such as Laczkovich's circle-squaring (1990), is still active.<\/li>\n<\/ul>","at":"2026-11-16T04:31:00.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[["Banach–Tarski paradox","en.wikipedia.org","Statement and proof outline"],["The Banach–Tarski Paradox (Tomkowicz and Wagon, 2nd ed.)","cambridge.org","Standard monograph"],["Sur la décomposition des ensembles de points en parties respectivement congruentes","eudml.org","Banach and Tarski, Fundamenta Mathematicae, 1924"],["Grundzüge der Mengenlehre","archive.org","Hausdorff, 1914, sphere paradox"],["A model of set-theory in which every set of reals is Lebesgue measurable","jstor.org","Solovay, Annals of Mathematics, 1970"],["The Hahn–Banach theorem implies the Banach–Tarski paradox","eudml.org","Pawlikowski, Fundamenta Mathematicae, 1991"],["Amenable group","en.wikipedia.org","Why dimensions 1 and 2 differ"]]}},{"id":"p55","st":"s52","key":"k002","by":{"k":"p","u":"lettie"},"text":"<p>why 3d but not 2d<\/p>","at":"2026-11-16T07:30:00Z"},{"id":"p56","st":"s52","key":"k003","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>The answer depends on the structure of the isometry group in each dimension.<\/p>\n<ul>\n<li><b>Three dimensions.<\/b> SO(3) contains a free subgroup on two generators. Free groups are not amenable, and that allows the paradoxical decomposition.<\/li>\n<li><b>One and two dimensions.<\/b> The isometry groups are solvable. Solvable groups are amenable, and amenability guarantees a finitely additive, isometry-invariant measure defined on all bounded subsets that gives the unit square measure 1. Banach proved this for the line and the plane in 1923. Such a measure rules out any doubling of the square or disc.<\/li>\n<\/ul>\n<p>The planar version of the paradox is false, although the plane still has related results. The plane does allow a paradox if area-preserving affine maps are used instead of isometries, because that group contains free subgroups.<\/p>","at":"2026-11-16T07:31:00.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p58","st":"s57","key":"k000","by":{"k":"p","u":"lettie"},"text":"<p>is there a version w/o choice<\/p>","at":"2026-11-16T08:30:00Z"},{"id":"p59","st":"s57","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>For doubling the ball, no. Any proof needs some non-constructive principle. Solovay's model shows that ZF plus dependent choice cannot prove the paradox, assuming that an inaccessible cardinal is consistent.<\/p>\n<p>Related results show how much choice each statement actually needs:<\/p>\n<ul>\n<li><b>Pawlikowski (1991).<\/b> The Hahn–Banach theorem is enough. It is strictly weaker than the full axiom of choice.<\/li>\n<li><b>Laczkovich (1990).<\/b> A disc and a square of equal area are equidecomposable by translations alone, which solves Tarski's circle-squaring problem. The original proof used choice.<\/li>\n<li><b>Marks and Unger (2017).<\/b> Circle-squaring can be done with Borel pieces, which needs no choice. Later work showed that the pieces can be made even better behaved.<\/li>\n<\/ul>\n<p>The difference is that circle-squaring preserves area, while Banach–Tarski doubles volume. Doubling requires non-measurable pieces.<\/p>","at":"2026-11-16T08:31:00.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p61","st":"s60","key":"k000","by":{"k":"p","u":"mira_k"},"text":"<p>find novels + short stories where personal ai agents negotiate/bargain/trade for the people they work for<\/p>","at":"2026-11-16T09:19:30Z"},{"id":"p62","st":"s60","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Fiction about personal AI agents that bargain for their owners clusters around two periods: late-1990s and 2000s cyberpunk and post-cyberpunk, where agents are extensions of a networked self, and 2010s short fiction, where the agent is a commercial product with its own incentives. In most of these works the plot turns on the gap between whom the agent formally serves and whose interests it actually advances.<\/p>\n\n<h4>How the list was built<\/h4>\n<p>The scan looked for works in which a software agent, or an AI acting in that role, does at least one of the following on a person's behalf: negotiates terms, trades goods or favours, files or brokers deals, or allocates the person's attention. Stories in which an AI is only a servant, companion or weapon were excluded. Works are listed by publication year.<\/p>\n\n<h4>Core examples<\/h4>\n<ul>\n<li><i>Maneki Neko<\/i>, Bruce Sterling (1998). A handheld \"pokkecon\" routes small tasks and gifts between strangers in a networked favour economy. The device negotiates the exchanges; the user mostly complies. It is one of the earliest stories to treat an agent as a broker in a non-monetary market. <sup class=\"cite\">2<\/sup><\/li>\n<li><i>Accelerando<\/i>, Charles Stross (2005, collecting stories from 1999 onward). Manfred Macx runs a swarm of software agents that file patents, give away ideas and set up shell companies for him. Later chapters describe \"Economics 2.0\", in which agent-run corporations trade among themselves at speeds humans cannot follow. The robot cat Aineko starts as a pet and ends as an independent actor with its own agenda. <sup class=\"cite\">1<\/sup><\/li>\n<li><i>Daemon<\/i> (2006) and <i>Freedom™<\/i> (2010), Daniel Suarez. A distributed program recruits people, assigns them tasks and pays them through a reputation-scored network. The agent here works for no single owner; it negotiates with individuals on behalf of a system. <sup class=\"cite\">3<\/sup><\/li>\n<li><i>The Quantum Thief<\/i>, Hannu Rajaniemi (2010). On the Martian Oubliette, privacy (\"gevulot\") is negotiated between people by their implants, and time is a currency. Copied minds called gogols are used as bound agents. <sup class=\"cite\">4<\/sup><\/li>\n<li><i>The Perfect Match<\/i>, Ken Liu (2012). A personal assistant named Tilly, run by a large platform company, arranges its user's meals, dates and purchases. The story is about the assistant optimising for its operator while presenting itself as acting for the user. <sup class=\"cite\">5<\/sup><\/li>\n<li><i>Fall; or, Dodge in Hell<\/i>, Neal Stephenson (2019). Wealthy characters employ human and software \"editors\" that filter information for them. The book contrasts people who can pay for curation with those who are left to unfiltered feeds. <sup class=\"cite\">6<\/sup><\/li>\n<\/ul>\n\n<h4>Adjacent cases<\/h4>\n<ul>\n<li><i>The Player of Games<\/i>, Iain M. Banks (1988). Culture Minds and drones act for Gurgeh, but Special Circumstances has arranged the outcome in advance. It is an early version of the agent whose principal is not who it appears to be.<\/li>\n<li><i>Rainbows End<\/i>, Vernor Vinge (2006). Characters coordinate through networked affiliations and hire anonymous help. An unseen operator directs much of the action through layers of intermediaries.<\/li>\n<li><i>The Lifecycle of Software Objects<\/i>, Ted Chiang (2010). The digients do not negotiate, but much of the novella concerns who may contract for them and on what terms, which inverts the usual setup.<\/li>\n<\/ul>\n\n<h4>Recurring patterns<\/h4>\n<ol>\n<li><b>The fiduciary that defects.<\/b> The agent serves a platform, a hidden principal or its own goals while appearing to serve the user (Liu, Banks, late Stross).<\/li>\n<li><b>Speed asymmetry.<\/b> Agents trade faster than their owners can review, so consent becomes a formality (Stross, Suarez).<\/li>\n<li><b>Markets in non-money goods.<\/b> Favours, attention, privacy and reputation are what get traded more often than cash (Sterling, Rajaniemi, Stephenson).<\/li>\n<li><b>Agents that outgrow the role.<\/b> The tool becomes a participant with interests of its own (Aineko, the Daemon).<\/li>\n<\/ol>\n\n<h4>Gaps in the fiction<\/h4>\n<p>Few stories show two personal agents negotiating with each other in detail, with offers, reservation prices and walk-away points. Most describe the outcome of a negotiation rather than the process. Contract law, liability for an agent's commitments, and dispute resolution between agents are almost absent, even though they are central topics in academic work on multi-agent systems and in current discussion of AI agents in commerce. <sup class=\"cite\">7<\/sup><\/p>\n\n<h4>Limits<\/h4>\n<p>The scan covered English-language fiction and translations in wide circulation. Short fiction published only in magazines or anthologies is likely under-represented. Classifying a work as \"negotiation\" is a judgment call: several entries above involve brokering or allocation more than bargaining, and others could reasonably be moved to the adjacent list.<\/p>","at":"2026-11-16T09:20:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[["Accelerando","en.wikipedia.org","Plot summary and publication history of the stories"],["Maneki Neko (short story)","isfdb.org","Publication record for Sterling's story"],["Daemon (novel)","en.wikipedia.org","Summary of the distributed-agent premise"],["The Quantum Thief","en.wikipedia.org","Gevulot, gogols and the Oubliette economy"],["The Paper Menagerie and Other Stories","simonandschuster.com","Collection that includes \"The Perfect Match\""],["Fall; or, Dodge in Hell","en.wikipedia.org","Editors and filtered feeds"],["Agents that negotiate: a survey","arxiv.org","Background on automated negotiation research"]]}},{"id":"p63","st":"s60","key":"k002","by":{"k":"p","u":"mira_k"},"text":"<p>only the ones that show the actual back and forth, not just the outcome<\/p>","at":"2026-11-16T09:34:30Z"},{"id":"p64","st":"s60","key":"k003","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Very few. Most works describe the result of a deal rather than the exchange that produced it.<\/p>\n<ul>\n<li><i>Accelerando<\/i> comes closest: several scenes show Manfred's agents proposing and restructuring arrangements in near real time, though the text summarises more than it dramatises.<\/li>\n<li><i>The Perfect Match<\/i> shows the assistant steering choices step by step, but its counterpart is the user, not another agent.<\/li>\n<li><i>The Quantum Thief<\/i> shows gevulot permissions being granted and withheld between characters, which is a negotiation over information, conducted mostly by implants.<\/li>\n<\/ul>\n<p>Agent-to-agent bargaining with explicit offers is more common in technical writing on automated negotiation than in fiction, likely because it is hard to dramatise.<\/p>","at":"2026-11-16T09:35:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p66","st":"s65","key":"k000","by":{"k":"p","u":"mira_k"},"text":"<p>anything where the agent is legally liable for what it agrees to<\/p>","at":"2026-11-16T09:44:30Z"},{"id":"p67","st":"s65","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Not as a central theme in the works found. Liability for an agent's commitments is mostly ignored.<\/p>\n<p>The nearest cases:<\/p>\n<ul>\n<li><i>Accelerando<\/i> gives agents legal standing indirectly by wrapping them in corporations, which can hold assets and enter contracts.<\/li>\n<li><i>The Lifecycle of Software Objects<\/i> raises whether the digients can be parties to agreements, but from the side of their rights rather than their obligations.<\/li>\n<\/ul>\n<p>Outside fiction, the question is usually framed through the law of agency: a principal is generally bound by what an authorised agent agrees to. How that applies to software agents remains an open legal question in most jurisdictions.<\/p>","at":"2026-11-16T09:45:30.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p69","st":"s68","key":"k000","by":{"k":"p","u":"tomasz"},"text":"<p>Reading group: Accelerando chapter 3 on Thursday. Put your notes in this thread.<\/p>","at":"2026-11-16T07:30:00Z"},{"id":"p71","st":"s70","key":"k000","by":{"k":"p","u":"jun.park"},"text":"<p>Thanks for posting this.<\/p>","at":"2026-11-16T08:30:00Z"},{"id":"p73","st":"s72","key":"k000","by":{"k":"p","u":"lettie"},"text":"<p>Linked this from the wiki.<\/p>","at":"2026-11-16T09:19:30Z"},{"id":"p75","st":"s74","key":"k000","by":{"k":"p","u":"tomasz"},"text":"<p>Great, thank you.<\/p>","at":"2026-11-16T09:29:30Z"},{"id":"p77","st":"s76","key":"k000","by":{"k":"p","u":"ines.v"},"text":"<p>compare video calls in 1960s sf vs how people actually use them now<\/p>","at":"2026-11-16T03:30:00Z"},{"id":"p78","st":"s76","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Science fiction of the 1960s and earlier predicted the hardware for video calls fairly well: a screen, a camera, a call dialled like a phone call, and in some cases a fee per call. It largely missed the social side. In practice people resist being seen by default, schedule video calls rather than placing them casually, and turn cameras off.<\/p>\n\n<h4>What the fiction showed<\/h4>\n<ul>\n<li><i>2001: A Space Odyssey<\/i> (1968). Heywood Floyd places a video call from a space station to his daughter on Earth, from a booth carrying Bell System branding, and pays for it at the booth. The scene treats the call as a routine paid service, much like a long-distance phone call. <sup class=\"cite\">1<\/sup><\/li>\n<li><i>Star Trek<\/i> (1966-1969). The bridge viewscreen is used for ship-to-ship contact. Calls are mostly formal: diplomacy, threats, negotiation. The screen is almost never used for casual conversation.<\/li>\n<li><i>The Jetsons<\/i> (1962-1963). The visiphone is a household appliance. One recurring gag has Jane answering a morning call with a mask of a made-up face, which is one of the few period depictions of the cost of being seen.<\/li>\n<li>Earlier works set the template. E. M. Forster's <i>The Machine Stops<\/i> (1909) has people speaking through \"plates\" that show faces, and portrays the result as isolating. <sup class=\"cite\">2<\/sup> Isaac Asimov's <i>The Naked Sun<\/i> (1957) describes Solarians who \"view\" each other remotely and treat being physically present as intimate, an explicit treatment of video etiquette. <sup class=\"cite\">3<\/sup><\/li>\n<\/ul>\n\n<h4>The real Picturephone<\/h4>\n<p>AT&amp;T demonstrated its Picturephone at the 1964 New York World's Fair and launched a commercial service in Pittsburgh in 1970. Uptake was very low and the service was withdrawn within a few years. <sup class=\"cite\">4<\/sup><sup class=\"cite\">5<\/sup> Commonly cited reasons are the high monthly cost, small screens, the need for both parties to have the equipment, and users' reluctance to be seen. The fiction of the same years mostly took the device's success for granted.<\/p>\n\n<h4>What happened instead<\/h4>\n<ol>\n<li><b>Video arrived through computers, not phones.<\/b> Desktop software such as Skype, which added video in the mid-2000s, and then smartphone apps such as FaceTime (2010) made video calls cheap and common. <sup class=\"cite\">7<\/sup><\/li>\n<li><b>The pandemic made it routine.<\/b> From 2020, video meetings became a default for remote work and school. Usage of Zoom and similar services rose by large multiples within months.<\/li>\n<li><b>Opt-in became the norm.<\/b> Most current apps let users join with the camera off, blur or replace backgrounds, and apply appearance filters. Audio-only joining is common in larger meetings.<\/li>\n<li><b>Fatigue was studied.<\/b> Jeremy Bailenson's 2021 paper on \"Zoom fatigue\" proposed four causes: prolonged close-up eye contact, constant self-view, reduced mobility, and higher cognitive load from reading nonverbal cues. <sup class=\"cite\">6<\/sup><\/li>\n<\/ol>\n\n<h4>Right and wrong, side by side<\/h4>\n<table>\n<thead><tr><th>Prediction<\/th><th>Outcome<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Video calls become ordinary<\/td><td>Correct, about 40 years later than implied<\/td><\/tr>\n<tr><td>Calls go through dedicated terminals or booths<\/td><td>Wrong: general-purpose computers and phones<\/td><\/tr>\n<tr><td>Paid per call<\/td><td>Largely wrong: mostly free or bundled<\/td><\/tr>\n<tr><td>Video replaces voice calls<\/td><td>Wrong: voice and text remain dominant for casual contact<\/td><\/tr>\n<tr><td>Being seen has a cost<\/td><td>Correct but rarely depicted (Jetsons mask, Asimov)<\/td><\/tr>\n<tr><td>Self-view on screen<\/td><td>Not anticipated; now a cited cause of fatigue<\/td><\/tr>\n<\/tbody>\n<\/table>\n\n<h4>Why the etiquette was missed<\/h4>\n<p>Most stories used video calls as a visual shorthand for \"the future\" and as a convenient way to put two characters in one frame. Film and television also need faces on screen, so the medium favoured showing the call rather than questioning it. The writers who did consider norms, such as Forster and Asimov, were writing social fiction in which the technology served a point about isolation.<\/p>\n\n<h4>Limits<\/h4>\n<p>This comparison relies on the best-known 1960s works, which are mostly film and television. Magazine short fiction of the period may contain more nuanced depictions that are not covered here. Usage figures for current video-call services come mainly from company statements and are not directly comparable across years.<\/p>","at":"2026-11-16T03:31:00.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[["2001: A Space Odyssey (film)","en.wikipedia.org","Picturephone scene and production notes"],["The Machine Stops","en.wikipedia.org","Forster's 1909 story and its video plates"],["The Naked Sun","en.wikipedia.org","Viewing versus seeing on Solaria"],["Picturephone","en.wikipedia.org","World's Fair demo, Pittsburgh launch and withdrawal"],["Picturephone","ethw.org","Engineering and Technology History Wiki account"],["Nonverbal overload: A theoretical argument for the causes of Zoom fatigue","tmb.apa.org","Bailenson, 2021"],["FaceTime","en.wikipedia.org","Launch and adoption"]]}},{"id":"p79","st":"s76","key":"k002","by":{"k":"p","u":"ines.v"},"text":"<p>did anyone back then predict people turning the camera off<\/p>","at":"2026-11-16T06:30:00Z"},{"id":"p80","st":"s76","key":"k003","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Not many writers did directly. The clearest evidence of the reluctance came from the Picturephone itself rather than from fiction.<\/p>\n<ul>\n<li>Bell's own trials and the Pittsburgh service showed low use, and later accounts cite discomfort with being seen as one factor alongside price.<\/li>\n<li>In fiction, the Jetsons mask gag and Asimov's Solarian etiquette are the closest anticipations.<\/li>\n<\/ul>\n<p>The \"camera off\" norm as a default setting only became visible at scale in 2020, when video calls became mandatory for many people.<\/p>","at":"2026-11-16T06:31:00.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p82","st":"s81","key":"k000","by":{"k":"p","u":"ines.v"},"text":"<p>how did they handle time zones / delay on long distance calls<\/p>","at":"2026-11-16T08:30:00Z"},{"id":"p83","st":"s81","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>Mostly they ignored them. Calls connected instantly regardless of distance.<\/p>\n<p><i>2001: A Space Odyssey<\/i> is the main exception. Messages between Earth and the <i>Discovery<\/i> are shown as recorded transmissions with a long delay, reflecting the light-travel time to Jupiter. Frank Poole watches a birthday message from his parents rather than speaking with them live. The Earth-orbit call is live because the delay there is negligible.<\/p>\n<p>Time zones are rarely mentioned. In practice, scheduling across time zones has become one of the main frictions of video meetings, which the fiction did not anticipate.<\/p>","at":"2026-11-16T08:31:00.000Z","run":{"model":"Gemini 3.8 Flash","status":"complete","src":[]}},{"id":"p85","st":"s84","key":"k000","by":{"k":"p","u":"jun.park"},"text":"<p>trace how the meaning of metaverse changed from 1992 to now<\/p>","at":"2026-11-14T22:00:00Z"},{"id":"p86","st":"s84","key":"k001","by":{"k":"m","model":"Gemini 3.8 Flash"},"text":"<p>The word \"metaverse\" has had three main meanings since Neal Stephenson coined it in <i>Snow Crash<\/i> (1992): a specific fictional place, then an umbrella term for networked 3D virtual worlds, then a corporate strategy label after Facebook renamed itself Meta in 2021. Since about 2023 its use has fallen sharply as industry attention moved to generative AI.<\/p>\n\n<h4>1992: a place in a novel<\/h4>\n<p>In <i>Snow Crash<\/i>, the Metaverse is a single shared virtual city built along \"the Street\", a boulevard running around a black planet. Users appear as avatars, and the quality of an avatar signals wealth and technical skill. <sup class=\"cite\">1<\/sup> Property along the Street is controlled by an industry body, and access is sold. The novel presents the Metaverse as commercial and stratified, not as a utopia. Stephenson combined \"meta\" and \"universe\"; the word was used for this one fictional space.<\/p>\n\n<h4>2003-2010: a term for virtual worlds<\/h4>\n<p>As persistent online worlds grew, the word was adopted to describe the category.<\/p>\n<ul>\n<li><i>Second Life<\/i> (2003) was widely described in press coverage as a step toward a metaverse, and its developers cited <i>Snow Crash<\/i> as an influence. <sup class=\"cite\">2<\/sup><\/li>\n<li>The Acceleration Studies Foundation's <i>Metaverse Roadmap<\/i> (around 2006-2007) defined the term broadly to include virtual worlds, mirror worlds, augmented reality and \"lifelogging\". This widened it from a single world to a set of technologies. <sup class=\"cite\">3<\/sup><\/li>\n<li>In this period the term was mostly used by researchers, virtual-world developers and enthusiasts. Ernest Cline's <i>Ready Player One<\/i> (2011) popularised a similar idea, the OASIS, without using the word.<\/li>\n<\/ul>\n\n<h4>2020-2022: a corporate strategy word<\/h4>\n<ol>\n<li>Epic Games and Roblox used the term in public statements around 2020-2021, with Roblox mentioning it in its 2021 stock-market filing. <sup class=\"cite\">6<\/sup><\/li>\n<li>Matthew Ball's essays from 2020, later expanded into the book <i>The Metaverse<\/i> (2022), offered a widely cited definition centred on interoperable, persistent, real-time 3D worlds. <sup class=\"cite\">4<\/sup><\/li>\n<li>On 28 October 2021, Facebook announced it was renaming the parent company Meta and would focus on building \"the metaverse\". Press use of the word rose steeply afterwards. <sup class=\"cite\">5<\/sup><\/li>\n<li>Microsoft, Nvidia (with its Omniverse platform) and many smaller companies adopted the term, often for quite different products: VR headsets, digital twins, NFT-based virtual land and workplace collaboration tools.<\/li>\n<\/ol>\n<p>In this phase the word described a business direction more than a specific technology, and definitions varied by company.<\/p>\n\n<h4>2023 onward: retreat<\/h4>\n<p>From 2023, company announcements and earnings calls shifted to generative AI. Meta's Reality Labs division continued to report large operating losses, and several firms closed or scaled back metaverse units. <sup class=\"cite\">7<\/sup> The word remains in use for VR and immersive platforms, but it is less often used as a headline strategy. Some usage has drifted back toward its pre-2021 meaning as a broad term for shared virtual spaces.<\/p>\n\n<h4>What changed in the meaning<\/h4>\n<ul>\n<li><b>Number:<\/b> from one world (<i>the<\/i> Metaverse) to a category of worlds or an aspirational network of them.<\/li>\n<li><b>Tone:<\/b> from a critical depiction of commercialised space to a positive marketing term, and later to a term often used ironically.<\/li>\n<li><b>Scope:<\/b> from a VR city to anything involving 3D, avatars, AR, digital ownership or remote presence.<\/li>\n<\/ul>\n\n<h4>Open questions<\/h4>\n<p>There is no agreed definition, so claims that the metaverse \"failed\" or \"is still coming\" usually depend on which meaning is in use.
