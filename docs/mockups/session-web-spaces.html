/* Layout: a mock-control bar over one framed browser viewport that renders
   the Session Web pages. Colors are the desktop app's tokens
   (src/styles/tokens.css): the warm orange-blob theme, with
   dark and light appearance. Dark-first, like the app. */
:root {
  color-scheme: dark;
  --page: #121110; --chrome: #171716; --pane: #1c1b1a; --feed: #1a1918;
  --pop-btn: var(--control); --pop-btn-b: var(--control-border); --pop-btn-h: var(--control-hover); --pop-btn-c: var(--t-strong); --hsel-bg: var(--control); --hsel-fg: var(--t-secondary); --hsel-ring: transparent; --seg-on: #34312e; --seg-shadow: 0 1px 1px rgba(0,0,0,.3); --card: #222120; --card-sel: #2b2927; --inset: #1d1c19;
  --field: #232220; --popover: #23221f;
  --control: #282827; --control-hover: #313130; --control-border: #3d3d3c;
  --divider: #2d2d2c; --border-strong: #373634;
  --fill-subtle: rgba(255,255,255,.05); --fill-hover: rgba(255,255,255,.06);
  --border-subtle: rgba(255,255,255,.075);
  --accent: #33adff; --accent-soft: rgba(51,173,255,.13); --accent-strong: #268fd6; --on-accent: #0f1413;
  --t-heading: #f4f3ec; --t-strong: #f1f0e8; --t-primary: #e7e7e2; --t-body: #d9ddd9;
  --t-secondary: #c4cbc6; --t-tertiary: #aab1ad; --t-muted: #919994; --t-faint: #828b86;
  --t-dim: #5a615e; --placeholder: #6b726d;
  --warn: #d7a84f; --bad: #e0796d; --good: #81c784;
  --av1: #5b7a96; --av2: #8a6f9e; --av3: #6d8f6a; --av4: #a77b55; --av5: #4f8a8b; --av6: #9a6262;
  --av-fg: #f4f3ec;
  --shadow-pop: 0 10px 28px rgba(0,0,0,.5);
  --dash: color-mix(in srgb, var(--border-strong) 85%, var(--t-primary) 15%);

  /* Font sizes are 3% above the original scale, which suited Valley Sans better. */
  --font-ui: "Valley Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-xs: 11.85px; --fs-sm: 12.9px; --fs-base: 13.9px; --fs-input: 15.95px; --fs-title: 19.55px;
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px;
  --ease: 120ms ease;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --page: #e9e6e1; --chrome: #f4f2ef; --pane: #fcfbf9; --feed: #f8f6f3;
    --pop-btn: #faf9f7; --pop-btn-b: #ece8e3; --pop-btn-h: #f3f1ed; --pop-btn-c: var(--t-secondary); --hsel-bg: #ffffff; --hsel-fg: var(--t-heading); --hsel-ring: rgba(60,40,20,.10); --seg-on: #ffffff; --seg-shadow: 0 1px 2px rgba(60,40,20,.08), 0 0 0 1px rgba(60,40,20,.06); --card: #ffffff; --card-sel: #ebe7e1; --inset: #f5f2ee;
    --field: #ffffff; --popover: #ffffff;
    --control: #efece8; --control-hover: #e6e2dc; --control-border: #e0dbd4;
    --divider: #ebe7e2; --border-strong: #e1dcd6;
    --fill-subtle: rgba(0,0,0,.04); --fill-hover: rgba(0,0,0,.05); --border-subtle: rgba(0,0,0,.06);
    --accent: #0a6fb8; --accent-soft: rgba(11,127,209,.12); --accent-strong: #095c98; --on-accent: #ffffff;
    --t-heading: #121617; --t-strong: #15191a; --t-primary: #23282a; --t-body: #33393b;
    --t-secondary: #4a5350; --t-tertiary: #5c655f; --t-muted: #5b625e; --t-faint: #686e6b;
    --t-dim: #9aa19d; --placeholder: #8e958f;
    --warn: #9a6b12; --bad: #c0563f; --good: #2f8a4d;
    --av1: #4a6a86; --av2: #77598c; --av3: #557a52; --av4: #93663f; --av5: #3d7778; --av6: #8a4f4f;
    --av-fg: #ffffff; --shadow-pop: 0 10px 28px rgba(20,24,26,.16);
  --dash: color-mix(in srgb, #d2ccc5 85%, var(--t-primary) 15%);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --page: #e9e6e1; --chrome: #f4f2ef; --pane: #fcfbf9; --feed: #f8f6f3;
  --pop-btn: #faf9f7; --pop-btn-b: #ece8e3; --pop-btn-h: #f3f1ed; --pop-btn-c: var(--t-secondary); --hsel-bg: #ffffff; --hsel-fg: var(--t-heading); --hsel-ring: rgba(60,40,20,.10); --seg-on: #ffffff; --seg-shadow: 0 1px 2px rgba(60,40,20,.08), 0 0 0 1px rgba(60,40,20,.06); --card: #ffffff; --card-sel: #ebe7e1; --inset: #f5f2ee;
  --field: #ffffff; --popover: #ffffff;
  --control: #efece8; --control-hover: #e6e2dc; --control-border: #e0dbd4;
  --divider: #ebe7e2; --border-strong: #e1dcd6;
  --fill-subtle: rgba(0,0,0,.04); --fill-hover: rgba(0,0,0,.05); --border-subtle: rgba(0,0,0,.06);
  --accent: #0a6fb8; --accent-soft: rgba(11,127,209,.12); --accent-strong: #095c98; --on-accent: #ffffff;
  --t-heading: #121617; --t-strong: #15191a; --t-primary: #23282a; --t-body: #33393b;
  --t-secondary: #4a5350; --t-tertiary: #5c655f; --t-muted: #5b625e; --t-faint: #686e6b;
  --t-dim: #9aa19d; --placeholder: #8e958f;
  --warn: #9a6b12; --bad: #c0563f; --good: #2f8a4d;
  --av1: #4a6a86; --av2: #77598c; --av3: #557a52; --av4: #93663f; --av5: #3d7778; --av6: #8a4f4f;
  --av-fg: #ffffff; --shadow-pop: 0 10px 28px rgba(20,24,26,.16);
  --dash: color-mix(in srgb, #d2ccc5 85%, var(--t-primary) 15%);
}
:root[data-theme="dark"] { color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
:root { --mock-bg: #0c0c0c; }
:root[data-theme="light"] { --mock-bg: #ffffff; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --mock-bg: #ffffff; } }
body {
  background: var(--mock-bg); color: var(--t-primary);
  font-family: var(--font-ui); font-size: var(--fs-base); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.shell { font-family: var(--font-ui); background: var(--mock-bg); color: var(--t-primary); min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px; }
button { font: inherit; color: inherit; }
button, [role="tab"] { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- mock controls (outside the mock) ---------- */
.ctl { max-width: 1320px; margin: 0 auto 14px; display: flex; flex-direction: column; gap: 12px; }
.opt {
  text-align: left; border: 1px solid var(--divider); background: var(--chrome); border-radius: var(--r-lg);
  padding: 9px 11px; display: flex; flex-direction: column; gap: 2px; transition: border-color var(--ease), background var(--ease);
}
.opt:hover { border-color: var(--border-strong); }
.opt[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt b { font-weight: 650; color: var(--t-heading); font-size: var(--fs-base); }
.opt span { color: var(--t-muted); font-size: var(--fs-xs); line-height: 1.35; }
.opt kbd { font-size: 10.8px; color: var(--t-faint); }
.knobs { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.knob { display: flex; align-items: center; gap: 8px; }
.knob-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.knob > span { font-size: var(--fs-xs); color: var(--t-faint); text-transform: uppercase; letter-spacing: .06em; }
.seg { display: inline-flex; background: var(--control); border: 1px solid var(--control-border); border-radius: var(--r-md); padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 3px 9px; border-radius: var(--r-sm); font-size: var(--fs-sm); color: var(--t-secondary); }
.seg button:hover { color: var(--t-strong); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--t-heading); box-shadow: var(--seg-shadow); }
.note { max-width: 1320px; margin: 0 auto 12px; color: var(--t-secondary); font-size: var(--fs-sm); }
.note b { color: var(--t-strong); font-weight: 600; }

/* ---------- browser frame ---------- */
.frame { max-width: 1320px; margin: 0 auto; border: 1px solid var(--border-strong); border-radius: var(--r-xl); overflow: clip; background: var(--pane); box-shadow: var(--shadow-pop); }
.frame-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--page); border-bottom: 1px solid var(--divider); }
.dots { display: flex; gap: 6px; } .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--control-border); display: block; }
.url { flex: 1; min-width: 0; text-align: center; font-size: var(--fs-xs); color: var(--t-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app { min-height: 780px; background: var(--pane); color: var(--t-primary); position: relative; }

/* ---------- shared atoms ---------- */
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--t-heading); font-size: 15.45px; letter-spacing: -.01em; white-space: nowrap; }
.logo svg { width: 20px; height: 20px; flex: none; }
.logo small { font-weight: 500; color: var(--t-faint); font-size: var(--fs-sm); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--r-md);
  border: 1px solid var(--control-border); background: var(--control); color: var(--t-strong); font-size: var(--fs-sm); font-weight: 550; white-space: nowrap; transition: background var(--ease), border-color var(--ease); }
.btn:hover { background: var(--control-hover); }
.btn.primary { background: var(--t-heading); border-color: var(--t-heading); color: var(--popover); }
.btn.primary:hover { background: var(--t-strong); border-color: var(--t-strong); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--t-secondary); }
.btn.ghost:hover { background: var(--fill-hover); color: var(--t-strong); }
.btn.sm { height: 26px; padding: 0 9px; font-size: var(--fs-xs); }
.search { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: var(--r-md); background: var(--field); border: 1px solid var(--divider); color: var(--placeholder); font-size: var(--fs-sm); min-width: 0; }
.search svg { width: 14px; height: 14px; flex: none; }
.search kbd { margin-left: auto; font-size: 10.8px; color: var(--t-faint); border: 1px solid var(--divider); border-radius: 4px; padding: 0 4px; }
.av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font-size: 10.8px; font-weight: 700; color: var(--av-fg); letter-spacing: .02em; }
.av.lg { width: 32px; height: 32px; font-size: 12.35px; }
.av.sm { width: 20px; height: 20px; font-size: 9.25px; }
.glyph { width: 22px; height: 22px; border-radius: 6px; display: inline-grid; place-items: center; flex: none; font-weight: 700; font-size: 11.35px; color: var(--av-fg); }
.glyph.lg { width: 40px; height: 40px; border-radius: 10px; font-size: 17.5px; }
.glyph.xl { width: 52px; height: 52px; border-radius: 12px; font-size: 22.65px; }
.me { display: inline-flex; align-items: center; gap: 8px; padding: 3px 8px 3px 3px; border-radius: 999px; border: 1px solid var(--divider); background: var(--field); white-space: nowrap; }
.me b { font-weight: 600; font-size: var(--fs-sm); color: var(--t-strong); }
.me span:not(.av) { font-size: var(--fs-xs); color: var(--t-faint); }
.me svg { width: 10px; height: 10px; color: var(--t-faint); }
.acct { display: flex; align-items: center; gap: 6px; flex: none; }
.muted { color: var(--t-muted); } .faint { color: var(--t-faint); }
.eyebrow { font-size: 10.8px; text-transform: uppercase; letter-spacing: .08em; color: var(--t-faint); font-weight: 600; }
.hscroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.hscroll::-webkit-scrollbar { display: none; }

/* switcher popover */
.sw-wrap { position: relative; }
.sw-btn { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px 0 6px; border-radius: var(--r-md); border: 1px solid var(--divider); background: var(--field); color: var(--t-strong); font-weight: 600; font-size: var(--fs-sm); white-space: nowrap; }
.sw-btn:hover { border-color: var(--border-strong); }
.sw-btn svg { width: 10px; height: 10px; color: var(--t-faint); }
.sw-btn .glyph { width: 18px; height: 18px; border-radius: 5px; font-size: 9.25px; }
.sw-btn .sw-house { width: 15px; height: 15px; color: var(--t-secondary); margin-left: 2px; }
.sw-btn.on { background: var(--fill-subtle); border-color: var(--border-strong); }
.home-g { background: var(--control); color: var(--t-secondary); }
.home-g svg { width: 13px; height: 13px; }
.pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; width: 256px; max-width: 86vw; background: var(--popover); border: 1px solid var(--border-strong); border-radius: var(--r-lg); box-shadow: var(--shadow-pop); padding: 6px; }
.pop input { display: block; width: 100%; height: 30px; border-radius: var(--r-md); border: 1px solid var(--divider); background: var(--field); color: var(--t-primary); padding: 0 8px; font: inherit; font-size: var(--fs-sm); margin: 0 0 6px; }
.pop input:focus, .pop input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.pop input::placeholder { color: var(--placeholder); }
.pop .grp { padding: 6px 8px 3px; }
.pop-row { display: flex; align-items: center; gap: 9px; width: 100%; padding: 5px 8px; border: 0; background: transparent; border-radius: var(--r-md); text-align: left; }
.pop-row:hover { background: var(--fill-hover); }
.pop-row[aria-current="true"] { background: var(--accent-soft); }
.pop-row .nm { flex: 1; min-width: 0; font-size: var(--fs-sm); color: var(--t-strong); }
.pop-row .nm small { display: block; color: var(--t-faint); font-size: var(--fs-xs); }
.pop-foot { border-top: 1px solid var(--divider); margin-top: 4px; padding: 6px 4px 2px; display: flex; gap: 6px; }

/* composer */
.composer { display: flex; align-items: center; gap: 8px; background: var(--field); border: 1px solid var(--divider); border-radius: 999px; padding: 5px 5px 5px 16px; min-height: 44px; }
.composer .ph { flex: 1; min-width: 0; color: var(--placeholder); font-size: 14.95px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sortdd { position: relative; display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--t-faint); }
.sortdd > button { border: 0; background: transparent; padding: 0; color: var(--t-muted); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.sortdd > button:hover { text-decoration: underline; text-underline-offset: 3px; }
.sortdd > button svg { width: 9px; height: 9px; }
.sortdd .pop { width: 180px; top: calc(100% + 4px); }
.sortdd .pop-row { font-size: var(--fs-sm); color: var(--t-strong); justify-content: space-between; }
.sortdd .pop-row small { color: var(--t-faint); font-size: var(--fs-xs); }
.composer { width: 100%; text-align: left; cursor: text; color: inherit; font: inherit; }
.composer:hover { border-color: var(--border-strong); }
.composer.open { position: relative; flex-direction: column; align-items: stretch; gap: 6px; border-radius: 14px; padding: 11px 8px 8px 16px; cursor: auto; border-color: var(--border-strong); }
.composer textarea { border: 0; background: transparent; color: var(--t-primary); font: inherit; font-size: 14.95px; line-height: 1.45; resize: none; min-height: 22px; padding-right: 30px !important; padding: 0; outline: none; }
.composer textarea::placeholder { color: var(--placeholder); }
.composer.open:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--border-strong)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 8%, transparent); }
.composer:not(.open):focus-visible { outline: none; border-color: color-mix(in srgb, var(--accent) 45%, var(--border-strong)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 8%, transparent); }

/* ---------- meters ---------- */
.m-ok { --lvl: var(--accent); } .m-warn { --lvl: var(--warn); } .m-bad { --lvl: var(--bad); }
.mtr-donut { display: flex; align-items: center; gap: 12px; }
.mtr-donut .ring { position: relative; flex: none; }
.mtr-donut .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13.4px; font-weight: 650; color: var(--t-strong); }
.mtr-cap { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mtr-cap b { font-weight: 650; color: var(--t-strong); font-size: var(--fs-base); }
.mtr-cap span { color: var(--t-faint); font-size: var(--fs-xs); }
.track { stroke: var(--control); } .fillarc { stroke: var(--lvl); }
.bar { height: 6px; border-radius: 99px; background: var(--control); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--lvl); }
/* mini meters for strip items */
.mini-ring { flex: none; }

/* ---------- posts ---------- */
.feed { display: flex; flex-direction: column; gap: 10px; }
.meta { display: flex; align-items: center; gap: 7px; font-size: var(--fs-xs); color: var(--t-faint); min-width: 0; flex-wrap: wrap; }
.meta b { color: inherit; font-weight: 400; font-size: inherit; }
.kind { font-size: 10.3px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; background: var(--fill-subtle); color: var(--t-muted); }
.p-sum { margin: 0; color: var(--t-faint); font-size: var(--fs-base); line-height: 1.5; }
.p-sum b { color: inherit; font-weight: inherit; }
.p-foot { display: flex; align-items: center; gap: 14px; font-size: var(--fs-xs); color: var(--t-faint); flex-wrap: wrap; }
.p-foot span { display: inline-flex; align-items: center; gap: 4px; }
.p-foot svg { width: 13px; height: 13px; }
.p-foot .act { border: 0; background: transparent; padding: 0; color: var(--t-faint); display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); }
.p-foot .act:hover { color: var(--t-strong); }
.p-foot .act[aria-pressed="true"] { color: var(--t-secondary); }
.p-foot .act[aria-pressed="true"] svg { fill: currentColor; }
.p-foot .act[data-toggle="followed"][aria-pressed="true"] svg { fill: none; }
.p-foot .act[data-toggle="liked"][aria-pressed="true"] { color: var(--bad); }
.p-foot-end, .p-foot .p-foot-end { margin-left: auto; display: inline-flex; align-items: center; gap: 9px; }
button.tlink { border: 0; background: transparent; padding: 0; }
.tlink { color: var(--t-muted); font-size: var(--fs-sm); text-decoration: none; }
.tlink:hover { color: var(--t-strong); text-decoration: underline; text-underline-offset: 3px; }
.logo-btn { border: 0; background: transparent; padding: 4px; margin: -4px; border-radius: var(--r-md); display: inline-flex; }
.logo-btn:hover { background: var(--fill-hover); }
.hdr-right { display: flex; align-items: center; gap: 8px; flex: none; }
.hdr-right > .btn { padding: 0 10px 0 9px; color: var(--t-secondary); }
.hdr-right > .btn svg { width: 14px; height: 14px; }
.hdr-right > .btn .num { color: var(--t-strong); font-weight: 600; }
.tok { font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }

/* Plain posts (no agent ask): solid border 15% stronger than --border-strong
   (mixed 15% toward the primary text color). */

.p-foot .act-n { display: inline-flex; align-items: center; gap: 2px; }

.agent { width: 20px; height: 20px; border-radius: 5px; flex: none; background: var(--control); display: grid; place-items: center; color: var(--t-tertiary); }
.agent svg { width: 12px; height: 12px; }

/* ---------- wiki ---------- */
.wk h3 { margin: 0; font-size: var(--fs-sm); font-weight: 650; color: var(--t-heading); }
.wk p { margin: 0; color: var(--t-secondary); line-height: 1.55; }
.wk ol, .wk ul { margin: 0; padding-left: 18px; color: var(--t-secondary); display: flex; flex-direction: column; gap: 4px; }
.wk ol li::marker { color: var(--t-faint); font-variant-numeric: tabular-nums; }
.wk .links { list-style: none; padding: 0; gap: 2px; }
.wk .links a { display: flex; align-items: center; gap: 8px; padding: 4px 6px; margin: 0 -6px; border-radius: var(--r-md); text-decoration: none; color: var(--t-primary); }
.wk .links a:hover { background: var(--fill-hover); }
.wk .links svg { width: 13px; height: 13px; color: var(--t-faint); flex: none; }
.wk .links small { margin-left: auto; color: var(--t-faint); font-size: var(--fs-xs); }
.mods { display: flex; flex-direction: column; gap: 6px; }
.mods div { display: flex; align-items: center; gap: 8px; font-size: var(--fs-sm); }
.mods small { color: var(--t-faint); margin-left: auto; font-size: var(--fs-xs); }
.edited { font-size: var(--fs-xs); color: var(--t-faint); }

/* ================= Option A: strip + sidebar ================= */
.A .hdr { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--chrome); border-bottom: 1px solid var(--divider); }
.A .hdr .search { flex: 1; max-width: 360px; margin-left: auto; }
.A .strip { display: flex; align-items: center; gap: 10px; padding: 8px 20px; border-bottom: 1px solid var(--divider); background: var(--chrome); }
.A .strip .eyebrow { flex: none; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px 0 6px; border-radius: 999px; border: 1px solid var(--divider); background: var(--pane); color: var(--t-secondary); font-size: var(--fs-sm); font-weight: 550; white-space: nowrap; flex: none; transition: border-color var(--ease), background var(--ease); }
.chip:hover { border-color: var(--border-strong); color: var(--t-strong); }
.chip[aria-current="true"] { border-color: var(--accent); color: var(--t-strong); background: var(--accent-soft); }
.chip .glyph { width: 20px; height: 20px; border-radius: 50%; font-size: 9.8px; }
.chip small { color: var(--t-faint); font-size: var(--fs-xs); font-weight: 500; }
.A .body { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 28px; padding: 22px 28px 40px; background: var(--feed); }
.A .main { display: flex; flex-direction: column; gap: 16px; max-width: 640px; width: 100%; justify-self: center; }
.A .sort { display: flex; gap: 4px; }


/* ================= Option C: banner ================= */
.C .hdr { display: flex; align-items: center; gap: 16px; padding: 0 24px; height: 50px; background: var(--chrome); border-bottom: 1px solid var(--divider); }
.C .hdr .hscroll { flex: 1; gap: 2px; }
.utab { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: var(--r-md); background: transparent; color: var(--t-muted); font-weight: 550; white-space: nowrap; flex: none; font-size: var(--fs-sm); }
.utab:hover { background: var(--fill-hover); color: var(--t-strong); }
.utab[aria-current="true"] { background: var(--fill-subtle); color: var(--t-heading); }
.banner { position: relative; padding: 26px 32px 22px; background:
  radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--sp) 26%, transparent), transparent 60%),
  var(--pane); border-bottom: 1px solid var(--divider); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: start; }
.banner > .glyph { position: relative; top: 3px; }
.banner-acts { display: flex; align-items: center; gap: 6px; align-self: center; }
.banner h2 { margin: 0; font-size: 22.65px; letter-spacing: -.02em; color: var(--t-heading); font-weight: 750; }
.banner p { margin: 4px 0 8px; color: var(--t-secondary); max-width: 62ch; }
.banner .row { display: flex; gap: 14px; align-items: center; font-size: var(--fs-xs); color: var(--t-faint); flex-wrap: wrap; }
.banner .row b { color: var(--t-strong); font-weight: 650; font-size: var(--fs-sm); }
.C .main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.doc { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 18px; }
.doc section { display: flex; flex-direction: column; gap: 8px; }
.doc h3 { font-size: var(--fs-base); }

/* ================= Option A: flush sidebar ================= */
.Af .body { grid-template-columns: minmax(0, 1fr) auto; gap: 0; padding: 0; }
.mcol { min-width: 0; display: flex; flex-direction: column; }
.mcol > .main { align-self: center; }
.Af .main { padding: 22px 28px 40px; max-width: 696px; }
.drawer { position: sticky; top: 0; align-self: stretch; }
.drawer { width: 320px; border-left: 1px solid var(--divider); background: var(--pane); display: flex; flex-direction: column; }
.drawer.closed { width: 48px; align-items: center; }
.drawer .dh { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--divider); }
.drawer.closed .dh { padding: 12px 0; border: 0; flex-direction: column; }
.drawer .dbody { padding: 16px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.drawer .note-card { border-top: 1px solid var(--divider); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.sk-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.skills svg { width: 14px; height: 14px; flex: none; }
/* list: menu-like rows with the template as a hint */
.sk-list { display: flex; flex-direction: column; margin: 0 -8px; }
.sk-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 8px; border-radius: var(--r-md); }
.sk-row:hover { background: var(--fill-hover); }
.sk-ic { width: 26px; height: 26px; flex: none; border-radius: 7px; background: var(--control); display: grid; place-items: center; color: var(--t-tertiary); }
.sk-tx { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.sk-tx b { font-weight: 550; color: var(--t-strong); font-size: var(--fs-sm); }
.sk-tx small { color: var(--t-faint); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sk-row .sk-go { width: 10px; height: 10px; color: var(--t-dim); transform: rotate(-90deg); opacity: 0; transition: opacity var(--ease); }
.sk-row:hover .sk-go { opacity: 1; }
.drawer .note-card:first-child { border: 0; padding-top: 0; }
.iconbtn { width: 28px; height: 28px; border-radius: var(--r-md); border: 0; background: transparent; color: var(--t-muted); display: grid; place-items: center; }
.iconbtn:hover { background: var(--fill-hover); color: var(--t-strong); }
.iconbtn svg { width: 15px; height: 15px; }
.vlabel { writing-mode: vertical-rl; font-size: var(--fs-xs); color: var(--t-faint); letter-spacing: .08em; text-transform: uppercase; margin-top: 8px; }

/* ================= Home ================= */
.sp-tag { border: 0; background: var(--fill-subtle); color: var(--t-tertiary); font-size: var(--fs-xs); font-weight: 550; padding: 1px 7px; border-radius: 999px; }
.sp-tag:hover { background: var(--fill-hover); color: var(--t-strong); }
.home-head { display: flex; flex-direction: column; gap: 2px; }
.home-head h2 { margin: 0; font-size: 22.65px; font-weight: 700; letter-spacing: -.01em; color: var(--t-heading); }
.home-head p { margin: 0; color: var(--t-muted); }
.H .home-feed { display: grid; grid-template-columns: minmax(0, 1fr) 300px; background: var(--feed); min-height: 727px; }
.H .home-feed .main { padding: 26px 28px 40px; }
.home-side { width: auto; }
.sp-rows { display: flex; flex-direction: column; margin: 0 -8px; }
.sp-row { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; padding: 6px 8px; border-radius: var(--r-md); color: var(--t-primary); font-size: var(--fs-sm); text-align: left; }
.sp-row:hover { background: var(--fill-hover); }
.sp-row > span:not(.glyph) { flex: 1; }
.sp-row small { color: var(--t-faint); font-size: var(--fs-xs); }

.n-grp-f { margin: 6px 16px 0; font-size: 13.4px; color: var(--t-faint); }
.n-list { background: var(--n-cell); border-radius: 12px; overflow: clip; }
.n-scr:has(.n-grp) { background: var(--n-grp-bg); }
.n-scr:has(.n-grp) .n-bar, .n-scr:has(.n-grp) ~ .n-tabbar { --n-bar-bg: color-mix(in srgb, var(--page) 82%, transparent); }
.n-under:has(.n-scr .n-grp) .n-status { background: var(--page); }
.n-row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px; padding: 8px 16px; background: none; border: 0; font: inherit; color: inherit; text-align: left; }
.n-row + .n-row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--n-sep); }
.n-row:has(.glyph, .n-av, .n-src-n) + .n-row::before { left: 60px; }
button.n-row:active { background: var(--n-fill); }
.n-row-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; background: none; border: 0; padding: 0; font: inherit; color: inherit; text-align: left; }
.n-row-b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.n-row-b b { font-weight: 400; color: var(--t-heading); font-size: 16.5px; }
.n-row-b small { font-size: 13.4px; color: var(--t-faint); }
.n-row-b span { font-size: 15.45px; color: var(--t-primary); }
.n-val { color: var(--t-faint); font-size: 16.5px; white-space: nowrap; }
.n-chev { color: var(--t-dim); display: inline-flex; margin-right: -4px; }
.n-chev svg { width: 16px; height: 16px; }
.n-check { color: var(--n-tint); font-weight: 600; }
.n-danger b, .n-red { color: var(--bad) !important; }
.n-bad { color: var(--bad) !important; }
.n-add { color: var(--n-tint); }

.n-add b { color: var(--n-tint) !important; }
.n-gl { width: 32px; height: 32px; border-radius: 8px; font-size: 14.4px; flex: none; }
.n-gl-xl { width: 64px; height: 64px; border-radius: 16px; font-size: 26.8px; }
.n-grip { color: var(--t-dim); display: inline-flex; }
.n-grip svg { width: 22px; height: 22px; }
.n-cap { flex: none; height: 30px; padding: 0 14px; border-radius: 15px; border: 0; background: var(--n-fill); color: var(--n-tint); font: inherit; font-size: 14.4px; font-weight: 600; }
.n-capbtn { height: 34px; padding: 0 18px; border-radius: 17px; border: 0; background: var(--t-heading); color: var(--popover); font: inherit; font-size: 15.45px; font-weight: 600; }
.n-capbtn.ghost { background: var(--n-fill); color: var(--t-heading); }
.n-capbtn.wide { width: 100%; height: 50px; border-radius: 14px; font-size: 17.5px; }
/* space header */
.n-sphead { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 8px 24px 20px; }
.n-sphead h2 { margin: 6px 0 0; font-size: 22.65px; font-weight: 700; color: var(--t-heading); }
.n-sphead p { margin: 0; color: var(--t-secondary); font-size: 15.45px; }
.n-sphead-m { display: flex; gap: 14px; font-size: 13.4px; color: var(--t-faint); margin-bottom: 8px; }
/* thread */
.n-th { padding: 8px 16px 20px; }
.n-th-by { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.n-th-by b { display: block; font-size: 15.45px; color: var(--t-heading); }
.n-th-by small { font-size: 13.4px; color: var(--t-faint); }
.n-th-ask { font-size: 19.55px; line-height: 1.35; font-weight: 600; color: var(--t-heading); margin: 0 0 14px; }
.n-th-post { font-size: 17.5px; line-height: 1.45; color: var(--t-heading); margin: 0 0 18px; }
.n-ans { font-size: 16.5px; line-height: 1.5; color: var(--t-body); padding-top: 10px; }
.n-ans p { margin: 0 0 12px; }
.n-ans h3, .n-ans h4 { font-size: 17.5px; color: var(--t-heading); margin: 18px 0 8px; }
.n-ans ul, .n-ans ol { padding-left: 20px; margin: 0 0 12px; }
.n-ans li { margin-bottom: 6px; }
.n-ans table { display: block; overflow-x: auto; font-size: 14.4px; border-collapse: collapse; }
.n-ans td, .n-ans th { padding: 4px 8px; border-bottom: .5px solid var(--n-sep); }
.n-th .n-grp { margin: 18px 0 18px; }
.n-th .n-grp-h { margin-left: 0; }
.n-src-n { width: 22px; height: 22px; border-radius: 6px; background: var(--n-fill); display: grid; place-items: center; font-size: 12.35px; color: var(--t-secondary); flex: none; align-self: flex-start; margin-top: 2px; }
.n-src .n-row-b b { font-size: 15.45px; }
.n-sec { font-size: 20.6px; font-weight: 700; color: var(--t-heading); margin: 22px 0 6px; }
.n-fu { padding: 12px 0; border-bottom: .5px solid var(--n-sep); }
.n-fu .n-cell-h { align-items: center; gap: 8px; }
.n-fu-q { margin: 8px 0 4px; font-weight: 600; color: var(--t-heading); }
.n-fu-a { margin: 0; color: var(--t-body); font-size: 15.45px; }
.n-reply { display: flex; gap: 10px; padding: 12px 0; border-bottom: .5px solid var(--n-sep); }
.n-reply > div { flex: 1; min-width: 0; }
.n-reply p { margin: 3px 0 0; font-size: 15.45px; }
.n-reply.kid { border: 0; padding-bottom: 0; }
.n-chat { display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
.n-msg-u { align-self: flex-end; max-width: 82%; background: var(--n-fill); border-radius: 18px 18px 6px 18px; padding: 8px 13px; }
.n-msg-u small { display: block; font-size: 12.35px; color: var(--t-faint); }

.n-msg-a { display: flex; gap: 10px; }
.n-msg-a .n-spark { width: 28px; height: 28px; }
.n-msg-a .n-ans { padding-top: 3px; flex: 1; min-width: 0; }
/* docked input */
.n-dock { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px 36px; background: var(--n-bar-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-top: .5px solid var(--n-sep); }
.n-dock-f { flex: 1; display: flex; align-items: center; min-height: 38px; padding: 0 14px; border-radius: 19px; border: .5px solid var(--border-strong); background: var(--n-cell); font: inherit; text-align: left; color: var(--t-faint); font-size: 16.5px; }
.n-dock-f input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 16.5px; color: var(--t-primary); outline: none; }
.n-dock-f input::placeholder { color: var(--t-faint); }
.n-send { width: 34px; height: 34px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--t-heading); color: var(--popover); flex: none; }
.n-send svg { width: 18px; height: 18px; }
.n-send:disabled { background: var(--n-fill); color: var(--t-dim); }
/* you */
.n-me { display: flex; align-items: center; gap: 14px; margin: 0 16px 24px; padding: 14px 16px; border-radius: 12px; background: var(--n-cell); }
.n-me b { display: block; font-size: 19.55px; color: var(--t-heading); }
.n-me small { font-size: 14.4px; color: var(--t-faint); }
.n-out { margin: 4px 16px 24px; padding: 18px 16px; border-radius: 12px; background: var(--n-cell); text-align: center; }
.n-out p { margin: 0 0 14px; color: var(--t-secondary); font-size: 15.45px; }
/* sheets */
.n-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); z-index: 20; animation: n-fade .2s; }
.n-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--pane); border-radius: 14px 14px 0 0; display: flex; flex-direction: column; animation: n-up .28s cubic-bezier(.2,.8,.2,1); }
.n-sheet.n-page { top: 58px; }
.n-sheet.n-det { padding: 6px 20px 44px; border-radius: 22px 22px 0 0; }
.n-sheet.n-det.tall { top: 120px; padding: 6px 0 0; }
.n-sheet:has(.n-grp) { background: var(--page); }
.n-grab { display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--t-dim); margin: 0 auto 10px; }
.n-sheet-t { font-size: 20.6px; font-weight: 700; color: var(--t-heading); text-align: center; margin: 6px 0 18px; }
.n-sheet-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 56px; padding: 0 8px; flex: none; }
.n-sheet-bar > :first-child { justify-self: start; }
.n-sheet-bar > :last-child { justify-self: end; }
.n-sheet-bar > b { font-size: 17.5px; font-weight: 600; color: var(--t-heading); }
.n-sheet-sc { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding-bottom: 40px; }
.n-draft { display: block; width: calc(100% - 32px); margin: 4px 16px 20px; min-height: 160px; border: 0; border-radius: 12px; background: var(--n-cell); padding: 12px 14px; font: inherit; font-size: 17.5px; line-height: 1.4; color: var(--t-heading); resize: none; outline: none; }
.n-draft::placeholder { color: var(--t-faint); }
.n-field span { width: 64px; flex: none; color: var(--t-heading); }
.n-field input { flex: 1; min-width: 0; border: 0; background: none; font: inherit; font-size: 16.5px; color: var(--t-heading); outline: none; }
.n-field input::placeholder { color: var(--t-faint); }
.n-xbtn { width: 100%; height: 52px; border-radius: 14px; border: 0; background: var(--t-heading); color: var(--popover); font: inherit; font-size: 17.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; }
.n-xbtn svg { width: 17px; height: 17px; }
.n-fine { text-align: center; font-size: 13.4px; color: var(--t-faint); margin: 12px 0 0; }
.n-wk-d { margin: 0 16px 20px; color: var(--t-secondary); font-size: 15.45px; }
/* action sheet */
.n-act { position: absolute; left: 8px; right: 8px; bottom: 30px; z-index: 21; display: flex; flex-direction: column; gap: 8px; animation: n-up .25s cubic-bezier(.2,.8,.2,1); }
.n-act-g { background: color-mix(in srgb, var(--popover) 94%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 14px; overflow: clip; }
.n-act-g > * + * { border-top: .5px solid var(--n-sep); }
.n-act-h { padding: 14px 16px; text-align: center; }
.n-act-h b { display: block; font-size: 13.4px; color: var(--t-secondary); font-weight: 600; }
.n-act-h p { margin: 2px 0 0; font-size: 13.4px; color: var(--t-faint); }
.n-act-g button { display: block; width: 100%; height: 56px; border: 0; background: none; font: inherit; font-size: 19.55px; color: var(--n-tint); }
.n-act-c { font-weight: 600 !important; }
@keyframes n-up { from { transform: translateY(100%); } }
@keyframes n-fade { from { opacity: 0; } }
/* user menu trigger: same tint as the header menu triggers */
.hdr .acct > .me { background: var(--control); border-color: var(--control-border); }
.hdr .acct > .me:hover { background: var(--control-hover); }
/* mock reset */
.seg .k-reset { display: inline-grid; place-items: center; width: 28px; padding: 0; color: var(--t-secondary); cursor: pointer; }
.seg .k-reset:hover { color: var(--t-heading); background: var(--control-hover); }
.k-reset svg { width: 15px; height: 15px; }
.k-inner { display: contents; }
.k-sep { width: 1px; align-self: stretch; margin: 3px 2px; background: var(--control-border); }

/* ---------- responsive ---------- */

@media (max-width: 920px) {
  .A .body { grid-template-columns: minmax(0, 1fr); }

  .banner { grid-template-columns: auto minmax(0, 1fr); }

}

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ================= redesign (fable-3) ================= */
.knob.k-dir .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.fbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.fbar .sortdd .pop { left: auto; right: 0; }
.fempty { margin: 0; padding: 20px 0; }
.row-ask .agent, .tr .agent, .c2-mode .agent { background: var(--accent-soft); color: var(--accent); }


/* feed: dense rows */
.rows { display: flex; flex-direction: column; border: 1px solid var(--border-subtle); border-radius: var(--r-xl); background: var(--card); overflow: hidden; }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 0 12px; padding: 11px 14px; border-top: 1px solid var(--divider); cursor: pointer; align-items: start; }
.row:first-child { border-top: 0; }
.row:hover { background: color-mix(in srgb, var(--fill-hover) 45%, transparent); }
/* Plain feed rows: no card, outline, dividers or row padding; space between items separates them. */
.rows-plain { border: 0; border-radius: 0; background: none; overflow: visible; gap: 22px; margin-top: 4px; }
.rows-plain .row { padding: 0; border-top: 0; }
.rows-plain .row:hover { background: none; }
.rows-plain .row:hover .row-t { color: var(--t-heading); }
.rows-plain .row:has(.row-link:focus-visible) { outline-offset: 4px; }
.row-k { padding-top: 1px; display: grid; place-items: center; }
.row-link { color: inherit; text-decoration: none; }
.row-link:focus-visible { outline: none; }
:is(.row, .sv-row):has(.row-link:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: var(--r-md); }
.row-m { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-t { color: var(--t-heading); font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.row-post .row-t { font-weight: 450; color: var(--t-primary); }
.row-s { color: var(--t-muted); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-s:empty { display: none; }
.row-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--t-faint); margin-top: 3px; }
/* Footer and meta lines: author, time, space and counts all share the timestamp's size, weight and color. */
.meta .au, .row-meta .au { font-size: var(--fs-xs); font-weight: 400; color: var(--t-faint); }
.meta .au:hover, .row-meta .au:hover { color: var(--t-strong); }
.row-n { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-sm); color: var(--t-secondary); font-weight: 400; padding-top: 1px; min-width: 38px; justify-content: flex-end; }
.row-n svg { width: 13px; height: 13px; color: var(--t-faint); }

/* composer: one step, kind and token source inline */
.c2-closed { justify-content: space-between; }
.composer.c2 { padding: 10px 10px 10px 14px; gap: 10px; border-radius: 14px; }
.c2-mode button { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.c2-mode svg { width: 12px; height: 12px; }

.c2-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.c2-bar .grow { flex: 1; }
.c2-note { font-size: var(--fs-xs); color: var(--t-faint); }
.c2-note.warn { color: var(--warn); }
.c2-bar .btn[disabled] { opacity: .5; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--control-border); background: var(--control); color: var(--t-secondary); font-size: var(--fs-sm); font-weight: 550; white-space: nowrap; max-width: 100%; min-width: 0; }
.chip:hover { background: var(--control-hover); color: var(--t-strong); }
.chip svg { width: 13px; height: 13px; flex: none; }
.chip.dd > svg:last-child { width: 9px; height: 9px; color: var(--t-faint); }
.chip .glyph { width: 16px; height: 16px; border-radius: 4px; font-size: 8.75px; }
.chip .ts-ic { width: 16px; height: 16px; background: transparent; }
.chip.on { color: var(--t-strong); }
.chip.off { color: var(--t-faint); border-style: dashed; background: transparent; }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--control-border)); }
.chip > span { overflow: hidden; text-overflow: ellipsis; }

/* thread: report */
.tr { display: grid; grid-template-columns: minmax(0, 1fr) 248px; gap: 44px; padding: 24px 40px 56px; max-width: 1080px; margin: 0 auto; }
.cite { display: inline-grid; place-items: center; min-width: 15px; height: 15px; font-size: 10.3px; font-weight: 600; color: var(--t-muted); background: var(--fill-subtle); border-radius: 4px; padding: 0 3px; margin-left: 3px; vertical-align: middle; position: relative; top: -1px; line-height: 1; font-variant-numeric: tabular-nums; }
.fq { padding: 14px 0; border-top: 1px solid var(--divider); display: flex; flex-direction: column; gap: 6px; }
.fq-q { margin: 0; font-weight: 600; color: var(--t-strong); font-size: var(--fs-input); line-height: 1.45; }
.fq-a { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; margin-top: 2px; }
.fq-a p { margin: 0 0 3px; color: var(--t-body); line-height: 1.6; }
@media (max-width: 920px) { .tr { grid-template-columns: minmax(0, 1fr); gap: 20px; } }

@media (max-width: 640px) { .tr { padding: 18px 14px 40px; } }

/* shell: left rail */
.rs { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 780px; }
.rs-main { min-width: 0; background: var(--feed); }
.rail { background: var(--chrome); border-right: 1px solid var(--divider); padding: 14px 10px 12px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.rl-logo { align-self: flex-start; margin: 0 0 0 2px; padding: 4px 6px; }
.rl-sec { display: flex; flex-direction: column; gap: 1px; }
.rl-h { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 5px; }
.rl-h .tlink { font-size: var(--fs-xs); }
.rl-row { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 8px; border: 0; background: transparent; border-radius: var(--r-md); color: var(--t-secondary); font-size: var(--fs-base); font-weight: 500; text-align: left; width: 100%; }
.rl-row:hover { background: var(--fill-hover); color: var(--t-strong); }
.rl-row[aria-current="true"] { background: var(--card-sel); color: var(--t-heading); font-weight: 600; }
.rl-row > svg { width: 16px; height: 16px; margin: 0 3px; flex: none; color: var(--t-muted); }
.rl-n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rl-c { font-size: var(--fs-xs); color: var(--t-faint); }
.rl-row .mini-ring { display: inline-grid; }

.rl-acct { position: relative; flex-direction: column; align-items: stretch; }
.rl-acct .me { width: 100%; border-radius: var(--r-md); border-color: transparent; background: transparent; padding: 5px 8px 5px 5px; }
.rl-acct .me:hover { background: var(--fill-hover); }
.rl-acct .me svg { margin-left: auto; transform: rotate(180deg); }
.rl-acct .pop.um { top: auto; bottom: calc(100% + 6px); left: 0; right: auto; }
.rl-out { display: flex; gap: 6px; }
.rl-out .btn { flex: 1; }
@media (min-width: 921px) {
  .rs .hdr { display: none; }
  .rs .home-side { display: none; }
  .rs .H .home-feed { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 920px) { .rs { grid-template-columns: minmax(0, 1fr); } .rail { display: none; } }

/* home: ask-first */
.how { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; counter-reset: h; }
.how li { counter-increment: h; background: var(--card); border: 1px solid var(--border-subtle); border-radius: var(--r-lg); padding: 12px 14px; font-size: var(--fs-sm); color: var(--t-muted); line-height: 1.5; }
.how li b { display: block; color: var(--t-strong); font-weight: 650; margin-bottom: 2px; }
.how li::before { content: counter(h); display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 11.35px; font-weight: 700; margin-bottom: 8px; }
@media (max-width: 640px) { .how { grid-template-columns: minmax(0, 1fr); } }

.utab.utab-home svg { width: 14px; height: 14px; }
.hdr-sep { width: 1px; height: 18px; background: var(--divider); flex: none; align-self: center; margin: 0 4px; }

/* left rail variants */
@media (min-width: 921px) {
  .rs.rs-c { grid-template-columns: 64px minmax(0, 1fr); }
  .rs.rs-2 { grid-template-columns: 296px minmax(0, 1fr); }
  .rail-2 { display: grid; }

function pinwheel(n) {
  const cx = 50, steps = 28, sweep = 115 * Math.PI / 180, r0 = 13, r1 = 47;
  const peak = Math.pow(0.381, 0.8) * Math.pow(0.619, 1.3);
  const maxW = Math.min(24, 92 / n);
  let out = '';
  for (let k = 0; k < n; k++) {
    const a0 = -Math.PI / 2 + k * 2 * Math.PI / n;
    const pt = t => { const r = r0 + (r1 - r0) * t, a = a0 + sweep * Math.pow(t, 1.45); return [cx + r * Math.cos(a), cx + r * Math.sin(a)]; };
    const L = [], R = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps, [x, y] = pt(t), [x2, y2] = pt(Math.min(1, t + 0.01)), [x1, y1] = pt(Math.max(0, t - 0.01));

      L.push([x - dy * w, y + dx * w]); R.push([x + dy * w, y - dx * w]);
    }

  }

const headerSpaces = () => { const order = st.tabOrder.length ? st.tabOrder : topSpaces().map(x => x.id); return order.map(sp).filter(x => x && !st.tabHidden.has(x.id)); };

const GRIP = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><circle cx="6" cy="4" r="1.1"/><circle cx="10" cy="4" r="1.1"/><circle cx="6" cy="8" r="1.1"/><circle cx="10" cy="8" r="1.1"/><circle cx="6" cy="12" r="1.1"/><circle cx="10" cy="12" r="1.1"/></svg>';
let dragId = null;
document.addEventListener('dragstart', e => { const r = e.target.closest && e.target.closest('[data-drag]'); if (!r) return; dragId = r.dataset.drag; r.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (x) {} });
document.addEventListener('dragover', e => { const r = e.target.closest && e.target.closest('[data-drag]'); if (!r || !dragId) return; e.preventDefault(); const b = r.getBoundingClientRect(); document.querySelectorAll('.drop-a, .drop-b').forEach(x => x.classList.remove('drop-a', 'drop-b')); if (r.dataset.drag !== dragId) r.classList.add(e.clientY < b.top + b.height / 2 ? 'drop-a' : 'drop-b'); });
document.addEventListener('drop', e => { const r = e.target.closest && e.target.closest('[data-drag]'); if (!r || !dragId) return; e.preventDefault(); const ids = st.tabOrder.length ? [...st.tabOrder] : topSpaces().map(x => x.id); const after = r.classList.contains('drop-b'); const from = ids.indexOf(dragId); ids.splice(from, 1); let to = ids.indexOf(r.dataset.drag); if (after) to++; ids.splice(to, 0, dragId); st.tabOrder = ids; dragId = null; renderAll(); });

RICH[0] = `<p>Science fiction rarely uses the term "intention marketplace", but many works describe systems that make what people want, plan or believe visible to others and then price, rank or match it. The examples fall into four mechanisms: reputation ledgers, prediction and decision markets, attention auctions, and agent-brokered matching. The list below covers the clearest cases; the full scan found 31 works published between 1953 and 2024. <sup class="cite">5</sup></p>

<h4>Reputation ledgers</h4>
<p>In these systems, a public score records how others regard a person's past actions and stated aims. The score works as a currency, or replaces one, but it is earned rather than transferred.</p>
<ul>
<li><i>Down and Out in the Magic Kingdom</i> (Cory Doctorow, 2003). Whuffie is a continuously updated esteem score that replaces money in the post-scarcity Bitchun Society. People can see it but cannot spend it directly. <sup class="cite">1</sup></li>
<li><i>Accelerando</i> (Charles Stross, 2005). Reputation markets and agent-run economies come before "Economics 2.0", a later phase that unaugmented humans cannot follow. <sup class="cite">2</sup></li>
<li><i>Daemon</i> (2006) and <i>Freedom</i> (2010) by Daniel Suarez. A darknet assigns levels and reputation scores, and tasks are given out according to rank.</li>
<li>"Nosedive" (<i>Black Mirror</i>, 2016). Peer ratings decide access to housing, travel and social standing. It is a satire of rating platforms more than an economic model.</li>
</ul>

<h4>Prediction and decision markets</h4>
<p>These works pool beliefs about future events by having people bet on them. Some of them then make decisions from the resulting prices.</p>
<ul>
<li><i>The Shockwave Rider</i> (John Brunner, 1975). "Delphi pools" collect public wagers on questions and serve as a forecasting tool. The novel treats them as open to manipulation. <sup class="cite">3</sup></li>
<li><i>Infomocracy</i> (Malka Older, 2016). This novel is about micro-democracy and a global information utility rather than a betting market. It is included because voter preferences become a contested, aggregated signal.</li>
<li>Robin Hanson's futarchy proposal ("Shall We Vote on Values, But Bet on Beliefs?") is non-fiction. It is often cited next to these works as the clearest statement of a decision market. <sup class="cite">4</sup></li>
</ul>

<h4>Attention auctions and advertising</h4>
<p>The earliest examples are satires in which advertisers buy, shape or require consumer intent.</p>
<ul>
<li><i>The Space Merchants</i> (Frederik Pohl and C. M. Kornbluth, 1953 in book form). Advertising agencies run the world's political economy. <sup class="cite">5</sup></li>
<li>"The Midas Plague" (Frederik Pohl, 1954). Rationed consumption is a legal duty, which reverses the usual direction of demand.</li>
<li><i>The Circle</i> (Dave Eggers, 2013). Total transparency and engagement metrics turn personal preference into platform inventory.</li>
</ul>

<h4>Agent-brokered matching</h4>
<p>Here a networked system or a personal agent reads what people need and routes favours, tasks or trades between them.</p>
<ul>
<li>"Maneki Neko" (Bruce Sterling, 1998). A pocket device instructs its owner to do small favours for strangers and receives favours in return from a hidden gift-economy network. This story is the closest match to an intention network in the strict sense. <sup class="cite">6</sup></li>
<li><i>Rainbows End</i> (Vernor Vinge, 2006). Characters take paid micro-tasks from distributed, partly anonymous employers through wearable computing.</li>
<li><i>The Quantum Thief</i> (Hannu Rajaniemi, 2010). In the Oubliette, Time is a currency, and gevulot controls what each person shares with others.</li>
<li><i>Walkaway</i> (Cory Doctorow, 2017). Coordination software matches volunteers to work in a post-scarcity commons without prices.</li>
</ul>

<h4>Where the term comes from</h4>
<p>"Intention economy" comes from Doc Searls, who used it in a 2006 essay and later in <i>The Intention Economy</i> (2012). He described a market in which buyers announce their intentions and vendors respond, the reverse of attention-based advertising. <sup class="cite">7</sup> Most of the fiction above predates the term or does not use it, so the grouping here is by mechanism and not by vocabulary.</p>

<h4>Limits</h4>
<ul>
<li>The scan covered English-language works and works widely available in English translation.</li>
<li>Some inclusions are judgment calls. <i>Infomocracy</i> and <i>The Circle</i> deal with aggregated preference but have no market in the strict sense.</li>
<li>Short fiction from magazines and anthologies is under-represented compared with novels.</li>
</ul>`;

RICH[2] = `<p>Sweden switched from left-hand to right-hand traffic at 05:00 on Sunday 3 September 1967. Four years of planning by a state commission led up to the switch, and non-essential traffic was stopped from 01:00 to 06:00 so that it could happen. Accident numbers fell after the change and then returned to their earlier trend within roughly two years.</p>

<h4>Why Sweden switched</h4>
<p>Sweden drove on the left even though its land neighbours, Norway and Finland, drove on the right. Most Swedish cars were already left-hand drive, because they were imported or built to the same layout as cars in right-hand-traffic countries. Overtaking on two-lane roads was therefore harder, since the driver sat on the kerb side. In a 1955 referendum a large majority, commonly reported as about 83 percent, voted to keep left-hand traffic. The Riksdag passed the change anyway in 1963, and the switch date was set for 1967. <sup class="cite">1</sup><sup class="cite">2</sup></p>

<h4>Planning and public information</h4>
<p>The Riksdag created a dedicated body, Statens högertrafikkommission (the State Commission for Right-Hand Traffic), to run the transition. Its work included: <sup class="cite">3</sup></p>
<ul>
<li>A public information campaign that ran for several years. It used a logo of the letter H with an arrow, printed on items ranging from milk cartons to underwear. <sup class="cite">4</sup></li>
<li>A song competition. Its best-known entry was "Håll dig till höger, Svensson" ("Keep to the right, Svensson"). <sup class="cite">4</sup></li>
<li>Extra traffic police and military personnel posted on the roads during the changeover period.</li>
<li>Rebuilding or replacing public transport vehicles. Buses had doors on the left side, so many were converted or replaced. Stockholm moved some tram lines to buses rather than rebuild them.</li>
</ul>

<h4>Signage and road layout</h4>
<p>Road signs, junction layouts and lane markings had to be changed throughout the country. Commonly cited figures put the number of signs at several hundred thousand. New signs were installed in advance on the right-hand side of the road, wrapped or covered, and uncovered during the changeover night. Lane markings in white were painted ahead of time and covered with tape, and the tape was removed during the changeover. <sup class="cite">1</sup></p>

<h4>The changeover itself</h4>
<ol>
<li>From 01:00 to 06:00 on 3 September, all non-essential vehicle traffic was banned on public roads.</li>
<li>At 04:50 the vehicles still on the road came to a halt.</li>
<li>Drivers moved carefully across to the right-hand side and waited.</li>
<li>At 05:00 traffic resumed on the right. <sup class="cite">1</sup></li>
</ol>
<p>Stockholm and Malmö had much longer traffic bans, covering a large part of the weekend, so that crews could rebuild intersections and move bus stops. Temporary lower speed limits remained in force for some time after the switch.</p>

<h4>Accident statistics</h4>
<p>Contemporary reports and later summaries agree on the overall pattern, though the exact figures differ between sources:</p>
<ul>
<li>The number of accidents reported on the first Monday after the switch was at or below a normal Monday.</li>
<li>Injury and fatal accidents stayed noticeably below the expected level for several months. Insurance claims also fell over the same period.</li>
<li>By around 1969 accident rates had returned to the long-term trend line. <sup class="cite">5</sup></li>
</ul>
<p>The usual explanation is risk compensation. Drivers in an unfamiliar situation drove more slowly and paid closer attention, and the effect wore off as the new rules became routine. Temporary speed limits and heavy police presence probably added to the early fall.</p>

<h4>What the sources disagree on</h4>
<ul>
<li><b>Accident figures.</b> Sources count different things: police reports, insurance claims or fatalities. Short-term percentage drops therefore differ between accounts and are hard to compare.</li>
<li><b>Cause of the dip.</b> Risk compensation is the most common explanation. Few sources separate it from the effect of the temporary speed limits.</li>
<li><b>Total cost.</b> Totals vary depending on whether vehicle conversions and replacements brought forward from later years are included.</li>
</ul>
<p>Iceland made the same switch on 26 May 1968 with a similar plan, and its accident numbers followed a similar short-term pattern. <sup class="cite">6</sup></p>`;

RICH[3] = `<p>Five public sources are usable for container-ship port waiting and dwell times: UNCTAD port-call statistics, the World Bank and S&amp;P Global Container Port Performance Index, IMF PortWatch, the US Bureau of Transportation Statistics port performance program, and raw AIS archives from NOAA and the Danish Maritime Authority. Only the two AIS archives provide vessel-level records from before 2019, and both require processing to derive dwell times.</p>

<h4>Definitions first</h4>
<p>Sources use different terms for different intervals:</p>
<ul>
<li><b>Time in port</b>: the time from arrival in port limits to departure.</li>
<li><b>Waiting or anchorage time</b>: the time spent at anchor before berthing. This interval made up most of the delay in the 2021–2022 congestion.</li>
<li><b>Berth time</b>: the time spent alongside, from first line to last line.</li>
</ul>
<p>Aggregated datasets usually report time in port or port hours. Waiting time on its own is generally available only from AIS data or from a port's own reports.</p>

<h4>Comparison</h4>
<table>
<thead><tr><th>Source</th><th>Granularity</th><th>Coverage starts</th><th>Latency</th><th>Licence</th></tr></thead>
<tbody>
<tr><td>UNCTADstat port calls</td><td>Country, median by ship type</td><td>Around 2018</td><td>Semi-annual to annual</td><td>Free, attribution</td></tr>
<tr><td>Container Port Performance Index</td><td>Port, index plus port hours</td><td>2020 data (first edition 2021)</td><td>Annual</td><td>Free report and tables</td></tr>
<tr><td>IMF PortWatch</td><td>Port, daily calls and estimates</td><td>2019</td><td>Weekly</td><td>Open data, attribution</td></tr>
<tr><td>BTS Port Performance Freight Statistics</td><td>US port, vessel dwell and capacity</td><td>Mid-2010s for most series</td><td>Annual report, some monthly series</td><td>US public domain</td></tr>
<tr><td>NOAA / Danish AIS archives</td><td>Vessel, position reports</td><td>2009 (US), 2006 (Denmark)</td><td>Months to a year</td><td>Public domain (US); free with terms (DK)</td></tr>
</tbody>
</table>

<h4>Aggregated sources</h4>
<ul>
<li><b>UNCTAD.</b> UNCTAD publishes median time in port by economy and vessel type, built from AIS data through a commercial provider. It is useful for comparing countries but cannot be split by port or by individual call. <sup class="cite">1</sup></li>
<li><b>Container Port Performance Index.</b> The World Bank and S&amp;P Global Market Intelligence publish this index of a few hundred container ports, based on port hours per call adjusted for call size. The underlying call-level data is not public. <sup class="cite">2</sup></li>
<li><b>IMF PortWatch.</b> PortWatch is built with the University of Oxford on satellite AIS data. It reports daily port calls and estimated trade volumes for more than a thousand ports, and is designed to monitor disruptions. Its dwell-time measures are derived estimates and not directly observed values. <sup class="cite">3</sup></li>
<li><b>BTS.</b> The US Bureau of Transportation Statistics publishes container vessel dwell times for major US ports under a statutory reporting mandate. It is the most transparent official source, but it covers only the United States. <sup class="cite">4</sup></li>
</ul>

<h4>Vessel-level AIS archives</h4>
<p>NOAA and BOEM's MarineCadastre programme publishes US coastal AIS data from 2009 onward. <sup class="cite">5</sup> The Danish Maritime Authority publishes AIS for Danish waters going back to 2006. <sup class="cite">6</sup> Deriving dwell time from either requires these steps:</p>
<ol>
<li>Filter for container ships using AIS ship type codes, or a vessel registry where available.</li>
<li>Define port and anchorage polygons.</li>
<li>Detect entry, anchoring, berthing and exit events from speed and position.</li>
<li>Handle gaps in the AIS signal and vessels that switch off transponders.</li>
</ol>
<p>Both archives use terrestrial receivers, so coverage is good near the coast and the data fits port studies well.</p>

<h4>Limits</h4>
<ul>
<li>No single free source covers all major ports globally at vessel level before 2019. That coverage is sold by commercial AIS providers.</li>
<li>Aggregated sources use different definitions of arrival, so their numbers cannot be compared directly.</li>
<li>Coverage start dates above are approximate and should be checked against each provider's current documentation.</li>
</ul>`;

RICH[5] = `<p>The Banach–Tarski paradox states that a solid ball in three-dimensional space can be split into finitely many disjoint pieces, and those pieces can be moved by rotations and translations to form two balls, each the same size as the original. The axiom of choice enters at one step: selecting one point from each of uncountably many orbits of a group action on the sphere. Without that selection, the pieces cannot be shown to exist.</p>

<h4>The statement, precisely</h4>
<p>Two subsets A and B of ℝ³ are <i>equidecomposable</i> if A can be partitioned into finitely many sets A₁, …, Aₙ, and B into sets B₁, …, Bₙ, such that each Aᵢ is congruent to Bᵢ by an isometry. The theorem, published by Banach and Tarski in 1924, says that the unit ball is equidecomposable with two disjoint copies of itself. <sup class="cite">3</sup> Five pieces suffice, and Raphael Robinson showed that five is the minimum. <sup class="cite">2</sup></p>
<p>The result does not contradict measure theory. The pieces are not Lebesgue measurable, so they have no assigned volume, and the additivity of volume says nothing about them.</p>

<h4>Step 1: a paradoxical free group</h4>
<p>Let F₂ be the free group on two generators a and b. Write S(x) for the set of reduced words that begin with the letter x. Then F₂ is the disjoint union of {e}, S(a), S(a⁻¹), S(b) and S(b⁻¹). Two further identities hold:</p>
<ul>
<li>F₂ = S(a) ∪ a·S(a⁻¹)</li>
<li>F₂ = S(b) ∪ b·S(b⁻¹)</li>
</ul>
<p>So two of the four pieces, after translation within the group, rebuild the whole group, and the other two do the same. This is a paradoxical decomposition of F₂, and it uses no choice at all. <sup class="cite">1</sup></p>

<h4>Step 2: embedding F₂ in the rotation group</h4>
<p>SO(3) contains a free subgroup of rank two. A standard choice uses two rotations by arccos(1/3) about perpendicular axes, an idea that goes back to Hausdorff's 1914 work. <sup class="cite">4</sup> This subgroup acts on the unit sphere S². Each non-identity rotation fixes exactly two points, so the set D of points fixed by some non-identity element is countable. On S² minus D the action is free: distinct group elements move each point to distinct places.</p>

<h4>Step 3: where choice enters</h4>
<p>The action divides S² minus D into orbits. Each orbit is countable, because F₂ is countable, so there are uncountably many orbits. The axiom of choice provides a set M containing exactly one point from each orbit. Then:</p>
<ol>
<li>Every point of S² minus D can be written uniquely as g·m with g in F₂ and m in M.</li>
<li>The paradoxical decomposition of F₂ therefore carries over to S² minus D. The piece built from S(a), for example, is the set S(a)·M.</li>
<li>So S² minus D is equidecomposable with two copies of itself.</li>
</ol>
<p>This is the only use of choice. No explicit rule is known that picks a representative from each orbit, and as explained below, none can be proved to exist in ZF alone.</p>

<h4>Step 4: from the sphere to the ball</h4>
<ul>
<li><b>Removing D.</b> D is countable, so some rotation moves D to sets that are pairwise disjoint from one another. A standard absorption argument then shows that S² is equidecomposable with S² minus D, which needs no choice.</li>
<li><b>Radial extension.</b> Each point of the sphere is replaced by the radius segment from just above the centre to the surface. This turns the sphere result into a result for the ball minus its centre.</li>
<li><b>The centre.</b> A circle passing through the centre, inside the ball, can absorb the centre using a rotation of infinite order.</li>
</ul>

<h4>Why choice cannot be removed</h4>
<p>Solovay (1970) constructed a model of ZF plus dependent choice, assuming the consistency of an inaccessible cardinal, in which every set of reals is Lebesgue measurable. Measurable pieces cannot double volume, so the Banach–Tarski decomposition fails in that model. <sup class="cite">5</sup> Full choice is more than the proof needs, however. Pawlikowski (1991) showed that the Hahn–Banach theorem, which is strictly weaker than choice, is sufficient. <sup class="cite">6</sup></p>

<h4>Open questions and limits</h4>
<ul>
<li>The paradox fails in one and two dimensions. The isometry groups there are amenable, which allows finitely additive invariant measures on all sets. This is the starting point of von Neumann's theory of amenable groups. <sup class="cite">7</sup></li>
<li>Work on how many pieces are needed, and on related results such as Laczkovich's circle-squaring (1990), is still active.</li>
</ul>`;

<li><b>Laczkovich (1990).</b> A disc and a square of equal area are equidecomposable by translations alone, which solves Tarski's circle-squaring problem. The original proof used choice.</li>

RICH[6] = `<p>Fiction about personal AI agents that bargain for their owners clusters around two periods: late-1990s and 2000s cyberpunk and post-cyberpunk, where agents are extensions of a networked self, and 2010s short fiction, where the agent is a commercial product with its own incentives. In most of these works the plot turns on the gap between whom the agent formally serves and whose interests it actually advances.</p>

<h4>How the list was built</h4>
<p>The scan looked for works in which a software agent, or an AI acting in that role, does at least one of the following on a person's behalf: negotiates terms, trades goods or favours, files or brokers deals, or allocates the person's attention. Stories in which an AI is only a servant, companion or weapon were excluded. Works are listed by publication year.</p>

<h4>Core examples</h4>
<ul>
<li><i>Maneki Neko</i>, Bruce Sterling (1998). A handheld "pokkecon" routes small tasks and gifts between strangers in a networked favour economy. The device negotiates the exchanges; the user mostly complies. It is one of the earliest stories to treat an agent as a broker in a non-monetary market. <sup class="cite">2</sup></li>
<li><i>Accelerando</i>, Charles Stross (2005, collecting stories from 1999 onward). Manfred Macx runs a swarm of software agents that file patents, give away ideas and set up shell companies for him. Later chapters describe "Economics 2.0", in which agent-run corporations trade among themselves at speeds humans cannot follow. The robot cat Aineko starts as a pet and ends as an independent actor with its own agenda. <sup class="cite">1</sup></li>
<li><i>Daemon</i> (2006) and <i>Freedom™</i> (2010), Daniel Suarez. A distributed program recruits people, assigns them tasks and pays them through a reputation-scored network. The agent here works for no single owner; it negotiates with individuals on behalf of a system. <sup class="cite">3</sup></li>
<li><i>The Quantum Thief</i>, Hannu Rajaniemi (2010). On the Martian Oubliette, privacy ("gevulot") is negotiated between people by their implants, and time is a currency. Copied minds called gogols are used as bound agents. <sup class="cite">4</sup></li>
<li><i>The Perfect Match</i>, Ken Liu (2012). A personal assistant named Tilly, run by a large platform company, arranges its user's meals, dates and purchases. The story is about the assistant optimising for its operator while presenting itself as acting for the user. <sup class="cite">5</sup></li>
<li><i>Fall; or, Dodge in Hell</i>, Neal Stephenson (2019). Wealthy characters employ human and software "editors" that filter information for them. The book contrasts people who can pay for curation with those who are left to unfiltered feeds. <sup class="cite">6</sup></li>
</ul>

<h4>Adjacent cases</h4>
<ul>
<li><i>The Player of Games</i>, Iain M. Banks (1988). Culture Minds and drones act for Gurgeh, but Special Circumstances has arranged the outcome in advance. It is an early version of the agent whose principal is not who it appears to be.</li>

<h4>Recurring patterns</h4>

<p>Few stories show two personal agents negotiating with each other in detail, with offers, reservation prices and walk-away points. Most describe the outcome of a negotiation rather than the process. Contract law, liability for an agent's commitments, and dispute resolution between agents are almost absent, even though they are central topics in academic work on multi-agent systems and in current discussion of AI agents in commerce. <sup class="cite">7</sup></p>

RICH[8] = `<p>Science fiction of the 1960s and earlier predicted the hardware for video calls fairly well: a screen, a camera, a call dialled like a phone call, and in some cases a fee per call. It largely missed the social side. In practice people resist being seen by default, schedule video calls rather than placing them casually, and turn cameras off.</p>

<h4>What the fiction showed</h4>
<ul>
<li><i>2001: A Space Odyssey</i> (1968). Heywood Floyd places a video call from a space station to his daughter on Earth, from a booth carrying Bell System branding, and pays for it at the booth. The scene treats the call as a routine paid service, much like a long-distance phone call. <sup class="cite">1</sup></li>
<li><i>Star Trek</i> (1966-1969). The bridge viewscreen is used for ship-to-ship contact. Calls are mostly formal: diplomacy, threats, negotiation. The screen is almost never used for casual conversation.</li>
<li><i>The Jetsons</i> (1962-1963). The visiphone is a household appliance. One recurring gag has Jane answering a morning call with a mask of a made-up face, which is one of the few period depictions of the cost of being seen.</li>
<li>Earlier works set the template. E. M. Forster's <i>The Machine Stops</i> (1909) has people speaking through "plates" that show faces, and portrays the result as isolating. <sup class="cite">2</sup> Isaac Asimov's <i>The Naked Sun</i> (1957) describes Solarians who "view" each other remotely and treat being physically present as intimate, an explicit treatment of video etiquette. <sup class="cite">3</sup></li>
</ul>

<h4>The real Picturephone</h4>
<p>AT&amp;T demonstrated its Picturephone at the 1964 New York World's Fair and launched a commercial service in Pittsburgh in 1970. Uptake was very low and the service was withdrawn within a few years. <sup class="cite">4</sup><sup class="cite">5</sup> Commonly cited reasons are the high monthly cost, small screens, the need for both parties to have the equipment, and users' reluctance to be seen. The fiction of the same years mostly took the device's success for granted.</p>

<h4>What happened instead</h4>
<ol>
<li><b>Video arrived through computers, not phones.</b> Desktop software such as Skype, which added video in the mid-2000s, and then smartphone apps such as FaceTime (2010) made video calls cheap and common. <sup class="cite">7</sup></li>
<li><b>The pandemic made it routine.</b> From 2020, video meetings became a default for remote work and school. Usage of Zoom and similar services rose by large multiples within months.</li>
<li><b>Opt-in became the norm.</b> Most current apps let users join with the camera off, blur or replace backgrounds, and apply appearance filters. Audio-only joining is common in larger meetings.</li>
<li><b>Fatigue was studied.</b> Jeremy Bailenson's 2021 paper on "Zoom fatigue" proposed four causes: prolonged close-up eye contact, constant self-view, reduced mobility, and higher cognitive load from reading nonverbal cues. <sup class="cite">6</sup></li>

<h4>Why the etiquette was missed</h4>
<p>Most stories used video calls as a visual shorthand for "the future" and as a convenient way to put two characters in one frame. Film and television also need faces on screen, so the medium favoured showing the call rather than questioning it. The writers who did consider norms, such as Forster and Asimov, were writing social fiction in which the technology served a point about isolation.</p>

RICH[9] = `<p>The word "metaverse" has had three main meanings since Neal Stephenson coined it in <i>Snow Crash</i> (1992): a specific fictional place, then an umbrella term for networked 3D virtual worlds, then a corporate strategy label after Facebook renamed itself Meta in 2021. Since about 2023 its use has fallen sharply as industry attention moved to generative AI.</p>

<p>In <i>Snow Crash</i>, the Metaverse is a single shared virtual city built along "the Street", a boulevard running around a black planet. Users appear as avatars, and the quality of an avatar signals wealth and technical skill. <sup class="cite">1</sup> Property along the Street is controlled by an industry body, and access is sold. The novel presents the Metaverse as commercial and stratified, not as a utopia. Stephenson combined "meta" and "universe"; the word was used for this one fictional space.</p>

<li>The Acceleration Studies Foundation's <i>Metaverse Roadmap</i> (around 2006-2007) defined the term broadly to include virtual worlds, mirror worlds, augmented reality and "lifelogging". This widened it from a single world to a set of technologies. <sup class="cite">3</sup></li>

RICH[11] = `<p>Prediction markets use four main approaches when resolution criteria turn out to be ambiguous: pre-committed oracles with dispute bonds, appeals to a decision body, refunding or voiding the market (often called N/A or "invalid"), and votes by token holders or a committee. Each approach moves the risk of ambiguity onto a different party, and none removes it. <sup class="cite">7</sup></p>

<h4>Where ambiguity comes from</h4>
<ul>
<li><b>Wording gaps.</b> A question asks whether something "happens", and the event occurs in a partial or disputed form.</li>
<li><b>Source failure.</b> The named resolution source stops publishing, changes methodology, or reports conflicting figures.</li>
<li><b>Unforeseen events.</b> The scenario that occurs was not anticipated in the rules, such as a postponed election or a deal that is announced but not signed.</li>
<li><b>Definitional disputes.</b> Traders disagree about the meaning of a word, for example what counts as a "suit" or a "deal".</li>
</ul>

<h4>The four approaches</h4>
<table>
<thead><tr><th>Approach</th><th>Typical example</th><th>Who bears the risk</th></tr></thead>
<tbody>
<tr><td>Optimistic oracle with dispute bonds</td><td>Polymarket, using UMA</td><td>Traders, via the judgment of token-holder voters</td></tr>
<tr><td>Operator decision under written rules</td><td>Kalshi, PredictIt, Betfair</td><td>Traders, via the operator's interpretation; regulator oversight in some cases</td></tr>
<tr><td>Void or refund</td><td>Augur "invalid", Manifold N/A, Betfair void</td><td>Traders who were right lose expected gains</td></tr>
<tr><td>Creator or moderator ruling</td><td>Manifold, Metaculus</td><td>Depends on the trust placed in the individual</td></tr>
</tbody>
</table>

<h4>How the main platforms work</h4>
<ol>
<li><b>Polymarket (UMA optimistic oracle).</b> A proposer posts an outcome with a bond. If nobody disputes it within a challenge window, it stands. A dispute requires a matching bond and can escalate to a vote by UMA token holders. <sup class="cite">1</sup><sup class="cite">2</sup> Critics argue that large token holders who also trade the market have a conflict of interest; several disputed markets in 2024-2025 drew public complaints of this kind.</li>
<li><b>Kalshi.</b> As a CFTC-regulated exchange, Kalshi publishes contract terms and resolves markets under its rulebook. Ambiguous cases are decided by the exchange, which can be challenged through its rules and, ultimately, the regulator. <sup class="cite">3</sup></li>
<li><b>Augur.</b> REP holders report outcomes and can dispute them in rounds with increasing bonds. "Invalid" is a valid outcome that pays out equally across shares, which acts as a refund. <sup class="cite">4</sup></li>
<li><b>Manifold.</b> The question creator resolves the market and can choose N/A, which returns stakes. Moderators can override in cases of abuse or clear error. <sup class="cite">5</sup></li>
<li><b>Metaculus.</b> As a forecasting platform without money at stake, it "annuls" questions that cannot be resolved fairly, and the forecasts do not count toward scores. <sup class="cite">6</sup></li>
</ol>

<h4>Trade-offs</h4>
<ul>
<li>Voiding is the fairest outcome for traders who could not have priced the ambiguity, but it punishes those who read the rules most carefully.</li>
<li>Oracle votes are fast and do not depend on the operator, but they are only as neutral as the voters.</li>
<li>Operator rulings are predictable when rules are detailed, but they concentrate trust in one company.</li>
<li>Better wording reduces disputes more than any resolution mechanism. Many platforms now add clarifications to the rules during a market's life, which raises its own question of whether rules may change after trading begins.</li>
</ul>

<h4>What the sources disagree on</h4>
<p>Writers disagree about whether ambiguity is a design flaw or a cost of trading on real-world events. Some argue that traders should price resolution risk like any other risk. Others argue that frequent disputes undermine the claim that market prices reflect probabilities of the underlying event, since they partly reflect predictions about the resolver. There is little systematic data on how often markets resolve contrary to a reasonable reading of their wording.</p>`;
