      h = h.slice(0, at) + `<mark class="qt-anc${on ? ' on' : ''}" data-qtgo="${l.find(k => onPath.has(k.id))?.id || l[0].id}" title="${l.length} question${l.length > 1 ? 's' : ''} about this passage">${t}<sup class="qt-anc-n">${l.length}</sup></mark>` + h.slice(at + t.length);
    });
    kids.filter(k => k.anc.k === 'cite').forEach(k => { h = h.replace(`<sup class="cite">${k.anc.n}</sup>`, `<sup class="cite qt-cite-on" data-qtgo="${k.id}" title="1 question about source ${k.anc.n}">${k.anc.n}</sup>`); });
  }
  let bar = '';
  const sel = st.qtSel && st.qtSel.th === T.i && st.qtSel.node === n.id ? st.qtSel : null;
  if (sel && sel.k === 'passage') {
    const at = qtFind(h, sel.text);
    const pop = sel.open ? '' : `<span class="qt-selpop" role="group" aria-label="Selected passage"><button class="btn sm primary" type="button" data-qt="sel-ask">${QTI.ask}Ask about this</button><button class="btn sm" type="button" data-qt="sel-x">Cancel</button></span>`;
    if (at >= 0) h = h.slice(0, at) + `<mark class="qt-pend">${sel.text}${pop}</mark>` + h.slice(at + sel.text.length);
    else if (!sel.open) bar = `<div class="qt-selbar"><span>Selected</span><q>${esc(qtClip(sel.text, 140))}</q><button class="btn sm primary" type="button" data-qt="sel-ask">${QTI.ask}Ask about this</button><button class="btn sm" type="button" data-qt="sel-x">Cancel</button></div>`;
  }
  if (mode === 'marks') {
    h = h.replace(/<(b|i|code)>([^<]{2,80})<\/\1>/g, (m, tg, x) => `<${tg}><span class="qt-term" role="button" tabindex="0" data-qtterm="${x.replace(/"/g, '&quot;')}" title="Ask about this term">${x}</span></${tg}>`)
      .replace(/<sup class="cite">(\d+)<\/sup>/g, (m, k) => `<sup class="cite qt-citeb" role="button" tabindex="0" data-qtcite="${k}" title="Ask about source ${k}">${k}</sup>`);
  }
  return `${bar}<div class="prose qt-prose${mode === 'whole' ? ' qt-whole' : ''}" data-qtsel="${T.i}:${n.id}">${h}</div>`;
}
const qtSrcs = (T, n) => {
  if (n.id !== 'r' || n.running) return '';
  const src = srcItems(T.p), kids = T.kids('r').filter(k => k.anc && k.anc.k === 'cite');
  return src.length ? `<ol class="m-src qt-src">${src.map((x, k) => { const c = kids.filter(z => z.anc.n === k + 1); return `<li><b>${esc(x.t)}</b><span>${x.d}</span>${c.length ? `<button class="tlink qt-srcn" type="button" data-qtgo="${c[0].id}">${c.length} question${c.length > 1 ? 's' : ''}</button>` : ''}</li>`; }).join('')}</ol>` : '';
};

/* ---------- small parts ---------- */
const qtLv = (n, on) => `<span class="qt-lv num${on ? ' on' : ''}" title="${qtLvName(n)}">${n.id === 'r' ? 'Q' : n.lv}</span>`;
function qtAbout(T, n, link = true) {
  if (n.id === 'r') return '';
  const par = T.by[n.par], pq = esc(qtClip(par.q, 60)), tag = link ? 'button' : 'div', at = link ? ` type="button" data-qtgo="${par.id}"` : '';
  if (!n.anc || st.qtFrom === 'whole') return `<${tag} class="qt-about"${at}><span><small>Follow-up to ${par.id === 'r' ? 'the question' : 'level ' + par.lv}</small>${pq}</span></${tag}>`;
  if (n.anc.k === 'cite') return `<${tag} class="qt-about"${at}><span><small>About source ${n.anc.n} in ${par.id === 'r' ? 'the first answer' : 'level ' + par.lv}</small>${esc(n.anc.t)}</span></${tag}>`;
  return `<${tag} class="qt-about"${at}><span><small>About a ${n.anc.k === 'term' ? 'term' : 'passage'} in ${par.id === 'r' ? 'the first answer' : 'the answer at level ' + par.lv}</small><q>${esc(qtClip(n.anc.t, 160))}</q></span></${tag}>`;
}
function qtMenu(T, n) {
  const key = `${T.i}:${n.id}`, open = st.qtMenu === key, sv = st.qtSaved.has(key);
  if (!open) return `<span class="qt-mw"><button class="act sf-im" type="button" data-qtmenu="${key}" aria-haspopup="true" aria-expanded="false" aria-label="More actions for this ask" title="More">${SFI.more}</button></span>`;
  const it = (attr, icon, label, sub = '', dis = false) => `<button class="um-item" type="button" role="menuitem" ${dis ? 'aria-disabled="true" data-qt="noop"' : attr}>${icon}<span>${label}${sub ? `<small>${sub}</small>` : ''}</span></button>`;
  const canP = qtCanPromote(T, n), canX = qtCanPrune(T);
  return `<span class="qt-mw"><button class="act sf-im" type="button" data-qtmenu="${key}" aria-haspopup="true" aria-expanded="true" aria-label="More actions for this ask" title="More">${SFI.more}</button><div class="pop cs-pop qt-pop" role="menu">
    ${it(`data-qtcopy="${n.id}"`, QTI.link, 'Copy link to this ask')}
    ${it(`data-qtsave="${n.id}"`, sv ? QTI.saved : QTI.save, sv ? 'Remove from Saved' : 'Save this ask')}
    ${it(`data-qtpick="${n.id}"`, QTI.cmp, 'Compare with another ask')}
    ${n.id === 'r' ? '' : it(`data-qtpro="${n.id}"`, QTI.out, 'Start a thread from this branch', canP ? '' : 'Only the asker of this branch, the thread owner and moderators can do this.', !canP)}
    ${qtOwner(T) && n.id !== 'r' ? it(`data-qtbest="${n.id}"`, QTI.pin, T.best === n.id ? 'Unpin the best path' : 'Pin the path to here as the best path') : ''}
    ${canX && n.id !== 'r' ? it(`data-qtcol="${n.id}"`, QTI.fold, n.col ? 'Show this branch' : 'Collapse this branch', n.col ? '' : 'It stays in the thread behind a "collapsed" row.') : ''}
    ${n.id === 'r' ? '' : it(`data-sfreport="${n.rep}"`, SFI.flag, 'Report a problem')}
  </div></span>`;
}
function qtNodeActs(T, n, o = {}) {
  const key = `${T.i}:${n.id}`, sv = st.qtSaved.has(key);
  const ask = st.auth === 'in' && !n.running ? `<button class="btn sm" type="button" data-qtaskat="${n.id}">${QTI.ask}Ask about this answer</button>` : '';
  return `<div class="qt-acts">${ask}<button class="act sf-im qt-save" type="button" data-qtsave="${n.id}" aria-pressed="${sv}" aria-label="${sv ? 'Saved' : 'Save this ask'}" title="${sv ? 'Saved' : 'Save this ask'}">${I.mark}</button><span class="grow"></span>${n.tok && !n.running ? `<span class="num" title="Paid from ${esc(qtPaidBy(T, n))}">${fmt(n.tok)} tokens</span>` : ''}${o.menu === false ? '' : qtMenu(T, n)}</div>`;
}
function qtKidRow(T, k, cur) {
  const n = T.sub(k.id), q = k.anc && st.qtFrom !== 'whole' ? (k.anc.k === 'cite' ? `About source ${k.anc.n}: ${esc(k.anc.t)}` : `About <q>${esc(qtClip(k.anc.t, 70))}</q>`) : 'About the whole answer';
  return `<button class="qt-kid" type="button" data-qtgo="${k.id}" aria-current="${!!cur}">${avatar(k.u, 'sm')}<span class="qt-kid-b"><span class="qt-kid-q">${esc(k.q)}</span><span class="qt-kid-a">${q} · ${k.u} · ${k.age}</span></span><span class="qt-kid-n">${n ? `${n} more` : ''}</span></button>`;
}
function qtKids(T, n, curId, title) {
  const all = T.kids(n.id), vis = qtVisKids(T, n.id), col = all.length - vis.length;
  return `<section class="qt-kids"><h3>${title || 'Questions about this answer'} <span class="num">${all.length}</span></h3>${vis.map(k => qtKidRow(T, k, k.id === curId)).join('') || (col ? '' : `<p class="qt-empty">No questions yet. Select a passage${st.qtFrom === 'marks' ? ', a marked term or a source number' : ''} in the answer, or use Ask about this answer.</p>`)}${col ? `<div class="qt-coll">${QTI.fold}<span>${col} collapsed branch${col > 1 ? 'es' : ''}</span><button class="tlink" type="button" data-qt="showcol">${st.qtShowCol ? 'Hide' : 'Show'}</button></div>` : ''}</section>`;
}
function qtHead(T, n, opts = {}) {
  const cur = opts.cur !== false;
  return `<div class="qt-nh"><div class="qt-nh-top">${qtLv(n, cur)}<span>${qtLvName(n)}</span><span aria-hidden="true">·</span>${avatar(n.u, 'sm')}${au(n.u)}<span>${n.age}</span>${T.best && T.path(T.best).some(x => x.id === n.id) && n.id !== 'r' ? `<span class="qt-star" title="On the best path">${QTI.star}</span>` : ''}</div>${opts.about === false ? '' : qtAbout(T, n)}${n.uses ? `<div class="qt-kid-a">Asked from a comparison. The agent also got the branch ending at ${n.uses.filter(x => T.by[x]).map(x => `<button class="tlink" type="button" data-qtgo="${x}">level ${T.by[x].lv}</button>`).join(' and ')}.</div>` : ''}${n.promoted != null && POSTS[n.promoted] ? `<div class="qt-from">${QTI.out}<span>Continued as a thread:</span><button class="tlink" type="button" data-open="${n.promoted}">${esc(qtClip(POSTS[n.promoted].t, 70))}</button></div>` : ''}${opts.q === false ? '' : `<h2 class="qt-q">${esc(n.q)}</h2>`}</div>`;
}

/* ---------- composer ---------- */
function qtComposer(T, par, opts = {}) {
  if (st.auth !== 'in') return `<div class="qt-comp"><p class="muted" style="margin:0">Sign in to ask about this answer.</p><div class="qt-cbar"><span class="grow"></span><button class="btn primary" type="button" data-act="signin">Sign in</button></div></div>`;
  const pn = T.by[par]; if (!pn || pn.running) return '';
  const sel = st.qtSel && st.qtSel.th === T.i && st.qtSel.node === par && st.qtSel.open ? st.qtSel : null;
  const lv = pn.lv + 1, c = qtCtx(T, par);
  const what = sel ? (sel.k === 'cite' ? `source ${sel.n}` : sel.k === 'term' ? 'this term' : 'this passage') : 'this answer';
  const quote = sel ? `<blockquote class="qt-quote"><span class="qt-qt"><small>${sel.k === 'cite' ? `Source ${sel.n}` : sel.k === 'term' ? 'Term' : 'Passage'} from ${par === 'r' ? 'the first answer' : 'level ' + pn.lv}</small>${sel.k === 'cite' ? esc(qtClip(sel.text, 220)) : `<q>${esc(qtClip(sel.text, 220))}</q>`}</span><button class="iconbtn" type="button" data-qt="sel-x" aria-label="Ask about the whole answer instead" title="Ask about the whole answer instead">${I.close}</button></blockquote>` : '';
  const ctxLabel = { path: `the ${c.inc.length} ask${c.inc.length > 1 ? 's' : ''} on this path`, parent: 'this answer only', tree: `all ${c.inc.length} asks in this thread`, sum: `the ${c.inc.length} ask${c.inc.length > 1 ? 's' : ''} on this path and one-line summaries of ${c.sums.length} other asks` }[st.qtCtx];
  const list = st.qtCtxOpen ? `<div class="qt-ctx-list">${c.inc.map(x => `<span>${qtLv(x)}${esc(qtClip(x.q, 46))}</span>`).join('')}${c.sums.length ? `<span class="sm">${c.sums.length} summaries</span>` : ''}${sel ? `<span class="sm">quoted ${sel.k === 'cite' ? 'source' : sel.k}</span>` : ''}</div>` : '';
  const warn = st.qtPay === 'pool' && lv > QT_DEPTH_LIMIT ? `<div class="qt-warn"><span><b>Level ${lv} is past the space limit.</b> ${spName(sp(T.p.s))} pays for branches down to level ${QT_DEPTH_LIMIT}. This ask uses your API key, or you can start a new thread from this branch.</span></div>` : '';
  return `<div class="qt-comp" id="qt-comp">${quote}<textarea id="qt-in" rows="2" placeholder="Ask about ${what}…" aria-label="Ask about ${what}">${esc(st.qtDraft)}</textarea>${st.qtErr ? `<span class="qt-err">${st.qtErr}</span>` : ''}
    <div class="qt-ctx"><div class="qt-ctx-l">${QTI.tree}<span>New ask at level ${lv}. The agent gets ${ctxLabel}${sel ? ' and the quoted text' : ''}, about ${fmt(c.tok)} tokens of context. <button class="tlink qt-ctxb" type="button" data-qt="ctx" aria-expanded="${!!st.qtCtxOpen}">${st.qtCtxOpen ? 'Hide' : 'Show'}</button></span></div>${list}</div>
    ${warn}<div class="qt-cbar fu2-bar">${opts.nomp ? '' : modelPicker()}<span class="qt-pay">${esc(qtPayLine(T, lv))}</span><span class="grow"></span>${opts.cancel || sel ? `<button class="btn" type="button" data-qt="comp-x">Cancel</button>` : ''}<button class="btn primary" type="button" data-qt="ask" data-qtpar="${par}">Ask</button></div></div>`;
}

/* ---------- outline ---------- */
function qtOutline(T, cur, opts = {}) {
  const on = new Set((st.qtCmp ? st.qtCmp.filter(x => T.by[x]).flatMap(x => T.path(x)) : T.path(cur.id)).map(n => n.id)), best = new Set(T.best ? T.path(T.best).map(n => n.id) : []);
  const ctx = st.qtSel && st.qtSel.open && st.qtSel.th === T.i ? new Set(qtCtx(T, st.qtSel.node).inc.map(n => n.id)) : new Set();
  const row = (n, d) => {
    const vis = qtVisKids(T, n.id), all = T.kids(n.id), hid = all.length - vis.length;
    const cls = ['qt-olr', d === 0 ? 'top' : '', on.has(n.id) ? 'path' : '', n.col ? 'coll' : '', ctx.has(n.id) ? 'ctx' : ''].filter(Boolean).join(' ');
    return `<li role="treeitem" aria-level="${d + 1}"${all.length ? ` aria-expanded="true"` : ''}><button class="${cls}" type="button" data-qtgo="${n.id}" style="--d: ${d}" aria-current="${n.id === cur.id}">${avatar(n.u)}<span class="qt-olt">${esc(n.id === 'r' && n.t ? n.t : n.q)}</span><span class="qt-olm">${best.has(n.id) && n.id !== 'r' ? QTI.star : ''}${n.running ? '<span class="spin" aria-label="Researching"></span>' : ''}${hid ? `+${hid}` : ''}</span></button>${vis.length ? `<ul role="group">${vis.map(k => row(k, d + 1)).join('')}</ul>` : ''}</li>`;
  };
  return `<nav class="qt-ol" aria-label="Outline of this thread"><div class="qt-ol-h"><h3>Outline</h3><span class="num">${T.nodes.length} asks · ${T.depth} levels</span></div><ul role="tree">${row(T.nodes[0], 0)}</ul>${opts.legend === false ? '' : `<div class="qt-ol-legend"><span>${QTI.star}Best path${T.best ? `, pinned by ${T.owner}` : ': not pinned'}</span>${ctx.size ? '<span>Green mark: sent to the agent</span>' : ''}</div>`}</nav>`;
}
function qtFacts(T) {
  const p = T.p, s = sp(p.s);
  return `<div class="th-facts"><div><span>Space</span><button class="tlink th-sp" type="button" data-space="${p.s}">${spName(s)}</button></div>${isClosed(s) ? `<div><span>Visible to</span><b class="cs-fv">${LOCK}Members (${fmt(s.members)})</b></div>` : ''}<div><span>Started by</span><b>${p.u}</b></div><div><span>Asks</span><b class="num">${T.nodes.length}</b></div><div><span>People</span><b class="num">${T.people}</b></div><div><span>Levels</span><b class="num">${T.depth}</b></div><div><span>Tokens, all asks</span><b class="num">${fmt(T.tok)}</b></div><div><span>Answered by</span><b>${MODEL_NAME}</b></div></div>`;
}

/* ---------- summary ---------- */
function qtSummary(T) {
  const d = T.d, run = st.qtSumRun, n = T.nodes.length;
  const secs = d.sum || T.kids('r').map(k => [qtClip(k.q, 60), [k.id, ...T.nodes.filter(x => T.path(x.id).some(y => y.id === k.id) && x.id !== k.id).map(x => x.id)], qtClip(qtTxt(k.html), 220)]);
  const since = d.sumAt ? n - d.sumAt : 0;
  const body = run ? `<div class="run"><div class="run-h"><span class="spin" aria-hidden="true"></span><b>Summarizing ${n} asks</b><span class="faint">· about 6K tokens</span></div></div>`
    : secs.map(([h, ids, txt]) => `<div class="qt-sum-sec"><h4>${esc(h)}<small>${ids.length} ask${ids.length > 1 ? 's' : ''} · ${[...new Set(ids.map(x => T.by[x] && T.by[x].u).filter(Boolean))].join(', ')}</small></h4><p>${esc(txt)}</p><div class="qt-sum-links">${ids.filter(x => T.by[x]).slice(0, 4).map(x => `<button class="tlink" type="button" data-qtgo="${x}">Level ${T.by[x].lv}: ${esc(qtClip(T.by[x].q, 44))}</button>`).join('')}</div></div>`).join('') + (d.open ? `<div class="qt-sum-sec"><h4>Not answered in this thread</h4><p>${esc(d.open)}</p></div>` : '');
  return `<section class="qt-sum" aria-label="Summary of this thread"><div class="qt-sum-h">${QTI.sum}<h3>Summary of all branches</h3><span class="grow"></span><button class="iconbtn" type="button" data-qt="sum" aria-label="Close the summary">${I.close}</button></div>
    <div class="qt-sum-m">${run ? 'Researching' : `Agent summary of ${d.sumAt || n} asks, made ${d.sumAge || '1h'} ago · ${fmt(6e3)} tokens from ${spName(sp(T.p.s))}`}${!run && since > 0 ? ` · ${since} new ask${since > 1 ? 's' : ''} since then <button class="tlink" type="button" data-qt="sum-run">Update</button>` : ''}</div>${body}</section>`;
}

/* ---------- compare ---------- */
function qtCompare(T) {
  const [a, b] = st.qtCmp, pa = T.path(a), pb = T.path(b);
  let k = 0; while (pa[k] && pb[k] && pa[k].id === pb[k].id) k++;
  const base = pa[k - 1], A = pa.slice(k), B = pb.slice(k);
  const step = n => `<div class="qt-cmp-step"><div class="qt-ancm">${qtLv(n)}${avatar(n.u, 'sm')}<span>${n.u} · ${n.age}</span></div><button class="qt-ancq" type="button" data-qtgo="${n.id}">${esc(n.q)}</button>${n.anc && st.qtFrom !== 'whole' && n.anc.k !== 'cite' ? `<div class="qt-kid-a">About <q>${esc(qtClip(n.anc.t, 80))}</q></div>` : ''}<div class="prose">${n.html}</div></div>`;
  const col = (l, cls, lbl) => `<div class="qt-cmp-col ${cls}"><h3>${lbl} <span class="num">${l.length} ask${l.length > 1 ? 's' : ''}</span></h3>${l.map(step).join('') || '<p class="qt-empty">This ask is on the other branch’s path.</p>'}</div>`;
  const merge = st.auth === 'in' ? `<section class="qt-kids"><h3>Ask about both branches</h3><p class="qt-note" style="margin:0 0 8px">The new ask is placed under the shared ask (level ${base.lv}) and the agent gets both branches as context. It links back to both.</p>${qtComposer(T, base.id, { merge: true })}</section>` : '';
  return `<div class="qt-cmp"><div class="qt-cmp-h"><h2>Compare two branches</h2><span class="grow"></span><span class="seg qt-cmp-seg" role="group" aria-label="Branch shown">${['a', 'b'].map(x => `<button type="button" data-qtside="${x}" aria-pressed="${st.qtSide === x}">Branch ${x.toUpperCase()}</button>`).join('')}</span><button class="btn" type="button" data-qt="cmp-x">Close</button></div>
    <div class="qt-cmp-base"><small>Both branches start from ${base.id === 'r' ? 'the question' : 'level ' + base.lv}</small><button class="qt-ancq" type="button" data-qtgo="${base.id}">${esc(base.q)}</button></div>
    <div class="qt-cmp-cols" data-side="${st.qtSide}">${col(A, 'a', 'Branch A')}${col(B, 'b', 'Branch B')}</div>${merge}</div>`;
}
const qtPickBar = T => st.qtPick && T.by[st.qtPick] ? `<div class="qt-pickbar" role="status"><span>Choose a second ask to compare with <b>${esc(qtClip(T.by[st.qtPick].q, 60))}</b>, ${st.qtA === 'map' ? 'on the map' : 'in the outline'}.</span><span class="grow"></span>${st.qtA === 'map' ? '' : `<button class="btn sm${st.qtA === 'cols' ? '' : ' qt-olbtn'}" type="button" data-qt="olsheet">${QTI.tree}Open the outline</button>`}<button class="btn sm" type="button" data-qt="pick-x">Cancel</button></div>` : '';

/* ---------- bar above every tree view ---------- */
function qtBar(T, cur) {
  const p = T.p, n = T.nodes.length;
  const t = (k, icon, lbl, on, extra = '') => `<button class="btn sm${extra}" type="button" data-qt="${k}" aria-pressed="${!!on}">${icon}${lbl}</button>`;
  const from = p.from ? `<div class="qt-from">${QTI.out}<span>Branched from</span><button class="tlink" type="button" data-qtopen="${p.from.th}:${p.from.node}">${esc(qtClip(POSTS[p.from.th].t || POSTS[p.from.th].q, 70))}, level ${p.from.lv}</button></div>` : '';
  const tools = n > 1 ? `<div class="qt-tools">${(st.qtA === 'map' ? '' : t('olsheet', QTI.tree, 'Outline', st.modal === 'qt-outline', st.qtA === 'cols' ? '' : ' qt-olbtn'))}${t('sum', QTI.sum, 'Summary', st.qtSum)}${T.best ? t('best', QTI.star, 'Best path', cur.id === T.best) : ''}${t('latest', QTI.clock, 'Latest', cur.id === T.latest.id)}${cur.id !== 'r' ? t('top', QTI.up, 'Question', false) : ''}</div>` : '';
  return `<div class="qt-bar">${thHead(p)}<span class="qt-stats num">${n} ask${n > 1 ? 's' : ''} · ${T.people} ${T.people > 1 ? 'people' : 'person'} · ${T.depth} level${T.depth === 1 ? '' : 's'}</span>${tools}</div>${from ? `<div class="qt-bar" style="padding-top:10px">${from}</div>` : ''}`;
}

/* ---------- A. Path and outline: one path at a time, siblings as tabs, outline beside it ---------- */
function qtSibs(T, cur) {
  if (cur.id === 'r') return '';
  const sibs = qtVisKids(T, cur.par); if (sibs.length < 2) return '';
  const par = T.by[cur.par];
  return `<div class="qt-sibs"><span class="qt-sibs-h">${sibs.length} questions about ${par.id === 'r' ? 'the first answer' : 'the answer at level ' + par.lv}</span><div class="qt-tabs" role="tablist" aria-label="Questions about the same answer">${sibs.map(k => `<button class="qt-tab" type="button" role="tab" data-qtgo="${k.id}" aria-selected="${k.id === cur.id}" title="${esc(k.q)}">${avatar(k.u)}<span>${esc(qtClip(k.q, 46))}</span></button>`).join('')}</div></div>`;
}
function qtAncCard(T, n, next) {
  const open = st.qtExp.has(n.id);

/* ---------- B. Columns: each ask on the path is a column; a branch opens to the right ---------- */

/* ---------- C. Map: the whole tree as a diagram, the selected ask beside it ---------- */

/* ---------- D. Nested in the answer: branches open under the paragraph they quote ---------- */

/* Branches anchored to a passage are placed after the block (paragraph, list, table) that holds the passage. */

  const html = qtAnswer(T, n, { path: [...st.qtIb] });

      here.forEach(k => placed.add(k.id));

function qtInlineView(T, cur) {

  const fp = T.path(focus.id);

  const sel = st.qtSel && st.qtSel.open && st.qtSel.th === T.i ? st.qtSel : null;

/* ---------- thread page dispatch ---------- */
const QT_layoutThread = layoutThread;
function qtEnter(i) {

  return `<div class="A C Af H">${topHeader()}<div class="th-page qt-page qt-a-${st.qtA}${st.qtA === 'cols' || st.qtA === 'map' ? ' qt-wide' : ''}">${v(T, cur)}</div></div>`;

/* ---------- new asks ---------- */
let qtSeq = 0;
function qtAsk(T, par, text) {
  const sel = st.qtSel && st.qtSel.open && st.qtSel.th === T.i && st.qtSel.node === par ? st.qtSel : null;
  const n = { id: 'n' + (++qtSeq), par, u: ME.u, age: 'now', q: text, tok: 0, running: true,
    anc: sel ? (sel.k === 'cite' ? { k: 'cite', n: sel.n, t: sel.text } : { k: sel.k, t: sel.text }) : null, uses: st.qtCmp ? [...st.qtCmp] : null };
  const html = QT_CANNED[st.qtCanned] || QT_CANNED.generic;
  T.d.nodes.push(n);
  Object.assign(st, { qtNode: n.id, qtSel: null, qtAskAt: null, qtDraft: '', qtErr: '', qtCmp: null, qtCanned: null, qtFocus: null });
  qtExpandTo(qtT(T.i), n.id); st.qtIb.add(n.id);
  st.qtScroll = 'node';
  setTimeout(() => { n.running = false; n.html = html; n.tok = 9e3 + qtTokTxt(html) * 20; if (st.thread === T.i) renderAll(); }, 2200);
}

/* ---------- start a thread from a branch ---------- */
function qtProOpen(T, id) {

}
const qtProSpaces = T => { const s = sp(T.p.s); if (isClosed(s)) return [[s.id, spName(s)]]; return [[s.id, spName(s)], ...JOINED.filter(id => id !== s.id && sp(id) && !isClosed(sp(id))).map(id => [id, spName(sp(id))])]; };
