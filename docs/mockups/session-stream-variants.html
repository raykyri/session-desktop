<title>Session Stream Variants</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: a control bar (variant, theme) over one framed app viewport. Each variant puts a chat or
   post stream in the middle and shows branches beside it. Colors are the spaces mockup's tokens
   (session-web-spaces.html), light first, with its dark values. */
:root {
  --page: #e9e6e1; --chrome: #f4f2ef; --pane: #fcfbf9; --feed: #f8f6f3; --card: #ffffff; --inset: #f5f2ee;
  --field: #ffffff; --control: #efece8; --control-hover: #e6e2dc; --control-border: #e0dbd4;
  --divider: #ebe7e2; --border-strong: #e1dcd6; --fill-subtle: rgba(0,0,0,.04); --fill-hover: rgba(0,0,0,.05);
  --accent: #0a6fb8; --accent-soft: rgba(11,127,209,.12); --accent-strong: #095c98; --on-accent: #ffffff;
  --t-heading: #121617; --t-primary: #23282a; --t-body: #33393b; --t-secondary: #4a5350; --t-muted: #5b625e;
  --t-faint: #686e6b; --t-dim: #9aa19d; --placeholder: #8e958f; --good: #2f8a4d; --warn: #9a6b12;
  --av1: #4a6a86; --av2: #77598c; --av3: #557a52; --av4: #93663f; --av5: #3d7778; --av6: #8a4f4f; --av-fg: #ffffff;
  --mark: rgba(60,40,20,.06);
  --shadow-soft: 0 3px 10px rgba(20,24,26,.05);
  --shadow: 0 1px 2px rgba(60,40,20,.06), 0 0 0 1px rgba(60,40,20,.05);
  --shadow-pop: 0 10px 28px rgba(20,24,26,.14);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-xs: 11.5px; --fs-sm: 12.5px; --fs-base: 13.5px; --fs-md: 14.5px; --fs-lg: 17px; --fs-xl: 21px;
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --page: #121110; --chrome: #171716; --pane: #1c1b1a; --feed: #1a1918; --card: #211f1e; --inset: #181716;
  --field: #232220; --control: #282827; --control-hover: #313130; --control-border: #3d3d3c;
  --divider: #2d2d2c; --border-strong: #373634; --fill-subtle: rgba(255,255,255,.05); --fill-hover: rgba(255,255,255,.06);
  --accent: #33adff; --accent-soft: rgba(51,173,255,.13); --accent-strong: #268fd6; --on-accent: #0f1413;
  --t-heading: #f4f3ec; --t-primary: #e7e7e2; --t-body: #d9ddd9; --t-secondary: #c4cbc6; --t-muted: #919994;
  --t-faint: #828b86; --t-dim: #5a615e; --placeholder: #6b726d; --good: #81c784; --warn: #d7a84f;
  --av1: #5b7a96; --av2: #8a6f9e; --av3: #6d8f6a; --av4: #a77b55; --av5: #4f8a8b; --av6: #9a6262; --av-fg: #f4f3ec;
  --mark: rgba(255,255,255,.07);
  --shadow-soft: 0 3px 10px rgba(0,0,0,.22);
  --shadow: 0 0 0 1px rgba(255,255,255,.06); --shadow-pop: 0 10px 28px rgba(0,0,0,.5);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121110; --chrome: #171716; --pane: #1c1b1a; --feed: #1a1918; --card: #211f1e; --inset: #181716;
  --field: #232220; --control: #282827; --control-hover: #313130; --control-border: #3d3d3c;
  --divider: #2d2d2c; --border-strong: #373634; --fill-subtle: rgba(255,255,255,.05); --fill-hover: rgba(255,255,255,.06);
  --accent: #33adff; --accent-soft: rgba(51,173,255,.13); --accent-strong: #268fd6; --on-accent: #0f1413;
  --t-heading: #f4f3ec; --t-primary: #e7e7e2; --t-body: #d9ddd9; --t-secondary: #c4cbc6; --t-muted: #919994;
  --t-faint: #828b86; --t-dim: #5a615e; --placeholder: #6b726d; --good: #81c784; --warn: #d7a84f;
  --av1: #5b7a96; --av2: #8a6f9e; --av3: #6d8f6a; --av4: #a77b55; --av5: #4f8a8b; --av6: #9a6262; --av-fg: #f4f3ec;
  --mark: rgba(255,255,255,.07);
  --shadow-soft: 0 3px 10px rgba(0,0,0,.22);
  --shadow: 0 0 0 1px rgba(255,255,255,.06); --shadow-pop: 0 10px 28px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--t-primary); font: 400 var(--fs-base)/1.5 var(--font);
  display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 16px; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ---- control bar ---- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-bottom: 10px; }
.bar h1 { margin: 0; font-size: var(--fs-md); font-weight: 700; color: var(--t-heading); letter-spacing: -.01em; }
.seg { display: inline-flex; background: var(--control); border-radius: var(--r-lg); padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { padding: 4px 10px; border-radius: var(--r-md); color: var(--t-secondary); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.seg button:hover { color: var(--t-heading); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--t-heading); box-shadow: var(--shadow); }
.seg button b { font-weight: 600; color: var(--t-faint); margin-right: 5px; font-variant-numeric: tabular-nums; }
.bar .grow { flex: 1; }
.thesis { margin: 0 0 10px; color: var(--t-secondary); font-size: var(--fs-sm); max-width: 110ch; }
.thesis strong { color: var(--t-heading); font-weight: 600; }

/* ---- frame ---- */
.frame { flex: 1; min-height: 0; display: flex; flex-direction: column; border-radius: var(--r-xl); overflow: hidden;
  background: var(--pane); box-shadow: var(--shadow), var(--shadow-pop); }
.frame-top { display: flex; align-items: center; gap: 12px; height: 30px; padding: 0 12px; background: var(--chrome); border-bottom: 1px solid var(--divider); flex: none; }
.dots { display: flex; gap: 6px; } .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); }
.frame-top span { flex: 1; text-align: center; font-size: var(--fs-xs); color: var(--t-faint); margin-right: 39px; }
#app { flex: 1; min-height: 0; position: relative; }
#app > div { height: 100%; }

/* ---- shared pieces ---- */
.av { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  color: var(--av-fg); font-size: 10.5px; font-weight: 600; letter-spacing: .02em; }
.av.sm { width: 20px; height: 20px; font-size: 8.5px; }
.av.xs { width: 16px; height: 16px; font-size: 7.5px; }
.avs { display: inline-flex; } .avs .av { box-shadow: 0 0 0 2px var(--pane); } .avs .av + .av { margin-left: -5px; }
.mark { width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; flex: none;
  background: var(--accent-soft); color: var(--accent); }
.mark svg { width: 16px; height: 16px; }
.mark.sm { width: 20px; height: 20px; border-radius: 6px; } .mark.sm svg { width: 12px; height: 12px; }
.who { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--t-faint); min-width: 0; }
.who b { color: var(--t-heading); font-weight: 600; }
.who .sp { color: var(--t-secondary); }
.prose { color: var(--t-body); font-size: var(--fs-base); line-height: 1.6; min-width: 0; overflow-wrap: anywhere; }
.prose > :first-child { margin-top: 0; } .prose > :last-child { margin-bottom: 0; }
.prose p { margin: 0 0 .7em; } .prose ul, .prose ol { margin: 0 0 .7em; padding-left: 1.3em; } .prose li { margin: .2em 0; }
.prose h4 { margin: 1em 0 .35em; font-size: var(--fs-base); color: var(--t-heading); font-weight: 600; }
.prose table { border-collapse: collapse; font-size: var(--fs-sm); margin: 0 0 .7em; display: block; overflow-x: auto; }
.prose th, .prose td { border-bottom: 1px solid var(--divider); padding: 4px 8px; text-align: left; }
.prose sup.cite { font-size: 9.5px; color: var(--accent); font-weight: 600; margin-left: 1px; }
.prose .pending { color: var(--t-faint); }
.clamp { max-height: 9.6em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.clamp.s { max-height: 4.8em; }
.open > .clamp, .clamp.open { max-height: none; -webkit-mask-image: none; mask-image: none; }
.tlink { color: var(--accent); font-size: var(--fs-sm); font-weight: 500; }
.tlink:hover { text-decoration: underline; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 13px;
  background: var(--control); color: var(--t-secondary); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.chip:hover { background: var(--control-hover); color: var(--t-heading); }
.chip.on { background: var(--accent-soft); color: var(--accent); }
.chip .muted { color: var(--t-faint); font-weight: 400; }
.label { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--t-faint); }
.iconbtn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: var(--r-md); color: var(--t-muted); flex: none; }
.iconbtn:hover { background: var(--fill-hover); color: var(--t-heading); }
.composer { display: flex; gap: 8px; align-items: center; background: var(--field); border: 1px solid var(--control-border);
  border-radius: 20px; padding: 4px 4px 4px 14px; }
.composer:focus-within { border-color: var(--accent); }
.composer input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 6px 0; font-size: var(--fs-base); }
.composer input::placeholder { color: var(--placeholder); }
.composer button { height: 30px; padding: 0 12px; border-radius: 15px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: var(--fs-sm); }
.composer .ctx { font-size: var(--fs-xs); color: var(--t-faint); white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--warn); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .status::before, .fadein { animation: none !important; } }
.scroll { overflow-y: auto; overscroll-behavior: contain; }
.empty { color: var(--t-faint); font-size: var(--fs-sm); padding: 8px 0; }
.dayrule { display: flex; align-items: center; gap: 10px; color: var(--t-faint); font-size: var(--fs-xs); font-weight: 600; margin: 18px 0 6px; }
.dayrule::before, .dayrule::after { content: ""; flex: 1; height: 1px; background: var(--divider); }
.fadein { animation: fadein .25s ease; } @keyframes fadein { from { opacity: 0; transform: translateY(3px); } }

.reply { display: grid; grid-template-columns: 20px minmax(0,1fr); gap: 8px; padding: 8px 0; }
.reply p { margin: 2px 0 0; color: var(--t-body); }
.reply .kids { grid-column: 2; margin-top: 4px; padding-left: 12px; border-left: 1.5px solid var(--border-strong); }
/* ---- one scroll, rows of [post] [margin] ---- */
.mg { height: 100%; overflow-y: auto; background: var(--feed); }
.mg-inner { max-width: 1180px; margin: 0 auto; padding: 0 24px 60px; }
.tabs { position: sticky; top: 0; z-index: 10; display: flex; gap: 4px; padding: 12px 0; background: var(--feed); overflow-x: auto; }
.tabs button { padding: 5px 10px; border-radius: 14px; font-size: var(--fs-sm); color: var(--t-secondary); font-weight: 500; white-space: nowrap; }
.tabs button:hover { background: var(--fill-hover); }
.tabs button[aria-current="true"] { background: var(--t-heading); color: var(--feed); }
.row { display: grid; grid-template-columns: minmax(0, 600px) minmax(0, 330px); gap: 28px; padding: 14px 0; justify-content: center; }
.card { background: var(--card); border-radius: var(--r-xl); box-shadow: var(--shadow); padding: 18px 20px 12px; min-width: 0; transition: opacity .2s; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.card h2 { margin: 0 0 8px; font-size: var(--fs-xl); line-height: 1.25; letter-spacing: -.015em; color: var(--t-heading); text-wrap: balance; }
.card .ask { margin: 0 0 14px; color: var(--t-secondary); font-size: var(--fs-md); }
.card .post { margin: 0 0 6px; color: var(--t-primary); font-size: var(--fs-lg); line-height: 1.45; }
.card .byline { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: var(--fs-sm); color: var(--t-faint); }
/* the footer sits at the bottom of the card when the margin makes the row taller */
.card { display: flex; flex-direction: column; }
.card > :nth-last-child(2) { margin-bottom: 12px; }
.card-f { display: flex; align-items: center; gap: 4px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--divider); }
.card-f .notes { font-weight: 600; color: var(--t-heading); font-size: var(--fs-sm); margin-right: auto; }
.card-f .notes span { color: var(--t-faint); font-weight: 400; }
.mgn { min-width: 0; position: relative; }
.mgn .label { display: block; margin: 2px 0 8px; }
.stick { position: sticky; top: 58px; max-height: calc(100vh - 150px); overflow-y: auto; padding: 2px 2px 8px 0; }

/* pinned drawings: placed at the height of the passage they belong to */
.mgn .composer { margin-top: 8px; }
.pinned > .pin { position: absolute; left: 0; right: 0; }
.grp { padding: 2px 0 4px 8px; border-left: 1.5px solid var(--border-strong); transition: border-color .15s; }
.grp.hl { border-left-color: color-mix(in srgb, var(--accent) 30%, var(--border-strong)); }
.grp .preview { margin: 6px 0 4px 8px; }
/* passages with branches are marked at all times, in a neutral tint */
.prose [data-grp] { background: var(--mark); box-shadow: -6px 0 0 var(--mark), 6px 0 0 var(--mark); border-radius: 2px; }
.anc { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; padding: 0 6px; height: 18px; border-radius: 9px; vertical-align: 1px;
  background: var(--accent-soft); color: var(--accent); font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.anc svg.i { width: 11px; height: 11px; }
.qtag { display: inline-block; margin-right: 8px; padding: 1px 7px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .02em; }

/* outline (Pinned map) */
.graph { position: relative; }
.graph svg { position: absolute; inset: 0; width: 100%; overflow: visible; pointer-events: none; }
.graph svg path { fill: none; stroke: var(--border-strong); stroke-width: 1.5; }
.graph svg path.on { stroke: var(--accent); stroke-width: 2; }
.graph svg circle { fill: var(--feed); stroke: var(--t-dim); stroke-width: 1.5; }
.graph svg circle.on { fill: var(--accent); stroke: var(--accent); }
.graph svg circle.sel { fill: var(--accent); stroke: var(--accent-soft); stroke-width: 5; }
.grow-r { position: relative; display: block; width: 100%; text-align: left; height: 26px; border-radius: var(--r-md); padding-right: 6px; white-space: nowrap; overflow: hidden; }
.grow-r:hover { background: var(--fill-hover); }
.grow-r .gq { display: block; font-size: var(--fs-sm); color: var(--t-secondary); overflow: hidden; text-overflow: ellipsis; line-height: 26px; }
.grow-r.on .gq, .grp.hl .grow-r .gq { color: var(--t-heading); }
.grow-r.on .gq { font-weight: 600; }
.preview { margin-top: 10px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--card); box-shadow: var(--shadow); }
.preview .rq { margin: 4px 0 8px; font-size: var(--fs-base); font-weight: 600; color: var(--t-heading); line-height: 1.4; }
.preview .prose { font-size: var(--fs-sm); max-height: 260px; overflow-y: auto; }
.preview .pf { display: flex; gap: 12px; margin-top: 8px; font-size: var(--fs-xs); color: var(--t-faint); align-items: center; }

/* Layers */
.laygrp { border-left: 0; padding-left: 0; }
.lay { position: relative; padding: 0 calc(var(--k) * 7px) calc(var(--k) * 7px) 0; }
.lay-back { position: absolute; top: 0; left: 0; right: calc(var(--k) * 7px); bottom: calc(var(--k) * 7px); border-radius: var(--r-lg);
  background: var(--card); box-shadow: var(--shadow); transform: translate(calc(var(--i) * 7px), calc(var(--i) * 7px)); opacity: calc(1 - var(--i) * .25); z-index: calc(4 - var(--i)); }
.lay-front.tap { cursor: pointer; }
.lay-front { position: relative; z-index: 5; background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow), var(--shadow-soft); padding: 10px 12px 12px; }
.grp.hl .lay-front { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent), var(--shadow-soft); }
.lay-front .rq { margin: 4px 0 4px; font-size: var(--fs-base); font-weight: 600; color: var(--t-heading); line-height: 1.4; }
.lay-front .lay-s { margin: 0; font-size: var(--fs-sm); color: var(--t-secondary); line-height: 1.45; }
.lay-front .prose { font-size: var(--fs-sm); max-height: 240px; overflow-y: auto; }
.lay-acts { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.lay-kids { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.lay-kid { display: flex; align-items: flex-start; gap: 6px; text-align: left; padding: 6px 9px; border-radius: var(--r-md); background: var(--inset); font-size: var(--fs-sm); color: var(--t-heading); line-height: 1.35; }
.lay-kid:hover { background: var(--fill-hover); }
.lay-kid svg.i { color: var(--accent); margin-top: 2px; }
.lay-kid span { min-width: 0; }
.lay-sibs { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; font-size: var(--fs-xs); color: var(--t-faint); }
.lay-sibs button { width: 20px; height: 20px; border-radius: 50%; font-size: 10.5px; font-weight: 600; background: var(--control); color: var(--t-secondary); }
.lay-sibs button.on { background: var(--accent); color: var(--on-accent); }


@media (max-width: 860px) {
  .row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .stick { position: static; max-height: none; }
  .pinned > .pin { position: static; margin-bottom: 8px; }
  .mg-inner { padding: 0 12px 30px; }
  .mgn { padding-left: 12px; }
}
</style>

<script>
'use strict';
/* Data: the spaces mockup's fixtures. A thread (post) is an ask with the agent's answer, or a plain post
   with replies. An ask's branches are its follow-ups (fu) and, where it has one, its ask tree (qtd): nodes
   whose `par` is 'r' (the answer) or another node. Asking a branch here adds a local node with a mock
   pending answer. */
const F = window.SessionFixtures, D = F.data, NOW = Date.parse(F.clock);
const SP = Object.fromEntries(D.spaces.map(s => [s.id, s]));
const USERS = { 'ines.v': 2, hal_b: 4, 'jun.park': 5, oduya: 6, sol: 3, lettie: 1, mira_k: 2, tomasz: 4 };
const EXTRA = {};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const strip = h => String(h || '').replace(/<sup[^>]*>.*?<\/sup>/g, '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const clip = (s, n) => (s = String(s || '')).length > n ? s.slice(0, n - 1).replace(/[\s,;:.]+\S*$/, '') + '…' : s;
const rel = iso => { const m = (NOW - Date.parse(iso)) / 6e4; if (m < 1) return 'now'; if (m < 60) return Math.round(m) + 'm'; const h = m / 60; if (h < 24) return Math.round(h) + 'h'; const d = h / 24; if (d < 7) return Math.round(d) + 'd'; if (d < 30) return Math.round(d / 7) + 'w'; return Math.round(d / 30) + 'mo'; };

const asTyped = (p, id, text) => (st.data === 'prompts' && PROMPTS[p.id]?.[id === 'r' ? 'q' : id]) || text;

function tree(p) {
  const fu = D.fu[p.id] || [], qt = D.qtd[p.id];
  const nodes = { r: { id: 'r', par: null, u: p.u, createdAt: p.createdAt, q: asTyped(p, 'r', p.q), q0: p.q, t: p.t, html: D.rich[p.id] || (p.sum ? `<p>${esc(p.sum)}</p>` : ''), sum: p.sum || '', tok: p.tok } };
  const list = qt ? qt.nodes : fu.map((f, i) => ({ id: 'f' + i, par: 'r', fu: i }));
  for (const n of [...list, ...(EXTRA[p.id] || [])]) {
    const f = n.fu != null ? fu[n.fu] : null;
    nodes[n.id] = { id: n.id, par: n.par, u: n.u || f?.u, createdAt: n.createdAt || f?.createdAt, q: asTyped(p, n.id, n.q || f?.q || ''), q0: n.q || f?.q || '', html: n.html || f?.html || (f?.a ? `<p>${esc(f.a)}</p>` : ''), sum: f?.a || '', tok: n.tok || 0, pending: n.pending };
  }
  const kids = {};
  for (const id in nodes) { const n = nodes[id]; if (n.par) (kids[n.par] ||= []).push(n); }
  for (const k in kids) kids[k].sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1));
  const T = {
    p, nodes, count: Object.keys(nodes).length - 1,
    kids: id => kids[id] || [],
    desc: id => (kids[id] || []).reduce((s, c) => s + 1 + T.desc(c.id), 0),
    path(id) { const a = []; let n = nodes[id]; while (n) { a.unshift(n); n = nodes[n.par]; } return a; },
    users() { return [...new Set(Object.values(nodes).filter(n => n.id !== 'r').map(n => n.u))]; },
    last() { return Object.values(nodes).reduce((m, n) => (n.createdAt > m ? n.createdAt : m), p.createdAt); },
    dfs(id = 'r', d = 0, out = []) { out.push({ n: nodes[id], d }); for (const c of T.kids(id)) T.dfs(c.id, d + 1, out); return out; },
    leaf(id) { let n = nodes[id]; while (T.kids(n.id).length) n = T.kids(n.id)[0]; return n.id; },
  };

}

/* ---- passage matching: the fixtures do not store the passage a branch came from, so the mock picks
   the paragraph that shares the most words with the branch question and its answer ---- */
const STOP = new Set('what which does with that this from have there their about would could should into than then they them were been being where when your more most other some such only also over just like very many much does show give list same each these those here after before because between under while whether'.split(' '));
const words = s => new Set((strip(s).toLowerCase().match(/[a-z0-9]{4,}/g) || []).filter(w => !STOP.has(w)));
const overlap = (w, text) => { const bw = words(text); let sc = 0; w.forEach(x => { if (bw.has(x)) sc++; }); return sc / Math.sqrt(bw.size + 6); };
function blocksOf(prose) { return [...prose.querySelectorAll(':scope > p, :scope > ul > li, :scope > ol > li, :scope > h4, :scope > table')]; }
function bestBlock(blocks, text) { const w = words(text); let best = 0, bi = 0; blocks.forEach((b, i) => { if (b.tagName === 'H4') return; const sc = overlap(w, b.textContent); if (sc > best) { best = sc; bi = i; } }); return bi; }
/* Group the answer's top-level branches by the paragraph they belong to, in reading order. */
function groupsFor(p, prose) {
  const T = tree(p), blocks = blocksOf(prose), by = new Map();
  for (const n of T.kids('r')) { const bi = bestBlock(blocks, n.q0 + ' ' + summ(n)); if (!by.has(bi)) by.set(bi, []); by.get(bi).push(n); }
  return [...by.entries()].sort((a, b) => a[0] - b[0]).map(([bi, ns], gi) => ({ g: 't' + p.id + '-' + bi, bi, block: blocks[bi], ns, gi, total: ns.reduce((s, n) => s + 1 + T.desc(n.id), 0) }));
}
/* Place margin items at their anchor's height; push down to avoid overlap; grow the margin to fit. */
function place(margin, items) {

  items.map(it => ({ ...it, t: it.anchor.getBoundingClientRect().top - top0 })).sort((a, b) => a.t - b.t).forEach(it => {
    const t = Math.max(it.t, y); it.el.style.top = t + 'px'; y = t + it.el.offsetHeight + 12;
  });
  margin.style.minHeight = y + 'px';
}
const narrow = () => matchMedia('(max-width: 860px)').matches;
const badge = (b, g, total) => { b.dataset.grp = g; b.insertAdjacentHTML('beforeend', `<span class="anc" aria-label="${noun(total, 'branch', 'branches')} on this passage">${I.branch}${total}</span>`); };
const onPath = (p, T) => { const s = st.sel[p.id]; return new Set(s && T.nodes[s] ? T.path(s).map(n => n.id) : []); };
const inGroup = (T, ns, id) => !!id && T.nodes[id] && ns.some(n => T.path(id).some(x => x.id === n.id));

/* Pin one drawing per paragraph. draw(T, group) returns the drawing's HTML. */
function pinGroups(p, draw, cls = '') {
  const prose = document.getElementById('pr-' + p.id), margin = document.getElementById('mr-' + p.id);

  const T = tree(p), items = [];

/* ---- drawings ---- */
function outline(p, T, G) {

      <div class="who" title="${esc(n.u)}">${av(n.u, 'xs')}</div><p class="rq">${esc(n.q)}</p>${status(n)}
      ${open ? `<div class="prose">${answerHtml(n)}</div>` : `<p class="lay-s">${esc(clip(summ(n), 150))}</p>`}
      <div class="lay-acts">${d > 1 ? `<button class="chip" data-a="layer" data-g="${G.g}" data-id="${p.id}" data-node="${n.par}">${I.left}Up a layer</button>` : ''}<button class="tlink" data-a="tsel" data-id="${p.id}" data-node="${id}">${open ? 'Show less' : 'Read the answer'}</button></div>
      ${kids.length ? `<div class="lay-kids">${kids.map(c => `<button class="lay-kid" data-a="layer" data-g="${G.g}" data-id="${p.id}" data-node="${c.id}">${I.deeper}<span>${esc(c.q)}</span></button>`).join('')}</div>` : ''}
      ${st.asking === p.id && open ? composer('mf:' + p.id + ':' + id, 'Ask a branch question') : ''}</div></div>`;
}

const V = {
  pinned: {
    name: 'Pinned map',
    q: 'Structure',
    thesis: '<strong>Structure: an outline beside each passage.</strong> Each paragraph that has branches is shaded and gets its own small tree, drawn as a line graph with one row per branch. Click a row to read it under its tree.',
    layout(p) { pinGroups(p, (T, G) => outline(p, T, G)); },
  },
  layers: {
    name: 'Layers',
    q: 'Depth',
    thesis: '<strong>Depth as a stack.</strong> Each passage holds a stack of cards. The front card is the branch you are on and the cards behind it are the layers below it. Click the card to read its answer, follow an arrow to go one layer deeper, or go back up; the stack shrinks as you reach the bottom.',
    layout(p) { pinGroups(p, (T, G) => layers(p, T, G), 'laygrp'); },
  },
};

/* ---- shell ---- */
const ORDER = Object.keys(V);
const app = $('#app');
let lastV = null;
function render() {
  const v = V[st.v], first = lastV !== st.v, sc = $('#k-mg'), top = sc && !first ? sc.scrollTop : 0;
  const tabs = [['home', 'Home'], ...spacesWithPosts.filter(x => x.id !== 'sablefield').map(x => [x.id, spName(x.id)])];
  const posts = streamFor(st.space);
  app.innerHTML = `<div class="mg" id="k-mg"><div class="mg-inner"><nav class="tabs">${tabs.map(([id, l]) => `<button data-a="space" data-id="${id}" aria-current="${st.space === id}">${esc(l)}</button>`).join('')}</nav>
    ${posts.map(p => `<div class="row">${card(p)}<aside class="mgn">${p.k === 'post' ? `<div class="stick">${repliesMargin(p)}</div>` : `<div class="pinned" id="mr-${p.id}"></div>`}</aside></div>`).join('')}</div></div>`;
  const mg = $('#k-mg');
  mg.scrollTop = top;
  streamFor(st.space).forEach(p => p.k === 'ask' && v.layout(p));
  mg.scrollTop = top;
  lastV = st.v;
}
function renderBar() {
  $('#variant-seg').innerHTML = ORDER.map((k, i) => `<button data-v="${k}" aria-pressed="${st.v === k}"><b>${String.fromCharCode(65 + i)}</b>${V[k].name}</button>`).join('');
  $('#data-seg').innerHTML = [['written', 'Written questions'], ['prompts', 'Typed prompts']].map(([k, l]) => `<button data-d="${k}" aria-pressed="${st.data === k}">${l}</button>`).join('');
  $('#theme-seg').innerHTML = [['system', 'System'], ['light', 'Light'], ['dark', 'Dark']].map(([k, l]) => `<button data-t="${k}" aria-pressed="${st.theme === k}">${l}</button>`).join('');
  $('#thesis').innerHTML = `<span class="qtag">${V[st.v].q}</span>` + V[st.v].thesis;
}
function go(v) { if (!V[v]) v = 'pinned'; st.v = v; st.asking = null; renderBar(); render(); }
$('#variant-seg').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { history.replaceState(null, '', '#' + b.dataset.v); go(b.dataset.v); } });
$('#data-seg').addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (!b) return; st.data = b.dataset.d; renderBar(); render(); });
$('#theme-seg').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; st.theme = b.dataset.t; if (st.theme === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = st.theme; renderBar(); });

app.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, d = t.dataset;
  if (a === 'space') { st.space = d.id; st.asking = null; render(); $('#k-mg').scrollTop = 0; return; }
  if (a === 'ask') { st.asking = st.asking === d.id ? null : d.id; st.sel[d.id] = null; render(); $(`[id^="in-mf\\:${d.id}"]`)?.focus(); return; }
  if (a === 'askfrom') { st.sel[d.id] = d.node; st.asking = d.id; render(); $(`[id^="in-mf\\:${d.id}"]`)?.focus(); return; }
  if (a === 'tsel') { st.sel[d.id] = st.sel[d.id] === d.node ? null : d.node; st.asking = null; render(); return; }
  if (a === 'layer') { st.layer[d.g] = d.node; st.sel[d.id] = null; render(); return; }
});
/* hover: outline the drawing under the pointer */
function hl(e, on) {
  const n = e.target.closest('[data-grp]');
  if (n) { const g = n.dataset.grp; app.querySelector(`[data-grp-box="${g}"]`)?.classList.toggle('hl', on); }
}
app.addEventListener('mouseover', e => hl(e, true));
app.addEventListener('mouseout', e => hl(e, false));
app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.closest('[data-form]'), inp = f.querySelector('input'), v = inp.value.trim(); if (!v) { inp.focus(); return; }
  const [, pid, node] = f.dataset.form.split(':'), p = byId(pid), nid = addBranch(p, node, v);
  st.sel[pid] = nid; if (st.v === 'layers') { const g = app.querySelector(`[data-form="${f.dataset.form}"]`)?.closest('[data-grp-box]')?.dataset.grpBox; if (g) st.layer[g] = nid; }
  st.asking = null; render();
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 150); });
window.addEventListener('hashchange', () => go(location.hash.slice(1)));
go(location.hash.slice(1) || 'pinned');
document.fonts?.ready.then(() => render());
</script>
