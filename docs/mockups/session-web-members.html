<title>Session Members</title>

<style>
/* Layout: a control bar (variant, theme) over one framed app viewport. Each variant puts a chat or
   post stream in the middle and shows branches beside it. Colors are the spaces mockup's tokens
   (session-web-spaces.html), light first, with its dark values. */
:root {
  --page: #e9e6e1; --chrome: #f4f2ef; --pane: #fcfbf9; --canvas: #f8f6f3; --card: #ffffff; --inset: #f5f2ee;
  --field: #ffffff; --control: #efece8; --control-hover: #e6e2dc; --control-border: #e0dbd4;
  --divider: #ebe7e2; --border-strong: #e1dcd6; --fill-subtle: rgba(0,0,0,.04); --fill-hover: rgba(0,0,0,.05);
  --accent: #0a6fb8; --accent-soft: rgba(11,127,209,.12); --accent-strong: #095c98; --on-accent: #ffffff; --on-accent-light: #ffffff;
  --t-heading: #121617; --t-primary: #23282a; --t-body: #33393b; --t-secondary: #4a5350; --t-muted: #5b625e;
  --t-faint: #686e6b; --t-dim: #9aa19d; --placeholder: #8e958f; --good: #2f8a4d; --warn: #9a6b12; --bad: #c0563f;
  --av1: #4a6a86; --av2: #77598c; --av3: #557a52; --av4: #93663f; --av5: #3d7778; --av6: #8a4f4f; --av-fg: #ffffff;
  --mark: rgba(60,40,20,.06);
  --shadow-soft: 0 3px 10px rgba(20,24,26,.05);
  --shadow: 0 1px 2px rgba(60,40,20,.06), 0 0 0 1px rgba(60,40,20,.05);
  --shadow-pop: 0 10px 28px rgba(20,24,26,.14);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --fs-xs: 11.5px; --fs-sm: 12.5px; --fs-base: 13.5px; --fs-md: 14.5px; --fs-lg: 17px; --fs-xl: 21px;
  --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  color-scheme: dark;
  --page: #121110; --chrome: #171716; --pane: #1c1b1a; --canvas: #1a1918; --card: #211f1e; --inset: #181716;
  --field: #232220; --control: #282827; --control-hover: #313130; --control-border: #3d3d3c;
  --divider: #2d2d2c; --border-strong: #373634; --fill-subtle: rgba(255,255,255,.05); --fill-hover: rgba(255,255,255,.06);
  --accent: #33adff; --accent-soft: rgba(51,173,255,.13); --accent-strong: #268fd6; --on-accent: #0f1413; --on-accent-light: #ffffff;
  --t-heading: #f4f3ec; --t-primary: #e7e7e2; --t-body: #d9ddd9; --t-secondary: #c4cbc6; --t-muted: #919994;
  --t-faint: #828b86; --t-dim: #5a615e; --placeholder: #6b726d; --good: #81c784; --warn: #d7a84f; --bad: #e0796d;
  --av1: #5b7a96; --av2: #8a6f9e; --av3: #6d8f6a; --av4: #a77b55; --av5: #4f8a8b; --av6: #9a6262; --av-fg: #f4f3ec;
  --mark: rgba(255,255,255,.07);
  --shadow-soft: 0 3px 10px rgba(0,0,0,.22);
  --shadow: 0 0 0 1px rgba(255,255,255,.06); --shadow-pop: 0 10px 28px rgba(0,0,0,.5);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #121110; --chrome: #171716; --pane: #1c1b1a; --canvas: #1a1918; --card: #211f1e; --inset: #181716;
  --field: #232220; --control: #282827; --control-hover: #313130; --control-border: #3d3d3c;
  --divider: #2d2d2c; --border-strong: #373634; --fill-subtle: rgba(255,255,255,.05); --fill-hover: rgba(255,255,255,.06);
  --accent: #33adff; --accent-soft: rgba(51,173,255,.13); --accent-strong: #268fd6; --on-accent: #0f1413; --on-accent-light: #ffffff;
  --t-heading: #f4f3ec; --t-primary: #e7e7e2; --t-body: #d9ddd9; --t-secondary: #c4cbc6; --t-muted: #919994;
  --t-faint: #828b86; --t-dim: #5a615e; --placeholder: #6b726d; --good: #81c784; --warn: #d7a84f; --bad: #e0796d;
  --av1: #5b7a96; --av2: #8a6f9e; --av3: #6d8f6a; --av4: #a77b55; --av5: #4f8a8b; --av6: #9a6262; --av-fg: #f4f3ec;
  --mark: rgba(255,255,255,.07);
  --shadow-soft: 0 3px 10px rgba(0,0,0,.22);
  --shadow: 0 0 0 1px rgba(255,255,255,.06); --shadow-pop: 0 10px 28px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--t-primary); font: 400 var(--fs-base)/1.5 var(--font);
  display: flex; flex-direction: column; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 16px; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }
svg.i { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* ---- control bar ---- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-bottom: 10px; }
.bar h1 { margin: 0; font-size: var(--fs-md); font-weight: 700; color: var(--t-heading); letter-spacing: -.01em; }
.seg { display: inline-flex; background: var(--control); border-radius: var(--r-lg); padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { padding: 4px 10px; border-radius: var(--r-md); color: var(--t-secondary); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.seg button:hover { color: var(--t-heading); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--t-heading); box-shadow: var(--shadow); }
.seg button b { font-weight: 600; color: var(--t-faint); margin-right: 5px; font-variant-numeric: tabular-nums; }
.bar .grow { flex: 1; }
.thesis { margin: 0 0 10px; color: var(--t-secondary); font-size: var(--fs-sm); max-width: 110ch; }
.thesis strong { color: var(--t-heading); font-weight: 600; }

/* ---- frame ---- */
.frame { flex: 1; min-height: 0; display: flex; flex-direction: column; border-radius: var(--r-xl); overflow: hidden;
  background: var(--pane); box-shadow: var(--shadow), var(--shadow-pop); }
.frame-top { display: flex; align-items: center; gap: 12px; height: 30px; padding: 0 12px; background: var(--chrome); border-bottom: 1px solid var(--divider); flex: none; }
.dots { display: flex; gap: 6px; } .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--border-strong); }
.frame-top span { flex: 1; text-align: center; font-size: var(--fs-xs); color: var(--t-faint); margin-right: 39px; }
#app { flex: 1; min-height: 0; position: relative; }
/* fullscreen: only the app, edge to edge */
.fsbtn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--r-lg); background: var(--control); color: var(--t-secondary); font-size: var(--fs-sm); font-weight: 500; }
.fsbtn:hover { color: var(--t-heading); }
.fsexit { display: none; }
body.fs { padding: 0; }
body.fs > .bar, body.fs > .mockbar, body.fs > .thesis, body.fs .frame-top { display: none; }
body.fs .frame { border-radius: 0; box-shadow: none; }
body.fs .fsexit { display: block; position: fixed; z-index: 100; top: 8px; left: 50%; transform: translate(-50%, -150%); padding: 6px 12px; border-radius: 16px; background: var(--t-heading); color: var(--canvas); font-size: var(--fs-xs); font-weight: 600; opacity: 0; transition: transform .15s, opacity .15s; }
body.fs .fsexit:focus-visible, body.fs.fs-peek .fsexit { transform: translate(-50%, 0); opacity: .92; }
#app > div { height: 100%; }

/* ---- shared pieces ---- */
.av { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  color: var(--av-fg); font-size: 10.5px; font-weight: 600; letter-spacing: .02em; padding-top: 1px; }  /* initials sit .5px below center */
.av.sm { width: 20px; height: 20px; font-size: 8.5px; }
.av.xs { width: 16px; height: 16px; font-size: 7.5px; padding-top: 0; }
.avs { display: inline-flex; } .avs .av { box-shadow: 0 0 0 2px var(--pane); } .avs .av + .av { margin-left: -5px; }
.mark { width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; flex: none;
  background: var(--accent-soft); color: var(--accent); }
.mark svg { width: 16px; height: 16px; }
.mark.sm { width: 20px; height: 20px; border-radius: 6px; } .mark.sm svg { width: 12px; height: 12px; }
.who { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--t-faint); min-width: 0; }
.who b { color: var(--t-heading); font-weight: 600; }
.who .sp { color: var(--t-secondary); }
.prose { color: var(--t-body); font-size: var(--fs-base); line-height: 1.6; min-width: 0; overflow-wrap: anywhere; }
.prose > :first-child { margin-top: 0; } .prose > :last-child { margin-bottom: 0; }
.prose p { margin: 0 0 .7em; } .prose ul, .prose ol { margin: 0 0 .7em; padding-left: 1.3em; } .prose li { margin: .2em 0; }
.prose h4 { margin: 1em 0 .35em; font-size: var(--fs-base); color: var(--t-heading); font-weight: 600; }
.prose table { border-collapse: collapse; font-size: var(--fs-sm); margin: 0 0 .7em; display: block; overflow-x: auto; }
.prose th, .prose td { border-bottom: 1px solid var(--divider); padding: 4px 8px; text-align: left; }
.prose sup.cite { font-size: 9.5px; color: var(--accent); font-weight: 600; margin-left: -1px; cursor: pointer; padding: 0 1px; border-radius: 3px; }
.prose sup.cite:hover, .prose sup.cite:focus-visible { background: color-mix(in srgb, var(--accent) 16%, transparent); outline: none; }
#citepop { position: absolute; z-index: 26; width: 260px; padding: 10px 12px; border-radius: var(--r-lg); background: var(--card); box-shadow: var(--shadow), var(--shadow-pop, 0 6px 20px rgba(0,0,0,.18)); font-size: var(--fs-xs); color: var(--t-secondary); }
#citepop .cp-h { display: flex; gap: 8px; align-items: baseline; }
#citepop .cp-n { flex: none; min-width: 16px; height: 16px; border-radius: 4px; display: inline-grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-weight: 600; font-size: 10px; }
#citepop b { color: var(--t-heading); font-size: var(--fs-sm); font-weight: 600; line-height: 1.35; }
#citepop p { margin: 3px 0 0 24px; line-height: 1.4; }
#citepop a { display: inline-block; margin: 3px 0 0 24px; color: var(--accent); }
.prose .pending { color: var(--t-faint); }
.clamp { max-height: 9.6em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.clamp.s { max-height: 4.8em; }
.open > .clamp, .clamp.open { max-height: none; -webkit-mask-image: none; mask-image: none; }
.tlink { color: var(--accent); font-size: var(--fs-sm); font-weight: 500; }
.tlink:hover { text-decoration: underline; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 13px;
  background: var(--control); color: var(--t-secondary); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.chip:hover { background: var(--control-hover); color: var(--t-heading); }
.chip.on { background: var(--accent-soft); color: var(--accent); }
.chip .muted { color: var(--t-faint); font-weight: 400; }
.label { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--t-faint); }
.iconbtn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: var(--r-md); color: var(--t-muted); flex: none; }
.iconbtn:hover { background: var(--fill-hover); color: var(--t-heading); }
.composer { display: flex; gap: 8px; align-items: flex-end; background: var(--field); border: 1px solid var(--control-border);
  border-radius: 20px; padding: 4px 4px 4px 15px; }
.composer:focus-within { border-color: var(--accent); }
.composer textarea { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 6px 0; font: inherit; font-size: var(--fs-base); line-height: 1.4; color: inherit; resize: none; max-height: 160px; }
.composer textarea::placeholder { color: var(--placeholder); }
.row.new-row { padding: 15px 0 0; }
.row.new-row + .row { padding-top: 14px; }
/* composer parts */
.nb { min-width: 0; }
.nb-dock > .av, .nb-dock > textarea { position: relative; top: -1px; }
.nb textarea { display: block; width: 100%; resize: none; border: 0; outline: none; background: none; color: var(--t-heading); font: inherit; font-size: var(--input-fs, var(--fs-md)); line-height: 1.5; padding: 3px 0; min-height: 28px; max-height: 240px; }
.nb textarea::placeholder { color: var(--placeholder); }
.nb-f { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
.pick { position: relative; display: inline-flex; align-items: center; height: 26px; padding: 0 22px 0 9px; border-radius: 13px; background: var(--control); flex: none; }
.pick:hover { background: var(--control-hover); }
.pick:focus-within { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 45%, transparent); }
.pick > span { color: var(--t-secondary); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; }
.pick select { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; font-size: var(--fs-sm); }
.pick svg.i { position: absolute; right: 7px; width: 12px; height: 12px; pointer-events: none; color: var(--t-muted); }
.pick.static { padding-right: 9px; color: var(--t-secondary); font-size: var(--fs-sm); font-weight: 500; }
.send { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; background: var(--accent-strong); color: var(--on-accent-light); transition: background .15s, color .15s; }
.send svg.i { width: 15px; height: 15px; stroke-width: 1.8; }
.nb:not(.has-text) .send, .nb:not(.has-text) .primary { background: var(--control); color: var(--t-dim); }
.ghost { height: 30px; padding: 0 12px; border-radius: 15px; color: var(--t-secondary); font-weight: 500; font-size: var(--fs-sm); flex: none; }
.ghost:hover { background: var(--fill-hover); color: var(--t-heading); }
.primary { height: 30px; padding: 0 16px; border-radius: 15px; background: var(--accent-strong); color: var(--on-accent-light); font-weight: 600; font-size: var(--fs-sm); flex: none; transition: background .15s, color .15s; }
.modes { display: inline-flex; background: var(--control); border-radius: 13px; padding: 2px; flex: none; }
.modes button { height: 22px; padding: 0 10px; border-radius: 11px; font-size: var(--fs-xs); font-weight: 500; color: var(--t-muted); }
.modes button[aria-pressed="true"] { background: var(--card); color: var(--t-heading); box-shadow: var(--shadow); }
/* Dock: a chat-style bar at the head of the stream, in the flow of the page */
.row.dock-row { padding: 2px 0 0; }
.row.dock-row + .row { padding-top: 14px; }
.nb-dock { display: flex; align-items: center; gap: 8px; background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 7px 7px 7px 13px; transition: box-shadow .15s; }
.nb-dock:focus-within { box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent), var(--shadow-soft); }
.nb-dock textarea { flex: 1; min-width: 0; }
/* model menu */
.mpick { position: relative; display: inline-flex; }
.mpick > .pick { cursor: pointer; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; min-width: 190px; padding: 4px; border-radius: var(--r-lg);
  background: var(--card); box-shadow: var(--shadow), var(--shadow-pop); display: flex; flex-direction: column; }
.mi { position: relative; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: var(--r-md); text-align: left;
  font-size: var(--fs-sm); color: var(--t-primary); cursor: pointer; white-space: nowrap; }
.mi > span:not(.glyph):not(.mi-v) { flex: 1; }
.mi > .glyph { flex: none; line-height: 1; }
.mi:hover, .mi:focus-visible, .mi-sub:focus-within { background: var(--fill-hover); }
.mi svg.i { width: 13px; height: 13px; color: var(--accent); }
.mi-sub > svg.i { color: var(--t-muted); }
.mi-v { color: var(--t-faint); }
.menu-scroll { max-height: min(460px, 62vh); overflow-y: auto; min-width: 210px; padding: 6px; }
.menu-scroll .mi { flex: none; height: 32px; gap: 10px; padding: 0 12px 0 10px; }
.glyph { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; color: var(--av-fg); font-size: 10px; font-weight: 700; flex: none; }
.mi .glyph { width: 16px; height: 16px; font-size: 9px; border-radius: 4px; }
.msep { height: 1px; margin: 4px 6px; background: var(--divider); }
.submenu { display: none; top: -4px; left: calc(100% + 4px); min-width: 140px; }
.mi-sub:hover > .submenu, .mi-sub:focus-within > .submenu { display: flex; }
@media (max-width: 600px) { .nb .mpick .menu { left: auto; right: 0; max-width: calc(100vw - 40px); } .submenu { position: static; box-shadow: none; padding: 2px 0 0 10px; min-width: 0; } .mi-sub { flex-wrap: wrap; height: auto; min-height: 30px; } .mi-sub:hover > .submenu, .mi-sub:focus-within > .submenu { display: flex; flex-basis: 100%; } }
.mi-sub::after { content: ""; position: absolute; left: 100%; top: 0; width: 8px; height: 100%; }
/* "..." menu */
.more { margin-left: auto; align-self: center; }
.more-btn { width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: var(--r-md); color: var(--t-faint); }
.mpick.more { height: 20px; align-items: center; }
fieldset.nb-off { border: 0; padding: 0; margin: 0; min-width: 0; }
.nb-offw { position: relative; }
.nb-cover { position: absolute; inset: 0; z-index: 2; cursor: pointer; background: none; border-radius: 22px; }
.nb-cover:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nb-offw:hover .nb { opacity: .75; }
.nb-off .nb { opacity: .6; }
.nb-off textarea::placeholder { color: var(--t-faint); }
.av.guest { background: color-mix(in srgb, var(--t-faint) 55%, var(--control)); }
.more-btn:hover, .more-btn[aria-expanded="true"] { background: var(--fill-hover); color: var(--t-heading); }
.card-h .who { flex: 1; }
.mi.danger { color: var(--bad); }
.mi-off { cursor: default; height: auto; padding: 7px 10px; color: var(--t-faint); }
.mi-off small { display: block; font-size: var(--fs-xs); margin-top: 1px; }
.mi-off:hover { background: none; }
/* Split · ends: avatar at the first line, controls at the last */
.nb-a { align-items: flex-end; }
.nb-a > .av { align-self: flex-start; margin-top: calc(var(--input-fs, 14.5px) * .75 - 7px); }
/* bottom-aligned items keep the same centres as the one-line bar: text and 26px pills sit on the 30px button's centre line */
/* one text line (font size x 1.5 + 6px padding) centred on the 26px controls: */
.nb-a > textarea { margin-bottom: calc(10px - var(--input-fs, 14.5px) * .75); }
.nb-bare { padding-left: 16px; }
/* Split */
.split { display: inline-flex; flex: none; }
.nb > .mpick.split { margin-right: 2px; }
.split :is(.split-main, .split-more) { transition: background .15s, color .15s, opacity .15s, box-shadow .15s; }
.split-main svg.i { width: 14px; height: 14px; display: block; }
.split-main { height: 26px; padding: 0 7px 0 10px; border-radius: 13px 0 0 13px; background: var(--accent-strong); color: var(--on-accent-light); font-weight: 600; font-size: var(--fs-sm); }
.split-more { height: 26px; width: 24px; display: inline-grid; place-items: center; border-radius: 0 13px 13px 0; background: var(--accent-strong); color: var(--on-accent-light); box-shadow: inset 1px 0 0 color-mix(in srgb, var(--on-accent-light) 16%, transparent); }
.split-main:disabled { cursor: default; }
.split-more svg.i { width: 13px; height: 13px; }
/* Empty composer: the button stays blue at 45% opacity until there is text */
.btn-faded:not(.has-text) :is(.split-main, .split-more) { opacity: .45; }
.menu.right { left: auto; right: 0; }
.mi-2 { height: auto; padding: 7px 10px; align-items: flex-start; }
.mi-2 b { display: block; font-weight: 500; color: var(--t-heading); }
.mi-2 small { display: block; font-size: var(--fs-xs); color: var(--t-faint); margin-top: 1px; }
.mi-2 svg.i { margin-top: 3px; }
.mi-2 > .mi-ic { flex: none !important; display: inline-grid; place-items: center; width: 16px; height: 18px; }
.mi-2 > .mi-ic svg.i { width: 14px; height: 14px; margin-top: 0; color: var(--t-muted); }
.mi-2[aria-checked="true"] > .mi-ic svg.i { color: var(--t-heading); }
.composer button { height: 30px; padding: 0 12px; border-radius: 15px; background: var(--accent-strong); color: var(--on-accent-light); font-weight: 600; font-size: var(--fs-sm); }
.composer .ctx { font-size: var(--fs-xs); color: var(--t-faint); white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--warn); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .status::before, .fadein { animation: none !important; } }
.scroll { overflow-y: auto; overscroll-behavior: contain; }
.empty { color: var(--t-faint); font-size: var(--fs-sm); padding: 8px 0; }
.dayrule { display: flex; align-items: center; gap: 10px; color: var(--t-faint); font-size: var(--fs-xs); font-weight: 600; margin: 18px 0 6px; }
.dayrule::before, .dayrule::after { content: ""; flex: 1; height: 1px; background: var(--divider); }
.fadein { animation: fadein .25s ease; } @keyframes fadein { from { opacity: 0; transform: translateY(3px); } }

/* ---- one scroll, rows of [post] [margin] ---- */
.mg { height: 100%; overflow-y: auto; background: var(--canvas); }
.mg-inner { max-width: 1180px; margin: 0 auto; padding: 0 24px 60px; }
.tabs { position: sticky; top: 0; z-index: 10; padding: 12px 0; background: var(--canvas);
  /* full-width band, with a hairline below it that fades in once the stream scrolls */
  box-shadow: 0 0 0 100vmax var(--canvas), 0 1px 0 100vmax transparent; clip-path: inset(0 -100vmax -1px); transition: box-shadow .2s ease; }
.tabs.scrolled { box-shadow: 0 0 0 100vmax var(--canvas), 0 1px 0 100vmax var(--divider); }
/* the tab row scrolls sideways; its edges fade where more tabs are hidden, instead of cutting a tab off */
.tabs-s { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; --fl: 0px; --fr: 0px;
  -webkit-mask-image: linear-gradient(to right, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent);
  mask-image: linear-gradient(to right, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent); }
.tabs-s::-webkit-scrollbar { display: none; }
.tabs button { flex: none; padding: 5px 10px; border-radius: 14px; font-size: var(--fs-sm); color: var(--t-secondary); font-weight: 500; white-space: nowrap; }
.tabs button:hover { background: var(--fill-hover); }
.tabs button[aria-current="true"] { background: var(--t-heading); color: var(--canvas); }
.row { display: grid; grid-template-columns: minmax(0, 600px) minmax(0, 330px); gap: 21px; padding: 14px 0; justify-content: center; }
.card { background: var(--card); border-radius: var(--r-xl); box-shadow: var(--shadow); padding: 18px 20px 11px; min-width: 0; transition: opacity .2s; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
/* post title: the title as a tree row */
.tt { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.tt > .ask, .tt > .post { flex: 1; min-width: 0; margin: 0 !important; }
.ttn { flex: none; width: 11px; height: 11px; margin-top: calc((var(--title-fs, var(--fs-md)) * 1.44 - 11px) / 2); border-radius: 50%; border: 1.5px solid var(--t-dim); background: var(--card); position: relative; z-index: 1; }
.ttav { flex: none; display: inline-flex; margin-top: calc((var(--title-fs, var(--fs-md)) * 1.44 - 20px) / 2); }
.tt .more { margin-left: -4px; margin-top: calc((var(--title-fs, var(--fs-md)) * 1.44 - 24px) / 2); align-self: flex-start; }
.ttm { font-size: var(--fs-xs); color: var(--t-faint); white-space: nowrap; }
.tt > .ttm { margin-top: calc((var(--title-fs, var(--fs-md)) * 1.44 - 16px) / 2); line-height: 16px; }
/* the title reads as a tree row: regular weight, the tree's text colour */
.card.tt-c .tt > .ask, .card.tt-c .tt > .post { font-weight: 400; color: var(--t-primary); }
.card.tt-c .byline, .card.tt-c > .prose { margin-left: 21px; }
.card .ask { margin: -1px 0 13px; color: var(--t-heading); font-size: var(--title-fs, var(--fs-md)); line-height: 1.44; }
.card .ask, .card .post { white-space: pre-line; }
.card .post { margin: 0 0 6px; color: var(--t-primary); font-size: var(--title-fs, var(--fs-md)); line-height: 1.44; }
.card .byline { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: var(--fs-sm); color: var(--t-faint); }
/* padding variants (the base values are on .card, .card-h, .card .ask and .card-f) */
.card.pad-compact { padding: 14px 16px 9px; }
.pad-compact .card-h { margin-bottom: 8px; }
.pad-compact .ask { margin-bottom: 9px !important; }
.pad-compact .byline { margin-bottom: 10px !important; }
.pad-compact > :nth-last-child(2) { margin-bottom: 10px !important; }
.pad-compact .card-f { padding-top: 7px; }
.card.pad-roomy { padding: 24px 28px 15px; }
.pad-roomy .card-h { margin-bottom: 16px; }
.pad-roomy .ask { margin-bottom: 17px !important; }
.pad-roomy .byline { margin-bottom: 16px !important; }
.pad-roomy > :nth-last-child(2) { margin-bottom: 18px !important; }
.pad-roomy .card-f { padding-top: 11px; }
.card.pad-inset { padding: 14px 14px 9px; }
.pad-inset .card-h { margin-left: -1px; }
.card.pad-even { padding: 18px 18px 17px; }
.pad-even .card-f { padding-top: 11px; }
/* avatar placements */
.card-h .av.sm { margin: 0 -2px 0 0; }
.card.av-gutter { padding-left: 10px; }
.card.av-gutter > :not(.card-h) { margin-left: 28px; }
.card.av-gutter .card-h { gap: 8px; }
.byl { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.byl .who { flex-wrap: nowrap; white-space: nowrap; }
.card.av-footer .card-f .notes { margin-left: 4px; }
.card.av-footer .card-f .more { margin-left: 2px; }
/* the footer sits at the bottom of the card when the margin makes the row taller */
.card { display: flex; flex-direction: column; }
.card > :nth-last-child(2) { margin-bottom: 13px; }
.tip { position: relative; display: inline-flex; cursor: default; border-radius: 6px; }
/* tooltip to the right of the icon, with a triangle pointing back at it */
.tip::after { content: attr(data-tip); position: absolute; left: calc(100% + 9px); top: 50%; z-index: 6; white-space: nowrap; pointer-events: none;
  padding: 4px 8px; border-radius: var(--r-md); background: var(--t-heading); color: var(--card); font-size: var(--fs-xs); font-weight: 500;
  opacity: 0; transform: translate(-3px, -50%); transition: opacity .12s, transform .12s; }
.tip::before { content: ""; position: absolute; left: calc(100% + 4px); top: 50%; z-index: 6; pointer-events: none;
  border-style: solid; border-width: 5px 5px 5px 0; border-color: transparent var(--t-heading) transparent transparent;
  opacity: 0; transform: translate(-3px, -50%); transition: opacity .12s, transform .12s; }
.tip:hover::after, .tip:focus-visible::after, .tip:hover::before, .tip:focus-visible::before { opacity: 1; transform: translate(0, -50%); }
.card-f { display: flex; align-items: center; gap: 4px; margin-top: auto; padding-top: 9px; border-top: 1px solid var(--divider); }
.card-f .notes { font-weight: 400; color: var(--t-muted); font-size: var(--fs-sm); margin-right: auto; }
.card-f .fmeta { color: var(--t-faint); padding-left: 4px; }
.iconbtn.cnt { width: auto; display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.iconbtn.likes { width: auto; display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.mgn { min-width: 0; position: relative; }
.mgn .label { display: block; margin: 2px 0 8px; }
.stick { position: sticky; top: calc(58px + 49px); max-height: calc(100vh - 150px); overflow-y: auto; padding: 2px 2px 8px 0; }

/* pinned drawings: placed at the height of the passage they belong to */
.mgn .composer { margin-top: 8px; }
.pinned > .pin { position: absolute; left: 0; right: 0; }
.grp { padding: 2px 0 4px 8px; border-left: 1.5px solid var(--border-strong); transition: border-color .15s; }
.grp.hl { border-left-color: color-mix(in srgb, var(--accent) 30%, var(--border-strong)); }
.grp .preview { margin: 10px 0 4px 8px; }
/* passages with branches are marked at all times, in a neutral tint */
.prose [data-grp] { background: var(--mark); box-shadow: -6px 0 0 var(--mark), 6px 0 0 var(--mark); border-radius: 2px; }
.anc { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; padding: 0 6px; height: 18px; border-radius: 9px; vertical-align: 1px;
  background: var(--accent-soft); color: var(--accent); font-size: 10.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.anc svg.i { width: 11px; height: 11px; }
.qtag { display: inline-block; margin-right: 8px; padding: 1px 7px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .02em; }

/* outline (Pinned map) */
.graph { position: relative; }
.graph svg { position: absolute; inset: 0; width: 100%; overflow: visible; pointer-events: none; }
.graph svg path { fill: none; stroke: var(--border-strong); stroke-width: 1.5; }
.graph svg path.on { stroke: color-mix(in srgb, var(--accent) 55%, var(--border-strong)); stroke-width: 1.5; }
.graph svg circle { fill: var(--canvas); stroke: var(--t-dim); stroke-width: 1.5; }
.graph svg circle.on { fill: var(--canvas); stroke: color-mix(in srgb, var(--accent) 70%, var(--border-strong)); }
.graph svg circle.sel { fill: var(--accent); stroke: var(--accent); stroke-width: 1.5; }
.grow-r { position: relative; display: block; width: 100%; text-align: left; height: 26px; border-radius: var(--r-md); padding-right: 6px; white-space: nowrap; overflow: hidden; }
.grow-r:hover { background: var(--fill-hover); }
.grow-r:has(.rav-r) { display: flex; align-items: center; gap: 6px; }
.grow-r:has(.rav-r) .gq { flex: 1; min-width: 0; }
.rav-r { margin-left: auto; }
.grow-r.on { height: auto; padding-top: 4px; padding-bottom: 4px; white-space: normal; }
.grow-r.on .gq { white-space: normal; line-height: 1.4; overflow: visible; }
.grow-r.on:has(.rav-r) { align-items: flex-start; }
.grow-r .gq { display: block; font-size: var(--fs-sm); color: var(--t-secondary); overflow: hidden; text-overflow: ellipsis; line-height: 26px; }
.grow-r.on .gq, .grp.hl .grow-r .gq { color: var(--t-heading); }
.grow-r.on .gq { font-weight: 400; }
.grow-r.sel .gq { font-weight: 500; }
.preview { margin-top: 14px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--card); box-shadow: var(--shadow); }
.preview .rq { margin: 4px 0 8px; font-size: var(--fs-base); font-weight: 600; color: var(--t-heading); line-height: 1.4; }
/* the question is already the selected row above, so the card holds only the answer; its scroll area fades out above the footer */
.preview .prose { font-size: var(--fs-sm); max-height: 260px; overflow-y: auto; margin-top: 6px; padding-bottom: 8px;
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent); }
.preview .pf { margin-top: 2px !important; }
.preview .rtext + .pf { margin-top: 3px !important; }
.preview .pf { display: flex; gap: 12px; margin-top: 8px; font-size: var(--fs-xs); color: var(--t-faint); align-items: center; }
.preview .pf .tlink { font-size: inherit; font-weight: inherit; }
.mgn .preview .composer { margin-top: 10px; }



/* replies as trees */
.replies .rtext { margin: 2px 0 0; color: var(--t-body); font-size: var(--fs-sm); line-height: 1.45; }
.rlike { display: inline-flex; align-items: center; gap: 4px; color: var(--t-muted); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.rlike svg.i { width: 12px; height: 12px; }
.bq { margin: 0 0 8px; padding: 6px 10px; border-left: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); background: var(--inset); border-radius: 0 6px 6px 0; color: var(--t-secondary); font-size: var(--fs-xs); line-height: 1.45; }
.preview .bq { margin: 8px 0 2px; }
.bq.full { max-height: 150px; overflow-y: auto; }
.bqw { position: relative; }
.bqw > .bq { padding-right: 30px; }
.bqw > .bqc { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; color: var(--t-faint); }
.bqw > .bqc svg.i { width: 12px; height: 12px; }
button.bq.bqx { display: block; width: 100%; text-align: left; cursor: pointer; font: inherit; font-size: var(--fs-xs); }
button.bq.bqx:hover { background: color-mix(in srgb, var(--accent) 8%, var(--inset)); }
.bqm { display: block; margin-top: 4px; color: var(--accent); font-weight: 500; }
.composer button.cx { width: 26px; height: 26px; padding: 0; margin-bottom: 2px; border-radius: 13px; background: none; color: var(--t-faint); }
.composer button.cx:hover { background: var(--fill-hover); color: var(--t-heading); }
#selbranch { position: absolute; z-index: 25; display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px 0 9px; border-radius: 14px; background: var(--t-heading); color: var(--canvas); font-size: var(--fs-xs); font-weight: 600; box-shadow: var(--shadow-pop, 0 4px 14px rgba(0,0,0,.18)); }
#selbranch svg.i { width: 12px; height: 12px; }
#sellook { position: absolute; z-index: 25; display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 11px 0 9px; border-radius: 14px; background: var(--t-heading); color: var(--canvas); font-size: var(--fs-xs); font-weight: 600; box-shadow: var(--shadow-pop); }
#sellook svg.i { width: 12px; height: 12px; }
/* look-up branches: the phrase, not the prompt */
.grow-r .glook { display: flex; align-items: center; gap: 5px; }
.grow-r .glook svg.i { width: 11px; height: 11px; flex: none; color: var(--t-faint); }
.lookh { display: flex; align-items: center; gap: 6px; margin: 6px 0 2px; font-size: var(--fs-sm); color: var(--t-faint); }
.lookh svg.i { width: 12px; height: 12px; }
.lookh b { color: var(--t-heading); font-weight: 600; }
button.anc { cursor: pointer; font: inherit; }
button.anc:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.prose .qsel { background: color-mix(in srgb, var(--accent) 9%, transparent); border-radius: 6px; }
.fromln { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 6px; padding: 0; color: var(--t-faint); font-size: var(--fs-xs); text-align: left; }
.fromln b { font-weight: 500; color: var(--t-secondary); }
.fromln:hover b { color: var(--accent); }
.fromln svg.i { width: 12px; height: 12px; flex: none; }
.brp { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--divider); display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.brp > .composer { align-self: stretch; margin-top: 6px; }
.brp-h { font-size: var(--fs-xs); color: var(--t-faint); margin-bottom: 2px; }
.brr { align-self: stretch; padding: 6px 0; }
.brr .pf { margin-top: 5px; }
.brr .composer { margin-top: 6px; }
.rtext { font-size: var(--fs-sm); color: var(--t-primary); line-height: 1.45; overflow-wrap: anywhere; }
.preview .rtext { max-height: 240px; overflow-y: auto; }
.rnote { font-size: var(--fs-xs); color: var(--t-faint); }
.saved-empty { grid-column: 1; padding: 24px 4px; }
/* empty states */
.estate { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 36px 24px 32px; border-radius: var(--r-xl); background: var(--card); box-shadow: var(--shadow); }
.saved-empty .estate { margin: 0; }
.estate .eic { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); }
.estate .eic svg.i { width: 18px; height: 18px; }
.estate h3 { margin: 4px 0 0; font-size: var(--fs-md); color: var(--t-heading); }
.estate p { margin: 0; max-width: 46ch; color: var(--t-secondary); font-size: var(--fs-sm); line-height: 1.5; }
.estate .btn2 { margin-top: 6px; }
.hsaved { width: 30px; height: 30px; }
.hsaved.on { background: var(--control); color: var(--t-heading); }
.hsaved.on svg.i { fill: currentColor; }
.hsv-b, .hsv-d { display: inline-flex; align-items: center; gap: 5px; }
.hsv-b svg.i { width: 14px; height: 14px; }
.hsv-b.on, .hsv-d.on { background: var(--control); color: var(--t-heading); }
.hsv-b.on svg.i, .hsv-c.on svg.i, .hsv-e.on svg.i { fill: currentColor; }
.hsv-c { position: relative; }
.hcount { position: absolute; top: 1px; right: 0; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--accent-strong); color: var(--on-accent-light); font-size: 9.5px; font-weight: 700; line-height: 14px; text-align: center; }
.hsv-e { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 9px; border-radius: 14px; color: var(--t-muted); box-shadow: inset 0 0 0 1px var(--divider); font-size: var(--fs-xs); font-weight: 600; font-variant-numeric: tabular-nums; }
.hsv-e svg.i { width: 13px; height: 13px; }
.hsv-e.has { color: var(--t-heading); }
.hsv-e.has svg.i { fill: currentColor; }
.hsv-e:hover, .hsv-e.on { background: var(--control); }
/* header round buttons: Saved and the layout toggle */
.hsv-e, .hlay { height: 30px; min-width: 30px; border-radius: 15px; justify-content: center; }
.hsv-e:not(.has) { width: 30px; padding: 0; }
.hlay { display: inline-flex; align-items: center; padding: 0; width: 30px; color: var(--t-muted); box-shadow: inset 0 0 0 1px var(--divider); }
.hlay:hover { background: var(--control); color: var(--t-heading); }
.hlay svg.i { width: 15px; height: 15px; }
@media (max-width: 520px) { .ncw .nb-dock { flex-wrap: wrap; row-gap: 6px; } .ncw .nb-dock > textarea { flex: 1 1 calc(100% - 40px); } .ncw .nb-dock > textarea + * { margin-left: 28px; } .ncw .nb-dock > .split { margin-left: auto; } }
.rtext p { margin: 2px 0; }
.rtext blockquote { margin: 4px 0; padding-left: 8px; border-left: 2px solid var(--border-strong); color: var(--t-faint); }
.mention { color: var(--accent); font-weight: 500; }
.rhid { margin-left: 6px; font-size: 10.5px; color: var(--t-faint); font-variant-numeric: tabular-nums; }
.rlike:not(:disabled):hover { color: var(--t-heading); }
.rlike.on, .iconbtn.likes.on { color: var(--bad); }
.iconbtn.rcount.on { color: var(--accent); }
.iconbtn.rcount.on svg.i { fill: none; }
.rlike.rrep.on { color: var(--t-heading); }
.rlike.on svg.i, .iconbtn.likes.on svg.i { fill: currentColor; }
.iconbtn.on:not(.likes) { color: var(--accent); }
.iconbtn.on:not(.likes):not([data-a="ask"]):not([data-a="replyopen"]) svg.i { fill: currentColor; }
.iconbtn:is([data-a="ask"], [data-a="replyopen"]).on { background: var(--fill-hover); }
.rfoot { margin-top: 8px; padding-left: 11px; }
/* short cards keep their own height instead of stretching to the side column */
.row > .card { align-self: start; }
/* a citation stays on the line of the word before it */
.prose .nw { white-space: nowrap; }
/* the usage ring's track, so it reads as a gauge */
.m-ring circle:not(.arc) { stroke: var(--border-strong); }
/* phones: the app name hides so the channel strip has room */
@media (max-width: 520px) { .appbar .brand b { display: none; } .appbar { gap: 8px; } .hsp { margin-left: 0; } }
.replies .tlink { font-size: var(--fs-xs); font-weight: 400; }
.replies .composer { margin-top: 8px; }
.preview .rtext { margin: 6px 0 2px; }
.grow-r .gq-av { display: flex; align-items: center; gap: 6px; height: 26px; }
.gq-av .gt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rav { display: inline-flex; flex: none; line-height: 1; }
.rav .av.xs { box-shadow: 0 0 0 1.5px var(--canvas); }

/* ================= membership screens ================= */
[hidden] { display: none !important; }
#app > .toast, #app > .dialog, #app > .authdlg, #app > #citepop { height: auto; }
.grow { flex: 1; }
.mockbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-bottom: 8px; }
.mk { display: inline-flex; align-items: center; gap: 6px; }
.mkl { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--t-faint); }
#shell { display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative; }
/* The app bar floats over the page and slides with a transform, so hiding it never changes the page's
   layout or scroll position (a margin change moved the page under the scroll handler and looped). */
#bar { position: absolute; top: 0; left: 0; right: 0; z-index: 30; transition: transform .2s ease; }
/* the app bar slides up out of view while the feed scrolls down, and back on any scroll up */
#bar.hid { transform: translateY(-100%); }
/* layout A: the app bar spans only the main column; alignBar() sets --bl and --bw from that column's position */
#shell.colbar #bar { left: var(--bl); right: auto; width: var(--bw); }
#shell.colbar .appbar { padding: 0 8px 0 10px; gap: 8px; border: 1px solid var(--divider); border-top: 0; border-radius: 0 0 var(--r-lg) var(--r-lg); }
#page .mg-inner { padding-top: 49px; }
#page .page-in { padding-top: calc(24px + 49px); }
#page > .page { scroll-padding-top: 49px; }
@media (prefers-reduced-motion: reduce) { #bar { transition: none; } }
#page { flex: 1; min-height: 0; position: relative; }
#shell:has(#bar.hid) .stick { top: 58px; }
#page > .mg, #page > .page { height: 100%; }

/* ---- spaces in the app bar ---- */
::selection { background: color-mix(in srgb, var(--accent) 34%, transparent); }
:root[data-theme="dark"] ::selection { background: color-mix(in srgb, var(--accent) 45%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) ::selection { background: color-mix(in srgb, var(--accent) 45%, transparent); } }
.hsp { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; margin-left: 6px; height: 100%; }
.hsp + .grow { flex: 0; }
.hsp .tabs { position: static; flex: 1; min-width: 0; padding: 0; background: none; box-shadow: none; clip-path: none; }
.hsp .tabs-s { align-items: center; }
.hsp .tabs button { padding: 4px 10px; }
.hsp .tabs .sscope { height: 28px; }
.hsp .tabs .sscope button { height: 24px; }
.hsdd { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 14px; background: var(--control); font-size: var(--fs-sm); font-weight: 600; color: var(--t-heading); }
.hsdd svg.i { width: 11px; height: 11px; color: var(--t-muted); }
.hsp > .mpick { flex: none; }
/* ---- spaces made by people: navigation directions ---- */
#page > .spshell { height: 100%; display: flex; position: relative; }
.spshell > .mg { flex: 1; min-width: 0; height: 100%; }
.tabs.tabs-min { padding: 4px 0; }
/* navs that open menus can't clip their overflow; their full-width background lives on ::before */
.tabs.tabs-dd, .tabs.tabs-dd.scrolled { box-shadow: none; clip-path: none; }
.tabs.tabs-dd::before { content: ''; position: absolute; inset: 0; z-index: -1; box-shadow: 0 0 0 100vmax var(--canvas); clip-path: inset(0 -100vmax); }
.tabs.tabs-dd.scrolled::after { content: ''; position: absolute; left: -100vmax; right: -100vmax; bottom: -1px; height: 1px; background: var(--divider); clip-path: inset(0 100vmax); }
.tabs.sp-mob { display: none; }
.lock { width: 12px; height: 12px; margin-left: 4px; color: var(--t-faint); vertical-align: -1px; flex: none; }
.spdd { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; color: var(--t-heading); font-weight: 600; font-size: var(--fs-sm); }
.spdd:hover, .spdd[aria-expanded="true"] { background: var(--fill-hover); }
.spdd svg.i { width: 12px; height: 12px; color: var(--t-muted); }
.inbar { margin-left: 2px; }
.big .spdd { height: 40px; padding: 0 12px 0 8px; font-size: 20px; letter-spacing: -.01em; border-radius: 12px; }
.big .spdd > svg.i { width: 14px; height: 14px; }
.spt-l { display: inline-flex; align-items: center; gap: 9px; }
.spt-l .glyph { width: 26px; height: 26px; border-radius: 7px; font-size: 13px; }
.spt-l > svg.i { width: 20px; height: 20px; color: var(--t-secondary); }
.spmenu { min-width: 260px; }
.spmenu .mi svg.i:first-child { width: 14px; height: 14px; color: var(--t-secondary); }
.mhd { padding: 8px 10px 2px; font-size: var(--fs-xs); color: var(--t-faint); font-weight: 600; }
.spsearch { width: 300px; }
.spq { width: calc(100% - 8px); margin: 2px 4px 6px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--control-border); background: var(--field); color: var(--t-heading); font: inherit; font-size: var(--fs-sm); }
.spq:focus { outline: none; border-color: var(--accent); }
.spfind .spdd { font-weight: 500; color: var(--t-secondary); box-shadow: inset 0 0 0 1px var(--divider); min-width: 220px; justify-content: flex-start; }
.spfind .spdd > span { flex: 1; text-align: left; color: var(--t-heading); }

.spfind .spdd > svg.i:last-child { display: none; }
/* A strip */
.tabs .gchip { display: inline-flex; align-items: center; gap: 6px; padding-left: 6px; position: relative; }
.tabs .gchip .glyph { width: 16px; height: 16px; font-size: 9px; border-radius: 4px; }
.tabs .mine { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

/* C rail */
.srail { flex: none; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; border-right: 1px solid var(--divider); background: var(--chrome); overflow-y: auto; overflow-x: hidden; z-index: 15; }

.spv-c3 > .mg { margin-left: 64px; }
.srail.xr { position: absolute; top: 0; bottom: 0; left: 0; align-items: stretch; padding: 12px 10px; transition: width .15s ease, box-shadow .15s ease; }
.srail.xr .ri { width: 100%; }

/* D sidebar */
.sside { flex: none; width: 236px; display: flex; flex-direction: column; gap: 1px; padding: 12px 10px; border-right: 1px solid var(--divider); background: var(--chrome); overflow-y: auto; }

.sgh { background: var(--control) !important; color: var(--t-secondary); }

.sn { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.sfind { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; margin-bottom: 8px; border-radius: 8px; background: var(--field); box-shadow: inset 0 0 0 1px var(--control-border); color: var(--t-faint); }

.sact { color: var(--accent); }

/* space header, browse, new space */
.sphead { display: flex; align-items: flex-start; gap: 12px; padding: 4px 2px 14px; border-bottom: 1px solid var(--divider); }

.dialog.chdlg { display: flex; flex-direction: column; gap: 12px; top: 50%; transform: translate(-50%, -50%); max-height: calc(100% - 40px); overflow: auto; overscroll-behavior: contain; }

.cedlg textarea, .rmdlg textarea { padding: 9px 12px; border-radius: var(--r-lg); border: 1px solid var(--control-border); background: var(--field); font: inherit; font-size: var(--fs-sm); color: inherit; resize: vertical; line-height: 1.45; }

<script>
/* Fullscreen hides the mock controls and the window frame, and asks the browser for real fullscreen when it allows it.
   Exit with the button that appears when the pointer reaches the top edge, Escape, or Ctrl+Shift+F. */
(() => {
  const setFs = on => {
    document.body.classList.toggle('fs', on);
    try { if (on && !document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); if (!on && document.fullscreenElement) document.exitFullscreen?.().catch(() => {}); } catch {}
    window.dispatchEvent(new Event('resize'));
  };
  document.getElementById('fs-btn').addEventListener('click', () => setFs(true));
  document.getElementById('fs-exit').addEventListener('click', () => setFs(false));
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('fs')) setFs(false); });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'f') { e.preventDefault(); setFs(!document.body.classList.contains('fs')); }
    else if (e.key === 'Escape' && document.body.classList.contains('fs') && !document.fullscreenElement && !document.querySelector('#app .menu, #app .dialog, #app .authdlg, #citepop')) setFs(false);
  });
  document.addEventListener('mousemove', e => document.body.classList.toggle('fs-peek', document.body.classList.contains('fs') && e.clientY < 36));
})();
</script>
