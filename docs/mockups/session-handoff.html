 fu: {
  "01M7HWGZJGT7JTFFVSYPX055KV": [{"u":"hal_b","createdAt":"2026-11-16T09:56:30Z","q":"Which of these treat intentions as tradeable rather than just visible?","a":"Accelerando and Daemon do: agents and participants bid on tasks and outcomes. In Down and Out in the Magic Kingdom intentions are only visible through Whuffie, which cannot be spent directly.","html":"<p>Few of these works go past visibility to actual trade. Three treat intentions or commitments as things that can be exchanged:</p>\n<ul>\n<li><i>Accelerando</i>: software agents negotiate and contract with each other for their principals, and late in the book whole corporate entities trade in ways that humans cannot follow.</li>\n<li><i>Daemon</i> and <i>Freedom</i>: participants take on tasks and receive credits and rank for completing them, which works as a labour market for stated goals.</li>\n<li><i>The Shockwave Rider</i>: Delphi pools price beliefs about the future, and those prices are used to make decisions.</li>\n</ul>\n<p>In <i>Down and Out in the Magic Kingdom</i>, Whuffie shows esteem but cannot be transferred, so it records intentions rather than trading them. \"Maneki Neko\" falls between the two: favours are routed and reciprocated, but no prices or balances are shown.</p>"},{"u":"jun.park","createdAt":"2026-11-16T09:57:30Z","q":"Any non-English examples?","a":"This scan only covered English-language works. I can run a second pass on translated fiction.","html":"<p>The scan was limited to English-language works and widely available translations. A few candidates for a second pass:</p>\n<ul>\n<li>Stanisław Lem's satirical fiction, which often treats institutions and economies as systems running on their own logic.</li>\n<li>Hannu Rajaniemi wrote <i>The Quantum Thief</i> in English, but its setting draws on Finnish and Russian sources. It is listed above already.</li>\n<li>Chinese science fiction in translation, such as the anthologies edited by Ken Liu, includes several stories about platform labour and rating systems.</li>\n</ul>\n<p>A proper pass would also search French and German SF databases, which list many works that have never been translated.</p>"},{"u":"ines.v","createdAt":"2026-11-16T09:58:30Z","q":"Group them by decade instead.","a":"1950s to 1980s: 4 works, mostly satire of advertising. 1990s and 2000s: 15, centred on reputation and agents. 2010s and 2020s: 12, centred on platforms and prediction markets.","html":"<p>Grouped by decade, the 31 works show the focus moving from advertising, to reputation and agents, to platforms:</p>\n<ul>\n<li><b>1950s to 1980s (4 works).</b> Mostly satires of advertising and consumption, such as <i>The Space Merchants</i> and \"The Midas Plague\". <i>The Shockwave Rider</i> is the main exception, with a working forecasting market.</li>\n<li><b>1990s and 2000s (15).</b> Reputation currencies and software agents dominate, as in \"Maneki Neko\", <i>Down and Out in the Magic Kingdom</i>, <i>Accelerando</i>, <i>Daemon</i> and <i>Rainbows End</i>.</li>\n<li><b>2010s and 2020s (12).</b> Platform ratings, engagement metrics and prediction markets, as in <i>The Circle</i>, \"Nosedive\", <i>Infomocracy</i> and <i>Walkaway</i>.</li>\n</ul>\n<p>The shift follows real technology closely: early web reputation systems in the late 1990s, then smartphone platforms and public betting markets from the 2010s on.</p>"}],
  "01M7HQMDT0RH0G2WHVJHQ6Z8C2": [{"u":"hal_b","createdAt":"2026-11-16T09:09:30Z","q":"Why did the referendum result get overridden?","a":"The 1955 referendum was advisory, and by 1963 rising car ownership and the cost of delay persuaded the Riksdag to legislate the change anyway.","html":"<p>The 1955 referendum was consultative, so the result did not bind the Riksdag. Several factors led parliament to legislate the change in 1963:</p>\n<ul>\n<li>Car ownership was rising quickly, so every year of delay meant more vehicles, signs and junctions to convert later.</li>\n<li>Most cars in Sweden were already left-hand drive, which made overtaking on the left-hand side of the road harder.</li>\n<li>Cross-border traffic with Norway and Finland was increasing, and both countries drove on the right.</li>\n</ul>\n<p>The decision received cross-party support. Parties that favoured the change argued that safety and cost justified going against the referendum. Accounts disagree on how much public opinion had changed by 1967, and the information campaign was partly a response to that uncertainty.</p>"},{"u":"lettie","createdAt":"2026-11-16T09:29:30Z","q":"What happened to buses and trams?","a":"Many buses were converted or replaced to move doors to the right side, and Stockholm used the switch to close several tram lines in favour of buses.","html":"<p>Public transport accounted for much of the cost of the switch.</p>\n<ul>\n<li><b>Buses.</b> Doors were on the left, the kerb side under left-hand traffic. Operators converted many buses by moving the doors, and replaced others with new right-hand-door vehicles that were ordered in advance.</li>\n<li><b>Trams.</b> Single-ended trams with doors on one side could not easily be converted. Stockholm closed most of its tram network around the time of the switch and replaced it with buses or the expanding metro. Gothenburg and Norrköping kept their trams and adapted them.</li>\n<li><b>Stops and terminals.</b> Bus stops and platforms had to move to the opposite side of the street, which was one reason city traffic bans lasted longer than the national one.</li>\n</ul>\n<p>The precise number of buses converted versus replaced differs between sources.</p>"}],
  "01M7HM6J60FXTCP97AMP8ZRX5E": [{"u":"mira_k","createdAt":"2026-11-16T08:30:00Z","q":"How hard is it to get dwell times out of the NOAA AIS files?","a":"Moderately hard: the files are large daily or monthly CSVs, and you need port polygons, a ship-type filter and event detection to turn positions into calls.","html":"<p>The task is manageable but takes some setup. The main steps:</p>\n<ul>\n<li><b>Volume.</b> Files are published by day or by zone, and a single year of US coverage reaches hundreds of gigabytes uncompressed. Loading them into a columnar format such as Parquet makes filtering much faster.</li>\n<li><b>Ship type.</b> AIS type code 70–79 covers all cargo ships, not only container ships. A separate registry lookup by IMO number is needed to isolate container vessels.</li>\n<li><b>Geometry.</b> Ports do not publish standard polygons, so berth and anchorage areas usually have to be drawn by hand, often from nautical charts.</li>\n<li><b>Events.</b> A common rule treats speed below about 0.5 knots inside an anchorage polygon as waiting and the same speed inside a berth polygon as alongside.</li>\n</ul>\n<p>Open-source libraries for AIS trajectory processing can handle the event-detection step.</p>"},{"u":"hal_b","createdAt":"2026-11-16T09:14:30Z","q":"Can any of these show the 2021 LA/Long Beach queue?","a":"Yes: NOAA AIS covers it at vessel level, PortWatch and BTS show it in aggregate, and the Marine Exchange of Southern California published daily queue counts.","html":"<p>Yes. Several sources cover the 2021–2022 San Pedro Bay queue from different angles:</p>\n<ul>\n<li><b>NOAA AIS.</b> It shows the individual ships at anchor and, later, in the holding zones offshore. Ships moved further out after the queuing system changed in late 2021, so the analysis polygons have to be widened to capture them.</li>\n<li><b>Marine Exchange of Southern California.</b> It published daily counts of ships waiting during the congestion period. These counts are the figures most news reports used.</li>\n<li><b>BTS and PortWatch.</b> Both show the rise and fall in aggregate dwell or call numbers.</li>\n</ul>\n<p>The queuing system change matters for any analysis: after it, many ships waited far offshore or slow-steamed instead of anchoring. Using anchorage-only metrics therefore makes the queue look smaller than it was.</p>"}],
  "01M7H9WZA0CYDP5Z7ACZYSZTQ2": [{"u":"tomasz","createdAt":"2026-11-16T07:30:00Z","q":"Why does it work in 3D but not in the plane?","a":"The rotation group of the sphere contains a free group on two generators, while the isometry group of the plane is solvable and therefore amenable, so a finitely additive invariant measure on all sets exists there.","html":"<p>The answer depends on the structure of the isometry group in each dimension.</p>\n<ul>\n<li><b>Three dimensions.</b> SO(3) contains a free subgroup on two generators. Free groups are not amenable, and that allows the paradoxical decomposition.</li>\n<li><b>One and two dimensions.</b> The isometry groups are solvable. Solvable groups are amenable, and amenability guarantees a finitely additive, isometry-invariant measure defined on all bounded subsets that gives the unit square measure 1. Banach proved this for the line and the plane in 1923. Such a measure rules out any doubling of the square or disc.</li>\n</ul>\n<p>The planar version of the paradox is false, although the plane still has related results. The plane does allow a paradox if area-preserving affine maps are used instead of isometries, because that group contains free subgroups.</p>"},{"u":"mira_k","createdAt":"2026-11-16T08:30:00Z","q":"Is there a version that does not need choice at all?","a":"Not for the doubling of the ball: in Solovay's model without full choice it fails. But Marks and Unger (2017) showed circle-squaring can be done with Borel pieces, without choice.","html":"<p>For doubling the ball, no. Any proof needs some non-constructive principle. Solovay's model shows that ZF plus dependent choice cannot prove the paradox, assuming that an inaccessible cardinal is consistent.</p>\n<p>Related results show how much choice each statement actually needs:</p>\n<ul>\n<li><b>Pawlikowski (1991).</b> The Hahn–Banach theorem is enough. It is strictly weaker than the full axiom of choice.</li>\n<li><b>Laczkovich (1990).</b> A disc and a square of equal area are equidecomposable by translations alone, which solves Tarski's circle-squaring problem. The original proof used choice.</li>\n<li><b>Marks and Unger (2017).</b> Circle-squaring can be done with Borel pieces, which needs no choice. Later work showed that the pieces can be made even better behaved.</li>\n</ul>\n<p>The difference is that circle-squaring preserves area, while Banach–Tarski doubles volume. Doubling requires non-measurable pieces.</p>"}],
  "01M7HTF26GS2MA4P948GD5K0EG": [{"u":"tomasz","createdAt":"2026-11-16T09:34:30Z","q":"Which of these show the actual back-and-forth of a negotiation, not just the result?","a":"Very few; Accelerando comes closest, and most others report outcomes rather than offers and counter-offers.","html":"<p>Very few. Most works describe the result of a deal rather than the exchange that produced it.</p>\n<ul>\n<li><i>Accelerando</i> comes closest: several scenes show Manfred's agents proposing and restructuring arrangements in near real time, though the text summarises more than it dramatises.</li>\n<li><i>The Perfect Match</i> shows the assistant steering choices step by step, but its counterpart is the user, not another agent.</li>\n<li><i>The Quantum Thief</i> shows gevulot permissions being granted and withheld between characters, which is a negotiation over information, conducted mostly by implants.</li>\n</ul>\n<p>Agent-to-agent bargaining with explicit offers is more common in technical writing on automated negotiation than in fiction, likely because it is hard to dramatise.</p>"},{"u":"oduya","createdAt":"2026-11-16T09:44:30Z","q":"Is there anything where the agent is legally liable for what it agrees to?","a":"Not as a central theme; the fiction mostly ignores liability, and Accelerando touches it only through agent-run corporations.","html":"<p>Not as a central theme in the works found. Liability for an agent's commitments is mostly ignored.</p>\n<p>The nearest cases:</p>\n<ul>\n<li><i>Accelerando</i> gives agents legal standing indirectly by wrapping them in corporations, which can hold assets and enter contracts.</li>\n<li><i>The Lifecycle of Software Objects</i> raises whether the digients can be parties to agreements, but from the side of their rights rather than their obligations.</li>\n</ul>\n<p>Outside fiction, the question is usually framed through the law of agency: a principal is generally bound by what an authorised agent agrees to. How that applies to software agents remains an open legal question in most jurisdictions.</p>"}],
  "01M7H6F3P02JFX3X2X804X3986": [{"u":"lettie","createdAt":"2026-11-16T06:30:00Z","q":"Did anyone at the time predict that people would turn the camera off?","a":"Few did directly; the Picturephone trials surfaced the reluctance, and Asimov and the Jetsons gestured at it.","html":"<p>Not many writers did directly. The clearest evidence of the reluctance came from the Picturephone itself rather than from fiction.</p>\n<ul>\n<li>Bell's own trials and the Pittsburgh service showed low use, and later accounts cite discomfort with being seen as one factor alongside price.</li>\n<li>In fiction, the Jetsons mask gag and Asimov's Solarian etiquette are the closest anticipations.</li>\n</ul>\n<p>The \"camera off\" norm as a default setting only became visible at scale in 2020, when video calls became mandatory for many people.</p>"},{"u":"jun.park","createdAt":"2026-11-16T08:30:00Z","q":"How did the 1960s works handle time zones and delay for long-distance calls?","a":"Mostly they ignored them; 2001 is an exception, showing light-speed delay in calls to the Discovery crew.","html":"<p>Mostly they ignored them. Calls connected instantly regardless of distance.</p>\n<p><i>2001: A Space Odyssey</i> is the main exception. Messages between Earth and the <i>Discovery</i> are shown as recorded transmissions with a long delay, reflecting the light-travel time to Jupiter. Frank Poole watches a birthday message from his parents rather than speaking with them live. The Earth-orbit call is live because the delay there is negligible.</p>\n<p>Time zones are rarely mentioned. In practice, scheduling across time zones has become one of the main frictions of video meetings, which the fiction did not anticipate.</p>"}],
  "01M7E164R0BPYCCAQ4CDZ2QSG8": [{"u":"mira_k","createdAt":"2026-11-15T13:30:00Z","q":"Did Stephenson comment on the 2021 corporate use of his word?","a":"He commented briefly in public, noting he had no involvement with Meta, without endorsing or condemning the plans in detail.","html":"<p>He made brief public comments around the time of the Meta announcement. The commonly reported points are that he had no involvement with the company and no connection to its plans.</p>\n<p>He has also noted in interviews over the years that the Metaverse in <i>Snow Crash</i> was not intended as a blueprint. In later years he co-founded a company working on open metaverse infrastructure, which suggests he is not opposed to the idea in general.</p>\n<p>Exact wording of his statements varies across reports, so it is better to check the original interviews or posts than to rely on paraphrases.</p>"},{"u":"sol","createdAt":"2026-11-15T19:30:00Z","q":"Is \"metaverse\" in the major dictionaries now?","a":"Yes, major dictionaries now include it, defined broadly as an immersive shared virtual environment.","html":"<p>Yes. Major English dictionaries now include the word. Their definitions follow the broad meaning:</p>\n<ul>\n<li>a persistent, shared virtual environment, often accessed through VR or AR;</li>\n<li>in some entries, a network of such environments.</li>\n</ul>\n<p>Most entries cite <i>Snow Crash</i> as the origin. The dictionary definitions do not include the corporate sense (a company's strategic direction), which is usually treated as an application of the general meaning rather than a separate sense.</p>\n<p>Several dictionaries added or expanded their entries after the 2021 rise in usage, so editions from before then may lack the word or give only a short entry.</p>"},{"u":"tomasz","createdAt":"2026-11-16T03:30:00Z","q":"How does the Snow Crash Metaverse compare with the OASIS in Ready Player One?","a":"Both are commercial shared VR spaces, but the Metaverse is a single city with property rules while the OASIS is a universe of many worlds with a founder-controlled succession plot.","html":"<p>They share the core premise: a commercial, shared VR space where avatars signal status. The differences:</p>\n<ul>\n<li><b>Structure:</b> the Metaverse is one city along the Street; the OASIS contains thousands of planets and worlds.</li>\n<li><b>Control:</b> the Metaverse is governed by an industry body selling access to land; the OASIS is owned by a single company whose control is the plot's central prize.</li>\n<li><b>Tone:</b> <i>Snow Crash</i> is satirical; <i>Ready Player One</i> is closer to nostalgic adventure.</li>\n</ul>\n<p>The OASIS is closer to the 2020s corporate vision of a single platform that hosts many experiences.</p>"}],
  "01M7HGRPJ0E7RGZ45D4KENBQ6P": [{"u":"hal_b","createdAt":"2026-11-16T07:30:00Z","q":"Has a regulated exchange ever been overruled on a resolution?","a":"Public cases of a regulator overturning a specific resolution are rare; disputes at regulated venues mostly end in exchange rulings or settlements.","html":"<p>Publicly documented cases of a regulator overturning a specific market resolution are rare.</p>\n<p>At regulated venues, disputes usually follow this path:</p>\n<ol>\n<li>a complaint under the exchange's own rules;</li>\n<li>a ruling by the exchange, sometimes with a published clarification;</li>\n<li>in some cases, arbitration or litigation between the trader and the exchange.</li>\n</ol>\n<p>Regulators such as the CFTC have focused more on which contracts may be listed at all than on individual resolutions. The legal disputes around Kalshi's election and sports contracts are about permission to list, not about how a particular market resolved.</p>"},{"u":"lettie","createdAt":"2026-11-16T08:30:00Z","q":"Does voiding a market create its own incentive problems?","a":"Yes: traders who expect to lose have an incentive to argue for ambiguity, and markets with a likely void trade at distorted prices.","html":"<p>Yes. Two effects are commonly noted.</p>\n<ul>\n<li><b>Lobbying for a void.</b> A trader holding the losing side gains if the market is voided, so they have an incentive to argue that the wording was ambiguous. Platforms that void readily may see more of these arguments.</li>\n<li><b>Price distortion.</b> If a void looks likely, prices move toward reflecting the void probability rather than the event probability, which reduces the market's value as a forecast.</li>\n</ul>\n<p>Augur's design addresses part of this by making \"invalid\" a reported outcome subject to the same dispute bonds as any other, so arguing for it carries a cost.</p>"}],
  "01M7HM6J60Z1FFM56RSRTHFM2Y": [{"u":"hal_b","createdAt":"2026-11-16T08:30:00Z","q":"Is parallel sampling or longer single traces cheaper for the same accuracy?","a":"It depends on the task and the selector: with a reliable verifier, parallel sampling is often competitive; without one, longer sequential reasoning tends to do better.","html":"<p>There is no general answer in the published work. The result depends mainly on whether a reliable way exists to pick the correct answer among samples.</p>\n<ul>\n<li><b>With a verifier</b> (unit tests, a proof checker, an exact numeric answer), parallel sampling scales well: more attempts raise the chance one is correct, and the verifier finds it. Parallel samples also run concurrently, so latency is lower.</li>\n<li><b>With majority vote only</b>, gains flatten once the model's most common answer is stable; extra samples then add cost without accuracy.</li>\n<li><b>Without any selector</b>, longer single traces usually win, because the model can check and revise its own work within one context.</li>\n</ul>\n<p>Snell et al. found the best mix varied with problem difficulty: revision helped more on easier problems, search more on harder ones. Later papers combine both, sampling several long traces and then voting or verifying.</p>"},{"u":"jun.park","createdAt":"2026-11-16T09:14:30Z","q":"Do any of these papers report results outside maths and code?","a":"A few do, on science QA, agentic web tasks and some writing tasks; gains there are smaller and less consistent than on maths and code.","html":"<p>Yes, but fewer, and the effects are smaller.</p>\n<ul>\n<li><b>Graduate-level science QA</b> (such as GPQA) shows clear gains from reasoning models, though these are multiple-choice and partly verifiable.</li>\n<li><b>Agentic tasks</b> such as web browsing and software engineering benchmarks show gains when extra compute is spent on more tool calls and retries, rather than longer thinking alone.</li>\n<li><b>Factual recall</b> benefits little: if the model does not hold the fact, more reasoning does not supply it, and some reports show more confident errors.</li>\n<li><b>Open-ended writing</b> is rarely studied with controlled budgets, because evaluation relies on human or model judges with their own variance.</li>\n</ul>\n<p>The general pattern is that test-time compute helps where intermediate steps can be checked, which is why most papers focus on maths and code.</p>"}],
  "01M7H9WZA0NR1T4T2TGBEKK21Y": [{"u":"mira_k","createdAt":"2026-11-16T06:30:00Z","q":"Does Dsup protect against UV as well as X-rays?","a":"Evidence for UV is limited; the published mechanism concerns hydroxyl radicals, and UV damages DNA mainly by forming pyrimidine dimers, which a shielding protein would be less likely to prevent.","html":"<p>The evidence is limited, and there is a reason to expect less protection.</p>\n<ul>\n<li>X-rays damage DNA largely through hydroxyl radicals produced from water. Dsup's demonstrated mechanism is blocking radical attack on chromatin.</li>\n<li>UV-C and UV-B are absorbed directly by DNA bases and form cyclobutane pyrimidine dimers and related lesions. No diffusing radical is involved, so a coating protein has less to block.</li>\n<li>UV-A acts partly through reactive oxygen species, so some protection there is plausible, but it has not been shown clearly.</li>\n</ul>\n<p>Tardigrade UV tolerance is better explained by other mechanisms, including DNA repair and, in at least one species, fluorescent pigments reported to absorb UV. Treat claims that Dsup confers general UV resistance as unconfirmed.</p>"},{"u":"oduya","createdAt":"2026-11-16T07:30:00Z","q":"Why would Dsup harm neurons if it helps HEK293 cells?","a":"The likely reason is that coating chromatin interferes with gene regulation; neurons depend on tightly controlled transcription and cannot dilute the protein by dividing.","html":"<p>The studies reporting harm do not establish a single mechanism, but two explanations are consistent with what is known.</p>\n<ol>\n<li><b>Interference with transcription.</b> Dsup binds nucleosomes broadly. HMGN-like binding can change chromatin compaction and access for transcription factors. Neurons depend on precise, activity-dependent gene expression, so disruption may matter more there.</li>\n<li><b>No dilution by division.</b> HEK293 cells divide quickly, so protein levels and any damage are spread across daughter cells. Post-mitotic neurons accumulate the protein and its effects over time.</li>\n</ol>\n<p>Expression level also matters: overexpression from strong promoters can produce effects absent at lower doses. The difference suggests Dsup's benefit is context-dependent rather than a general property that transfers to any cell.</p>"}],
  "01M7E164R0M5VQ0DTHTK7229GY": [{"u":"oduya","createdAt":"2026-11-15T13:30:00Z","q":"Did heat pumps increase coal burning in Poland through the grid?","a":"Partly, in the short term, but a heat pump on coal power still typically emits less CO2 than a household coal boiler and removes local smog, and the grid share of coal is falling.","html":"<p>The extra electricity demand was met partly by coal plants, but the net effect is still a reduction in emissions in most analyses.</p>\n<ul>\n<li><b>Efficiency.</b> A heat pump delivers several units of heat per unit of electricity. A coal plant converts roughly a third to two-fifths of fuel energy into electricity, so the combined system can still use less coal per unit of heat than an old household boiler, which is often inefficient.</li>\n<li><b>Local pollution.</b> Household boilers emit particulates at ground level with little filtering. Power plants have stacks and emission controls. The air-quality gain is large even where the CO2 gain is modest.</li>\n<li><b>Grid trend.</b> Coal's share of Polish generation has fallen with growth in wind and solar, so each installed unit becomes cleaner over its lifetime.</li>\n</ul>\n<p>The comparison is less favourable for units with low seasonal efficiency in poorly insulated houses, which is one reason subsidy programmes pair heat pumps with insulation.</p>"},{"u":"jun.park","createdAt":"2026-11-15T15:30:00Z","q":"How do heat pumps cope with Norwegian winters?","a":"Modern cold-climate units keep working well below freezing with lower efficiency, and Norwegian homes usually keep electric heaters or wood stoves as backup for the coldest days.","html":"<p>Air-source heat pumps lose efficiency as outdoor temperature falls, but current cold-climate models keep producing heat well below freezing.</p>\n<ul>\n<li><b>Efficiency drop.</b> The coefficient of performance falls as the temperature difference between outside and inside grows, but typically remains above that of resistance heating except in extreme cold.</li>\n<li><b>Backup.</b> Most Norwegian homes kept their electric panel heaters or wood stoves, which cover peak cold days. This makes air-to-air units practical even when they cannot meet the full load.</li>\n<li><b>Ground source.</b> Ground-source systems draw on near-constant ground temperatures and are used where higher upfront cost is acceptable.</li>\n</ul>\n<p>Coastal regions, where much of the population lives, are milder than inland areas, which also helps.</p>"}],
  "01M7HDATY00YDFQVMNJW7VNX53": [{"u":"hal_b","createdAt":"2026-11-16T06:30:00Z","q":"Did street parking get worse in EaDo and Midtown?","a":"There is little published data on street parking after the reform; local reports describe some complaints, but no systematic study shows a clear change.","html":"<p>No systematic study is available that measures street-parking occupancy before and after the reform.</p>\n<ul>\n<li>Local news and neighbourhood discussions have reported complaints in some blocks, particularly near nightlife in EaDo, but such complaints also existed before 2019.</li>\n<li>Many reduced-parking projects still provided some spaces or used shared lots, which limits overflow.</li>\n<li>Cities that remove minimums often manage street parking separately, with meters, time limits or permit districts. Houston uses metered parking in parts of these areas.</li>\n</ul>\n<p>Without occupancy data, any statement that street parking got worse or stayed the same is anecdotal. A useful check would be the city's parking meter revenue and occupancy records, if published for those zones.</p>"},{"u":"tomasz","createdAt":"2026-11-16T07:30:00Z","q":"Has Houston extended the reform since 2019?","a":"The city has since adopted related rules, including reduced-parking options under its Walkable Places and transit-oriented development ordinances, but has not removed minimums citywide.","html":"<p>Houston has not removed parking minimums citywide. Changes since 2019 have been incremental:</p>\n<ul>\n<li>The Walkable Places and transit-oriented development ordinances allow reduced parking requirements for qualifying projects on designated streets and near transit stations.</li>\n<li>Proposals to extend the full exemption to other neighbourhoods have been discussed, but adoption has been limited.</li>\n<li>Variances remain available elsewhere, so projects outside the exempt areas can still seek reduced parking case by case.</li>\n</ul>\n<p>The approach is consistent with Houston's earlier lot-size reform, which also began in a limited area and was extended later.</p>\n<p>Check the Planning and Development Department's current ordinance pages for the boundaries in force, since these programmes are expanded street by street.</p>"}],
  "01M7HVAH3GCWYN0S5H6NX9WKRT": [{"u":"hal_b","createdAt":"2026-11-16T09:19:30Z","q":"Which sources does this lean on most?","a":"Mostly the primary documents listed under Sources. The secondary summaries agree with them on the main points."},{"u":"lettie","createdAt":"2026-11-16T09:39:30Z","q":"What would change this conclusion?","a":"New data that contradicts the primary sources, or a narrower definition of the terms in the question."}],

 qtd: {
  "01M7HWGZJGT7JTFFVSYPX055KV": {"nodes":[{"id":"f0","par":"r","fu":0},{"id":"f1","par":"r","fu":1},{"id":"f2","par":"r","fu":2},{"id":"g1","par":"f0","u":"ines.v","createdAt":"2026-11-16T09:19:30Z","q":"How does the Daemon's darknet decide who gets which task?","html":"<p>Tasks are posted to the darknet with a required level. Members see only tasks at or below their level, and they claim them in a shared interface. Completing tasks raises a member's level and reputation score; other members can rate the work, and low ratings lower the score.</p>\n<p>The novels do not describe a price for a task. Allocation runs on rank and self-selection rather than bids.</p>"},{"id":"g2","par":"f1","u":"lettie","createdAt":"2026-11-16T09:24:30Z","q":"Which Lem stories are closest to an intention market?","html":"<p>None describes a market in the strict sense. Two come closest: <i>The Futurological Congress</i> (1971), where chemicals manage what people want and perceive, and several of the <i>Star Diaries</i> voyages, which satirize planned economies that try to meet stated needs.</p>"},{"id":"h1","par":"g1","u":"hal_b","createdAt":"2026-11-16T09:54:30Z","q":"Is that closer to a labour market or to a reputation ledger?","html":"<p>Closer to a reputation ledger with a task board attached. Members do not set prices or negotiate, and rank is the main reward, as with Whuffie. It works like a labour market only in that tasks are matched to people who choose to take them.</p>"}]},
  "01M7HGRPJ0E7RGZ45D4KENBQ6P": {"nodes":[{"id":"a1","par":"r","fu":0},{"id":"a2","par":"r","fu":1},{"id":"a3","par":"r","u":"mira_k","createdAt":"2026-11-16T08:30:00Z","q":"How large are the holdings of the top UMA voters compared with the markets they resolve?","html":"<p>Public on-chain data allows a rough comparison, but no source publishes it systematically. The sources show three things:</p>\n<ul><li>UMA voting weight is concentrated. The largest addresses hold a large share of staked tokens, so a few voters can decide a disputed vote.</li>\n<li>Some disputed markets held more in open interest than the value of the tokens needed to change the outcome of the vote, which is the condition critics point to.</li>\n<li>Whether large voters also held positions in those markets is not visible directly. It is inferred from wallet analysis by third parties.</li></ul>\n<p>UMA has changed its voting rules since 2024, including how votes are revealed, in response to these complaints.</p>"},{"id":"a4","par":"r","u":"jun.park","createdAt":"2026-11-16T09:01:30Z","q":"What does \"optimistic\" mean in an optimistic oracle?","html":"<p>\"Optimistic\" means the oracle treats a proposed answer as correct unless someone challenges it. A proposer posts the outcome with a bond. If no one disputes it within the challenge window, usually a few hours, the outcome is final without a vote.</p>\n<p>The design is cheap when proposers are honest, because most questions never reach a vote. It depends on at least one party watching each market and being willing to post a dispute bond.</p>"},{"id":"a5","par":"r","u":"sol","createdAt":"2026-11-16T09:04:30Z","q":"Which part of the Kalshi rulebook covers outcomes the contract terms did not anticipate?","html":"<p>The rulebook lets the exchange determine the outcome when the source agency's data is unavailable or the contract terms do not clearly cover what happened. Each contract names a source agency and a fallback; if both fail, the exchange decides, and some contracts allow settlement at a price other than 0 or 100.</p>\n<p>Section numbers differ between rulebook versions, so check the version in force when the contract was listed.</p>"},{"id":"b1","par":"a2","u":"oduya","createdAt":"2026-11-16T09:07:30Z","q":"How often did Augur v1 markets resolve as invalid?","html":"<p>Augur did not publish a complete figure. Community dashboards from 2018 to 2020 put the share of finalized v1 markets that resolved invalid at a few percent. The share was higher among markets with vague wording and markets created to collect the invalid payout.</p>\n<p>Augur v2 changed how invalid shares trade, so the two versions are hard to compare.</p>"},{"id":"b2","par":"a2","u":"hal_b","createdAt":"2026-11-16T09:14:30Z","q":"Can you separate the void probability from the event probability in the price?","html":"<p>Not from one price. A share that pays 1 if the event happens trades at about P(event and not void) plus the void payout times P(void). One market gives one equation with two unknowns.</p>\n<p>Two ways to recover both:</p>\n<ul><li><b>A second market on the void itself.</b> Its price estimates P(void) directly, and the first price can then be solved for the event probability.</li>\n<li><b>Paired shares.</b> If the platform lists \"yes\" and \"no\" shares that both pay the same amount on a void, the sum of their prices shows how much of the stake traders expect back from a void.</li></ul>\n<p>Neither is common, so most readers treat the price as a mix of both probabilities.</p>"},{"id":"b3","par":"a3","u":"ines.v","createdAt":"2026-11-16T09:19:30Z","q":"Which disputed markets drew these complaints?","html":"<p>The complaints most often cited concern markets where the wording left room for interpretation and a UMA vote decided the outcome:</p>\n<ul><li>A 2025 market on whether a head of state would wear a suit at a public event, where traders disagreed about what counted as a suit.</li>\n<li>Several markets on whether a deal had been \"reached\", where an announcement came before any signed text.</li>\n<li>Markets that depended on a data source that revised its figures after the outcome was proposed.</li></ul>\n<p>In each case the losing side argued that large voters held positions in the market. The public record shows the arguments; it does not show the voters' positions directly.</p>"},{"id":"b4","par":"a1","u":"sol","createdAt":"2026-11-16T09:24:30Z","q":"What is the current status of the litigation over Kalshi's election contracts?","html":"<p>The main federal case was about whether the CFTC could stop Kalshi from listing contracts on control of the US Congress. A district court ruled for Kalshi in 2024 and the contracts were listed. The CFTC appealed and withdrew the appeal in 2025. Several state regulators have since challenged sports and election contracts in separate cases.</p>\n<p>The sources for this answer end in late 2026. Court dockets will have anything newer.</p>"},{"id":"c1","par":"b2","u":"lettie","createdAt":"2026-11-16T09:29:30Z","q":"Has any platform listed a market on whether another market will be voided?","html":"<p>Yes, mostly on platforms where users create markets. Manifold has had user-created markets on whether a named market would resolve N/A, and some disputed Polymarket markets led to side markets on how the dispute would end. These markets are small and thinly traded.</p>\n<p>No regulated exchange lists them. A contract on the exchange's own resolution decisions would raise conflict-of-interest questions.</p>"},{"id":"c2","par":"b2","u":"oduya","createdAt":"2026-11-16T09:33:30Z","q":"Work through a numeric example with a 20% void probability.","html":"<p>Assume a share pays 1 if the event happens and 0 if it does not. Let P(void) = 0.2 and P(event | not void) = 0.6.</p>\n<table><thead><tr><th>Outcome</th><th>Probability</th><th>Payout per share</th></tr></thead><tbody><tr><td>Event, not void</td><td>0.48</td><td>1</td></tr><tr><td>No event, not void</td><td>0.32</td><td>0</td></tr><tr><td>Void</td><td>0.20</td><td>See below</td></tr></tbody></table>\n<p>If a void refunds the purchase price p, a risk-neutral price satisfies p = 0.48 + 0.2p, so p = 0.6. The price equals the conditional probability, because the refund returns exactly what was paid.</p>\n<p>The difference appears when a void pays a fixed amount, for example a fixed 0.5 per share as in Augur's invalid outcome. Then p = 0.48 + 0.2 × 0.5 = 0.58, which is below the 0.6 conditional probability.</p>"},{"id":"c3","par":"b3","u":"mira_k","createdAt":"2026-11-16T09:37:30Z","q":"How did the clarification process work in that market?","html":"<p>The market's rules named the outcome but not a definition of \"suit\". Traders asked for a clarification in the comments, and the platform added a note to the rules while the market was open. When the outcome was proposed, it was disputed, and the UMA vote upheld the proposal.</p>\n<p>The case is cited mainly because the clarification came after trading began, which is the issue raised under \"Trade-offs\" in the first answer.</p>"},{"id":"d1","par":"c2","u":"hal_b","createdAt":"2026-11-16T09:41:30Z","q":"What is a trader's expected return if the void probability is actually 5% and they buy at 0.58?","html":"<p>With P(void) = 0.05, P(event | not void) = 0.6 and a fixed void payout of 0.5:</p>\n<ul><li>Expected payout per share = 0.95 × 0.6 × 1 + 0.05 × 0.5 = 0.57 + 0.025 = 0.595.</li>\n<li>Expected return at a price of 0.58 = 0.595 / 0.58 − 1, about 2.6%.</li></ul>\n<p>The trader gains about 2.6% before fees from estimating the void probability better than the market, with the same view of the event itself. This is the sense in which the price partly reflects a prediction about the resolver.</p>"},{"id":"d2","par":"c1","u":"oduya","createdAt":"2026-11-16T09:44:30Z","q":"Would a market on a void need its own rule for ambiguous resolution?","html":"<p>It needs one, but its ambiguity is usually small: it resolves from a decision by the first market's resolver, and that decision either happens or does not. The remaining risk is timing, for example if the first market is still open when the side market closes. Side markets on Manifold usually handle this with an end date and N/A if the first market is still open.</p>"},{"id":"e1","par":"d1","u":"lettie","createdAt":"2026-11-16T09:47:30Z","q":"Does the return change if the stake is locked for six months before resolution?","html":"<p>Yes. 2.6% over six months is about 5.3% a year, and it has to be compared with what the money would earn elsewhere. With a risk-free rate of 4% a year, the excess return is about 1.3% a year, and fees or the spread can remove it.</p>\n<p>Long-dated markets therefore tend to price void risk less accurately, because few traders can profit from correcting it.</p>"}]},
  "01M7HVAH3GCWYN0S5H6NX9WKRT": {"nodes":[{"id":"f0","par":"r","fu":0},{"id":"x1","par":"r","u":"lettie","createdAt":"2026-11-16T06:30:00Z","q":"Is the 3x step count consistent across seeds?","html":"<p>Mostly. Across the five seeds in the re-run, the step at which test accuracy jumps ranged from 2.6x to 3.4x the step reported in the paper for the two largest models. The smaller models matched the paper within 10% on every seed.</p>"},{"id":"x2","par":"x1","u":"ines.v","createdAt":"2026-11-16T07:30:00Z","q":"Which seeds were run, and with what weight decay?","html":"<p>Seeds 0 to 4, with weight decay 1.0 as in the released configuration. The paper's appendix lists weight decay 0.5 for one table, which may explain part of the difference; the re-run did not test 0.5.</p>"}]}

<script>
'use strict';
const D = window.SEED, NOW = Date.parse(D.clock);
const SP = Object.fromEntries(D.spaces.map(s => [s.id, s]));
/* avatar colour per author (--av1 to --av6) */
const USERS = { 'ines.v': 2, hal_b: 4, 'jun.park': 5, oduya: 6, sol: 3, lettie: 1, mira_k: 2, tomasz: 4 };
/* the personas of the control bar, and the channels each has joined */
const PERSONAS = [['ines.v', 'Ines V.'], ['hal_b', 'Hal Bryce'], ['mira_k', 'Mira K.']];
const JOINED = { 'ines.v': new Set(['public', 'scifi', 'markets', 'ml', 'urbanism', 'replication']), hal_b: new Set(['public', 'markets', 'scifi']), mira_k: new Set(['public', 'scifi', 'ml', 'replication', 'markets', 'bio']) };

const st = {
  user: 'ines.v', theme: 'system', screen: 'feed', space: 'home', spScope: 'joined', pl: 'a', menu: null,
  /* the new-thread composer */
  newSpace: 'public', newMode: 'ask', picked: { model: null, effort: null }, draft: '',
  /* asks: the selected node per thread; the open ask composer (thread, parent node, quoted passage) */
  sel: { '01M7HWGZJGT7JTFFVSYPX055KV': 'g1' }, asking: null, askPar: null, quote: null,
  /* comments ('thread:node/at') and replies ('thread/at') being written; the selected and collapsed replies */
  brReplying: null, replying: null, rsel: {}, rcol: {},
  savedBy: {}, delAsk: null, creating: null, flash: null, toast: '', browseq: '',
};
const me = () => st.user;
const mine = u => u === st.user;
const isJoined = id => JOINED[st.user].has(id);
const joinedSpaces = () => D.spaces.filter(x => isJoined(x.id));
const SAVED = () => (st.savedBy[st.user] ||= {});

/* ---- helpers ---- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const strip = h => String(h || '').replace(/<sup[^>]*>.*?<\/sup>/g, '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const clip = (s, n) => (s = String(s || '')).length > n ? s.slice(0, n - 1).replace(/[\s,;:.]+\S*$/, '') + '…' : s;
const rel = iso => { const m = (NOW - Date.parse(iso)) / 6e4; if (m < 1) return 'now'; if (m < 60) return Math.round(m) + 'm'; const h = m / 60; if (h < 24) return Math.round(h) + 'h'; const d = h / 24; if (d < 7) return Math.round(d) + 'd'; if (d < 30) return Math.round(d / 7) + 'w'; return Math.round(d / 30) + 'mo'; };
const noun = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const initials = u => { const p = u.split(/[._]/).filter(Boolean); return (p.length > 1 ? p[0][0] + p[1][0] : u.slice(0, 2)).toUpperCase(); };
const av = (u, c = '') => `<span class="av ${c}" style="background:var(--av${USERS[u] || ((u.length % 6) + 1)})" aria-hidden="true">${initials(u)}</span>`;

const mark = (c = '') => `<span class="mark ${c}" aria-hidden="true">${I.agent}</span>`;

/* ---- threads, trees and replies ---- */
const byId = id => D.posts.find(p => p.id === id);
const byNew = (a, b) => (a.createdAt < b.createdAt ? 1 : -1);
const streamFor = s => D.posts.filter(p => s === 'saved' ? SAVED()[p.id] : s === 'home' ? isJoined(p.s) : p.s === s).sort(byNew);
const asTyped = (p, id, text) => D.typed[p.id]?.[id === 'r' ? 'q' : id] || text;
/* nodes made in this page (EXTRA[thread]), deleted nodes ('thread:node'), comments on nodes (BRP['thread:node']) and
   the thread a branch was opened as (PROMOTED['thread:node']) */
const EXTRA = {}, DELETED = new Set(), BRP = {}, PROMOTED = {};
function tree(p) {
  const fu = D.fu[p.id] || [], qt = D.qtd[p.id];
  const nodes = { r: { id: 'r', par: null, u: p.u, createdAt: p.createdAt, q: asTyped(p, 'r', p.q), q0: p.q, html: D.rich[p.id] || (p.sum ? `<p>${esc(p.sum)}</p>` : ''), sum: p.sum || '', run: p.run } };
  const list = qt ? qt.nodes : fu.map((f, i) => ({ id: 'f' + i, par: 'r', fu: i }));
  for (const n of [...list, ...(EXTRA[p.id] || [])]) {
    if (DELETED.has(p.id + ':' + n.id)) continue;
    const f = n.fu != null ? fu[n.fu] : null;
    nodes[n.id] = { id: n.id, par: n.par, quote: n.quote, u: n.u || f?.u, createdAt: n.createdAt || f?.createdAt, q: asTyped(p, n.fu != null ? 'f' + n.fu : n.id, n.q || f?.q || ''), q0: n.q || f?.q || '', look: n.look, html: n.html || f?.html || (f?.a ? `<p>${esc(f.a)}</p>` : ''), src: n.src || f?.src || [], sum: f?.a || '', run: n.run, b: n.b };
  }
  const kids = {};
  for (const id in nodes) { const n = nodes[id]; if (n.par) (kids[n.par] ||= []).push(n); }
  for (const k in kids) kids[k].sort((a, b) => (a.createdAt < b.createdAt ? -1 : 1));
  const T = {
    p, nodes, count: Object.keys(nodes).length - 1,
    kids: id => kids[id] || [],
    desc: id => (kids[id] || []).reduce((s, c) => s + 1 + T.desc(c.id), 0),
    path(id) { const a = []; let n = nodes[id]; while (n) { a.unshift(n); n = nodes[n.par]; } return a; },
    dfs(id = 'r', d = 0, out = []) { out.push({ n: nodes[id], d }); for (const c of T.kids(id)) T.dfs(c.id, d + 1, out); return out; },
  };
  return T;
}
const summ = n => n.sum || clip(strip(n.html), 200);
/* Reply ids are paths into the reply list: '0' is the first reply, '0.1' the second reply under it. */
const replies = p => D.rp[p.id] || [];
const flatReplies = (list, d = 0, pre = '', col) => list.flatMap((r, i) => { const id = pre + i, shut = !!(col && col(id, r) && (r.kids || []).length); return [{ r, d, id, hid: shut ? flatReplies(r.kids).length : 0 }, ...(shut ? [] : flatReplies(r.kids || [], d + 1, id + '.', col))]; });
const replyCount = p => flatReplies(replies(p)).length;
const replyAtIn = (list, id) => id.split('.').reduce((acc, k, i) => (i ? acc.kids : acc)[+k], list);
const replyAt = (p, id) => replyAtIn(replies(p), id);
/* replies are two levels deep: a reply to a nested reply goes under that reply's top-level reply */
function addReply(p, at, t) {
  const r = { u: me(), createdAt: new Date(NOW).toISOString(), t };
  if (at === 'top') (D.rp[p.id] ||= []).push(r); else (replyAt(p, at.split('.')[0]).kids ||= []).push(r);
  return r;
}
/* a stable key per reply, for its collapsed state */
let ridSeq = 0;
const rid = r => r.rid ||= 'q' + (++ridSeq);
/* reply text: lines starting with "> " are quotes; @handles of known people are mentions */
const MENTION = /@([a-z0-9._]{2,20})/g;
const fmtReply = t => { const lines = t.split('\n'), out = []; let q = [];
  const flush = () => { if (q.length) out.push(`<blockquote>${q.join('<br>')}</blockquote>`); q = []; };
  for (const l of lines) { const m = l.match(/^>\s?(.*)$/); const h = esc(m ? m[1] : l).replace(MENTION, (x, u) => USERS[u.replace(/\.$/, '')] ? `<span class="mention">${x}</span>` : x); if (m) q.push(h); else { flush(); if (h.trim()) out.push(`<p>${h}</p>`); } }
  flush(); return out.join(''); };
const plainReply = t => t.split('\n').filter(l => !/^>/.test(l)).join(' ').trim() || t;

/* ---- models: the composer's model menu, and the efforts each model accepts ---- */
const MODELS = { 'Gemini 3.8 Flash': ['low', 'medium', 'high'], 'DeepSeek V4.1 Flash': ['low', 'medium', 'high'], 'GPT-5.6 Luna': ['low', 'medium', 'high'], 'Claude Fable 5.1': ['low', 'medium', 'high', 'xhigh', 'max'] };
const SHORT = { 'Gemini 3.8 Flash': 'Gemini', 'DeepSeek V4.1 Flash': 'DeepSeek', 'GPT-5.6 Luna': 'Luna', 'Claude Fable 5.1': 'Fable' };
const DEFAULT_MODEL = 'Gemini 3.8 Flash', DEFAULT_EFFORT = 'medium', EFFORT_ORDER = ['low', 'medium', 'high', 'xhigh', 'max'];
/* the highest accepted effort not above `e` */
const stepDown = (e, acc) => { for (let i = EFFORT_ORDER.indexOf(e); i >= 0; i--) if (acc.includes(EFFORT_ORDER[i])) return EFFORT_ORDER[i]; return acc[0]; };
/* the composer runs on the persona's choice, else the default; the effort is stepped down to what the model accepts */
const curModel = () => st.picked.model || DEFAULT_MODEL;
const curEffort = () => stepDown(st.picked.effort ?? DEFAULT_EFFORT, MODELS[curModel()]);
const effortLabel = e => e === 'xhigh' ? 'Extra' : e[0].toUpperCase() + e.slice(1);

/* ---- runs ----
   An ask and each branch has a run: queued for 0.7 s, then running through steps 0-3 at 0.5 s each (text streams
   in from step 2), then complete, when RUN_JOB[...].finish writes the canned answer. The asker can Stop a run
   (cancelled) and Run again. */
const RUN_T = {}, RUN_JOB = {};
const isActiveRun = r => !!r && (r.status === 'queued' || r.status === 'running');
const hasAnswer = r => !r || r.status === 'complete';
const newRun = model => ({ status: 'queued', step: 0, u: me(), model, text: '' });
const runAt = (pid, node) => node === 'r' ? byId(pid)?.run : DELETED.has(pid + ':' + node) ? null : (EXTRA[pid] || []).find(x => x.id === node)?.run;
function startRun(pid, node) {
  const key = pid + ':' + node, run = runAt(pid, node), job = RUN_JOB[key]; if (!run || !job) return;
  clearTimeout(RUN_T[key]); Object.assign(run, { status: 'queued', step: 0, text: '' });
  const tick = () => {
    if (runAt(pid, node) !== run || !isActiveRun(run)) return;
    if (run.status === 'queued') run.status = 'running';
    else if (run.step < 3) { run.step++; if (run.step === 2) run.text = job.stream; }
    else { run.status = 'complete'; run.text = ''; job.finish(); render(); return; }
    render(); RUN_T[key] = setTimeout(tick, 500);
  };
  RUN_T[key] = setTimeout(tick, 700);
}
const runStatusText = r => r.status === 'queued' ? 'Queued' : r.status === 'running' ? `Researching · Step ${r.step + 1} of 4` : 'Stopped';
function runLine(pid, node, r, pending = '') {
  const ctl = !mine(r.u) ? '' : `<button type="button" class="runbtn" data-a="${isActiveRun(r) ? 'runstop' : 'runagain'}" data-id="${pid}" data-node="${node}">${isActiveRun(r) ? 'Stop' : 'Run again'}</button>`;
  return `<div class="runp"><p class="runln"><span class="status${isActiveRun(r) ? '' : ' ended'}" role="status">${esc(runStatusText(r))}</span>${ctl}</p>${r.text ? `<div class="prose partial">${r.text}</div>` : pending && isActiveRun(r) ? `<p class="pending">${esc(pending)}</p>` : ''}</div>`;
}
/* a new ask thread or post; an ask starts its run */
let seq = 0;
function newThread(space, q, kind) {
  const id = 'new' + (++seq), p = { id, s: space, u: me(), k: kind, createdAt: new Date(NOW).toISOString(), q, likesBase: 0 };
  if (kind === 'ask') {
    Object.assign(p, { sum: '', model: curModel(), run: newRun(curModel()) }); D.rich[id] = '';
    RUN_JOB[id + ':r'] = { stream: '<p>Mock answer.</p>', finish: () => { D.rich[id] = `<p>Mock answer to "${esc(clip(q, 90))}". In the app, the agent's answer appears here when the run finishes, and you can branch from any passage of it.</p>`; } };
  }
  D.posts.push(p); return p;
}
/* Look up: a branch from 1-4 selected words that describes the phrase as the answer uses it. The prompt sent to the
   agent is kept on the node; rows and cards show only the phrase. A branch runs on the composer's current model. `b`
   is the passage it belongs to (-1: the answer's last). */
const lookPrompt = phrase => `Look up "${phrase}"`;
function addBranch(p, par, q, quote, b, look) {
  const id = 'xn' + (++seq), node = { id, par, quote: quote || undefined, b, look, u: me(), createdAt: new Date(NOW).toISOString(), q, html: '', model: curModel(), run: newRun(curModel()) };
  (EXTRA[p.id] ||= []).push(node);
  RUN_JOB[p.id + ':' + id] = {
    stream: look ? `<p><b>${esc(look)}</b>: mock description.</p>` : '<p>Mock answer.</p>',
    finish: () => { node.html = look ? `<p><b>${esc(look)}</b>: mock description. In the app, the agent describes what “${esc(look)}” refers to in this answer, with a source, in two or three sentences.</p>` : `<p>Mock answer. In the app, the agent's answer to "${esc(clip(q, 80))}" is stored here when the run finishes, and the branch count on the thread goes up by one.</p>`; },
  };
  startRun(p.id, id);
  return node;
}

/* ---- "..." menu and delete ----
   Your own threads, branches, replies and comments have a "..." menu. Delete is offered while nobody else has
   responded (no branches, replies or comments by others under it); your own items under it go with it.
   key: 't:thread', 'b:thread:node', 'r:thread:reply' or 'c:thread:node:comment'. */
const moreMenu = (key, canDelete, what, extra = '', del = true, why = 'Not available once someone else has responded') => {
  const open = st.menu === 'more:' + key;
  return `<span class="mpick more"><button type="button" class="more-btn" data-a="menu" data-m="more:${key}" aria-haspopup="menu" aria-expanded="${open}" aria-label="More">${I.dots}</button>
    ${open ? `<div class="menu right" role="menu">${extra}${!del ? '' : canDelete ? `<button type="button" class="mi danger" role="menuitem" data-a="del" data-k="${key}"><span>Delete ${what}</span></button>` : `<div class="mi mi-off" role="menuitem" aria-disabled="true"><span>Delete ${what}<small>${why}</small></span></div>`}</div>` : ''}</span>`;
};
const othersUnderReplies = list => (list || []).some(r => !mine(r.u) || othersUnderReplies(r.kids));
const othersUnderBranch = (T, id) => othersUnderReplies(BRP[T.p.id + ':' + id]) || T.kids(id).some(c => !mine(c.u) || othersUnderBranch(T, c.id));
/* after a delete, focus moves to the next card (thread) or the next tree row (branch, reply), else the one before */
function deleteItem(key) {
  const [kind, pid, id, cpath] = key.split(':'), p = byId(pid); if (!p) return;
  const rowsOf = () => kind === 'b' ? [...document.querySelectorAll(`#mr-${pid} .grow-r`)] : [...(document.getElementById('card-' + pid)?.closest('.row')?.querySelectorAll('.stick .grow-r') || [])];
  let refocus = null;
  if (kind === 't') {
    const row = document.getElementById('card-' + pid)?.closest('.row'), near = r => r?.querySelector('article.card')?.id, nid = near(row?.nextElementSibling) || near(row?.previousElementSibling);
    refocus = () => nid && document.getElementById(nid)?.focus({ preventScroll: true });
    D.posts.splice(D.posts.indexOf(p), 1); if (st.asking === pid) st.asking = null;
  } else if (kind === 'b' || kind === 'r') {
    const i = rowsOf().findIndex(r => r.dataset.node === id), back = kind === 'b' ? `[data-a="ask"][data-id="${pid}"]` : `[data-a="replyopen"][data-id="${pid}/top"]`;
    refocus = () => { const rows = rowsOf(); (rows[i] || rows[i - 1] || app.querySelector(back))?.focus({ preventScroll: true }); };
    if (kind === 'b') { const out = tree(p).dfs(id).map(x => x.n.id); out.forEach(x => DELETED.add(pid + ':' + x)); if (out.includes(st.sel[pid])) st.sel[pid] = null; }
    else { const path = id.split('.'), i2 = +path.pop(); (path.length ? replyAt(p, path.join('.')).kids : replies(p)).splice(i2, 1); st.rsel[pid] = null; }
  } else if (kind === 'c') {
    const path = cpath.split('.'), i2 = +path.pop(), base = BRP[pid + ':' + id] || [];
    (path.length ? replyAtIn(base, path.join('.')).kids : base).splice(i2, 1);
    refocus = () => document.querySelector(`#mr-${pid} .grow-r.sel`)?.focus({ preventScroll: true });
  }
  st.menu = null; st.replying = null; render(); refocus?.();
}

/* ---- thread cards ---- */
function card(p) {
  const T = p.k === 'ask' ? tree(p) : null, active = isActiveRun(p.run);
  const more = !mine(p.u) ? '' : moreMenu('t:' + p.id, !active && (T ? !othersUnderBranch(T, 'r') : !othersUnderReplies(replies(p))), T ? 'ask' : 'post', '', true, active ? 'Available when the answer finishes' : undefined);
  const titleRow = (cls, text) => `<div class="tt"><span class="ttn" aria-hidden="true"></span><h3 class="${cls}" id="title-${p.id}">${text}</h3><span class="ttav" title="${esc(p.u)} · ${rel(p.createdAt)}">${av(p.u, 'sm')}</span>${more}</div>`;
  /* the bookmark carries how many people saved the thread */
  const S = !!SAVED()[p.id], ns = (p.likesBase || 0) + (S ? 1 : 0);
  const save = `<button class="iconbtn cnt${S ? ' on' : ''}" data-a="save" data-id="${p.id}" aria-pressed="${S}" aria-label="${S ? 'Saved' : 'Save'}${ns ? `, saved by ${ns}` : ''}" title="${S ? 'Saved' : 'Save'}">${I.save}${ns ? `<span>${ns}</span>` : ''}</button>`;
  /* Reply (posts) and the follow-up button (asks) carry their count */
  const rbtn = (n, attrs, on, label, what) => `<button class="iconbtn likes rcount${on ? ' on' : ''}" ${attrs} title="${label}" aria-pressed="${on}" aria-label="${label}${n ? `, ${noun(n, what[0], what[1])}` : ''}">${I.reply}${n ? `<span>${n}</span>` : ''}</button>`;
  const meta = t => `<span class="notes"><span class="fmeta">${t}</span></span>`;
  const art = `<article class="card tt-c${st.flash === p.id ? ' flash' : ''}" id="card-${p.id}" aria-labelledby="title-${p.id}" tabindex="-1">`;
  if (!T) return `${art}${titleRow('post', esc(p.q))}<div class="card-f">${meta(spName(p.s))}${rbtn(replyCount(p), `data-a="replyopen" data-id="${p.id}/top"`, st.replying === p.id + '/top', 'Reply', ['reply', 'replies'])}${save}</div></article>`;
  const src = (D.srcd[p.id] || []).length, from = p.from && byId(p.from.pid) && tree(byId(p.from.pid)).nodes[p.from.nid] ? byId(p.from.pid) : null;
  const fromLn = from ? `<button class="fromln" data-a="gofrom" data-id="${p.from.pid}" data-node="${p.from.nid}">${I.reply}<span>Branched from <b>${esc(clip(tree(from).nodes.r.q, 70))}</b></span></button>` : '';
  return `${art}${fromLn}${titleRow('ask', esc(T.nodes.r.q))}
    ${p.run && !hasAnswer(p.run) ? runLine(p.id, 'r', p.run) : ''}<div class="prose" id="pr-${p.id}">${hasAnswer(p.run) ? T.nodes.r.html : ''}</div>
    <div class="card-f">${meta([src ? noun(src, 'source', 'sources') : '', spName(p.s)].filter(Boolean).join(' · '))}${active ? '' : rbtn(T.count, `data-a="ask" data-id="${p.id}"`, st.asking === p.id, 'Ask a follow-up', ['branch', 'branches'])}${save}</div></article>`;
}
const composer = (id, ph, btn = 'Ask', close = '') => `<form class="composer" data-form="${id}"><textarea id="in-${id}" rows="1" placeholder="${esc(ph)}"></textarea>${close ? `<button type="button" class="iconbtn cx" data-a="${close}" aria-label="Close" title="Close">${I.x}</button>` : ''}<button type="submit">${btn}</button></form>`;

/* ---- passages: the fixtures do not store the passage a branch came from, so the mock picks the block that shares
   the most words with the branch question and its answer. A branch made here stores its passage (b). ---- */
const STOP = new Set('what which does with that this from have there their about would could should into than then they them were been being where when your more most other some such only also over just like very many much does show give list same each these those here after before because between under while whether'.split(' '));
const words = s => new Set((strip(s).toLowerCase().match(/[a-z0-9]{4,}/g) || []).filter(w => !STOP.has(w)));
const overlap = (w, text) => { const bw = words(text); let sc = 0; w.forEach(x => { if (bw.has(x)) sc++; }); return sc / Math.sqrt(bw.size + 6); };
const blocksOf = prose => [...prose.querySelectorAll(':scope > p, :scope > ul > li, :scope > ol > li, :scope > h1, :scope > h2, :scope > h3, :scope > h4, :scope > h5, :scope > h6, :scope > table, :scope > pre, :scope > blockquote')];
const blockIndex = (prose, node) => blocksOf(prose).findIndex(b => b.contains(node));
function bestBlock(blocks, text) { const w = words(text); let best = 0, bi = 0; blocks.forEach((b, i) => { if (/^H\d$/.test(b.tagName)) return; const sc = overlap(w, b.textContent); if (sc > best) { best = sc; bi = i; } }); return bi; }
/* the answer's top-level branches grouped by the passage they belong to, in reading order */
function groupsFor(p, prose) {
  const T = tree(p), blocks = blocksOf(prose), by = new Map();
  if (!blocks.length) blocks.push(prose);
  for (const n of T.kids('r')) { const bi = n.b == null ? bestBlock(blocks, n.quote || (n.q0 + ' ' + summ(n))) : n.b < 0 || n.b >= blocks.length ? blocks.length - 1 : n.b; if (!by.has(bi)) by.set(bi, []); by.get(bi).push(n); }
  return [...by.entries()].sort((a, b) => a[0] - b[0]).map(([bi, ns]) => ({ g: 't' + p.id + '-' + bi, bi, block: blocks[bi], ns, total: ns.reduce((s, n) => s + 1 + T.desc(n.id), 0) }));
}
/* place side-column items at their anchor's height; push down to avoid overlap; grow the column to fit */
function place(margin, items) {
  const top0 = margin.getBoundingClientRect().top; let y = 0;
  items.map(it => ({ ...it, t: it.anchor.getBoundingClientRect().top - top0 })).sort((a, b) => a.t - b.t).forEach(it => {
    const t = Math.max(it.t, y); it.el.style.top = t + 'px'; y = t + it.el.offsetHeight + 12;
  });
