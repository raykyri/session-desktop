      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="0.4" stop-color="#f8c060"/>
      <stop offset="0.8" stop-color="#fa7a45"/>
      <stop offset="1" stop-color="#d9434a"/>
    </linearGradient>
    <!-- Back face: dark rose at the fold, through magenta to violet at the tip. -->
    <linearGradient id="back" gradientUnits="userSpaceOnUse" x1="148.3" y1="76.1" x2="135.8" y2="190.6">
      <stop offset="0" stop-color="#a8265e"/>
      <stop offset="0.35" stop-color="#e2457f"/>
      <stop offset="0.75" stop-color="#b45cf0"/>
      <stop offset="1" stop-color="#8b6cf7" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Lit border along the twist-axis edge (the bright lower rim of an aurora curtain). -->
    <linearGradient id="frontEdge" gradientUnits="userSpaceOnUse" x1="62.0" y1="0.0" x2="148.3" y2="76.1">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.7" stop-color="#ffd7a0"/>
      <stop offset="1" stop-color="#ff9a80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="backEdge" gradientUnits="userSpaceOnUse" x1="148.3" y1="76.1" x2="135.8" y2="190.6">
      <stop offset="0" stop-color="#ff9ac0" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffb3d2"/>
      <stop offset="1" stop-color="#d9c4ff" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
