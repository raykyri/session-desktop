<meta charset="utf-8">
<title>Session Ramp Icons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
  /* Layout: two large icons side by side, each with its size ladder underneath; stacks on narrow screens. */
  :root {
    --bg: #e9ebf0; --ink: #151821; --muted: #5d6474;
    --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #23262f; --ink: #e8eaf0; --muted: #9aa1b2; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #23262f; --ink: #e8eaf0; --muted: #9aa1b2; color-scheme: dark; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1000px; margin: 0 auto; padding-block: 40px 64px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 40px 32px; }
  figure { margin: 0; display: grid; gap: 14px; justify-items: center; }
  figure > img { width: 100%; max-width: 440px; aspect-ratio: 1; }
  figcaption { text-align: center; display: grid; gap: 2px; }
  figcaption b { font-weight: 600; }
  figcaption span { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .ladder { display: flex; align-items: flex-end; gap: 14px; }
</style>

<div class="wrap">
  <figure>
    <img src="r30-ramp-five-color.svg" alt="Five-blade pinwheel drawn with a density ramp of characters, 30 columns">
    <figcaption><b>30 columns</b><span>5 blades · . : - = + * # % @</span></figcaption>
    <div class="ladder"><img src="r30-ramp-five-color.svg" width="128" height="128" alt=""><img src="r30-ramp-five-color.svg" width="64" height="64" alt=""><img src="r30-ramp-five-color.svg" width="32" height="32" alt=""><img src="r30-ramp-five-color.svg" width="16" height="16" alt=""></div>
  </figure>
  <figure>
    <img src="r44-ramp-five-color.svg" alt="Five-blade pinwheel drawn with a density ramp of characters, 44 columns">
    <figcaption><b>44 columns</b><span>5 blades · . : - = + * # % @</span></figcaption>
    <div class="ladder"><img src="r44-ramp-five-color.svg" width="128" height="128" alt=""><img src="r44-ramp-five-color.svg" width="64" height="64" alt=""><img src="r44-ramp-five-color.svg" width="32" height="32" alt=""><img src="r44-ramp-five-color.svg" width="16" height="16" alt=""></div>
  </figure>
</div>
