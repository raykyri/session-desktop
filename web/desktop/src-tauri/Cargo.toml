[package]
name = "session-desktop"
version = "0.1.0"
description = "Session for Mac: the spaces client with a replica on the device."
authors = ["Raymond Zhong"]
license = "MIT"
edition = "2024"

# The app's own Rust stays small (phase 3): plugin registration, the
# replica's commands (one SQLite file per person, `src/replica.rs`), the
# Keychain item, what the app tells the server about the Mac, and where
# links open. Everything else is the web client.

[lib]
name = "session_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "session-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# The replica: one connection per file, holding an exclusive lock on it
# (`src/replica.rs`); SQLite is compiled in.
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# No platform store off macOS: keyring's mock store (the app is macOS only;
# this keeps `cargo check` and the tests running on Linux).
keyring = { version = "3" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"
