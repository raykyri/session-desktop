# Fly configuration (`docs/13-deployment-fly.md` §1, §2).
#
#   fly deploy web -c web/fly.toml
#
# The positional `web` is the build context; without it flyctl hands Docker
# the repository root, where `package.json` is the desktop's.
#
# Token spending is bounded by the weekly allowance, always enforced: each
# member has SESSION_WEEKLY_TOKENS included tokens a week (reset Fridays 00:00
# UTC), a run that crosses it continues on the member's Anthropic key or on
# an overdraft of SESSION_OVERDRAFT_TOKENS per member per week, and no run
# spends more than SESSION_RUN_MAX_TOKENS (`docs/06-auth-and-users.md` §8,
# plan `03` K3, K9, L1). A member's own allowance is a `user_limits` row.
# Session is invite-only in every deployment: an account without an invite
# waits (plan `04` I4).
#
# Secrets (never here): GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET,
# SESSION_X_CLIENT_ID, SESSION_X_CLIENT_SECRET,
# GOOGLE_APPLICATION_CREDENTIALS_JSON, OPENROUTER_API_KEY, ANTHROPIC_API_KEY,
# PARALLEL_API_KEY, TAVILY_API_KEY, LITESTREAM_REPLICA_URL, AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, SESSION_METRICS_TOKEN, SESSION_SECRET_KEY,
# SESSION_CURSOR_KEY (`13` §4; back the last two up outside Fly,
# `.env.example`). SESSION_ALLOWED_GITHUB_LOGINS is unset at launch
# (`docs/runbooks/launch.md` §2.5); SENTRY_DSN is read and unused.

app = "session-dev"
primary_region = "sjc"

# Enforces sequential deploys with graceful shutdown to release persistent volume mounts and complete active streaming responses.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  NODE_ENV = "production"
  SESSION_PUBLIC_ORIGIN = "https://session.dev"
  SESSION_DATA_DIR = "/data"
  SESSION_RUNS_PER_USER = "2"
  SESSION_QUEUED_PER_USER = "20"
  SESSION_RUNS_GEMINI = "8"
  SESSION_RUNS_OPENROUTER = "8"
  SESSION_RUNS_ANTHROPIC = "2"
  SESSION_RUN_TIMEOUT_SECONDS = "900"
  SESSION_WEEKLY_TOKENS = "2000000"
  SESSION_OVERDRAFT_TOKENS = "200000"
  SESSION_RUN_MAX_TOKENS = "400000"
  SESSION_INVITES_PER_MEMBER = "3"
  SESSION_SEARCH_VENDOR = "parallel"
  GOOGLE_VERTEX_PROJECT = "session-dev"
  GOOGLE_VERTEX_LOCATION = "global"

[[mounts]]
  source = "session_data"
  destination = "/data"
  initial_size = "20gb"

[http_service]
  internal_port = 8080
  force_https = true
  # A machine that stops loses the queue it was draining and the SSE clients
  # attached to it; it stays up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 400

  # `/healthz` is 503 until migrations and run reconciliation finish and from
  # the first moment of the drain (`13` §5), so the proxy follows the boot.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[deploy]
  # Rolling deployments are not supported with dedicated single-mount volumes; the active instance must terminate before a replacement instance can mount the volume.
  strategy = "immediate"
