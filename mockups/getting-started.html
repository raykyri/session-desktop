<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>session · Getting started mockup</title>
  <style>
    @font-face { font-family: "DM Sans"; src: url("../site/fonts/DMSans-Variable-Latin.woff2") format("woff2"); font-weight: 100 900; }
    @font-face { font-family: "JetBrains Mono"; src: url("../src/assets/fonts/JetBrainsMono-Regular.woff2") format("woff2"); }
    :root {
      color-scheme: dark;
      --font-ui: "DM Sans", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      --fs-xs: 11px; --fs-sm: 12px; --fs-base: 13px; --fs-input: 14px;
      --radius-md: 6px;
      --text-primary: #e7e7e2; --text-heading: #f4f3ec; --text-muted: #8a938e; --text-subtle: #7f8884; --text-faint: #6f7773;
      --status-success-fg: #81c784; --status-attention-fg: #e0796d; --status-active-fg: #d7a84f;
      --surface-fill-subtle: rgba(255,255,255,.05); --surface-border-subtle: rgba(255,255,255,.075); --surface-border-default: rgba(255,255,255,.12);
      --control-fg-muted: #b9c0bc; --control-bg: #24282b; --control-bg-hover: #2c3134; --control-border: #3a3d3f;
      --field-bg: #111315; --panel-bg: #1b2022; --content-card-bg: #1d2224; --dialog-border: #3b4447; --research-workspace-bg: #151719; --left-pane-bg: #121516;
      --accent-color: #8fd6c7; --accent-soft: rgba(143,214,199,.13); --accent-active-bg: #243430; --focus-ring: #6cae9d;
      --transcript-code-bg: #111416;
      --dialog-shadow: 0 22px 70px rgba(0,0,0,.5);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f1112; color: var(--text-primary); font: 13px/1.45 var(--font-ui); }
    button { font: inherit; color: inherit; cursor: pointer; }
    svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

    /* mockup chrome */
    .bar { display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-bottom: 1px solid #2b2e30; flex-wrap: wrap; }
    .brand { font-weight: 650; letter-spacing: -.4px; }
    .muted { color: var(--text-muted); font-size: var(--fs-sm); }
    .tabs { display: flex; gap: 4px; }
    .tabs button, .state-toggle button { padding: 6px 10px; border: 1px solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--text-muted); font-size: var(--fs-sm); }
    .tabs button[aria-pressed="true"], .state-toggle button[aria-pressed="true"] { background: #292e30; color: var(--text-heading); }
    .state-toggle { margin-left: auto; display: flex; gap: 4px; }
    .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; max-width: 1180px; margin: 26px auto 60px; padding: 0 22px; }
    .frame-label { margin: 0 0 8px; color: var(--text-subtle); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .06em; }
    .notes { grid-column: 1 / -1; color: var(--text-subtle); font-size: var(--fs-sm); line-height: 1.6; border-top: 1px dashed #303638; padding-top: 14px; }
    .notes strong { color: var(--text-primary); font-weight: 600; }
    @media (max-width: 980px) { .stage { grid-template-columns: 1fr; } }

    /* modal frame, mirrors .settings-panel */
    .modal { display: flex; flex-direction: column; gap: 14px; width: 500px; height: 600px; margin: 0 auto; padding: 16px 16px 20px; border: 1px solid var(--dialog-border); border-radius: 10px; background: var(--panel-bg); box-shadow: var(--dialog-shadow); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; }
    .modal-head h2 { margin: 0; font-size: 15px; color: var(--text-heading); }
    .modal-close { display: grid; place-items: center; width: 27px; height: 27px; padding: 0; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--control-fg-muted); }
    .modal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 2px; }

    /* home frame, mirrors .journal-scroll / .journal-column */
    .home { height: 600px; overflow-y: auto; padding: 28px 36px 48px; border: 1px solid #2b2e30; border-radius: 10px; background: var(--research-workspace-bg); }
    .home-column { display: flex; flex-direction: column; gap: 14px; width: min(100%, 540px); }
    .launcher { padding: 12px 14px; border: 1px solid var(--surface-border-default); border-radius: 10px; background: var(--content-card-bg); color: var(--text-faint); font-size: var(--fs-input); }
    .launcher-row { display: flex; gap: 8px; margin-top: 10px; }
    .launcher-row span { padding: 4px 8px; border: 1px solid var(--control-border); border-radius: var(--radius-md); font-size: var(--fs-xs); color: var(--text-muted); }
    .journal-empty { margin: 6px 0 0; color: var(--text-subtle); font-size: 13px; }

    /* shared getting-started primitives */
    .gs { display: flex; flex-direction: column; gap: 12px; }
    .gs-intro h3 { margin: 0 0 4px; font-size: var(--fs-base); color: var(--text-heading); }
    .gs-intro p { margin: 0; color: var(--text-muted); font-size: var(--fs-sm); }
    .gs-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .ctl { display: inline-flex; align-items: center; gap: 6px; min-height: 27px; padding: 0 9px; border: 1px solid var(--control-border); border-radius: var(--radius-md); background: var(--control-bg); color: var(--control-fg-muted); font-size: var(--fs-sm); }
    .ctl:hover { background: var(--control-bg-hover); color: var(--text-primary); }
    .ctl.icon { width: 27px; padding: 0; justify-content: center; }
    .cmd { position: relative; display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 10px; border: 1px solid var(--surface-border-subtle); border-radius: var(--radius-md); background: var(--transcript-code-bg); font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--text-primary); }
    .cmd code { flex: 1 1 auto; min-width: 0; overflow-x: auto; white-space: nowrap; }
    .cmd code::before { content: "$ "; color: var(--text-faint); }
    .cmd .copy { display: grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--text-faint); }
    .cmd .copy:hover { background: var(--surface-fill-subtle); color: var(--text-primary); }
    .status { font-size: var(--fs-sm); white-space: nowrap; color: var(--status-success-fg); }
    .status.is-missing, .status.is-needsAuth { color: var(--status-attention-fg); }
    .mark { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: 10px; font-weight: 600; }
    .mark.done { background: var(--status-success-fg); color: #10261a; }
    .mark.todo { border: 1px solid var(--text-faint); color: var(--text-muted); }
    .agent-icon { width: 16px; height: 16px; border-radius: 4px; display: inline-grid; place-items: center; font-size: 9px; font-weight: 700; }
    .agent-icon.claude { background: #d97757; color: #1a0f0a; }
    .agent-icon.codex { background: #e7e7e2; color: #111; }
    .agent-icon.grok { background: #2b2b2b; color: #fff; border: 1px solid #444; }
    .step-hint { color: var(--text-muted); font-size: var(--fs-xs); }

    /* Option A: checklist */
    .a-list { overflow: hidden; border: 1px solid var(--surface-border-subtle); border-radius: var(--radius-md); background: var(--field-bg); }
    .a-card { border-top: 1px solid var(--surface-border-subtle); }
    .a-card:first-child { border-top: 0; }
    .a-summary { display: grid; grid-template-columns: 16px 16px minmax(0,1fr) auto 13px; align-items: center; width: 100%; min-height: 44px; gap: 8px; padding: 6px 10px; border: 0; background: transparent; text-align: left; }
    .a-summary:hover { background: var(--surface-fill-subtle); }
    .a-summary strong { font-weight: 600; font-size: var(--fs-base); }
    .a-summary small { display: block; color: var(--text-muted); font-size: var(--fs-xs); }
    .a-detail { display: flex; flex-direction: column; gap: 8px; padding: 2px 10px 12px 42px; }
    .a-step { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: start; }
    .a-step > .mark { margin-top: 4px; }
    .a-step-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .a-step-label { font-size: var(--fs-sm); color: var(--text-primary); }
    .a-step-label.done { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--text-faint); }
    .chev { color: var(--text-faint); }
    .a-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    /* Option B: wizard */
    .b-tabs { display: flex; gap: 4px; }
    .b-tab { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border: 1px solid var(--control-border); border-radius: var(--radius-md); background: var(--control-bg); color: var(--control-fg-muted); font-size: var(--fs-sm); }
    .b-tab[aria-selected="true"] { background: var(--accent-active-bg); border-color: var(--focus-ring); color: var(--text-heading); }
    .b-tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); }
    .b-tab .dot.done { background: var(--status-success-fg); }
    .b-panel { display: flex; flex-direction: column; gap: 14px; padding: 14px; border: 1px solid var(--surface-border-subtle); border-radius: 8px; background: var(--field-bg); }
    .b-panel-head { display: flex; align-items: center; gap: 10px; }
    .b-panel-head h4 { margin: 0; font-size: var(--fs-input); color: var(--text-heading); }
    .b-panel-head .status { margin-left: auto; }
    .b-step { display: grid; grid-template-columns: 22px 1fr; gap: 10px; }
    .b-num { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--control-border); font-size: var(--fs-xs); color: var(--text-muted); }
    .b-num.done { background: var(--status-success-fg); border-color: transparent; color: #10261a; }
    .b-num.active { border-color: var(--accent-color); color: var(--accent-color); }
    .b-step-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .b-step-body .title { font-size: var(--fs-base); }
    .b-step-body .title.done { color: var(--text-muted); }
    .b-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .b-foot .right { display: flex; gap: 6px; }
    .ctl.primary { background: var(--accent-active-bg); border-color: var(--focus-ring); color: var(--text-heading); }

    /* Option C: script */
    .c-rows { display: flex; flex-direction: column; gap: 4px; }
    .c-row { display: grid; grid-template-columns: 16px 16px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 6px 4px; }
    .c-row strong { font-weight: 600; }
    .c-row small { color: var(--text-muted); font-size: var(--fs-xs); margin-left: 6px; }
    .term { overflow: hidden; border: 1px solid var(--surface-border-subtle); border-radius: 8px; background: var(--transcript-code-bg); font-family: var(--font-mono); font-size: var(--fs-sm); }
    .term-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 6px 12px; border-bottom: 1px solid var(--surface-border-subtle); background: #0d1012; color: var(--text-muted); font-family: var(--font-ui); font-size: var(--fs-xs); }
    .term-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; }
    .term-line { display: grid; grid-template-columns: 14px 1fr 22px; align-items: center; gap: 8px; min-height: 22px; }
    .term-line .m { color: var(--text-faint); text-align: center; }
    .term-line .m.done { color: var(--status-success-fg); }
    .term-line .m.next { color: var(--accent-color); }
    .term-line code { overflow-x: auto; white-space: nowrap; }
    .term-line code.done { color: var(--text-faint); }
    .term-line .copy { display: grid; place-items: center; width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: var(--text-faint); opacity: 0; }
    .term-line:hover .copy { opacity: 1; }
    .term-comment { color: var(--text-faint); padding: 6px 0 2px 22px; }
    .term-comment:first-child { padding-top: 0; }
    .c-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header class="bar">
    <span class="brand">session</span><span class="muted">Getting started mockup</span>
    <nav class="tabs" aria-label="Options">
      <button data-option="a" aria-pressed="true">A · Checklist</button>
      <button data-option="b" aria-pressed="false">B · One agent at a time</button>
      <button data-option="c" aria-pressed="false">C · Setup script</button>
    </nav>
    <div class="state-toggle" aria-label="Machine state">
      <button data-state="fresh" aria-pressed="true">Nothing installed</button>
      <button data-state="partial" aria-pressed="false">Claude installed, not signed in</button>
      <button data-state="ready" aria-pressed="false">Claude ready</button>
    </div>
  </header>

  <main class="stage">
    <section>
      <p class="frame-label">Agents modal (500 × 600)</p>
      <div class="modal" role="dialog">
        <div class="modal-head"><h2>Agents</h2><button class="modal-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
        <div class="modal-body" data-slot="modal"></div>
      </div>
    </section>
    <section>
      <p class="frame-label">Home, empty feed (540px column)</p>
      <div class="home">
        <div class="home-column">
          <div class="launcher">Ask a research question…<div class="launcher-row"><span>Claude Code</span><span>Opus 5</span><span>Default folder</span></div></div>
          <p class="journal-empty">Research queries and saved sources appear here, newest first.</p>
          <div data-slot="home"></div>
        </div>
      </div>
    </section>
    <p class="notes" id="note"></p>
  </main>

  <script>
    const ICON = {
      copy: '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>',
      refresh: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>',
      chevDown: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
      chevRight: '<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>',
      ext: '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h6"/></svg>',
      check: '<svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>',
    };
    const AGENTS = [
      { id: 'claude', label: 'Claude Code', mark: 'C', install: 'curl -fsSL https://claude.ai/install.sh | bash', login: 'claude auth login', docs: 'docs.anthropic.com', note: 'Requires a Claude Pro, Max, Teams, or Enterprise plan.' },
      { id: 'codex', label: 'Codex', mark: 'O', install: 'curl -fsSL https://chatgpt.com/codex/install.sh | sh', login: 'codex login', docs: 'developers.openai.com', note: 'Sign in with ChatGPT or an OpenAI API key.' },
      { id: 'grok', label: 'Grok', mark: 'X', install: 'curl -fsSL https://x.ai/cli/install.sh | bash', login: 'grok login', docs: 'docs.x.ai', note: 'Review the current access requirements in the setup guide.' },
    ];
    const STATES = {
      fresh: { claude: 'missing', codex: 'missing', grok: 'missing' },
      partial: { claude: 'needsAuth', codex: 'missing', grok: 'missing' },
      ready: { claude: 'ready', codex: 'missing', grok: 'missing' },
    };
    const LABEL = { ready: 'Signed in', missing: 'Not installed', needsAuth: 'Sign in' };
    const NOTES = {
      a: '<strong>A · Checklist.</strong> One expandable card per agent, using the same list pattern as the dedicated Agents dialog. Each card holds two ordered steps (install, sign in) with a copyable command; completed steps stay visible but struck through so the user can see progress. Cards for agents that are not ready expand by default; ready agents collapse to one row. This option scales to more agents; the Home version reads as a compact checklist under the empty-state line.',
      b: '<strong>B · One agent at a time.</strong> Agent chips act as a stepper; the panel shows only the selected agent with numbered steps, the command for the current step, and Next agent / Refresh status. Fewer commands on screen at once, so it is the least overwhelming for first-run. The selected agent can advance after a status refresh reports it as ready. This option costs more clicks to show the complete status and needs selected-agent state.',
      c: '<strong>C · Setup script.</strong> A status row per agent, then a single terminal-styled block that lists every command in order with a done / next marker per line, plus Copy all for users who want to paste the whole sequence. Closest to the README quickstart pattern; densest and quickest for experienced users, and the Home version fits in the least vertical space. Least guided: no per-step explanation beyond the comment lines.<br><br>References: t3code (WelcomeWizard.tsx) uses per-agent cards with a Ready / Install / Sign in status and a copyable <code>$ command</code> block; paseo (provider-catalog-list.tsx) uses a status-dot row per provider with an external install link and no inline commands. All three options keep commands inline and copyable since Session has no embedded terminal for this flow.',
    };

    const hash = location.hash.slice(1).split('.');
    let option = ['a', 'b', 'c'].includes(hash[0]) ? hash[0] : 'a';
    let state = hash[1] in STATES ? hash[1] : 'fresh';

    const icon = (a) => `<span class="agent-icon ${a.id}">${a.mark}</span>`;
    const cmd = (text) => `<div class="cmd"><code>${text}</code><button class="copy" title="Copy">${ICON.copy}</button></div>`;
    const mark = (done) => `<span class="mark ${done ? 'done' : 'todo'}">${done ? ICON.check : ''}</span>`;
    const readyCount = (s) => AGENTS.filter((a) => s[a.id] === 'ready').length;

    function intro(s) {
      const n = readyCount(s);
      const heading = n === 0 ? 'Set up an agent' : `${n} of ${AGENTS.length} agents ready`;
      const body = n === 0
        ? 'Research requires at least one supported agent CLI installed and signed in on this Mac. Complete the steps for an agent, then refresh its status.'
        : 'Set up agents to make them available for research.';
      return `<div class="gs-head"><div class="gs-intro"><h3>${heading}</h3><p>${body}</p></div><button class="ctl icon" title="Refresh agent status">${ICON.refresh}</button></div>`;
    }

    function renderA(s) {
      const cards = AGENTS.map((a) => {
        const r = s[a.id];
        const open = r !== 'ready';
        const installed = r !== 'missing';
        const signed = r === 'ready';
        return `<section class="a-card">
          <button class="a-summary" aria-expanded="${open}">
            ${mark(signed)}${icon(a)}
            <span><strong>${a.label}</strong><small>${installed ? (signed ? 'v2.1.4 · ready for research' : 'v2.1.4 · sign in to continue') : a.note}</small></span>
            <span class="status is-${r}">${LABEL[r]}</span>
            <span class="chev">${open ? ICON.chevDown : ICON.chevRight}</span>
          </button>
          ${open ? `<div class="a-detail">
            <div class="a-step">${mark(installed)}<div class="a-step-body"><span class="a-step-label ${installed ? 'done' : ''}">Install the CLI</span>${installed ? '' : cmd(a.install)}</div></div>
            <div class="a-step">${mark(signed)}<div class="a-step-body"><span class="a-step-label ${signed ? 'done' : ''}">Sign in</span>${signed ? '' : cmd(a.login)}</div></div>
          </div>` : ''}
        </section>`;
      }).join('');
      return `<div class="gs">${intro(s)}<div class="a-list">${cards}</div><div class="a-foot"><span class="step-hint">Run each command in Terminal, then refresh the status.</span><button class="ctl">${ICON.ext}<span>Setup guides</span></button></div></div>`;
    }

    function renderB(s) {
      const current = AGENTS.find((a) => s[a.id] !== 'ready') ?? AGENTS[0];
      const r = s[current.id];
      const installed = r !== 'missing';
      const signed = r === 'ready';
      const tabs = AGENTS.map((a) => `<button class="b-tab" aria-selected="${a.id === current.id}"><span class="dot ${s[a.id] === 'ready' ? 'done' : ''}"></span>${a.label}</button>`).join('');
      return `<div class="gs">${intro(s)}<div class="b-tabs">${tabs}</div>
        <div class="b-panel">
          <div class="b-panel-head">${icon(current)}<h4>${current.label}</h4><span class="status is-${r}">${LABEL[r]}</span></div>
          <div class="b-step"><span class="b-num ${installed ? 'done' : 'active'}">${installed ? ICON.check : '1'}</span><div class="b-step-body"><span class="title ${installed ? 'done' : ''}">Install the CLI</span>${installed ? '' : cmd(current.install) + `<span class="step-hint">${current.note}</span>`}</div></div>
          <div class="b-step"><span class="b-num ${signed ? 'done' : installed ? 'active' : ''}">${signed ? ICON.check : '2'}</span><div class="b-step-body"><span class="title ${signed ? 'done' : ''}">Sign in</span>${installed && !signed ? cmd(current.login) : ''}</div></div>
          <div class="b-step"><span class="b-num ${signed ? 'active' : ''}">3</span><div class="b-step-body"><span class="title">Refresh status</span>${signed ? '<span class="step-hint">Ready for research. Select this agent from the agent menu on Home.</span>' : ''}</div></div>
          <div class="b-foot"><button class="ctl">${ICON.ext}<span>Setup guide</span></button><div class="right"><button class="ctl">Next agent</button><button class="ctl primary">${ICON.refresh}<span>Refresh status</span></button></div></div>
        </div></div>`;
    }

    function renderC(s) {
      const rows = AGENTS.map((a) => `<div class="c-row">${mark(s[a.id] === 'ready')}${icon(a)}<span><strong>${a.label}</strong>${s[a.id] === 'missing' ? '' : '<small>v2.1.4</small>'}</span><span class="status is-${s[a.id]}">${LABEL[s[a.id]]}</span></div>`).join('');
      let nextFound = false;
      const lines = AGENTS.flatMap((a) => {
        const r = s[a.id];
        const items = [
          { text: a.install, done: r !== 'missing' },
          { text: a.login, done: r === 'ready' },
        ].map((l) => {
          const next = !l.done && !nextFound;
          if (next) nextFound = true;
          return `<div class="term-line"><span class="m ${l.done ? 'done' : next ? 'next' : ''}">${l.done ? '✓' : next ? '›' : '·'}</span><code class="${l.done ? 'done' : ''}">${l.text}</code><button class="copy" title="Copy">${ICON.copy}</button></div>`;
        });
        return [`<div class="term-comment"># ${a.label} — ${a.note}</div>`, ...items];
      }).join('');
      return `<div class="gs">${intro(s)}<div class="c-rows">${rows}</div>
        <div class="term"><div class="term-head"><span>Run in Terminal, top to bottom</span><button class="ctl" style="min-height:22px;padding:0 7px">${ICON.copy}<span>Copy all</span></button></div><div class="term-body">${lines}</div></div>
        <div class="c-foot"><span class="step-hint">Agent status refreshes when this window regains focus.</span><button class="ctl">${ICON.ext}<span>Setup guides</span></button></div></div>`;
    }

    const RENDER = { a: renderA, b: renderB, c: renderC };

    function paint() {
      const s = STATES[state];
      const html = RENDER[option](s);
      document.querySelector('[data-slot="modal"]').innerHTML = html;
      document.querySelector('[data-slot="home"]').innerHTML = html;
      document.getElementById('note').innerHTML = NOTES[option];
      document.querySelectorAll('[data-option]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.option === option)));
      document.querySelectorAll('[data-state]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.state === state)));
      history.replaceState(null, '', `#${option}.${state}`);
    }
    document.querySelectorAll('[data-option]').forEach((b) => b.addEventListener('click', () => { option = b.dataset.option; paint(); }));
    document.querySelectorAll('[data-state]').forEach((b) => b.addEventListener('click', () => { state = b.dataset.state; paint(); }));
    document.addEventListener('click', (event) => {
      const button = event.target.closest('.copy');
      if (!button) return;
      const text = button.parentElement.querySelector('code')?.textContent ?? '';
      navigator.clipboard?.writeText(text).catch(() => undefined);
      button.innerHTML = ICON.check;
      setTimeout(() => { button.innerHTML = ICON.copy; }, 1200);
    });
    paint();
  </script>
</body>
</html>
