<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>qmux · Research recap mockup</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #151719; color: #dedfdf; font-size: 15px; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; cursor: pointer; }
    .bar { min-height: 58px; border-bottom: 1px solid #2b2e30; display: flex; align-items: center; gap: 18px; padding: 12px 26px; flex-wrap: wrap; }
    .brand { font-weight: 650; letter-spacing: -.5px; margin-right: 8px; }
    .muted { color: #898f92; font-size: 12px; }
    .tabs { display: flex; gap: 5px; flex-wrap: wrap; }
    .tabs button, .state { border: 1px solid transparent; border-radius: 6px; color: #9fa5a8; background: transparent; padding: 7px 11px; font-size: 12px; }
    .tabs button[aria-pressed="true"] { background: #292e30; color: #e8eaea; }
    button:hover { color: white; background: #292e30; }
    button:focus-visible { outline: 2px solid #a2c6ba; outline-offset: 3px; }
    main { max-width: 790px; margin: 58px auto 90px; padding: 0 30px; }
    .eyebrow { display: flex; justify-content: space-between; align-items: center; color: #929a9d; font-size: 12px; margin-bottom: 22px; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #91b6a5; margin-right: 6px; }
    .prompt { padding: 17px 20px; border-radius: 9px; border: 1px solid #303537; background: #1d2224; color: #e8eaea; line-height: 1.6; margin-bottom: 30px; }
    .answer { line-height: 1.8; letter-spacing: .005em; }
    .answer p { margin: 0 0 18px; }
    .answer h2 { font-size: 17px; letter-spacing: -.2px; margin: 26px 0 12px; color: #eeefef; }
    strong { font-weight: 600; color: #eeefef; }
    em { color: #c6cbcd; }
    .recap { margin: 0 0 28px; font-size: 14px; font-style: italic; font-weight: 400; line-height: 1.75; color: #929a9d; }
    footer { display: flex; align-items: center; gap: 13px; margin-top: 19px; color: #818b90; font-size: 11px; }
    .actions { margin-left: auto; display: flex; gap: 6px; }
    .icon { display: grid; place-items: center; padding: 5px; border: 0; border-radius: 4px; color: #929b9e; background: none; }
    svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    .notes { margin-top: 46px; border-top: 1px dashed #303638; padding-top: 16px; color: #7e898e; font-size: 12px; line-height: 1.6; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) { main { margin-top: 28px; padding: 0 21px; } .bar { padding: 12px 18px; gap: 10px; } .bar > .muted { margin-left: auto; } .tabs { width: 100%; } }
  </style>
</head>
<body>
  <header class="bar">
    <span class="brand">qmux</span><span class="muted">Research recap mockup</span>
    <nav class="tabs" aria-label="Example answers">
      <button data-example="books" aria-pressed="true">Book recommendations</button>
      <button data-example="safety" aria-pressed="false">AI safety</button>
      <button data-example="short" aria-pressed="false">Short answer</button>
    </nav>
  </header>
  <main>
    <div class="eyebrow"><span>Research <span aria-hidden="true"> / </span> <span id="topic"></span></span><span><i class="dot"></i>Complete</span></div>
    <div id="prompt" class="prompt"></div>
    <article aria-label="Research answer">
      <p id="recap" class="recap" aria-live="polite"></p>
      <div id="answer" class="answer"></div>
      <footer><span id="count"></span><span>·</span><span id="duration"></span><div class="actions"><button class="icon" id="copy" aria-label="Copy answer and summary" title="Copy answer and summary"><svg viewBox="0 0 20 20"><rect x="7" y="7" width="10" height="11" rx="2"/><path d="M12 7V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></svg></button></div></footer>
    </article>
    <div class="notes"><span id="note"></span> <button id="loading" class="state">Preview “Writing summary…”</button></div>
  </main>
  <script>
    const examples = {
      books: {
        topic: 'Writers to read next',
        prompt: 'Which essayists and authors should I read if I like thoughtful, personal writing about how to live?',
        duration: '42s',
        answer: `<p>I’d start with writers who move between personal experience and bigger questions about attention, ambition, relationships, and the stories we tell about ourselves.</p>
          <h2>Essayists and newsletters</h2>
          <p><strong>Henrik Karlsson</strong>, who writes <em>Escaping Flatland</em>, and <strong>Sasha Chapin</strong> are good starting points for exploratory writing about creativity, learning, and building a life. They often make the process of thinking feel like part of the subject.</p>
          <p>For personal writing with a sharper cultural lens, try <strong>Haley Nahman</strong> at <em>Maybe Baby</em>, <strong>Rayne Fisher-Quann</strong>, and <strong>Jasmine Sun</strong>. Add <strong>Celine Nguyen</strong> for essays that connect design, culture, and the internet. <strong>Heather Havrilesky</strong> is especially worth trying if you want emotional candor and advice with a distinctive voice.</p>
          <h2>Books to spend more time with</h2>
          <p>For close observation and an interest in how a self takes shape, look at <strong>Rachel Cusk</strong>, <strong>Sheila Heti</strong>, and <strong>Annie Ernaux</strong>. Their approaches differ, so I’d sample a few pages before choosing where to start.</p>
          <p><strong>Jia Tolentino</strong> is a natural next stop for cultural criticism; <strong>Maggie Nelson</strong> for writing that brings personal experience into conversation with ideas. Pick whichever voice makes you want to keep reading, rather than treating this as a reading list to complete.</p>`,
        recap: 'Henrik Karlsson from Escaping Flatland, Sasha Chapin, Haley Nahman from Maybe Baby, Celine Nguyen, Jasmine Sun, Rayne Fisher-Quann, Heather Havrilesky. And authors: Rachel Cusk, Sheila Heti, Annie Ernaux, Jia Tolentino, Maggie Nelson.'
      },
      safety: {
        topic: 'Automating interpretability research',
        prompt: 'How could an automated AI researcher help with alignment, and what would that leave unresolved?',
        duration: '1m 18s',
        answer: `<p>One possible route is an automated AI researcher that adapts interpretability methods to progressively larger and more capable models. It would work one or two capability rungs at a time: taking techniques that already produce useful evidence, finding where they fail, and designing experiments to extend them.</p>
          <h2>Why this might be tractable</h2>
          <p>Parts of interpretability research are relatively verifiable. A researcher can make a prediction about a model’s internal computation, intervene on the relevant component, and test whether the predicted behavior changes. That gives an automated system a feedback loop for some of its work, even when a complete theory is missing.</p>
          <p>The difficult step is moving beyond isolated experiments. The system would need <strong>long-horizon research ability</strong> to pursue a question across many attempts, <strong>self-verification</strong> to catch misleading results, and <strong>taste</strong> to choose questions whose answers actually matter. Producing more experiments alone would not establish that these abilities are present.</p>
          <h2>What it would leave unresolved</h2>
          <p>Alignment itself may not be defined precisely enough for experimental progress to translate into a convincing safety claim. An explanation of a model’s behavior in one setting does not automatically establish what it will do under different conditions.</p>
          <p>And even a successful technical program would address only part of the risk. It would not by itself solve institutional incentives, political conflict, or gradual human disempowerment. Those require separate arguments and interventions alongside better tools for understanding models.</p>`,
        recap: 'Automated AI researcher that scales up interpretability methods to larger models, one or two capability rungs at a time; possible because parts of the problem are relatively verifiable. Requires long-horizon research ability, self-verification, and taste. Risks: alignment possibly not well defined; only handles technical, not institutional, political, or gradual-disempowerment risks.'
      },
      short: {
        topic: 'Where to start',
        prompt: 'Which one should I start with?',
        duration: '6s',
        answer: `<p>Start with <strong>Henrik Karlsson’s Escaping Flatland</strong> if you want reflective essays about creativity and how to live. Read a couple of essays first; if you prefer a more intimate, emotionally direct voice, try <strong>Heather Havrilesky</strong> next.</p>`,
        recap: ''
      }
    };
    const MIN_RECAP_CHARS = 800;
    let active = 'books';
    let pending = false;
    const el = id => document.getElementById(id);
    function render() {
      const data = examples[active];
      el('topic').textContent = data.topic;
      el('prompt').textContent = data.prompt;
      el('answer').innerHTML = data.answer;
      const plain = el('answer').textContent.replace(/\s+/g, ' ').trim();
      const eligible = [...plain].length >= MIN_RECAP_CHARS;
      el('recap').hidden = !eligible;
      el('recap').textContent = pending ? 'Writing summary…' : 'Summary: ' + data.recap;
      el('count').textContent = plain.split(/\s+/).length + ' words';
      el('duration').textContent = data.duration;
      el('note').textContent = `Mockup · ${[...plain].length.toLocaleString()} answer characters · ${eligible ? 'Summary shown at 800+ characters.' : 'Below 800 characters, so no summary is generated.'}`;
      el('loading').hidden = !eligible;
      el('loading').textContent = pending ? 'Show completed summary' : 'Preview “Writing summary…”';
      document.querySelectorAll('[data-example]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.example === active)));
    }
    document.querySelectorAll('[data-example]').forEach(button => button.addEventListener('click', () => { active = button.dataset.example; pending = false; render(); }));
    el('loading').addEventListener('click', () => { pending = !pending; render(); });
    el('copy').addEventListener('click', async () => {
      const text = (!el('recap').hidden && !pending ? el('recap').innerText + '\n\n' : '') + el('answer').innerText;
      try { await navigator.clipboard.writeText(text); el('copy').title = 'Copied'; }
      catch { el('copy').title = 'Clipboard unavailable in this browser'; }
    });
    render();
  </script>
</body>
</html>
